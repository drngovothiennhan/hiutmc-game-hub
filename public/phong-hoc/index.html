 cố tim mạch hoặc thuốc khác. Theo YHCT, triệu chứng tăng khi tức giận và thiếu ngủ gợi yếu tố tình chí, nhưng chưa đủ xác lập chứng âm hư nền.","luoc_qua_co_quan":"Thần kinh có chóng mặt, đau đầu thái dương và mất ngủ, không yếu liệt, nói khó hoặc nhìn đôi; khám không có dấu khu trú. Tim mạch không đau ngực, tim đều; hô hấp không khó thở, phổi bình thường. Tiêu hóa có miệng đắng, táo bón; tiết niệu có tiểu vàng, chưa có đạm niệu; cơ xương khớp chưa được khai thác. YHCT có cáu gắt, mặt mắt đỏ, lưỡi đỏ rêu vàng mỏng và mạch huyền sác.","tom_tat":"Nữ 58 tuổi, tăng huyết áp 8 năm, dùng amlodipin không đều và ăn mặn, đến khám vì chóng mặt, đau đầu thái dương, cáu gắt và ngủ kém trong vài ngày. Huyết áp hai tay 168/102 và 166/100 mmHg, khám thần kinh không khu trú, tim phổi bình thường; điện tâm đồ ghi nhận dày thất trái nhẹ, cholesterol toàn phần 6,2 mmol/L, chức năng thận bình thường và chưa có đạm niệu. Không đau ngực, khó thở, yếu liệt, nói khó hoặc nhìn đôi. Mặt mắt đỏ, miệng đắng, lưỡi đỏ rêu vàng mỏng và mạch huyền sác phù hợp can dương thượng cang theo phân loại ca.","dat_van_de":"Huyết áp tăng kéo dài chưa kiểm soát, kèm đau đầu, chóng mặt, rối loạn giấc ngủ và dấu gợi ảnh hưởng tim mạn tính, chưa ghi nhận tổn thương cơ quan đích cấp. Chứng trạng YHCT gồm dương khí nghịch lên với đầu đau, mắt đỏ, cáu gắt và mạch huyền sác; phần hư nền cần bổ sung dữ kiện.","bien_luan":"Tiền sử và huyết áp hai tay phù hợp tăng huyết áp chưa kiểm soát, được phân độ 2 theo hệ phân độ dùng trong ca; không có bằng chứng hiện tại về tổn thương cơ quan đích cấp nên không xác lập cấp cứu tăng huyết áp. Đột quỵ hoặc bệnh não do tăng huyết áp ít gợi ý vì không có dấu khu trú hay rối loạn ý thức, nhưng cần chụp não nếu xuất hiện dấu báo động; chóng mặt tiền đình và nguyên nhân đau đầu khác vẫn cần khai thác, không quy mọi triệu chứng cho huyết áp. Cần đo lại đúng kỹ thuật, theo dõi huyết áp tại nhà, cân nhắc siêu âm tim xác nhận dày thất trái và định lượng albumin niệu; khảo sát nguyên nhân thứ phát khi có dấu gợi ý. YHCT thuộc Huyễn vựng, Lý–Thực kiêm Hư, bản hư tiêu thực, thể Can dương thượng cang; pháp bình can tiềm dương, tư âm phối hợp với kiểm soát huyết áp hiện đại.","sinh_ly_benh":"Tăng sức cản mạch và rối loạn điều hòa tuần hoàn duy trì huyết áp cao, gây tái cấu trúc mạch và tăng gánh thất trái theo thời gian. Bỏ quên thuốc và ăn mặn góp phần làm huyết áp không được kiểm soát; chóng mặt và đau đầu không có tính đặc hiệu cho mức huyết áp. Theo YHCT, can dương thượng cang gây các biểu hiện ở đầu, mắt và tình chí, còn nền âm hư cần được kiểm chứng thêm.","tien_luong":"Gần: tương đối thuận lợi vì chưa có tổn thương cơ quan đích cấp, nhưng cần theo dõi đáp ứng sau điều chỉnh điều trị. Xa: nguy cơ đột quỵ, suy tim và bệnh thận tăng nếu tiếp tục không kiểm soát; dấu dày thất trái và cholesterol tăng cần được đánh giá. Theo YHCT, triệu chứng có thể giảm khi điều hòa tình chí và giấc ngủ, song vẫn phải theo dõi huyết áp và tổn thương cơ quan.","du_phong":"Uống thuốc đều theo đơn, giảm muối, vận động phù hợp, ngủ đủ và ghi nhật ký huyết áp để mang khi tái khám. Phối hợp YHCT nhằm hỗ trợ triệu chứng và điều hòa tình chí, không tự ngừng thuốc hạ áp. Tái khám theo lịch sau điều chỉnh thuốc; cấp cứu khi yếu liệt, nói khó, đau ngực, khó thở hoặc thay đổi ý thức."},"nguon":["European Society of Cardiology, Guidelines for the Management of Elevated Blood Pressure and Hypertension, 2024.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"yeu-thong","title":"Đau thắt lưng sau dầm mưa","kind":"Ngoại","level":"Trung bình","group":"cxk","place":"Phòng châm cứu","clock":"14:00","name":"Anh Phạm Văn Tuấn","age":38,"sex":"nam","intro":"Khoa Châm cứu, giường 5. Anh là thợ xây, đau thắt lưng 3 ngày sau khi làm việc dưới mưa lạnh.","vitals":{"hr":76,"sbp":125,"dbp":80,"rr":16,"t":36.7,"spo2":99},"ask":[["Đau từ khi nào, sau việc gì?","Đau 3 ngày, sau buổi làm việc dưới mưa. Tuần trước có bê vật nặng.","e"],["Tính chất đau, chườm ấm hay trời lạnh thì sao?","Đau nặng, lạnh, cứng. Trời lạnh ẩm đau tăng, chườm ấm đỡ.","e"],["Có lan xuống chân, tê hay yếu chân không?","Không lan, không tê, không yếu chân.","e"],["Có rối loạn tiểu tiện hoặc tê vùng yên ngựa không?","Không.","e"],["Có sốt, sụt cân, đau đêm không đỡ không?","Không sốt, không sụt cân. Đau giảm khi nằm nghỉ.","e"],["Ăn ngủ, đại tiểu tiện?","Ăn ngủ bình thường, đại tiểu tiện bình thường.","n"]],"exam":[["K","Dáng đi, tầm vận động","Dáng đi cứng, nghiêng nhẹ. Cúi và ngả lưng hạn chế vì đau.","n"],["K","Sờ nắn cột sống thắt lưng","Co cứng cơ cạnh sống hai bên, ấn đau vùng L4–L5. Không có điểm đau chói gai sống.","e"],["K","Lasègue, phản xạ, lực cơ","Lasègue âm tính. Phản xạ gân xương bình thường. Lực cơ 5/5.","e"],["V","Lưỡi","Chất lưỡi nhạt, rêu trắng nhớt.","e"],["T","Mạch","Mạch trầm, khẩn.","e"],["T","Sờ vùng thắt lưng","Vùng thắt lưng lạnh, sờ vào cơ căng cứng.","n"]],"tests":[["X-quang cột sống thắt lưng",10,"Thoái hóa nhẹ. Không gãy, không trượt đốt sống.","n"],["Công thức máu, CRP",10,"Trong giới hạn bình thường.","n"],["MRI cột sống thắt lưng",40,"Không có chỉ định ở đợt đau cấp đầu tiên khi chưa có dấu hiệu báo động.","w"]],"opt":{"ydx":["+Đau thắt lưng cấp do co cứng cơ (không đặc hiệu)","Thoát vị đĩa đệm chèn ép rễ","Hội chứng đuôi ngựa","Viêm cột sống dính khớp","Sỏi thận"],"bd":["+Yêu thống","Hành tý","Nuy chứng","Lâm chứng"],"bc":["+Thực – Hàn (bệnh ở kinh lạc, cơ nhục)","Lý – Hư – Hàn","Lý – Thực – Nhiệt","Biểu – Hư"],"the":["+Hàn thấp (phong hàn thấp) trở lạc","Thận hư yêu thống","Thấp nhiệt","Huyết ứ"],"phap":["+Tán hàn trừ thấp, ôn kinh thông lạc","Bổ thận cường yêu","Thanh nhiệt lợi thấp","Hoạt huyết hóa ứ"],"phuong":["+Can khương Linh truật thang (Thận trước thang)","~Độc hoạt tang ký sinh thang","Thân thống trục ứ thang","Tứ diệu hoàn","Lục vị địa hoàng hoàn"],"huyet":["+Thận du","+Đại trường du","+Ủy trung","+A thị huyệt","+Yêu dương quan","Hợp cốc","Nội quan","Đản trung","Thái xung"]},"actions":["+Giác hơi hoặc cứu ngải vùng thắt lưng|10|Ôn kinh tán hàn, giảm co cứng.","+Hướng dẫn giữ ấm, tránh mưa lạnh|2|Phòng tái phát.","+Hướng dẫn vận động nhẹ, tránh bê vác nặng|2|Vận động sớm tốt hơn nằm lâu.","+Thuốc giãn cơ hoặc giảm đau ngắn ngày nếu cần|1|Hỗ trợ giảm đau cấp.","+Xoa bóp, day ấn huyệt nhẹ nhàng|5|Giảm co cứng cơ.","-Hẹn chụp MRI để chắc chắn|2|Không cần thiết ở ca không có dấu hiệu báo động.","!Nắn chỉnh cột sống mạnh, xoay cưỡng bức|3|Nguy cơ làm nặng thêm tổn thương.","!Nằm bất động tuyệt đối 2 tuần|2|Kéo dài đau, teo cơ.","!Chỉ định phẫu thuật ngay|5|Không có chỉ định."],"teach":"Ca này dạy ba điều: loại trừ dấu hiệu báo động (đuôi ngựa, sốt, sụt cân, yếu liệt), nhận ra phong hàn thấp qua bệnh sử dầm mưa, đau nặng lạnh, chườm ấm đỡ, và chọn pháp ôn kinh tán hàn thay cho bổ thận vì đây là đợt cấp ở người trẻ.","hbu":{"tien_su":"Làm nghề thợ xây, có bê vật nặng tuần trước và làm việc dưới mưa lạnh trước khi đau. Chưa có dữ kiện về bệnh cột sống trước đây, chấn thương rõ, bệnh nền, thuốc, dị ứng hoặc tiền sử gia đình. Theo YHCT, phơi lạnh ẩm là yếu tố khởi phát phù hợp, chưa có căn cứ xác định thận hư nền.","luoc_qua_co_quan":"Cơ xương khớp có đau, cứng thắt lưng và hạn chế vận động; thần kinh không đau lan, tê hoặc yếu chân, lực cơ và phản xạ bình thường. Tiết niệu không rối loạn tiểu tiện, không tê vùng yên ngựa; tiêu hóa, ăn ngủ và đại tiện bình thường. Không sốt, không sụt cân; tim mạch và hô hấp chưa được mô tả khám chi tiết. YHCT có đau tăng khi lạnh ẩm, giảm khi chườm ấm, vùng lưng lạnh, rêu trắng nhớt và mạch trầm khẩn.","tom_tat":"Nam 38 tuổi, thợ xây, đau thắt lưng 3 ngày sau làm việc dưới mưa lạnh, trước đó có bê vật nặng, đau tăng khi lạnh ẩm và giảm khi nghỉ hoặc chườm ấm. Khám co cứng cơ cạnh sống hai bên, ấn đau L4–L5, hạn chế cúi và ngả lưng; Lasègue âm tính, lực cơ 5/5, phản xạ bình thường, không đau chói gai sống. Không đau lan, yếu chân, rối loạn tiểu tiện, tê yên ngựa, sốt hoặc sụt cân; X-quang không gãy hay trượt đốt sống, công thức máu và CRP bình thường. Lưỡi nhạt rêu trắng nhớt, mạch trầm khẩn và lưng lạnh phù hợp hàn thấp trở lạc.","dat_van_de":"Đau thắt lưng cấp kiểu cơ học kèm co cứng cơ và hạn chế vận động, chưa có hội chứng rễ hoặc dấu báo động thần kinh, nhiễm trùng, ác tính. Chứng trạng YHCT gồm đau nặng lạnh, tăng khi lạnh ẩm, giảm khi ấm, gợi hàn thấp bế trở kinh lạc và cơ nhục.","bien_luan":"Đau khu trú, co cứng cơ, tăng theo vận động và giảm khi nghỉ phù hợp đau thắt lưng cấp không đặc hiệu do co cứng cơ; thoái hóa nhẹ trên X-quang không đủ chứng minh là nguyên nhân chính. Thoát vị đĩa đệm gây chèn ép rễ và hội chứng đuôi ngựa ít gợi ý vì không đau lan, Lasègue âm tính, lực cơ bình thường và không rối loạn cơ tròn hay tê yên ngựa. Gãy đốt sống, nhiễm trùng và ác tính ít gợi ý theo khám, X-quang và xét nghiệm hiện có; chưa cần MRI thường quy, nhưng phải khảo sát khi xuất hiện dấu báo động hoặc diễn tiến không phù hợp. YHCT thuộc Yêu thống, Thực–Hàn, bệnh ở kinh lạc và cơ nhục, thể Hàn thấp/Phong hàn thấp trở lạc; pháp tán hàn trừ thấp, ôn kinh thông lạc, chưa có căn cứ lấy bổ thận làm pháp chính.","sinh_ly_benh":"Quá tải cơ và mô mềm vùng thắt lưng có thể gây đau và co cơ phản xạ, tạo vòng xoắn đau–co cứng–hạn chế vận động. Lạnh có thể làm tăng cảm giác cứng và khó chịu nhưng không chứng minh một tổn thương cấu trúc cụ thể. Theo YHCT, hàn thấp bế trở kinh lạc, khí huyết vận hành không thông gây đau, hàn co rút và thấp gây cảm giác nặng.","tien_luong":"Gần: thuận lợi vì không có thiếu sót thần kinh hoặc dấu báo động, thường cải thiện với vận động phù hợp và điều trị triệu chứng. Xa: có thể tái phát nếu tiếp tục bê vác quá sức hoặc tư thế lao động không phù hợp. Theo YHCT, giữ ấm và loại bỏ yếu tố lạnh ẩm có thể hỗ trợ giảm triệu chứng, nhưng cần đánh giá lại nếu đau kéo dài.","du_phong":"Duy trì vận động nhẹ, tránh nằm bất động kéo dài, tạm giảm bê vác nặng và học kỹ thuật nâng vật phù hợp. Theo YHCT, giữ ấm, thay quần áo ướt, tránh lạnh ẩm; giác hơi, cứu ngải và xoa bóp cần thực hiện đúng kỹ thuật để tránh tổn thương da. Tái khám nếu không cải thiện hoặc đau tái diễn; khám cấp cứu khi yếu chân, bí tiểu, mất kiểm soát đại tiểu tiện, tê yên ngựa hoặc sốt."},"nguon":["NICE, Low Back Pain and Sciatica in Over 16s: Assessment and Management, NG59, 2016, cập nhật 2020.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"thong-phong","title":"Sưng đỏ ngón chân cái sau tiệc","kind":"Nội Đông Tây y","level":"Trung bình","group":"cxk","place":"Phòng khám Nội","clock":"08:30","name":"Ông Đỗ Văn Lợi","age":48,"sex":"nam","intro":"Phòng khám Nội, giường 3. Ông đi tập tễnh, kể nửa đêm đau dữ dội ngón chân cái bàn chân phải, đến sáng sưng đỏ.","vitals":{"hr":90,"sbp":140,"dbp":90,"rr":18,"t":37.9,"spo2":98},"ask":[["Đau khớp nào, bắt đầu khi nào, đau thế nào?","Ngón cái chân phải, nửa đêm đau dữ dội, không chịu nổi cả tấm drap chạm vào.","e"],["Gần đây ăn uống gì?","Dự tiệc hôm qua, uống nhiều bia, ăn hải sản, nội tạng.","e"],["Tiền sử gút, bệnh thận, thuốc đang dùng?","Một cơn tương tự cách đây một năm. Đang dùng hydrochlorothiazide trị huyết áp.","e"],["Tiền sử loét dạ dày, dị ứng thuốc?","Từng loét dạ dày 3 năm trước.","e"],["Có sốt, khớp nào khác sưng không?","Sốt nhẹ, chỉ đau một khớp.","e"],["Tiểu tiện, đại tiện?","Nước tiểu vàng sẫm, táo.","n"],["Có chấn thương khớp gần đây không?","Không.","n"]],"exam":[["V","Quan sát khớp","Khớp bàn ngón chân cái phải sưng, đỏ bóng, căng.","e"],["K","Sờ nắn khớp","Nóng, đau chói khi chạm, không hạn chế vận động các khớp khác.","e"],["V","Lưỡi","Chất lưỡi đỏ, rêu vàng nhớt.","e"],["T","Mạch","Mạch hoạt, sác.","e"],["V","Thể trạng","Thể trạng béo, mặt đỏ.","n"],["K","Tìm hạt tophi, khám tim phổi","Không thấy hạt tophi. Tim phổi bình thường.","n"]],"tests":[["Acid uric máu",10,"520 µmol/L.","e"],["Công thức máu, CRP",10,"Bạch cầu 12.500, CRP 48 mg/L.","e"],["Creatinin, độ lọc cầu thận",10,"eGFR 78. Chức năng thận còn tốt.","e"],["Chọc hút dịch khớp, soi tinh thể urat",15,"Tinh thể hình kim, lưỡng chiết âm tính.","n"],["Cấy máu",20,"Chưa có kết quả, không trì hoãn điều trị.","n"],["MRI khớp bàn chân",40,"Không có chỉ định ở cơn điển hình.","w"]],"opt":{"ydx":["+Cơn gút cấp (viêm khớp do tinh thể urat)","Viêm khớp nhiễm khuẩn","Viêm khớp dạng thấp","Giả gút","Chấn thương phần mềm"],"bd":["+Thống phong","+Lịch tiết phong","Hành tý","Nuy chứng"],"bc":["+Lý – Thực – Nhiệt","Biểu – Thực – Hàn","Lý – Hư – Hàn","Lý – Hư – Nhiệt"],"the":["+Thấp nhiệt uẩn kết","Phong hàn thấp tý","Đàm ứ tý trở","Can thận lưỡng hư"],"phap":["+Thanh nhiệt lợi thấp, thông lạc chỉ thống","Tán hàn trừ thấp","Bổ ích can thận","Hóa đàm hoạt huyết"],"phuong":["+Tứ diệu hoàn gia giảm","~Bạch hổ gia quế chi thang","Độc hoạt tang ký sinh thang","Can khương Linh truật thang","Lục vị địa hoàng hoàn"],"huyet":["+Đại đô","+Thái bạch","+Âm lăng tuyền","+Thái xung","+Khúc trì","Quan nguyên","Mệnh môn","Thận du","Cao hoang"]},"actions":["+Dùng colchicine liều thấp hoặc corticoid ngắn ngày|1|Ưu tiên vì tiền sử loét dạ dày, tránh kháng viêm không steroid.","+Nghỉ ngơi, kê cao chân, chườm lạnh quanh khớp|2|Giảm sưng đau.","+Uống nhiều nước, bỏ bia rượu, hải sản, nội tạng|2|Giảm acid uric, tránh cơn tái phát.","+Rà soát thuốc lợi tiểu thiazid đang dùng với bác sĩ điều trị tăng huyết áp|2|Thiazid làm tăng acid uric.","+Châm thanh nhiệt, chích nặn máu nhẹ tại Đại đô, Thái xung|5|Hỗ trợ giảm sưng nóng, không thay thuốc cắt cơn.","-Bắt đầu thuốc hạ acid uric ngay giữa cơn mà không che chắn kháng viêm|1|Nên cắt cơn trước, thuốc hạ acid uric bắt đầu sau khi dịu và có dự phòng cơn.","-Kháng sinh tĩnh mạch kéo dài|3|Chưa có bằng chứng nhiễm khuẩn khớp.","!Dùng kháng viêm không steroid liều cao (diclofenac)|1|Có tiền sử loét dạ dày, nguy cơ chảy máu tiêu hóa.","!Chườm nóng, cứu ngải trực tiếp tại khớp đang sưng nóng|3|Làm nhiệt tăng thêm, sai thể thấp nhiệt."],"teach":"Cơn gút cấp cắt cơn trước, hạ acid uric sau. Hỏi tiền sử loét dạ dày và thuốc lợi tiểu thiazid thay đổi lựa chọn thuốc. Thể thấp nhiệt khác phong hàn thấp: sưng nóng đỏ, lưỡi đỏ rêu vàng nhớt, mạch hoạt sác, kỵ cứu nóng. Sốt nhẹ một khớp luôn cần nghĩ đến viêm khớp nhiễm khuẩn.","hbu":{"tien_su":"Có một cơn đau khớp tương tự cách đây một năm, tăng huyết áp đang dùng hydrochlorothiazide và tiền sử loét dạ dày ba năm trước. Chưa có dữ kiện về bệnh thận, dị ứng thuốc, tiền sử gia đình hoặc điều trị YHCT trước đây.","luoc_qua_co_quan":"Tim phổi khám bình thường; có táo bón và nước tiểu vàng sẫm, chưa có dữ kiện về triệu chứng tiết niệu khác hoặc thần kinh. Chỉ khớp bàn ngón chân cái phải sưng đau, các khớp khác không hạn chế vận động; lưỡi đỏ, rêu vàng nhớt và mạch hoạt sác là chứng trạng YHCT nổi bật.","tom_tat":"Nam 48 tuổi, đau dữ dội khớp bàn ngón chân cái phải khởi phát nửa đêm sau tiệc có nhiều bia và thức ăn giàu purin, từng có cơn tương tự và đang dùng thiazid. Khớp sưng nóng đỏ, đau chói, nhiệt độ 37,9°C, acid uric 520 µmol/L, bạch cầu 12.500, CRP 48 mg/L và dịch khớp có tinh thể hình kim lưỡng chiết âm tính; không có chấn thương hoặc hạt tophi. Lưỡi đỏ, rêu vàng nhớt, mạch hoạt sác phù hợp chứng trạng thấp nhiệt.","dat_van_de":"Viêm một khớp cấp với sưng nóng đỏ, đau dữ dội và phản ứng viêm toàn thân nhẹ. Có tiền căn cơn tương tự, dùng lợi tiểu thiazid và loét dạ dày ảnh hưởng lựa chọn xử trí. Chứng trạng YHCT gồm khớp nóng đỏ, táo bón, tiểu vàng sẫm, lưỡi đỏ rêu vàng nhớt và mạch hoạt sác.","bien_luan":"Cơn gút cấp được củng cố bởi vị trí khớp điển hình, khởi phát đột ngột, tiền căn tái diễn và đặc biệt là tinh thể urat trong dịch khớp; tăng acid uric hỗ trợ nhưng không tự xác định chẩn đoán. Viêm khớp nhiễm khuẩn vẫn cần loại trừ vì có sốt và tăng chỉ số viêm: đề nghị nhuộm Gram, cấy dịch khớp, theo dõi kết quả cấy máu vì tinh thể không loại trừ đồng nhiễm khuẩn. Viêm khớp do tinh thể calci pyrophosphat ít phù hợp với hình thái tinh thể đã ghi nhận, còn chấn thương ít nghĩ do không có tiền sử tương ứng. Theo các khóa YHCT của ca, bệnh danh Thống phong, bát cương Lý–Thực–Nhiệt, thể thấp nhiệt uẩn kết, pháp thanh nhiệt lợi thấp, thông lạc chỉ thống; cách gọi thể cần đối chiếu giáo trình.","sinh_ly_benh":"Tinh thể monosodium urat trong khớp kích hoạt đáp ứng viêm, thu hút bạch cầu trung tính gây sưng nóng đỏ và đau dữ dội. Thiazid có thể giảm thải urat, trong khi bia rượu và thức ăn giàu purin góp phần làm tăng urat. Theo lý luận YHCT của ca, thấp nhiệt uẩn kết làm trở trệ kinh lạc, khí huyết không thông gây đau.","tien_luong":"Gần thường thuận lợi nếu kiểm soát viêm và loại trừ nhiễm khuẩn, nhưng tiền sử loét dạ dày cần được cân nhắc khi điều trị. Xa có nguy cơ tái phát, tổn thương khớp và hình thành tophi nếu tăng urat kéo dài. Theo YHCT, cần đánh giá lại chứng trạng thấp nhiệt sau khi cơn cấp giảm.","du_phong":"Tránh bia rượu, hạn chế thức ăn giàu purin, kiểm soát cân nặng và uống nước phù hợp tình trạng tim thận. Tái khám để theo dõi urat, đánh giá nhu cầu điều trị lâu dài và rà soát thiazid với bác sĩ, không tự ngừng thuốc huyết áp. Đến viện ngay nếu sốt tăng, khớp đau sưng tiến triển hoặc toàn trạng xấu; không tự chích nặn máu hay dùng thuốc YHCT."},"nguon":["American College of Rheumatology, 2020 Guideline for the Management of Gout.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo YHCT, kết hợp YHCT với YHHĐ, tập I, Quyết định 5013/QĐ-BYT, 2020, mục Gout (Thống phong)."],"status":"draft"},{"id":"truong-ung","title":"Đau bụng từ quanh rốn xuống hố chậu phải","kind":"Ngoại Đông Tây y","level":"Trung bình","group":"ngoai","place":"Phòng cấp cứu","clock":"15:00","name":"Anh Lê Hoàng Phúc","age":22,"sex":"nam","intro":"Phòng cấp cứu, 15:00. Anh đau bụng 14 giờ, ban đầu quanh rốn, sau chuyển xuống hố chậu phải, chán ăn, nôn.","vitals":{"hr":100,"sbp":118,"dbp":74,"rr":18,"t":38.2,"spo2":99},"ask":[["Đau bắt đầu ở đâu, có di chuyển không?","Bắt đầu quanh rốn, sau 6 đến 8 giờ chuyển xuống hố chậu phải, đau tăng khi đi lại hoặc ho.","e"],["Có chán ăn, buồn nôn, nôn không?","Chán ăn, nôn 2 lần.","e"],["Có sốt không?","Sốt khoảng 38 độ.","n"],["Đại tiện, tiểu tiện thế nào?","Táo nhẹ, không tiêu chảy. Tiểu bình thường, không buốt.","e"],["Tiền sử bệnh, phẫu thuật bụng?","Không có.","n"],["Đã dùng thuốc gì?","Uống 1 viên paracetamol, đỡ ít.","n"]],"exam":[["K","Ấn bụng hố chậu phải","Đau điểm McBurney, phản ứng thành bụng khu trú.","e"],["K","Các dấu hiệu viêm ruột thừa","Blumberg dương tính, Rovsing dương tính.","e"],["K","Co cứng thành bụng lan tỏa?","Không có, chưa có dấu viêm phúc mạc lan tỏa.","e"],["V","Lưỡi","Chất lưỡi đỏ, rêu vàng dày nhớt.","e"],["T","Mạch","Mạch hoạt, sác.","e"],["M","Hơi thở, phân","Hơi thở hôi, đại tiện táo.","n"]],"tests":[["Công thức máu",10,"Bạch cầu 15.800, trung tính 85%.","e"],["CRP",10,"62 mg/L.","e"],["Siêu âm bụng",10,"Ruột thừa 9 mm, thành dày, không xẹp, có dịch quanh. Chưa thấy áp xe.","e"],["CT bụng",30,"Xác nhận viêm ruột thừa, chưa có áp xe hay thủng.","n"],["Tổng phân tích nước tiểu",10,"Bình thường.","n"],["Chụp đại tràng cản quang",30,"Không có chỉ định, có thể nguy hiểm khi nghi viêm ruột thừa.","w"]],"opt":{"ydx":["+Viêm ruột thừa cấp (chưa biến chứng)","Sỏi niệu quản phải","Viêm hạch mạc treo","Viêm dạ dày ruột","Viêm túi thừa Meckel"],"bd":["+Trường ung","Phúc thống đơn thuần","Lỵ","Tiết tả"],"bc":["+Lý – Thực – Nhiệt","Biểu – Thực – Hàn","Lý – Hư – Hàn","Lý – Hư – Nhiệt"],"the":["+Thấp nhiệt uẩn kết","Khí trệ huyết ứ (giai đoạn sớm)","Nhiệt độc thịnh (đã có mủ)","Tỳ vị hư hàn"],"phap":["+Thanh nhiệt giải độc, thông phủ tiết nhiệt, hoạt huyết tiêu ung","Ôn trung kiện tỳ","Sơ can lý khí","Bổ khí ích huyết"],"phuong":["+Đại hoàng mẫu đơn thang","Lý trung hoàn","Tiểu kiến trung thang","Ngân kiều tán","Bổ trung ích khí thang"],"huyet":["+Lan vĩ huyệt","+Thiên khu","+Túc tam lý","+Thượng cự hư","+Khúc trì","Quan nguyên","Mệnh môn","Thận du","Đại chùy"]},"actions":["++Nhịn ăn uống, lập đường truyền, giảm đau theo y lệnh|2|Chuẩn bị phẫu thuật, giữ ổn định.","++Hội chẩn ngoại khoa, chuẩn bị cắt ruột thừa|3|Viêm ruột thừa cấp có chỉ định can thiệp sớm.","+Kháng sinh tĩnh mạch theo phác đồ trước mổ|2|Giảm nhiễm khuẩn quanh mổ.","+YHCT hỗ trợ sau mổ: Đại hoàng mẫu đơn thang gia giảm, châm Túc tam lý, Thiên khu|5|Hồi phục nhu động ruột, giảm đau sau mổ.","!Cho thuốc nhuận tràng, thuốc xổ|2|Làm tăng nguy cơ thủng ruột thừa.","!Chườm nóng lên bụng|2|Làm viêm tiến triển nhanh.","!Chỉ dùng thuốc thang, theo dõi tại nhà, không mổ|5|Có nguy cơ thủng, viêm phúc mạc. YHCT không thay thế phẫu thuật ở giai đoạn này.","!Châm cứu cắt cơn đau thay phẫu thuật|10|Che lấp diễn tiến, chậm xử trí ngoại khoa."],"teach":"Viêm ruột thừa cấp điển hình là chỉ định ngoại khoa. YHCT gọi là Trường ung, thể thấp nhiệt, bài Đại hoàng mẫu đơn thang, nhưng vai trò chính nằm ở hỗ trợ sau mổ hoặc ở thể nhẹ có theo dõi sát. Bác sĩ YHCT trực phải nhận ra ca cần mổ, không giữ bệnh nhân ở lại bằng thuốc thang.","hbu":{"tien_su":"Không có tiền sử bệnh hoặc phẫu thuật bụng theo dữ kiện đã khai thác; đã uống một viên paracetamol nhưng giảm đau ít. Chưa có thông tin dị ứng thuốc, tiền sử gia đình hoặc điều trị YHCT trước đây.","luoc_qua_co_quan":"Tiêu hóa có chán ăn, nôn hai lần, táo nhẹ, không tiêu chảy; tiểu tiện bình thường, không buốt. Chưa có dữ kiện lược qua tim mạch, hô hấp, thần kinh và cơ xương khớp. Hơi thở hôi, lưỡi đỏ rêu vàng dày nhớt và mạch hoạt sác là chứng trạng YHCT đã ghi nhận.","tom_tat":"Nam 22 tuổi, đau bụng 14 giờ, khởi đầu quanh rốn rồi chuyển hố chậu phải sau 6–8 giờ, kèm chán ăn, nôn hai lần và sốt 38,2°C. Khám đau McBurney, phản ứng thành bụng khu trú, Blumberg và Rovsing dương tính; bạch cầu 15.800, trung tính 85%, CRP 62 mg/L, siêu âm và CT xác nhận viêm ruột thừa chưa thủng hoặc áp xe. Không có co cứng bụng lan tỏa, tiêu chảy hoặc tiểu buốt; lưỡi đỏ, rêu vàng nhớt, mạch hoạt sác.","dat_van_de":"Đau bụng cấp di chuyển từ quanh rốn đến hố chậu phải, kèm hội chứng nhiễm trùng và kích thích phúc mạc khu trú. Chưa có dấu viêm phúc mạc lan tỏa. Chứng trạng YHCT gồm đau bụng, sốt, táo bón, hơi thở hôi, lưỡi đỏ rêu vàng nhớt và mạch hoạt sác.","bien_luan":"Viêm ruột thừa cấp chưa biến chứng phù hợp với diễn tiến đau di chuyển, dấu khám khu trú, tăng chỉ số viêm và hình ảnh ruột thừa 9 mm không xẹp, được CT xác nhận. Viêm dạ dày ruột ít phù hợp do không tiêu chảy và có kích thích phúc mạc khu trú; sỏi niệu quản ít phù hợp do không tiểu buốt, nước tiểu bình thường, nhưng các dấu này riêng lẻ không loại trừ hoàn toàn. Viêm hồi tràng hoặc hạch mạc treo có thể gây đau tương tự nhưng hình ảnh hiện có ưu tiên tổn thương ruột thừa; đề nghị rà soát mô tả CT và hoàn tất đánh giá trước mổ theo ngoại khoa. Theo khóa YHCT, bệnh danh Trường ung, bát cương Lý–Thực–Nhiệt, thể thấp nhiệt uẩn kết, pháp thanh nhiệt giải độc, thông phủ tiết nhiệt, hoạt huyết tiêu ung; không để biện chứng trì hoãn xử trí ngoại khoa.","sinh_ly_benh":"Viêm ruột thừa gây đau tạng quanh rốn lúc đầu, sau đó đau khu trú hố chậu phải khi phúc mạc thành bị kích thích. Phù nề và phản ứng viêm có thể tiến triển đến thiếu máu thành, hoại tử hoặc thủng; chưa xác định nguyên nhân khởi phát cụ thể trong ca này. Theo lý luận YHCT đã gán cho ca, thấp nhiệt và khí huyết trở trệ tại trường phủ gây đau, sốt và táo bón.","tien_luong":"Gần thuận lợi nếu xử trí kịp thời vì chưa ghi nhận thủng hoặc áp xe, nhưng có thể tiến triển nếu chậm can thiệp. Xa thường tốt sau điều trị, cần theo dõi biến chứng sau mổ. Chứng trạng YHCT phải được đánh giá lại sau phẫu thuật, không mặc nhiên giữ nguyên thể bệnh trước mổ.","du_phong":"Không có biện pháp sinh hoạt bảo đảm ngăn ngừa viêm ruột thừa; cần đi khám sớm khi đau bụng tăng, khu trú hố chậu phải hoặc kèm sốt. Sau mổ, chăm sóc vết thương, ăn uống và vận động theo hướng dẫn ngoại khoa, tái khám đúng hẹn. Không tự dùng thuốc tẩy hoặc thuốc YHCT để xử trí đau bụng cấp; hỗ trợ YHCT sau mổ cần được bác sĩ đánh giá."},"nguon":["WSES, Diagnosis and Treatment of Acute Appendicitis: 2025 Edition of the WSES Jerusalem Guidelines, công bố năm 2026.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo YHCT, kết hợp YHCT với YHHĐ, tập I, Quyết định 5013/QĐ-BYT, 2020, nguyên tắc phối hợp đối với bệnh cấp tính và ngoại khoa."],"status":"draft"},{"id":"soc-phan-ve-thuoc","title":"Nổi mẩn, khó thở sau tiêm thuốc","kind":"Cấp cứu","level":"Trung bình","group":"capcuu","place":"Phòng cấp cứu","clock":"15:40","name":"Chị Lê Thị Hoa","age":34,"sex":"nữ","intro":"Phòng tiêm của trạm y tế đưa chị vào lúc 15:40. Mười phút trước chị được tiêm kháng sinh do viêm họng, sau đó nổi mẩn khắp người, khó thở, chóng mặt, suýt ngất.","vitals":{"hr":128,"sbp":70,"dbp":40,"rr":28,"t":36.8,"spo2":88},"ask":[["Chị tiêm thuốc gì, cách đây bao lâu?","Thuốc kháng sinh tiêm bắp, khoảng 10 phút trước.","e"],["Triệu chứng bắt đầu thế nào?","Ngứa khắp người, nổi mẩn, tức ngực, thở rít, chóng mặt.","e"],["Trước đây có dị ứng thuốc hay thức ăn không?","Chưa biết dị ứng thuốc nào, hay nổi mề đay khi ăn hải sản.","e"],["Có đau bụng, buồn nôn, tiêu chảy không?","Có đau quặn bụng và buồn nôn.","n"],["Có tiền sử hen, bệnh tim không?","Không hen, không bệnh tim.","n"],["Đang dùng thuốc gì khác?","Không dùng thuốc nào khác.","n"],["Có mang thai không?","Không, vừa hết kinh tuần trước.","n"],["Ăn uống gần đây có gì lạ không?","Trưa ăn cơm bình thường.","n"]],"exam":[["V","Nhìn da mặt, toàn thân","Mày đay lan khắp thân, mặt phù nề, môi sưng, da lạnh vã mồ hôi","e"],["V","Quan sát lưỡi","Lưỡi nhợt, rêu mỏng, hơi sưng","n"],["V","Tri giác","Li bì, trả lời chậm","e"],["M","Nghe phổi, tiếng thở","Thở rít thanh quản, ran rít hai phế trường","e"],["M","Nghe tim","Tim nhanh đều, không tiếng thổi","n"],["T","Mạch quay","Nhanh, nhỏ, khó bắt (vi tế sác)","e"],["T","Sờ chi, đo huyết áp","Tay chân lạnh, huyết áp 70/40","e"],["K","Khám bụng","Mềm, ấn đau nhẹ quanh rốn, không phản ứng thành bụng","n"]],"tests":[["Điện tim",3,"Nhịp nhanh xoang, không thay đổi ST","n"],["Đường huyết mao mạch",2,"6,1 mmol/L","n"],["Khí máu động mạch",10,"pH 7,31, PaO2 58 mmHg, lactate tăng nhẹ","e"],["Tryptase huyết thanh (lấy máu 1 đến 2 giờ sau khởi phát)",5,"Gửi mẫu, có kết quả sau","n"],["Chụp CT sọ não",30,"Không bất thường","w"],["Siêu âm bụng",15,"Không có gì đặc biệt","w"]],"opt":{"ydx":["+Sốc phản vệ độ 3 do thuốc","Hen phế quản cấp","Hội chứng mạch vành cấp","Ngất do cường phế vị","Sốc nhiễm khuẩn"],"bd":["+Quá mẫn, quyết chứng","Háo suyễn","Hung tý","Huyễn vựng","Phong chẩn đơn thuần"],"bc":["+Biểu lý đều bệnh, hư thực thác tạp, thiên hàn","Biểu thực nhiệt","Lý thực nhiệt","Lý hư hàn","Biểu hư nhiệt"],"the":["+Dương khí thoát, vong dương","Phong nhiệt phạm phế","Đàm nhiệt ủng phế","Khí trệ huyết ứ","Can dương thượng cang"],"phap":["+Hồi dương cứu nghịch (sau cấp cứu YHHĐ)","Sơ phong thanh nhiệt","Hóa đàm bình suyễn","Bình can tiềm dương","Hoạt huyết hóa ứ"],"phuong":["+Sâm phụ thang (hỗ trợ sau ổn định)","Ngân kiều tán","Bình can tức phong thang","Huyết phủ trục ứ thang","Tiểu thanh long thang"],"huyet":["+Nhân trung","+Nội quan","+Túc tam lý","+Bách hội","Hợp cốc","Phong trì","Thái xung","Thái uyên"]},"actions":["++Ngừng thuốc nghi gây dị ứng và đặt tư thế phù hợp với biểu hiện|1|Tránh để người bệnh đột ngột đứng/ngồi. Thường nằm ngửa; nếu khó thở rõ có thể chọn tư thế dễ thở phù hợp, đồng thời ưu tiên hồi sức tuần hoàn.","++Tiêm bắp adrenalin vào mặt ngoài đùi theo liều phản vệ|2|Thuốc đầu tay, tiêm sớm nhất","++Thở oxy lưu lượng cao qua mask|1|SpO2 88 phần trăm","++Đặt đường truyền, bù dịch muối đẳng trương nhanh|3|Huyết áp 70/40","+Theo dõi sát mạch, huyết áp, SpO2 liên tục|1|Phát hiện tái diễn","+Dùng thêm kháng histamin và corticoid sau adrenalin|3|Thuốc hỗ trợ, không thay thế adrenalin","+Giữ theo dõi ít nhất 24 giờ|1|Phản vệ pha 2","+Day bấm Nhân trung, Nội quan khi ổn định|2|Hỗ trợ YHCT sau khi đã cấp cứu","-Gọi chụp CT sọ não|30|Không có chỉ định","!Chỉ cho kháng histamin uống rồi theo dõi|3|Chậm trễ adrenalin có thể tử vong","!Cho bệnh nhân ngồi dậy đi lại|1|Tụt huyết áp nặng thêm","!Châm cứu trước khi cấp cứu YHHĐ|5|Mất thời gian vàng"],"teach":"Phản vệ nặng cần adrenalin tiêm bắp sớm, đánh giá ABC, oxy và bù dịch khi có sốc. Tư thế phải theo biểu hiện: tránh đứng/ngồi đột ngột; thường nằm ngửa, nhưng người khó thở có thể cần tư thế dễ thở phù hợp. Kháng histamin và corticoid chỉ hỗ trợ, không thay thế adrenalin. YHCT không được làm chậm hồi sức.","hbu":{"tien_su":"Hay nổi mề đay khi ăn hải sản, chưa biết dị ứng thuốc; không có tiền sử hen hoặc bệnh tim và không dùng thuốc khác theo khai thác. Chưa có dữ kiện tiền sử gia đình hoặc điều trị YHCT; tên kháng sinh vừa tiêm cần được xác minh.","luoc_qua_co_quan":"Da-niêm mạc có mày đay, phù mặt và môi; hô hấp có thở rít, ran rít và giảm oxy máu. Tuần hoàn có tụt huyết áp, mạch nhanh nhỏ, chi lạnh; thần kinh có li bì, trả lời chậm; tiêu hóa có đau quặn bụng, buồn nôn. Chưa có dữ kiện tiết niệu hoặc cơ xương khớp; lưỡi nhợt hơi sưng, rêu mỏng, mạch vi tế sác là dấu YHCT đã ghi nhận.","tom_tat":"Nữ 34 tuổi, khoảng 10 phút sau tiêm bắp kháng sinh xuất hiện ngứa, mày đay toàn thân, phù mặt môi, thở rít, chóng mặt và đau quặn bụng. Khám li bì, chi lạnh, huyết áp 70/40 mmHg, mạch 128 lần/phút, SpO2 88%; khí máu pH 7,31, PaO2 58 mmHg, ECG nhịp nhanh xoang không thay đổi ST. Không có tiền sử hen hoặc bệnh tim; lưỡi nhợt và mạch nhanh nhỏ hỗ trợ nhận định suy kiệt theo YHCT.","dat_van_de":"Phản ứng toàn thân khởi phát nhanh sau tiêm thuốc, có tổn thương da-niêm mạc, tắc nghẽn đường thở, giảm oxy máu và suy tuần hoàn. Có rối loạn tri giác và triệu chứng tiêu hóa. Chứng trạng YHCT gồm chi lạnh, vã mồ hôi, lưỡi nhợt và mạch vi tế sác trong bối cảnh suy sụp cấp.","bien_luan":"Sốc phản vệ độ 3 do thuốc phù hợp với khởi phát nhanh sau tiêm, mày đay-phù niêm mạc, suy hô hấp và tụt huyết áp kèm rối loạn tri giác. Cơn hen đơn thuần không giải thích đầy đủ tổn thương da và sốc; ngất phản xạ ít phù hợp với mày đay, phù môi và co thắt đường thở. Các nguyên nhân sốc khác chỉ đánh giá thêm khi diễn biến không phù hợp, không chờ xét nghiệm để xử trí; tryptase đã gửi hỗ trợ đánh giá và cần xác minh thuốc từ hồ sơ. Theo khóa YHCT, bệnh danh Quá mẫn, quyết chứng, bát cương biểu lý đều bệnh, hư thực thác tạp, thiên hàn, thể dương khí thoát/vong dương và pháp hồi dương cứu nghịch chỉ là nhận định cần thẩm định sau cấp cứu YHHĐ.","sinh_ly_benh":"Các chất trung gian từ dưỡng bào và tế bào ái kiềm gây giãn mạch, tăng tính thấm thành mạch, phù niêm mạc và co thắt phế quản, dẫn đến giảm oxy máu và sốc. Chưa xác định cơ chế miễn dịch cụ thể hoặc hoạt chất gây phản ứng trong ca này. Theo lý luận YHCT của ca, chi lạnh, mồ hôi và mạch nhỏ yếu được quy chiếu với dương khí suy thoát, không thay thế giải thích sinh lý bệnh hiện đại.","tien_luong":"Gần rất nặng, có nguy cơ tử vong do tắc đường thở và suy tuần hoàn, đồng thời có thể tái diễn phản ứng sau cải thiện ban đầu. Xa phụ thuộc khả năng nhận diện và tránh thuốc gây phản ứng. Biện chứng YHCT cần đánh giá lại khi huyết động ổn định.","du_phong":"Theo dõi tại cơ sở y tế theo hướng dẫn phản vệ và ghi đầy đủ thuốc, thời điểm dùng, triệu chứng cùng xử trí. Sau ổn định, khám chuyên khoa dị ứng để xác định tác nhân, cập nhật hồ sơ và thẻ dị ứng, thông báo tiền sử trước mọi lần dùng thuốc. Không tự dùng lại thuốc nghi ngờ hoặc tự dùng Sâm phụ thang, châm cứu hay bấm huyệt để thay thế cấp cứu."},"nguon":["Bộ Y tế, Thông tư 51/2017/TT-BYT hướng dẫn phòng, chẩn đoán và xử trí phản vệ, 2017.","World Allergy Organization, Anaphylaxis Guidance, 2020."],"status":"draft"},{"id":"suy-tim-mat-bu-thuy-thung","title":"Phù chân, khó thở khi nằm","kind":"Nội khoa","level":"Trung bình","group":"noi","place":"Khoa Nội tim mạch","clock":"06:30","name":"Bà Trần Thị Mai","age":72,"sex":"nữ","intro":"Bà nhập viện hôm qua vì khó thở tăng dần, phù hai chân. Sáng nay bà phải ngồi dậy mới thở được, tiền sử tăng huyết áp nhiều năm, suy tim đã điều trị.","vitals":{"hr":104,"sbp":118,"dbp":70,"rr":26,"t":36.9,"spo2":91},"ask":[["Khó thở từ bao giờ, nằm có thở được không?","Mấy ngày nay, nằm thì tức ngực khó thở, phải kê hai ba cái gối.","e"],["Phù chân từ khi nào?","Hơn một tuần, tăng dần cả hai chân.","e"],["Có đau ngực, hồi hộp không?","Hồi hộp nhiều, không đau thắt ngực.","n"],["Tiểu tiện thế nào?","Ít nước tiểu, đêm phải dậy.","e"],["Bà có ăn mặn hoặc ngưng thuốc không?","Mấy tuần nay ăn mặn và quên uống thuốc huyết áp.","e"],["Có sốt, ho đờm không?","Ho khan về đêm, không sốt.","n"],["Sợ lạnh, tay chân lạnh không?","Có, người lạnh, mệt mỏi, ăn kém.","n"],["Bệnh nền khác?","Tăng huyết áp 15 năm, chưa biết đái tháo đường.","n"]],"exam":[["V","Quan sát lưỡi","Lưỡi bệu, tím nhạt, rêu trắng trơn","e"],["V","Quan sát tư thế, cổ, phù","Ngồi đầu cao, tĩnh mạch cổ nổi, phù trũng hai chân đến gối","e"],["V","Sắc mặt, môi","Mặt tái, môi tím nhẹ","n"],["M","Nghe phổi","Ran ẩm hai đáy phổi","e"],["M","Nghe tim","Tim nhanh, có tiếng ngựa phi T3","n"],["T","Mạch","Trầm, tế, sác, vô lực","e"],["T","Sờ gan, sờ chi","Gan to dưới bờ sườn 3 cm, ấn đau nhẹ, chân lạnh","n"],["K","Cân nặng và nước tiểu","Tăng 3 kg trong 5 ngày, nước tiểu 400 ml mỗi ngày","n"]],"tests":[["NT-proBNP",30,"Tăng cao","e"],["Điện tim",3,"Rung nhĩ đáp ứng thất nhanh nhẹ","e"],["X-quang ngực",15,"Bóng tim to, ứ huyết phổi, tràn dịch màng phổi ít","e"],["Siêu âm tim",20,"EF 35 phần trăm, giãn thất trái","e"],["Điện giải đồ, creatinin",15,"Natri 132, kali 3,7, creatinin hơi tăng","e"],["Nội soi dạ dày",40,"Không cần thiết lúc này","w"],["CT sọ não",30,"Không bất thường","w"]],"opt":{"ydx":["+Suy tim mất bù, EF giảm","Viêm phổi cộng đồng","Hen tim do thiếu máu","Hội chứng thận hư","Thuyên tắc phổi"],"bd":["+Tâm quý, thủy thũng","Háo suyễn","Phế ung","Hung tý","Kết hung"],"bc":["+Lý hư hàn, thủy thịnh","Biểu thực nhiệt","Lý thực nhiệt","Biểu hư hàn","Lý hư nhiệt"],"the":["+Tâm thận dương hư, thủy ẩm đình trệ","Đàm nhiệt ủng phế","Tỳ vị thấp nhiệt","Can thận âm hư","Khí trệ huyết ứ"],"phap":["+Ôn dương lợi thủy","Thanh nhiệt hóa đàm","Tư âm tiềm dương","Sơ can giải uất","Phát hãn giải biểu"],"phuong":["+Chân vũ thang","Ngân kiều tán","Lục vị địa hoàng hoàn","Tiểu sài hồ thang","Bình vị tán"],"huyet":["+Tâm du","+Thận du","+Túc tam lý","+Âm lăng tuyền","+Quan nguyên","Hợp cốc","Phong trì","Thiên đột"]},"actions":["+Cho ngồi đầu cao, thở oxy|1|SpO2 91 phần trăm","+Tiêm lợi tiểu quai đường tĩnh mạch|3|Giảm ứ huyết, giảm phù","+Hạn chế muối và nước, cân và đo nước tiểu mỗi ngày|1|Theo dõi cân bằng dịch","+Điều chỉnh thuốc suy tim, kiểm soát nhịp rung nhĩ|5|Theo chỉ định tim mạch","+Theo dõi điện giải, kali máu|2|Lợi tiểu gây rối loạn điện giải","+Phối hợp thuốc thang ôn dương lợi thủy và châm cứu bổ trợ|10|Hỗ trợ YHCT sau ổn định","-Kháng sinh phổ rộng thường quy|3|Không có bằng chứng nhiễm trùng","-Làm nội soi dạ dày|40|Không liên quan","!Truyền nhanh dịch muối đẳng trương 1000 ml|10|Làm nặng phù phổi","!Cho bệnh nhân nằm ngửa bằng và hạn chế vận động tối thiểu|1|Tăng khó thở, ứ huyết"],"teach":"Suy tim mất bù cần giảm tải thể tích bằng lợi tiểu, hạn chế muối nước, tìm yếu tố khởi phát như ngưng thuốc và rung nhĩ. Truyền dịch nhanh có hại. YHCT biện chứng tâm thận dương hư, thủy phiếm, dùng ôn dương lợi thủy như điều trị hỗ trợ.","hbu":{"tien_su":"Tăng huyết áp 15 năm, suy tim đã điều trị; gần đây ăn mặn và quên thuốc huyết áp, chưa biết có đái tháo đường. Chưa có tên thuốc đang dùng, tiền sử gia đình hoặc điều trị YHCT trước đây.","luoc_qua_co_quan":"Tim mạch có hồi hộp, khó thở khi nằm, phù hai chân, không đau thắt ngực; hô hấp có ho khan về đêm, không sốt. Tiết niệu có tiểu ít và tiểu đêm, tiêu hóa có ăn kém; chưa có dữ kiện thần kinh hoặc cơ xương khớp. Sợ lạnh, chân lạnh, lưỡi bệu tím nhạt rêu trắng trơn và mạch trầm tế sác vô lực là chứng trạng YHCT.","tom_tat":"Nữ 72 tuổi, tiền sử tăng huyết áp và suy tim, nhập viện vì khó thở tăng dần, khó thở khi nằm và phù hai chân sau giai đoạn ăn mặn, quên thuốc. Khám tĩnh mạch cổ nổi, ran ẩm hai đáy, T3, gan to 3 cm, phù đến gối; tăng 3 kg trong 5 ngày, nước tiểu 400 ml/ngày, SpO2 91%, EF 35%, ECG rung nhĩ và X-quang ứ huyết phổi. Không sốt hoặc đau thắt ngực; sợ lạnh, lưỡi bệu tím nhạt, rêu trắng trơn, mạch trầm tế vô lực.","dat_van_de":"Hội chứng sung huyết phổi và hệ thống, giảm dung nạp tư thế nằm, thiểu niệu và giảm oxy máu. Có rối loạn nhịp, tiền căn tăng huyết áp, bệnh tim đã điều trị và yếu tố ăn mặn, quên thuốc. Chứng trạng YHCT gồm phù, sợ lạnh, mệt, lưỡi bệu rêu trắng trơn và mạch trầm tế vô lực.","bien_luan":"Suy tim mất bù với EF giảm phù hợp với khó thở khi nằm, tĩnh mạch cổ nổi, T3, phù, ứ huyết phổi, NT-proBNP tăng và EF 35%; ăn mặn, quên thuốc và rung nhĩ có thể góp phần khởi phát. Bệnh thận gây phù cần đánh giá đồng thời do thiểu niệu và creatinin tăng, nhưng không giải thích tốt toàn bộ dấu sung huyết tim; đề nghị theo dõi chức năng thận, điện giải và xét nghiệm nước tiểu. Viêm phổi ít được hỗ trợ vì không sốt, ho khan và hình ảnh ưu tiên ứ huyết; thiếu máu cơ tim hoặc thuyên tắc phổi cần khảo sát theo triệu chứng, ECG, troponin và đánh giá nguy cơ nếu nghi ngờ. Theo khóa YHCT, bệnh danh Tâm quý, thủy thũng, bát cương Lý hư hàn, thủy thịnh, thể tâm thận dương hư, thủy ẩm đình trệ, pháp ôn dương lợi thủy, chỉ phối hợp sau đánh giá an toàn.","sinh_ly_benh":"Giảm chức năng bơm làm tăng áp lực đổ đầy, gây sung huyết phổi và tĩnh mạch hệ thống; hoạt hóa thần kinh-thể dịch thúc đẩy giữ muối nước. Giảm tưới máu thận và sung huyết thận góp phần thiểu niệu, còn rung nhĩ có thể làm giảm hiệu quả huyết động. Theo YHCT của ca, tâm thận dương hư làm vận hóa thủy dịch suy giảm, thủy ẩm đình trệ gây phù và khó thở.","tien_luong":"Gần dè dặt vì có giảm oxy máu, thiểu niệu, rung nhĩ và suy chức năng thất trái; cần theo dõi đáp ứng giảm sung huyết, chức năng thận và điện giải. Xa là bệnh mạn có nguy cơ tái nhập viện và biến cố tim mạch, phụ thuộc tuân thủ điều trị và kiểm soát yếu tố khởi phát. Chứng trạng YHCT cần đánh giá lại sau khi tình trạng dịch và tuần hoàn cải thiện.","du_phong":"Tuân thủ thuốc và mức hạn chế muối, nước được bác sĩ cá thể hóa; theo dõi cân nặng, phù, khó thở và lượng nước tiểu. Tái khám tim mạch đúng hẹn, kiểm tra chức năng thận và điện giải theo chỉ định; đến viện khi khó thở tăng, tiểu giảm rõ, ngất hoặc đau ngực. Không tự tăng thuốc lợi tiểu, truyền dịch hoặc dùng thuốc ôn dương lợi thủy khi chưa được đánh giá."},"nguon":["ESC, Guidelines for the diagnosis and treatment of acute and chronic heart failure, 2021; Focused Update, 2023.","ESC, Guidelines for the management of heart failure, 2026; cần đối chiếu bản đầy đủ trước khi hoàn thiện đáp án điều trị."],"status":"draft"},{"id":"mat-ngu-tam-ty-luong-hu","title":"Mất ngủ kéo dài, hay quên","kind":"Nội khoa","level":"Dễ","group":"noi","place":"Phòng khám Nội YHCT","clock":"09:15","name":"Chị Nguyễn Thị Lan","age":45,"sex":"nữ","intro":"Chị đi khám vì ba tháng nay ngủ khó, hay thức giấc, ban ngày mệt, hay quên, ăn kém. Chị là kế toán, áp lực cuối năm.","vitals":{"hr":84,"sbp":112,"dbp":70,"rr":18,"t":36.7,"spo2":98},"ask":[["Ngủ như thế nào, khó vào giấc hay hay thức giấc?","Khó vào giấc, ngủ chập chờn, mơ nhiều, thức dậy sớm.","e"],["Hay hồi hộp, quên, mệt mỏi không?","Hay quên, hồi hộp, sức khỏe sa sút.","e"],["Ăn uống, tiêu hóa ra sao?","Ăn kém, đầy bụng, đại tiện nhão.","e"],["Kinh nguyệt thế nào?","Kinh ít, màu nhạt, hơi trễ.","n"],["Sụt cân, run tay, nóng bức không?","Không.","n"],["Có dùng cà phê, thuốc ngủ không?","Một ly cà phê buổi sáng, chưa dùng thuốc ngủ.","n"],["Có buồn bã, mất hứng thú kéo dài không?","Thỉnh thoảng lo lắng, không buồn chán kéo dài.","n"],["Có ngáy to, ngưng thở khi ngủ không?","Chồng nói không ngáy.","n"]],"exam":[["V","Quan sát lưỡi","Lưỡi nhợt, rêu mỏng trắng","e"],["V","Sắc mặt","Vàng úa, không tươi nhuận","n"],["M","Tiếng nói, hơi thở","Nói nhỏ, ít hơi","n"],["T","Mạch","Tế nhược","e"],["T","Sờ bụng","Mềm, không đau","n"],["K","Khám tuyến giáp","Không to","n"],["K","Khám tim phổi","Bình thường","e"],["K","Đo huyết áp, mạch","Mạch 84, huyết áp 112/70","n"]],"tests":[["Công thức máu",20,"Hemoglobin 108 g/L, thiếu máu nhẹ","e"],["TSH",30,"Bình thường","e"],["Đường huyết",5,"Bình thường","n"],["Chụp MRI sọ não",40,"Không có chỉ định","w"],["Đa ký giấc ngủ",120,"Chưa cần ở bước này","w"]],"opt":{"ydx":["+Mất ngủ mạn tính, nghi thiếu máu nhẹ","Cường giáp","Trầm cảm nặng","Hội chứng ngưng thở khi ngủ","U não"],"bd":["+Bất mị","Kinh quý","Chính xung","Hư lao","Huyễn vựng"],"bc":["+Lý hư hàn","Biểu thực nhiệt","Lý thực nhiệt","Biểu hư hàn","Lý hư nhiệt"],"the":["+Tâm tỳ lưỡng hư","Tâm hỏa thượng viêm","Can uất hóa hỏa","Tâm thận bất giao","Đàm nhiệt nhiễu tâm"],"phap":["+Bổ ích tâm tỳ, dưỡng huyết an thần","Thanh tâm tả hỏa","Sơ can giải uất","Tư âm giáng hỏa","Thanh hóa đàm nhiệt"],"phuong":["+Quy tỳ thang","Hoàng liên a giao thang","Long đởm tả can thang","Thiên vương bổ tâm đan","Ôn đởm thang"],"huyet":["+Thần môn","+Tam âm giao","+Tâm du","+Tỳ du","+Bách hội","Hợp cốc","Phong long","Thiên đột"]},"actions":["+Tư vấn vệ sinh giấc ngủ, giảm cà phê buổi chiều|3|Điều trị nền tảng","+Kê Quy tỳ thang gia giảm|5|Phù hợp thể tâm tỳ lưỡng hư","+Châm hoặc cứu Thần môn, Tam âm giao|15|Hỗ trợ an thần","+Hẹn tái khám sau 2 tuần, đánh giá lại giấc ngủ|1|Theo dõi đáp ứng","+Điều chỉnh chế độ ăn bổ huyết, điều trị thiếu máu nếu có|2|Theo kết quả xét nghiệm","-Chỉ định chụp MRI sọ não|40|Không có dấu hiệu thần kinh","!Kê benzodiazepin dài ngày ngay lần khám đầu|2|Nguy cơ lệ thuộc, chưa tìm nguyên nhân"],"teach":"Mất ngủ mạn tính cần loại trừ nguyên nhân thực thể như cường giáp, thiếu máu, trầm cảm trước khi kết luận. Thể tâm tỳ lưỡng hư dùng Quy tỳ thang kèm châm cứu và tư vấn vệ sinh giấc ngủ. Thuốc an thần mạnh không phải lựa chọn đầu tiên.","hbu":{"tien_su":"Làm kế toán, có áp lực công việc, dùng một ly cà phê buổi sáng và chưa dùng thuốc ngủ. Kinh ít, màu nhạt, hơi trễ; chưa có tiền sử bệnh khác, gia đình hoặc điều trị YHCT được cung cấp.","luoc_qua_co_quan":"Thần kinh có khó ngủ, hay quên và mệt; tim mạch có hồi hộp nhưng khám tim phổi bình thường. Tiêu hóa có ăn kém, đầy bụng, phân nhão; không sụt cân, run tay hoặc nóng bức, chưa có dữ kiện tiết niệu và cơ xương khớp. Không ghi nhận buồn chán kéo dài hoặc ngáy theo khai thác; lưỡi nhợt, rêu trắng mỏng, mạch tế nhược.","tom_tat":"Nữ 45 tuổi, khó vào giấc, ngủ chập chờn, nhiều mộng và thức sớm trong ba tháng, kèm mệt ban ngày, hay quên, hồi hộp và áp lực công việc. Có ăn kém, phân nhão, kinh ít màu nhạt, sắc mặt vàng úa, lưỡi nhợt và mạch tế nhược; hemoglobin 108 g/L, TSH và đường huyết bình thường. Không sụt cân, run tay, nóng bức, buồn chán kéo dài hoặc ngáy được ghi nhận.","dat_van_de":"Rối loạn khởi đầu và duy trì giấc ngủ kéo dài, có ảnh hưởng ban ngày, kèm hồi hộp và giảm tập trung. Có hemoglobin giảm, triệu chứng tiêu hóa và yếu tố căng thẳng công việc. Chứng trạng YHCT gồm nhiều mộng, ăn kém, phân nhão, sắc mặt kém nhuận, lưỡi nhợt và mạch tế nhược.","bien_luan":"Chẩn đoán mất ngủ mạn tính được hỗ trợ bởi thời gian ba tháng và ảnh hưởng ban ngày, nhưng cần xác minh tần suất cùng cơ hội ngủ đầy đủ; hemoglobin 108 g/L cho thấy thiếu máu cần tìm nguyên nhân. Cường giáp ít phù hợp vì không run, nóng bức, sụt cân và TSH bình thường; trầm cảm hoặc lo âu vẫn cần sàng lọc vì câu trả lời hiện có chưa loại trừ được. Ngưng thở khi ngủ ít được gợi ý do không ngáy theo người nhà nhưng chưa loại trừ hoàn toàn; đề nghị nhật ký ngủ, đánh giá tâm lý và khảo sát thiếu máu theo chỉ định. Theo khóa YHCT, bệnh danh Bất mị, bát cương Lý hư hàn, thể tâm tỳ lưỡng hư, pháp bổ ích tâm tỳ, dưỡng huyết an thần; thành tố hàn cần đối chiếu thêm.","sinh_ly_benh":"Căng thẳng và trạng thái tăng thức tỉnh có thể duy trì khó ngủ, trong khi thiếu ngủ làm tăng mệt và giảm chú ý; thiếu máu có thể góp phần hồi hộp, mệt nhưng chưa xác định là nguyên nhân mất ngủ. Theo YHCT của ca, tỳ khí suy làm sinh hóa khí huyết bất túc, tâm không được nuôi dưỡng nên khó ngủ, nhiều mộng và hay quên. Đây là hai hệ giải thích riêng, không đồng nhất thiếu máu xét nghiệm với huyết hư.","tien_luong":"Gần thường thuận lợi nếu đánh giá đúng yếu tố duy trì mất ngủ và nguyên nhân thiếu máu, nhưng cần theo dõi ảnh hưởng chức năng ban ngày. Xa có nguy cơ kéo dài hoặc tái phát khi căng thẳng và thói quen ngủ chưa được điều chỉnh. Theo YHCT, sự cải thiện giấc ngủ, ăn uống và sức lực giúp đánh giá lại chứng tâm tỳ lưỡng hư.","du_phong":"Duy trì giờ thức ngủ đều, giảm kích thích trước ngủ và quản lý căng thẳng; ghi nhật ký giấc ngủ. Tái khám sau hai tuần như kế hoạch, đồng thời hoàn tất đánh giá thiếu máu và báo sớm nếu hồi hộp, mệt hoặc rối loạn tâm trạng tăng. Không tự dùng thuốc an thần, thuốc bổ huyết hoặc thuốc YHCT; cần trao đổi về điều trị nhận thức hành vi cho mất ngủ khi phù hợp."},"nguon":["European Sleep Research Society và European Insomnia Network, The European Insomnia Guideline: An update on the diagnosis and treatment of insomnia, 2023."],"status":"draft"},{"id":"liet-day-vii-ngoai-bien","title":"Méo miệng sau khi ngủ máy lạnh","kind":"Cơ xương khớp, thần kinh","level":"Trung bình","group":"cxk","place":"Phòng châm cứu","clock":"14:00","name":"Anh Vũ Minh Quân","age":34,"sex":"nam","intro":"Sáng nay anh thức dậy thấy miệng méo, mắt trái nhắm không kín, nước chảy khóe miệng. Tối qua ngủ máy lạnh thổi thẳng vào mặt.","vitals":{"hr":78,"sbp":125,"dbp":80,"rr":16,"t":36.8,"spo2":99},"ask":[["Triệu chứng xuất hiện khi nào, đột ngột không?","Sáng nay thức dậy mới thấy, không đau đầu.","e"],["Có yếu tay chân, nói khó, tê nửa người không?","Không, tay chân bình thường.","e"],["Có đau sau tai, ù tai, nghe to bất thường không?","Hơi đau sau tai bên trái, nghe hơi to.","e"],["Có sốt, phát ban ở tai, tiền sử zona không?","Không.","n"],["Có chấn thương đầu mặt gần đây không?","Không.","n"],["Đái tháo đường, tăng huyết áp?","Không biết, chưa khám.","n"],["Ăn uống, vị giác?","Ăn nhai nhớ, thấy mất vị giác một phần.","n"],["Đã tự dùng thuốc gì?","Uống thuốc giảm đau thông thường.","n"]],"exam":[["V","Quan sát nhăn trán, nhắm mắt","Trán bên trái không nhăn, mắt trái nhắm không kín, lộ củng mạc","e"],["V","Quan sát nếp mũi má, miệng","Nếp mũi má mờ, miệng kéo sang bên phải","e"],["V","Quan sát lưỡi","Lưỡi nhạt, rêu trắng mỏng","n"],["M","Nói, thổi, huýt sáo","Nói hơi ngọng, không thổi được má trái","n"],["T","Mạch","Phù, khẩn","e"],["K","Khám thần kinh tay chân","Sức cơ 5 phần 5, không liệt chi","e"],["K","Khám tai, ống tai ngoài","Không có mụn nước","n"],["K","Đo huyết áp","125/80, bình thường","n"]],"tests":[["Đường huyết mao mạch",2,"5,2 mmol/L","e"],["Công thức máu",20,"Bình thường","n"],["Điện cơ thần kinh mặt",40,"Sẽ làm sau 1 đến 2 tuần nếu cần tiên lượng","n"],["Chụp CT sọ não",30,"Không có dấu hiệu thần kinh trung ương, không cần chụp","w"],["Chụp MRI cột sống cổ",45,"Không liên quan","w"]],"opt":{"ydx":["+Liệt dây VII ngoại biên (liệt Bell)","Đột quỵ não","Zona tai (hội chứng Ramsay Hunt)","U góc cầu tiểu não","Viêm tai giữa biến chứng"],"bd":["+Khẩu nhãn oa tà","Trúng phong kinh lạc","Trúng phong tạng phủ","Huyễn vựng","Đầu thống"],"bc":["+Biểu thực hàn","Biểu hư nhiệt","Lý thực nhiệt","Lý hư hàn","Biểu thực nhiệt"],"the":["+Phong hàn xâm nhập kinh lạc","Phong nhiệt xâm nhập kinh lạc","Can phong nội động","Đàm ứ trở lạc","Khí huyết hư"],"phap":["+Khu phong tán hàn, thông kinh hoạt lạc","Thanh nhiệt giải độc","Bình can tức phong","Hóa đàm khai khiếu","Bổ khí dưỡng huyết"],"phuong":["+Khiên chính tán gia giảm","Ngân kiều tán","Thiên ma câu đằng ẩm","Bổ dương hoàn ngũ thang","Quy tỳ thang"],"huyet":["+Địa thương","+Giáp xa","+Dương bạch","+Hợp cốc","+Phong trì","Thái xung","Tam âm giao","Thiên đột"]},"actions":["+Corticoid đường uống sớm trong 72 giờ đầu|3|Cải thiện hồi phục dây VII","+Bảo vệ mắt: nhỏ nước mắt nhân tạo, che mắt khi ngủ|3|Nguy cơ loét giác mạc","+Châm cứu nhẹ nhàng vùng mặt kết hợp xa gần|20|Thông kinh lạc","+Chườm ấm nhẹ, xoa bóp nhẹ vùng mặt|10|Hỗ trợ tuần hoàn","+Dặn tránh gió lạnh, tái khám sau 1 tuần|2|Theo dõi tiến triển","-Chỉ định kháng sinh đường uống|2|Không có nhiễm khuẩn","-Chụp CT sọ não thường quy|30|Không có dấu hiệu thần kinh trung ương","!Điện châm cường độ mạnh vùng mặt ngay ngày đầu|20|Kích thích mạnh giai đoạn cấp có thể làm nặng","!Cho về không dặn chăm sóc mắt|1|Nguy cơ tổn thương giác mạc"],"teach":"Liệt mặt ngoại biên làm mất nhăn trán, còn liệt trung ương thì trán còn nhăn. Cần loại trừ đột quỵ, zona tai. Điều trị sớm bằng corticoid, bảo vệ mắt, châm cứu nhẹ giai đoạn cấp rồi tăng dần. Điều trị phối hợp Đông Tây y cho kết quả tốt nhất.","hbu":{"tien_su":"Không có chấn thương đầu mặt gần đây, không ghi nhận tiền sử zona; chưa biết có tăng huyết áp hoặc đái tháo đường vì chưa được khám. Đã uống thuốc giảm đau thông thường nhưng chưa rõ tên; chưa có tiền sử gia đình, dị ứng thuốc hoặc điều trị YHCT.","luoc_qua_co_quan":"Thần kinh có yếu nửa mặt trái, mắt nhắm không kín, giảm vị giác và nghe âm thanh hơi to; không đau đầu, yếu chi hoặc tê nửa người theo khai thác. Không sốt, không có mụn nước tai; khám tim phổi, tiêu hóa, tiết niệu và cơ xương khớp chưa được mô tả đầy đủ. Lưỡi nhạt rêu trắng mỏng, mạch phù khẩn là dấu YHCT đã ghi nhận.","tom_tat":"Nam 34 tuổi, sáng thức dậy phát hiện méo miệng và mắt trái nhắm không kín, kèm đau nhẹ sau tai trái, tăng cảm nhận âm thanh và giảm vị giác một phần. Khám mất nhăn trán trái, mờ nếp mũi má, miệng kéo sang phải, không phồng được má trái; sức cơ chi 5/5, đường huyết 5,2 mmol/L. Không đau đầu, yếu hoặc tê chi, không sốt hay mụn nước tai; lưỡi nhạt rêu trắng mỏng, mạch phù khẩn.","dat_van_de":"Yếu cấp tính toàn bộ nửa mặt trái, ảnh hưởng nhắm mắt và chức năng môi má, kèm thay đổi vị giác và cảm nhận âm thanh. Chưa ghi nhận thiếu sót vận động chi hoặc tổn thương mụn nước tai. Chứng trạng YHCT gồm miệng mắt lệch, lưỡi nhạt rêu trắng mỏng và mạch phù khẩn sau tiếp xúc lạnh được kể lại.","bien_luan":"Liệt dây VII ngoại biên trái phù hợp với yếu cả trán và nửa mặt dưới, nhắm mắt không kín, giảm vị giác và tăng cảm nhận âm thanh; liệt Bell là chẩn đoán sau khi loại trừ nguyên nhân khác. Tổn thương trung ương ít được gợi ý vì không yếu chi và có liệt trán, nhưng tổn thương cầu não vẫn có thể gây kiểu liệt ngoại biên nên cần khám thần kinh đầy đủ, chỉ định hình ảnh khi có dấu bất thường. Zona tai ít được hỗ trợ do không mụn nước, song cần theo dõi đau tai hoặc ban xuất hiện muộn; không làm xét nghiệm hay hình ảnh thường quy nếu diễn tiến điển hình, điện sinh lý cân nhắc theo mức độ liệt và tiên lượng. Theo khóa YHCT, bệnh danh Khẩu nhãn oa tà, bát cương Biểu thực hàn, thể phong hàn xâm nhập kinh lạc, pháp khu phong tán hàn, thông kinh hoạt lạc.","sinh_ly_benh":"Liệt Bell liên quan viêm và phù dây VII trong ống xương, làm giảm dẫn truyền vận động mặt và có thể ảnh hưởng vị giác, cơ bàn đạp. Tiếp xúc máy lạnh chỉ là bối cảnh, chưa chứng minh nguyên nhân trực tiếp. Theo lý luận YHCT của ca, phong hàn làm trở trệ kinh lạc vùng mặt, khí huyết không thông gây khẩu nhãn oa tà.","tien_luong":"Gần cần bảo vệ giác mạc vì nhắm mắt không kín; mức độ liệt ban đầu và diễn tiến ảnh hưởng khả năng hồi phục. Xa nhiều người bệnh hồi phục, nhưng có thể còn yếu mặt hoặc đồng vận; chưa đủ dữ kiện dự đoán riêng cho ca này. Theo YHCT, cần đánh giá lại chứng trạng và chức năng mặt trong quá trình phục hồi.","du_phong":"Thực hiện bảo vệ mắt đúng hướng dẫn, tránh dụi mắt và tái khám sau một tuần như kế hoạch. Đến viện ngay khi đau hoặc đỏ mắt, giảm thị lực, yếu chi, rối loạn thăng bằng, đau đầu mới hoặc ban mụn nước tai. Không có biện pháp bảo đảm phòng liệt Bell; tránh lạnh để dễ chịu không thay thế điều trị và không tự châm cứu hay dùng thuốc YHCT."},"nguon":["AAO-HNSF, Clinical Practice Guideline: Bell’s Palsy, 2013.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo YHCT, kết hợp YHCT với YHHĐ, tập I, Quyết định 5013/QĐ-BYT, 2020, mục Bệnh dây thần kinh mặt (Khẩu nhãn oa tà)."],"status":"draft"},{"id":"stemi-thanh-duoi","title":"Đau ngực cấp, nghi hội chứng vành cấp","kind":"Cấp cứu","level":"Trung bình","group":"capcuu","place":"Khoa Cấp cứu","clock":"08:20","name":"Ông Lê Văn Hùng","age":61,"sex":"nam","intro":"Người bệnh được đưa đến khoa Cấp cứu vì đau ngực khi đang đi bộ nhanh. Đau sau xương ức kéo dài khoảng 40 phút, vã mồ hôi và buồn nôn. Có tiền sử hút thuốc; chưa ghi nhận dị ứng thuốc.","vitals":{"hr":104,"sbp":94,"dbp":62,"rr":24,"t":36.7,"spo2":93},"ask":[["Đau bắt đầu khi nào và kéo dài bao lâu?","Đau xuất hiện khoảng 40 phút trước, liên tục, chưa giảm.","e"],["Đau ở đâu, có lan đi đâu không?","Đau sau xương ức, lan lên hàm và mặt trong cánh tay trái.","e"],["Đau có tính chất gì, mức độ ra sao?","Cảm giác bóp nghẹt, nặng ngực, mức độ khoảng 8/10.","e"],["Có khó thở, vã mồ hôi hoặc buồn nôn không?","Khó thở nhẹ, vã mồ hôi lạnh và buồn nôn.","e"],["Đã từng có cơn tương tự chưa?","Vài tuần gần đây đôi lúc tức ngực khi gắng sức, tự hết sau nghỉ.","e"],["Có bệnh nền hoặc yếu tố nguy cơ tim mạch nào?","Hút thuốc nhiều năm; chưa được chẩn đoán bệnh mạch vành.","e"],["Có dùng thuốc chống đông, thuốc tim mạch hoặc thuốc cường dương không?","Không nhớ đã dùng thuốc tim mạch; không dùng thuốc cường dương gần đây.","n"],["Có tiền sử dị ứng thuốc hoặc xuất huyết tiêu hóa không?","Chưa biết dị ứng thuốc; chưa từng xuất huyết tiêu hóa.","n"]],"exam":[["V","Sắc mặt và mồ hôi","Sắc mặt tái, vã mồ hôi lạnh, vẻ lo lắng.","e"],["V","Tri giác","Tỉnh, trả lời được, có vẻ mệt.","n"],["V","Môi và đầu chi","Đầu chi hơi lạnh, không tím rõ.","n"],["M","Giọng nói và hơi thở","Nói được câu ngắn, hơi thở nhanh.","n"],["M","Tiếng thở","Không có tiếng rít; không ho khạc đàm.","n"],["T","Mạch (thiết)","Mạch nhanh, hơi yếu, đều; mạch huyền sác.","e"],["V","Quan sát lưỡi","Lưỡi hơi tím, rêu trắng mỏng.","e"],["K","Tim phổi và tưới máu","Nhịp tim nhanh; phổi chưa nghe ran rõ; huyết áp thấp, đầu chi lạnh.","e"]],"tests":[["Điện tâm đồ 12 chuyển đạo",5,"ST chênh lên ở các chuyển đạo thành dưới; cần kích hoạt quy trình hội chẩn tái tưới máu.","e"],["Troponin tim độ nhạy cao",20,"Tăng trên giới hạn tham chiếu; lấy mẫu nối tiếp theo quy trình cơ sở.","e"],["Đường huyết mao mạch",3,"9,8 mmol/L.","n"],["Công thức máu và sinh hóa cơ bản",15,"Chưa có kết quả bất thường cấp tính rõ; theo dõi chức năng thận và điện giải.","n"],["CT sọ não không cản quang",25,"Không có chỉ định trong bệnh cảnh đau ngực này nếu không xuất hiện dấu thần kinh.","w"]],"opt":{"ydx":["+Hội chứng vành cấp có ST chênh lên, kèm giảm tưới máu","Đau thắt ngực ổn định","Viêm màng ngoài tim cấp","Thuyên tắc phổi nguy cơ thấp","Phình tách động mạch chủ"],"bd":["+Chân tâm thống","Vị quản thống","Đầu thống","Háo suyễn","Hiếp thống"],"bc":["+Lý thực, tiêu thực bản hư","Biểu thực hàn","Biểu hư nhiệt","Lý hư hàn","Lý thực nhiệt thuần"],"the":["+Tâm mạch ứ trở, khí huyết không thông (nhận định hỗ trợ)","Tỳ khí hư","Thận dương hư","Phong hàn phạm biểu","Can khí uất kết"],"phap":["+Xử trí cấp cứu YHHĐ trước, sau ổn định hoạt huyết hóa ứ thông mạch","Ôn bổ tỳ thận trước","Thanh nhiệt giải độc đơn trị","Sơ phong giải biểu","Bình can tiềm dương"],"phuong":["+Huyết phủ trục ứ thang gia giảm (chỉ sau ổn định)","Bạch hổ thang","Lý trung hoàn","Ngân kiều tán","Tiểu sài hồ thang"],"huyet":["+Nội quan","+Đản trung","+Tâm du","+Cách du","+Túc tam lý","Thái xung","Phong trì","Thiên khu"]},"actions":["++Kích hoạt báo động hội chứng vành cấp, gọi hỗ trợ tim mạch|1|Đau kéo dài, ECG gợi ý STEMI và huyết áp thấp.","++Đánh giá ABC, monitor ECG-SpO2-huyết áp và thiết lập đường truyền|2|Theo dõi loạn nhịp và suy tuần hoàn.","++Làm ECG 12 chuyển đạo ngay, lấy troponin và xét nghiệm cấp cứu|5|Xác định chẩn đoán và hướng xử trí.","++Hội chẩn để tái tưới máu khẩn theo quy trình cơ sở|5|Nghi STEMI; không trì hoãn chuyển tuyến/can thiệp.","+Đánh giá chỉ định oxy theo tình trạng thiếu oxy và quy trình cơ sở|2|Không dùng oxy thường quy khi không có chỉ định.","+Đánh giá chống chỉ định trước khi dùng thuốc kháng kết tập hoặc chống đông theo phác đồ|3|Giảm nguy cơ huyết khối và tai biến chảy máu.","!Cho người bệnh đi bộ đến phòng chụp để hoàn tất thủ tục|2|Gắng sức và trì hoãn xử trí ở người bệnh nghi STEMI, tụt huyết áp.","!Châm cứu hoặc cho thuốc YHCT trước khi kích hoạt xử trí hội chứng vành cấp|10|Có thể làm chậm tái tưới máu và hồi sức."],"teach":"Đau ngực kéo dài, lan hàm/cánh tay, vã mồ hôi và ECG gợi ý STEMI cần kích hoạt xử trí khẩn. Đánh giá ABC, monitor, ECG và hội chẩn tái tưới máu là ưu tiên. YHCT chỉ cân nhắc hỗ trợ sau khi người bệnh ổn định; không để thủ thuật hay thuốc YHCT trì hoãn cấp cứu.","hbu":{"tien_su":"Hút thuốc nhiều năm, vài tuần gần đây có tức ngực khi gắng sức và giảm sau nghỉ, chưa được chẩn đoán bệnh mạch vành. Chưa ghi nhận dị ứng thuốc hoặc xuất huyết tiêu hóa; không dùng thuốc cường dương gần đây, còn thuốc tim mạch đang dùng chưa được xác minh. Tiền sử gia đình và điều trị YHCT chưa có dữ kiện.","luoc_qua_co_quan":"Tim mạch có đau ngực, đầu chi lạnh và huyết áp thấp; hô hấp có khó thở nhẹ, thở nhanh, không thở rít hoặc ho đàm, phổi chưa nghe ran rõ. Tiêu hóa có buồn nôn, thần kinh còn tỉnh và trả lời được; chưa có dữ kiện tiết niệu hoặc cơ xương khớp. Lưỡi hơi tím, rêu trắng mỏng, mạch huyền sác hơi yếu là dấu YHCT đã ghi nhận.","tom_tat":"Nam 61 tuổi, hút thuốc lâu năm, đau bóp nghẹt sau xương ức liên tục khoảng 40 phút khi đi bộ nhanh, lan hàm và mặt trong tay trái, kèm khó thở, vã mồ hôi lạnh và buồn nôn. Huyết áp 94/62 mmHg, mạch 104 lần/phút, SpO2 93%, đầu chi lạnh; ECG ST chênh lên thành dưới và troponin tăng trên giới hạn tham chiếu. Còn tỉnh, phổi chưa có ran rõ; lưỡi hơi tím, rêu trắng mỏng và mạch huyền sác.","dat_van_de":"Đau ngực cấp kéo dài kiểu thiếu máu cơ tim, có biến đổi ST, dấu tổn thương cơ tim và giảm tưới máu ngoại vi. Có tiền căn đau ngực khi gắng sức và hút thuốc lâu năm. Chứng trạng YHCT gồm đau ngực dữ dội, lưỡi tím và mạch huyền sác hơi yếu, kèm mồ hôi lạnh và đầu chi lạnh.","bien_luan":"Hội chứng vành cấp có ST chênh lên phù hợp với đau ngực điển hình kéo dài, ECG thành dưới và troponin tăng; cần tái tưới máu khẩn, không chờ đủ xét nghiệm nối tiếp. Bóc tách động mạch chủ cần sàng lọc đau kiểu xé, chênh mạch hoặc dấu thần kinh nếu nghi ngờ; thuyên tắc phổi và viêm màng ngoài tim ít phù hợp với tổng thể hiện tại nhưng chưa đủ dữ kiện để loại trừ chỉ bằng triệu chứng. Đề nghị ECG chuyển đạo phải để đánh giá thất phải, siêu âm tim tại giường và theo dõi huyết động mà không trì hoãn tái tưới máu; chưa đủ cơ sở gọi sốc tim. Theo khóa YHCT, bệnh danh Chân tâm thống, bát cương Lý thực, tiêu thực bản hư, thể tâm mạch ứ trở, khí huyết không thông; pháp ưu tiên cấp cứu YHHĐ, chỉ xem xét hoạt huyết hóa ứ thông mạch sau ổn định và thẩm định.","sinh_ly_benh":"Giảm đột ngột dòng máu động mạch vành gây thiếu máu và tổn thương cơ tim, tạo biến đổi ST và tăng troponin; cơ chế thường gặp là huyết khối trên mảng xơ vữa nhưng chưa được xác nhận trong ca này. Giảm chức năng co bóp hoặc tổn thương thất phải có thể góp phần giảm tưới máu, cần khảo sát thêm. Theo YHCT của ca, huyết ứ trở tâm mạch làm khí huyết không thông gây đau, còn bản hư chưa có đủ dữ kiện phân định.","tien_luong":"Gần nặng vì có huyết áp thấp và dấu giảm tưới máu, nguy cơ rối loạn nhịp, suy tim hoặc sốc; phụ thuộc thời gian và hiệu quả tái tưới máu. Xa phụ thuộc mức tổn thương cơ tim, chức năng thất và kiểm soát yếu tố nguy cơ. Biện chứng YHCT cần đánh giá lại sau giai đoạn cấp.","du_phong":"Sau ổn định, bỏ thuốc lá, tuân thủ kế hoạch dự phòng thứ phát và phục hồi chức năng tim theo bác sĩ. Tái khám tim mạch đúng hẹn; gọi cấp cứu khi đau ngực tái diễn, khó thở tăng hoặc ngất. Không tự dùng thuốc hoạt huyết hoặc châm cứu vì cần đánh giá tương tác và nguy cơ chảy máu khi phối hợp điều trị tim mạch."},"nguon":["ESC, Guidelines for the management of acute coronary syndromes, 2023."],"status":"draft"},{"id":"phan-ve-phu-thanh-quan","title":"Phản vệ sau dùng thuốc","kind":"Cấp cứu","level":"Khó","group":"capcuu","place":"Khoa Cấp cứu","clock":"14:10","name":"Chị Phạm Thị Ngọc","age":34,"sex":"nữ","intro":"Khoảng 10 phút sau khi dùng một thuốc mới tại cơ sở y tế, người bệnh nổi ban ngứa toàn thân, khàn tiếng, khó thở và choáng. Tên thuốc đang được nhân viên kiểm tra trên hồ sơ.","vitals":{"hr":128,"sbp":76,"dbp":42,"rr":30,"t":36.5,"spo2":88},"ask":[["Triệu chứng bắt đầu khi nào?","Khoảng 10 phút sau khi dùng thuốc mới.","e"],["Thuốc được dùng bằng đường nào và tên gì?","Được tiêm tại cơ sở; người bệnh không nhớ tên thuốc, hồ sơ đang được kiểm tra.","e"],["Có khó thở, khàn tiếng hoặc nghẹn họng không?","Khó thở tăng nhanh, khàn tiếng và cảm giác nghẹn họng.","e"],["Có ngứa, mày đay hoặc phù môi lưỡi không?","Ngứa toàn thân, nổi mày đay, môi hơi sưng.","e"],["Có đau bụng, nôn hoặc tiêu chảy không?","Đau quặn bụng và buồn nôn.","n"],["Đã từng phản ứng tương tự hoặc dị ứng thuốc chưa?","Từng nổi mẩn sau một thuốc giảm đau nhưng không rõ tên.","e"],["Có hen phế quản hoặc bệnh tim mạch không?","Có hen nhẹ từ nhỏ, hiện không dùng thuốc thường xuyên.","n"],["Có chóng mặt, ngất hoặc cảm giác sắp ngất không?","Choáng váng, mắt tối sầm khi ngồi dậy.","e"]],"exam":[["V","Da và niêm mạc","Mày đay lan rộng, đỏ da; môi phù nhẹ.","e"],["V","Tri giác","Bứt rứt, còn đáp ứng nhưng yếu.","e"],["V","Đường thở trên","Khàn tiếng, phù môi; cần đánh giá nguy cơ phù thanh quản.","e"],["M","Giọng nói","Khàn tiếng mới xuất hiện.","e"],["M","Âm thở","Thở rít nhẹ khi hít vào, có khò khè.","e"],["T","Mạch (thiết)","Mạch nhanh nhỏ, đầu chi lạnh.","e"],["V","Quan sát lưỡi","Chất lưỡi đỏ, mạch sác; dữ kiện này không được làm chậm xử trí phản vệ.","e"],["K","Tuần hoàn và hô hấp","Hạ huyết áp, giảm SpO2, ran rít hai phế trường.","e"]],"tests":[["Đánh giá ABC, huyết áp và SpO2 liên tục",1,"Đường thở có dấu hiệu bị ảnh hưởng, SpO2 thấp, tụt huyết áp.","e"],["Đường huyết mao mạch",2,"6,1 mmol/L.","n"],["Điện tâm đồ",5,"Nhịp nhanh xoang.","n"],["Tryptase huyết thanh theo thời điểm và khả năng cơ sở",30,"Chưa có kết quả; không chờ xét nghiệm mới bắt đầu xử trí.","n"],["CT ngực có cản quang",30,"Không phải xét nghiệm ưu tiên trong phản vệ điển hình đang diễn tiến.","w"]],"opt":{"ydx":["+Phản vệ nặng sau dùng thuốc, suy hô hấp và tụt huyết áp","Cơn hen phế quản đơn thuần","Mày đay cấp không biến chứng","Ngộ độc thức ăn","Cơn hoảng loạn"],"bd":["+Quá mẫn, quyết chứng","Khái suyễn mạn","Tâm quý","Tiết tả","Phong chẩn đơn thuần"],"bc":["+Lý hư hàn, dương khí muốn thoát","Biểu hư hàn","Biểu thực nhiệt","Lý thực nhiệt","Lý hư nhiệt"],"the":["+Dương khí thoát, vong dương (sau cấp cứu)","Phong nhiệt phạm phế","Tỳ khí hư","Thận dương hư","Can khí uất"],"phap":["+Cấp cứu phản vệ YHHĐ trước, sau ổn định hồi dương cố thoát","Khu phong bằng thuốc uống trước","Thanh nhiệt giải độc đơn trị","Hóa đàm bình suyễn","Hoạt huyết hóa ứ"],"phuong":["+Sâm phụ thang (chỉ sau ổn định)","Ngân kiều tán","Bạch hổ thang","Lý trung hoàn","Tiểu thanh long thang"],"huyet":["+Nhân trung","+Nội quan","+Túc tam lý","+Bách hội","Hợp cốc","Phong trì","Thái xung"]},"actions":["++Ngừng ngay thuốc nghi gây phản vệ, gọi hỗ trợ và báo động cấp cứu|1|Loại bỏ tiếp xúc tiếp diễn và huy động nhân lực.","++Đặt người bệnh nằm phù hợp tình trạng tuần hoàn, đánh giá ABC liên tục|1|Tụt huyết áp và nguy cơ suy hô hấp.","++Dùng adrenalin đường tiêm bắp theo hướng dẫn phản vệ hiện hành và quy trình cơ sở|1|Điều trị hàng đầu; không chờ xét nghiệm.","++Hỗ trợ oxy, thiết lập đường truyền và hồi sức dịch theo quy trình|3|Giảm oxy máu và sốc.","+Chuẩn bị kiểm soát đường thở nâng cao nếu phù thanh quản tiến triển|2|Khàn tiếng, nghẹn họng và thở rít.","+Theo dõi liên tục và ghi nhận diễn biến, thời điểm dùng thuốc|1|Phản vệ có thể tái diễn hoặc tiến triển.","!Chờ kết quả tryptase mới điều trị|30|Xét nghiệm không được làm trì hoãn xử trí phản vệ.","!Cho uống thuốc kháng histamin thay cho adrenalin|2|Không xử trí được sốc hoặc tắc nghẽn đường thở."],"teach":"Khởi phát nhanh sau dùng thuốc, tổn thương da-niêm mạc kèm khó thở và tụt huyết áp gợi ý phản vệ nặng. Ngừng tác nhân, kích hoạt cấp cứu và dùng adrenalin theo hướng dẫn hiện hành là ưu tiên; không chờ xét nghiệm. Kháng histamin không thay thế điều trị đầu tay; YHCT không được làm chậm hồi sức.","hbu":{"tien_su":"Từng nổi mẩn sau thuốc giảm đau không rõ tên, có hen nhẹ từ nhỏ và hiện không dùng thuốc thường xuyên. Thuốc vừa tiêm đang được kiểm tra trên hồ sơ; chưa có tiền sử gia đình hoặc điều trị YHCT.","luoc_qua_co_quan":"Da-niêm mạc có mày đay lan rộng, đỏ da và phù môi; hô hấp có khàn tiếng, nghẹn họng, thở rít và khò khè. Tuần hoàn có tụt huyết áp, mạch nhanh nhỏ, chi lạnh; thần kinh có choáng váng, mắt tối khi ngồi dậy, tiêu hóa có đau quặn bụng và buồn nôn. Chưa có dữ kiện tiết niệu hoặc cơ xương khớp; lưỡi đỏ và mạch sác là dấu YHCT đã ghi nhận nhưng không được làm chậm cấp cứu.","tom_tat":"Nữ 34 tuổi, khoảng 10 phút sau tiêm thuốc mới xuất hiện mày đay, phù môi, khàn tiếng, khó thở và choáng, kèm đau quặn bụng, buồn nôn. Huyết áp 76/42 mmHg, mạch 128 lần/phút, nhịp thở 30 lần/phút, SpO2 88%, thở rít và ran rít hai phổi; còn đáp ứng nhưng yếu, chi lạnh, ECG nhịp nhanh xoang. Có tiền sử hen nhẹ và nổi mẩn sau thuốc giảm đau chưa rõ tên; lưỡi đỏ, mạch nhanh nhỏ.","dat_van_de":"Phản ứng đa cơ quan khởi phát nhanh sau tiêm thuốc, có tổn thương da-niêm mạc, nguy cơ tắc đường thở trên, co thắt phế quản và suy tuần hoàn. Có tiền căn phản ứng với thuốc chưa xác định và bệnh đường thở. Chứng trạng YHCT gồm chi lạnh, mạch nhanh nhỏ trong bối cảnh suy sụp cấp; lưỡi đỏ và mạch sác cần đối chiếu trước khi quy kết hàn chứng.","bien_luan":"Phản vệ nặng sau dùng thuốc phù hợp với khởi phát trong 10 phút, mày đay-phù môi, suy hô hấp và tụt huyết áp; khàn tiếng, nghẹn họng và thở rít báo động đường thở trên. Cơn hen đơn thuần không giải thích tốt mày đay, phù môi và sốc; ngất phản xạ ít phù hợp với tổn thương da và đường thở. Phù mạch đơn độc ít phù hợp với toàn bộ bệnh cảnh, nhưng cần đánh giá đường thở liên tục; xác minh tên thuốc và lấy tryptase theo điều kiện cơ sở, không chờ kết quả để hồi sức. Theo khóa YHCT, bệnh danh Quá mẫn, quyết chứng, bát cương Lý hư hàn, dương khí muốn thoát, thể dương khí thoát/vong dương, pháp cấp cứu YHHĐ trước rồi mới cân nhắc hồi dương cố thoát; nhận định này cần thẩm định vì dấu lưỡi và mạch chưa hoàn toàn khớp.","sinh_ly_benh":"Phóng thích các chất trung gian phản ứng toàn thân gây giãn mạch, thoát dịch khỏi lòng mạch, phù đường thở và co thắt phế quản, dẫn đến tụt huyết áp và giảm oxy máu. Tiền sử hen cần được lưu ý khi đánh giá hô hấp, nhưng chưa xác định cơ chế hoặc hoạt chất gây phản ứng. Theo lý luận YHCT được gán cho ca, chi lạnh và mạch nhỏ được quy chiếu với dương khí suy thoát; không đồng nhất quy chiếu này với chẩn đoán sinh lý bệnh hiện đại.","tien_luong":"Gần rất nặng vì đường thở có thể xấu nhanh, đồng thời có suy hô hấp và tụt huyết áp; nguy cơ tái diễn phản ứng cần được theo dõi. Xa phụ thuộc xác định tác nhân, quản lý hen và phòng tái phơi nhiễm. Biện chứng YHCT phải đánh giá lại sau hồi sức, không mặc nhiên giữ thể vong dương khi đã ổn định.","du_phong":"Ghi nhận đầy đủ tên thuốc khi xác minh được, thời điểm phản ứng và điều trị, theo dõi tại cơ sở y tế theo hướng dẫn phản vệ. Sau ổn định, khám dị ứng và đánh giá lại hen, cập nhật hồ sơ hoặc thẻ dị ứng, thông báo phản ứng trước mọi lần dùng thuốc. Không tự thử lại thuốc nghi ngờ, dùng thuốc thang hoặc bấm huyệt thay cấp cứu; khó thở, khàn tiếng hay choáng tái diễn phải được xử trí ngay."},"nguon":["Bộ Y tế, Thông tư 51/2017/TT-BYT hướng dẫn phòng, chẩn đoán và xử trí phản vệ, 2017.","World Allergy Organization, Anaphylaxis Guidance, 2020."],"status":"draft"},{"id":"dot-quy-thieu-mau-cap","title":"Yếu liệt nửa người khởi phát đột ngột","kind":"Cấp cứu","level":"Khó","group":"capcuu","place":"Khoa Cấp cứu","clock":"16:40","name":"Bà Nguyễn Thị Sen","age":70,"sex":"nữ","intro":"Người nhà đưa đến vì đột ngột méo miệng, nói khó và yếu tay chân phải. Lần cuối còn bình thường được ghi nhận lúc 16:00. Có tiền sử tăng huyết áp và rung nhĩ.","vitals":{"hr":112,"sbp":184,"dbp":102,"rr":20,"t":36.8,"spo2":96},"ask":[["Thời điểm cuối cùng người bệnh còn bình thường là khi nào?","Người nhà xác nhận lúc 16:00 người bệnh vẫn nói và đi lại bình thường.","e"],["Triệu chứng khởi phát đột ngột hay tăng dần?","Khởi phát đột ngột khi đang ngồi xem tivi.","e"],["Có yếu hoặc tê một bên người không?","Yếu tay chân phải, cầm rơi đồ vật.","e"],["Có méo miệng, nói khó hoặc không hiểu lời nói không?","Méo miệng và nói khó; vẫn hiểu câu hỏi.","e"],["Có đau đầu dữ dội, co giật hoặc mất ý thức không?","Không đau đầu dữ dội, không co giật, không mất ý thức.","e"],["Có tiền sử rung nhĩ hoặc dùng thuốc chống đông không?","Có rung nhĩ; gia đình chưa rõ tên thuốc đang dùng.","e"],["Có đái tháo đường hoặc từng hạ đường huyết không?","Chưa được chẩn đoán đái tháo đường.","n"],["Người bệnh có nuốt được nước an toàn không?","Chưa thử cho uống; người bệnh nói khó và chảy dãi nhẹ.","n"]],"exam":[["V","Mặt","Lệch nhân trung, méo miệng khi cười.","e"],["V","Tri giác","Tỉnh, tiếp xúc được, làm theo một số yêu cầu.","n"],["V","Vận động","Tay phải rơi khi giơ lên; chân phải yếu.","e"],["M","Ngôn ngữ","Nói khó, phát âm không rõ; hiểu lời đơn giản.","e"],["M","Đường thở","Tự thở, có ít nước bọt đọng; cần lưu ý nguy cơ sặc.","n"],["T","Mạch (thiết)","Không đều, nhanh; mạch huyền sác.","e"],["V","Quan sát lưỡi","Lưỡi hơi lệch, rêu trắng mỏng.","e"],["K","Khám thần kinh khu trú","Yếu nửa người phải, không cứng gáy; cần lượng giá mức độ thiếu hụt theo quy trình.","e"]],"tests":[["Đường huyết mao mạch",2,"7,2 mmol/L; không giải thích được thiếu hụt thần kinh.","e"],["CT sọ não không cản quang khẩn",15,"Chưa thấy xuất huyết nội sọ; tiếp tục đánh giá theo quy trình đột quỵ.","e"],["Điện tâm đồ",5,"Rung nhĩ với đáp ứng thất nhanh.","e"],["Công thức máu, đông máu, điện giải và chức năng thận",15,"Đang xử lý khẩn; cần kết quả theo quy trình trước quyết định điều trị.","n"],["CT bụng có cản quang",30,"Không có chỉ định trong đánh giá ban đầu đột quỵ cấp.","w"]],"opt":{"ydx":["+Đột quỵ não cấp, nghi thiếu máu não do rung nhĩ","Xuất huyết não đã chắc chắn","Liệt dây VII ngoại biên đơn thuần","Hạ đường huyết có triệu chứng","Cơn migraine có triệu chứng thần kinh"],"bd":["+Trúng phong kinh lạc","Đầu thống","Huyễn vựng đơn thuần","Nuy chứng","Trúng phong tạng phủ"],"bc":["+Lý thực nhiệt, bản hư tiêu thực","Biểu hư hàn","Biểu thực hàn","Lý hư hàn","Lý hư nhiệt"],"the":["+Phong đàm trở lạc, can dương thượng cang","Khí huyết lưỡng hư","Thận âm hư","Tỳ vị hư hàn","Thấp nhiệt hạ chú"],"phap":["+Cấp cứu đột quỵ trước, sau đó bình can tức phong, hóa đàm thông lạc","Bổ khí huyết thay chụp não","Ôn dương cứu nghịch","Sơ phong giải biểu","Thanh nhiệt giải độc"],"phuong":["+Thiên ma câu đằng ẩm gia giảm (chỉ sau ổn định)","Bổ dương hoàn ngũ thang ngay trước chụp não","Bạch hổ thang","Quy tỳ thang","Lục vị địa hoàng hoàn"],"huyet":["+Bách hội","+Khúc trì","+Hợp cốc","+Phong long","+Túc tam lý","Thiên khu","Thái uyên","Trung quản"]},"actions":["++Kích hoạt quy trình đột quỵ và ghi nhận chính xác thời điểm cuối bình thường|1|Thời gian quyết định khả năng điều trị tái tưới máu.","++Đánh giá ABC, monitor, thiết lập đường truyền và lượng giá thần kinh|3|Theo dõi diễn tiến và bảo đảm an toàn ban đầu.","++Đo đường huyết mao mạch ngay|2|Loại trừ hạ đường huyết giả đột quỵ.","++Chụp CT sọ não khẩn và hội chẩn nhóm đột quỵ|15|Phân biệt xuất huyết và thiếu máu, đánh giá điều trị phù hợp.","+Giữ nhịn ăn uống đến khi sàng lọc nuốt an toàn|1|Giảm nguy cơ sặc.","+Thu thập danh sách thuốc chống đông và bệnh sử rung nhĩ|3|Ảnh hưởng quyết định điều trị cấp.","!Cho uống nước hoặc thuốc khi chưa đánh giá nuốt|1|Nguy cơ sặc do rối loạn nuốt.","!Châm cứu hoặc xoa bóp mạnh trước khi kích hoạt quy trình đột quỵ|10|Trì hoãn chẩn đoán và điều trị có tính thời gian."],"teach":"Ghi chính xác lần cuối còn bình thường, kích hoạt quy trình đột quỵ, kiểm tra đường huyết và chụp sọ não khẩn. Rung nhĩ và thiếu hụt thần kinh khu trú làm tăng nghi ngờ đột quỵ nhưng chưa tự xác định thể bệnh. Chưa cho ăn uống khi chưa sàng lọc nuốt; YHCT chỉ cân nhắc sau đánh giá và ổn định.","hbu":{"tien_su":"Có tăng huyết áp và rung nhĩ; gia đình chưa rõ thuốc đang dùng, đặc biệt tình trạng dùng chống đông. Chưa được chẩn đoán đái tháo đường; tiền sử đột quỵ và gia đình chưa có dữ kiện. Chưa đủ thông tin xác định chứng hư nền hoặc tiền căn đàm chứng theo YHCT.","luoc_qua_co_quan":"Thần kinh có méo miệng, nói khó, yếu nửa người phải, còn tỉnh và hiểu lời đơn giản; không đau đầu dữ dội, co giật, mất ý thức hoặc cứng gáy. Tim mạch có nhịp nhanh không đều và huyết áp cao; hô hấp tự thở, có nước bọt đọng và nguy cơ sặc, chức năng nuốt chưa được đánh giá. Tiêu hóa ngoài vấn đề nuốt, tiết niệu và cơ xương khớp chưa có dữ kiện. YHCT ghi nhận lưỡi hơi lệch, rêu trắng mỏng và mạch huyền sác.","tom_tat":"Nữ 70 tuổi, tiền sử tăng huyết áp và rung nhĩ, khởi phát đột ngột méo miệng, nói khó và yếu tay chân phải; lần cuối bình thường lúc 16:00. Còn tỉnh, hiểu lời đơn giản, tay phải rơi khi giơ, chân phải yếu, huyết áp 184/102 mmHg; CT chưa thấy xuất huyết, glucose 7,2 mmol/L, ECG ghi nhận rung nhĩ đáp ứng thất nhanh. Không đau đầu dữ dội, co giật, mất ý thức hoặc cứng gáy; chưa xác định nuốt an toàn. Theo YHCT, biểu hiện phù hợp bệnh danh trúng phong kinh lạc, nhưng căn cứ cho phong đàm, can dương và nhiệt chứng còn hạn chế.","dat_van_de":"Hội chứng thần kinh khu trú khởi phát đột ngột ở nửa người phải, kèm rối loạn phát âm và nguy cơ sặc, trên nền huyết áp cao và rối loạn nhịp nhanh không đều. Chứng trạng YHCT gồm khẩu nhãn lệch, bán thân bất toại khi còn tỉnh và mạch huyền sác; cần làm rõ dấu phong, đàm, nhiệt và bản hư.","bien_luan":"Khởi phát đột ngột với thiếu hụt thần kinh khu trú, CT chưa thấy xuất huyết và có rung nhĩ phù hợp đột quỵ não cấp nghi thiếu máu não do nguồn thuyên tắc tim, nhưng CT sớm chưa xác nhận nhồi máu hoặc nguyên nhân. Hạ đường huyết không phù hợp với glucose 7,2 mmol/L; liệt sau co giật ít gợi ý vì không ghi nhận cơn, còn xuất huyết nội sọ hiện chưa được thấy trên CT. Cần lượng giá NIHSS, xác minh giờ đến viện và thuốc chống đông, chụp mạch não tìm tắc mạch lớn, xét nghiệm theo quy trình tái thông và sàng lọc nuốt; không chờ xét nghiệm không thiết yếu làm chậm xử trí. YHCT theo các khóa ca là Trúng phong kinh lạc, Lý–Thực–Nhiệt, bản hư tiêu thực, thể Phong đàm trở lạc, Can dương thượng cang; cấp cứu trước, sau ổn định mới cân nhắc bình can tức phong, hóa đàm thông lạc và đối chiếu lại biện chứng.","sinh_ly_benh":"Tắc động mạch não làm giảm tưới máu, gây thiếu năng lượng tế bào và tổn thương thần kinh; rung nhĩ có thể tạo huyết khối trong tim rồi gây thuyên tắc não. Cơ chế này đang được nghi ngờ, chưa được xác nhận bằng khảo sát mạch và nguồn thuyên tắc. Theo YHCT, phong đàm trở lạc và can dương thượng cang được dùng để giải thích rối loạn vận động, nhưng dữ kiện chứng trạng cần bổ sung.","tien_luong":"Gần: dè dặt vì thiếu hụt thần kinh cấp và nguy cơ sặc, phụ thuộc mức tổn thương, thời gian đến viện và khả năng tái thông. Xa: có nguy cơ di chứng vận động, rối loạn lời nói và tái phát nếu yếu tố nguy cơ không được kiểm soát. Tiên lượng phục hồi theo YHCT cần phối hợp đánh giá chức năng hiện đại, không dựa riêng vào lưỡi mạch.","du_phong":"Giữ nhịn ăn uống đến khi sàng lọc nuốt an toàn, sau ổn định tuân thủ kế hoạch kiểm soát huyết áp, rung nhĩ và phục hồi chức năng của chuyên khoa. YHCT chỉ hỗ trợ sau đánh giá an toàn, không thay dự phòng thuyên tắc hoặc làm chậm tái thông. Tái khám theo hẹn; gọi cấp cứu ngay khi tái xuất hiện méo miệng, yếu chi hoặc nói khó."},"nguon":["AHA/ASA, Guideline for the Early Management of Patients With Acute Ischemic Stroke, 2026.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"ha-duong-huyet-nang","title":"Rối loạn tri giác do hạ đường huyết nặng","kind":"Cấp cứu","level":"Dễ","group":"capcuu","place":"Khoa Cấp cứu","clock":"05:50","name":"Ông Trần Văn Bảy","age":58,"sex":"nam","intro":"Người nhà phát hiện người bệnh vã mồ hôi, run, lơ mơ lúc gần sáng. Người bệnh mắc đái tháo đường type 2, đang dùng thuốc hạ đường huyết; tối qua ăn ít nhưng vẫn dùng thuốc như thường lệ.","vitals":{"hr":116,"sbp":102,"dbp":66,"rr":18,"t":36.4,"spo2":97},"ask":[["Triệu chứng được phát hiện lúc nào?","Người nhà phát hiện khoảng 20 phút trước khi đến viện.","e"],["Người bệnh đã ăn uống thế nào tối qua?","Ăn rất ít vì buồn nôn.","e"],["Có dùng thuốc điều trị đái tháo đường không?","Có uống thuốc như thường lệ nhưng gia đình chưa nhớ tên.","e"],["Có run, vã mồ hôi, đói cồn cào hoặc hồi hộp không?","Run tay, vã mồ hôi và tim đập nhanh.","e"],["Có co giật, ngất hoặc lú lẫn không?","Lơ mơ, trả lời chậm; không ghi nhận co giật.","e"],["Đã từng có cơn hạ đường huyết chưa?","Từng run vã mồ hôi khi bỏ bữa, chưa phải nhập viện.","n"],["Có sốt, ho hoặc đau ngực không?","Không sốt, không ho, không đau ngực.","n"],["Có thể tự nuốt an toàn lúc này không?","Không trả lời mạch lạc, không làm theo yêu cầu nuốt.","e"]],"exam":[["V","Da","Da ẩm, vã mồ hôi.","e"],["V","Tri giác","Lơ mơ, gọi mở mắt, định hướng kém.","e"],["V","Run","Run đầu chi.","e"],["M","Lời nói","Nói chậm, câu trả lời không phù hợp.","n"],["M","Hơi thở","Không có mùi ceton rõ; thở đều.","n"],["T","Mạch (thiết)","Nhanh, đều.","e"],["V","Quan sát lưỡi","Lưỡi ẩm, rêu trắng mỏng; dữ kiện không thay thế đo glucose.","e"],["K","Thần kinh và nuốt","Không thấy yếu liệt khu trú rõ; phản xạ bảo vệ đường thở giảm do lơ mơ.","e"]],"tests":[["Đường huyết mao mạch tại giường",1,"2,1 mmol/L.","e"],["Điện tâm đồ",5,"Nhịp nhanh xoang.","n"],["Điện giải, ure và creatinin",20,"Đang chờ; đánh giá yếu tố nguy cơ tái hạ đường huyết và bệnh kèm.","n"],["HbA1c",30,"Chưa có kết quả; không cần chờ để xử trí cơn cấp.","n"],["CT sọ não",25,"Không phải bước đầu nếu tri giác cải thiện sau xử trí hạ đường huyết và không có dấu khu trú/chấn thương.","w"]],"opt":{"ydx":["+Hạ đường huyết nặng có rối loạn tri giác","Nhiễm toan ceton do đái tháo đường","Đột quỵ não chắc chắn","Ngộ độc opioid","Tăng áp lực nội sọ"],"bd":["+Quyết chứng do hạ đường huyết","Tiêu khát","Huyễn vựng mạn","Tâm quý","Trúng phong"],"bc":["+Lý hư","Biểu thực nhiệt","Biểu hư hàn","Lý thực nhiệt","Lý hư nhiệt"],"the":["+Tỳ khí hư, tinh khí không nuôi dưỡng thanh khiếu","Can dương thượng cang","Thận âm hư","Đàm nhiệt nhiễu tâm","Phong hàn phạm biểu"],"phap":["+Bù glucose cấp cứu, sau tỉnh ích khí kiện tỳ","Ôn trung tán hàn bằng thuốc uống ngay","Thanh nhiệt tả hỏa","Bình can tức phong","Hóa đàm khai khiếu thay bù glucose"],"phuong":["+Tứ quân tử thang (sau tỉnh, hỗ trợ)","Lý trung hoàn","Bạch hổ thang","Long đởm tả can thang","Ngân kiều tán"],"huyet":["+Nhân trung","+Nội quan","+Túc tam lý","+Tỳ du","+Bách hội","Hợp cốc","Thái xung","Thiên khu"]},"actions":["++Đánh giá ABC, bảo vệ đường thở và đo glucose mao mạch ngay|1|Tri giác giảm và có biểu hiện giao cảm.","++Bù glucose bằng đường phù hợp khi người bệnh không nuốt an toàn, theo quy trình cơ sở|2|Hạ đường huyết nặng; tránh cho uống gây sặc.","++Đánh giá lại tri giác và glucose sau xử trí, theo dõi tái hạ đường huyết|5|Nguy cơ tái diễn, nhất là khi thuốc còn tác dụng.","+Rà soát thuốc, bữa ăn, chức năng thận và nguyên nhân bỏ bữa|5|Tìm nguyên nhân để phòng tái phát.","+Theo dõi và lập kế hoạch ăn uống/điều chỉnh thuốc sau khi tỉnh, có người phụ trách chuyên môn|10|Ngăn tái hạ đường huyết.","!Cho uống nước đường khi người bệnh lơ mơ và nuốt không an toàn|1|Nguy cơ sặc và tắc đường thở.","!Cho tiêm thêm thuốc hạ đường huyết vì đường huyết dao động|1|Làm nặng thêm hạ đường huyết.","!Châm cứu trước khi xác nhận và xử trí glucose thấp|10|Trì hoãn can thiệp nguyên nhân cấp cứu."],"teach":"Lơ mơ, run và vã mồ hôi ở người dùng thuốc hạ đường huyết cần đo glucose ngay. Với rối loạn tri giác, không cho ăn hoặc uống; chọn đường bù glucose phù hợp và theo dõi đáp ứng cũng như tái hạ đường huyết. Sau ổn định cần rà lại thuốc, bữa ăn và yếu tố nguy cơ.","hbu":{"tien_su":"Có đái tháo đường type 2, dùng thuốc hạ đường huyết chưa rõ tên; tối trước ăn ít do buồn nôn nhưng vẫn dùng thuốc như thường lệ. Từng run và vã mồ hôi khi bỏ bữa, chưa nhập viện vì các đợt đó. Tiền sử gia đình, bệnh thận và các biểu hiện tỳ khí hư trư
