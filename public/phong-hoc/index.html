 một lần nhập viện; dùng tiotropium và formoterol/budesonid nhưng thỉnh thoảng bỏ liều; chưa dùng oxy tại nhà.","e"],["Hút thuốc lá bao nhiêu?","Hút 40 gói-năm, còn hút vài điếu mỗi ngày.","e"],["Có lú lẫn, ngủ gà, đau đầu buổi sáng không?","Từ sáng ngủ gà, hỏi chậm, gia đình lo lắng.","e"],["Có phù chân, tăng cân, đau ngực, hồi hộp, tiền sử suy tim không?","Phù nhẹ hai cổ chân, không suy tim đã biết.","e"],["Đã tự dùng thuốc nào, có thở oxy lưu lượng cao tại nhà không?","Xịt thuốc nhiều lần, không có oxy tại nhà.","n"],["Dị ứng thuốc?","Không dị ứng thuốc.","n"]],"exam":[["K","Hô hấp: nhịp thở và cơ hô hấp phụ","Thở 28 l/p, co kéo cơ hô hấp phụ, thở chúm môi, lồng ngực hình thùng.","e"],["K","Phổi nghe","Rì rào phế nang giảm, ran rít, ran ngáy hai phổi, vài ran ẩm đáy phải.","e"],["K","Tri giác","Ngủ gà nhưng gọi tỉnh, run vẫy tay (flapping), da hồng, giãn mạch ngoại vi.","e"],["K","Tim và phù","Tim nhanh đều 108 l/p, T2 mạnh ở ổ van động mạch phổi; phù nhẹ hai cổ chân.","e"],["K","Bụng","Mềm, không điểm đau.","n"]],"tests":[["Khí máu động mạch (ghi rõ FiO2)",10,"Khí trời: pH 7,29; PaO2 52 mmHg; PaCO2 68 mmHg; HCO3 32 mmol/L; lactate 1,6: toan hô hấp cấp trên nền tăng CO2 mạn.","e"],["X-quang ngực thẳng",10,"Phổi tăng sáng, cơ hoành dẹt, nhóm mờ đáy phải; không tràn khí màng phổi.","e"],["Công thức máu, CRP, điện giải, creatinin",10,"Bạch cầu 14,6 G/L, bạch cầu đa nhân 84%, CRP 62 mg/L; Hb 168 g/L; creatinin bình thường.","e"],["Điện tim",10,"Nhịp xoang nhanh 108 l/p, P phế (P cao ở DII), không rối loạn nhịp.","e"],["Soi và cấy đờm; troponin, NT-proBNP",10,"Đờm mủ; troponin bình thường; NT-proBNP 410 pg/mL (không ủng hộ suy tim cấp).","e"],["CT mạch máu phổi cản quang cho mọi đợt cấp COPD",40,"Không có chỉ định thường quy nếu không nghi thuyên tắc; không ưu tiên.","w"]],"opt":{"ydx":["Hen phế quản cơn nặng","Thuyên tắc phổi cấp","Suy tim cấp phù phổi","+Đợt cấp COPD nặng kèm suy hô hấp tăng CO2 cấp trên mạn do nhiễm khuẩn phế quản phổi"],"oxy_muc_tieu":["+Oxy qua mặt nạ Venturi 24–28% (hoặc canula thấp lưu lượng) duy trì SpO2 88–92% và kiểm tra khí máu lại sau 30–60 phút","Oxy lưu lượng cao 15 L/phút để SpO2 lên 100%","Không thở oxy vì sợ tăng CO2","Chỉ dùng thuốc, không oxy"],"thong_khi":["Đặt nội khí quản ngay cho mọi đợt cấp","+Thông khí không xâm nhập (BiPAP) khi pH dưới 7,35 và PaCO2 trên 45 mmHg dù đã điều trị nội khoa tối ưu ban đầu hoặc có co kéo, nhịp thở trên 25","Chỉ khí dung, không cần thông khí","Thở máy xâm nhập kéo dài là lựa chọn đầu tay"],"thuoc_phoi_hop":["Chỉ kháng sinh, không giãn phế quản","Corticoid liều cao kéo dài 4 tuần","+Khí dung đồng vận beta-2 tác dụng ngắn kết hợp kháng cholinergic, prednisolon 40 mg/ngày trong 5 ngày, kháng sinh khi có đờm mủ tăng và khó thở tăng","Thuốc an thần để dễ thở"]},"actions":["++Thở oxy Venturi mục tiêu SpO2 88–92%, monitor và lặp lại khí máu sau 30–60 phút|2|Tránh thở oxy quá mức làm nặng tăng CO2; cần kiểm tra khí máu.","++Thông khí không xâm nhập (BiPAP) vì pH 7,29 và PaCO2 68 với ngủ gà|2|Giảm tử vong và đặt nội khí quản ở đợt cấp COPD toan hô hấp.","++Phun khí dung salbutamol kèm ipratropium mỗi 4–6 giờ|2|Giãn phế quản, giảm ứ khí.","++Prednisolon 40 mg uống hoặc methylprednisolon tương đương trong 5 ngày|2|Rút ngắn thời gian hồi phục và giảm tái phát.","++Kháng sinh theo kinh nghiệm (amoxicillin–clavulanat) và cấy đờm|2|Đờm mủ, khó thở và lượng đờm tăng (Anthonisen loại 1).","-Dùng thuốc lợi tiểu liều cao thường quy|1|Không có bằng chứng suy tim cấp; NT-proBNP thấp.","!Cho thở oxy lưu lượng cao 10 L/phút qua mặt nạ|0|Giảm đáp ứng hô hấp và tăng thông khí không tương xứng làm tăng CO2.","!Tiêm thuốc an thần để dễ thở|0|Ức chế hô hấp, có thể dẫn đến ngừng thở."],"teach":"Đợt cấp COPD có toan hô hấp cần oxy mục tiêu 88–92%, thông khí không xâm nhập khi pH dưới 7,35 kèm PaCO2 trên 45; điều trị bằng giãn phế quản, corticoid ngắn ngày và kháng sinh khi có dấu hiệu nhiễm khuẩn.","hbu":{"hanh_chinh":"Ông C. H. B. (mô phỏng), nam, 70 tuổi, hưu trí; vào cấp cứu buổi sáng.","ly_do_vao_vien":"Khó thở tăng, ho đờm đục, ngủ gà.","benh_su":"Ông có COPD 8 năm, ba đợt cấp năm qua. Ba ngày nay khó thở tăng dần, ho nhiều, đờm chuyển vàng đục và tăng gấp đôi, sốt nhẹ, khò khè nhiều. Sáng nay ngủ gà, hỏi chậm. Không đau ngực kiểu màng phổi, không hồi hộp.","tien_su":"COPD GOLD nhóm E dùng tiotropium và formoterol/budesonid không đều; hút 40 gói-năm, còn hút; một lần nhập viện đợt cấp; không suy tim đã biết; không dị ứng thuốc.","luoc_qua_co_quan":"Phù nhẹ hai cổ chân; không đau bụng; không tiêu chảy; không dấu hiệu thần kinh khu trú; không ho ra máu.","kham_hien_tai":"Ngủ gà, gọi tỉnh, run vẫy tay; mạch 108 l/p, huyết áp 142/84 mmHg, nhịp thở 28 l/p, nhiệt 37,9 độ C, SpO2 84% khí trời. Lồng ngực hình thùng, co kéo, thở chúm môi; ran rít, ran ngáy, vài ran ẩm đáy phải; T2 mạnh ổ phổi; phù nhẹ cổ chân.","can_lam_sang":"Khí máu pH 7,29; PaO2 52; PaCO2 68; HCO3 32. X-quang tăng sáng, mờ đáy phải. Bạch cầu 14,6 G/L, CRP 62. Điện tim P phế. NT-proBNP 410 pg/mL, troponin bình thường.","tom_tat":"Nam 70 tuổi hút thuốc lâu năm, COPD GOLD E, đợt cấp: khó thở, đờm mủ tăng, sốt nhẹ, SpO2 84%, ngủ gà, khí máu toan hô hấp cấp trên nền tăng CO2 mạn (pH 7,29, PaCO2 68, HCO3 32), bạch cầu và CRP tăng.","dat_van_de":"1) Đợt cấp COPD nặng (Anthonisen loại 1). 2) Suy hô hấp type 2 với toan hô hấp. 3) Rối loạn tri giác do tăng CO2. 4) Loại trừ yếu tố thúc đẩy khác: thuyên tắc phổi, suy tim, tràn khí. 5) Kế hoạch dự phòng.","chan_doan_so_bo":"Đợt cấp COPD nặng, suy hô hấp type 2 cấp trên mạn, nghi nhiễm khuẩn phế quản–phổi.","bien_luan":"Tiền sử COPD với khó thở tăng, đờm tăng số lượng và đục (đủ ba triệu chứng Anthonisen: tăng khó thở, tăng lượng đờm, đờm mủ) nên là đợt cấp loại 1, ủng hộ dùng kháng sinh. Mức nặng thể hiện ở nhịp thở 28, co kéo, SpO2 84% và rối loạn tri giác. Khí máu pH 7,29, PaCO2 68 cho thấy toan hô hấp cấp; HCO3 32 phản ánh bù trừ mạn nên là tăng CO2 cấp trên mạn. Chỉ định thông khí không xâm nhập vì pH dưới 7,35 và PaCO2 trên 45 kèm co kéo, ngủ gà (không có chống chỉ định như ngưng thở, tắc đờm nhiều, sốc). Hen phế quản ít nghĩ vì tuổi, hút thuốc, tiền sử COPD. Suy tim cấp ít nghĩ vì NT-proBNP không cao, X-quang không phù phổi. Thuyên tắc phổi cần nghĩ nhưng chưa ưu tiên vì nguyên nhân nhiễm khuẩn rõ, không sưng chân một bên; làm CT khi không đáp ứng. Cần đánh giá viêm phổi kèm theo (mờ đáy phải trên X-quang).","sinh_ly_benh":"Hút thuốc gây viêm mạn, phá hủy phế nang và hẹp đường thở nhỏ, làm giảm lưu lượng thở ra, ứ khí và giảm trao đổi khí. Nhiễm khuẩn gây viêm cấp, tăng tiết đờm, phù nề, co thắt, làm tăng sức cản đường thở và ứ khí động. Bất tương xứng thông khí–tưới máu và giảm thông khí phế nang gây giảm oxy máu và tăng CO2; thận giữ bicarbonat bù trừ nên HCO3 cao. Cơ hô hấp mệt dẫn đến toan hô hấp cấp và rối loạn tri giác.","chan_doan_phan_biet":"Hen phế quản; suy tim cấp; thuyên tắc phổi; viêm phổi nặng; tràn khí màng phổi; giãn phế quản bội nhiễm.","chan_doan_xac_dinh":"Đợt cấp COPD nặng GOLD E, suy hô hấp type 2 cấp trên mạn, bội nhiễm; nghi viêm phổi đáy phải đi kèm.","dieu_tri":"Oxy Venturi 24–28% giữ SpO2 88–92%; BiPAP với áp lực hỗ trợ khởi đầu IPAP 10–12, EPAP 4–5 và theo dõi khí máu sau 1–2 giờ; khí dung salbutamol + ipratropium; prednisolon 40 mg/ngày x 5 ngày; kháng sinh (amoxicillin–clavulanat hoặc theo kháng sinh đồ), cấy đờm; theo dõi tri giác, dịch, đường huyết; nhập hồi sức nếu không cải thiện hoặc cần thở máy. Ra viện: tối ưu thuốc hít kép/ba, phục hồi chức năng hô hấp.","tien_luong":"Dè dặt; nguy cơ tái đợt cấp cao; tử vong tăng khi cần thở máy xâm nhập.","du_phong":"Ngừng thuốc lá, dùng thuốc hít đúng kỹ thuật (LAMA/LABA ± ICS), tiêm vắc xin cúm và phế cầu, phục hồi chức năng, đánh giá oxy dài hạn, kế hoạch hành động và tái khám sau 1–4 tuần."},"nguon":["Hướng dẫn chẩn đoán và điều trị bệnh phổi tắc nghẽn mạn tính, Bộ Y tế Việt Nam, 2018.","Global Initiative for Chronic Obstructive Lung Disease (GOLD) report, bản cập nhật hiện hành.","Giáo trình Nội khoa, Bộ môn Nội, Trường Đại học Y Dược TPHCM, phần Bệnh phổi tắc nghẽn mạn tính."],"status":"nhap"},{"id":"noi-ho-hap-003","title":"Sốt, ho đờm rỉ sắt và đau ngực kiểu màng phổi","kind":"Nội","level":"Dễ","group":"noi","name":"Bà M. T. T. (mô phỏng)","age":66,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Bà nhập khoa Nội vì sốt cao, ho đờm rỉ sắt và đau ngực bên phải bốn ngày.","vitals":{"hr":100,"sbp":120,"dbp":72,"rr":24,"t":38.9,"spo2":93},"ask":[["Sốt và ho bắt đầu khi nào, đờm thế nào?","Bốn ngày nay sốt rét run 38,5–39 độ C, ho đờm màu rỉ sắt.","e"],["Có đau ngực không, đau thay đổi theo hơi thở?","Đau nhói ngực phải dưới, tăng khi hít sâu và ho.","e"],["Có khó thở, lú lẫn, tiểu ít không?","Hơi khó thở khi đi lại; tỉnh táo, tiểu bình thường.","e"],["Bệnh nền: COPD, tim, đái tháo đường, bệnh thận, ung thư?","Tăng huyết áp, đái tháo đường típ 2 uống metformin; không COPD.","e"],["Gần đây có nhập viện, dùng kháng sinh trong 90 ngày, hoặc ở cơ sở chăm sóc dài hạn không?","Không nhập viện, không dùng kháng sinh gần đây.","e"],["Có hút thuốc, uống rượu, sặc, bệnh thần kinh, nghiện không?","Không hút thuốc, không rượu, không sặc.","e"],["Tiêm vắc xin cúm và phế cầu?","Chưa tiêm.","n"],["Có tiếp xúc người ho kéo dài, nghi lao?","Không.","n"]],"exam":[["K","Phổi","Nhịp thở 24 l/p, rung thanh tăng, gõ đục và ran nổ, hội chứng đông đặc vùng đáy phổi phải.","e"],["K","Tim và huyết áp","Tim nhanh đều 100 l/p, huyết áp 120/72 mmHg, không tiếng thổi.","e"],["K","Tri giác","Tỉnh táo, định hướng tốt.","e"],["K","Nhiệt độ, da","Nhiệt 38,9 độ C, mặt đỏ, môi khô, không tím.","e"],["K","Bụng, chân","Bụng mềm; chân không phù, không sưng đau.","n"]],"tests":[["X-quang ngực thẳng nghiêng",10,"Đông đặc thùy dưới phải, có hình ảnh phế quản hơi, góc sườn hoành phải hơi tù.","e"],["Công thức máu, CRP, procalcitonin",10,"Bạch cầu 16,8 G/L, đa nhân 88%; CRP 148 mg/L; procalcitonin 1,2 ng/mL.","e"],["Ure, creatinin, điện giải, glucose",10,"Ure 8,2 mmol/L, creatinin 92 µmol/L, Na 135, glucose 9,4 mmol/L.","e"],["Cấy máu trước kháng sinh, soi và cấy đờm",10,"Gram dương cầu khuẩn đôi, cấy đang chờ; đờm đạt chuẩn.","e"],["SpO2 và khí máu khi cần",10,"SpO2 93% khí trời, PaO2 68 mmHg.","e"],["CT ngực cản quang ngay để xác định chẩn đoán",40,"Không cần ở viêm phổi điển hình khi X-quang đã rõ.","w"]],"opt":{"ydx":["+Viêm phổi cộng đồng thùy dưới phải, nguy cơ trung bình (CURB-65 2 điểm)","Lao phổi tiến triển","Thuyên tắc phổi nhồi máu phổi","Đợt cấp COPD"],"muc_do_nang":["CURB-65 = 0, điều trị ngoại trú","+CURB-65 = 2 (ure trên 7 mmol/L và tuổi từ 65 trở lên): nên nhập viện điều trị, không điều trị ngoại trú","CURB-65 = 4, nhập ICU ngay","Không cần tính điểm vì sốt cao"],"khang_sinh":["Chỉ kháng sinh kháng nấm","Chỉ corticoid","+Phối hợp beta-lactam (ceftriaxon hoặc amoxicillin-clavulanat) với macrolid (azithromycin), thời gian 5–7 ngày nếu cải thiện","Aminoglycosid đơn độc"],"theo_doi":["Không cần theo dõi nếu hết sốt","Chụp CT hàng tuần","Ngừng kháng sinh khi hết ho","+Đánh giá lại sau 48–72 giờ: nhiệt, nhịp thở, SpO2, CRP; chụp X-quang kiểm tra sau 6 tuần nếu có yếu tố nguy cơ"]},"actions":["++Nhập viện, thở oxy nếu SpO2 dưới 92%, đường truyền, theo dõi sinh hiệu|2|CURB-65 2 điểm cần nhập viện; SpO2 93% cần theo dõi sát.","++Cấy máu và lấy đờm trước, rồi kháng sinh sớm trong 4 giờ (ceftriaxon + azithromycin)|2|Điều trị đúng thuốc sớm giảm tử vong.","+Hạ sốt, bù dịch, kiểm soát đường huyết|2|Giảm triệu chứng và kiểm soát bệnh nền.","+Đánh giá đáp ứng sau 48–72 giờ|2|Phát hiện sớm thất bại điều trị.","-Dùng corticoid toàn thân thường quy|1|Không có bằng chứng cho mọi viêm phổi cộng đồng không có sốc.","-Chụp CT ngực cản quang ngay|1|Không cần thiết khi X-quang đủ chẩn đoán.","!Điều trị ngoại trú với thuốc ho|0|Bỏ qua điểm CURB-65 2 điểm, nguy cơ diễn tiến nặng."],"teach":"Viêm phổi cộng đồng điển hình được chẩn đoán bằng lâm sàng (sốt, ho đờm, hội chứng đông đặc) cộng X-quang; chọn nơi điều trị dựa vào CURB-65, kháng sinh sớm phù hợp và đánh giá lại sau 48–72 giờ.","hbu":{"hanh_chinh":"Bà M. T. T. (mô phỏng), nữ, 66 tuổi, hưu trí; nhập khoa Nội.","ly_do_vao_vien":"Sốt, ho đờm rỉ sắt, đau ngực phải.","benh_su":"Bốn ngày nay sốt rét run 38,5–39 độ C, ho đờm màu rỉ sắt, đau nhói ngực phải dưới tăng khi hít sâu và ho. Hai ngày gần đây khó thở nhẹ khi đi lại. Không lú lẫn, không tiểu ít, không nôn máu, không ho ra máu tươi.","tien_su":"Tăng huyết áp; đái tháo đường típ 2 (metformin). Không COPD, không hút thuốc, không nhập viện hoặc dùng kháng sinh gần đây. Chưa tiêm vắc xin cúm và phế cầu.","luoc_qua_co_quan":"Không đau bụng, không tiêu chảy; tiểu bình thường; không đau đầu cứng gáy; không sưng chân.","kham_hien_tai":"Tỉnh, sốt 38,9 độ C, mạch 100 l/p, huyết áp 120/72 mmHg, nhịp thở 24 l/p, SpO2 93%. Phổi phải đáy: rung thanh tăng, gõ đục, ran nổ; tim đều; bụng mềm.","can_lam_sang":"X-quang: đông đặc thùy dưới phải có phế quản hơi. Bạch cầu 16,8 G/L, CRP 148, procalcitonin 1,2. Ure 8,2; creatinin 92; glucose 9,4. Soi đờm: cầu khuẩn Gram dương đôi.","tom_tat":"Nữ 66 tuổi, đái tháo đường, sốt cao, ho đờm rỉ sắt, đau ngực kiểu màng phổi, hội chứng đông đặc đáy phải, X-quang đông đặc thùy dưới, bạch cầu và CRP tăng; CURB-65 2 điểm (ure, tuổi); SpO2 93%.","dat_van_de":"1) Hội chứng nhiễm trùng. 2) Hội chứng đông đặc đáy phổi phải. 3) Đánh giá mức độ nặng và nơi điều trị. 4) Bệnh nền đái tháo đường. 5) Lựa chọn kháng sinh.","chan_doan_so_bo":"Viêm phổi cộng đồng thùy dưới phải, nghi phế cầu, mức độ trung bình (CURB-65 2 điểm).","bien_luan":"Sốt cao rét run khởi phát cấp, ho đờm rỉ sắt, đau ngực kiểu màng phổi và hội chứng đông đặc điển hình (rung thanh tăng, gõ đục, ran nổ) kèm hình đông đặc có phế quản hơi trên X-quang cho phép chẩn đoán viêm phổi thùy do vi khuẩn, thường gặp nhất là phế cầu (soi đờm cầu khuẩn Gram dương đôi ủng hộ). Bạch cầu đa nhân tăng và CRP, procalcitonin tăng cho thấy bản chất vi khuẩn. Mức độ: CURB-65 gồm lú lẫn (0), ure trên 7 mmol/L (1), nhịp thở từ 30 (0), huyết áp tâm thu dưới 90 hoặc tâm trương từ 60 trở xuống (0), tuổi từ 65 (1) tổng 2 điểm, nên nhập viện; chưa có dấu hiệu nặng cần ICU (không sốc, không suy hô hấp nặng). Lao phổi ít nghĩ vì khởi phát cấp, không ho kéo dài; thuyên tắc phổi ít nghĩ vì có sốt, bạch cầu cao và hình đông đặc có phế quản hơi; đợt cấp COPD loại trừ do không bệnh nền. Đái tháo đường là yếu tố nguy cơ nhiễm khuẩn nặng nên cần kiểm soát đường huyết.","sinh_ly_benh":"Vi khuẩn (phế cầu) xâm nhập phế nang qua đường hô hấp, tăng sinh và kích hoạt viêm, huy động bạch cầu đa nhân, dịch rỉ viêm và hồng cầu đổ vào phế nang tạo ra đông đặc. Vùng đông đặc còn tưới máu nhưng không thông khí gây shunt và giảm oxy máu. Viêm lan đến màng phổi gây đau kiểu màng phổi; cytokine gây sốt và đáp ứng viêm toàn thân.","chan_doan_phan_biet":"Lao phổi; thuyên tắc phổi có nhồi máu; ung thư phổi bít tắc kèm viêm; viêm phổi do Mycoplasma; đợt cấp COPD; áp xe phổi.","chan_doan_xac_dinh":"Viêm phổi cộng đồng thùy dưới phải do vi khuẩn (nghi phế cầu), CURB-65 2 điểm; đái tháo đường típ 2; tăng huyết áp.","dieu_tri":"Nhập khoa nội; oxy khi SpO2 dưới 92%; ceftriaxon 1–2 g/ngày tĩnh mạch kết hợp azithromycin 500 mg/ngày (hoặc amoxicillin–clavulanat + macrolid), 5–7 ngày nếu ổn định; hạ sốt, bù dịch; insulin hoặc điều chỉnh thuốc hạ đường huyết, tạm ngưng metformin nếu suy giảm chức năng thận; cấy máu, đờm; đánh giá đáp ứng sau 48–72 giờ; chuyển uống khi hết sốt 24–48 giờ và ăn uống được.","tien_luong":"Tốt nếu đáp ứng kháng sinh; theo dõi biến chứng tràn dịch màng phổi, suy hô hấp, nhiễm khuẩn huyết.","du_phong":"Tiêm vắc xin phế cầu và cúm, kiểm soát đường huyết, không hút thuốc, vệ sinh miệng họng; chụp X-quang kiểm tra sau 6–8 tuần nếu còn triệu chứng hoặc có yếu tố nguy cơ ung thư."},"nguon":["Hướng dẫn chẩn đoán và điều trị viêm phổi cộng đồng ở người lớn, Bộ Y tế Việt Nam, 2016 và bản cập nhật.","ATS/IDSA Guidelines for the diagnosis and treatment of adults with community-acquired pneumonia, 2019.","Giáo trình Nội khoa, Bộ môn Nội, Trường Đại học Y Hà Nội, phần Viêm phổi."],"status":"nhap"},{"id":"noi-ho-hap-004","title":"Khó thở đột ngột, đau ngực kiểu màng phổi sau bó bột chân","kind":"Nội","level":"Khó","group":"noi","name":"Ông L. Q. V. (mô phỏng)","age":52,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Ông đến cấp cứu vì khó thở đột ngột, đau ngực khi hít sâu, ba tuần sau khi bó bột gãy xương cẳng chân trái.","vitals":{"hr":112,"sbp":118,"dbp":74,"rr":28,"t":37.4,"spo2":90},"ask":[["Khó thở bắt đầu thế nào, có đột ngột không?","Đột ngột cách đây 6 giờ khi đi vệ sinh, khó thở tăng dần.","e"],["Đau ngực ra sao, có ho ra máu không?","Đau nhói ngực phải khi hít sâu; ho khan, một lần khạc ít đờm lẫn máu.","e"],["Có sưng đau bắp chân, chân to hơn một bên không?","Cẳng chân trái bó bột ba tuần; ba ngày nay bàn chân và bắp chân sưng đau tăng, bột chật.","e"],["Có ngất, choáng, hồi hộp không?","Choáng khi đứng dậy, không ngất, hơi hồi hộp.","e"],["Yếu tố nguy cơ huyết khối: bất động, phẫu thuật, ung thư, tiền sử huyết khối, hút thuốc?","Bất động ba tuần; không phẫu thuật lớn; không ung thư; không tiền sử huyết khối; hút thuốc 15 gói-năm.","e"],["Bệnh nền: tim, phổi, đái tháo đường, bệnh thận, dị ứng thuốc cản quang?","Không bệnh tim phổi; không đái tháo đường; không dị ứng thuốc cản quang; thận bình thường.","e"],["Đang dùng thuốc dự phòng huyết khối (enoxaparin) khi bó bột không?","Không được dùng thuốc dự phòng.","n"],["Có sốt, ho đờm mủ không?","Không sốt, ho khan.","n"]],"exam":[["K","Hô hấp","Thở nhanh 28 l/p, phổi trong, ít ran ẩm đáy phải, không khò khè.","e"],["K","Tim","Nhịp nhanh đều 112 l/p, T2 mạnh ở ổ động mạch phổi, tĩnh mạch cổ nổi nhẹ, không tiếng thổi.","e"],["K","Chân","Cẳng chân trái sưng căng, đau khi sờ dọc tĩnh mạch sâu, chu vi lớn hơn bên phải 4 cm; bàn chân ấm.","e"],["K","Huyết động","Huyết áp 118/74 mmHg, không sốc, SpO2 90% khí trời.","e"],["K","Bụng","Mềm, không điểm đau.","n"]],"tests":[["Điện tim",10,"Nhịp xoang nhanh 112 l/p, T đảo V1–V3, dấu hiệu S1Q3T3.","e"],["Khí máu động mạch",10,"pH 7,46; PaO2 58; PaCO2 31; A-a gradient tăng.","e"],["hs-troponin, NT-proBNP, D-dimer, công thức máu, creatinin",10,"Troponin 38 ng/L hơi tăng; NT-proBNP 780; D-dimer 4,2 mg/L (không cần để loại trừ khi xác suất cao); creatinin 84 µmol/L.","e"],["Siêu âm tim tại giường",15,"Thất phải giãn (tỉ lệ thất phải/thất trái 1,1), vách liên thất dẹt, TAPSE 14 mm.","e"],["Siêu âm Doppler tĩnh mạch chi dưới",15,"Huyết khối tĩnh mạch khoeo và tĩnh mạch chày sau bên trái, không nén xẹp.","e"],["CT mạch máu phổi (CTPA)",40,"Khuyết thuốc ở động mạch phổi thùy dưới phải và thùy giữa; thất phải giãn.","e"],["Chụp mạch phổi chọn lọc qua catheter làm bước đầu thường quy",10,"Không phải đầu tay khi có CTPA, xâm lấn.","w"]],"opt":{"ydx":["Viêm phổi cộng đồng","+Thuyên tắc phổi cấp nguy cơ trung gian–cao, huyết khối tĩnh mạch sâu chi dưới trái","Nhồi máu cơ tim cấp","Tràn khí màng phổi tự phát"],"nguy_co":["Nguy cơ thấp, điều trị ngoại trú ngay","Nguy cơ cao, bắt buộc tiêu sợi huyết","+Huyết động ổn định, có rối loạn chức năng thất phải và troponin tăng: nguy cơ trung gian–cao; chống đông ngay, theo dõi sát, chuẩn bị tái tưới máu nếu mất bù","Không cần phân tầng nguy cơ"],"dieu_tri_chinh":["Chỉ aspirin liều thấp","Chỉ nghỉ ngơi và oxy","Chọc dò màng phổi","+Chống đông ngay: enoxaparin 1 mg/kg mỗi 12 giờ (hoặc heparin không phân đoạn) rồi chuyển thuốc chống đông đường uống, tối thiểu 3 tháng"],"tieu_soi_huyet":["+Chỉ khi huyết động không ổn định (tụt huyết áp kéo dài, sốc, ngừng tim) và không chống chỉ định","Cho mọi người bệnh thuyên tắc phổi","Không bao giờ dùng","Chỉ dùng khi D-dimer cao"]},"actions":["++Ngồi hoặc nằm đầu cao, monitor, thở oxy giữ SpO2 trên 92%|2|Giảm thiếu oxy máu, theo dõi huyết động liên tục.","++Bắt đầu chống đông ngay (enoxaparin 1 mg/kg tiêm dưới da mỗi 12 giờ hoặc UFH tĩnh mạch) trong khi chờ CTPA vì xác suất lâm sàng cao|2|Điều trị sớm giảm tử vong; không chờ xác nhận khi xác suất cao và không chống chỉ định.","++Chụp CT mạch máu phổi và siêu âm Doppler chi dưới|2|Xác nhận chẩn đoán và phân tầng nguy cơ.","++Phân tầng bằng siêu âm tim, troponin, sPESI và nhập đơn vị theo dõi|2|Rối loạn thất phải cộng troponin tăng là nhóm nguy cơ trung gian–cao.","-Làm D-dimer để loại trừ thuyên tắc phổi|1|Xác suất lâm sàng cao nên D-dimer âm tính không loại trừ.","!Tiêu sợi huyết ngay cho mọi người bệnh|0|Huyết động ổn định; tăng nguy cơ xuất huyết nặng không cần thiết.","!Dùng aspirin thay cho thuốc chống đông|0|Aspirin không đủ điều trị thuyên tắc phổi cấp."],"teach":"Thuyên tắc phổi cấp cần nghĩ tới khi khó thở đột ngột và có yếu tố nguy cơ; dùng điểm xác suất, CTPA, siêu âm tim và troponin để phân tầng. Chống đông ngay, tiêu sợi huyết chỉ khi huyết động không ổn định.","hbu":{"hanh_chinh":"Ông L. Q. V. (mô phỏng), nam, 52 tuổi, thợ xây dựng; vào cấp cứu.","ly_do_vao_vien":"Khó thở đột ngột, đau ngực khi hít sâu.","benh_su":"Ba tuần trước ông bó bột gãy xương cẳng chân trái, hạn chế đi lại, không được dùng thuốc dự phòng huyết khối. Ba ngày nay chân trái sưng đau tăng. Sáng nay đột ngột khó thở, đau nhói ngực phải khi hít sâu, ho khan và một lần khạc ít đờm lẫn máu, choáng khi đứng dậy, hồi hộp. Không sốt.","tien_su":"Không bệnh tim phổi, không ung thư, không tiền sử huyết khối, không đái tháo đường; hút thuốc 15 gói-năm; gãy xương cẳng chân trái bó bột ba tuần. Không dị ứng thuốc cản quang.","luoc_qua_co_quan":"Không sốt, không ho đờm mủ; không đau bụng; không chảy máu bất thường; tiểu bình thường.","kham_hien_tai":"Tỉnh, thở nhanh 28 l/p, mạch 112 l/p, huyết áp 118/74 mmHg, SpO2 90% khí trời, nhiệt 37,4 độ C. Phổi ít ran đáy phải; tim nhanh, T2 mạnh ổ phổi, tĩnh mạch cổ nổi nhẹ; cẳng chân trái sưng, đau dọc tĩnh mạch sâu, chu vi to hơn 4 cm.","can_lam_sang":"Điện tim: nhịp xoang nhanh, T đảo V1–V3, S1Q3T3. Khí máu pH 7,46, PaO2 58, PaCO2 31. Troponin 38, NT-proBNP 780, D-dimer 4,2. Siêu âm tim thất phải giãn, TAPSE 14. Doppler: huyết khối tĩnh mạch khoeo trái. CTPA: khuyết thuốc động mạch phổi thùy dưới phải và thùy giữa.","tom_tat":"Nam 52 tuổi bất động ba tuần sau gãy xương, chân trái sưng đau do huyết khối tĩnh mạch sâu, khó thở đột ngột, đau ngực kiểu màng phổi, ho ra máu, nhịp tim nhanh, SpO2 90%; điện tim và siêu âm cho thấy quá tải thất phải, troponin tăng nhẹ, CTPA xác nhận huyết khối động mạch phổi; huyết động ổn định.","dat_van_de":"1) Khó thở cấp, giảm oxy máu. 2) Huyết khối tĩnh mạch sâu chi dưới trái. 3) Thuyên tắc phổi với quá tải thất phải. 4) Phân tầng nguy cơ. 5) Chống đông và theo dõi.","chan_doan_so_bo":"Thuyên tắc phổi cấp, huyết khối tĩnh mạch sâu chi dưới trái, nguy cơ trung gian–cao.","bien_luan":"Khó thở đột ngột, đau kiểu màng phổi, ho ra máu ở người có yếu tố thuận lợi mạnh (bất động chi, chấn thương) và có dấu huyết khối tĩnh mạch sâu cùng bên gợi ý thuyên tắc phổi. Điểm Wells: dấu hiệu huyết khối tĩnh mạch sâu 3, nhịp tim trên 100 1,5, bất động 1,5, ho ra máu 1 (tổng khoảng 7): xác suất cao nên không dùng D-dimer, làm CTPA ngay và cho chống đông sớm. Khí máu giảm oxy, kiềm hô hấp do tăng thông khí và A-a gradient tăng; điện tim nhịp nhanh, T đảo V1–V3 và S1Q3T3 phản ánh quá tải thất phải. Siêu âm tim thất phải giãn, TAPSE thấp và troponin tăng cho thấy rối loạn chức năng thất phải, nên thuộc nhóm nguy cơ trung gian–cao dù huyết động ổn định. Viêm phổi ít nghĩ vì không sốt, bạch cầu bình thường; nhồi máu cơ tim loại trừ vì không ST chênh và troponin chỉ tăng nhẹ kèm quá tải thất phải; tràn khí màng phổi không có trên lâm sàng.","sinh_ly_benh":"Bất động và tổn thương thành mạch làm ứ trệ và hoạt hóa đông máu (tam chứng Virchow), tạo huyết khối tĩnh mạch sâu. Cục huyết khối bong ra theo tĩnh mạch chủ dưới tới thất phải và gây tắc nhánh động mạch phổi, tăng khoảng chết, bất tương xứng thông khí tưới máu và co mạch phổi làm giảm oxy máu. Tăng hậu tải thất phải làm giãn thất phải, giảm đổ đầy thất trái, có thể dẫn đến tụt huyết áp, và tổn thương cơ tim thất phải làm tăng troponin.","chan_doan_phan_biet":"Viêm phổi; nhồi máu cơ tim; tràn khí màng phổi; suy tim cấp; bóc tách động mạch chủ; viêm màng ngoài tim; đợt cấp hen–COPD.","chan_doan_xac_dinh":"Thuyên tắc phổi cấp nguy cơ trung gian–cao do huyết khối tĩnh mạch sâu chi dưới trái; gãy xương cẳng chân trái bó bột.","dieu_tri":"Oxy; enoxaparin 1 mg/kg mỗi 12 giờ hoặc UFH tĩnh mạch rồi chuyển apixaban/rivaroxaban hoặc kháng vitamin K, tối thiểu 3 tháng (huyết khối có yếu tố thuận lợi thoáng qua); theo dõi sát huyết động 48–72 giờ, sẵn sàng tiêu sợi huyết hoặc can thiệp nếu tụt huyết áp, sốc; giảm đau không NSAID; bó bột điều chỉnh, vận động sớm khi cho phép.","tien_luong":"Tốt nếu chống đông sớm và duy trì; theo dõi nguy cơ tái phát, tăng áp động mạch phổi huyết khối mạn.","du_phong":"Dự phòng huyết khối trong lúc bất động bằng thuốc chống đông liều dự phòng cho chấn thương chi bó bột có nguy cơ cao, vận động sớm, uống nước đủ; tái khám sau 3 tháng đánh giá ngừng thuốc và siêu âm tim; bỏ thuốc lá."},"nguon":["2019 ESC Guidelines for the diagnosis and management of acute pulmonary embolism, Eur Heart J 2020.","Hướng dẫn chẩn đoán và điều trị thuyên tắc phổi, Hội Tim mạch học Việt Nam, bản cập nhật.","Giáo trình Nội khoa, Bộ môn Nội, Trường Đại học Y Hà Nội, phần Bệnh tim mạch và hô hấp."],"status":"nhap"},{"id":"noi-ho-hap-005","title":"Sốt kéo dài, ho khạc đờm mủ thối ở người nghiện rượu","kind":"Nội","level":"Khó","group":"noi","name":"Ông T. N. D. (mô phỏng)","age":55,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Ông nhập khoa Nội vì sốt kéo dài hai tuần, ho khạc nhiều đờm mủ có mùi hôi và sụt cân.","vitals":{"hr":98,"sbp":118,"dbp":70,"rr":22,"t":38.6,"spo2":94},"ask":[["Sốt và ho kéo dài bao lâu, tính chất đờm ra sao?","Hai tuần nay sốt cao về chiều, ho khạc ra khoảng nửa chén đờm mủ vàng xanh, có mùi hôi.","e"],["Có ho ra máu, đau ngực không?","Ho ra ít đờm lẫn tia máu hai lần; đau ngực phải nhẹ khi ho.","e"],["Có sụt cân, ra mồ hôi đêm, ăn kém không?","Sụt 4 kg trong hai tuần, ăn kém, mệt, mồ hôi đêm.","e"],["Có từng hôn mê, co giật, sặc, nuốt khó, say rượu gần đây không?","Uống rượu nhiều mỗi ngày, hôm trước nhập tiệc say bí tỉ, nằm li bì ngoài hiên; thỉnh thoảng sặc.","e"],["Sức khỏe răng miệng?","Răng sâu nhiều, viêm nướu, mùi hôi miệng.","e"],["Tiền sử lao, tiếp xúc người ho kéo dài, HIV, đái tháo đường?","Chưa tiền sử lao; không tiếp xúc nguồn lao; chưa xét nghiệm HIV; không biết bệnh đái tháo đường.","e"],["Hút thuốc?","Hút 25 gói-năm.","n"],["Có dị ứng thuốc, penicillin?","Chưa ghi nhận.","n"]],"exam":[["K","Phổi","Hội chứng đông đặc vùng đáy phổi phải phía sau, có tiếng thổi hang nhỏ, ran nổ và ran ẩm to hạt.","e"],["K","Miệng, răng","Vệ sinh răng miệng rất kém, nhiều răng sâu, viêm nướu mủ, hơi thở hôi.","e"],["K","Dấu hiệu ngón tay, dinh dưỡng","Ngón tay dùi trống nhẹ, gầy, BMI 18,5 kg/m2.","e"],["K","Tim, bụng, thần kinh","Tim nhanh đều; gan to 2 cm; thần kinh không dấu khu trú.","e"]],"tests":[["X-quang ngực thẳng nghiêng",10,"Hang tròn 5 cm có mực nước hơi ở thùy dưới phải (phân thùy sau), thành dày.","e"],["CT ngực cản quang",40,"Ổ áp xe 5,2 cm, thành dày bắt thuốc, mực nước hơi, không tắc nghẽn phế quản; không u; tràn dịch màng phổi nhỏ cùng bên.","e"],["Công thức máu, CRP, glucose, albumin, chức năng gan",10,"Bạch cầu 18,4 G/L, đa nhân 86%; Hb 106 g/L; CRP 210 mg/L; glucose 7,2 mmol/L; albumin 28 g/L; AST 78, ALT 52 U/L, GGT tăng.","e"],["Soi, cấy đờm (vi khuẩn, nấm), cấy máu, tìm AFB 3 mẫu hoặc Xpert MTB/RIF",10,"Cấy đờm: vi khuẩn hỗn hợp có kỵ khí; Xpert âm tính; AFB âm tính 3 mẫu.","e"],["HIV, HbA1c",10,"HIV âm tính; HbA1c 5,9%.","e"],["Chọc hút dẫn lưu xuyên thành ngực ngay mọi ổ áp xe phổi",10,"Không là bước đầu thường quy, chỉ khi thất bại nội khoa hoặc ổ lớn trên 6 cm không dẫn lưu được.","w"]],"opt":{"ydx":["Lao phổi hang","Ung thư phổi hoại tử trung tâm","+Áp xe phổi nguyên phát do hít, thùy dưới phải","Viêm phổi cộng đồng đơn thuần do phế cầu"],"khang_sinh":["Chỉ ceftazidime trong 5 ngày","Aminoglycosid đơn độc","Kháng sinh uống 3 ngày","+Ampicillin–sulbactam hoặc amoxicillin–clavulanat tĩnh mạch, hoặc beta-lactam kèm metronidazol; chuyển uống khi ổn định, tổng 4–6 tuần cho đến khi hang gần lành"],"dieu_tri_ho_tro":["+Dẫn lưu tư thế, dinh dưỡng, bỏ rượu, chăm sóc răng miệng, theo dõi bằng X-quang/CT","Chỉ nghỉ ngơi tại giường, không cần dẫn lưu tư thế","Thuốc ức chế ho mạnh để hết ho","Không cần chăm sóc răng miệng"],"khi_nao_can_thiep":["Dẫn lưu ngay mọi ổ áp xe","+Dẫn lưu hoặc phẫu thuật khi không đáp ứng sau 7–14 ngày điều trị phù hợp, ổ lớn trên 6 cm, ho ra máu lớn, nghi ung thư","Không bao giờ can thiệp","Cắt thùy phổi ngay khi chẩn đoán"]},"actions":["++Nhập viện, lấy cấy đờm, cấy máu trước kháng sinh, đường truyền và bù dịch|2|Xác định vi khuẩn và hỗ trợ toàn trạng, thiếu dinh dưỡng.","++Kháng sinh tĩnh mạch phủ kỵ khí (ampicillin–sulbactam hoặc amoxicillin–clavulanat)|2|Áp xe phổi thường do vi khuẩn kỵ khí miệng; điều trị kháng sinh kéo dài là nền tảng.","+Chụp CT ngực, xét nghiệm lao (Xpert, AFB) và nội soi phế quản nếu không đáp ứng|2|Loại trừ lao, ung thư, dị vật tắc phế quản.","+Dẫn lưu tư thế, dinh dưỡng, thiamin, bỏ rượu và chăm sóc răng miệng|2|Giảm yếu tố nguy cơ, cải thiện sự hồi phục.","-Dùng thuốc ức chế ho mạnh|1|Cản trở khạc đờm, ứ mủ trong hang.","!Cho điều trị lao theo kinh nghiệm không cần xét nghiệm|0|Không có bằng chứng lao; chậm điều trị nguyên nhân thực sự.","!Chọc hút xuyên thành ngực ngay lập tức|0|Không là đầu tay, nguy cơ tràn mủ màng phổi và tràn khí."],"teach":"Áp xe phổi hay gặp sau hít ở người say rượu, răng miệng kém; hang có mực nước hơi, đờm thối. Điều trị cốt lõi là kháng sinh kéo dài phủ kỵ khí, dẫn lưu tư thế và loại trừ lao, ung thư.","hbu":{"hanh_chinh":"Ông T. N. D. (mô phỏng), nam, 55 tuổi, lao động tự do; nhập khoa Nội.","ly_do_vao_vien":"Sốt kéo dài, ho khạc đờm mủ thối, sụt cân.","benh_su":"Hai tuần trước, sau một lần say rượu nằm li bì và có sặc, ông sốt cao về chiều, ho khạc nửa chén đờm mủ vàng xanh có mùi hôi mỗi ngày, hai lần đờm lẫn tia máu, đau ngực phải nhẹ khi ho. Sụt 4 kg, mồ hôi đêm, ăn kém. Không khó thở nặng, không đau đầu, không nôn.","tien_su":"Nghiện rượu nhiều năm; hút 25 gói-năm; răng sâu nhiều, viêm nướu; chưa tiền sử lao, chưa phát hiện đái tháo đường (HbA1c 5,9%); chưa dị ứng thuốc ghi nhận.","luoc_qua_co_quan":"Không rối loạn tiêu hóa nặng; có sụt cân; không phù; không co giật hay yếu liệt.","kham_hien_tai":"Gầy BMI 18,5, ngón tay dùi trống nhẹ, hơi thở hôi, răng sâu viêm nướu; mạch 98 l/p, huyết áp 118/70 mmHg, nhịp thở 22 l/p, nhiệt 38,6 độ C, SpO2 94%. Phổi phải sau dưới: đông đặc, thổi hang, ran nổ ran ẩm to hạt; gan to 2 cm.","can_lam_sang":"X-quang và CT: hang 5,2 cm có mực nước hơi thùy dưới phải, thành dày, tràn dịch màng phổi nhỏ, không u. Bạch cầu 18,4 G/L, CRP 210, albumin 28, Hb 106. Cấy đờm vi khuẩn hỗn hợp kỵ khí; Xpert và AFB âm tính; HIV âm tính.","tom_tat":"Nam 55 tuổi nghiện rượu, răng miệng kém, có sặc, sốt hai tuần, ho đờm mủ thối, sụt cân, đông đặc có thổi hang, X-quang và CT hang có mực nước hơi thùy dưới phải, bạch cầu và CRP cao, lao và HIV âm tính, thiếu dinh dưỡng và thiếu máu.","dat_van_de":"1) Hội chứng nhiễm trùng kéo dài. 2) Hang có mực nước hơi thùy dưới phải. 3) Yếu tố nguy cơ hít (rượu, răng miệng). 4) Loại trừ lao, ung thư. 5) Dinh dưỡng và kháng sinh kéo dài.","chan_doan_so_bo":"Áp xe phổi nguyên phát do hít, thùy dưới phải.","bien_luan":"Sau một đợt say rượu có sặc, khởi phát sốt, ho khạc đờm mủ thối với lượng nhiều là điển hình của áp xe phổi do vi khuẩn kỵ khí miệng. Răng miệng kém, nghiện rượu và hút thuốc là yếu tố thuận lợi cho hít và nhiễm khuẩn. Hội chứng đông đặc kèm tiếng thổi hang và hình hang có mực nước hơi có thành dày ở phân thùy sau thùy dưới phải (vị trí hay gặp của hít khi nằm ngửa) xác định chẩn đoán. Cần phân biệt lao hang (khởi phát bán cấp, thường thùy trên; ở đây Xpert và AFB âm tính, mùi thối và mực nước hơi ủng hộ áp xe), ung thư phổi hoại tử (có hút thuốc, sụt cân, nên cần theo dõi CT/nội soi nếu không lành, CT hiện không thấy u hay tắc phế quản), và viêm phổi do phế cầu (không tạo hang lớn mực nước hơi). Ổ 5,2 cm dưới 6 cm nên điều trị nội khoa trước; tràn dịch màng phổi nhỏ cần theo dõi nguy cơ tràn mủ. Albumin 28 và BMI 18,5 cho thấy suy dinh dưỡng cần can thiệp song song.","sinh_ly_benh":"Hít dịch miệng họng chứa vi khuẩn kỵ khí (Fusobacterium, Peptostreptococcus, Prevotella) khi ý thức giảm do rượu vào phân thùy sau thùy dưới phải. Vi khuẩn gây viêm hoại tử mô phổi, sau 7–14 ngày hình thành ổ mủ và thông với phế quản tạo hang có mực nước hơi, khạc đờm mủ thối. Hút thuốc làm giảm thanh thải lông chuyển; rượu giảm phản xạ ho, suy dinh dưỡng làm giảm miễn dịch, kéo dài quá trình lành.","chan_doan_phan_biet":"Lao phổi hang; ung thư phổi hoại tử; viêm phổi hoại tử do tụ cầu hoặc Klebsiella; nang phổi bội nhiễm; bệnh nấm phổi; viêm mủ màng phổi có ổ khí; u hạt Wegener.","chan_doan_xac_dinh":"Áp xe phổi nguyên phát do hít kỵ khí, thùy dưới phải kèm tràn dịch màng phổi nhỏ; suy dinh dưỡng; thiếu máu; nghiện rượu; răng miệng kém.","dieu_tri":"Ampicillin–sulbactam 3 g mỗi 6 giờ tĩnh mạch (hoặc amoxicillin–clavulanat), có thể thay bằng ceftriaxon kèm metronidazol; chuyển đường uống khi hết sốt, tổng thời gian 4–6 tuần đến khi hang nhỏ lại hoặc hết; dẫn lưu tư thế, vật lý trị liệu hô hấp; bù dinh dưỡng, thiamin, acid folic; bỏ rượu, điều trị răng miệng; theo dõi tràn dịch màng phổi; chụp CT kiểm tra 2–4 tuần; can thiệp khi thất bại sau 7–14 ngày, ổ trên 6 cm, ho ra máu nhiều hoặc nghi ung thư.","tien_luong":"Khỏi khoảng 85–90% với kháng sinh kéo dài; tiên lượng xấu hơn nếu ổ lớn, suy dinh dưỡng, hút thuốc, hoại tử nhiều.","du_phong":"Bỏ rượu và thuốc lá, chăm sóc răng miệng, tránh sặc, dinh dưỡng đủ; chụp X-quang kiểm tra sau điều trị 3–6 tháng, nội soi phế quản nếu hang không lành hoặc tái phát; tư vấn cai rượu."},"nguon":["Giáo trình Nội khoa, Bộ môn Nội, Trường Đại học Y Hà Nội, phần Áp xe phổi.","Hướng dẫn chẩn đoán và điều trị các bệnh hô hấp thường gặp, Bộ Y tế Việt Nam, bản cập nhật.","Mandell, Douglas and Bennett Principles and Practice of Infectious Diseases, phần Lung Abscess."],"status":"nhap"},{"id":"noi-noi-tiet-001","title":"Sụt cân, hồi hộp, sốt cao và kích động","kind":"Nội","level":"Khó","group":"noi","name":"Người bệnh mô phỏng N11","age":34,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu là giả định. Người bệnh nữ 34 tuổi, đã biết bướu giáp lan tỏa nhưng tự ngưng thuốc, nhập cấp cứu vì sốt cao, tim nhanh, kích động sau một đợt viêm họng.","vitals":{"hr":156,"sbp":148,"dbp":68,"rr":28,"t":39.6,"spo2":95},"ask":[["Các triệu chứng hiện tại bắt đầu thế nào?","Ba ngày nay sốt cao, hồi hộp đánh trống ngực liên tục, nôn và tiêu chảy; hôm nay nói lảm nhảm, ngủ không được.","e"],["Có tiền sử bệnh tuyến giáp và dùng thuốc gì không?","Được chẩn đoán cường giáp 8 tháng trước, uống thiamazol; tự ngưng khoảng 6 tuần nay vì thấy đỡ và đắt tiền.","e"],["Có yếu tố khởi phát như nhiễm trùng, phẫu thuật, chuyển dạ, dùng iod không?","Viêm họng đau rát một tuần, chưa dùng kháng sinh; không phẫu thuật, không chụp có cản quang, không mang thai (thử âm tính).","e"],["Sụt cân, run tay, sợ nóng, ra mồ hôi nhiều không?","Sụt 9 kg trong 5 tháng dù ăn nhiều, run tay, sợ nóng, mồ hôi nhiều, kinh thưa.","e"],["Có khó thở, phù, đau ngực hoặc bệnh tim trước đây không?","Mệt khó thở khi gắng sức vài tuần nay, hai chân phù nhẹ; không đau ngực, chưa biết bệnh tim.","e"],["Có tiền sử hen phế quản hoặc dị ứng thuốc không?","Không hen, không dị ứng thuốc.","e"],["Gia đình có ai mắc bệnh tuyến giáp không?","Mẹ có bướu cổ.","n"]],"exam":[["K","Toàn thân và tri giác","Kích động, lẫn lộn từng lúc, da nóng ẩm, vã mồ hôi, run mịn hai tay.","e"],["K","Tuyến giáp và mắt","Bướu giáp lan tỏa độ II, mật độ chắc, có tiếng thổi tâm thu; lồi mắt hai bên nhẹ, co kéo mi trên.","e"],["K","Tim mạch","Nhịp tim nhanh không đều, rung nhĩ đáp ứng thất nhanh, huyết áp tâm thu cao, hiệu áp rộng.","e"],["K","Phổi và bụng","Ran ẩm hai đáy phổi; bụng mềm, không đề kháng, nhu động ruột tăng.","e"],["K","Thần kinh cơ","Phản xạ gân xương tăng, yếu cơ gốc chi nhẹ, không dấu thần kinh khu trú.","n"]],"tests":[["TSH, FT4, FT3",10,"TSH dưới 0,01 mIU/L; FT4 71 pmol/L (bình thường 12 đến 22); FT3 vượt ngưỡng đo.","e"],["Điện tâm đồ",10,"Rung nhĩ đáp ứng thất nhanh khoảng 150 lần/phút, không có ST chênh.","e"],["Công thức máu, CRP, đường huyết, điện giải, chức năng gan thận",10,"Bạch cầu 14,5 G/L, CRP 62 mg/L; glucose 8,6 mmol/L; kali 3,3 mmol/L; AST, ALT tăng nhẹ; creatinin bình thường.","e"],["Test nhanh liên cầu hoặc cấy họng",10,"Test nhanh liên cầu nhóm A dương tính.","e"],["X quang ngực",10,"Bóng tim hơi to, ứ huyết nhẹ hai rốn phổi.","n"],["Xạ hình tuyến giáp ngay lập tức, trước khi kiểm soát nhịp tim",10,"Không cần thiết trong cấp cứu, làm chậm điều trị.","w"]],"opt":{"ydx":["Viêm tuyến giáp bán cấp có cường giáp thoáng qua","+Cơn bão giáp trên nền bệnh Basedow ngưng thuốc, khởi phát do nhiễm liên cầu","Nhiễm khuẩn huyết đơn thuần kèm rối loạn lo âu","U tủy thượng thận cơn kịch phát"],"uu_tien":["+Kháng giáp liều cao, chẹn beta, glucocorticoid, hồi sức và điều trị yếu tố khởi phát","Chỉ dùng an thần và hạ sốt bằng aspirin","Chờ xạ hình rồi mới điều trị","Chuyển ngay phẫu thuật cắt giáp mà không chuẩn bị"],"chan_beta":["+Propranolol đường uống hoặc esmolol truyền tĩnh mạch, thận trọng khi có suy tim","Metoprolol liều cố định mà không theo dõi huyết động","Digoxin thay thế hoàn toàn chẹn beta","Chống chỉ định mọi thuốc kiểm soát nhịp"]},"actions":["++Đánh giá ABC, theo dõi monitor, hạ nhiệt bằng paracetamol và làm mát tích cực|2|Sốt cao làm tăng chuyển hóa; tránh aspirin vì đẩy hormon tự do ra khỏi protein gắn.","++Dùng thiamazol hoặc propylthiouracil liều tấn công|2|Ức chế tổng hợp hormon giáp là nền tảng của điều trị.","+Cho dung dịch iod sau khi đã dùng kháng giáp ít nhất 1 giờ|2|Iod ức chế giải phóng hormon, nhưng dùng trước kháng giáp sẽ cung cấp nguyên liệu tổng hợp.","+Hydrocortisone tĩnh mạch|2|Giảm chuyển T4 thành T3, điều trị suy thượng thận tương đối và bệnh nền tự miễn.","+Kháng sinh phù hợp điều trị viêm họng do liên cầu và bù dịch, bù kali|2|Điều trị yếu tố khởi phát và rối loạn điện giải.","!Truyền dung dịch ưu trương mạnh, tiêm aspirin hạ sốt và chờ kết quả xạ hình|0|Làm nặng thêm tình trạng và trì hoãn điều trị cứu mạng."],"teach":"Cơn bão giáp là chẩn đoán lâm sàng dựa trên cường giáp nặng kèm rối loạn đa cơ quan (sốt, tim mạch, thần kinh, tiêu hóa), thường có yếu tố khởi phát. Điều trị khẩn theo thứ tự: kiểm soát triệu chứng, ức chế tổng hợp rồi giải phóng hormon, giảm chuyển T4 thành T3, điều trị yếu tố khởi phát.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N11, nữ, 34 tuổi, nhân viên văn phòng; nhập khoa Cấp cứu.","ly_do_vao_vien":"Sốt cao, hồi hộp đánh trống ngực, kích động.","benh_su":"Cường giáp được chẩn đoán 8 tháng trước, điều trị thiamazol nhưng tự ngưng khoảng 6 tuần. Một tuần nay đau họng, ba ngày nay sốt cao liên tục, hồi hộp, nôn, tiêu chảy; hôm nay lú lẫn, kích động, mất ngủ. Có sụt 9 kg trong 5 tháng, run tay, sợ nóng, mồ hôi nhiều, kinh thưa. Chưa dùng kháng sinh, không dùng iod hay thuốc cản quang.","tien_su":"Cường giáp 8 tháng; chưa phẫu thuật; không hen; không dị ứng thuốc. Mẹ có bướu cổ. Không hút thuốc, không uống rượu. Không mang thai.","luoc_qua_co_quan":"Tim mạch: hồi hộp, khó thở khi gắng sức, phù chân nhẹ. Tiêu hóa: nôn, tiêu chảy 3 đến 4 lần/ngày. Thần kinh: mất ngủ, lẫn lộn. Cơ xương: yếu cơ gốc chi. Nội tiết: sợ nóng, sụt cân, kinh thưa.","kham_hien_tai":"Kích động, lẫn từng lúc, da nóng ẩm, run mịn đầu chi. Mạch 156 lần/phút không đều, HA 148/68 mmHg, nhiệt độ 39,6 độ C, nhịp thở 28 lần/phút, SpO2 95%. Bướu giáp lan tỏa độ II, có tiếng thổi; lồi mắt nhẹ hai bên. Ran ẩm hai đáy phổi. Bụng mềm, nhu động tăng. Phản xạ gân xương tăng.","can_lam_sang":"TSH dưới 0,01 mIU/L, FT4 71 pmol/L, FT3 rất cao. ECG rung nhĩ đáp ứng thất nhanh. Bạch cầu 14,5 G/L, CRP 62 mg/L, kali 3,3 mmol/L, glucose 8,6 mmol/L, men gan tăng nhẹ. Test liên cầu A dương tính. X quang ngực ứ huyết nhẹ.","tom_tat":"Nữ 34 tuổi, tiền sử Basedow ngưng thuốc kháng giáp 6 tuần, nhiễm liên cầu họng một tuần, nay sốt 39,6 độ C, rung nhĩ nhanh 156 lần/phút, suy tim nhẹ, nôn tiêu chảy, lú lẫn; bướu giáp lan tỏa có lồi mắt; TSH ức chế hoàn toàn, FT4 và FT3 rất cao.","dat_van_de":"Hội chứng cường giáp nặng; rối loạn nhiều cơ quan (sốt, tim mạch, tiêu hóa, thần kinh); yếu tố khởi phát nhiễm trùng và ngưng thuốc; hạ kali; nguy cơ đe dọa tính mạng.","chan_doan_so_bo":"Cơn bão giáp trên nền bệnh Basedow, khởi phát do viêm họng liên cầu và ngưng thuốc kháng giáp.","bien_luan":"Bước 1, xác định hội chứng: tim nhanh, run, sụt cân, sợ nóng, mồ hôi kèm TSH ức chế và FT4, FT3 tăng cao xác nhận nhiễm độc giáp. Bước 2, xác định nguyên nhân: bướu giáp lan tỏa có tiếng thổi và lồi mắt hai bên phù hợp bệnh Basedow, tiền sử đã điều trị; viêm giáp bán cấp ít gây lồi mắt và thường đau tuyến giáp. Bước 3, đánh giá mức độ: theo thang điểm Burch-Wartofsky, sốt 39,6 độ C (25 điểm), kích động lú lẫn (20 đến 30), nhịp tim trên 140 (25), rung nhĩ (10), suy tim nhẹ (10), rối loạn tiêu hóa (10), yếu tố khởi phát (10), tổng vượt 45 điểm, gợi ý mạnh cơn bão giáp. Bước 4, tìm yếu tố khởi phát: nhiễm liên cầu và ngưng thuốc. Bước 5, loại trừ chẩn đoán khác: nhiễm khuẩn huyết có thể đồng thời nhưng không giải thích TSH và FT4 như vậy.","sinh_ly_benh":"Trong Basedow, kháng thể kích thích thụ thể TSH làm tuyến giáp tăng tổng hợp và giải phóng T4, T3. Nhiễm trùng, phẫu thuật hay ngưng thuốc làm tăng đột ngột hormon tự do, tăng số lượng và độ nhạy thụ thể beta-adrenergic ở mô đích, làm tăng chuyển hóa, sinh nhiệt, tăng cung lượng tim, gây rối loạn nhịp. Cytokin của nhiễm trùng làm giảm protein gắn, tăng hormon tự do. Hệ quả là sốt, tim nhanh, rung nhĩ, suy tim cung lượng cao, tiêu chảy, rối loạn tri giác và suy thượng thận tương đối do tăng nhu cầu cortisol.","chan_doan_phan_biet":"Nhiễm khuẩn huyết hoặc sốc nhiễm khuẩn; viêm tuyến giáp bán cấp; cơn lo âu hoặc hoang tưởng cấp; sốt ác tính do thuốc; u tủy thượng thận; hội chứng serotonin; suy tim cấp do nguyên nhân khác.","chan_doan_xac_dinh":"Cơn bão giáp trên nền bệnh Basedow, kèm rung nhĩ đáp ứng thất nhanh, suy tim nhẹ, hạ kali máu và viêm họng liên cầu; chẩn đoán xác định bệnh Basedow cần thêm TRAb hoặc siêu âm giáp.","dieu_tri":"Điều trị tại hồi sức. Hạ sốt bằng paracetamol và làm mát, tránh aspirin. Thiamazol liều tấn công (hoặc propylthiouracil), một giờ sau cho dung dịch iod. Chẹn beta (propranolol hoặc esmolol) để kiểm soát nhịp, thận trọng khi có suy tim. Hydrocortisone tĩnh mạch. Bù dịch, bù kali, thiamin; kháng sinh điều trị liên cầu. Điều trị chống đông theo điểm nguy cơ rung nhĩ. Nếu không đáp ứng, cân nhắc trao đổi huyết tương hoặc phẫu thuật. Sau ổn định, điều trị lâu dài bằng kháng giáp, iod phóng xạ hoặc phẫu thuật.","tien_luong":"Dè dặt; tử vong cơn bão giáp khoảng 10 đến 20% nếu chậm điều trị, giảm rõ khi xử trí sớm. Tiên lượng xa phụ thuộc tuân thủ điều trị và quyết định điều trị triệt để.","du_phong":"Giải thích bệnh và nguy cơ khi ngưng thuốc; hẹn tái khám định kỳ đo FT4 và công thức máu; theo dõi tác dụng phụ của kháng giáp (mất bạch cầu hạt, viêm gan), dặn khi sốt đau họng phải đi khám ngay; lập kế hoạch điều trị triệt để; tránh iod ngoại sinh không kiểm soát; cân nhắc tránh thai trong thời gian điều trị."},"nguon":["Ross DS, et al. 2016 American Thyroid Association Guidelines for Diagnosis and Management of Hyperthyroidism and Other Causes of Thyrotoxicosis. Thyroid 2016.","Satoh T, et al. 2016 Guidelines for the management of thyroid storm from the Japan Thyroid Association and Japan Endocrine Society. Endocr J 2016.","Bộ Y tế. Hướng dẫn chẩn đoán và điều trị các bệnh nội tiết, chuyển hóa (Quyết định 3319/QĐ-BYT, 2017).","Giáo trình Nội khoa, bộ môn Nội, các trường đại học Y Việt Nam."],"status":"nhap"},{"id":"noi-noi-tiet-002","title":"Khát nhiều, tiểu nhiều và giảm thị lực, tê bàn chân","kind":"Nội","level":"Trung bình","group":"noi","name":"Người bệnh mô phỏng N12","age":52,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu là giả định. Người bệnh nam 52 tuổi đến phòng khám nội tiết vì khát nhiều, tiểu nhiều, mờ mắt và tê bàn chân hơn 6 tháng, chưa từng khám tầm soát đường huyết.","vitals":{"hr":84,"sbp":152,"dbp":94,"rr":18,"t":36.8,"spo2":98},"ask":[["Các triệu chứng bắt đầu từ khi nào và diễn tiến ra sao?","Khát nước, uống nhiều, tiểu nhiều cả ban đêm khoảng 6 tháng; sụt 5 kg; mờ mắt tăng dần; tê rần hai bàn chân.","e"],["Có tiền sử đái tháo đường, tăng huyết áp, rối loạn mỡ máu không?","Chưa từng đo đường huyết. Biết huyết áp cao 2 năm nhưng uống thuốc không đều. Chưa kiểm tra mỡ máu.","e"],["Gia đình có ai bị đái tháo đường không?","Cha và anh trai bị đái tháo đường.","e"],["Chế độ ăn, vận động, hút thuốc, uống rượu?","Ăn nhiều tinh bột và nước ngọt, ít vận động, hút 20 gói-năm, uống rượu cuối tuần.","e"],["Có đau ngực, khó thở khi gắng sức, đau cách hồi không?","Không đau ngực; đi bộ xa thấy mỏi bắp chân nhưng nghỉ thì đỡ ít.","e"],["Có nhiễm trùng da, nấm âm hộ-quy đầu, vết loét lâu lành không?","Có ngứa vùng bẹn, vết xước ở chân lâu lành.","n"],["Có nôn, đau bụng, thở sâu, lơ mơ không?","Không có.","n"]],"exam":[["K","Chỉ số nhân trắc","BMI 29,4 kg/m2, vòng eo 98 cm, có béo bụng.","e"],["K","Khám mắt sơ bộ","Thị lực giảm nhẹ hai mắt; soi đáy mắt thấy vi phình mạch và xuất huyết dạng chấm.","e"],["K","Khám bàn chân","Giảm cảm giác monofilament ở ngón và gan chân hai bên, mất phản xạ gót; mạch mu chân yếu; da khô, không loét.","e"],["K","Tim phổi và bụng","Tim đều, không tiếng thổi; phổi trong; gan không to.","n"]],"tests":[["Đường huyết tĩnh mạch lúc đói và HbA1c",10,"Glucose đói 13,2 mmol/L; HbA1c 10,8%.","e"],["Creatinin, eGFR và tỷ số albumin/creatinin niệu (UACR)",10,"Creatinin 98 umol/L, eGFR 82 mL/phút/1,73 m2; UACR 120 mg/g (microalbumin niệu).","e"],["Bộ mỡ máu",10,"LDL-C 4,1 mmol/L; triglycerid 3,6 mmol/L; HDL-C 0,9 mmol/L.","e"],["Tổng phân tích nước tiểu",10,"Glucose niệu 3+, ceton âm tính, protein vết.","e"],["Điện tâm đồ",10,"Nhịp xoang, không thay đổi thiếu máu cục bộ.","n"],["Nghiệm pháp dung nạp glucose đường uống để xác nhận khi glucose đã vượt ngưỡng rõ rệt",10,"Không cần thiết khi triệu chứng điển hình và glucose đói đã vượt 7,0 mmol/L.","w"]],"opt":{"ydx":["Đái tháo đường típ 1 khởi phát muộn","Đái tháo đường thai kỳ","Rối loạn dung nạp glucose đơn thuần","+Đái tháo đường típ 2 mới chẩn đoán, đã có biến chứng võng mạc, thần kinh và bệnh thận giai đoạn sớm"],"muc_tieu":["+Phối hợp thay đổi lối sống với metformin, kiểm soát huyết áp bằng ức chế men chuyển hoặc chẹn thụ thể, statin","Chỉ thay đổi lối sống rồi đánh giá lại sau 12 tháng","Chỉ tiêm insulin nền, bỏ qua huyết áp và mỡ máu","Chờ có loét chân mới chuyển chuyên khoa"],"bien_chung":["+Khám đáy mắt qua đồng tử giãn, đánh giá bàn chân hằng năm, đo UACR và eGFR định kỳ","Chỉ đo đường huyết mao mạch hằng ngày","Chỉ cần khám đáy mắt khi mờ mắt nặng","Không cần tầm soát vì bệnh mới phát hiện"]},"actions":["++Xác nhận chẩn đoán đái tháo đường bằng glucose đói và HbA1c|2|Triệu chứng cổ điển kèm glucose và HbA1c vượt ngưỡng đủ chẩn đoán.","++Bắt đầu metformin theo eGFR, tăng liều dần, kèm chế độ ăn và vận động|2|Metformin là lựa chọn đầu tay khi chức năng thận cho phép.","+Cân nhắc phối hợp thuốc thứ hai hoặc insulin nền vì HbA1c rất cao|2|HbA1c trên 10% thường cần phối hợp sớm để đạt mục tiêu.","+Dùng ức chế men chuyển hoặc chẹn thụ thể; thêm statin cường độ trung bình đến cao|2|Có tăng huyết áp, albumin niệu và nguy cơ tim mạch cao.","+Chuyển nhãn khoa và hướng dẫn chăm sóc bàn chân, ngừng thuốc lá|2|Có tổn thương võng mạc, bệnh thần kinh ngoại biên và mạch máu ngoại vi.","!Chỉ khuyên ăn kiêng, cho về và hẹn tái khám sau một năm|0|Bỏ sót điều trị biến chứng và hạ đường huyết kéo dài."],"teach":"Chẩn đoán đái tháo đường dựa trên tiêu chuẩn glucose và HbA1c; khi mới phát hiện cần tầm soát biến chứng ngay vì bệnh có thể đã tiến triển nhiều năm. Điều trị là gói toàn diện: đường huyết, huyết áp, mỡ máu, ngừng thuốc lá và chăm sóc bàn chân, mắt, thận.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N12, nam, 52 tuổi, tài xế; khám tại phòng khám nội tiết.","ly_do_vao_vien":"Khát nhiều, tiểu nhiều, mờ mắt và tê bàn chân hơn 6 tháng.","benh_su":"Sáu tháng nay người bệnh khát nước, uống nhiều, tiểu nhiều cả ban đêm, sụt 5 kg dù ăn nhiều, mờ mắt tăng dần và tê rần hai bàn chân, ngứa vùng bẹn, vết xước chân lâu lành. Chưa từng đo đường huyết hay điều trị. Không nôn, đau bụng hay lơ mơ.","tien_su":"Tăng huyết áp 2 năm, uống thuốc không đều. Cha và anh ruột đái tháo đường. Hút thuốc 20 gói-năm, uống rượu cuối tuần. Chưa phẫu thuật. Không dị ứng thuốc.","luoc_qua_co_quan":"Mắt: mờ tăng dần. Thần kinh: tê rần bàn chân. Tim mạch: không đau ngực, mỏi bắp chân khi đi xa. Tiết niệu: tiểu nhiều. Tiêu hóa: bình thường. Da: ngứa bẹn, vết thương chậm lành.","kham_hien_tai":"Tỉnh, BMI 29,4 kg/m2, vòng eo 98 cm. Mạch 84 lần/phút, HA 152/94 mmHg, nhịp thở 18 lần/phút. Thị lực giảm nhẹ, đáy mắt có vi phình mạch và xuất huyết dạng chấm. Giảm cảm giác monofilament hai bàn chân, mất phản xạ gót, mạch mu chân yếu, không loét. Tim phổi bình thường.","can_lam_sang":"Glucose đói 13,2 mmol/L, HbA1c 10,8%. Creatinin 98 umol/L, eGFR 82, UACR 120 mg/g. LDL-C 4,1, triglycerid 3,6, HDL-C 0,9 mmol/L. Nước tiểu glucose 3+, ceton âm. ECG bình thường.","tom_tat":"Nam 52 tuổi, béo bụng, tăng huyết áp, hút thuốc, tiền sử gia đình đái tháo đường, có hội chứng khát tiểu nhiều và sụt cân 6 tháng; glucose đói 13,2 mmol/L và HbA1c 10,8%; đã có tổn thương võng mạc không tăng sinh, bệnh thần kinh ngoại biên, albumin niệu mức tăng vừa và rối loạn mỡ máu.","dat_van_de":"Đái tháo đường mới chẩn đoán với tăng đường huyết rõ; biến chứng mắt, thần kinh, thận sớm; tăng huyết áp; rối loạn mỡ máu; nguy cơ tim mạch cao; thiếu tuân thủ.","chan_doan_so_bo":"Đái tháo đường típ 2 mới chẩn đoán, có biến chứng võng mạc, thần kinh ngoại biên và bệnh thận sớm; tăng huyết áp; rối loạn lipid máu.","bien_luan":"Bước 1: hội chứng khát, tiểu nhiều, sụt cân kèm glucose đói 13,2 mmol/L (từ 7,0 trở lên) và HbA1c 10,8% (từ 6,5% trở lên) thỏa tiêu chuẩn đái tháo đường theo ADA 2024 và Bộ Y tế. Bước 2: phân típ, người trung niên, béo bụng, kháng insulin, tiền sử gia đình, khởi phát từ từ, không ceton niệu nên thiên về típ 2; típ 1 muộn ít khả năng, nhưng nếu gầy, sụt cân nhanh, ceton dương thì cần đo kháng thể và C-peptid. Bước 3: tìm biến chứng, mờ mắt kèm tổn thương đáy mắt là bệnh võng mạc, tê và mất phản xạ gót là bệnh thần kinh ngoại biên, UACR 120 mg/g là albumin niệu mức tăng vừa, eGFR còn 82; mạch mu chân yếu và mỏi bắp chân cần đo chỉ số cổ chân-cánh tay. Bước 4: yếu tố nguy cơ tim mạch phối hợp, tăng huyết áp, LDL-C cao, hút thuốc, nên cần kiểm soát đồng thời.","sinh_ly_benh":"Típ 2 do kháng insulin ở cơ, gan, mô mỡ phối hợp giảm tiết insulin tương đối của tế bào beta. Tăng đường huyết mạn gây độc tính glucose, tăng đường niệu kéo theo lợi niệu thẩm thấu (khát, tiểu nhiều, sụt cân). Biến chứng vi mạch do con đường polyol, sản phẩm glycat hóa bền vững, stress oxy hóa và protein kinase C làm tổn thương nội mô, màng đáy; ở võng mạc gây vi phình mạch, ở cầu thận gây albumin niệu, ở dây thần kinh gây mất myelin và thiếu máu thần kinh. Rối loạn lipid và tăng huyết áp thúc đẩy xơ vữa mạch lớn.","chan_doan_phan_biet":"Đái tháo đường típ 1 khởi phát muộn hoặc LADA; đái tháo đường thứ phát (bệnh tụy, thuốc, Cushing, to đầu chi); đái tháo đường thể MODY; tăng đường huyết do stress; đái tháo nhạt khi chỉ có tiểu nhiều.","chan_doan_xac_dinh":"Đái tháo đường típ 2 mới chẩn đoán có biến chứng võng mạc, thần kinh ngoại biên, bệnh thận do đái tháo đường giai đoạn sớm (albumin niệu), tăng huyết áp độ 2, rối loạn lipid máu hỗn hợp.","dieu_tri":"Mục tiêu cá thể hóa: HbA1c dưới 7%, huyết áp dưới 130/80 mmHg, LDL-C dưới 1,8 mmol/L khi nguy cơ rất cao. Thay đổi lối sống: chế độ ăn giảm tinh bột tinh chế, vận động 150 phút/tuần, giảm cân, bỏ thuốc lá, hạn chế rượu. Metformin khởi đầu và tăng dần theo eGFR; vì HbA1c trên 10% cân nhắc phối hợp ngay thuốc thứ hai (ức chế SGLT2 hoặc đồng vận GLP-1 vì lợi ích thận tim mạch) hoặc insulin nền. Ức chế men chuyển hoặc chẹn thụ thể, statin cường độ cao. Chuyển nhãn khoa, khám bàn chân, đo ABI.","tien_luong":"Phụ thuộc kiểm soát đa yếu tố. Nếu đạt mục tiêu, giảm đáng kể tiến triển biến chứng; nếu không, nguy cơ cao suy thận, mù lòa, loét chân, nhồi máu cơ tim và đột quỵ.","du_phong":"Giáo dục tự quản lý, tự theo dõi đường huyết, nhận biết hạ đường huyết. Tầm soát định kỳ: HbA1c mỗi 3 đến 6 tháng, UACR và eGFR hằng năm, đáy mắt hằng năm, bàn chân mỗi lần khám. Tiêm vaccin cúm, phế cầu, viêm gan B. Sàng lọc người thân thuộc nhóm nguy cơ."},"nguon":["American Diabetes Association. Standards of Care in Diabetes 2024. Diabetes Care 2024;47(Suppl 1).","Bộ Y tế. Hướng dẫn chẩn đoán và điều trị đái tháo đường típ 2 (Quyết định 5481/QĐ-BYT, 2020).","KDIGO 2022 Clinical Practice Guideline for Diabetes Management in CKD.","Giáo trình Nội khoa, bộ môn Nội, các trường đại học Y Việt Nam."],"status":"nhap"},{"id":"noi-than-001","title":"Tiểu ít sau tiêu chảy ở người dùng thuốc giảm đau và thuốc huyết áp","kind":"Nội","level":"Trung bình","group":"noi","name":"Người bệnh mô phỏng N13","age":67,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu là giả định. Người bệnh nam 67 tuổi nhập khoa Nội vì mệt, khát, tiểu rất ít hai ngày sau đợt tiêu chảy và nôn.","vitals":{"hr":108,"sbp":92,"dbp":58,"rr":20,"t":37.2,"spo2":97},"ask":[["Tiêu chảy, nôn và ăn uống thời gian qua thế nào?","Tiêu chảy nước 6 đến 8 lần/ngày và nôn trong 3 ngày, uống ít nước, ăn kém.","e"],["Lượng nước tiểu và màu nước tiểu thế nào?","Từ hôm qua đi tiểu rất ít, nước tiểu vàng sẫm, không đau khi tiểu, không tiểu máu.","e"],["Đang dùng thuốc gì, đặc biệt thuốc giảm đau, huyết áp, lợi tiểu?","Tăng huyết áp: enalapril và furosemid; đau gối dùng ibuprofen mỗi ngày hơn 2 tuần.","e"],["Có tiền sử bệnh thận, sỏi tiết niệu, phì đại tiền liệt tuyến không?","Chưa từng bệnh thận; không sỏi; thỉnh thoảng đi tiểu đêm 1 lần.","e"],["Có dùng thuốc cản quang, kháng sinh nhóm aminoglycosid, thuốc nam không rõ nguồn gốc không?","Không dùng.","e"],["Có phù, khó thở, đau ngực không?","Không phù, không khó thở, chỉ chóng mặt khi đứng dậy.","n"],["Có sốt, phát ban, đau khớp mới xuất hiện không?","Không.","n"]],"exam":[["K","Tình trạng thể tích","Khô niêm mạc, nếp véo da mất chậm, tĩnh mạch cổ xẹp, mạch nhanh, tụt huyết áp tư thế.","e"],["K","Tim phổi","Tim nhanh đều, không tiếng thổi; phổi trong, không ran.","e"],["K","Bụng và cầu bàng quang","Bụng mềm, không cầu bàng quang, không điểm đau niệu quản.","e"],["K","Phù và da","Không phù; da khô, không ban.","n"]],"tests":[["Creatinin, ure, điện giải đồ, khí máu",10,"Creatinin 238 umol/L (nền khoảng 90 trước đây); ure 21 mmol/L; K 5,3 mmol/L; Na 133 mmol/L; HCO3 17 mmol/L.","e"],["Tổng phân tích nước tiểu và điện giải niệu",10,"Tỷ trọng 1,028; protein vết; không hồng cầu, không trụ hạt; Na niệu 12 mmol/L; FeNa 0,6%.","e"],["Siêu âm thận và đường tiết niệu",15,"Hai thận kích thước bình thường, đậm độ vỏ bình thường, không ứ nước, bàng quang xẹp.","e"],["Công thức máu và CRP",10,"Hematocrit 49%, bạch cầu 10,2 G/L, CRP 8 mg/L.","n"],["Điện tâm đồ",10,"Nhịp nhanh xoang, sóng T cao nhọn nhẹ.","e"],["Sinh thiết thận ngay để xác định nguyên nhân",10,"Không có chỉ định khi nghĩ nhiều nguyên nhân trước thận hồi phục được.","w"]],"opt":{"ydx":["Tổn thương thận cấp sau thận do tắc nghẽn tiết niệu","Viêm cầu thận tiến triển nhanh","+Tổn thương thận cấp trước thận do giảm thể tích, có yếu tố thuốc làm nặng","Hoại tử ống thận cấp do thiếu máu kéo dài"],"xu_tri":["+Bù dịch tinh thể theo đáp ứng, ngừng ibuprofen, enalapril, furosemid tạm thời và theo dõi nước tiểu, điện giải","Truyền furosemid liều cao để kích thích tiểu","Chạy thận nhân tạo ngay vì creatinin tăng","Chỉ uống nhiều nước mà không theo dõi"],"tang_kali":["+Theo dõi điện tâm đồ, ngừng thuốc làm tăng kali, bù dịch và xử trí theo mức kali","Chỉ truyền canxi mà không theo dõi nguyên nhân","Cho thêm kali để bù dịch","Không cần xét nghiệm lại kali"]},"actions":["++Đánh giá thể tích, bắt đầu bù dịch tinh thể đường tĩnh mạch và theo dõi nước tiểu từng giờ|2|Nguyên nhân trước thận chủ yếu do giảm thể tích, cần phục hồi tưới máu thận sớm.","++Ngừng tạm thời NSAID, ức chế men chuyển và lợi tiểu|2|Các thuốc này làm giảm tưới máu cầu thận và làm nặng tổn thương.","+Làm điện tâm đồ, theo dõi kali, điều chỉnh rối loạn điện giải và toan chuyển hóa|2|Kali 5,3 mmol/L và HCO3 17 mmol/L cần theo dõi sát.","+Siêu âm tiết niệu và tính FeNa để phân biệt trước thận với tại thận|2|FeNa dưới 1% và tỷ trọng cao phù hợp trước thận.","+Dùng kháng sinh khi có bằng chứng nhiễm khuẩn, hiệu chỉnh liều theo eGFR|1|Chưa có dữ kiện nhiễm khuẩn; cần hiệu chỉnh liều mọi thuốc thải qua thận.","!Truyền furosemid liều cao và tiếp tục ibuprofen để giảm đau gối|0|Làm giảm thể tích và độc thận thêm, có thể gây hoại tử ống thận."],"teach":"Tổn thương thận cấp trước thận đáp ứng với bù dịch, điển hình là creatinin tăng, tỷ trọng nước tiểu cao, Na niệu thấp, FeNa dưới 1%. Luôn rà soát thuốc (NSAID, ức chế men chuyển, lợi tiểu) và loại trừ tắc nghẽn bằng siêu âm.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N13, nam, 67 tuổi, nông dân; nhập khoa Nội tổng hợp.","ly_do_vao_vien":"Mệt, khát, tiểu rất ít sau tiêu chảy và nôn ba ngày.","benh_su":"Ba ngày trước người bệnh tiêu chảy phân nước 6 đến 8 lần/ngày, nôn, ăn uống kém. Từ hôm qua đi tiểu rất ít, nước tiểu vàng sẫm, chóng mặt khi đứng dậy. Không đau khi tiểu, không tiểu máu, không sốt, không phù. Đang uống ibuprofen mỗi ngày hơn hai tuần vì đau gối cùng enalapril và furosemid.","tien_su":"Tăng huyết áp 8 năm, điều trị enalapril và furosemid. Thoái hóa khớp gối. Chưa biết bệnh thận, sỏi tiết niệu. Không đái tháo đường. Không hút thuốc. Không dùng thuốc nam, cản quang hay aminoglycosid.","luoc_qua_co_quan":"Tiêu hóa: tiêu chảy, nôn. Tiết niệu: tiểu ít, không rối loạn bài xuất khác. Tuần hoàn: chóng mặt khi đứng. Hô hấp: không khó thở. Da: khô.","kham_hien_tai":"Tỉnh, khô niêm mạc, nếp véo da mất chậm. Mạch 108 lần/phút, HA 92/58 mmHg, hạ huyết áp tư thế, nhịp thở 20, nhiệt độ 37,2 độ C, SpO2 97%. Tĩnh mạch cổ xẹp. Tim nhanh đều, phổi trong. Bụng mềm, không cầu bàng quang. Không phù.","can_lam_sang":"Creatinin 238 umol/L (nền khoảng 90), ure 21 mmol/L, K 5,3, Na 133, HCO3 17 mmol/L. Nước tiểu: tỷ trọng 1,028, protein vết, không hồng cầu hay trụ, Na niệu 12 mmol/L, FeNa 0,6%. Siêu âm thận bình thường, không ứ nước. Hematocrit 49%. ECG nhịp nhanh xoang, T cao nhẹ.","tom_tat":"Nam 67 tuổi, tăng huyết áp dùng ức chế men chuyển, lợi tiểu và NSAID kéo dài, có tiêu chảy nôn ba ngày; nay tiểu ít, mất nước, hạ huyết áp tư thế; creatinin tăng từ 90 lên 238 umol/L, tăng ure, kali 5,3, toan chuyển hóa nhẹ; nước tiểu cô đặc, FeNa 0,6%; siêu âm không ứ nước.","dat_van_de":"Tổn thương thận cấp giai đoạn 2 theo KDIGO; giảm thể tích tuần hoàn; thuốc làm giảm tưới máu thận; tăng kali nhẹ, toan chuyển hóa; cần loại trừ nguyên nhân sau thận và tại thận.","chan_doan_so_bo":"Tổn thương thận cấp trước thận do mất dịch qua tiêu hóa, có yếu tố thúc đẩy từ NSAID, ức chế men chuyển và lợi tiểu.","bien_luan":"Bước 1: xác định tổn thương thận cấp, creatinin tăng gấp khoảng 2,6 lần mức nền (trên 2,0 đến 2,9 lần là giai đoạn 2 theo KDIGO) và tiểu ít. Bước 2: phân loại nguyên nhân, có mất dịch rõ, tụt huyết áp tư thế, tĩnh mạch cổ xẹp, hematocrit 49% cho thấy cô đặc máu, nước tiểu cô đặc với Na niệu 12 mmol/L, FeNa dưới 1% và cặn nước tiểu lành tính; đây là hình ảnh điển hình trước thận. Bước 3: loại trừ sau thận, siêu âm không giãn đài bể thận, bàng quang xẹp. Bước 4: loại trừ tại thận, thiếu trụ hạt nâu bùn và FeNa thấp không ủng hộ hoại tử ống thận cấp; không có hồng cầu, trụ hồng cầu hay protein niệu nhiều nên ít nghĩ viêm cầu thận; không ban, không sốt, không dùng kháng sinh nên ít nghĩ viêm thận kẽ cấp. Bước 5: yếu tố làm nặng, NSAID co mạch đến cầu thận, enalapril giãn mạch ra làm giảm áp lực lọc, furosemid làm mất thể tích.","sinh_ly_benh":"Khi giảm thể tích, hệ renin-angiotensin và giao cảm được kích hoạt, tiểu động mạch ra co lại và prostaglandin giãn tiểu động mạch vào để duy trì mức lọc cầu thận. NSAID ức chế prostaglandin làm co động mạch vào, ức chế men chuyển làm giãn động mạch ra, cả hai làm sụp áp lực lọc. Thận tăng tái hấp thu natri và nước nhờ aldosterone và ADH nên nước tiểu cô đặc, Na niệu thấp. Nếu tình trạng giảm tưới máu kéo dài, thiếu máu ống thận có thể chuyển thành hoại tử ống thận cấp.","chan_doan_phan_biet":"Hoại tử ống thận cấp; viêm thận kẽ cấp do thuốc; viêm cầu thận cấp; tắc nghẽn đường tiết niệu (phì đại tiền liệt tuyến, sỏi); hội chứng gan thận; bệnh thận mạn có đợt cấp.","chan_doan_xac_dinh":"Tổn thương thận cấp KDIGO giai đoạn 2 do nguyên nhân trước thận (mất dịch tiêu hóa phối hợp NSAID, ức chế men chuyển, lợi tiểu); tăng kali máu nhẹ, toan chuyển hóa nhẹ; cần xác nhận bằng hồi phục creatinin sau bù dịch.","dieu_tri":"Bù dịch tinh thể (ưu tiên dung dịch cân bằng), tránh quá tải, đánh giá đáp ứng bằng huyết áp, nước tiểu và lâm sàng. Ngừng NSAID, enalapril và furosemid tạm thời. Theo dõi nước tiểu, creatinin, kali, bicarbonat mỗi 12 đến 24 giờ. Điều trị tăng kali theo mức độ và ECG. Hiệu chỉnh liều thuốc theo mức lọc cầu thận, tránh cản quang và thuốc độc thận. Chỉ định lọc máu khi quá tải không đáp ứng, tăng kali nặng, toan nặng, hội chứng ure huyết cao.","tien_luong":"Tốt nếu bù dịch sớm; creatinin thường về gần mức nền sau 48 đến 72 giờ. Nếu chậm trễ có thể tiến triển thành hoại tử ống thận cấp và tăng nguy cơ bệnh thận mạn.","du_phong":"Tránh NSAID, tư vấn thuốc giảm đau thay thế; hướng dẫn bù nước và tạm ngưng ức chế men chuyển, lợi tiểu khi nôn hay tiêu chảy (quy tắc ngày ốm); theo dõi creatinin, kali sau xuất viện 1 đến 2 tuần; kiểm soát huyết áp; tái khám thận học nếu creatinin không về nền."},"nguon":["KDIGO Clinical Practice Guideline for Acute Kidney Injury. Kidney Int Suppl 2012.","Bộ Y tế. Hướng dẫn chẩn đoán và điều trị một số bệnh về thận, tiết niệu (Quyết định 3931/QĐ-BYT, 2015).","Giáo trình Nội khoa, bộ môn Nội, các trường đại học Y Việt Nam."],"status":"nhap"},{"id":"noi-than-002","title":"Phù toàn thân, nước tiểu nhiều bọt","kind":"Nội","level":"Khó","group":"noi","name":"Người bệnh mô phỏng N14","age":28,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu là giả định. Người bệnh nam 28 tuổi nhập khoa Thận vì phù mặt, phù hai chân tăng dần 3 tuần, nước tiểu nhiều bọt.","vitals":{"hr":88,"sbp":124,"dbp":78,"rr":20,"t":36.8,"spo2":97},"ask":[["Phù xuất hiện thế nào và có ảnh hưởng gì?","Phù mí mắt buổi sáng rồi phù hai chân, tăng 6 kg trong 3 tuần, bụng căng hơn.","e"],["Nước tiểu có thay đổi gì không?","Nước tiểu nhiều bọt lâu tan, lượng hơi ít; không tiểu máu, không tiểu buốt.","e"],["Có nhiễm trùng, dùng thuốc, dị ứng trước đó không?","Viêm họng cách đây 6 tuần, tự mua kháng sinh; không dùng NSAID; không dị ứng.","e"],["Có sốt, đau khớp, phát ban, rụng tóc, loét miệng không?","Không.","e"],["Có khó thở, đau ngực hoặc đau, sưng một bên chân không?","Hơi khó thở khi nằm thấp; không đau ngực; hai chân phù đối xứng, không đau.","e"],["Tiền sử bệnh thận, đái tháo đường, tăng huyết áp, viêm gan B, HIV?","Không rõ; chưa từng xét nghiệm.","n"],["Gia đình có ai mắc bệnh thận không?","Không.","n"]],"exam":[["K","Phù","Phù mềm, ấn lõm, mặt, hai chân đến đùi, bìu phù, báng bụng lượng ít.","e"],["K","Phổi và tim","Rì rào phế nang giảm hai đáy, gõ đục nhẹ; tim đều, không tiếng thổi.","e"],["K","Tĩnh mạch cổ, gan, bụng","Tĩnh mạch cổ không nổi; gan không to; dịch tự do bụng ít.","e"],["K","Chân","Hai chân phù đối xứng, không nóng đỏ, không đau bắp chân.","n"]],"tests":[["Tổng phân tích nước tiểu và protein niệu 24 giờ",10,"Protein niệu 4+, protein 24 giờ 7,2 g; không hồng cầu, thấy trụ mỡ.","e"],["Albumin, protein toàn phần, cholesterol, triglycerid máu",10,"Albumin 17 g/L; protein toàn phần 42 g/L; cholesterol toàn phần 11,2 mmol/L; triglycerid 3,8 mmol/L.","e"],["Creatinin, ure, eGFR, điện giải",10,"Creatinin 82 umol/L, eGFR 118; Na 132 mmol/L; K 3,8 mmol/L.","e"],["Kháng thể kháng nhân, bổ thể, HBsAg, anti-HCV, HIV, kháng thể kháng PLA2R",10,"Kháng thể kháng nhân âm tính; C3, C4 bình thường; HBsAg, anti-HCV, HIV âm tính; anti-PLA2R âm tính.","e"],["Siêu âm thận",15,"Hai thận kích thước bình thường, đậm độ vỏ bình thường.","n"],["Sinh thiết thận ngay lúc đang phù nặng và rối loạn đông máu chưa kiểm soát",10,"Chỉ làm khi có chỉ định và điều kiện an toàn; không phải ưu tiên tức thời.","w"]],"opt":{"ydx":["+Hội chứng thận hư nguyên phát, nghi bệnh cầu thận thay đổi tối thiểu hoặc xơ hóa ổ cạnh sinh, cần sinh thiết thận","Viêm cầu thận cấp hậu nhiễm liên cầu","Suy tim phải gây phù","Xơ gan mất bù gây phù và báng bụng"],"dieu_tri":["+Corticosteroid kết hợp ức chế men chuyển, lợi tiểu, statin và dự phòng huyết khối khi cần","Chỉ truyền albumin và lợi tiểu liều cao lặp lại","Kháng sinh kéo dài không cần chẩn đoán","Truyền dịch ưu trương để chống phù"],"bien_chung":["+Huyết khối tĩnh mạch, nhiễm trùng, suy thận cấp, rối loạn lipid","Chỉ có nguy cơ hạ đường huyết","Không có biến chứng đáng kể","Chỉ có tăng kali nặng"]},"actions":["++Xác định hội chứng thận hư bằng protein niệu 24 giờ, albumin máu, lipid máu|2|Protein niệu trên 3,5 g/24 giờ, albumin dưới 30 g/L, phù và tăng lipid máu là tiêu chuẩn chẩn đoán.","++Tầm soát nguyên nhân thứ phát: lupus, viêm gan B, C, HIV, thuốc, đái tháo đường|2|Cần loại trừ nguyên nhân thứ phát trước khi dùng thuốc ức chế miễn dịch.","+Hạn chế muối, dùng lợi tiểu quai, ức chế men chuyển để giảm protein niệu|2|Giảm phù và bảo vệ cầu thận.","+Hội chẩn thận học, chuẩn bị sinh thiết thận khi đủ điều kiện|2|Người lớn thường cần mô bệnh học để chọn điều trị.","+Đánh giá nguy cơ huyết khối và cân nhắc chống đông dự phòng khi albumin rất thấp|2|Mất antithrombin và tăng yếu tố đông máu gây tăng đông.","!Dùng NSAID giảm đau và truyền dịch nhiều để làm nặng phù đỡ|0|NSAID làm nặng tổn thương thận và giữ muối nước."],"teach":"Hội chẩn hội chứng thận hư cần bốn tiêu chuẩn: phù, protein niệu trên 3,5 g/24 giờ, albumin máu dưới 30 g/L, tăng lipid máu. Ở người lớn phải tìm nguyên nhân thứ phát và thường cần sinh thiết thận; nhớ biến chứng huyết khối và nhiễm trùng.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N14, nam, 28 tuổi, nhân viên giao hàng; nhập khoa Thận.","ly_do_vao_vien":"Phù toàn thân, nước tiểu nhiều bọt ba tuần.","benh_su":"Ba tuần nay người bệnh phù mí mắt buổi sáng rồi phù hai chân, bìu và bụng, tăng 6 kg, nước tiểu nhiều bọt, lượng ít. Hơi khó thở khi nằm thấp. Sáu tuần trước viêm họng, tự mua kháng sinh uống. Không sốt, đau khớp, phát ban, tiểu máu. Không đau chân, không đau ngực.","tien_su":"Chưa biết bệnh thận, đái tháo đường, tăng huyết áp. Chưa xét nghiệm viêm gan B, HIV. Không dùng NSAID. Không dị ứng thuốc. Gia đình không ai bệnh thận.","luoc_qua_co_quan":"Thận tiết niệu: nước tiểu bọt, tiểu ít. Hô hấp: khó thở nhẹ khi nằm. Tuần hoàn: không đau ngực, phù hai chân. Tiêu hóa: bụng căng nhẹ, không vàng da. Cơ xương khớp: không đau khớp. Da: không ban.","kham_hien_tai":"Tỉnh, phù mềm ấn lõm mặt, hai chân đến đùi, bìu. Mạch 88 lần/phút, HA 124/78 mmHg, nhịp thở 20, nhiệt độ 36,8 độ C, SpO2 97%. Rì rào phế nang giảm hai đáy, gõ đục nhẹ. Tim đều. Tĩnh mạch cổ không nổi, gan không to, báng bụng ít. Hai chân không nóng đỏ.","can_lam_sang":"Protein niệu 24 giờ 7,2 g, trụ mỡ, không hồng cầu. Albumin 17 g/L, protein toàn phần 42 g/L, cholesterol 11,2 mmol/L, triglycerid 3,8 mmol/L. Creatinin 82 umol/L, eGFR 118, Na 132 mmol/L. ANA âm tính, C3, C4 bình thường, HBsAg, anti-HCV, HIV, anti-PLA2R âm tính. Siêu âm thận bình thường.","tom_tat":"Nam 28 tuổi, phù tăng dần ba tuần, tăng cân 6 kg, nước tiểu nhiều bọt; protein niệu 7,2 g/24 giờ, albumin 17 g/L, cholesterol 11,2 mmol/L, không hồng cầu niệu, chức năng thận bảo tồn, huyết áp bình thường; các xét nghiệm tìm nguyên nhân thứ phát âm tính.","dat_van_de":"Hội chứng thận hư thuần túy; nguyên nhân (nguyên phát hay thứ phát) cần xác định; giảm thể tích kèm giảm natri máu nhẹ; nguy cơ huyết khối và nhiễm trùng; quyết định điều trị ức chế miễn dịch.","chan_doan_so_bo":"Hội chứng thận hư nguyên phát ở người lớn trẻ, nghi bệnh cầu thận thay đổi tối thiểu hoặc xơ hóa ổ cạnh sinh.","bien_luan":"Bước 1: đủ bốn tiêu chuẩn của hội chứng thận hư (phù, protein niệu trên 3,5 g/24 giờ, albumin dưới 30 g/L, tăng lipid máu). Bước 2: kiểu hội chứng, không tăng huyết áp, không tiểu máu, creatinin bình thường, bổ thể bình thường, trụ mỡ, nên là thuần túy, thiên về tổn thương podocyte hơn là viêm cầu thận tăng sinh hay viêm cầu thận cấp hậu nhiễm liên cầu (bổ thể thấp, tiểu máu, tăng huyết áp, thường tự hồi phục). Bước 3: loại trừ thứ phát, lupus (ANA âm), viêm gan B, C, HIV âm tính, không dùng NSAID, chưa có đái tháo đường (cần kiểm tra glucose, HbA1c). Bước 4: loại trừ nguyên nhân phù khác, suy tim phải (tĩnh mạch cổ không nổi), xơ gan (men gan, albumin giảm do mất qua nước tiểu). Bước 5: người lớn cần sinh thiết thận để xác định mô học và hướng dẫn điều trị.","sinh_ly_benh":"Tổn thương podocyte và màng lọc cầu thận làm mất tính thấm chọn lọc, protein, nhất là albumin, thoát ra nước tiểu. Giảm albumin máu làm giảm áp lực keo, nước thoát vào khoảng kẽ gây phù, giảm thể tích tuần hoàn hiệu dụng kích hoạt hệ renin-angiotensin-aldosterone và ADH giữ muối nước, tăng phù và hạ natri. Gan tăng tổng hợp lipoprotein bù trừ gây tăng cholesterol, triglycerid. Mất antithrombin III qua nước tiểu và tăng fibrinogen gây tăng đông; mất immunoglobulin và yếu tố bổ thể làm tăng nguy cơ nhiễm trùng.","chan_doan_phan_biet":"Viêm cầu thận cấp hậu nhiễm liên cầu; bệnh thận lupus; bệnh thận màng; bệnh thận đái tháo đường; bệnh thận do viêm gan B; amyloidosis; suy tim phải; xơ gan; suy dinh dưỡng.","chan_doan_xac_dinh":"Hội chứng thận hư thuần túy ở người lớn, nghi nguyên phát (bệnh cầu thận thay đổi tối thiểu hoặc xơ hóa ổ cạnh sinh), xác định bằng sinh thiết thận; biến chứng hạ natri và giảm thể tích nhẹ.","dieu_tri":"Chế độ ăn giảm muối, lượng đạm vừa đủ. Lợi tiểu quai điều chỉnh theo cân nặng và thể tích; ức chế men chuyển để giảm protein niệu; statin khi tăng lipid kéo dài. Sinh thiết thận trước hoặc song song điều trị khi điều kiện an toàn. Corticosteroid liều pháp đồ nếu mô học phù hợp (bệnh thay đổi tối thiểu); thuốc ức chế miễn dịch khác khi đề kháng hoặc tái phát nhiều. Dự phòng huyết khối bằng chống đông khi albumin rất thấp hoặc có yếu tố nguy cơ. Tiêm phòng phế cầu, cúm. Theo dõi nhiễm trùng, kali, đường huyết khi dùng corticosteroid.","tien_luong":"Bệnh thay đổi tối thiểu ở người lớn đáp ứng corticosteroid tốt nhưng hay tái phát; xơ hóa ổ cạnh sinh tiên lượng nặng hơn, có thể tiến triển suy thận mạn. Biến chứng huyết khối, nhiễm trùng ảnh hưởng tiên lượng ngắn hạn.","du_phong":"Giáo dục về muối, cân nặng hằng ngày, nhận biết nhiễm trùng và huyết khối; tuân thủ giảm liều corticosteroid; tầm soát loãng xương, đái tháo đường, tăng huyết áp do thuốc; theo dõi protein niệu và creatinin định kỳ; tiêm phòng; tránh NSAID và thuốc độc thận."},"nguon":["KDIGO 2021 Clinical Practice Guideline for the Management of Glomerular Diseases. Kidney Int 2021.","Bộ Y tế. Hướng dẫn chẩn đoán và điều trị bệnh thận, tiết niệu (Quyết định 3931/QĐ-BYT, 2015).","Giáo trình Nội khoa, bộ môn Nội, các trường đại học Y Việt Nam."],"status":"nhap"},{"id":"noi-than-003","title":"Sốt rét run và đau hông lưng phải, tiểu buốt","kind":"Nội","level":"Dễ","group":"noi","name":"Người bệnh mô phỏng N15","age":31,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu là giả định. Người bệnh nữ 31 tuổi nhập viện vì sốt cao rét run, đau hông lưng phải và tiểu buốt, tiểu rắt ba ngày.","vitals":{"hr":104,"sbp":108,"dbp":64,"rr":20,"t":39.4,"spo2":98},"ask":[["Triệu chứng tiết niệu bắt đầu thế nào?","Ba ngày nay tiểu buốt, tiểu rắt, nước tiểu đục; sau đó đau âm ỉ hông lưng phải.","e"],["Sốt và rét run diễn tiến ra sao?","Sốt cao rét run từ hôm qua, uống paracetamol đỡ ít rồi sốt lại; có buồn nôn.","e"],["Có nôn nhiều, không ăn uống được, choáng váng khi đứng không?","Nôn 2 lần, uống ít nước, hơi choáng khi đứng dậy.","e"],["Có đang mang thai, đái tháo đường, sỏi tiết niệu hoặc dị tật tiết niệu không?","Không mang thai; không đái tháo đường; chưa từng sỏi.","e"],["Có từng nhiễm trùng tiểu, dùng kháng sinh gần đây hoặc đặt ống thông không?","Một lần viêm bàng quang năm ngoái, tự khỏi; không dùng kháng sinh gần đây; không đặt ống thông.","e"],["Có tiểu máu, ra khí hư, đau bụng dưới không?","Không tiểu máu; không khí hư bất thường; đau bụng dưới nhẹ.","n"],["Có dị ứng thuốc không?","Dị ứng penicillin dạng phát ban nhẹ khi còn nhỏ.","e"]],"exam":[["K","Dấu hiệu sinh tồn và toàn trạng","Sốt cao, mạch nhanh, vẻ mặt mệt, khô môi nhẹ, chưa lú lẫn.","e"],["K","Vùng hông lưng","Rung thận phải dương tính, ấn góc sườn-sống lưng phải đau.","e"],["K","Bụng","Bụng mềm, ấn đau nhẹ hạ vị, không phản ứng thành bụng.","e"],["K","Tim phổi","Tim nhanh đều, phổi trong.","n"]],"tests":[["Tổng phân tích nước tiểu",10,"Bạch cầu niệu 3+, nitrit dương tính, hồng cầu niệu 1+, thấy trụ bạch cầu.","e"],["Cấy nước tiểu và kháng sinh đồ",10,"Đã lấy mẫu giữa dòng trước kháng sinh; kết quả đang chờ (sau đó E. coli).","e"],["Công thức máu, CRP, creatinin, điện giải",10,"Bạch cầu 17,8 G/L (bạch cầu đa nhân 88%); CRP 156 mg/L; creatinin 78 umol/L; K 3,6 mmol/L.","e"],["Cấy máu hai bộ",10,"Đã lấy hai bộ trước kháng sinh, kết quả đang chờ.","e"],["Siêu âm hệ tiết niệu",15,"Thận phải to nhẹ, không giãn đài bể thận, không sỏi, không ổ tụ dịch.","e"],["CT bụng có cản quang ngay lập tức trước khi bắt đầu điều trị",40,"Không cần thiết nếu chưa có dấu hiệu biến chứng hoặc không đáp ứng sau 48 đến 72 giờ.","w"]],"opt":{"ydx":["Viêm bàng quang cấp đơn thuần","+Viêm thận bể thận cấp không biến chứng, nhiều khả năng do E. coli","Cơn đau quặn thận do sỏi niệu quản","Viêm phần phụ cấp"],"khang_sinh":["+Ceftriaxone tĩnh mạch hoặc nhóm fluoroquinolone, điều chỉnh theo kháng sinh đồ; tránh penicillin do tiền sử dị ứng","Nitrofurantoin đường uống đơn độc","Amoxicillin đường uống, không cần cấy nước tiểu","Chỉ cần uống nhiều nước và hạ sốt"],"thoi_gian":["+Từ 7 đến 14 ngày tùy kháng sinh và đáp ứng lâm sàng","Một liều duy nhất","Ba ngày là đủ","Ít nhất sáu tuần liên tục"]},"actions":["++Lấy nước tiểu giữa dòng và máu cấy trước, rồi bắt đầu kháng sinh tĩnh mạch sớm|2|Điều trị kháng sinh theo kinh nghiệm không được trì hoãn khi có sốt cao và dấu hiệu nhiễm khuẩn toàn thân.","++Bù dịch đường tĩnh mạch, hạ sốt, giảm đau|2|Có mất nước nhẹ và nhịp tim nhanh.","+Chọn kháng sinh phù hợp tiền sử dị ứng và dịch tễ kháng thuốc địa phương|2|Người bệnh dị ứng penicillin nhẹ; ưu tiên cephalosporin thế hệ 3 hoặc fluoroquinolone theo kháng sinh đồ.","+Siêu âm để loại trừ tắc nghẽn hoặc ổ áp xe|2|Siêu âm là bước đầu, không xâm lấn.","+Đánh giá lại sau 48 đến 72 giờ; nếu không đáp ứng thì chụp CT|2|Thất bại điều trị gợi ý biến chứng hoặc kháng thuốc.","!Chỉ dùng kháng sinh đường uống một liều rồi cho về mà không cấy hay theo dõi|0|Có nguy cơ nhiễm khuẩn huyết và tổn thương thận."],"teach":"Viêm thận bể thận cấp biểu hiện sốt, đau hông lưng, rung thận dương tính kèm triệu chứng tiết niệu dưới; nước tiểu có bạch cầu, nitrit dương tính. Phải cấy nước tiểu, cấy máu trước kháng sinh, điều trị sớm và loại trừ tắc nghẽn khi bệnh nặng hoặc không đáp ứng.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N15, nữ, 31 tuổi, giáo viên; nhập khoa Nội tổng hợp.","ly_do_vao_vien":"Sốt cao rét run, đau hông lưng phải, tiểu buốt.","benh_su":"Ba ngày trước tiểu buốt, tiểu rắt, nước tiểu đục, sau đó đau âm ỉ hông lưng phải. Từ hôm qua sốt cao rét run, buồn nôn, nôn hai lần, uống ít nước, choáng nhẹ khi đứng. Không tiểu máu, không khí hư bất thường, không đau quặn dữ dội lan xuống bìu hay đùi. Tự dùng paracetamol, sốt giảm tạm thời.","tien_su":"Một đợt viêm bàng quang năm trước tự khỏi. Chưa từng sỏi tiết niệu hay dị tật. Không đái tháo đường. Không mang thai. Dị ứng penicillin nhẹ (phát ban) khi nhỏ. Không đặt ống thông, không dùng kháng sinh gần đây.","luoc_qua_co_quan":"Tiết niệu: tiểu buốt, tiểu rắt, nước tiểu đục. Tiêu hóa: buồn nôn, nôn. Tuần hoàn: choáng khi đứng. Sinh dục: không khí hư. Hô hấp: bình thường.","kham_hien_tai":"Tỉnh, mệt, khô môi nhẹ. Mạch 104 lần/phút, HA 108/64 mmHg, nhiệt độ 39,4 độ C, nhịp thở 20, SpO2 98%. Rung thận phải dương tính, đau góc sườn-sống phải. Bụng mềm, ấn đau nhẹ hạ vị. Tim phổi bình thường.","can_lam_sang":"Nước tiểu bạch cầu 3+, nitrit dương, trụ bạch cầu. Bạch cầu máu 17,8 G/L (đa nhân 88%), CRP 156 mg/L, creatinin 78 umol/L, K 3,6 mmol/L. Siêu âm: thận phải to nhẹ, không giãn đài bể thận, không sỏi, không ổ tụ dịch. Cấy nước tiểu, cấy máu đang chờ.","tom_tat":"Nữ 31 tuổi, hội chứng kích thích bàng quang ba ngày rồi sốt cao rét run kèm đau hông lưng phải; rung thận phải dương tính; bạch cầu máu và CRP tăng, nước tiểu bạch cầu và nitrit dương, trụ bạch cầu; siêu âm không tắc nghẽn; chức năng thận bình thường.","dat_van_de":"Nhiễm khuẩn tiết niệu trên có sốt; mất nước nhẹ; nguy cơ nhiễm khuẩn huyết; tiền sử dị ứng penicillin cần lưu ý chọn kháng sinh.","chan_doan_so_bo":"Viêm thận bể thận cấp không biến chứng, nghi do E. coli.","bien_luan":"Bước 1: hội chứng nhiễm khuẩn, sốt rét run, bạch cầu và CRP tăng. Bước 2: định khu tiết niệu, đau và rung thận một bên, trụ bạch cầu gợi ý nhiễm khuẩn thận chứ không chỉ bàng quang (viêm bàng quang thường không sốt cao). Bước 3: xác nhận qua nước tiểu có bạch cầu, nitrit dương, cấy nước tiểu. Bước 4: loại trừ biến chứng, siêu âm không giãn đài bể thận, không sỏi, không ổ áp xe nên xếp loại không biến chứng, nếu sau 48 đến 72 giờ vẫn sốt thì cần CT. Bước 5: phân tầng nguy cơ, không mang thai, không đái tháo đường, chức năng thận bình thường, huyết động ổn, nên có thể điều trị nội trú ngắn ngày rồi chuyển đường uống.","sinh_ly_benh":"Vi khuẩn đường ruột, chủ yếu E. coli, cư trú quanh niệu đạo, đi ngược dòng qua bàng quang và niệu quản lên thận nhờ fimbriae P bám vào tế bào biểu mô. Tại thận, vi khuẩn gây viêm tổ chức kẽ và đài bể thận với thâm nhiễm bạch cầu đa nhân, giải phóng cytokin gây sốt, rét run. Tổn thương mô kẽ có thể làm giảm mức lọc; vi khuẩn có thể vào máu gây nhiễm khuẩn huyết. Nữ giới có niệu đạo ngắn nên dễ mắc.","chan_doan_phan_biet":"Viêm bàng quang cấp; sỏi niệu quản nhiễm khuẩn; áp xe thận hoặc quanh thận; viêm phần phụ; viêm ruột thừa (thể sau manh tràng); viêm túi mật; bệnh phổi dưới đáy phải.","chan_doan_xac_dinh":"Viêm thận bể thận cấp không biến chứng do E. coli (xác định sau cấy nước tiểu và kháng sinh đồ).","dieu_tri":"Nhập viện do sốt cao, nôn, mất nước. Lấy nước tiểu và máu cấy rồi dùng kháng sinh tĩnh mạch (ceftriaxone hoặc fluoroquinolone theo dịch tễ, tránh penicillin do dị ứng), điều chỉnh theo kháng sinh đồ. Bù dịch, hạ sốt, giảm đau. Chuyển sang đường uống khi hết sốt 24 đến 48 giờ và ăn uống được; tổng 7 đến 14 ngày. Tái đánh giá, chụp CT nếu không đáp ứng sau 48 đến 72 giờ.","tien_luong":"Tốt với điều trị đúng; hết sốt thường sau 48 đến 72 giờ. Nguy cơ nhiễm khuẩn huyết, áp xe thận và sẹo thận nếu chậm trễ hoặc tái phát.","du_phong":"Uống đủ nước, không nhịn tiểu, đi tiểu sau giao hợp, vệ sinh đúng cách; điều trị sớm nhiễm khuẩn tiểu dưới; tái khám nếu tái phát trên hai lần/6 tháng để tìm bất thường tiết niệu; kiểm soát đường huyết nếu có đái tháo đường."},"nguon":["EAU Guidelines on Urological Infections. European Association of Urology 2024.","IDSA/ESCMID. International Clinical Practice Guidelines for the Treatment of Acute Uncomplicated Cystitis and Pyelonephritis in Women. Clin Infect Dis 2011.","Bộ Y tế. Hướng dẫn sử dụng kháng sinh (Quyết định 708/QĐ-BYT, 2015).","Giáo trình Nội khoa, bộ môn Nội, các trường đại học Y Việt Nam."],"status":"nhap"},{"id":"noi-than-kinh-001","title":"Liệt nửa người phải và nói khó khởi phát đột ngột","kind":"Nội","level":"Khó","group":"noi","name":"Người bệnh mô phỏng N16","age":68,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông ti
