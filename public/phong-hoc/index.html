<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phòng học lâm sàng</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Noto+Serif:wght@600;700&display=swap">
<style>
/* Bố cục: một cột kiểu bệnh án; thanh các mục I–XVI ở trên, mỗi mục là một bước làm trước – đối chiếu sau. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --ink:#14201C; --muted:#5A6B64; --line:#D3DCD7;
  --jade:#17705B; --jade-ink:#FFFFFF; --jade-soft:#DCEEE8;
  --alert:#B3301F; --alert-soft:#F8E1DC; --warn:#A8620A; --warn-soft:#F7E8CF;
  --f-display:'Noto Serif',Georgia,serif; --f-body:'Be Vietnam Pro',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1715; --surface:#15211E; --ink:#E6EFEA; --muted:#8FA39A; --line:#27372F;
  --jade:#4FC3A1; --jade-ink:#06201A; --jade-soft:#1B3A31;
  --alert:#FF7A66; --alert-soft:#3A1E19; --warn:#E5A04A; --warn-soft:#3A2D14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1715; --surface:#15211E; --ink:#E6EFEA; --muted:#8FA39A; --line:#27372F;
  --jade:#4FC3A1; --jade-ink:#06201A; --jade-soft:#1B3A31;
  --alert:#FF7A66; --alert-soft:#3A1E19; --warn:#E5A04A; --warn-soft:#3A2D14; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 40px}
*{box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto}
header.top{padding-block:18px 10px}
.crumb{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-size:26px;line-height:1.2;margin:6px 0 4px;text-wrap:balance}
.demo{display:inline-block;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;margin-top:6px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--jade);color:var(--jade-ink)}
.timer{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-left:auto}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.step{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 11px;font:500 13px var(--f-body);cursor:pointer;text-align:left;min-width:0}
.step small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.step[aria-selected="true"]{border-color:var(--jade);background:var(--jade-soft)}
.step.done small::after{content:" ✓";color:var(--jade)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
main{padding-block:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--f-display);font-size:19px;margin:0}
.code{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.intro{background:var(--jade-soft);border-radius:10px;padding:12px 14px}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.vitals div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.vitals b{display:block;font-size:16px;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.q{border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;padding:10px 12px;font:500 14px var(--f-body);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%}
.q .a{display:none;font-weight:400;color:var(--muted)}
.q.open{border-color:var(--jade)} .q.open .a{display:block;color:var(--ink)}
.q .tag{font-family:var(--f-mono);font-size:10.5px;color:var(--alert)}
textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:400 14px/1.5 var(--f-body);background:var(--bg);color:var(--ink)}
.btn{border:0;background:var(--jade);color:var(--jade-ink);font:600 14px var(--f-body);padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.model{border-left:3px solid var(--jade);background:var(--jade-soft);padding:12px 14px;border-radius:0 10px 10px 0;white-space:pre-line}
.why,.pit{border-radius:10px;padding:12px 14px}
.why{background:var(--surface);border:1px solid var(--jade)}
.pit{background:var(--warn-soft);color:var(--ink)}
.why h3,.pit h3{margin:0 0 4px;font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--jade)}
.pit h3{color:var(--warn)}
ul.tight{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.opt input{margin-top:4px;accent-color:var(--jade)}
.opt .fb{display:none;font-size:13px;color:var(--muted);margin-top:2px}
.opt.show.ok{border-color:var(--jade);background:var(--jade-soft)} .opt.show.no{border-color:var(--alert);background:var(--alert-soft)} .opt.show.mid{border-color:var(--warn);background:var(--warn-soft)}
.opt.show .fb{display:block}
.score{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.hi{color:var(--alert);font-weight:600} td.lo{color:var(--warn);font-weight:600}
.tw{overflow-x:auto}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:4px;accent-color:var(--jade)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.lock{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.sum{display:grid;gap:8px}
.sum div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-block:6px;font-size:14px}
.bubble{background:var(--jade-soft);border-radius:4px 14px 14px 14px;padding:12px 14px;max-width:92%}
.bubble .who{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--jade);display:block;margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:400 14.5px var(--f-body);cursor:pointer}
.o b{font-family:var(--f-mono);color:var(--muted);font-weight:600}
.o[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--jade)}
.big{font-family:var(--f-display);font-size:44px;line-height:1}
.pass{color:var(--jade)} .fail{color:var(--alert)}
.sbar{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13.5px}
.sbar .prog{grid-column:1/-1}
.rev{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rev.bad{border-color:var(--alert);background:var(--alert-soft)}
.docsec h3{margin:10px 0 4px;font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--jade)}
.docsec p,.docsec li{margin:0}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="crumb"><a href="../vien-thuc-hanh/" style="color:inherit">‹ HIU TMC · Viện Thực Hành</a></div>
    <h1>Phòng học lâm sàng</h1>
    <span class="demo">Bản thử · 40 ca của Viện Thực Hành + 1 ca mẫu · luyện phản xạ, chưa đối chiếu nguồn, chưa duyệt chuyên môn</span>
  </header>

  <div class="bar">
    <div class="row">
      <div class="seg" role="group" aria-label="Chế độ"><button id="m-learn" aria-pressed="true" type="button">Học</button><button id="m-exam" aria-pressed="false" type="button">Thi vấn đáp</button></div>
      <span class="timer" id="timer" aria-live="off">Không giới hạn giờ</span>
    </div>
    <div class="steps" id="steps" role="tablist" aria-label="Các mục bệnh án"></div>
  </div>

  <main id="panel"></main>
</div>

<script>
// ---- Ca minh họa (tự soạn để xem giao diện; số liệu giả định) ----
const CASE = {
  intro: "Khoa Nội Tiêu hóa, 22:30. Ông H., 41 tuổi, tài xế, được vợ đưa vào vì đau bụng thượng vị dữ dội 10 giờ.",
  vitals: [["Mạch","98","l/p"],["Huyết áp","120/75","mmHg"],["Nhiệt độ","37.8","°C"],["Nhịp thở","22","l/p"],["SpO₂","97","%"]],
  ask: [
    ["Đau như thế nào, lan đi đâu?","Đau liên tục như dao đâm ở thượng vị, VAS 8/10, lan xuyên ra sau lưng.",1],
    ["Đau khởi phát khi nào, sau việc gì?","Đột ngột, khoảng 5 giờ sau bữa nhậu tối qua.",1],
    ["Tư thế nào đau tăng, tư thế nào đỡ?","Nằm ngửa đau hơn; ngồi cúi người ra trước thì đỡ.",1],
    ["Có nôn không? Nôn xong đau có giảm không?","Nôn 3 lần, thức ăn rồi dịch vàng. Nôn xong đau không giảm.",1],
    ["Còn trung tiện, đi tiêu được không?","Vẫn trung tiện, sáng nay đi tiêu 1 lần, phân vàng.",1],
    ["Uống rượu bia thế nào?","Khoảng 4–5 lon bia, 3 lần mỗi tuần, đã 15 năm. Hút thuốc 1 gói mỗi ngày.",1],
    ["Từng bị sỏi mật, đau bụng, mỡ máu cao chưa?","Chưa từng đi khám tổng quát. Ăn nhiều đồ chiên, nhiều dầu mỡ.",1],
    ["Có đau ngực, khó thở, vã mồ hôi không?","Không đau ngực, không khó thở.",1],
    ["Có sốt, ớn lạnh không?","Thấy ớn lạnh, chưa đo nhiệt độ.",0],
    ["Có chấn thương bụng gần đây không?","Không.",0],
    ["Đang dùng thuốc gì? Có dị ứng không?","Không dùng thuốc thường xuyên, không dị ứng.",0]
  ],
  exam: [
    ["Tổng quát","Tỉnh, nằm co người, vẻ mặt đau. Niêm hồng, củng mạc không vàng. Môi hơi khô.",1],
    ["Tim, phổi","Tim đều, không âm thổi. Phổi trong, không ran.",0],
    ["Bụng – nhìn, nghe","Bụng chướng nhẹ, di động theo nhịp thở. Nhu động ruột giảm, 3 lần/phút.",1],
    ["Bụng – sờ","Ấn đau thượng vị, đề kháng nhẹ vùng thượng vị, không co cứng như gỗ. Gan lách không sờ chạm.",1],
    ["Nghiệm pháp","Murphy (−). Cullen (−). Grey Turner (−).",1],
    ["Thần kinh, tứ chi","Cổ mềm, không dấu thần kinh khu trú. Mạch ngoại vi bắt rõ.",0]
  ],
  tomtat: "BN nam, 41 tuổi, nhập viện vì đau bụng thượng vị dữ dội giờ thứ 10. Đau liên tục, lan ra sau lưng, tăng khi nằm ngửa, giảm khi cúi người ra trước, kèm nôn không giảm đau. Tiền căn uống rượu bia nhiều, ăn nhiều dầu mỡ. Khám: sốt nhẹ 37,8 °C, mạch 98, bụng chướng nhẹ, ấn đau và đề kháng nhẹ thượng vị, các nghiệm pháp Murphy, Cullen, Grey Turner âm tính.",
  dat: "1. Hội chứng đau bụng cấp vùng thượng vị.\n2. Hội chứng viêm nhẹ (sốt nhẹ, mạch nhanh).\n3. Tiền căn: nghiện rượu; nghi rối loạn lipid máu.",
  sobo: [
    ["Viêm tụy cấp, nghĩ do rượu","ok","Đúng hướng: đau thượng vị lan sau lưng, giảm khi cúi người, nôn không giảm đau, rượu."],
    ["Thủng tạng rỗng (loét dạ dày – tá tràng thủng)","mid","Đưa vào chẩn đoán phân biệt, không chọn làm sơ bộ: bụng chưa co cứng, còn nhu động và còn trung tiện."],

    ["Tắc ruột","no","Ít phù hợp: còn trung tiện, còn đi tiêu, đau lan sau lưng không điển hình cho tắc ruột."],
    ["Viêm túi mật cấp","mid","Phân biệt: Murphy (−), không vàng da, nhưng sỏi mật vẫn là nguyên nhân hay gặp của viêm tụy cấp."]
  ],
  pb: [
    ["Viêm tụy cấp","ok","Chẩn đoán sơ bộ, không ghi lặp lại ở phần phân biệt."],
    ["Thủng tạng rỗng","ok","Phải loại trừ: X-quang bụng đứng tìm liềm hơi."],
    ["Nhồi máu cơ tim thành dưới","ok","Phải loại trừ: ECG và troponin."],
    ["Viêm túi mật cấp, sỏi mật","ok","Siêu âm bụng; cũng là nguyên nhân của viêm tụy."],
    ["Loét dạ dày – tá tràng","ok","Nội soi khi ổn định; tầm soát H. pylori."],
    ["Tắc ruột","ok","Còn trung tiện nên ít nghĩ, vẫn nêu và nói lý do loại trừ."],
    ["Hội chứng ruột kích thích","no","Không phù hợp bệnh cảnh cấp tính, đau dữ dội và có sốt."],
    ["Viêm bàng quang","no","Không có triệu chứng tiết niệu."]
  ],
  bienluan: "Ủng hộ viêm tụy cấp: đau thượng vị cấp, liên tục, lan ra sau lưng; giảm khi cúi người ra trước; nôn nhiều nhưng không giảm đau; tiền căn uống rượu bia nhiều; sốt nhẹ.\nThủng tạng rỗng ít nghĩ: không co cứng thành bụng, còn nhu động ruột, chưa có tiền căn loét. Đề nghị X-quang bụng đứng không sửa soạn.\nNhồi máu cơ tim thành dưới ít nghĩ: không đau ngực, không khó thở. Đề nghị ECG, troponin hs.\nViêm túi mật, sỏi mật ít nghĩ: Murphy (−), không vàng da. Đề nghị siêu âm bụng.\nLoét dạ dày – tá tràng ít nghĩ hơn vì đau lan sau lưng, kiểu giảm khi cúi người. Nội soi khi ổn định.\nTắc ruột ít nghĩ: còn trung tiện, còn đi tiêu.",
  rubricBL: ["Nêu ít nhất 3 yếu tố lâm sàng ủng hộ chẩn đoán sơ bộ","Mỗi chẩn đoán phân biệt đều có lý do nghĩ hoặc không nghĩ","Mỗi chẩn đoán phân biệt đi kèm xét nghiệm để loại trừ","Nêu hướng nguyên nhân (rượu, sỏi mật, tăng triglycerid)"],
  cls: [
    ["Lipase máu","ok","Ưu tiên số một: tăng sớm, đặc hiệu hơn amylase."],
    ["Công thức máu, CRP","ok","Đánh giá phản ứng viêm."],
    ["Glucose, ure, creatinin, ion đồ, calci máu","ok","Thường quy và theo dõi mất nước, rối loạn điện giải, tiên lượng."],
    ["AST, ALT, bilirubin","ok","Gợi ý nguyên nhân do mật và đánh giá gan do rượu."],
    ["Triglycerid máu","ok","Tìm nguyên nhân tăng triglycerid."],
    ["ECG, troponin hs","ok","Loại trừ nhồi máu cơ tim thành dưới."],
    ["X-quang bụng đứng không sửa soạn","ok","Loại trừ thủng tạng rỗng, tắc ruột."],
    ["Siêu âm bụng","ok","Tìm sỏi mật, giãn đường mật, hình ảnh tụy."],

    ["Lipase","640","U/L","< 60","hi"],["Amylase","310","U/L","22–80","hi"],["Bạch cầu","13,8","K/μL","4–10","hi"],["CRP","120","mg/L","< 5","hi"],
    ["Glucose","7,8","mmol/L","4,1–5,6","hi"],["Kali","3,3","mmol/L","3,4–4,5","lo"],["Calci toàn phần","2,3","mmol/L","2,2–2,65",""],
    ["Triglycerid","3,1","mmol/L","< 1,7","hi"],["AST / ALT","78 / 42","U/L","< 50","hi"],["Creatinin","86","μmol/L","72–127",""]

  cd: "Viêm tụy cấp do rượu, mức độ nhẹ (Atlanta 2012): không suy tạng, không biến chứng tại chỗ.\nTiêu chuẩn chẩn đoán (đủ 2 trong 3): đau bụng điển hình; lipase tăng ≥ 3 lần giới hạn trên; hình ảnh phù hợp.\nHướng xử trí tham khảo: bù dịch đẳng trương theo đáp ứng, giảm đau, bù kali, cho ăn đường miệng sớm khi đỡ đau, ngưng rượu, theo dõi suy tạng.",

};

const STEPS = [

    pit:["Quên hỏi tiền căn rượu bia, sỏi mật và mỡ máu: đây là ba nguyên nhân thường gặp nhất.","Chỉ ghi “đau bụng”, không mô tả vị trí, hướng lan, yếu tố tăng giảm, hoàn cảnh khởi phát.","Không hỏi các triệu chứng âm tính để loại trừ (đau ngực, trung tiện, đại tiện)."] },
  { id:"kham", code:"VI", title:"Khám", type:"ask", items:CASE.exam,

    pit:["Ghi “bụng mềm” trong khi bệnh nhân đang đau thượng vị và có đề kháng.","Không ghi rõ các nghiệm pháp bắt buộc: Murphy, Cullen, Grey Turner, Mayo-Robson.","Quên đo sinh hiệu và đánh giá mất nước."] },
  { id:"tt", code:"VII–VIII", title:"Tóm tắt, đặt vấn đề", type:"text",
    prompt:"Viết tóm tắt bệnh án (một đoạn) và đặt vấn đề (các hội chứng, triệu chứng chính, tiền căn).", model:CASE.tomtat+"\n\nĐặt vấn đề:\n"+CASE.dat,
    rubric:["Có tuổi, giới và lý do nhập viện kèm thời gian","Nêu đủ triệu chứng cơ năng then chốt (vị trí, lan, giảm khi cúi, nôn)","Nêu triệu chứng thực thể quan trọng, kể cả dấu âm tính có giá trị","Nêu tiền căn liên quan (rượu bia, ăn nhiều mỡ)","Đặt vấn đề theo hội chứng, không chép lại tóm tắt"],
    why:"Tóm tắt là lọc dữ kiện, không phải chép lại bệnh sử. Chỉ giữ những dữ kiện sẽ dùng ở phần biện luận. Đặt vấn đề gom dữ kiện thành hội chứng để dẫn tới chẩn đoán.",
    pit:["Tóm tắt dài như bệnh sử.","Đặt vấn đề bằng tên bệnh thay vì hội chứng.","Bỏ sót tiền căn quan trọng."] },
  { id:"cd", code:"IX–X", title:"Chẩn đoán sơ bộ, phân biệt", type:"pick2",
    why:"Rượu làm tăng co thắt cơ Oddi, làm dịch tụy đặc và tạo nút protein, đồng thời độc trực tiếp lên tế bào tuyến tụy. Calci nội bào tăng làm trypsinogen bị hoạt hóa ngay trong tế bào, tụy tự tiêu hóa và giải phóng các chất gây viêm.",
    pit:["Ghi chẩn đoán sơ bộ trùng với chẩn đoán phân biệt.","Chọn chẩn đoán sơ bộ không bám đúng triệu chứng nổi bật.","Quên các chẩn đoán nguy hiểm cần loại trừ ngay (thủng tạng rỗng, nhồi máu cơ tim thành dưới)."] },
  { id:"bl", code:"XI", title:"Biện luận lâm sàng", type:"text",
    prompt:"Biện luận: vì sao nghĩ chẩn đoán sơ bộ, vì sao nghĩ hoặc không nghĩ từng chẩn đoán phân biệt, đề nghị xét nghiệm tương ứng.", model:CASE.bienluan, rubric:CASE.rubricBL,
    why:"Giám khảo chấm logic: từ dữ kiện ra chẩn đoán, từ chẩn đoán ra xét nghiệm. Mỗi chẩn đoán phân biệt nên có một câu dạng “nghĩ hoặc không nghĩ vì…, đề nghị…”.",

  { id:"cls", code:"XII–XIII", title:"Đề nghị và kết quả CLS", type:"pick3",
    why:"Lipase tăng sớm (4–8 giờ) và còn cao 8–14 ngày, đặc hiệu hơn amylase. Triglycerid máu rất cao có thể làm amylase thấp giả. Kali giảm do nôn: mất H⁺ và Cl⁻ gây kiềm chuyển hóa, giảm thể tích kích hoạt aldosterone làm tăng thải kali qua thận.",
    pit:["Chỉ đề nghị amylase mà quên lipase.","Gom hết vào một dòng thay vì chia: chẩn đoán, biến chứng, thường quy.","Đọc kết quả mà không nêu ý nghĩa với bệnh nhân."] },
  { id:"kl", code:"XIV–XVI", title:"Chẩn đoán, tiên lượng, dự phòng", type:"final",

    pit:["Tiên lượng chỉ ghi “tốt” hoặc “dè dặt” mà không nêu căn cứ.","Dự phòng chung chung, không nêu yếu tố nguy cơ riêng của bệnh nhân.","Không phân biệt dự phòng tái phát và dự phòng biến chứng."] }
];

// ---- Trạng thái ----
const S = { mode:"learn", cur:0, reveal:{}, submitted:false, seen:{}, text:{}, rub:{}, pick:{}, checked:{}, done:{} };
const $ = (s,r=document)=>r.querySelector(s);
const esc = t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const answersOpen = ()=> S.submitted || (S.mode==="learn" && !!S.reveal[STEPS[S.cur].id]);
let timerId=null, secs=0;

function setMode(m){
  S.mode=m; S.submitted=false;
  $("#m-learn").setAttribute("aria-pressed",m==="learn"); $("#m-exam").setAttribute("aria-pressed",m==="viva");
  clearInterval(timerId); clearInterval(V.timer);
  $("#steps").hidden = m==="viva";
  if(m==="viva"){ $("#timer").textContent="Thi vấn đáp"; return vivaPick(); }
  $("#timer").textContent="Không giới hạn giờ"; V.rank=null; learnList();
}
function learnList(){
  S.view="list"; S.mode="learn"; $("#steps").hidden=true; $("#timer").textContent="Không giới hạn giờ";
  const list=orderedDefs(d=>V.filter==="all"||d.track===V.filter);
  $("#panel").innerHTML=`<section class="card"><div class="code">Chọn bệnh án</div><h2>Học theo bệnh án</h2>${trackChips()}
  <div class="list">${list.map(d=>`<button class="q" data-v="lcase" data-id="${esc(d.id)}" type="button"><span><b>${esc(d.title)}</b></span><span class="a" style="display:block;color:var(--muted);font-size:13px">${esc(TRACKS[d.track])} · ${esc(d.level)}${d.id==="demo"?" · học đủ các mục bệnh án":""}</span></button>`).join("")}</div>
  ${list.length?"":`<div class="lock">Mục này chưa có ca. Ca mới đang được bổ sung.</div>`}
  <a class="btn ghost" href="../tu-chan/" style="text-align:center;text-decoration:none">Học xong? Vào trực ở Viện Thực Hành</a></section>`;
}
const HBU_SECS=[["tom_tat","Tóm tắt bệnh án"],["dat_van_de","Đặt vấn đề"],["chan_doan_so_bo","Chẩn đoán sơ bộ"],["bien_luan","Biện luận"],["sinh_ly_benh","Sinh lý bệnh"],["chan_doan_phan_biet","Chẩn đoán phân biệt"],["chan_doan_xac_dinh","Chẩn đoán xác định"],["dieu_tri","Điều trị"],["tien_luong","Tiên lượng"],["du_phong","Dự phòng"]];
function hbuBlock(c){
  if(!c.hbu) return "";
  const body=HBU_SECS.filter(x=>c.hbu[x[0]]).map(x=>`<h3>${x[1]}</h3><p style="margin:0 0 8px">${esc(c.hbu[x[0]])}</p>`).join("");
  const src=(c.nguon&&c.nguon.length)?`<p style="margin:8px 0 0;color:var(--muted);font-size:13px">Nguồn tham khảo: ${c.nguon.map(esc).join(" ; ")}</p>`:"";
  return `<div class="why"><h3 style="margin-top:0">Phân tích theo mẫu bệnh án</h3>${body}${src}<p style="margin:8px 0 0;color:var(--muted);font-size:13px">Ca mô phỏng tự soạn để luyện phản xạ, chưa duyệt chuyên môn.</p></div>`;
}
function bankStudy(def){
  const c=BANK.find(x=>x.id===def.id), yh=trackOf(c)==="yhct"; S.view="bank"; $("#steps").hidden=true;
  const plus=l=>(l||[]).filter(o=>o[0]==="+"||o[0]==="~").map(o=>o.slice(1));
  const A=c.actions.map(parseAct), by=k=>A.filter(a=>a.k===k);
  const li=(arr)=>arr.map(a=>`<li><b>${esc(a.text)}</b>${a.why?" · "+esc(a.why):""}</li>`).join("");
  const ans=!S.lreveal?`<button class="btn" data-v="lreveal" type="button">Xem đáp án và bài học</button>`:`<div class="why"><h3>Chẩn đoán</h3><ul class="tight"><li><b>Tây y:</b> ${esc(plus(c.opt.ydx).join("; "))}</li>${yh?["bd:Bệnh danh","bc:Bát cương","the:Thể bệnh","phap:Pháp","phuong:Phương","huyet:Huyệt"].map(x=>{const[k,n]=x.split(":");const v=plus(c.opt[k]);return v.length?`<li><b>${n}:</b> ${esc(v.join("; "))}</li>`:"";}).join(""):""}</ul></div>
  <div class="why"><h3>Cận lâm sàng cần làm</h3><ul class="tight">${c.tests.filter(t=>t[3]==="e").map(t=>`<li><b>${esc(t[0])}:</b> ${esc(t[2])}</li>`).join("")}</ul>${c.tests.some(t=>t[3]==="w")?`<p style="margin:6px 0 0"><b>Không có chỉ định:</b> ${esc(c.tests.filter(t=>t[3]==="w").map(t=>t[0]).join("; "))}</p>`:""}</div>
  <div class="why"><h3>Xử trí</h3><ul class="tight">${li(by("++"))}${li(by("+"))}</ul>${by("!").length?`<h3>Không nên làm</h3><ul class="tight">${li(by("!"))}</ul>`:""}</div>
  ${hbuBlock(c)}<div class="pit"><h3>Bài học then chốt</h3>${esc(tch(c))}</div>`;
  $("#panel").innerHTML=`<section class="card"><button class="btn ghost" data-v="lback" type="button">‹ Danh sách ca</button><div class="code">${esc(TRACKS[def.track])}</div><h2>${esc(c.title)}</h2>${bankDoc(c)}${ans}</section>`;
  window.scrollTo({top:0});
}
function renderSteps(){
  $("#steps").innerHTML = STEPS.map((st,i)=>`<button class="step ${S.done[st.id]?"done":""}" role="tab" aria-selected="${i===S.cur}" data-i="${i}" type="button"><small>${st.code}</small>${esc(st.title)}</button>`).join("");
}
function whyBlock(st){
  if(!answersOpen()) return S.mode==="learn" ? `<button class="btn ghost" id="reveal" type="button">Xem sinh lý bệnh và lỗi hay gặp</button>` : `<div class="lock">Phần sinh lý bệnh và lỗi hay gặp mở sau khi bấm “Nộp bài”.</div>`;
  return `<div class="why"><h3>Sinh lý bệnh: vì sao?</h3>${esc(st.why)}</div><div class="pit"><h3>Hay sai khi thi</h3><ul class="tight">${st.pit.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`;
}
function render(){
  renderSteps();
  const st=STEPS[S.cur]; let body="";
  const head=`<div class="code">Mục ${esc(st.code)}</div><h2>${esc(st.title)}</h2>`;
  if(st.type==="ask") body=renderAsk(st);
  else if(st.type==="text") body=renderText(st);
  else if(st.type==="pick2") body=renderPick2(st);
  else if(st.type==="pick3") body=renderPick3(st);
  else body=renderFinal(st);
  const first=S.cur===0, last=S.cur===STEPS.length-1;
  $("#panel").innerHTML = `<section class="card"><button class="btn ghost" data-v="lback" type="button">‹ Danh sách ca</button>${head}${S.cur===0?`<div class="intro"><b>Ca mẫu: Đau thượng vị cấp sau bữa nhậu.</b> ${esc(CASE.intro)}</div><div class="vitals">${CASE.vitals.map(v=>`<div>${esc(v[0])}<b>${esc(v[1])}</b>${esc(v[2])}</div>`).join("")}</div>`:""}${body}${whyBlock(st)}
    <div class="nav"><button class="btn ghost" data-nav="-1" ${first?"disabled":""} type="button">Mục trước</button>${last?`<button class="btn" id="submit" type="button">${S.mode==="exam"&&!S.submitted?"Nộp bài":"Xem điểm tự đánh giá"}</button>`:`<button class="btn" data-nav="1" type="button">Mục tiếp</button>`}</div></section>`;
}
function renderAsk(st){
  const seen=S.seen[st.id]||(S.seen[st.id]=new Set());
  const keyN=st.items.filter(i=>i[2]).length, keyGot=st.items.filter((i,k)=>i[2]&&seen.has(k)).length;
  const hint=st.id==="hb"?"Bấm câu hỏi bạn muốn hỏi bệnh nhân.":"Bấm phần bạn muốn khám.";
  return `<p style="margin:0;color:var(--muted)">${hint} Câu có nhãn “then chốt” là câu giám khảo thường chờ bạn hỏi.</p>
  <div class="list">${st.items.map((it,k)=>`<button class="q ${seen.has(k)?"open":""}" data-ask="${k}" type="button"><span>${esc(it[0])}${answersOpen()&&it[2]?` <span class="tag">THEN CHỐT</span>`:""}</span><span class="a">${esc(it[1])}</span></button>`).join("")}</div>
  <div class="score">Then chốt đã hỏi: ${keyGot}/${keyN}${answersOpen()&&keyGot<keyN?" · còn thiếu: "+esc(st.items.filter((i,k)=>i[2]&&!seen.has(k)).map(i=>i[0]).join("; ")):""}</div>`;
}
function renderText(st){
  const v=S.text[st.id]||"", rub=S.rub[st.id]||(S.rub[st.id]=new Set());
  return `<p style="margin:0">${esc(st.prompt)}</p><textarea id="ta" aria-label="Bài làm của bạn" placeholder="Viết bằng lời của bạn rồi so với đáp án mẫu…">${esc(v)}</textarea>
  ${answersOpen()?`<div class="model">${esc(st.model)}</div><div><b>Tự chấm</b> (đánh dấu mục bạn đã làm được)</div>${st.rubric.map((r,k)=>`<label class="check"><input type="checkbox" data-rub="${k}" ${rub.has(k)?"checked":""}><span>${esc(r)}</span></label>`).join("")}`:
  `<div class="lock">${S.mode==="exam"?"Đáp án mẫu mở sau khi nộp bài.":"Viết xong thì bấm “Xem sinh lý bệnh và lỗi hay gặp” bên dưới để mở đáp án mẫu."}</div>`}`;
}
function pickList(id,list,multi){
  const sel=S.pick[id]||(S.pick[id]=new Set()), shown=S.checked[id]&&answersOpenFor();
  return `<div class="list">${list.map((o,k)=>`<label class="opt ${shown?"show "+o[1]:""}"><input type="${multi?"checkbox":"radio"}" name="${id}" data-pick="${id}" data-k="${k}" ${sel.has(k)?"checked":""}><span>${esc(o[0])}<span class="fb">${esc(o[2])}</span></span></label>`).join("")}</div>`;
}
const answersOpenFor=()=>S.mode==="learn"||S.submitted;
function renderPick2(st){
  return `<p style="margin:0"><b>Chẩn đoán sơ bộ</b>: chọn một.</p>${pickList("sobo",CASE.sobo,false)}
  <p style="margin:0"><b>Chẩn đoán phân biệt</b>: chọn các chẩn đoán cần nêu.</p>${pickList("pb",CASE.pb,true)}
  ${S.mode==="learn"?`<button class="btn" data-check="cd" type="button">Kiểm tra</button>`:`<div class="lock">Đáp án mở sau khi nộp bài.</div>`}${S.checked.cd&&answersOpenFor()?`<div class="score">${scoreText("sobo",CASE.sobo)} · ${scoreText("pb",CASE.pb)}</div>`:""}`;
}
function renderPick3(st){
  const shown=S.checked.cls&&answersOpenFor();
  return `<p style="margin:0">Chọn các xét nghiệm bạn đề nghị cho bệnh nhân này.</p>${pickList("cls",CASE.cls,true)}
  ${S.mode==="learn"?`<button class="btn" data-check="cls" type="button">Kiểm tra và xem kết quả</button>`:`<div class="lock">Kết quả xét nghiệm mở sau khi nộp bài.</div>`}${shown?`<div class="score">${scoreText("cls",CASE.cls)}</div>
  <div class="tw"><table><thead><tr><th>Xét nghiệm</th><th>Kết quả</th><th>Đơn vị</th><th>Tham chiếu</th></tr></thead><tbody>${CASE.kq.map(r=>`<tr><td>${esc(r[0])}</td><td class="${r[4]}">${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}</tbody></table></div><p style="margin:0">${esc(CASE.kqText)}</p>`:""}`;
}
function scoreText(id,list){
  const sel=S.pick[id]||new Set(); const good=list.map((o,k)=>o[1]==="ok"?k:-1).filter(k=>k>=0);
  const hit=good.filter(k=>sel.has(k)).length, wrong=[...sel].filter(k=>list[k][1]==="no").length;
  return `Đúng ${hit}/${good.length}${wrong?`, chọn nhầm ${wrong}`:""}`;
}
function renderFinal(st){
  const t=S.text.final||"";
  return `<p style="margin:0">Viết chẩn đoán xác định, tiên lượng gần và xa, dự phòng.</p><textarea id="ta" aria-label="Bài làm của bạn">${esc(t)}</textarea>
  ${answersOpen()?`<div class="model">${esc(CASE.cd)}\n\n${esc(CASE.tl)}\n\n${esc(CASE.dp)}</div>${S.showSum?summary():""}`:`<div class="lock">${S.mode==="exam"?"Đáp án mẫu mở sau khi nộp bài.":"Viết xong thì bấm “Xem sinh lý bệnh và lỗi hay gặp” bên dưới để mở đáp án mẫu."}</div>`}`;
}
function summary(){
  const ask1=STEPS[0].items, ask2=STEPS[1].items, s1=S.seen.hb||new Set(), s2=S.seen.kham||new Set();
  const k=(items,seen)=>{const a=items.filter(i=>i[2]).length;const b=items.filter((i,x)=>i[2]&&seen.has(x)).length;return `${b}/${a}`};
  const r=(id)=>`${(S.rub[id]||new Set()).size}/${STEPS.find(s=>s.id===id).rubric.length}`;
  return `<div class="sum"><div><span>Hỏi bệnh: câu then chốt</span><b>${k(ask1,s1)}</b></div><div><span>Khám: mục then chốt</span><b>${k(ask2,s2)}</b></div><div><span>Tóm tắt, đặt vấn đề</span><b>${r("tt")}</b></div><div><span>Chẩn đoán sơ bộ</span><b>${scoreText("sobo",CASE.sobo)}</b></div><div><span>Chẩn đoán phân biệt</span><b>${scoreText("pb",CASE.pb)}</b></div><div><span>Biện luận</span><b>${r("bl")}</b></div><div><span>Đề nghị CLS</span><b>${scoreText("cls",CASE.cls)}</b></div></div>
  <div class="why"><h3>Ôn nhanh để nhớ lâu</h3><ul class="tight"><li>Đau thượng vị lan sau lưng, giảm khi cúi người ra trước, có rượu: nghĩ viêm tụy cấp, đề nghị lipase.</li><li>Đủ 2 trong 3 tiêu chuẩn: đau điển hình, lipase ≥ 3 lần, hình ảnh.</li><li>Luôn loại trừ thủng tạng rỗng và nhồi máu cơ tim thành dưới trước.</li></ul></div>`;
}

// ---- Sự kiện ----
document.addEventListener("click",e=>{
  const t=e.target.closest("button,label"); if(!t) return;
  if(t.id==="m-learn") return setMode("learn");
  if(t.id==="m-exam") return setMode("viva");
  if(t.dataset.v) return vivaClick(t);
  if(t.classList.contains("step")){ keepText(); S.cur=+t.dataset.i; return render(); }
  if(t.dataset.nav){ keepText(); S.done[STEPS[S.cur].id]=true; S.cur=Math.min(STEPS.length-1,Math.max(0,S.cur+ +t.dataset.nav)); render(); return window.scrollTo({top:0}); }

const POOL = [
 {id:"q01",sec:"hb",q:"Chi tiết nào trong bệnh sử gợi ý đau do tụy hơn là do dạ dày?",o:["Đau thượng vị lan xuyên ra sau lưng, đỡ khi cúi người ra trước","Đau âm ỉ, giảm sau khi ăn no","Đau quặn từng cơn, hết hẳn sau khi nôn","Đau tăng khi hít sâu và khi ho"],e:"Tụy nằm sau phúc mạc, trước cột sống. Viêm và phù nề kích thích sợi thần kinh tạng nên đau lan ra sau lưng, và gập người ra trước làm đau dịu bớt."},

 {id:"q03",sec:"hb",q:"Câu hỏi nào giúp loại trừ tắc ruột nhanh nhất ở bệnh nhân này?",o:["Còn trung tiện và đi tiêu được không?","Có ho khạc đờm không?","Có tiểu buốt không?","Có đau khớp không?"],e:"Tắc ruột thường không trung tiện, không đại tiện. Bệnh nhân còn trung tiện và đi tiêu nên ít nghĩ."},
 {id:"q04",sec:"kham",q:"Dấu hiệu nào gợi ý thủng tạng rỗng và không có ở bệnh nhân này?",o:["Bụng co cứng như gỗ","Nhu động ruột giảm nhẹ","Ấn đau thượng vị","Sốt nhẹ"],e:"Co cứng thành bụng kiểu bụng gỗ là dấu của viêm phúc mạc do thủng. Ca này chỉ đề kháng nhẹ khu trú thượng vị."},
 {id:"q05",sec:"kham",q:"Cullen và Grey Turner đều âm tính nghĩa là gì?",o:["Không có dấu xuất huyết sau phúc mạc, nhưng chưa loại trừ viêm tụy cấp","Loại trừ hoàn toàn viêm tụy cấp","Chứng tỏ viêm tụy cấp thể nặng","Chẩn đoán xác định tắc ruột"],e:"Hai dấu này chỉ xuất hiện ở thể nặng có xuất huyết sau phúc mạc và hiếm gặp, nên âm tính không loại trừ."},
 {id:"q06",sec:"kham",q:"Murphy (−) ở bệnh nhân này có ý nghĩa gì?",o:["Ít ủng hộ viêm túi mật cấp","Loại trừ hoàn toàn sỏi mật","Xác định viêm tụy cấp","Ủng hộ thủng tạng rỗng"],e:"Murphy âm tính làm ít nghĩ viêm túi mật cấp, nhưng không loại trừ sỏi mật là nguyên nhân gây viêm tụy, nên vẫn cần siêu âm."},
 {id:"q07",sec:"dv",q:"Cách đặt vấn đề nào đúng cho ca này?",o:["Hội chứng đau bụng cấp vùng thượng vị; hội chứng viêm nhẹ; tiền căn rượu bia","Viêm tụy cấp do rượu","Đau bụng, nôn, sốt","Nhồi máu cơ tim thành dưới"],e:"Đặt vấn đề là gom dữ kiện thành hội chứng. Tên bệnh thuộc phần chẩn đoán, không phải đặt vấn đề."},
 {id:"q08",sec:"dv",q:"Tóm tắt bệnh án nên làm thế nào?",o:["Chọn dữ kiện cần cho biện luận, kể cả dấu âm tính có giá trị","Chép nguyên văn bệnh sử","Chỉ nêu chẩn đoán","Chỉ nêu kết quả xét nghiệm"],e:"Tóm tắt là lọc dữ kiện sẽ dùng ở phần biện luận."},
 {id:"q09",sec:"cd",q:"Chẩn đoán sơ bộ phù hợp nhất với ca này là gì?",o:["Viêm tụy cấp, nghĩ do rượu","Tắc ruột","Hội chứng ruột kích thích","Viêm bàng quang"],e:"Đau thượng vị cấp lan sau lưng, giảm khi cúi người, nôn không giảm đau, tiền căn rượu."},
 {id:"q10",sec:"cd",q:"Hai chẩn đoán phân biệt nguy hiểm cần loại trừ trước tiên là gì?",o:["Thủng tạng rỗng và nhồi máu cơ tim thành dưới","Viêm họng cấp và viêm tai giữa","Thiếu máu thiếu sắt và giun sán","Zona thần kinh và viêm da cơ địa"],e:"Đau thượng vị cấp có thể là biểu hiện của các cấp cứu nội và ngoại khoa này, nên phải chủ động loại trừ."},
 {id:"q11",sec:"cd",q:"Xét nghiệm nào dùng để loại trừ nhồi máu cơ tim thành dưới?",o:["ECG và troponin hs","Lipase và amylase","Siêu âm bụng","Nội soi dạ dày"],e:"Nhồi máu cơ tim thành dưới có thể biểu hiện bằng đau thượng vị, nên cần ECG và troponin."},
 {id:"q12",sec:"cd",q:"Vì sao viêm tụy gây đau lan ra sau lưng?",o:["Tụy nằm sau phúc mạc, trước cột sống; viêm kích thích sợi thần kinh tạng","Do viêm phổi đáy kèm theo","Do sỏi thận","Do co thắt cơ hoành"],e:"Vị trí giải phẫu của tụy giải thích hướng lan của đau."},
 {id:"q13",sec:"bl",q:"Trong biện luận, mỗi chẩn đoán phân biệt nên được trình bày thế nào?",o:["Nêu lý do nghĩ hoặc không nghĩ, và đề nghị xét nghiệm để loại trừ","Chỉ liệt kê tên","Chỉ ghi chẩn đoán nghĩ nhiều nhất","Chép lại tóm tắt bệnh án"],e:"Giám khảo chấm logic từ dữ kiện đến chẩn đoán và từ chẩn đoán đến xét nghiệm."},

 {id:"q15",sec:"cls",q:"Xét nghiệm chẩn đoán nào được ưu tiên số một?",o:["Lipase máu","Troponin hs","D-dimer","Bilan sắt"],e:"Lipase tăng sớm và đặc hiệu cho tụy."},
 {id:"q16",sec:"cls",q:"Vì sao ưu tiên lipase hơn amylase?",o:["Lipase tăng sớm, tồn tại lâu và đặc hiệu hơn; amylase có thể bình thường, nhất là khi triglycerid máu rất cao","Lipase rẻ hơn amylase","Amylase chỉ tăng ở nữ","Hai xét nghiệm hoàn toàn như nhau"],e:"Lipase tăng sau 4–8 giờ và còn cao 8–14 ngày. Triglycerid máu cao có thể làm amylase thấp giả."},

có ra mồ hôi nhiều không? Bây giờ thì sao?","Lúc đầu vã mồ hôi nhiều, bây giờ da khô nóng, không ra mồ hôi.","e"],["Có ngất, co giật, lú lẫn không?","Ngất một lần, hiện nói sảng, lú lẫn.","e"],["Tiền sử bệnh, thuốc, rượu?","Không bệnh nền, không uống rượu hay thuốc.","n"],["Nước tiểu?","Ít, màu sẫm.","e"],["Có nôn, tiêu chảy không?","Nôn hai lần.","n"]],"exam":[["V","Da và thần sắc","Da đỏ, nóng khô, mặt đỏ, thở nhanh nông.","e"],["K","Ý thức","Lơ mơ, nói sảng, đáp ứng chậm.","e"],["V","Lưỡi","Chất lưỡi đỏ, rêu vàng khô, ít tân dịch.","e"],["T","Mạch","Mạch hồng, sác, ấn mạnh thấy vô lực.","e"],["K","Khám tim phổi, bụng","Tim nhanh đều. Phổi thông khí đều. Bụng mềm.","n"]],"tests":[["Nhiệt độ trung tâm (trực tràng)",1,"40,6 độ C.","e"],["Điện giải, creatinin, CK, men gan",10,"Na 148, K 3,2, creatinin 1,6, CK 4.800. Tổn thương thận cấp nhẹ, tiêu cơ vân.","e"],["Đường huyết mao mạch",1,"4,8 mmol/L.","n"],["Khí máu động mạch",5,"Nhiễm toan chuyển hóa.","n"],["Điện tâm đồ",3,"Nhịp nhanh xoang.","n"],["CT sọ não",20,"Không có chấn thương đầu. Làm chậm việc hạ nhiệt.","w"]],"opt":{"ydx":["+Đột quỵ nhiệt (say nắng nặng)","Kiệt sức do nóng","Viêm màng não","Hạ đường huyết","Cơn bão giáp"],"bd":["+Trúng thử","Trúng phong","Cảm mạo phong hàn","Thương thử nhẹ"],"bc":["+Lý – Thực – Nhiệt kiêm thương tân","Biểu – Thực – Hàn","Lý – Hư – Hàn","Lý – Thực – Hàn"],"the":["+Thử nhiệt nhập khí phận, khí âm lưỡng thương","Thử thấp, hàn bó biểu","Âm hư phong động","Dương hư hàn thịnh"],"phap":["+Thanh nhiệt giải thử, ích khí sinh tân","Phát hãn giải biểu, tán hàn","Ôn bổ thận dương","Hoạt huyết hóa ứ"],"phuong":["+Bạch hổ gia nhân sâm thang","~Sinh mạch tán","Hương nhu ẩm","Ma hoàng thang","Lý trung hoàn"],"huyet":["+Đại chùy","+Khúc trì","+Thập tuyên","+Nhân trung","Quan nguyên","Thận du","Tỳ du"]},"actions":["++Chuyển vào nơi mát, cởi quần áo, phun sương và quạt, chườm đá cổ nách bẹn|2|Hạ nhiệt tích cực là điều trị quyết định.","++Truyền dịch tĩnh mạch natri clorid 0,9% hoặc Ringer lactat|2|Bù dịch, hỗ trợ tuần hoàn và thận.","++Gắn monitor, đo nhiệt độ trung tâm liên tục|1|Theo dõi đáp ứng điều trị.","+Chích nặn máu Thập tuyên, châm Đại chùy, Khúc trì sau khi đã làm mát|3|Hỗ trợ giải nhiệt, không thay thế làm mát.","+Bồi phụ điện giải theo kết quả xét nghiệm|2|Hạ natri, kali theo chỉ định.","-Cho paracetamol hạ sốt là chính|1|Thuốc hạ sốt không hiệu quả trong đột quỵ nhiệt.","!Ủ ấm, đắp chăn dày cho ra mồ hôi|2|Làm nhiệt độ tăng thêm.","!Cho uống thuốc thang giải biểu nóng (Ma hoàng thang)|3|Sai pháp, làm thương tân dịch thêm.","!Ép uống nhiều nước lạnh nhanh khi đang lơ mơ|2|Nguy cơ sặc."],"teach":"Đột quỵ nhiệt là cấp cứu hạ nhiệt: mỗi phút nhiệt độ trung tâm cao đều gây tổn thương. YHCT gọi là Trúng thử, thuộc thử nhiệt nhập khí phận, khí âm lưỡng thương. Pháp thanh nhiệt giải thử, ích khí sinh tân đi sau hoặc song song với làm mát vật lý và bù dịch, không thay thế.","status":"draft"},{"id":"hao-suyen","title":"Khó thở khò khè, xịt thuốc không đỡ","kind":"Cấp cứu Đông Tây y","level":"Khó","group":"capcuu","place":"Phòng cấp cứu","clock":"21:30","name":"Anh Võ Minh Quân","age":26,"sex":"nam","intro":"Phòng cấp cứu, 21:30. Anh ngồi chống tay hai bên, thở khò khè nặng nhọc, nói từng cụm ngắn. Đã xịt thuốc cắt cơn nhiều lần ở nhà.","vitals":{"hr":118,"sbp":130,"dbp":80,"rr":30,"t":37,"spo2":89},"ask":[["Khó thở khò khè bắt đầu từ lúc nào?","Khoảng 2 giờ nay, tăng dần sau khi hít khói bụi trời lạnh.","e"],["Tiền sử hen? Đã dùng thuốc gì?","Hen từ nhỏ. Đã xịt salbutamol 6 lần, không đỡ.","e"],["Có từng nhập viện, đặt ống thở vì hen không?","Một lần cách đây 2 năm phải vào hồi sức.","e"],["Có sốt, ho đờm màu gì?","Không sốt, ho ít đờm trắng loãng.","e"],["Có dùng thuốc chẹn beta, aspirin, kháng viêm giảm đau gần đây không?","Không.","n"],["Có dị ứng thức ăn, thuốc không?","Dị ứng phấn hoa, không dị ứng thuốc.","n"]],"exam":[["K","Tư thế, nói chuyện, cơ hô hấp phụ","Ngồi chống tay, nói được 2-3 từ mỗi hơi, co kéo cơ ức đòn chũm và liên sườn.","e"],["K","Nghe phổi","Ran rít, ran ngáy lan tỏa hai phế trường. Rì rào phế nang giảm. Chưa có phổi câm.","e"],["K","Lưu lượng đỉnh (PEF)","Khoảng 35% giá trị dự đoán.","e"],["V","Lưỡi","Chất lưỡi nhạt, rêu trắng trơn nhớt.","e"],["V","Sắc mặt, môi","Vã mồ hôi, môi tím nhẹ, sợ lạnh.","n"],["M","Tiếng thở, tiếng ho","Thở rít khò khè nghe rõ, ho ít, đờm trắng loãng.","n"],["T","Mạch","Mạch phù, khẩn, nhanh.","e"]],"tests":[["Khí máu động mạch",5,"pH 7,42, PaO2 58, PaCO2 36 mmHg. PaCO2 bình thường trong cơn nặng là dấu hiệu sắp kiệt sức.","e"],["X-quang ngực tại giường",10,"Phổi tăng sáng, không tràn khí màng phổi, không viêm phổi.","n"],["Công thức máu",10,"Bạch cầu bình thường, bạch cầu ái toan hơi tăng.","n"],["Điện tâm đồ",3,"Nhịp nhanh xoang.","n"],["CT ngực",30,"Không có chỉ định lúc này, làm chậm điều trị.","w"]],"opt":{"ydx":["+Cơn hen phế quản cấp mức nặng","Đợt cấp COPD","Phù phổi cấp","Thuyên tắc phổi","Dị vật đường thở"],"bd":["+Háo suyễn","Phế ung","Hung tý","Khái thấu nhẹ"],"bc":["+Thực – Hàn (hàn đàm, ngoại hàn nội ẩm)","Lý – Thực – Nhiệt","Lý – Hư – Hàn","Biểu – Hư"],"the":["+Hàn háo (hàn đàm trở phế)","Nhiệt háo (đàm nhiệt ủng phế)","Phế thận lưỡng hư","Phong đàm"],"phap":["+Ôn phế tán hàn, hóa đàm bình suyễn","Thanh phế hóa đàm, bình suyễn","Bổ thận nạp khí","Tư âm nhuận phế"],"phuong":["+Tiểu thanh long thang","+Xạ can ma hoàng thang","Ma hạnh thạch cam thang","Định suyễn thang","Bổ phế thang"],"huyet":["+Định suyễn","+Phế du","+Thiên đột","+Đản trung","+Liệt khuyết","Thái xung","Hành gian","Dũng tuyền","Huyết hải"]},"actions":["++Cho ngồi, thở oxy, gắn monitor SpO2 mục tiêu 93-95%|1|SpO2 89% cần bù oxy ngay.","++Khí dung salbutamol (có thể phối hợp ipratropium) liên tục|2|Thuốc giãn phế quản là điều trị cắt cơn chủ lực.","++Corticoid toàn thân sớm|2|Giảm viêm đường thở, phát huy tác dụng sau vài giờ nên cho sớm.","+Theo dõi PEF, nhịp thở, khí máu lặp lại|2|Phát hiện sớm dấu hiệu kiệt sức.","+Truyền magnesi sulfat nếu không đáp ứng sau điều trị đầu|2|Lựa chọn khi cơn nặng không đáp ứng.","+Sau khi ổn định: cứu Phế du, dạy kỹ thuật xịt thuốc và lập kế hoạch hành động hen|3|YHCT hỗ trợ giai đoạn sau, kết hợp giáo dục người bệnh.","-Kháng sinh thường quy|1|Không sốt, đờm trắng loãng, không có bằng chứng nhiễm khuẩn.","!Cho thuốc an thần (diazepam) để bớt vật vã|1|Ức chế hô hấp, nguy hiểm trong cơn hen nặng.","!Cho thuốc chẹn beta để giảm nhịp tim nhanh|1|Chống chỉ định trong hen, gây co thắt phế quản.","!Cho uống thuốc thang rồi theo dõi diễn tiến|5|Chậm dùng thuốc cắt cơn, có thể tử vong.","!Châm cứu lưu kim lâu trước khi dùng thuốc giãn phế quản|10|Không thay thế điều trị cắt cơn."],"teach":"Cơn hen nặng là cấp cứu hô hấp: oxy, giãn phế quản, corticoid trước. PaCO2 bình thường trong cơn nặng là dấu hiệu nguy hiểm. Tiền sử từng vào hồi sức là yếu tố nguy cơ tử vong. YHCT vào cuộc sau cơn: thể hàn háo, pháp ôn phế tán hàn hóa đàm, giáo dục người bệnh phòng tái phát.","status":"draft"},{"id":"vi-quan-thong","title":"Đau thượng vị âm ỉ","kind":"Nội","level":"Dễ","group":"noi","place":"Phòng khám Nội YHCT","clock":"09:15","name":"Bà Lê Thị Hạnh","age":52,"sex":"nữ","intro":"Khoa Nội YHCT, giường 12. Bà đến khám vì đau vùng thượng vị 3 tháng, đã tự mua thuốc giảm đau uống nhiều lần.","vitals":{"hr":78,"sbp":110,"dbp":70,"rr":18,"t":36.6,"spo2":98},"ask":[["Đau ở đâu, đau như thế nào?","Đau âm ỉ vùng thượng vị khoảng 3 tháng nay, lúc đau lúc không, không đau dữ dội.","e"],["Chườm ấm hoặc ăn uống có làm đỡ đau không?","Uống nước ấm, chườm ấm, xoa bụng thì đỡ. Lúc đói đau nhiều hơn, ăn vào đỡ một chút.","e"],["Có ợ hơi, buồn nôn hay nôn không?","Hay ợ hơi, thỉnh thoảng nôn ra nước trong. Không nôn ra máu.","e"],["Đại tiện thế nào? Phân màu gì?","Phân nhão, 2 lần mỗi ngày, màu vàng nâu, không đen.","e"],["Có sụt cân, nuốt nghẹn không?","Không sụt cân, không nuốt nghẹn.","e"],["Cảm giác nóng lạnh ra sao?","Sợ lạnh, tay chân lạnh, người mệt, ngại nói chuyện.","e"],["Có khát nước không? Thích uống nóng hay lạnh?","Không khát, chỉ thích uống nước ấm.","n"],["Đã dùng thuốc gì? Đã nội soi lần nào chưa?","Chưa nội soi lần nào. Thỉnh thoảng uống ibuprofen khi đau.","e"],["Giấc ngủ và ăn uống gần đây?","Ngủ được, ăn kém, hay đầy bụng sau ăn.","n"],["Có uống rượu, hút thuốc không?","Không uống rượu, không hút thuốc.","n"],["Kinh nguyệt?","Mãn kinh được 2 năm.","n"]],"exam":[["V","Thần sắc","Sắc mặt vàng nhợt, tinh thần mệt mỏi, thể trạng gầy.","e"],["V","Lưỡi","Chất lưỡi nhạt, bệu, có hằn răng, rêu trắng mỏng ướt.","e"],["M","Giọng nói, hơi thở","Tiếng nói nhỏ, yếu. Hơi thở không hôi.","n"],["T","Mạch","Mạch trầm, trì, nhược.","e"],["T","Sờ tay chân","Bàn tay, bàn chân lạnh.","n"],["K","Khám bụng","Thượng vị ấn đau nhẹ, bệnh nhân thích ấn. Bụng mềm, không phản ứng thành bụng.","e"],["K","Khám tim phổi","Không có dấu hiệu bất thường.","n"]],"tests":[["Công thức máu",10,"Hb 12,1 g/dL, bạch cầu bình thường.","n"],["Nội soi dạ dày",20,"Loét hang vị nhỏ 0,5 cm, đáy sạch, bờ đều, không nghi ngờ ác tính.","e"],["Test urease / hơi thở tìm H. pylori",15,"Dương tính.","e"],["CT ngực bụng có cản quang",40,"Không thấy bất thường. Không có chỉ định ở ca này.","w"],["Điện tâm đồ",3,"Nhịp xoang, không bất thường.","n"]],"opt":{"ydx":["+Loét dạ dày có nhiễm H. pylori","Hội chứng ruột kích thích","Ung thư dạ dày","Viêm tụy cấp"],"bd":["+Vị quản thống","Hung tý","Phúc thống","Tiết tả"],"bc":["+Lý – Hư – Hàn","Lý – Thực – Nhiệt","Biểu – Thực – Hàn","Lý – Hư – Nhiệt"],"the":["+Tỳ vị hư hàn","Can khí phạm vị","Vị âm hư","Thực tích đình trệ","Huyết ứ trở lạc"],"phap":["+Ôn trung kiện tỳ, hòa hoãn chỉ thống","Sơ can lý khí","Thanh nhiệt tả hỏa","Hoạt huyết hóa ứ","Dưỡng âm ích vị"],"phuong":["+Hoàng kỳ kiến trung thang","+Lý trung hoàn","Sài hồ sơ can tán","Ích vị thang","Bạch hổ thang"],"huyet":["+Trung quản","+Túc tam lý","+Tỳ du","+Vị du","+Nội quan","Thái xung","Hợp cốc","Đại chùy","Phong trì"]},"actions":["+Hướng dẫn ăn chín, ấm, chia nhỏ bữa|2|Chế độ ăn hợp với tỳ vị hư hàn.","+Dặn ngừng thuốc kháng viêm giảm đau (NSAID)|1|NSAID làm loét nặng thêm.","+Điều trị diệt H. pylori theo phác đồ YHHĐ|2|Loét có H. pylori cần diệt khuẩn.","+Cứu ngải vùng Trung quản, Quan nguyên|10|Ôn dương, tán hàn.","+Hẹn tái khám, nội soi kiểm tra sau điều trị|1|Theo dõi liền sẹo loét.","!Cho thuốc thanh nhiệt hàn lương (Hoàng liên, Thạch cao)|2|Thuốc hàn lương làm tổn thương thêm dương khí của tỳ vị.","!Truyền kháng sinh phổ rộng đường tĩnh mạch|3|Không có chỉ định, không phải nhiễm khuẩn toàn thân."],"teach":"Điểm mấu chốt: đau thích ấn, thích ấm, sợ lạnh, lưỡi nhạt bệu rêu trắng, mạch trầm trì nhược cho ra thể Tỳ vị hư hàn. Cần loại trừ dấu hiệu báo động (sụt cân, phân đen, nuốt nghẹn) và xác nhận nguyên nhân bằng nội soi, H. pylori. Thuốc hàn lương là bẫy thường gặp.","status":"draft"},{"id":"tiet-ta","title":"Tiêu chảy nước 8 lần sau gỏi hải sản","kind":"Nội Đông Tây y","level":"Dễ","group":"noi","place":"Phòng cấp cứu","clock":"08:30","name":"Chị Hồ Thị Thu","age":34,"sex":"nữ","intro":"Phòng cấp cứu, 08:30. Chị tiêu chảy 8 lần từ đêm qua, đau quặn bụng, chóng mặt khi đứng dậy. Người ăn cùng cũng bị.","vitals":{"hr":104,"sbp":100,"dbp":65,"rr":20,"t":37.8,"spo2":98},"ask":[["Phân thế nào, mấy lần, có máu hay nhầy không?","Phân lỏng như nước, vàng, mùi thối khắm, không máu, không nhầy. 8 lần từ đêm qua.","e"],["Có đau quặn bụng, mót rặn không?","Đau quặn quanh rốn, không mót rặn.","n"],["Hôm qua ăn gì? Người cùng ăn có bị không?","Ăn gỏi hải sản, nem chua. Hai người cùng ăn cũng bị tiêu chảy.","e"],["Có nôn, sốt không?","Nôn 2 lần, sốt nhẹ.","n"],["Nước tiểu, khát nước?","Nước tiểu ít, sẫm màu. Khát nhiều, thích uống mát.","e"],["Có chóng mặt, ngất khi đứng dậy không?","Chóng mặt khi đứng, chưa ngất.","e"]],"exam":[["K","Dấu mất nước","Môi khô, mắt hơi trũng, véo da mất chậm.","e"],["K","Khám bụng","Ấn đau lan tỏa nhẹ, nhu động ruột tăng, không có phản ứng thành bụng.","e"],["V","Lưỡi","Chất lưỡi đỏ, rêu vàng nhớt.","e"],["T","Mạch","Mạch hoạt, sác.","e"],["M","Mùi phân","Mùi thối khắm.","n"]],"t en-vung","title":"Chóng mặt đau đầu, huyết áp 168/102","kind":"Nội Đông Tây y","level":"Trung bình","group":"noi","place":"Khoa Nội, giường 8","clock":"10:00","name":"Bà Trương Thị Lan","age":58,"sex":"nữ","intro":"Khoa Nội, giường 8. Bà kể mấy ngày nay chóng mặt, đau đầu vùng thái dương, hay cáu gắt, ngủ kém.","vitals":{"hr":84,"sbp":168,"dbp":102,"rr":18,"t":36.7,"spo2":98},"ask":[["Chóng mặt, đau đầu thế nào, khi nào nặng thêm?","Chóng mặt, đau đầu thái dương, nặng thêm khi tức giận hoặc thiếu ngủ.","e"],["Có yếu liệt, nói khó, nhìn đôi, đau ngực, khó thở không?","Không có.","e"],["Tiền sử tăng huyết áp, dùng thuốc thế nào?","Tăng huyết áp 8 năm, uống amlodipin nhưng hay quên.","e"],["Có nóng nảy, miệng đắng, mắt đỏ không?","Hay cáu, miệng đắng, mắt đỏ.","e"],["Giấc ngủ, đại tiểu tiện?","Mất ngủ, hay mơ. Táo bón, tiểu vàng.","n"],["Ăn mặn, rượu, hút thuốc?","Ăn mặn, không rượu, không hút thuốc.","n"],["Kinh nguyệt?","Mãn kinh 6 năm.","n"]],"exam":[["K","Đo huyết áp đúng kỹ thuật, hai tay","Hai tay 168/102 và 166/100.","e"],["K","Khám thần kinh","Không có dấu thần kinh khu trú. Dây thần kinh sọ bình thường.","e"],["K","Khám tim phổi","Tim đều, phổi bình thường.","n"],["V","Sắc mặt, mắt, lưỡi","Mặt đỏ, mắt đỏ. Lưỡi đỏ, rêu vàng mỏng.","e"],["T","Mạch","Mạch huyền, sác.","e"]],"tests":[["Điện tâm đồ",3,"Dày thất trái nhẹ.","e"],["Điện giải, creatinin, đường huyết, lipid máu",10,"Cholesterol toàn phần 6,2 mmol/L. Chức năng thận bình thường.","e"],["Tổng phân tích nước tiểu",10,"Chưa có đạm niệu.","n"],["CT sọ não",20,"Không có chỉ định khi không có dấu thần kinh khu trú.","w"]],"opt":{"ydx":["+Tăng huyết áp độ 2 chưa kiểm soát, không có tổn thương cơ quan đích cấp","Cấp cứu tăng huyết áp","Đột quỵ thiếu máu não","Chóng mặt tư thế kịch phát lành tính","Thiếu máu"],"bd":["+Huyễn vựng","Trúng phong","Đầu thống do ngoại cảm","Tâm quý"],"bc":["+Lý – Thực kiêm Hư (bản hư tiêu thực)","Biểu – Thực – Hàn","Lý – Hư – Hàn","Biểu – Hư"],"the":["+Can dương thượng cang","Đàm thấp cid uric bắt đầu sau khi dịu và có dự phòng cơn.","-Kháng sinh tĩnh mạch kéo dài|3|Chưa có bằng chứng nhiễm khuẩn khớp.","!Dùng kháng viêm không steroid liều cao (diclofenac)|1|Có tiền sử loét dạ dày, nguy cơ chảy máu tiêu hóa.","!Chườm nóng, cứu ngải trực tiếp tại khớp đang sưng nóng|3|Làm nhiệt tăng thêm, sai thể thấp nhiệt."],"teach":"Cơn gút cấp cắt cơn trước, hạ acid uric sau. Hỏi tiền sử loét dạ dày và thuốc lợi tiểu thiazid thay đổi lựa chọn thuốc. Thể thấp nhiệt khác phong hàn thấp: sưng nóng đỏ, lưỡi đỏ rêu vàng nhớt, mạch hoạt sác, kỵ cứu nóng. Sốt nhẹ một khớp luôn cần nghĩ đến viêm khớp nhiễm khuẩn.","status":"draft"},{"id":"truong-ung","title":"Đau bụng từ quanh rốn xuống hố chậu phải","kind":"Ngoại Đông Tây y","level":"Trung bình","group":"ngoai","place":"Phòng cấp cứu","clock":"15:00","name":"Anh Lê Hoàng Phúc","age":22,"sex":"nam","intro":"Phòng cấp cứu, 15:00. Anh đau bụng 14 giờ, ban đầu quanh rốn, sau chuyển xuống hố chậu phải, chán ăn, nôn.","vitals":{"hr":100,"sbp":118,"dbp":74,"rr":18,"t":38.2,"spo2":99},"ask":[["Đau bắt đầu ở đâu, có di chuyển không?","Bắt đầu quanh rốn, sau 6 đến 8 giờ chuyển xuống hố chậu phải, đau tăng khi đi lại hoặc ho.","e"],["Có chán ăn, buồn nôn, nôn không?","Chán ăn, nôn 2 lần.","e"],["Có sốt không?","Sốt khoảng 38 độ.","n"],["Đại tiện, tiểu tiện thế nào?","Táo nhẹ, không tiêu chảy. Tiểu bình thường, không buốt.","e"],["Tiền sử bệnh, phẫu thuật bụng?","Không có.","n"],["Đã dùng thuốc gì?","Uống 1 viên paracetamol, đỡ ít.","n"]],"exam":[["K","Ấn bụng hố chậu phải","Đau điểm McBurney, phản ứng thành bụng khu trú.","e"],["K","Các dấu hiệu viêm ruột thừa","Blumberg dương tính, Rovsing dương tính.","e"],["K","Co cứng thành bụng lan tỏa?","Không có, chưa có dấu viêm phúc mạc lan tỏa.","e"],["V","Lưỡi","Chất lưỡi đỏ, rêu vàng dày nhớt.","e"],["T","Mạch","Mạch hoạt, sác.","e"],["M","Hơi thở, phân","Hơi thở hôi, đại tiện táo.","n"]],"tests":[["Công thức máu",10,"Bạch cầu 15.800, trung tính 85%.","e"],["CRP",10,"62 mg/L.","e"],["Siêu âm bụng",10,"Ruột thừa 9 mm, thành dày, không xẹp, có dịch quanh. Chưa thấy áp xe.","e"],["CT bụng",30,"Xác nhận viêm ruột thừa, chưa có áp xe hay thủng.","n"],["Tổng phân tích nước tiểu",10,"Bình thường.","n"],["Chụp đại tràng cản quang",30,"Không có chỉ định, có thể nguy hiểm khi nghi viêm ruột thừa.","w"]],"opt":{"ydx":["+Viêm ruột thừa cấp (chưa biến chứng)","Sỏi niệu quản phải","Viêm hạch mạc treo","Viêm dạ dày ruột","Viêm túi thừa Meckel"],"bd":["+Trường ung","Phúc thống đơn thuần","Lỵ","Tiết tả"],"bc":["+Lý – Thực – Nhiệt","Biểu – Thực – Hàn","Lý – Hư – Hàn","Lý – Hư – Nhiệt"],"the":["+Thấp nhiệt uẩn kết","Khí trệ huyết ứ (giai đoạn sớm)","Nhiệt độc thịnh (đã có mủ)","Tỳ vị hư hàn"],"phap":["+Thanh nhiệt giải độc, thông phủ tiết nhiệt, hoạt huyết tiêu ung","Ôn trung kiện tỳ","Sơ can lý khí","Bổ khí ích huyết"],"phuong":["+Đại hoàng mẫu đơn thang","Lý trung hoàn","Tiểu kiến trung thang","Ngân kiều tán","Bổ trung ích khí thang"],"huyet":["+Lan vĩ huyệt","+Thiên khu","+Túc tam lý","+Thượng cự hư","+Khúc trì","Quan nguyên","Mệnh môn","Thận du","Đại chùy"]},"actions":["++Nhịn ăn uống, lập đường truyền, giảm đau theo y lệnh|2|Chuẩn bị phẫu thuật, giữ ổn định.","++Hội chẩn ngoại khoa, chuẩn bị cắt ruột thừa|3|Viêm ruột thừa cấp có chỉ định can thiệp sớm.","+Kháng sinh tĩnh mạch theo phác đồ trước mổ|2|Giảm nhiễm khuẩn quanh mổ.","+YHCT hỗ trợ sau mổ: Đại hoàng mẫu đơn thang gia giảm, châm Túc tam lý, Thiên khu|5|Hồi phục nhu động ruột, giảm đau sau mổ.","!Cho thuốc nhuận tràng, thuốc xổ|2|Làm tăng nguy cơ thủng ruột thừa.","!Chườm nóng lên bụng|2|Làm viêm tiến triển nhanh.","!Chỉ dùng thuốc thang, theo dõi tại nhà, không mổ|5|Có nguy cơ thủng, viêm phúc mạc. YHCT không thay thế phẫu thuật ở giai đoạn này.","!Châm cứu cắt cơn đau thay phẫu thuật|10|Che lấp diễn tiến, chậm xử trí ngoại khoa."],"teach":"Viêm ruột thừa cấp điển hình là chỉ định ngoại khoa. YHCT gọi là Trường ung, thể thấp nhiệt, bài Đại hoàng mẫu đơn thang, nhưng vai trò chính nằm ở hỗ trợ sau mổ hoặc ở thể nhẹ có theo dõi sát. Bác sĩ YHCT trực phải nhận ra ca cần mổ, không giữ bệnh nhân ở lại bằng thuốc thang.","status":"draft"},{"id":"soc-phan-ve-thuoc","title":"Nổi mẩn, khó thở sau tiêm thuốc","kind":"Cấp cứu","level":"Trung bình","group":"capcuu","place":"Phòng cấp cứu","clock":"15:40","name":"Chị Lê Thị Hoa","age":34,"sex":"nữ","intro":"Phòng tiêm của trạm y tế đưa chị vào lúc 15:40. Mười phút trước chị được tiêm kháng sinh do viêm họng, sau đó nổi mẩn khắp người, khó thở, chóng mặt, suýt ngất.","vitals":{"hr":128,"sbp":70,"dbp":40,"rr":28,"t":36.8,"spo2":88},"ask":[["Chị tiêm thuốc gì, cách đây bao lâu?","Thuốc kháng sinh tiêm bắp, khoảng 10 phút trước.","e"],["Triệu chứng bắt đầu thế nào?","Ngứa khắp người, nổi mẩn, tức ngực, thở rít, chóng mặt.","e"],["Trước đây có dị ứng thuốc hay thức ăn không?","Chưa biết dị ứng thuốc nào, hay nổi mề đay khi ăn hải sản.","e"],["Có đau bụng, buồn nôn, tiêu chảy không?","Có đau quặn bụng và buồn nôn.","n"],["Có tiền sử hen, bệnh tim không?","Không hen, không bệnh tim.","n"],["Đang dùng thuốc gì khác?","Không dùng thuốc nào khác.","n"],["Có mang thai không?","Không, vừa hết kinh tuần trước.","n"],["Ăn uống gần đây có gì lạ không?","Trưa ăn cơm bình thường.","n"]],"exam":[["V","Nhìn da mặt, toàn thân","Mày đay lan khắp thân, mặt phù nề, môi sưng, da lạnh vã mồ hôi","e"],["V","Quan sát lưỡi","Lưỡi nhợt, rêu mỏng, hơi sưng","n"],["V","Tri giác","Li bì, trả lời chậm","e"],["M","Nghe phổi, tiếng thở","Thở rít thanh quản, ran rít hai phế trường","e"],["M","Nghe tim","Tim nhanh đều, không tiếng thổi","n"],["T","Mạch quay","Nhanh, nhỏ, khó bắt (vi tế sác)","e"],["T","Sờ chi, đo huyết áp","Tay chân lạnh, huyết áp 70/40","e"],["K","Khám bụng","Mềm, ấn đau nhẹ quanh rốn, không phản ứng thành bụng","n"]],"tests":[["Điện tim",3,"Nhịp nhanh xoang, không thay đổi ST","n"],["Đường huyết mao mạch",2,"6,1 mmol/L","n"],["Khí máu động mạch",10,"pH 7,31, PaO2 58 mmHg, lactate tăng nhẹ","e"],["Tryptase huyết thanh (lấy máu 1 đến 2 giờ sau khởi phát)",5,"Gửi mẫu, có kết quả sau","n"],["Chụp CT sọ não",30,"Không bất thường","w"],["Siêu âm bụng",15,"Không có gì đặc biệt","w"]],"opt":{"ydx":["+Sốc phản vệ độ 3 do thuốc","Hen phế quản cấp","Hội chứng mạch vành cấp","Ngất do cường phế vị","Sốc nhiễm khuẩn"],"bd":["+Quá mẫn, quyết chứng","Háo suyễn","Hung tý","Huyễn vựng","Phong chẩn đơn thuần"],"bc":["+Biểu lý đều bệnh, hư thực thác tạp, thiên hàn","Biểu thực nhiệt","Lý thực nhiệt","Lý hư hàn","Biểu hư nhiệt"],"the":["+Dương khí thoát, vong dương","Phong nhiệt phạm phế","Đàm nhiệt ủng phế","Khí trệ huyết ứ","Can dương thượng cang"],"phap":["+Hồi dương cứu nghịch (sau cấp cứu YHHĐ)","Sơ phong thanh nhiệt","Hóa đàm bình suyễn","Bình can tiềm dương","Hoạt huyết hóa ứ"],"phuong":["+Sâm phụ thang (hỗ trợ sau ổn định)","Ngân kiều tán","Bình can tức phong thang","Huyết phủ trục ứ thang","Tiểu thanh long thang"],"huyet":["+Nhân trung","+Nội quan","+Túc tam lý","+Bách hội","Hợp cốc","Phong trì","Thái xung","Thái uyên"]},"actions":["++Ngừng thuốc nghi gây dị ứng, nằm ngửa kê cao chân|1|Giữ máu về tim, tránh ngồi dậy đột ngột","++Tiêm bắp adrenalin vào mặt ngoài đùi theo liều phản vệ|2|Thuốc đầu tay, tiêm sớm nhất","++Thở oxy lưu lượng cao qua mask|1|SpO2 88 phần trăm","++Đặt đường truyền, bù dịch muối đẳng trương nhanh|3|Huyết áp 70/40","+Theo dõi sát mạch, huyết áp, SpO2 liên tục|1|Phát hiện tái diễn","+Dùng thêm kháng histamin và corticoid sau adrenalin|3|Thuốc hỗ trợ, không thay thế adrenalin","+Giữ theo dõi ít nhất 24 giờ|1|Phản vệ pha 2","+Day bấm Nhân trung, Nội quan khi ổn định|2|Hỗ trợ YHCT sau khi đã cấp cứu","-Gọi chụp CT sọ não|30|Không có chỉ định","!Chỉ cho kháng histamin uống rồi theo dõi|3|Chậm trễ adrenalin có thể tử vong","!Cho bệnh nhân ngồi dậy đi lại|1|Tụt huyết áp nặng thêm","!Châm cứu trước khi cấp cứu YHHĐ|5|Mất thời gian vàng"],"teach":"Phản vệ độ 3 là cấp cứu số một: adrenalin tiêm bắp sớm, nằm kê cao chân, oxy, bù dịch. Kháng histamin và corticoid chỉ là thuốc phụ. YHCT chỉ hỗ trợ sau khi bệnh nhân đã ổn định, không thay thế xử trí cấp cứu.","status":"draft"},{"id":"suy-tim-mat-bu-thuy-thung","title":"Phù chân, khó thở khi nằm","kind":"Nội khoa","level":"Trung bình","group":"noi","place":"Khoa Nội tim mạch","clock":"06:30","name":"Bà Trần Thị Mai","age":72,"sex":"nữ","intro":"Bà nhập viện hôm qua vì khó thở tăng dần, phù hai chân. Sáng nay bà phải ngồi dậy mới thở được, tiền sử tăng huyết áp nhiều năm, suy tim đã điều trị.","vitals":{"hr":104,"sbp":118,"dbp":70,"rr":26,"t":36.9,"spo2":91},"ask":[["Khó thở từ bao giờ, nằm có thở được không?","Mấy ngày nay, nằm thì tức ngực khó thở, phải kê hai ba cái gối.","e"],["Phù chân từ khi nào?","Hơn một tuần, tăng dần cả hai chân.","e"],["Có đau ngực, hồi hộp không?","Hồi hộp nhiều, không đau thắt ngực.","n"],["Tiểu tiện thế nào?","Ít nước tiểu, đêm phải dậy.","e"],["Bà có ăn mặn hoặc ngưng thuốc không?","Mấy tuần nay ăn mặn và quên uống thuốc huyết áp.","e"],["Có sốt, ho đờm không?","Ho khan về đêm, không sốt.","n"],["Sợ lạnh, tay chân lạnh không?","Có, người lạnh, mệt mỏi, ăn kém.","n"],["Bệnh nền khác?","Tăng huyết áp 15 năm, chưa biết đái tháo đường.","n"]],"exam":[["V","Quan sát lưỡi","Lưỡi bệu, tím nhạt, rêu trắng trơn","e"],["V","Quan sát tư thế, cổ, phù","Ngồi đầu cao, tĩnh mạch cổ nổi, phù trũng hai chân đến gối","e"],["V","Sắc mặt, môi","Mặt tái, môi tím nhẹ","n"],["M","Nghe phổi","Ran ẩm hai đáy phổi","e"],["M","Nghe tim","Tim nhanh, có tiếng ngựa phi T3","n"],["T","Mạch","Trầm, tế, sác, vô lực","e"],["T","Sờ gan, sờ chi","Gan to dưới bờ sườn 3 cm, ấn đau nhẹ, chân lạnh","n"],["K","Cân nặng và nước tiểu","Tăng 3 kg trong 5 ngày, nước tiểu 400 ml mỗi ngày","n"]],"tests":[["NT-proBNP",30,"Tăng cao","e"],["Điện tim",3,"Rung nhĩ đáp ứng thất nhanh nhẹ","e"],["X-quang ngực",15,"Bóng tim to, ứ huyết phổi, tràn dịch màng phổi ít","e"],["Siêu âm tim",20,"EF 35 phần trăm, giãn thất trái","e"],["Điện giải đồ, creatinin",15,"Natri 132, kali 3,7, creatinin hơi tăng","e"],["Nội soi dạ dày",40,"Không cần thiết lú  mạc","e"],["V","Quan sát nếp mũi má, miệng","Nếp mũi má mờ, miệng kéo sang bên phải","e"],["V","Quan sát lưỡi","Lưỡi nhạt, rêu trắng mỏng","n"],["M","Nói, thổi, huýt sáo","Nói hơi ngọng, không thổi được má trái","n"],["T","Mạch","Phù, khẩn","e"],["K","Khám thần kinh tay chân","Sức cơ 5 phần 5, không liệt chi","e"],["K","Khám tai, ống tai ngoài","Không có mụn nước","n"],["K","Đo huyết áp","125/80, bình thường","n"]],"tests":[["Đường huyết mao mạch",2,"5,2 mmol/L","e"],["Công thức máu",20,"Bình thường","n"],["Điện cơ thần kinh mặt",40,"Sẽ làm sau 1 đến 2 tuần nếu cần tiên lượng","n"],["Chụp CT sọ não",30,"Không có dấu hiệu thần kinh trung ương, không cần chụp","w"],["Chụp MRI cột sống cổ",45,"Không liên quan","w"]],"opt":{"ydx":["+Liệt dây VII ngoại biên (liệt Bell)","Đột quỵ não","Zona tai (hội chứng Ramsay Hunt)","U góc cầu tiểu não","Viêm tai giữa biến chứng"],"bd":["+Khẩu nhãn oa tà","Trúng phong kinh lạc","Trúng phong tạng phủ","Huyễn vựng","Đầu thống"],"bc":["+Biểu thực hàn","Biểu hư nhiệt","Lý thực nhiệt","Lý hư hàn","Biểu thực nhiệt"],"the":["+Phong hàn xâm nhập kinh lạc","Phong nhiệt xâm nhập kinh lạc","Can phong nội động","Đàm ứ trở lạc","Khí huyết hư"],"phap":["+Khu phong tán hàn, thông kinh hoạt lạc","Thanh nhiệt giải độc","Bình can tức phong","Hóa đàm khai khiếu","Bổ khí dưỡng huyết"],"phuong":["+Khiên chính tán gia giảm","Ngân kiều tán","Thiên ma câu đằng ẩm","Bổ dương hoàn ngũ thang","Quy tỳ thang"],"huyet":["+Địa thương","+Giáp xa","+Dương bạch","+Hợp cốc","+Phong trì","Thái xung","Tam âm giao","Thiên đột"]},"actions":["+Corticoid đường uống sớm trong 72 giờ đầu|3|Cải thiện hồi phục dây VII","+Bảo vệ mắt: nhỏ nước mắt nhân tạo, che mắt khi ngủ|3|Nguy cơ loét giác mạc","+Châm cứu nhẹ nhàng vùng mặt kết hợp xa gần|20|Thông kinh lạc","+Chườm ấm nhẹ, xoa bóp nhẹ vùng mặt|10|Hỗ trợ tuần hoàn","+Dặn tránh gió lạnh, tái khám sau 1 tuần|2|Theo dõi tiến triển","-Chỉ định kháng sinh đường uống|2|Không có nhiễm khuẩn","-Chụp CT sọ não thường quy|30|Không có dấu hiệu thần kinh trung ương","!Điện châm cường độ mạnh vùng mặt ngay ngày đầu|20|Kích thích mạnh giai đoạn cấp có thể làm nặng","!Cho về không dặn chăm sóc mắt|1|Nguy cơ tổn thương giác mạc"],"teach":"Liệt mặt ngoại biên làm mất nhăn trán, còn liệt trung ương thì trán còn nhăn. Cần loại trừ đột quỵ, zona tai. Điều trị sớm bằng corticoid, bảo vệ mắt, châm cứu nhẹ giai đoạn cấp rồi tăng dần. Điều trị phối hợp Đông Tây y cho kết quả tốt nhất.","status":"draft"},{"id":"stemi-thanh-duoi","title":"Đau ngực cấp, nghi hội chứng vành cấp","kind":"Cấp cứu","level":"Trung bình","group":"capcuu","place":"Khoa Cấp cứu","clock":"08:20","name":"Ông Lê Văn Hùng","age":61,"sex":"nam","intro":"Người bệnh được đưa đến khoa Cấp cứu vì đau ngực khi đang đi bộ nhanh. Đau sau xương ức kéo dài khoảng 40 phút, vã mồ hôi và buồn nôn. Có tiền sử hút thuốc; chưa ghi nhận dị ứng thuốc.","vitals":{"hr":104,"sbp":94,"dbp":62,"rr":24,"t":36.7,"spo2":93},"ask":[["Đau bắt đầu khi nào và kéo dài bao lâu?","Đau xuất hiện khoảng 40 phút trước, liên tục, chưa giảm.","e"],["Đau ở đâu, có lan đi đâu không?","Đau sau xương ức, lan lên hàm và mặt trong cánh tay trái.","e"],["Đau có tính chất gì, mức độ ra sao?","Cảm giác bóp nghẹt, nặng ngực, mức độ khoảng 8/10.","e"],["Có khó thở, vã mồ hôi hoặc buồn nôn không?","Khó thở nhẹ, vã mồ hôi lạnh và buồn nôn.","e"],["Đã từng có cơn tương tự chưa?","Vài tuần gần đây đôi lúc tức ngực khi gắng sức, tự hết sau nghỉ.","e"],["Có bệnh nền hoặc yếu tố nguy cơ tim mạch nào?","Hút thuốc nhiều năm; chưa được chẩn đoán bệnh mạch vành.","e"],["Có dùng thuốc chống đông, thuốc tim mạch hoặc thuốc cường dương không?","Không nhớ đã dùng thuốc tim mạch; không dùng thuốc cường dương gần đây.","n"],["Có tiền sử dị ứng thuốc hoặc xuất huyết tiêu hóa không?","Chưa biết dị ứng thuốc; chưa từng xuất huyết tiêu hóa.","n"]],"exam":[["V","Sắc mặt và mồ hôi","Sắc mặt tái, vã mồ hôi lạnh, vẻ lo lắng.","e"],["V","Tri giác","Tỉnh, trả lời được, có vẻ mệt.","n"],["V","Môi và đầu chi","Đầu chi hơi lạnh, không tím rõ.","n"],["M","Giọng nói và hơi thở","Nói được câu ngắn, hơi thở nhanh.","n"],["M","Tiếng thở","Không có tiếng rít; không ho khạc đàm.","n"],["T","Mạch (thiết)","Mạch nhanh, hơi yếu, đều; mạch huyền sác.","e"],["V","Quan sát lưỡi","Lưỡi hơi tím, rêu trắng mỏng.","e"],["K","Tim phổi và tưới máu","Nhịp tim nhanh; phổi chưa nghe ran rõ; huyết áp thấp, đầu chi lạnh.","e"]],"tests":[["Điện tâm đồ 12 chuyển đạo",5,"ST chênh lên ở các chuyển đạo thành dưới; cần kích hoạt quy trình hội chẩn tái tưới máu.","e"],["Troponin tim độ nhạy cao",20,"Tăng trên giới hạn tham chiếu; lấy mẫu nối tiếp theo quy trình cơ sở.","e"],["Đường huyết mao mạch",3,"9,8 mmol/L.","n"],["Công thức máu và sinh hóa cơ bản",15,"Chưa có kết quả bất thường cấp tính rõ; theo dõi chức năng thận và điện giải.","n"],["CT sọ não không cản quang",25,"Không có chỉ định trong bệnh cảnh đau ngực này nếu không xuất hiện dấu thần kinh.","w"]],"opt":{"ydx":["+Hội chứng vành cấp có ST chênh lên, kèm giảm tưới máu","Đau thắt ngực ổn định","Viêm màng ngoài tim cấp","Thuyên tắc phổi nguy cơ thấp","Phình tách động mạch chủ"],"bd":["+Chân tâm thống","Vị quản thống","Đầu thống","Háo suyễn","Hiếp thống"],"bc":["+Lý thực, tiêu thực bản hư","Biểu thực hàn","Biểu hư nhiệt","Lý hư hàn","Lý thực nhiệt thuần"],"the":["+Tâm mạch ứ trở, khí huyết không thông (nhận định hỗ trợ)","Tỳ khí hư","Thận dương hư","Phong hàn phạm biểu","Can khí uất kết"],"phap":["+Xử trí cấp cứu YHHĐ trước, sau ổn định hoạt huyết hóa ứ thông mạch","Ôn bổ tỳ thận trước","Thanh nhiệt giải độc đơn trị","Sơ phong giải biểu","Bình can tiềm dương"],"phuong":["+Huyết phủ trục ứ thang gia giảm (chỉ sau ổn định)","Bạch hổ thang","Lý trung hoàn","Ngân kiều tán","Tiểu sài hồ thang"],"huyet":["+Nội quan","+Đản trung","+Tâm du","+Cách du","+Túc tam lý","Thái xung","Phong trì","Thiên khu"]},"actions":["++Kích hoạt báo động hội chứng vành cấp, gọi hỗ trợ tim mạch|1|Đau kéo dài, ECG gợi ý STEMI và huyết áp thấp.","++Đánh giá ABC, monitor ECG-SpO2-huyết áp và thiết lập đường truyền|2|Theo dõi loạn nhịp và suy tuần hoàn.","++Làm ECG 12 chuyển đạo ngay, lấy troponin và xét nghiệm cấp cứu|5|Xác định chẩn đoán và hướng xử trí.","++Hội chẩn để tái tưới máu khẩn theo quy trình cơ sở|5|Nghi STEMI; không trì hoãn chuyển tuyến/can thiệp.","+Đánh giá chỉ định oxy theo tình trạng thiếu oxy và quy trình cơ sở|2|Không dùng oxy thường quy khi không có chỉ định.","+Đánh giá chống chỉ định trước khi dùng thuốc kháng kết tập hoặc chống đông theo phác đồ|3|Giảm nguy cơ huyết khối và tai biến chảy máu.","!Cho người bệnh đi bộ đến phòng chụp để hoàn tất thủ tục|2|Gắng sức và trì hoãn xử trí ở người bệnh nghi STEMI, tụt huyết áp.","!Châm cứu hoặc cho thuốc YHCT trước khi kích hoạt xử trí hội chứng vành cấp|10|Có thể làm chậm tái tưới máu và hồi sức."],"teach":"Đau ngực kéo dài, lan hàm/cánh tay, vã mồ hôi và ECG gợi ý STEMI cần kích hoạt xử trí khẩn. Đánh giá ABC, monitor, ECG và hội chẩn tái tưới máu là ưu tiên. YHCT chỉ cân nhắc hỗ trợ sau khi người bệnh ổn định; không để thủ thuật hay thuốc YHCT trì hoãn cấp cứu.","status":"draft"},{"id":"phan-ve-phu-thanh-quan","title":"Phản vệ sau dùng thuốc","kind":"Cấp cứu","level":"Khó","group":"capcuu","place":"Khoa Cấp cứu","clock":"14:10","name":"Chị Phạm Thị Ngọc","age":34,"sex":"nữ","intro":"Khoảng 10 phút sau khi dùng một thuốc mới tại cơ sở y tế, người bệnh nổi ban ngứa toàn thân, khàn tiếng, khó thở và choáng. Tên thuốc đang được nhân viên kiểm tra trên hồ sơ.","vitals":{"hr":128,"sbp":76,"dbp":42,"rr":30,"t":36.5,"spo2":88},"ask":[["Triệu chứng bắt đầu khi nào?","Khoảng 10 phút sau khi dùng thuốc mới.","e"],["Thuốc được dùng bằng đường nào và tên gì?","Được tiêm tại cơ sở; người bệnh không nhớ tên thuốc, hồ sơ đang được kiểm tra.","e"],["Có khó thở, khàn tiếng hoặc nghẹn họng không?","Khó thở tăng nhanh, khàn tiếng và cảm giác nghẹn họng.","e"],["Có ngứa, mày đay hoặc phù môi lưỡi không?","Ngứa toàn thân, nổi mày đay, môi hơi sưng.","e"],["Có đau bụng, nôn hoặc tiêu chảy không?","Đau quặn bụng và buồn nôn.","n"],["Đã từng phản ứng tương tự hoặc dị ứng thuốc chưa?","Từng nổi mẩn sau một thuốc giảm đau nhưng không rõ tên.","e"],["Có hen phế quản hoặc bệnh tim mạch không?","Có hen nhẹ từ nhỏ, hiện không dùng thuốc thường xuyên.","n"],["Có chóng mặt, ngất hoặc cảm giác sắp ngất không?","Choáng váng, mắt tối sầm khi ngồi dậy.","e"]],"exam":[["V","Da và niêm mạc","Mày đay lan rộng, đỏ da; môi phù nhẹ.","e"],["V","Tri giác","Bứt rứt, còn đáp ứng nhưng yếu.","e"],["V","Đường thở trên","Khàn tiếng, phù môi; cần đánh giá nguy cơ phù thanh quản.","e"],["M","Giọng nói","Khàn tiếng mới xuất hiện.","e"],["M","Âm thở","Thở rít nhẹ khi hít vào, có khò khè.","e"],["T","Mạch (thiết)","Mạch nhanh nhỏ, đầu chi lạnh.","e"],["V","Quan sát lưỡi","Chất lưỡi đỏ, mạch sác; dữ kiện này không được làm chậm xử trí phản vệ.","e"],["K","Tuần hoàn và hô hấp","Hạ huyết áp, giảm SpO2, ran rít hai phế trường.","e"]],"tests":[["Đánh giá ABC, huyết áp và SpO2 liên tục",1,"Đường thở có dấu hiệu bị ảnh hưởng, SpO2 thấp, tụt huyết áp.","e"],["Đường huyết mao mạch",2,"6,1 mmol/L.","n"],["Điện tâm đồ",5,"Nhịp nhanh xoang.","n"],["Tryptase huyết thanh theo thời điểm và khả năng cơ sở",30,"Chưa có kết quả; không chờ xét nghiệm mới bắt đầu xử trí.","n"],["CT ngực có cản quang",30,"Không phải xét nghiệm ưu tiên trong phản vệ điển hình đang diễn tiến.","w"]],"opt":{"ydx":["+Phản vệ nặng sau dùng thuốc, suy hô hấp và tụt huyết áp","Cơn hen phế quản đơn thuần","Mày đay cấp không biến chứng","Ngộ độc thức ăn","Cơn hoảng loạn"],"bd":["+Quá mẫn, quyết chứng","Khái suyễn mạn","Tâm quý","Tiết tả","Phong chẩn đơn thuần"],"bc":["+Lý hư hàn, dương khí muốn thoát","Biểu hư hàn","Biểu thực nhiệt","Lý thực nhiệt","Lý hư nhiệt"],"the":["+Dương khí thoát, vong dương (sau cấp cứu)","Phong nhiệt phạm phế","Tỳ khí hư","Thận dương hư","Can khí uất"],"phap":["+Cấp cứu phản vệ YHHĐ trước, sau ổn định hồi dương cố thoát","Khu phong bằng thuốc uống trước","Thanh nhiệt giải độc đơn trị","Hóa đàm bình suyễn","Hoạt huyết hóa ứ"],"phuong":["+Sâm phụ thang (chỉ sau ổn định)","Ngân kiều tán","Bạch hổ thang","Lý trung hoàn","Tiểu thanh long thang"],"huyet":["+Nhân trung","+Nội quan","+Túc tam lý","+Bách hội","Hợp cốc","Phong trì","Thái xung"]},"actions":["++Ngừng ngay thuốc nghi gây phản vệ, gọi hỗ trợ và báo động cấp cứu|1|Loại bỏ tiếp xúc tiếp diễn và huy động nhân lực.","++Đặt người bệnh nằm phù hợp tình trạng tuần hoàn, đánh giá ABC liên tục|1|Tụt huyết áp và nguy cơ suy hô hấp.","++Dùng adrenalin đường tiêm bắp theo hướng dẫn phản vệ hiện hành và quy trình cơ sở|1|Điều trị hàng đầu; không chờ xét nghiệm.","++Hỗ trợ oxy, thiết lập đường truyền và hồi sức dịch theo quy trình|3|Giảm oxy máu và sốc.","+Chuẩn bị kiểm soát đường thở nâng cao nếu phù thanh quản tiến triển|2|Khàn tiếng, nghẹn họng và thở rít.","+Theo dõi liên tục và ghi nhận diễn biến, thời điểm dùng thuốc|1|Phản vệ có thể tái diễn hoặc tiến triển.","!Chờ kết quả tryptase mới điều trị|30|Xét nghiệm không được làm trì hoãn xử trí phản vệ.","!Cho uống thuốc kháng histamin thay cho adrenalin|2|Không xử trí được sốc hoặc tắc nghẽn đường thở."],"teach":"Khởi phát nhanh sau dùng thuốc, tổn thương da-niêm mạc kèm khó thở và tụt huyết áp gợi ý phản vệ nặng. Ngừng tác nhân, kích hoạt cấp cứu và dùng adrenalin theo hướng dẫn hiện hành là ưu tiên; không chờ xét nghiệm. Kháng histamin không thay thế điều trị đầu tay; YHCT không được làm chậm hồi sức.","status":"draft"},{"id":"dot-quy-thieu-mau-cap","title":"Yếu liệt nửa người khởi phát đột ngột","kind":"Cấp cứu","level":"Khó","group":"capcuu","place":"Khoa Cấp cứu","clock":"16:40","name":"Bà Nguyễn Thị Sen","age":70,"sex":"nữ","intro":"Người nhà đưa đến vì đột ngột méo miệng, nói khó và yếu tay chân phải. Lần cuối còn bình thường được ghi nhận lúc 16:00. Có tiền sử tăng huyết áp và rung nhĩ.","vitals":{"hr":112,"sbp":184,"dbp":102,"rr":20,"t":36.8,"spo2":96},"ask":[["Thời điểm cuối cùng người bệnh còn bình thường là khi nào?","Người nhà xác nhận lúc 16:00 người bệnh vẫn nói và đi lại bình thường.","e"],["Triệu chứng khởi phát đột ngột hay tăng dần?","Khởi phát đột ngột khi đang ngồi xem tivi.","e"],["Có yếu hoặc tê một bên người không?","Yếu tay chân phải, cầm rơi đồ vật.","e"],["Có méo miệng, nói khó hoặc không hiểu lời nói không?","Méo miệng và nói khó; vẫn hiểu câu hỏi.","e"],["Có đau đầu dữ dội, co giật hoặc mất ý thức không?","Không đau đầu dữ dội, không co giật, không mất ý thức.","e"],["Có tiền sử rung nhĩ hoặc dùng thuốc chống đông không?","Có rung nhĩ; gia đình chưa rõ tên thuốc đang dùng.","e"],["Có đái tháo đường hoặc từng hạ đường huyết không?","Chưa được chẩn đoán đái tháo đường.","n"],["Người bệnh có nuốt được nước an toàn không?","Chưa thử cho uống; người bệnh nói khó và chảy dãi nhẹ.","n"]],"exam":[["V","Mặt","Lệch nhân trung, méo miệng khi cười.","e"],["V","Tri giác","Tỉnh, tiếp xúc được, làm theo một số yêu cầu.","n"],["V","Vận động","Tay phải rơi khi giơ lên; chân phải yếu.","e"],["M","Ngôn ngữ","Nói khó, phát âm không rõ; hiểu lời đơn giản.","e"],["M","Đường thở","Tự thở, có ít nước bọt đọng; cần lưu ý nguy cơ sặc.","n"],["T","Mạch (thiết)","Không đều, nhanh; mạch huyền sác.","e"],["V","Quan sát lưỡi","Lưỡi hơi lệch, rêu trắng mỏng.","e"],["K","Khám thần kinh khu trú","Yếu nửa người phải, không cứng gáy; cần lượng giá mức độ thiếu hụt theo quy trình.","e"]],"tests":[["Đường huyết mao mạch",2,"7,2 mmol/L; không giải thích được thiếu hụt thần kinh.","e"],["CT sọ não không cản quang khẩn",15,"Chưa thấy xuất huyết nội sọ; tiếp tục đánh giá theo quy trình đột quỵ.","e"],["Điện tâm đồ",5,"Rung nhĩ với đáp ứng thất nhanh.","e"],["Công thức máu, đông máu, điện giải và chức năng thận",15,"Đang xử lý khẩn; cần kết quả theo quy trình trước quyết định điều trị.","n"],["CT bụng có cản quang",30,"Không có chỉ định trong đánh giá ban đầu đột quỵ cấp.","w"]],"opt":{"ydx":["+Đột quỵ não cấp, nghi thiếu máu não do rung nhĩ","Xuất huyết não đã chắc chắn","Liệt dây VII ngoại biên đơn thuần","Hạ đường huyết có triệu chứng","Cơn migraine có triệu chứng thần kinh"],"bd":["+Trúng phong kinh lạc","Đầu thống","Huyễn vựng đơn thuần","Nuy chứng","Trúng phong tạng phủ"],"bc":["+Lý thực nhiệt, bản hư tiêu thực","Biểu hư hàn","Biểu thực hàn","Lý hư hàn","Lý hư nhiệt"],"the":["+Phong đàm trở lạc, can dương thượng cang","Khí huyết lưỡng hư","Thận âm hư","Tỳ vị hư hàn","Thấp nhiệt hạ chú"],"phap":["+Cấp cứu đột quỵ trước, sau đó bình can tức phong, hóa đàm thông lạc","Bổ khí huyết thay chụp não","Ôn dương cứu nghịch","Sơ phong giải biểu","Thanh nhiệt giải độc"],"phuong":["+Thiên ma câu đằng ẩm gia giảm (chỉ sau ổn định)","Bổ dương hoàn ngũ thang ngay trước chụp não","Bạch hổ thang","Quy tỳ thang","Lục vị địa hoàng hoàn"],"huyet":["+Bách hội","+Khúc trì","+Hợp cốc","+Phong long","+Túc tam lý","Thiên khu","Thái uyên","Trung quản"]},"actions":["++Kích hoạt quy trình đột quỵ và ghi nhận chính xác thời điểm cuối bình thường|1|Thời gian quyết định khả năng điều trị tái tưới máu.","++Đánh giá ABC, monitor, thiết lập đường truyền và lượng giá thần kinh|3|Theo dõi diễn tiến và bảo đảm an toàn ban đầu.","++Đo đường huyết mao mạch ngay|2|Loại trừ hạ đường huyết giả đột quỵ.","++Chụp CT sọ não khẩn và hội chẩn nhóm đột quỵ|15|Phân biệt xuất huyết và thiếu máu, đánh giá điều trị phù hợp.","+Giữ nhịn ăn uống đến khi sàng lọc nuốt an toàn|1|Giảm nguy cơ sặc.","+Thu thập danh sách thuốc chống đông và bệnh sử rung nhĩ|3|Ảnh hưởng quyết định điều trị cấp.","!Cho uống nước hoặc thuốc khi chưa đánh giá nuốt|1|Nguy cơ sặc do rối loạn nuốt.","!Châm cứu hoặc xoa bóp mạnh trước khi kích hoạt quy trình đột quỵ|10|Trì hoãn chẩn đoán và điều trị có tính thời gian."],"teach":"Ghi chính xác lần cuối còn bình thường, kích hoạt quy trình đột quỵ, kiểm tra đường huyết và chụp sọ não khẩn. Rung nhĩ và thiếu hụt thần kinh khu trú làm tăng nghi ngờ đột quỵ nhưng chưa tự xác định thể bệnh. Chưa cho ăn uống khi chưa sàng lọc nuốt; YHCT chỉ cân nhắc sau đánh giá và ổn định.","status":"draft"},{"id":"ha-duong-huyet-nang","title":"Rối loạn tri giác do hạ đường huyết nặng","kind":"Cấp cứu","level":"Dễ","group":"capcuu","place":"Khoa Cấp cứu","clock":"05:50","name":"Ông Trần Văn Bảy","age":58,"sex":"nam","intro":"Người nhà phát hiện người bệnh vã mồ hôi, run, lơ mơ lúc gần sáng. Người bệnh mắc đái tháo đường type 2, đang dùng thuốc hạ đường huyết; tối qua ăn ít nhưng vẫn dùng thuốc như thường lệ.","vitals":{"hr":116,"sbp":102,"dbp":66,"rr":18,"t":36.4,"spo2":97},"ask":[["Triệu chứng được phát hiện lúc nào?","Người nhà phát hiện khoảng 20 phút trước khi đến viện.","e"],["Người bệnh đã ăn uống thế nào tối qua?","Ăn rất ít vì buồn nôn.","e"],["Có dùng thuốc điều trị đái tháo đường không?","Có uống thuốc như thường lệ nhưng gia đình chưa nhớ tên.","e"],["Có run, vã mồ hôi, đói cồn cào hoặc hồi hộp không?","Run tay, vã mồ hôi và tim đập nhanh.","e"],["Có co giật, ngất hoặc lú lẫn không?","Lơ mơ, trả lời chậm; không ghi nhận co giật.","e"],["Đã từng có cơn hạ đường huyết chưa?","Từng run vã mồ hôi khi bỏ bữa, chưa phải nhập viện.","n"],["Có sốt, ho hoặc đau ngực không?","Không sốt, không ho, không đau ngực.","n"],["Có thể tự nuốt an toàn lúc này không?","Không trả lời mạch lạc, không làm theo yêu cầu nuốt.","e"]],"exam":[["V","Da","Da ẩm, vã mồ hôi.","e"],["V","Tri giác","Lơ mơ, gọi mở mắt, định hướng kém.","e"],["V","Run","Run đầu chi.","e"],["M","Lời nói","Nói chậm, câu trả lời không phù hợp.","n"],["M","Hơi thở","Không có mùi ceton rõ; thở đều.","n"],["T","Mạch (thiết)","Nhanh, đều.","e"],["V","Quan sát lưỡi","Lưỡi ẩm, rêu trắng mỏng; dữ kiện không thay thế đo glucose.","e"],["K","Thần kinh và nuốt","Không thấy yếu liệt khu trú rõ; phản xạ bảo vệ đường thở giảm do lơ mơ.","e"]],"tests":[["Đường huyết mao mạch tại giường",1,"2,1 mmol/L.","e"],["Điện tâm đồ",5,"Nhịp nhanh xoang.","n"],["Điện giải, ure và creatinin",20,"Đang chờ; đánh giá yếu tố nguy cơ tái hạ đường huyết và bệnh kèm.","n"],["HbA1c",30,"Chưa có kết quả; không cần chờ để xử trí cơn cấp.","n"],["CT sọ não",25,"Không phải bước đầu nếu tri giác cải thiện sau xử trí hạ đường huyết và không có dấu khu trú/chấn thương.","w"]],"opt":{"ydx":["+Hạ đường huyết nặng có rối loạn tri giác","Nhiễm toan ceton do đái tháo đường","Đột quỵ não chắc chắn","Ngộ độc opioid","Tăng áp lực nội sọ"],"bd":["+Quyết chứng do hạ đường huyết","Tiêu khát","Huyễn vựng mạn","Tâm quý","Trúng phong"],"bc":["+Lý hư","Biểu thực nhiệt","Biểu hư hàn","Lý thực nhiệt","Lý hư nhiệt"],"the":["+Tỳ khí hư, tinh khí không nuôi dưỡng thanh khiếu","Can dương thượng cang","Thận âm hư","Đàm nhiệt nhiễu tâm","Phong hàn phạm biểu"],"phap":["+Bù glucose cấp cứu, sau tỉnh ích khí kiện tỳ","Ôn trung tán hàn bằng thuốc uống ngay","Thanh nhiệt tả hỏa","Bình can tức phong","Hóa đàm khai khiếu thay bù glucose"],"phuong":["+Tứ quân tử thang (sau tỉnh, hỗ trợ)","Lý trung hoàn","Bạch hổ thang","Long đởm tả can thang","Ngân kiều tán"],"huyet":["+Nhân trung","+Nội quan","+Túc tam lý","+Tỳ du","+Bách hội","Hợp cốc","Thái xung","Thiên khu"]},"actions":["++Đánh giá ABC, bảo vệ đường thở và đo glucose mao mạch ngay|1|Tri giác giảm và có biểu hiện giao cảm.","++Bù glucose bằng đường phù hợp khi người bệnh không nuốt an toàn, theo quy trình cơ sở|2|Hạ đường huyết nặng; tránh cho uống gây sặc.","++Đánh giá lại tri giác và glucose sau xử trí, theo dõi tái hạ đường huyết|5|Nguy cơ tái diễn, nhất là khi thuốc còn tác dụng.","+Rà soát thuốc, bữa ăn, chức năng thận và nguyên nhân bỏ bữa|5|Tìm nguyên nhân để phòng tái phát.","+Theo dõi và lập kế hoạch ăn uống/điều chỉnh thuốc sau khi tỉnh, có người phụ trách chuyên môn|10|Ngăn tái hạ đường huyết.","!Cho uống nước đường khi người bệnh lơ mơ và nuốt không an toàn|1|Nguy cơ sặc và tắc đường thở.","!Cho tiêm thêm thuốc hạ đường huyết vì đường huyết dao động|1|Làm nặng thêm hạ đường huyết.","!Châm cứu trước khi xác nhận và xử trí glucose thấp|10|Trì hoãn can thiệp nguyên nhân cấp cứu."],"teach":"Lơ mơ, run và vã mồ hôi ở người dùng thuốc hạ đường huyết cần đo glucose ngay. Với rối loạn tri giác, không cho ăn hoặc uống; chọn đường bù glucose phù hợp v
