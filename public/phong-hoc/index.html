c – Hàn","Lý – Thực – Nhiệt","Lý – Hư – Nhiệt"],"the":["+Khí trệ huyết ứ","Phong hàn thấp tý","Thấp nhiệt","Can thận hư","Khí huyết hư"],"phap":["+Hoạt huyết hóa ứ, hành khí chỉ thống, thông kinh lạc","Bổ can thận, cường yêu tất","Thanh nhiệt lợi thấp","Khu phong tán hàn","Bổ khí dưỡng huyết"],"phuong":["+Thân thống trục ứ thang","Độc hoạt tang ký sinh thang","Bát vị hoàn","Bát chính tán","Quy tỳ thang"],"huyet":["+Đại trường du","+Hoàn khiêu","+Dương lăng tuyền","+Huyền chung","+Ủy trung","Hợp cốc","Nội quan","Khúc trì","Phong trì"]},"actions":["+Hỏi và khám đầy đủ dấu hiệu hội chứng đuôi ngựa (tê vùng yên ngựa, bí tiểu, yếu hai chân, trương lực cơ vòng)|5|Cần loại trừ trước khi châm cứu, chỉ định phẫu thuật cấp cứu nếu có.","+Châm Đại trường du, Hoàn khiêu (Đởm), Dương lăng tuyền (Đởm), Huyền chung (Đởm), Ủy trung (Bàng quang)|25|Hoạt huyết thông lạc theo đường kinh đau lan.","+Hướng dẫn tư thế nằm nghỉ, tránh khuân vác, cúi gập, ngồi lái lâu|3|Giảm áp lực đĩa đệm.","+Hẹn tái khám sau 3 đến 5 ngày, chuyển khoa phẫu thuật thần kinh nếu yếu cơ tiến triển hoặc không cải thiện sau 6 đến 8 tuần|3|Yếu cơ đã có (4/5), cần theo dõi sát.","+Dặn quay lại ngay nếu tê vùng đáy chậu, bí tiểu, yếu hai chân tăng|2|Dấu hiệu hội chứng đuôi ngựa.","-Chụp PET-CT toàn thân|120|Không có nghi ngờ ác tính.","!Nắn bẻ, bấm huyệt mạnh cột sống thắt lưng khi chưa loại trừ hội chứng đuôi ngựa|5|Có thể làm nặng chèn ép rễ và chùm đuôi ngựa.","!Cho tập cúi gập mạnh, ép cột sống thắt lưng tối đa|5|Tăng áp lực đĩa đệm, thoát vị nặng hơn."],"teach":"Đau lan theo dải L5 (mông, ngoài đùi, ngoài cẳng chân, mu bàn chân), Lasègue dương tính, yếu gập mu bàn chân cho thấy thoát vị L4-L5 chèn ép rễ L5. Thể khí trệ huyết ứ: đau cố định như dao đâm, đêm nặng, lưỡi tím điểm ứ huyết, mạch huyền sáp. Dấu hiệu đỏ cần hỏi ở mọi ca đau thắt lưng: hội chứng đuôi ngựa, yếu cơ tiến triển, sốt, sụt cân, tiền sử ung thư.","hbu":{"tien_su":"Làm tài xế đường dài, đau thắt lưng sau khi khuân đồ nặng 5 tuần trước. Không sốt, không sụt cân, không tiền sử ung thư, không có nhiễm trùng hay tiêm chích gần đây. Đã uống thuốc giảm đau và giãn cơ 1 tuần, đỡ ít, chưa chụp phim. Chưa có dữ kiện về tiền sử gia đình, bệnh nền khác và dị ứng thuốc.","luoc_qua_co_quan":"Cơ xương khớp và thần kinh có đau thắt lưng lan mông, mặt ngoài đùi, ngoài cẳng chân tới mu bàn chân phải, tê mu bàn chân, vấp mũi chân phải, nhấc ngón cái khó hơn bên trái; chân trái bình thường. Không tê vùng đáy chậu, không yếu hai chân. Tiết niệu và tiêu hóa: tiểu tiện bình thường, đại tiện bình thường, chức năng sinh lý chưa thay đổi, hay táo bón nhẹ. Toàn thân ngủ kém vì đau, ăn bình thường. Theo YHCT, đêm đau nhiều hơn, chườm nóng đỡ, trời lạnh đau tăng.","tom_tat":"Nam 42 tuổi, tài xế đường dài, đau thắt lưng sau khuân vác nặng 5 tuần, lan mông, mặt ngoài đùi và cẳng chân tới mu bàn chân phải, đau như dao đâm tăng khi ho, hắt hơi, ngồi lâu, cúi người, đêm đau nhiều, mấy ngày nay tê mu bàn chân và hơi khó nhấc mũi chân. Khám co cứng cơ cạnh sống L4-L5 phải, Lasègue dương tính phải ở 40 độ, điểm Valleix đau, gập mu bàn chân và duỗi ngón cái phải 4/5, giảm cảm giác mu bàn chân và mặt ngoài cẳng chân phải, cảm giác vùng yên ngựa và trương lực cơ vòng bình thường. MRI thoát vị đĩa đệm L4-L5 lệch cạnh phải chèn ép rễ L5 phải, không chèn ép chùm đuôi ngựa; điện cơ tổn thương rễ L5 phải mức nhẹ đến vừa; công thức máu, CRP, máu lắng bình thường. Theo YHCT, lưỡi tím tối có điểm ứ huyết, mạch huyền sáp.","dat_van_de":"Đau thắt lưng lan chân theo dải rễ L5 phải kèm yếu nhẹ gập mu bàn chân và giảm cảm giác tương ứng, nghiệm pháp căng rễ dương tính, chưa có dấu hiệu hội chứng đuôi ngựa hay dấu hiệu báo động. Có yếu tố nguy cơ nghề nghiệp. Chứng trạng YHCT gồm đau cố định như dao đâm, đêm nặng, lưỡi tím điểm ứ huyết, mạch huyền sáp.","bien_luan":"Đau thắt lưng lan theo dải L5, Lasègue dương tính, yếu gập mu bàn chân và duỗi ngón cái, giảm cảm giác mu bàn chân cùng MRI thoát vị đĩa L4-L5 lệch phải chèn ép rễ L5 và điện cơ tổn thương rễ L5 xác định đau thần kinh tọa do thoát vị đĩa đệm chèn ép rễ L5 phải. Hội chứng đuôi ngựa ít gợi ý vì không tê vùng yên ngựa, không rối loạn tiểu tiện, không yếu hai chân và trương lực cơ vòng bình thường, nhưng phải hỏi và khám lại ở mọi lần tái khám; đau thắt lưng cơ học đơn thuần không giải thích được yếu cơ và tê theo dải rễ. Nhiễm trùng, ung thư di căn ít gợi ý vì không sốt, không sụt cân, không tiền sử ung thư, CRP và máu lắng bình thường, MRI không viêm đĩa đệm hay khối u. Cần theo dõi yếu cơ; chuyển phẫu thuật thần kinh nếu yếu cơ tiến triển hoặc không cải thiện sau 6 đến 8 tuần điều trị bảo tồn. Theo các khóa YHCT của ca, bệnh danh Tọa cốt phong, bát cương Lý–Thực, không hàn không nhiệt rõ, thể Khí trệ huyết ứ; pháp hoạt huyết hóa ứ, hành khí chỉ thống, thông kinh lạc, phối hợp với điều trị bảo tồn y học hiện đại và theo dõi thần kinh.","sinh_ly_benh":"Nhân nhầy đĩa đệm L4-L5 thoát ra qua vòng sợi rách ở phía sau bên làm chèn ép cơ học và gây viêm hóa học quanh rễ L5, gây đau lan theo dải rễ, tê và yếu cơ do rối loạn dẫn truyền. Ho, hắt hơi, ngồi lâu và cúi người làm tăng áp lực trong đĩa nên đau tăng. Theo YHCT, khí trệ huyết ứ làm kinh lạc vùng thắt lưng và chân không thông, bất thông tắc thống nên đau cố định như dao đâm, đêm nặng.","tien_luong":"Gần: phần lớn thoát vị đĩa đệm có triệu chứng rễ cải thiện với điều trị bảo tồn trong vài tuần đến vài tháng, nhưng cần theo dõi sát yếu cơ. Xa: có thể tái phát; nguy cơ di chứng yếu cơ hoặc giảm cảm giác nếu chèn ép kéo dài. Theo YHCT, đánh giá lại lưỡi mạch, tính chất đau và đáp ứng điều trị.","du_phong":"Nằm nghỉ ở tư thế thoải mái, tránh khuân vác, cúi gập và ngồi lái lâu, sau đó vận động trở lại dần; tập cơ cạnh sống và cơ bụng khi hết đau cấp. Tái khám sau 3 đến 5 ngày; chuyển phẫu thuật thần kinh nếu yếu cơ tiến triển hoặc không cải thiện sau 6 đến 8 tuần. Quay lại ngay nếu tê vùng đáy chậu, bí tiểu hoặc yếu hai chân tăng. Châm cứu chỉ thực hiện sau khi đã sàng lọc dấu hiệu đỏ."},"nguon":["North American Spine Society, Evidence-Based Clinical Guidelines for Multidisciplinary Spine Care: Diagnosis and Treatment of Lumbar Disc Herniation with Radiculopathy, 2012.","NICE, Low Back Pain and Sciatica in Over 16s: Assessment and Management, NG59, 2016, cập nhật 2020.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"hoi-chung-ong-co-tay-huyet-hu","title":"Tê bàn tay về đêm, hay giật mình thức giấc","kind":"Cơ xương khớp","level":"Trung bình","group":"cxk","place":"Phòng châm cứu","clock":"15:30","name":"Chị Phạm Thị Lan","age":38,"sex":"nữ","intro":"Chị là nhân viên đóng gói, đến vì tê và đau bàn tay phải 3 tháng, tê nhiều về đêm làm chị thức giấc phải vẩy tay.","vitals":{"hr":72,"sbp":105,"dbp":68,"rr":17,"t":36.5,"spo2":99},"ask":[["Tê ở những ngón nào?","Tê ngón cái, ngón trỏ, ngón giữa và nửa ngón nhẫn phía ngón cái bên tay phải. Ngón út không tê.","e"],["Khi nào tê nhiều nhất?","Tê nhiều về đêm và sáng sớm, thức giấc phải vẩy tay mới đỡ. Khi cầm điện thoại, cầm xe máy lâu cũng tê.","e"],["Có yếu tay, cầm nắm rơi đồ không?","Dạo này cầm chai nước, kéo cắt hay tuột tay.","e"],["Có đau cổ, đau lan từ cổ xuống tay không?","Không đau cổ, đau chỉ ở cổ tay và bàn tay.","e"],["Tay có lạnh, sợ lạnh không?","Tay chân hay lạnh, ngâm nước lạnh thì tê tăng. Chườm ấm thì đỡ.","e"],["Có bệnh nền như đái tháo đường, suy giáp, viêm khớp dạng thấp, mang thai không?","Không đái tháo đường, không bệnh tuyến giáp, không mang thai. Không đau sưng nhiều khớp.","e"],["Nghề nghiệp, công việc lặp lại cổ tay?","Đóng gói hàng, thao tác lặp lại cổ tay 8 giờ mỗi ngày.","n"],["Ăn ngủ, kinh nguyệt?","Hay hồi hộp, ngủ kém, hoa mắt khi đứng lên. Kinh nguyệt ít, màu nhạt.","n"],["Sắc mặt, cảm giác mệt mỏi?","Mệt mỏi, da xanh, hay chóng mặt nhẹ.","n"]],"exam":[["V","Thần sắc, hình thái bàn tay","Sắc mặt nhợt, môi nhạt. Bàn tay không sưng, ô mô cái chưa teo rõ.","e"],["V","Lưỡi","Chất lưỡi nhạt, rêu trắng mỏng.","e"],["M","Giọng nói, hơi thở","Tiếng nói nhỏ, hơi thở bình thường.","n"],["T","Mạch","Mạch tế, trầm.","e"],["T","Sờ tay","Bàn tay, đầu ngón lạnh, ẩm nhẹ.","n"],["K","Nghiệm pháp Tinel và Phalen","Tinel dương tính, Phalen dương tính sau 30 giây gập cổ tay.","e"],["K","Cảm giác và cơ lực bàn tay","Giảm cảm giác ngón 1, 2, 3 và nửa ngón 4 mặt gan tay, lực dạng ngón cái 4/5, chưa teo ô mô cái.","e"],["K","Khám cột sống cổ, thần kinh chi trên","Spurling âm tính, phản xạ gân cơ chi trên bình thường.","e"]],"tests":[["Điện cơ và dẫn truyền thần kinh giữa",30,"Giảm tốc độ dẫn truyền cảm giác và tăng thời gian tiềm vận động thần kinh giữa qua cổ tay phải, mức độ nhẹ đến vừa.","e"],["Siêu âm cổ tay",15,"Thần kinh giữa phù nề, tăng diện cắt ngang trước ống cổ tay.","n"],["Đường huyết đói, TSH",20,"Bình thường.","n"],["Công thức máu, ferritin",20,"Hb 10,8 g/dL, thiếu máu nhẹ thiếu sắt.","n"],["MRI não",45,"Không có chỉ định ở ca này.","w"]],"opt":{"ydx":["+Hội chứng ống cổ tay (thần kinh giữa) phải","Thoát vị đĩa đệm cổ C6","Bệnh đa dây thần kinh do đái tháo đường","Hội chứng lối thoát lồng ngực","Viêm khớp dạng thấp"],"bd":["+Uyển tý (chứng tý vùng cổ tay)","Cảnh tý","Trúng phong","Kiên tý","Huyễn vựng"],"bc":["+Lý – Hư – Hàn","Biểu – Thực – Hàn","Lý – Thực – Nhiệt","Lý – Hư – Nhiệt","Biểu – Hư – Nhiệt"],"the":["+Huyết hư hàn ngưng","Khí trệ huyết ứ","Can dương thượng cang","Thấp nhiệt","Đàm thấp trở lạc"],"phap":["+Ôn kinh tán hàn, dưỡng huyết thông mạch","Thanh nhiệt lợi thấp","Bình can tiềm dương","Hoạt huyết hóa ứ mạnh","Kiện tỳ hóa đàm"],"phuong":["+Đương quy tứ nghịch thang","Quyên tý thang","Thiên ma câu đằng ẩm","Bạch hổ thang","Ngân kiều tán"],"huyet":["+Đại lăng","+Nội quan","+Ngoại quan","+Hợp cốc","+Tam âm giao","Dũng tuyền","Thái xung","Phong trì","Yêu dương quan"]},"actions":["+Châm Đại lăng, Nội quan (Tâm bào), Ngoại quan (Tam tiêu), Hợp cốc (Đại trường), Tam âm giao (Tỳ)|25|Ôn kinh, dưỡng huyết, thông kinh lạc vùng ống cổ tay.","+Sàng lọc nguyên nhân: đái tháo đường, suy giáp, viêm khớp dạng thấp, thiếu máu, thai kỳ|4|Điều trị nguyên nhân kèm theo.","+Đánh giá mức độ: teo cơ ô mô cái, mất cảm giác nặng, điện cơ tổn thương nặng thì hội chẩn phẫu thuật giải ép|3|Chỉ định ngoại khoa khi nặng hoặc điều trị nội khoa thất bại.","+Hướng dẫn nẹp cổ tay tư thế trung gian khi ngủ, nghỉ giải lao khi thao tác lặp lại|3|Giảm áp lực trong ống cổ tay.","+Hướng dẫn bổ sung sắt, ăn uống bồi dưỡng khí huyết|3|Thiếu máu nhẹ kèm theo, cần xử trí theo bác sĩ.","-Chụp MRI não|45|Không có chỉ định.","!Cho thuốc thanh nhiệt hàn lương mạnh và châm tả mạnh|3|Thể huyết hư hàn ngưng, thuốc hàn làm huyết ngưng nặng hơn.","!Tiêm corticoid vào ống cổ tay không chẩn đoán xác định và không theo dõi|5|Nguy cơ tổn thương thần kinh giữa, chỉ làm khi có chỉ định chuyên khoa."],"teach":"Tê ngón 1, 2, 3 và nửa ngón 4, nặng về đêm, Tinel và Phalen dương tính là điển hình của hội chứng ống cổ tay. Ngón út không tê và Spurling âm tính giúp loại trừ chèn ép rễ cổ. Thể huyết hư hàn ngưng: mặt nhợt, tay lạnh, lưỡi nhạt, mạch tế trầm. Cần tìm bệnh nền (đái tháo đường, suy giáp, thiếu máu, thai kỳ) và dấu hiệu nặng (teo ô mô cái) cần ngoại khoa.","hbu":{"tien_su":"Làm nhân viên đóng gói, thao tác lặp lại cổ tay khoảng 8 giờ mỗi ngày. Không đái tháo đường, không bệnh tuyến giáp, không mang thai, không đau sưng nhiều khớp. Chưa có dữ kiện về chấn thương cổ tay, dị ứng thuốc, thuốc đang dùng và tiền sử gia đình.","luoc_qua_co_quan":"Thần kinh có tê ngón cái, ngón trỏ, ngón giữa và nửa ngón nhẫn phía ngón cái tay phải, ngón út không tê, tê nhiều về đêm và sáng sớm làm thức giấc phải vẩy tay, cầm chai nước, kéo cắt hay tuột tay; không đau cổ, không đau lan từ cổ xuống tay. Tim mạch hồi hộp, hoa mắt khi đứng lên; toàn thân mệt, da xanh, chóng mặt nhẹ, ngủ kém. Sản phụ khoa kinh nguyệt ít, màu nhạt. Theo YHCT, tay chân hay lạnh, ngâm nước lạnh tê tăng, chườm ấm đỡ.","tom_tat":"Nữ 38 tuổi, nhân viên đóng gói thao tác cổ tay lặp lại, tê đau bàn tay phải 3 tháng ở ngón cái, trỏ, giữa và nửa ngón nhẫn, nặng về đêm và sáng sớm, thức giấc phải vẩy tay, gần đây cầm nắm yếu. Khám Tinel và Phalen dương tính, giảm cảm giác ngón 1, 2, 3 và nửa ngón 4 mặt gan tay, lực dạng ngón cái 4/5, chưa teo ô mô cái, Spurling âm tính, phản xạ gân cơ chi trên bình thường. Điện cơ cho thấy giảm tốc độ dẫn truyền cảm giác và tăng thời gian tiềm vận động thần kinh giữa qua cổ tay phải mức nhẹ đến vừa; siêu âm thần kinh giữa phù nề, tăng diện cắt ngang; đường huyết đói và TSH bình thường, Hb 10,8 g/dL với ferritin thấp phù hợp thiếu máu thiếu sắt nhẹ. Theo YHCT, sắc mặt nhợt, lưỡi nhạt rêu trắng mỏng, mạch tế trầm, tay lạnh.","dat_van_de":"Tê đau bàn tay phải theo vùng chi phối thần kinh giữa, nặng về đêm, kèm yếu nhẹ cầm nắm, các nghiệm pháp kích thích dương tính, điện cơ và siêu âm xác nhận chèn ép thần kinh giữa ở cổ tay, trên người thao tác cổ tay lặp lại và có thiếu máu thiếu sắt nhẹ. Chứng trạng YHCT gồm sắc mặt nhợt, tay chân lạnh, hồi hộp, hoa mắt, lưỡi nhạt, mạch tế trầm.","bien_luan":"Tê ngón 1, 2, 3 và nửa ngón 4, nặng về đêm làm thức giấc, Tinel và Phalen dương tính, giảm cảm giác vùng thần kinh giữa, yếu nhẹ dạng ngón cái cùng điện cơ và siêu âm xác nhận hội chứng ống cổ tay (thần kinh giữa) phải mức nhẹ đến vừa. Chèn ép rễ cổ C6 hoặc C7 ít gợi ý vì ngón út không tê, không đau cổ, Spurling âm tính và phản xạ gân cơ bình thường; bệnh thần kinh ngoại biên do đái tháo đường hoặc suy giáp ít gợi ý khi đường huyết và TSH bình thường. Thiếu máu thiếu sắt nhẹ có thể làm nặng thêm triệu chứng thần kinh nhưng không phải nguyên nhân chính, cần điều trị song song; thai kỳ và viêm khớp dạng thấp không có bằng chứng. Cần theo dõi dấu hiệu nặng như teo ô mô cái, mất cảm giác nặng hoặc điện cơ tổn thương nặng để hội chẩn phẫu thuật giải ép. Theo các khóa YHCT của ca, bệnh danh Uyển tý (chứng tý vùng cổ tay), bát cương Lý–Hư–Hàn, thể Huyết hư hàn ngưng; pháp ôn kinh tán hàn, dưỡng huyết thông mạch, phối hợp với nẹp cổ tay, giảm thao tác lặp lại và điều trị thiếu máu.","sinh_ly_benh":"Thần kinh giữa đi qua ống cổ tay chật hẹp; thao tác lặp lại cổ tay và gập duỗi kéo dài làm tăng áp lực trong ống, gây phù, thiếu máu thần kinh và chậm dẫn truyền, nặng về đêm do cổ tay gập tự nhiên và dịch ứ. Thiếu máu thiếu sắt có thể làm giảm khả năng chịu thiếu oxy của dây thần kinh. Theo YHCT, huyết hư làm kinh mạch không được nuôi dưỡng, hàn tà ngưng trệ ở cổ tay làm khí huyết vận hành bất thông nên tê, đau và lạnh tay.","tien_luong":"Gần: thể nhẹ đến vừa thường cải thiện với nẹp cổ tay ban đêm, giảm thao tác lặp lại và điều trị bảo tồn. Xa: nếu chèn ép kéo dài có thể teo ô mô cái và mất cảm giác không hồi phục; cần theo dõi để hội chẩn phẫu thuật kịp thời. Theo YHCT, đánh giá lại sắc mặt, tay lạnh và lưỡi mạch sau bổ huyết.","du_phong":"Mang nẹp cổ tay ở tư thế trung gian khi ngủ, nghỉ giải lao định kỳ khi thao tác lặp lại, điều chỉnh tư thế và dụng cụ làm việc. Bổ sung sắt theo chỉ định, ăn uống bồi dưỡng khí huyết, kiểm tra lại Hb và ferritin. Tái khám khi tê tăng, yếu cầm nắm hoặc teo cơ; hội chẩn phẫu thuật nếu triệu chứng nặng hoặc không đáp ứng bảo tồn. Châm cứu chỉ hỗ trợ theo chỉ định."},"nguon":["American Academy of Orthopaedic Surgeons, Management of Carpal Tunnel Syndrome Evidence-Based Clinical Practice Guideline, 2016.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"viem-quanh-khop-vai-dong-cung","title":"Đau vai trái nhiều về đêm, không giơ tay chải đầu được","kind":"Cơ xương khớp","level":"Dễ","group":"cxk","place":"Phòng châm cứu","clock":"09:30","name":"Bà Hoàng Thị Thu","age":55,"sex":"nữ","intro":"Bà đến vì đau vai trái 3 tháng, tăng dần, đau nhiều về đêm, giờ không giơ tay lên chải đầu hay cài áo ngực phía sau được.","vitals":{"hr":76,"sbp":128,"dbp":78,"rr":18,"t":36.6,"spo2":98},"ask":[["Đau vai bắt đầu thế nào, có chấn thương không?","Đau dần dần, không té ngã, không chấn thương rõ. Đau vai trái, lan nhẹ xuống mặt ngoài cánh tay.","e"],["Đau tăng khi nào?","Đau tăng khi giơ tay, vắt tay ra sau lưng, nằm đè lên vai trái. Đêm đau thức giấc.","e"],["Hạn chế vận động thế nào?","Giơ tay chỉ lên ngang vai, không gãi được lưng, không cài áo ngực. Tay còn cầm nắm bình thường.","e"],["Có đau ngực, khó thở, vã mồ hôi, đau lan hàm khi gắng sức không?","Không đau ngực, không khó thở, không vã mồ hôi.","e"],["Có sốt, ho kéo dài, ho ra máu, sụt cân, sụp mi không?","Không sốt, không ho ra máu, không sụt cân, mắt bình thường. Không hút thuốc.","e"],["Trời lạnh, chườm ấm ảnh hưởng ra sao?","Trời lạnh, ngủ quạt thổi vào vai thì đau tăng. Chườm ấm thì đỡ.","e"],["Bệnh nền?","Đái tháo đường típ 2, đang uống thuốc đều, chưa biến chứng.","n"],["Ăn, ngủ, đại tiểu tiện?","Ngủ kém vì đau, ăn bình thường, đại tiểu tiện bình thường.","n"],["Đã dùng thuốc gì?","Uống thuốc giảm đau 2 tuần, đỡ ít.","n"]],"exam":[["V","Thần sắc, tư thế vai","Tinh thần tỉnh táo, vai trái hơi nhô, tay trái khép sát thân.","n"],["V","Lưỡi","Chất lưỡi nhạt, rêu trắng mỏng.","e"],["M","Giọng nói, hơi thở","Tiếng nói rõ, hơi thở bình thường.","n"],["T","Mạch","Mạch phù khẩn.","e"],["T","Sờ khớp vai","Sờ vùng vai trái lạnh hơn bên phải, ấn đau rãnh nhị đầu và vùng trước khớp vai.","e"],["K","Tầm vận động chủ động và thụ động khớp vai","Dạng chủ động 80 độ, thụ động 85 độ, xoay ngoài chủ động và thụ động 20 độ, xoay trong tới mông. Hạn chế đồng đều cả hai.","e"],["K","Khám tim phổi, mạch, huyết áp hai tay","Nhịp đều, phổi trong, mạch quay hai tay đều, không dấu hiệu bệnh tim phổi.","e"],["K","Khám thần kinh chi trên và cột sống cổ","Cơ lực 5/5, cảm giác bình thường, Spurling âm tính.","n"]],"tests":[["X-quang khớp vai thẳng và nghiêng",15,"Không có tổn thương xương, loãng xương nhẹ vùng đầu xương cánh tay.","e"],["Siêu âm khớp vai",15,"Dày bao khớp, tràn dịch nhẹ bao hoạt dịch, gân chóp xoay không đứt hoàn toàn.","e"],["Đường huyết đói và HbA1c",20,"Đường huyết đói 7,4 mmol/L, HbA1c 7,2 phần trăm.","n"],["Điện tâm đồ",5,"Nhịp xoang, không có thay đổi thiếu máu cục bộ.","n"],["CT ngực có cản quang",40,"Không có chỉ định, không có dấu hiệu nghi ngờ u đỉnh phổi.","w"]],"opt":{"ydx":["+Viêm quanh khớp vai thể đông cứng (viêm bao khớp dính)","Rách chóp xoay hoàn toàn","Hội chứng cổ vai cánh tay do chèn ép rễ","Đau vai do bệnh tim thiếu máu cục bộ","Viêm khớp vai nhiễm khuẩn"],"bd":["+Kiên ngưng (Ngũ thập kiên)","Cảnh tý","Hạng cường","Thống phong","Hung tý"],"bc":["+Biểu – Thực – Hàn","Lý – Hư – Hàn","Lý – Thực – Nhiệt","Biểu – Thực – Nhiệt","Lý – Hư – Nhiệt"],"the":["+Phong hàn thấp tý","Khí trệ huyết ứ","Can thận hư","Thấp nhiệt tý","Đàm thấp trở lạc"],"phap":["+Khu phong tán hàn trừ thấp, thông kinh hoạt lạc","Bổ can thận","Thanh nhiệt lợi thấp","Hoạt huyết hóa ứ","Kiện tỳ hóa đàm"],"phuong":["+Quyên tý thang","Bạch hổ gia quế chi thang","Thân thống trục ứ thang","Lục vị địa hoàng hoàn","Bình vị tán"],"huyet":["+Kiên ngung","+Kiên liêu","+Kiên trinh","+Tý nhu","+Điều khẩu","Dũng tuyền","Thái khê","Quan nguyên","Thiên khu"]},"actions":["+Châm Kiên ngung, Tý nhu (Đại trường), Kiên liêu (Tam tiêu), Kiên trinh (Tiểu trường), Điều khẩu (Vị), kèm cứu hoặc đèn hồng ngoại|25|Khu hàn trừ thấp, thông kinh lạc vùng vai.","+Loại trừ đau vai do bệnh tim (ECG, đau ngực gắng sức), u đỉnh phổi, rách chóp xoay hoàn toàn, nhiễm khuẩn|5|Đau vai có thể là triệu chứng của bệnh nội tạng.","+Hướng dẫn tập vận động khớp vai từ từ (con lắc, leo tường) trong ngưỡng đau|5|Phục hồi tầm vận động, tránh dính khớp.","+Dặn kiểm soát đường huyết tốt|2|Đái tháo đường là yếu tố nguy cơ.","+Chườm ấm vùng vai trước khi tập|10|Hợp thể hàn thấp.","-Chụp CT ngực có cản quang|40|Không cần thiết.","!Bẻ, kéo mạnh khớp vai dưới gây mê hoặc không gây mê tại phòng châm|5|Nguy cơ gãy xương, rách cơ và chóp xoay, nhất là khi loãng xương.","!Châm sâu, kích thích mạnh khi chưa loại trừ đau vai do bệnh tim|3|Bỏ sót cơn đau thắt ngực, nhồi máu cơ tim."],"teach":"Hạn chế đồng đều tầm vận động cả chủ động và thụ động, đau đêm, tuổi 40 đến 60, đái tháo đường là điển hình viêm bao khớp dính, khác rách chóp xoay (chủ động hạn chế nhiều hơn thụ động). Thể phong hàn thấp tý: sợ lạnh, mạch phù khẩn. Luôn loại trừ đau vai do tim, phổi, cổ trước khi điều trị.","hbu":{"tien_su":"Đái tháo đường típ 2 đang uống thuốc đều, chưa biến chứng; không hút thuốc. Không té ngã hay chấn thương rõ. Đã uống thuốc giảm đau 2 tuần, đỡ ít. Chưa có dữ kiện về tiền sử gia đình, bệnh tuyến giáp, phẫu thuật vai trước đây và dị ứng thuốc.","luoc_qua_co_quan":"Cơ xương khớp có đau dần vai trái 3 tháng, lan nhẹ xuống mặt ngoài cánh tay, tăng khi giơ tay, vắt tay ra sau lưng, nằm đè vai trái, đau đêm thức giấc; không giơ tay quá ngang vai, không gãi được lưng, không cài áo ngực, tay cầm nắm bình thường. Tim mạch và hô hấp không đau ngực, khó thở, vã mồ hôi, không ho ra máu. Toàn thân không sốt, không sụt cân, không sụp mi; ngủ kém vì đau, đại tiểu tiện bình thường. Theo YHCT, trời lạnh hoặc quạt thổi vào vai thì đau tăng, chườm ấm thì đỡ.","tom_tat":"Nữ 55 tuổi, đái tháo đường típ 2, đau vai trái 3 tháng tăng dần không chấn thương, đau nhiều về đêm, không giơ tay chải đầu hay cài áo ngực phía sau được. Khám vai trái hơi nhô, ấn đau rãnh nhị đầu và vùng trước khớp vai, dạng chủ động 80 độ và thụ động 85 độ, xoay ngoài chủ động và thụ động đều 20 độ, hạn chế đồng đều cả hai, cơ lực 5/5, Spurling âm tính, tim phổi và mạch hai tay bình thường. X-quang không tổn thương xương; siêu âm dày bao khớp, tràn dịch nhẹ bao hoạt dịch, gân chóp xoay không đứt hoàn toàn; đường huyết đói 7,4 mmol/L, HbA1c 7,2%, điện tâm đồ nhịp xoang không thiếu máu cục bộ. Theo YHCT, vai lạnh hơn bên phải, lưỡi nhạt rêu trắng mỏng, mạch phù khẩn.","dat_van_de":"Đau vai tiến triển kèm hạn chế vận động đồng đều cả chủ động và thụ động ở khớp vai trái, đau đêm, ở người trung niên đái tháo đường, không chấn thương và không dấu hiệu bệnh lý tim phổi hay cổ. Chứng trạng YHCT gồm vai lạnh, sợ gió lạnh, đau tăng khi lạnh, lưỡi nhạt, mạch phù khẩn.","bien_luan":"Hạn chế đồng đều tầm vận động chủ động và thụ động theo nhiều hướng, đau đêm, tuổi 40 đến 60, đái tháo đường và siêu âm dày bao khớp phù hợp viêm quanh khớp vai thể đông cứng (viêm bao khớp dính). Rách chóp xoay ít phù hợp vì tầm vận động thụ động cũng hạn chế gần bằng chủ động và gân chóp xoay không đứt hoàn toàn trên siêu âm; thoái hóa khớp vai hoặc bệnh lý xương ít gợi ý vì X-quang không tổn thương. Đau vai quy chiếu từ tim, phổi hoặc cột sống cổ cần loại trừ: không đau ngực khi gắng sức, điện tâm đồ bình thường, không ho ra máu hay sụt cân, Spurling âm tính. Nhiễm khuẩn khớp ít gợi ý vì không sốt, không sưng nóng đỏ. Kiểm soát đường huyết tốt và tập vận động trong ngưỡng đau là phần quan trọng. Theo các khóa YHCT của ca, bệnh danh Kiên ngưng (Ngũ thập kiên), bát cương Biểu–Thực–Hàn, thể Phong hàn thấp tý; pháp khu phong tán hàn trừ thấp, thông kinh hoạt lạc, phối hợp với tập vận động và kiểm soát đường huyết.","sinh_ly_benh":"Viêm và xơ hóa bao khớp ổ chảo-cánh tay làm dày, co rút bao khớp và giảm thể tích khoang khớp, gây hạn chế vận động đồng đều và đau. Đái tháo đường làm tăng nguy cơ do glycation collagen và viêm mạn tính. Bệnh thường diễn tiến qua các giai đoạn đau, đông cứng rồi hồi phục dần. Theo YHCT, phong hàn thấp xâm nhập kinh lạc vùng vai làm khí huyết ngưng trệ, gân cơ co cứng nên vai đau và hạn chế vận động.","tien_luong":"Gần: đau thường giảm dần khi tập vận động đều và điều trị phù hợp. Xa: bệnh có xu hướng tự giới hạn nhưng có thể kéo dài từ nhiều tháng đến vài năm, tiến triển chậm hơn ở người đái tháo đường và có thể còn hạn chế vận động nhẹ. Theo YHCT, đánh giá lại tầm vận động, tính chất đau và chứng sợ lạnh sau điều trị.","du_phong":"Tập vận động khớp vai từ từ (con lắc, leo tường) trong ngưỡng đau, chườm ấm vùng vai trước khi tập, tránh để vai bất động kéo dài. Kiểm soát tốt đường huyết và tái khám định kỳ. Cần tái khám nếu đau tăng đột ngột, sốt, sưng nóng đỏ vai, yếu cơ hoặc đau ngực. Châm cứu, cứu hoặc đèn hồng ngoại chỉ hỗ trợ theo chỉ định."},"nguon":["Kelley MJ và cs., Shoulder Pain and Mobility Deficits: Adhesive Capsulitis, Journal of Orthopaedic and Sports Physical Therapy Clinical Practice Guidelines, 2013.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"dau-nua-dau-can-duong-thuong-cang","title":"Đau nửa đầu từng cơn kèm buồn nôn, sợ ánh sáng","kind":"Thần kinh","level":"Trung bình","group":"cxk","place":"Phòng châm cứu","clock":"16:00","name":"Chị Vũ Thị Hồng","age":34,"sex":"nữ","intro":"Chị là nhân viên văn phòng, đến vì các cơn đau nửa đầu tái phát khoảng 1 năm nay, mấy tháng gần đây cơn dày hơn khi áp lực công việc.","vitals":{"hr":80,"sbp":118,"dbp":76,"rr":17,"t":36.7,"spo2":99},"ask":[["Đau đầu như thế nào, vị trí nào?","Đau nhói, giật theo nhịp mạch ở thái dương và hốc mắt một bên, thường bên trái, đôi khi đổi bên.","e"],["Mỗi cơn kéo dài bao lâu, bao nhiêu cơn mỗi tháng?","Mỗi cơn 6 đến 12 giờ, khoảng 3 đến 4 cơn mỗi tháng. Giữa các cơn hoàn toàn bình thường.","e"],["Có buồn nôn, sợ ánh sáng, sợ tiếng động, có báo trước không?","Buồn nôn, sợ ánh sáng, sợ tiếng ồn. Cơn thường kèm mờ mắt thoáng qua, thấy chớp sáng khoảng 20 phút trước đau.","e"],["Có yếu liệt, nói khó, lú lẫn, co giật không?","Không, hết chớp sáng thì nhìn rõ lại, không yếu liệt, không nói khó.","e"],["Đau đầu bất thường: dữ dội đột ngột, sốt cứng gáy, đau tăng khi ho hoặc nằm, mới xuất hiện sau 50 tuổi không?","Đau không dữ dội đột ngột, không sốt, không cứng gáy, không đau tăng khi ho. Đau bắt đầu từ năm 33 tuổi.","e"],["Yếu tố khởi phát?","Hay bùng phát khi tức giận, căng thẳng, thiếu ngủ, ăn đồ cay nóng, trước kỳ kinh.","e"],["Tính tình, miệng, giấc ngủ?","Hay cáu gắt, miệng đắng, họng khô, ngủ nông, hay mơ.","e"],["Đại tiểu tiện, kinh nguyệt?","Táo bón, nước tiểu vàng. Kinh nguyệt đều, hay đau đầu trước kỳ.","n"],["Thuốc đang dùng, có dùng thuốc tránh thai không?","Không dùng thuốc tránh thai. Uống ibuprofen khi đau, đỡ một phần.","n"],["Tiền sử gia đình?","Mẹ hay bị đau nửa đầu.","n"]],"exam":[["V","Thần sắc","Sắc mặt hơi đỏ, mắt đỏ nhẹ, vẻ mặt bực bội.","n"],["V","Lưỡi","Chất lưỡi đỏ, bờ lưỡi đỏ, rêu vàng mỏng.","e"],["M","Giọng nói, hơi thở","Tiếng nói to, hơi thở hơi nặng mùi.","n"],["T","Mạch","Mạch huyền sác.","e"],["T","Sờ vùng đầu cổ","Cơ thái dương, cơ chẩm trái co cứng, ấn đau điểm Phong trì và Thái dương.","n"],["K","Khám thần kinh sọ não","Đồng tử đều phản xạ tốt, thị trường bình thường, vận nhãn bình thường, cơ lực và cảm giác bình thường, không dấu hiệu thần kinh khu trú.","e"],["K","Dấu màng não, soi đáy mắt","Không cứng gáy, Kernig và Brudzinski âm tính. Đáy mắt: gai thị rõ bờ, không phù gai.","e"],["K","Huyết áp, khám tim mạch","Huyết áp 118/76 mmHg, tim phổi bình thường.","n"]],"tests":[["Công thức máu, tốc độ máu lắng, CRP",20,"Bình thường.","n"],["Soi đáy mắt",10,"Không phù gai thị.","e"],["Đo huyết áp 24 giờ",30,"Huyết áp trung bình bình thường.","n"],["CT sọ não không cản quang",20,"Không có tổn thương. Không cần chụp thường quy ở đau nửa đầu điển hình, không dấu cảnh báo.","w"],["Chụp mạch máu não (MRA, DSA)",60,"Không có chỉ định ở ca này.","w"]],"opt":{"ydx":["+Đau nửa đầu (migraine) có tiền triệu thị giác","Đau đầu căng thẳng","Đau đầu từng cụm","Xuất huyết dưới nhện","Viêm màng não"],"bd":["+Thiên đầu thống","Huyễn vựng","Trúng phong","Chân đầu thống","Đầu phong thống do ngoại cảm"],"bc":["+Lý – Thực – Nhiệt","Lý – Hư – Hàn","Biểu – Thực – Hàn","Biểu – Thực – Nhiệt","Lý – Hư – Nhiệt"],"the":["+Can dương thượng cang","Can uất khí trệ","Đàm thấp thượng nhiễu","Khí huyết hư","Phong hàn thượng phạm"],"phap":["+Bình can tiềm dương, tức phong chỉ thống","Sơ can giải uất","Hóa đàm trừ thấp","Bổ khí dưỡng huyết","Sơ phong tán hàn"],"phuong":["+Thiên ma câu đằng ẩm","Xuyên khung trà điều tán","Bán hạ bạch truật thiên ma thang","Bổ trung ích khí thang","Quy tỳ thang"],"huyet":["+Phong trì","+Thái dương","+Suất cốc","+Thái xung","+Hợp cốc","Túc tam lý","Quan nguyên","Thận du","Khí hải"]},"actions":["+Châm Phong trì, Suất cốc (Đởm), Thái dương (ngoài kinh), Thái xung (Can), Hợp cốc (Đại trường)|25|Bình can tiềm dương, thông lạc chỉ thống.","+Sàng lọc dấu hiệu cảnh báo đau đầu thứ phát: đột ngột dữ dội, sốt cứng gáy, dấu thần kinh khu trú, phù gai thị, khởi phát sau 50 tuổi|5|Loại trừ xuất huyết dưới nhện, viêm màng não, u não trước khi điều trị châm cứu.","+Hướng dẫn ghi nhật ký đau đầu, tránh yếu tố khởi phát (thiếu ngủ, rượu, thực phẩm cay nóng)|4|Dự phòng cơn.","+Dặn dùng thuốc cắt cơn đúng chỉ định, tránh lạm dụng giảm đau hằng ngày|3|Tránh đau đầu do lạm dụng thuốc.","+Dặn đến cấp cứu ngay nếu đau dữ dội đột ngột, yếu liệt, nói khó, sốt cứng gáy, co giật|2|Dấu hiệu nguy hiểm.","-Chụp CT sọ não thường quy|20|Không có dấu cảnh báo.","!Cho thuốc ôn bổ cay nóng (Phụ tử, Quế chi liều cao)|2|Can dương thượng cang, thuốc nhiệt làm dương cang thêm.","!Châm sâu, kích thích mạnh vùng cổ gáy khi chưa loại trừ nguyên nhân thực thể|4|Nguy cơ biến chứng, bỏ sót đau đầu thứ phát."],"teach":"Đau nửa đầu giật theo mạch, kèm buồn nôn, sợ ánh sáng, có tiền triệu thị giác và giữa cơn bình thường là migraine điển hình, thường không cần chẩn đoán hình ảnh. Thể can dương thượng cang: cáu gắt, miệng đắng, lưỡi đỏ rêu vàng mỏng, mạch huyền sác. Phải hỏi dấu hiệu cảnh báo (đau đột ngột dữ dội, sốt cứng gáy, dấu thần kinh khu trú, khởi phát sau 50 tuổi).","hbu":{"tien_su":"Mẹ hay bị đau nửa đầu. Cơn đau đầu bắt đầu từ năm 33 tuổi, hiện uống ibuprofen khi đau, đỡ một phần; không dùng thuốc tránh thai. Kinh nguyệt đều, hay đau đầu trước kỳ kinh. Chưa có dữ kiện về chấn thương đầu, bệnh mạch máu não, bệnh nền khác và dị ứng thuốc.","luoc_qua_co_quan":"Thần kinh có đau nhói giật theo nhịp mạch ở thái dương và hốc mắt một bên, thường bên trái, đôi khi đổi bên; thấy chớp sáng và mờ mắt thoáng qua khoảng 20 phút trước đau rồi nhìn rõ lại, không yếu liệt, không nói khó, không lú lẫn, không co giật; giữa các cơn hoàn toàn bình thường. Tiêu hóa có buồn nôn, táo bón; tiết niệu nước tiểu vàng. Tim mạch, hô hấp không triệu chứng. Theo YHCT, hay cáu gắt, miệng đắng, họng khô, ngủ nông hay mơ.","tom_tat":"Nữ 34 tuổi, nhân viên văn phòng, các cơn đau nửa đầu tái phát khoảng 1 năm, đau nhói giật theo mạch ở thái dương và hốc mắt một bên, mỗi cơn 6 đến 12 giờ, 3 đến 4 cơn mỗi tháng, kèm buồn nôn, sợ ánh sáng, sợ tiếng ồn, có thấy chớp sáng thoáng qua khoảng 20 phút trước đau, giữa cơn bình thường, hay bùng phát khi căng thẳng, thiếu ngủ, ăn cay nóng và trước kỳ kinh; mẹ bị đau nửa đầu. Khám cơ thái dương và cơ chẩm trái co cứng ấn đau, khám thần kinh sọ não và chi bình thường, không dấu màng não, đáy mắt không phù gai thị, huyết áp 118/76 mmHg; công thức máu, máu lắng, CRP bình thường, huyết áp 24 giờ trung bình bình thường. Theo YHCT, sắc mặt hơi đỏ, lưỡi đỏ rêu vàng mỏng, mạch huyền sác.","dat_van_de":"Đau đầu cơn tái diễn một bên, tính chất mạch đập, kèm buồn nôn, sợ ánh sáng, sợ tiếng ồn và có tiền triệu thị giác hồi phục hoàn toàn, giữa các cơn bình thường, khám thần kinh bình thường, không có dấu hiệu cảnh báo. Chứng trạng YHCT gồm cáu gắt, miệng đắng, lưỡi đỏ rêu vàng mỏng, mạch huyền sác.","bien_luan":"Đau nửa đầu từng cơn mạch đập kéo dài 6 đến 12 giờ, kèm buồn nôn, sợ ánh sáng và tiếng ồn, có tiền triệu thị giác thoáng qua khoảng 20 phút trước đau và hồi phục hoàn toàn, khám thần kinh bình thường, có tiền sử gia đình phù hợp đau nửa đầu có aura (migraine có tiền triệu thị giác), thường không cần chẩn đoán hình ảnh. Aura thị giác cần phân biệt với cơn thiếu máu não thoáng qua hoặc co giật cục bộ: ở đây aura là chớp sáng dương tính lan trong khoảng 20 phút rồi hết, nối tiếp bằng đau đầu và không có triệu chứng yếu liệt, nói khó, nên phù hợp aura migraine hơn. Đau đầu thứ phát ít gợi ý vì không đau đột ngột dữ dội, không sốt, cứng gáy, không đau tăng khi ho, không dấu thần kinh khu trú, không phù gai thị, khởi phát ở tuổi 33. Cần hỏi kỹ dấu hiệu cảnh báo và tránh dùng thuốc có estrogen khi có aura; đồng thời tránh lạm dụng thuốc giảm đau hằng ngày. Theo các khóa YHCT của ca, bệnh danh Thiên đầu thống, bát cương Lý–Thực–Nhiệt, thể Can dương thượng cang; pháp bình can tiềm dương, tức phong chỉ thống, phối hợp với điều trị cắt cơn và dự phòng theo y học hiện đại.","sinh_ly_benh":"Aura thị giác liên quan đến sóng khử cực lan lan truyền chậm trên vỏ não vùng chẩm, sau đó hoạt hóa hệ thần kinh tam thoa mạch máu, giải phóng các peptid như CGRP gây viêm thần kinh và giãn mạch màng não, tạo cơn đau mạch đập, buồn nôn và nhạy cảm với ánh sáng. Căng thẳng, thiếu ngủ, thực phẩm và biến động nội tiết trước kỳ kinh là các yếu tố khởi phát. Theo YHCT, Can dương thượng cang làm dương khí bốc lên đầu, kèm tình chí uất kết, gây đau đầu từng cơn, mắt đỏ và cáu gắt.","tien_luong":"Gần: các cơn thường đáp ứng khi dùng thuốc cắt cơn sớm đúng chỉ định và tránh yếu tố khởi phát. Xa: bệnh mạn tính dao động; đau nửa đầu có aura liên quan đến tăng nhẹ nguy cơ đột quỵ thiếu máu não, nhất là khi phối hợp thuốc tránh thai chứa estrogen và hút thuốc. Theo YHCT, đánh giá lại tình chí, giấc ngủ và tần suất cơn sau điều trị.","du_phong":"Ghi nhật ký đau đầu, tránh yếu tố khởi phát như thiếu ngủ, rượu, thực phẩm cay nóng, duy trì giờ ngủ đều. Dùng thuốc cắt cơn đúng chỉ định, tránh lạm dụng thuốc giảm đau hằng ngày; trao đổi với bác sĩ trước khi dùng thuốc tránh thai chứa estrogen. Đến cấp cứu ngay khi đau dữ dội đột ngột, yếu liệt, nói khó, sốt cứng gáy hoặc co giật. Châm cứu hoặc thuốc YHCT chỉ hỗ trợ theo chỉ định."},"nguon":["International Headache Society, The International Classification of Headache Disorders, 3rd edition (ICHD-3), 2018.","American Headache Society, The American Headache Society Position Statement on Integrating New Migraine Treatments Into Clinical Practice, 2021.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"di-chung-tai-bien-khi-hu-huyet-u","title":"Liệt nửa người phải sau nhồi máu não 6 tuần","kind":"Thần kinh","level":"Khó","group":"cxk","place":"Phòng châm cứu","clock":"08:15","name":"Ông Đặng Văn Hòa","age":67,"sex":"nam","intro":"Ông được xuất viện sau nhồi máu não 6 tuần trước. Ông được người nhà đưa đến để châm cứu phục hồi vì yếu liệt nửa người phải, đi lại khó.","vitals":{"hr":78,"sbp":150,"dbp":90,"rr":18,"t":36.6,"spo2":97},"ask":[["Đợt đột quỵ xảy ra khi nào, điều trị thế nào?","Cách đây 6 tuần, đột ngột yếu tay chân phải, nói khó, nhập viện, chẩn đoán nhồi máu não, được điều trị nội khoa, ra viện sau 10 ngày.","e"],["Hiện nay yếu liệt ra sao?","Tay phải yếu nhiều, nhấc lên ngang vai khó, nắm tay yếu. Chân phải kéo lê khi đi, phải chống gậy.","e"],["Có đau đầu dữ dội, yếu nặng thêm đột ngột, nói khó hơn, nhìn đôi không?","Không có đợt nặng thêm nào từ khi ra viện. Nói đã rõ hơn, hơi chậm.","e"],["Có sặc khi ăn uống không?","Thỉnh thoảng sặc khi uống nước loãng.","e"],["Đang dùng thuốc gì, có tuân thủ không?","Uống thuốc chống kết tập tiểu cầu, statin và thuốc hạ áp theo toa bác sĩ, uống đều.","e"],["Tiền sử bệnh?","Tăng huyết áp 10 năm, rối loạn mỡ máu. Không đái tháo đường, không rung nhĩ biết trước.","e"],["Người có sợ lạnh, tay chân lạnh, mệt mỏi, khó thở khi gắng sức không?","Mệt mỏi, hay đoản hơi, tay chân phải lạnh, sợ lạnh, ra mồ hôi tự nhiên.","e"],["Tinh thần, giấc ngủ?","Hay buồn, chán nản, ngủ kém.","n"],["Ăn uống, đại tiểu tiện?","Ăn kém, táo bón, tiểu bình thường.","n"],["Có đau, sưng chân phải không?","Chân phải hơi phù nhẹ ở cổ chân, không đau.","n"]],"exam":[["V","Thần sắc, tư thế, dáng đi","Tinh thần tỉnh nhưng mệt, sắc mặt nhợt. Miệng hơi méo nhẹ sang trái, đi chống gậy, bước chân phải lê, tay phải gập co nhẹ.","e"],["V","Lưỡi","Chất lưỡi tím nhạt, có điểm ứ huyết, bệu, rêu trắng mỏng. Lưỡi lệch nhẹ sang phải.","e"],["M","Giọng nói, hơi thở","Tiếng nói yếu, hơi chậm, phát âm hơi nhão. Hơi thở ngắn.","n"],["T","Mạch","Mạch tế sáp, trầm nhược.","e"],["T","Sờ chi bên liệt","Tay chân phải lạnh hơn bên trái, cổ chân phải phù nhẹ không đau.","n"],["K","Cơ lực chi bên liệt","Cơ lực tay phải 3/5, chân phải 3+/5. Trương lực tăng nhẹ kiểu co cứng ở tay, phản xạ gân xương tăng bên phải, Babinski dương tính phải.","e"],["K","Huyết áp và tim mạch","Huyết áp 150/90 mmHg, nhịp tim đều 78 lần mỗi phút, không âm thổi.","e"],["K","Khám khớp vai bên liệt, nuốt","Khớp vai phải hơi trễ, không đau khi vận động nhẹ. Nghiệm pháp nuốt nước: sặc nhẹ.","e"]],"tests":[["CT hoặc MRI sọ não",30,"Ổ nhồi máu cũ vùng nhân bèo hạch nền và bao trong trái, không có chảy máu hay ổ nhồi máu mới.","e"],["Điện tâm đồ",5,"Nhịp xoang, không rung nhĩ.","e"],["Siêu âm Doppler động mạch cảnh và đốt sống",20,"Mảng xơ vữa động mạch cảnh trong hai bên, hẹp dưới 50 phần trăm.","n"],["Lipid máu, đường huyết, chức năng thận",30,"LDL-C 3,2 mmol/L, đường huyết bình thường, chức năng thận bình thường.","n"],["Chọc dò dịch não tủy",30,"Không có chỉ định ở ca này.","w"]],"opt":{"ydx":["+Di chứng liệt nửa người phải sau nhồi máu não, giai đoạn phục hồi","Tái phát đột quỵ cấp","Xuất huyết não","Hội chứng tủy cổ","Bệnh lý rễ thần kinh"],"bd":["+Bán thân bất toại (di chứng trúng phong)","Chứng nuy","Hạc tất phong","Huyễn vựng","Cảnh tý"],"bc":["+Lý – Hư kiêm Thực – Không hàn không nhiệt rõ","Biểu – Thực – Hàn","Lý – Thực – Nhiệt","Lý – Hư – Nhiệt","Biểu – Hư – Nhiệt"],"the":["+Khí hư huyết ứ","Phong đàm trở lạc","Can dương thượng cang","Can thận âm hư","Thấp nhiệt"],"phap":["+Bổ khí, hoạt huyết, thông kinh hoạt lạc","Bình can tiềm dương","Hóa đàm khai khiếu","Tư bổ can thận âm","Thanh nhiệt giải độc"],"phuong":["+Bổ dương hoàn ngũ thang","Thiên ma câu đằng ẩm","Địa hoàng ẩm tử","Trấn can tức phong thang","Độc hoạt tang ký sinh thang"],"huyet":["+Kiên ngung","+Khúc trì","+Hợp cốc","+Hoàn khiêu","+Dương lăng tuyền","+Túc tam lý","Nhân trung","Thập tuyên","Thần môn","Thiên khu"]},"actions":["+Hỏi và đo đạc dấu hiệu đột quỵ tái phát hoặc nặng thêm (đột ngột yếu thêm, đau đầu dữ dội, nói khó, nhìn đôi)|3|Phải đưa đi cấp cứu ngay nếu có, không châm.","+Kiểm tra huyết áp trước khi châm, nếu từ 180/110 mmHg trở lên thì hoãn châm và xử trí tăng huyết áp|3|Tránh làm tăng biến cố mạch máu não.","+Châm Kiên ngung, Khúc trì, Hợp cốc (Đại trường), Hoàn khiêu, Dương lăng tuyền (Đởm), Túc tam lý (Vị) bên liệt, kèm điện châm cường độ nhẹ|30|Bổ khí hoạt huyết, thông kinh lạc bên liệt.","+Phối hợp phục hồi chức năng: vận động trị liệu, ngôn ngữ trị liệu, đánh giá nuốt|10|Châm cứu là điều trị hỗ trợ.","+Dặn tiếp tục thuốc chống kết tập tiểu cầu, statin, hạ áp theo toa, kiểm soát huyết áp, tái khám chuyên khoa thần kinh|3|Dự phòng thứ phát.","+Hướng dẫn tư thế đặt khớp vai bên liệt, chống đỡ vai, đánh giá phòng ngừa huyết khối tĩnh mạch sâu|4|Giảm biến chứng vai trễ, huyết khối.","-Chọc dò dịch não tủy|30|Không có chỉ định.","!Ngừng thuốc chống kết tập tiểu cầu và hạ áp để thay bằng thuốc YHCT hoạt huyết mạnh|3|Tăng nguy cơ tái phát đột quỵ.","!Châm kích thích mạnh, điện châm cường độ cao khi huyết áp chưa kiểm soát|5|Nguy cơ tăng huyết áp, biến cố mạch máu não.","!Kéo giật mạnh khớp vai bên liệt khi tập thụ động|3|Gây tổn thương, đau vai bên liệt."],"teach":"Giai đoạn phục hồi sau nhồi máu não: ổn định, không có dấu hiệu thần kinh mới, cần đánh giá nuốt, huyết áp, vai bên liệt, huyết khối tĩnh mạch sâu. Thể khí hư huyết ứ: mệt, đoản hơi, lưỡi tím nhạt có điểm ứ, mạch tế sáp, dùng Bổ dương hoàn ngũ thang. Châm cứu chỉ hỗ trợ phục hồi chức năng và không thay thế thuốc dự phòng thứ phát bằng YHHĐ.","hbu":{"tien_su":"Tăng huyết áp 10 năm, rối loạn mỡ máu; không đái tháo đường, chưa biết rung nhĩ. Nhồi máu não cách đây 6 tuần, điều trị nội khoa, ra viện sau 10 ngày. Đang uống thuốc chống kết tập tiểu cầu, statin và thuốc hạ áp đều theo toa. Chưa có dữ kiện về tiền sử gia đình, hút thuốc, rượu và dị ứng thuốc.","luoc_qua_co_quan":"Thần kinh có yếu tay chân phải, tay phải yếu nhiều khó nhấc ngang vai, nắm tay yếu, chân phải kéo lê phải chống gậy; nói đã rõ hơn nhưng hơi chậm, miệng hơi méo, không đau đầu dữ dội, không nhìn đôi, không nặng thêm đột ngột từ khi ra viện. Hô hấp và tiêu hóa thỉnh thoảng sặc khi uống nước loãng, ăn kém, táo bón; hơi đoản hơi khi gắng sức. Tuần hoàn chân phải hơi phù nhẹ ở cổ chân, không đau. Tâm thần hay buồn, chán nản, ngủ kém. Theo YHCT, mệt mỏi, tay chân phải lạnh, sợ lạnh, ra mồ hôi tự nhiên.","tom_tat":"Nam 67 tuổi, tăng huyết áp 10 năm và rối loạn mỡ máu, nhồi máu não 6 tuần trước, ra viện sau 10 ngày, hiện yếu nửa người phải, đi chống gậy kéo lê chân phải, nói chậm, thỉnh thoảng sặc nước loãng, mệt, đoản hơi, ngủ kém, hay buồn. Khám cơ lực tay phải 3/5, chân phải 3+/5, tăng trương lực co cứng nhẹ ở tay, phản xạ gân xương tăng và Babinski dương tính bên phải, miệng hơi méo, lưỡi lệch nhẹ, nghiệm pháp nuốt nước sặc nhẹ, huyết áp 150/90 mmHg, nhịp đều, cổ chân phải phù nhẹ không đau. Hình ảnh sọ não là ổ nhồi máu cũ nhân bèo hạch nền và bao trong trái, không chảy máu hay nhồi máu mới; điện tâm đồ nhịp xoang; siêu âm Doppler thấy mảng xơ vữa động mạch cảnh trong hai bên hẹp dưới 50%; LDL-C 3,2 mmol/L. Theo YHCT, sắc mặt nhợt, lưỡi tím nhạt có điểm ứ huyết bệu, mạch tế sáp trầm nhược.","dat_van_de":"Liệt nửa người phải kèm co cứng nhẹ ở giai đoạn phục hồi sau nhồi máu não 6 tuần, có rối loạn nuốt nhẹ, huyết áp chưa tối ưu, mảng xơ vữa động mạch cảnh, và các yếu tố nguy cơ tái phát. Có phù nhẹ chân bên liệt và nguy cơ biến chứng bên liệt. Chứng trạng YHCT gồm mệt, đoản hơi, tay chân bên liệt lạnh, lưỡi tím nhạt có điểm ứ, mạch tế sáp.","bien_luan":"Liệt nửa người phải với tăng phản xạ, Babinski dương tính ở bệnh nhân có tăng huyết áp, rối loạn mỡ máu, mảng xơ vữa động mạch cảnh và hình ảnh ổ nhồi máu cũ nhân bèo hạch nền và bao trong trái phù hợp di chứng liệt nửa người sau nhồi máu não, giai đoạn phục hồi, ổn định, không có dấu hiệu thần kinh mới. Đột quỵ tái phát ít gợi ý vì không nặng thêm đột ngột và hình ảnh không có nhồi máu mới hay chảy máu; rung nhĩ chưa được ghi nhận trên điện tâm đồ nhưng cần theo dõi nhịp nếu nguyên nhân đột quỵ chưa rõ. Cần đánh giá nuốt vì sặc nước loãng làm tăng nguy cơ viêm phổi hít, kiểm soát huyết áp, chăm sóc khớp vai bên liệt và dự phòng huyết khối tĩnh mạch sâu; phù nhẹ cổ chân bên liệt không đau cần theo dõi và nghĩ đến huyết khối tĩnh mạch sâu nếu phù tăng hoặc đau. Cần tiếp tục thuốc dự phòng thứ phát và phục hồi chức năng; kiểm tra huyết áp trước khi châm. Theo các khóa YHCT của ca, bệnh danh Bán thân bất toại (di chứng trúng phong), bát cương Lý–Hư kiêm Thực, không hàn không nhiệt rõ, thể Khí hư huyết ứ; pháp bổ khí, hoạt huyết, thông kinh hoạt lạc, chỉ hỗ trợ phục hồi chức năng và không thay thế thuốc dự phòng thứ phát.","sinh_ly_benh":"Nhồi máu vùng nhân bèo hạch nền và bao trong làm tổn thương đường vận động đi xuống, gây liệt nửa người đối bên; về sau mất ức chế từ vỏ não làm tăng trương lực co cứng và phản xạ gân xương tăng. Tăng huyết áp, rối loạn mỡ máu và xơ vữa mạch là cơ chế nền. Tính dẻo thần kinh trong vài tháng đầu cho phép phục hồi nếu tập luyện sớm và đều. Theo YHCT, khí hư làm huyết hành kém, huyết ứ trở trệ kinh lạc nên chi bên liệt mất nuôi dưỡng, yếu và lạnh.","tien_luong":"Gần: giai đoạn phục hồi, phần lớn cải thiện xảy ra trong vài tháng đầu nếu tập phục hồi chức năng đều đặn; có nguy cơ biến chứng như sặc, viêm phổi hít, đau vai bên liệt, huyết khối tĩnh mạch sâu. Xa: có thể còn di chứng vận động; nguy cơ đột quỵ tái phát nếu huyết áp, lipid máu chưa kiểm soát. Theo YHCT, đánh giá lại khí lực, lưỡi mạch và chức năng vận động sau điều trị.","du_phong":"Tiếp tục thuốc chống kết tập tiểu cầu, statin, hạ áp theo toa, kiểm soát huyết áp và lipid máu, tái khám chuyên khoa thần kinh. Phối hợp vận động trị liệu, ngôn ngữ trị liệu, đánh giá nuốt; hướng dẫn tư thế đặt và chống đỡ khớp vai bên liệt, theo dõi phù chân. Đến cấp cứu ngay khi yếu liệt nặng thêm đột ngột, đau đầu dữ dội, nói khó hoặc nhìn đôi. Kiểm tra huyết áp trước khi châm, hoãn châm nếu từ 180/110 mmHg trở lên; châm cứu chỉ hỗ trợ phục hồi."},"nguon":["American Heart Association and American Stroke Association, Guidelines for Adult Stroke Rehabilitation and Recovery, 2016.","American Heart Association and American Stroke Association, Guideline for the Prevention of Stroke in Patients With Stroke and Transient Ischemic Attack, 2021.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"noi-tieu-hoa-001","title":"Đau bụng tái diễn kèm thay đổi thói quen đi tiêu","kind":"Nội","level":"Dễ","group":"noi","name":"Người bệnh mô phỏng N01","age":24,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Tại phòng khám Nội, người bệnh đến vì đau bụng và đi tiêu thất thường trong 8 tháng.","vitals":{"hr":76,"sbp":112,"dbp":72,"rr":16,"t":36.7,"spo2":99},"ask":[["Đau ở đâu và liên quan thế nào với đi tiêu?","Đau quanh rốn và bụng dưới, thường giảm sau đi tiêu.","e"],["Phân và số lần đi tiêu thay đổi ra sao?","Có tuần đi phân cứng cách ngày, có tuần đi phân mềm 2–3 lần/ngày; thường cảm giác đi chưa hết.","e"],["Có đầy bụng hoặc đau tăng sau ăn không?","Đầy bụng, đôi khi đau tăng sau bữa ăn.","e"],["Có đi cầu máu, sụt cân, sốt hoặc tiêu chảy đánh thức ban đêm không?","Không có các biểu hiện này; cân nặng ổn định.","e"],["Gia đình có ung thư đại trực tràng hoặc bệnh viêm ruột không?","Không ghi nhận ở người thân bậc một.","e"],["Triệu chứng liên quan căng thẳng hoặc kỳ kinh thế nào?","Thường tăng khi căng thẳng; không có mối liên quan rõ với kỳ kinh.","n"],["Đã dùng thuốc, kháng sinh hoặc thực phẩm bổ sung nào?","Chưa dùng thuốc thường xuyên, không dùng kháng sinh gần đây.","e"]],"exam":[["K","Toàn trạng","Tỉnh, thể trạng ổn định, không xanh xao hoặc mất nước.","e"],["K","Khám bụng","Bụng mềm, không phản ứng phúc mạc, không sờ thấy khối.","e"],["K","Tim và phổi","Tim đều, phổi không ran.","n"],["K","Đánh giá dấu báo động","Không hạch ngoại vi bất thường, không ghi nhận sụt cân qua các lần khám.","e"]],"tests":[["Công thức máu",10,"Hemoglobin 13,1 g/dL; bạch cầu 6,4 G/L; tiểu cầu 258 G/L.","e"],["CRP",10,"CRP 1,2 mg/L; giới hạn tham chiếu của phòng xét nghiệm dưới 5 mg/L.","e"],["Kháng thể tTG-IgA và IgA toàn phần",10,"tTG-IgA âm tính; IgA toàn phần trong giới hạn tham chiếu.","e"],["CT bụng thường quy để xác nhận hội chứng ruột kích thích",40,"Không thực hiện: chưa có dữ kiện đặt ra chỉ định trong tình huống này.","w"]],"opt":{"ydx":["+Hội chứng ruột kích thích","Bệnh Crohn","Ung thư đại trực tràng","Viêm ruột nhiễm khuẩn cấp"],"uu_tien":["+Kiểm tra dấu báo động và giải thích chẩn đoán dựa trên triệu chứng phù hợp","Chỉ định CT bụng cho mọi lần tái phát","Cho kháng sinh kéo dài dù chưa có bằng chứng nhiễm khuẩn","Khẳng định không bao giờ cần khám lại"],"sinh_ly_benh":["+Rối loạn tương tác ruột–não và tăng nhạy cảm nội tạng có thể góp phần gây triệu chứng","Luôn do loét đại tràng","Luôn do nhiễm khuẩn cần kháng sinh","Luôn do tắc ruột cơ học"]},"actions":["+Giải thích bệnh và thống nhất kế hoạch theo dõi|2|Giúp người bệnh hiểu triệu chứng và nhận biết khi nào cần đánh giá lại.","+Ghi nhật ký triệu chứng, bữa ăn và dạng phân|2|Hỗ trợ nhận diện yếu tố làm triệu chứng tăng.","+Điều chỉnh chế độ ăn và thuốc theo triệu chứng nổi trội|2|Không áp dụng cùng một biện pháp cho mọi kiểu rối loạn đi tiêu.","!Chỉ định nội soi định kỳ bất kể triệu chứng và dấu báo động|0|Không phải chiến lược thường quy cho tình huống đang mô tả."],"teach":"Đau bụng liên quan đi tiêu và thay đổi dạng phân cần được đánh giá cùng dấu báo động. Chẩn đoán phù hợp không đồng nghĩa bỏ theo dõi khi xuất hiện triệu chứng mới.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N01, nữ, 24 tuổi, sinh viên; khám ngoại trú lần đầu, không sử dụng thông tin định danh thật.","ly_do_vao_vien":"Đau bụng tái diễn và đi tiêu thất thường.","benh_su":"Triệu chứng kéo dài 8 tháng, đau bụng vài ngày mỗi tuần, thường giảm sau đi tiêu; kèm đầy bụng, thay đổi độ cứng của phân và cảm giác đi chưa hết. Không đi cầu máu, sốt, sụt cân hoặc tiêu chảy ban đêm.","tien_su":"Không ghi nhận bệnh mạn tính, phẫu thuật bụng hoặc tiền sử gia đình liên quan; chưa dùng thuốc thường xuyên.","luoc_qua_co_quan":"Không đau ngực, khó thở, tiểu buốt hoặc triệu chứng thần kinh mới.","kham_hien_tai":"Sinh hiệu ổn định; bụng mềm, không khối và không phản ứng phúc mạc.","can_lam_sang":"Công thức máu và CRP không bất thường; xét nghiệm sàng lọc bệnh celiac âm tính trong bối cảnh IgA toàn phần bình thường.","tom_tat":"Nữ 24 tuổi có triệu chứng tiêu hóa mạn tính liên quan đi tiêu, thay đổi dạng phân, không dấu báo động và chưa có bằng chứng viêm.","dat_van_de":"Đau bụng mạn tính liên quan đi tiêu; thay đổi thói quen đại tiện; đánh giá dấu báo động.","chan_doan_so_bo":"Hội chứng ruột kích thích.","bien_luan":"Kiểu triệu chứng phù hợp với rối loạn chức năng ruột. Không có dấu báo động và các xét nghiệm ban đầu không gợi ý thiếu máu hoặc viêm; vẫn cần đánh giá lại nếu diễn tiến thay đổi.","sinh_ly_benh":"Tương tác ruột–não, vận động ruột và cảm nhận đau nội tạng có thể thay đổi mà không có tổn thương cấu trúc tương ứng.","chan_doan_phan_biet":"Bệnh celiac, bệnh viêm ruột, tác dụng thuốc và bệnh phụ khoa tùy diễn tiến.","chan_doan_xac_dinh":"Hội chứng ruột kích thích trong tình huống mô phỏng.","dieu_tri":"Giải thích bệnh, điều chỉnh lối sống và chế độ ăn; lựa chọn thuốc theo triệu chứng nổi trội sau đánh giá lâm sàng.","tien_luong":"Có thể tái diễn; cần theo dõi tác động lên sinh hoạt.","du_phong":"Hướng dẫn tái khám khi xuất hiện đi cầu máu, sụt cân, sốt hoặc triệu chứng ban đêm."},"nguon":["NICE CG61, Irritable bowel syndrome in adults: diagnosis and management, 2008, cập nhật 2017. https://www.nice.org.uk/guidance/cg61/chapter/Recommendations"],"status":"nhap"},{"id":"noi-tieu-hoa-002","title":"Đau thượng vị tái diễn ở người bệnh có loét tá tràng","kind":"Nội","level":"Dễ","group":"noi","name":"Người bệnh mô phỏng N02","age":37,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh khám Nội vì đau thượng vị tái diễn trong 6 tuần, chưa có dấu xuất huyết.","vitals":{"hr":80,"sbp":118,"dbp":76,"rr":17,"t":36.6,"spo2":98},"ask":[["Đau có tính chất và thời điểm thế nào?","Đau âm ỉ hoặc nóng rát thượng vị, đôi khi lúc đói và ban đêm.","e"],["Có nôn máu hoặc đi phân đen không?","Không nôn máu, phân không đen.","e"],["Có sụt cân, nuốt nghẹn hoặc nôn kéo dài không?","Không có các triệu chứng này.","e"],["Có dùng thuốc giảm đau chống viêm hoặc aspirin không?","Không dùng gần đây.","e"],["Đã điều trị H. pylori hoặc dùng kháng sinh nào chưa?","Chưa điều trị H. pylori; không nhớ đầy đủ các đợt kháng sinh trước đây.","e"],["Có dị ứng thuốc không?","Không ghi nhận dị ứng thuốc.","e"],["Có hút thuốc không?","Hút khoảng 5 điếu/ngày.","n"]],"exam":[["K","Toàn trạng","Tỉnh, da niêm hồng, không dấu mất nước.","e"],["K","Khám bụng","Ấn đau nhẹ thượng vị; bụng mềm, không đề kháng hoặc co cứng.","e"],["K","Tim và phổi","Không ghi nhận bất thường.","n"],["K","Dấu biến chứng","Không dấu giảm tưới máu hoặc phản ứng phúc mạc.","e"]],"tests":[["Nội soi tiêu hóa trên",20,"Ổ loét hành tá tràng 7 mm, đáy sạch, không chảy máu.","e"],["Xét nghiệm urease nhanh từ mẫu sinh thiết dạ dày",10,"Dương tính với H. pylori.","e"],["Công thức máu",10,"Hemoglobin 14,2 g/dL, không thiếu máu.","n"],["CT bụng để xác nhận H. pylori",40,"Không thực hiện: không phù hợp mục đích chẩn đoán H. pylori.","w"]],"opt":{"ydx":["+Loét tá tràng có nhiễm H. pylori, chưa có biến chứng","Viêm tụy cấp","Tắc ruột cơ học","Viêm túi mật cấp"],"uu_tien":["+Điều trị tiệt trừ H. pylori bằng phác đồ phù hợp và lên kế hoạch kiểm tra kết quả","Chỉ giảm đau rồi bỏ theo dõi","Dùng phác đồ clarithromycin kinh nghiệm bất kể kháng thuốc","Mổ cấp cứu dù không có biến chứng"],"kiem_tra_tiet_tru":["+Test hơi thở ure hoặc kháng nguyên phân sau điều trị, với thời gian ngừng thuốc phù hợp","Dùng kháng thể huyết thanh để xác nhận đã tiệt trừ","Chỉ dựa vào hết đau","Kiểm tra ngay ngày cuối dùng kháng sinh"]},"actions":["+Rà tiền sử kháng sinh, dị ứng và khả năng tuân thủ|2|Các yếu tố này ảnh hưởng lựa chọn phác đồ.","+Lựa chọn phác đồ tiệt trừ phù hợp dữ liệu kháng thuốc và hướng dẫn địa phương|2|Không sao chép máy móc một phác đồ cho mọi người bệnh.","+Hẹn kiểm tra tiệt trừ ít nhất 4 tuần sau kháng sinh và ngừng PPI 2 tuần trước xét nghiệm theo hướng dẫn|2|Giảm nguy cơ kết quả âm tính giả.","!Dùng kháng thể H. pylori huyết thanh làm bằng chứng chắc chắn đã khỏi|0|Kháng thể có thể tồn tại sau khi đã tiệt trừ."],"teach":"Loét và nhiễm H. pylori phải được chứng minh bằng dữ kiện phù hợp. Hết triệu chứng không thay thế xét nghiệm xác nhận tiệt trừ.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N02, nam, 37 tuổi, nhân viên văn phòng; khám ngoại trú.","ly_do_vao_vien":"Đau thượng vị tái diễn.","benh_su":"Đau 6 tuần, đôi khi lúc đói hoặc ban đêm; chưa ghi nhận nôn máu, phân đen, nôn kéo dài, nuốt nghẹn hoặc sụt cân.","tien_su":"Chưa điều trị H. pylori; không dùng NSAID gần đây; có hút thuốc; tiền sử kháng sinh cần khai thác bổ sung.","luoc_qua_co_quan":"Không đau ngực, khó thở hoặc rối loạn đại tiện mới.","kham_hien_tai":"Sinh hiệu ổn định, đau nhẹ thượng vị, không dấu viêm phúc mạc.","can_lam_sang":"Nội soi có loét hành tá tràng đáy sạch; urease nhanh dương tính; không thiếu máu.","tom_tat":"Nam 37 tuổi đau thượng vị, nội soi xác nhận loét tá tràng và xét nghiệm xác nhận H. pylori, chưa có dấu biến chứng.","dat_van_de":"Loét tá tràng; nhiễm H. pylori; lựa chọn phác đồ và xác nhận tiệt trừ.","chan_doan_so_bo":"Bệnh loét dạ dày–tá tràng.","bien_luan":"Chẩn đoán xác định dựa trên nội soi và xét nghiệm H. pylori; tính chất đau riêng lẻ không đủ xác định vị trí loét.","sinh_ly_benh":"Viêm niêm mạc liên quan H. pylori làm thay đổi cân bằng giữa yếu tố gây tổn thương và bảo vệ, góp phần hình thành loét.","chan_doan_phan_biet":"Khó tiêu chức năng, trào ngược dạ dày–thực quản và bệnh đường mật.","chan_doan_xac_dinh":"Loét tá tràng có nhiễm H. pylori, chưa có biến chứng.","dieu_tri":"Tiệt trừ H. pylori và điều trị giảm tiết acid; chọn phác đồ theo tiền sử dùng thuốc, khả năng cung ứng và hướng dẫn phù hợp Việt Nam.","tien_luong":"Thường thuận lợi nếu điều trị hiệu quả; tái đánh giá nếu triệu chứng kéo dài.","du_phong":"Ngừng hút thuốc, tránh tự dùng NSAID và kiểm tra tiệt trừ."},"nguon":["ACG Clinical Guideline: Treatment of Helicobacter pylori Infection, 2024; bản tóm lược chính thức của ACG. https://gi.org/journals-publications/ebgi/schoenfeld_sep2024/"],"status":"nhap"},{"id":"noi-tieu-hoa-003","title":"Đau thượng vị cấp lan ra sau lưng","kind":"Nội","level":"Trung bình","group":"noi","name":"Người bệnh mô phỏng N03","age":46,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh đến cấp cứu vì đau thượng vị dữ dội 10 giờ, kèm nôn.","vitals":{"hr":104,"sbp":108,"dbp":68,"rr":22,"t":37.8,"spo2":97},"ask":[["Đau khởi phát và lan thế nào?","Đau thượng vị liên tục, lan ra sau lưng, mức độ 8/10.","e"],["Có nôn, nôn xong có giảm đau không?","Nôn 4 lần, đau không giảm sau nôn.","e"],["Có đau ngực, khó thở hoặc vã mồ hôi không?","Không đau ngực, hơi mệt, không khó thở rõ.","e"],["Có tiền sử sỏi mật hoặc vàng da không?","Chưa ghi nhận sỏi mật; không vàng da trước đợt này.","e"],["Uống rượu bia thế nào?","Uống nhiều năm; gần đây uống lượng lớn trước khi xuất hiện triệu chứng.","e"],["Còn trung tiện và đi tiêu không?","Vẫn trung tiện; lần đi tiêu cuối vào sáng cùng ngày.","e"],["Có bệnh tim, bệnh thận hoặc dùng thuốc mới không?","Chưa ghi nhận bệnh tim, thận; không dùng thuốc mới.","e"]],"exam":[["K","Toàn trạng và tưới máu","Tỉnh, môi hơi khô, đầu chi ấm, thời gian làm đầy mao mạch khoảng 2 giây.","e"],["K","Khám bụng","Ấn đau thượng vị, chướng nhẹ, không co cứng thành bụng.","e"],["K","Tim và phổi","Tim nhanh đều, phổi chưa có ran.","e"],["K","Da và củng mạc","Không vàng da; không bầm quanh rốn hoặc hai hông.","n"]],"tests":[["Lipase máu",10,"Lipase 780 U/L; giới hạn trên của phòng xét nghiệm 60 U/L.","e"],["Chức năng thận, điện giải và công thức máu",10,"Creatinin 94 µmol/L; kali 3,4 mmol/L; hematocrit 45%.","e"],["Siêu âm bụng, xét nghiệm gan mật và triglycerid",15,"Không thấy sỏi túi mật hoặc giãn đường mật; triglycerid 1,9 mmol/L; bilirubin không tăng.","e"],["ECG và troponin độ nhạy cao theo quy trình cấp cứu",3,"ECG không có biến đổi thiếu máu cơ tim; troponin nối tiếp không tăng theo ngưỡng phòng xét nghiệm.","e"],["CT bụng có cản quang thường quy ngay để phân độ mọi ca",40,"Không thực hiện ngay: chẩn đoán đã có dữ kiện phù hợp; đánh giá lại chỉ định theo diễn tiến.","w"]],"opt":{"ydx":["+Viêm tụy cấp; nghĩ nguyên nhân liên quan rượu","Hội chứng ruột kích thích","Viêm bàng quang cấp","Loét tá tràng chưa biến chứng"],"tieu_chuan":["+Có ít nhất hai trong ba: đau phù hợp, men tụy tăng trên ba lần giới hạn trên, hình ảnh phù hợp","Chỉ cần có tiền sử uống rượu","Bắt buộc CT dương tính ở mọi trường hợp","Chỉ cần có nôn"],"uu_tien":["+Điều trị hỗ trợ, theo dõi tưới máu và đánh giá lại nguy cơ suy tạng","Kháng sinh dự phòng cho mọi trường hợp","CT lặp lại hằng ngày bất kể diễn tiến","Cho về ngay vì không vàng da"]},"actions":["++Bù dịch đẳng trương có đánh giá lại theo đáp ứng|2|Tránh cả thiếu dịch và quá tải.","++Giảm đau và theo dõi sinh hiệu, lượng nước tiểu, chức năng thận|2|Phát hiện diễn tiến xấu.","+Đánh giá khả năng ăn đường miệng sớm theo dung nạp|2|Không mặc định nhịn ăn kéo dài.","!Khẳng định mức độ nhẹ ngay khi nhập viện và ngừng theo dõi|0|Phân loại mức độ cần đánh giá suy tạng, biến chứng và diễn tiến."],"teach":"Đau phù hợp và lipase tăng rõ có thể đủ xác định viêm tụy cấp mà chưa cần CT thường quy. Chẩn đoán bệnh, xác định nguyên nhân và đánh giá mức độ nặng là ba nhiệm vụ khác nhau.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N03, nam, 46 tuổi, lao động tự do; tiếp nhận tại cấp cứu.","ly_do_vao_vien":"Đau thượng vị dữ dội kèm nôn.","benh_su":"Đau liên tục 10 giờ, lan sau lưng, nôn nhiều và không giảm đau sau nôn. Chưa có vàng da hoặc xuất huyết tiêu hóa.","tien_su":"Uống rượu kéo dài; chưa ghi nhận sỏi mật, bệnh tim hoặc bệnh thận.","luoc_qua_co_quan":"Không tiểu buốt, không ho; vẫn trung tiện.","kham_hien_tai":"Nhịp tim nhanh, niêm hơi khô, đau thượng vị; chưa có dấu viêm phúc mạc hoặc giảm oxy máu.","can_lam_sang":"Lipase tăng trên ba lần giới hạn trên; siêu âm chưa thấy sỏi; ECG và troponin nối tiếp không gợi ý tổn thương cơ tim trong đánh giá này.","tom_tat":"Nam 46 tuổi đau thượng vị cấp lan lưng, nôn, men tụy tăng rõ; có tiền sử rượu, cần điều trị và theo dõi diễn tiến.","dat_van_de":"Viêm tụy cấp; thiếu dịch có thể có; tìm nguyên nhân; đánh giá suy tạng.","chan_doan_so_bo":"Viêm tụy cấp.","bien_luan":"Dữ kiện đau và men tụy đủ hỗ trợ chẩn đoán. Rượu là hướng nguyên nhân, không phải kết luận chỉ dựa vào một bữa uống.","sinh_ly_benh":"Tổn thương tụy gây viêm; đáp ứng viêm và dịch thoát khỏi lòng mạch có thể ảnh hưởng tuần hoàn và chức năng cơ quan.","chan_doan_phan_biet":"Hội chứng vành cấp, thủng tạng rỗng, bệnh đường mật và thiếu máu ruột tùy dấu hiệu.","chan_doan_xac_dinh":"Viêm tụy cấp; nguyên nhân và mức độ cần tiếp tục đánh giá.","dieu_tri":"Điều trị hỗ trợ, theo dõi sát và đánh giá lại; khảo sát hình ảnh bổ sung khi có chỉ định.","tien_luong":"Phụ thuộc diễn tiến suy tạng và biến chứng.","du_phong":"Can thiệp ngừng rượu, xử lý nguyên nhân được xác định và hẹn theo dõi."},"nguon":["American College of Gastroenterology Guidelines: Management of Acute Pancreatitis, 2024. https://pmc.ncbi.nlm.nih.gov/articles/PMC13221274/"],"status":"nhap"},{"id":"noi-tieu-hoa-004","title":"Nôn máu và phân đen sau dùng thuốc giảm đau","kind":"Nội","level":"Khó","group":"noi","name":"Người bệnh mô phỏng N04","age":68,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh đến cấp cứu vì nôn máu, đi phân đen và choáng khi đứng.","vitals":{"hr":118,"sbp":88,"dbp":54,"rr":24,"t":36.5,"spo2":97},"ask":[["Nôn và phân có đặc điểm gì?","Nôn máu đỏ sẫm hai lần, đi phân đen dính trong một ngày.","e"],["Có ngất, đau ngực hoặc khó thở không?","Chóng mặt nhiều khi đứng, chưa ngất; không đau ngực.","e"],["Có dùng NSAID, aspirin hoặc thuốc chống đông không?","Tự dùng diclofenac khoảng 10 ngày vì đau gối; không dùng chống đông.","e"],["Có tiền sử xơ gan hoặc xuất huyết tiêu hóa không?","Không ghi nhận xơ gan; chưa từng xuất huyết tiêu hóa.","e"],["Lần ăn uống gần nhất và thời điểm chảy máu?","Ăn lần cuối 6 giờ trước; nôn máu lần đầu 3 giờ trước.","e"],["Có dị ứng hoặc bệnh tim, thận không?","Không ghi nhận dị ứng; có tăng huyết áp, chưa ghi nhận suy tim hoặc bệnh thận.","e"]],"exam":[["K","Đường thở và tri giác","Tỉnh nhưng mệt, hiện tự bảo vệ đường thở; cần đánh giá lại nếu nôn máu tiếp.","e"],["K","Tuần hoàn","Da niêm nhợt, chi mát, mạch nhanh, thời gian làm đầy mao mạch 3 giây.","e"],["K","Khám bụng","Đau nhẹ thượng vị, không co cứng hoặc đề kháng.","e"],["K","Đánh giá phân sau giải thích và đồng thuận","Phân đen dạng hắc ín.","e"]],"tests":[["Công thức máu và theo dõi lại",10,"Hemoglobin 7,4 g/dL; tiểu cầu 220 G/L.","e"],["Nhóm máu và xét nghiệm tương hợp",10,"Đã lấy mẫu, chuẩn bị phương án truyền máu theo tình trạng lâm sàng.","e"],["Chức năng thận, điện giải và đông máu",10,"Ure 13 mmol/L; creatinin 96 µmol/L; INR 1,1.","e"],["Nội soi sau hồi sức ban đầu",20,"Loét hành tá tràng có mạch máu lộ, không thấy giãn tĩnh mạch thực quản.","e"],["Xét nghiệm máu ẩn trong phân để xác nhận chảy máu đã rõ",10,"Không thực hiện: đã có nôn máu và phân đen rõ.","w"]],"opt":{"ydx":["+Xuất huyết tiêu hóa trên do loét tá tràng, kèm dấu giảm tưới máu","Hội chứng ruột kích thích","Viêm ruột nhiễm khuẩn không biến chứng","Trĩ không biến chứng"],"uu_tien":["+Đánh giá ABC, hồi sức tuần hoàn và huy động đội nội soi","Đợi nội soi rồi mới thiết lập đường truyền","Cho ăn ngay để giảm đau","Cho về vì SpO2 còn bình thường"],"noi_soi":["+Thực hiện sau hồi sức ban đầu, với mức khẩn phù hợp tình trạng người bệnh","Nội soi trước mọi đánh giá đường thở và tuần hoàn","Hoãn nhiều ngày dù huyết động không ổn","Không cần nội soi vì đã biết có dùng NSAID"]},"actions":["++Thiết lập đường truyền, lấy xét nghiệm và chuẩn bị máu|2|Điều trị cấp cứu không chờ hoàn tất toàn bộ chẩn đoán.","++Quyết định truyền máu theo huyết động, mất máu tiếp diễn và bệnh kèm|2|Không chỉ dựa vào một giá trị hemoglobin.","+Cầm máu nội soi và điều trị sau nội soi theo tổn thương|2|Mạch máu lộ là dấu cần xử trí phù hợp.","!Tiếp tục diclofenac vì đau gối|0|Cần ngừng và rà thuốc làm tăng nguy cơ xuất huyết."],"teach":"SpO2 bình thường không loại trừ giảm tưới máu do mất máu. Phải hồi sức và đánh giá nguy cơ đồng thời với chuẩn bị chẩn đoán, cầm máu.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N04, nữ, 68 tuổi, nghỉ hưu; tiếp nhận tại cấp cứu.","ly_do_vao_vien":"Nôn máu, phân đen và chóng mặt.","benh_su":"Phân đen một ngày, nôn máu hai lần và choáng khi đứng; xuất hiện sau đợt tự dùng diclofenac.","tien_su":"Tăng huyết áp; không ghi nhận xơ gan, xuất huyết trước đây hoặc dùng chống đông.","luoc_qua_co_quan":"Không đau ngực, chưa ngất; chưa có dữ kiện thần kinh khu trú.","kham_hien_tai":"Huyết áp thấp, nhịp tim nhanh, chi mát và da niêm nhợt; bụng không phản ứng phúc mạc.","can_lam_sang":"Thiếu máu; nội soi sau hồi sức xác định loét tá tràng có mạch máu lộ.","tom_tat":"Nữ 68 tuổi xuất huyết tiêu hóa trên rõ, huyết động không ổn, có sử dụng NSAID; cần hồi sức và cầm máu.","dat_van_de":"Chảy máu tiêu hóa cấp; giảm tưới máu; thiếu máu; thuốc liên quan.","chan_doan_so_bo":"Xuất huyết tiêu hóa trên, nghĩ do loét dạ dày–tá tràng.","bien_luan":"Nôn máu và phân đen định hướng nguồn chảy máu trên; nội soi xác định tổn thương, không kết luận nguyên nhân chỉ từ tiền sử thuốc.","sinh_ly_benh":"Mất máu làm giảm thể tích tuần hoàn và khả năng vận chuyển oxy, gây đáp ứng nhịp tim nhanh và giảm tưới máu.","chan_doan_phan_biet":"Xuất huyết do giãn tĩnh mạch, rách Mallory–Weiss, tổn thương dạ dày và tổn thương mạch.","chan_doan_xac_dinh":"Xuất huyết tiêu hóa trên do loét tá tràng có mạch máu lộ.","dieu_tri":"Hồi sức, truyền máu khi phù hợp, cầm máu nội soi và điều trị giảm tiết acid sau nội soi; khảo sát H. pylori.","tien_luong":"Dè dặt ban đầu, theo dõi tái xuất huyết.","du_phong":"Rà thuốc, tránh tự dùng NSAID và xử lý H. pylori nếu được xác nhận."},"nguon":["NICE CG141, Acute upper gastrointestinal bleeding in over 16s: management, 2012, cập nhật 2016. https://www.nice.org.uk/guidance/cg141"],"status":"nhap"},{"id":"noi-tieu-hoa-005","title":"Sốt và đau bụng ở người bệnh xơ gan có cổ trướng","kind":"Nội","level":"Khó","group":"noi","name":"Người bệnh mô phỏng N05","age":59,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh xơ gan có cổ trướng đến viện vì sốt, đau bụng và lượng nước tiểu giảm.","vitals":{"hr":110,"sbp":94,"dbp":60,"rr":22,"t":38.4,"spo2":96},"ask":[["Sốt và đau bụng bắt đầu khi nào?","Sốt một ngày, đau âm ỉ khắp bụng, ăn kém.","e"],["Có tiểu ít hoặc lú lẫn không?","Tiểu ít hơn thường ngày; gia đình chưa ghi nhận lú lẫn.","e"],["Xơ gan do nguyên nhân gì, đã có biến chứng nào?","Xơ gan liên quan viêm gan B; có cổ trướng; chưa từng được chẩn đoán nhiễm trùng dịch báng.","e"],["Đang dùng thuốc gì?","Có thuốc kháng virus và lợi tiểu; cần đối chiếu tên, liều trong đơn.","e"],["Có nôn máu, phân đen hoặc tiêu chảy không?","Không có các triệu chứng này.","e"],["Gần đây có nhập viện hoặc dùng kháng sinh không?","Không nhập viện hoặc dùng kháng sinh trong 3 tháng gần đây.","e"],["Đã tăng cân hoặc bụng to nhanh không?","Bụng to hơn trong một tuần.","n"]],"exam":[["K","Tri giác và tuần hoàn","Tỉnh, mệt, chi hơi mát, không dấu thần kinh khu trú.","e"],["K","Khám bụng","Bụng báng, đau nhẹ lan tỏa, không co cứng hoặc điểm đau khu trú rõ.","e"],["K","Dấu bệnh gan","Củng mạc vàng nhẹ, phù hai cổ chân.","e"],["K","Tim và phổi","Tim nhanh đều, phổi chưa có ran.","e"]],"tests":[["Chọc dịch báng chẩn đoán: đếm tế bào và cấy",20,"Bạch cầu đa nhân trung tính 620 tế bào/mm³; cấy đang chờ.","e"],["Chức năng thận, điện giải và xét nghiệm gan",10,"Creatinin 142 µmol/L, so với 88 µmol/L một tuần trước; natri 130 mmol/L; bilirubin 62 µmol/L.","e"],["Cấy máu trước kháng sinh nếu không làm chậm điều trị",10,"Đã lấy mẫu; kết quả đang chờ.","e"],["Siêu âm bụng",15,"Gan hình thái xơ, có dịch báng; chưa ghi nhận bất thường khu trú giải thích đau.","e"],["Chờ cấy dịch báng dương tính mới điều trị",10,"Không phù hợp: kết quả tế bào và bệnh cảnh đã đặt ra chỉ định điều trị.","w"]],"opt":{"ydx":["+Nhiễm trùng dịch báng tự phát trên nền xơ gan; kèm tổn thương thận cấp cần đánh giá","Hội chứng ruột kích thích","Viêm dạ dày đơn thuần","Cổ trướng ổn định không có biến chứng"],"uu_tien":["+Điều trị kháng sinh sớm sau lấy mẫu phù hợp và theo dõi huyết động, chức năng thận","Chờ cấy dương tính dù người bệnh đang xấu đi","Tăng lợi tiểu ngay vì bụng còn báng","Cho xuất viện vì bụng không co cứng"],"phan_biet":["+Tiếp tục đánh giá viêm phúc mạc thứ phát khi có dấu gợi ý hoặc đáp ứng điều trị kém","Loại trừ mọi nguyên nhân ngoại khoa chỉ vì không co cứng","Khẳng định hội chứng gan–thận ngay từ một xét nghiệm creatinin","Khẳng định nhiễm trùng dịch báng không thể xảy ra nếu chưa từng mắc"]},"actions":["++Khởi trị kháng sinh theo bối cảnh nhiễm trùng và dữ liệu kháng thuốc địa phương|2|Không chờ cấy khi đã có chỉ định.","++Đánh giá sử dụng albumin theo hướng dẫn và nguy cơ thận|2|Cần phối hợp theo dõi đáp ứng và nguy cơ quá tải.","+Rà lợi tiểu, thuốc ảnh hưởng thận và nguyên nhân tổn thương thận cấp|2|Không mặc định mọi tăng creatinin là hội chứng gan–thận.","!Tự tăng lợi tiểu trong khi huyết áp thấp và chức năng thận xấu đi|0|Có thể làm giảm thể tích tuần hoàn hiệu dụng."],"teach":"Ở người bệnh xơ gan có cổ trướng, sốt hoặc suy thận cần nghĩ đến nhiễm trùng dịch báng. Tổn thương thận phải được đánh giá nguyên nhân trước khi kết luận hội chứng gan–thận.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N05, nam, 59 tuổi, buôn bán; nhập cấp cứu.","ly_do_vao_vien":"Sốt và đau bụng trên nền cổ trướng.","benh_su":"Sốt một ngày, đau bụng lan tỏa, ăn kém và tiểu ít; bụng tăng kích thước trong tuần trước.","tien_su":"Xơ gan liên quan viêm gan B, đang điều trị; cổ trướng, chưa có đợt nhiễm trùng dịch báng được ghi nhận.","luoc_qua_co_quan":"Không xuất huyết tiêu hóa; chưa lú lẫn; chưa có triệu chứng hô hấp rõ.","kham_hien_tai":"Sốt, nhịp tim nhanh, huyết áp thấp tương đối; bụng báng đau lan tỏa, vàng mắt nhẹ và phù chân.","can_lam_sang":"PMN dịch báng 620 tế bào/mm³; creatinin tăng so với nền; cấy đang chờ.","tom_tat":"Nam 59 tuổi xơ gan có cổ trướng, sốt và đau bụng, PMN dịch báng tăng, kèm suy giảm chức năng thận cấp.","dat_van_de":"Nhiễm trùng dịch báng; bất ổn tuần hoàn; tổn thương thận cấp; loại trừ ổ nhiễm thứ phát.","chan_doan_so_bo":"Nghi nhiễm trùng dịch báng tự phát.","bien_luan":"PMN dịch báng vượt ngưỡng 250 tế bào/mm³ hỗ trợ chẩn đoán và điều trị khi chưa có bằng chứng nguồn nhiễm trong ổ bụng cần can thiệp.","sinh_ly_benh":"Xơ gan làm tăng tính dễ nhiễm trùng; rối loạn tuần hoàn có thể giảm tưới máu thận, nặng thêm khi có nhiễm trùng.","chan_doan_phan_biet":"Viêm phúc mạc thứ phát, nhiễm trùng khác, giảm thể tích và tổn thương thận do thuốc.","chan_doan_xac_dinh":"Nhiễm trùng dịch báng tự phát trong tình huống mô phỏng; tổn thương thận cấp chưa kết luận cơ chế.","dieu_tri":"Kháng sinh sớm, đánh giá albumin, rà thuốc và theo dõi đáp ứng; khảo sát thêm khi nghi nguồn nhiễm thứ phát.","tien_luong":"Dè dặt do có tổn thương thận.","du_phong":"Sau ổn định, đánh giá dự phòng tái phát và quản lý xơ gan theo chuyên khoa."},"nguon":["AASLD Practice Guidance: Diagnosis, Evaluation, and Management of Ascites, Spontaneous Bacterial Peritonitis and Hepatorenal Syndrome, 2021. DOI: 10.1002/hep.31884. https://onlinelibrary.wiley.com/doi/full/10.1002/hep.31884"],"status":"nhap"},{"id":"noi-tieu-hoa-006","title":"Nóng rát sau xương ức và ợ chua sau ăn","kind":"Nội","level":"Dễ","group":"noi","name":"Người bệnh mô phỏng N06","age":29,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh đến phòng khám vì nóng rát sau xương ức và ợ chua trong 3 tháng.","vitals":{"hr":78,"sbp":116,"dbp":74,"rr":16,"t":36.6,"spo2":99},"ask":[["Cảm giác nóng rát xuất hiện khi nào?","Thường sau bữa ăn lớn hoặc khi nằm ngay sau ăn, khoảng 4 ngày mỗi tuần.","e"],["Có dịch chua trào lên miệng không?","Có vị chua trào lên họng, nhất là buổi tối.","e"],["Có nuốt nghẹn, nuốt đau hoặc sụt cân không?","Không có; cân nặng ổn định.","e"],["Có nôn máu, phân đen hoặc nôn kéo dài không?","Không có.","e"],["Đau có liên quan gắng sức, lan tay hoặc kèm khó thở không?","Không liên quan gắng sức, không lan tay, không khó thở hoặc ngất.","e"],["Có khả năng mang thai hoặc đang dùng thuốc gì không?","Không mang thai, không dùng thuốc thường xuyên.","e"],["Thói quen ăn uống và giờ ngủ thế nào?","Thường ăn tối muộn, uống cà phê và nằm trong vòng 30 phút sau ăn.","n"]],"exam":[["K","Toàn trạng","Tỉnh, không xanh xao, không dấu mất nước.","e"],["K","Tim và phổi","Tim đều, không âm thổi; phổi không ran.","e"],["K","Khám bụng","Bụng mềm, không điểm đau khu trú, không phản ứng phúc mạc.","e"],["K","Thể trạng","BMI 27,0 kg/m², số liệu giả định phục vụ đánh giá yếu tố liên quan.","n"]],"tests":[["Nội soi tiêu hóa trên thường quy ngay trong lần khám đầu",20,"Chưa thực hiện: chưa có dấu báo động hoặc thất bại điều trị ban đầu.","w"],["Đo pH hoặc pH-trở kháng thực quản thường quy ngay",30,"Chưa thực hiện: dành cho tình huống có chỉ định chuyên khoa, không bắt buộc trong đánh giá ban đầu này.","w"],["Công thức máu",10,"Hemoglobin 13,4 g/dL, không thiếu máu; xét nghiệm có sẵn từ lần khám gần đây.","n"],["CT bụng để xác nhận trào ngược",40,"Không thực hiện: không phù hợp mục tiêu chẩn đoán trong ca này.","w"]],"opt":{"ydx":["+Bệnh trào ngược dạ dày–thực quản, chẩn đoán lâm sàng ban đầu","Viêm tụy cấp","Tắc ruột cơ học","Viêm túi mật cấp"],"uu_tien":["+Đánh giá dấu báo động, điều chỉnh lối sống và điều trị thử phù hợp","Nội soi cấp cứu cho mọi trường hợp ợ chua","Kháng sinh tiệt trừ H. pylori khi chưa có bằng chứng nhiễm","Khẳng định mọi đau ngực đều do trào ngược"],"dau_bao_dong":["+Nuốt nghẹn tiến triển hoặc xuất huyết tiêu hóa cần đánh giá thêm","Ợ chua sau bữa ăn tự nó luôn là dấu ung thư","Cà phê là bằng chứng xác định tổn thương thực quản","Hết đau sau thuốc loại trừ hoàn toàn bệnh tim"]},"actions":["+Tránh nằm ngay sau ăn và điều chỉnh bữa tối|2|Giảm yếu tố thuận lợi gây trào ngược.","+Hướng dẫn giảm cân phù hợp và nhận diện yếu tố kích phát cá nhân|2|Không áp dụng danh sách kiêng khem tuyệt đối cho mọi người.","+Cân nhắc PPI thử trong thời gian phù hợp và hẹn đánh giá lại|2|Đánh giá đáp ứng, cách dùng và chỉ định điều trị tiếp.","!Dùng PPI vô thời hạn mà không đánh giá lại|0|Cần rà chỉ định và mức điều trị cần thiết."],"teach":"Ợ chua và nóng rát điển hình giúp định hướng trào ngược nhưng không thay thế kiểm tra dấu báo động. Nếu đau ngực thay đổi hoặc nghi nguyên nhân tim mạch, phải đánh giá theo tình huống mới.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N06, nữ, 29 tuổi, nhân viên văn phòng; khám ngoại trú, không dùng thông tin định danh thật.","ly_do_vao_vien":"Nóng rát sau xương ức và ợ chua.","benh_su":"Triệu chứng 3 tháng, tăng sau ăn lớn và nằm sớm sau ăn; không nuốt nghẹn, sụt cân, nôn máu hoặc phân đen.","tien_su":"Không ghi nhận bệnh mạn tính, không dùng thuốc thường xuyên; ăn tối muộn.","luoc_qua_co_quan":"Không khó thở, ngất hoặc đau liên quan gắng sức; không rối loạn đại tiện.","kham_hien_tai":"Sinh hiệu ổn định, tim phổi chưa có bất thường, bụng mềm.","can_lam_sang":"Không có xét nghiệm bắt buộc để xác nhận trong lần đánh giá lâm sàng ban đầu này; không thiếu máu trên xét nghiệm có sẵn.","tom_tat":"Nữ 29 tuổi có triệu chứng trào ngược điển hình, chưa có dấu báo động.","dat_van_de":"Triệu chứng trào ngược; yếu tố lối sống; đánh giá dấu báo động và đáp ứng điều trị.","chan_doan_so_bo":"Bệnh trào ngược dạ dày–thực quản.","bien_luan":"Kiểu triệu chứng định hướng trào ngược. Chưa có chỉ định khảo sát xâm lấn ngay; cần đánh giá lại nếu không đáp ứng hoặc xuất hiện dấu báo động.","sinh_ly_benh":"Dịch dạ dày trào lên thực quản có thể gây triệu chứng khi cơ chế chống trào ngược và khả năng làm sạch thực quản không đủ.","chan_doan_phan_biet":"Bệnh tim mạch khi có dấu gợi ý, khó tiêu, rối loạn vận động thực quản và nóng rát chức năng.","chan_doan_xac_dinh":"Chẩn đoán lâm sàng ban đầu: bệnh trào ngược dạ dày–thực quản; chưa phân loại tổn thương nội soi.","dieu_tri":"Điều chỉnh lối sống, cân nhắc điều trị giảm tiết acid và hẹn đánh giá đáp ứng.","tien_luong":"Thường kiểm soát được, có thể tái diễn.","du_phong":"Duy trì thói quen phù hợp; khám lại khi có nuốt nghẹn, xuất huyết hoặc đau ngực bất thường."},"nguon":["NICE CG184, Gastro-oesophageal reflux disease and dyspepsia in adults: investigation and management, 2014, cập nhật 2019. https://www.nice.org.uk/guidance/cg184"],"status":"nhap"},{"id":"noi-tieu-hoa-007","title":"Tiêu chảy sau một đợt dùng kháng sinh","kind":"Nội","level":"Trung bình","group":"noi","name":"Người bệnh mô phỏng N07","age":72,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh nhập khoa Nội vì tiêu chảy nhiều lần sau điều trị nhiễm khuẩn hô hấp bằng kháng sinh.","vitals":{"hr":96,"sbp":112,"dbp":70,"rr":18,"t":37.8,"spo2":97},"ask":[["Đi tiêu bao nhiêu lần, phân có đặc điểm gì?","Phân nước 7 lần/ngày trong 3 ngày, không thấy máu.","e"],["Gần đây dùng kháng sinh hoặc nhập viện không?","Vừa dùng amoxicillin–clavulanate 7 ngày; kết thúc 5 ngày trước.","e"],["Có dùng thuốc nhuận tràng không?","Không dùng.","e"],["Có đau bụng, nôn hoặc bụng chướng tăng không?","Đau quặn nhẹ lan tỏa, không nôn, chưa chướng tăng.","e"],["Uống nước và lượng nước tiểu thế nào?","Uống kém, tiểu ít hơn thường ngày.","e"],["Đã từng nhiễm C. difficile hoặc suy giảm miễn dịch chưa?","Chưa ghi nhận.","e"],["Có người cùng ăn bị tiêu chảy không?","Không ghi nhận.","n"]],"exam":[["K","Toàn trạng và nước","Tỉnh, niêm hơi khô, chưa có dấu giảm tưới máu nặng.","e"],["K","Khám bụng","Bụng mềm, đau nhẹ lan tỏa, không co cứng hoặc chướng rõ.","e"],["K","Đánh giá biến chứng","Chưa có tụt huyết áp, liệt ruột hoặc dấu phúc mạc.","e"],["K","Tim và phổi","Tim đều, phổi không ran.","n"]],"tests":[["Xét nghiệm C. difficile trên mẫu phân lỏng theo thuật toán cơ sở",10,"GDH dương tính và độc tố A/B dương tính.","e"],["Công thức máu",10,"Bạch cầu 12,8 G/L; hemoglobin 12,7 g/dL.","e"],["Chức năng thận và điện giải",10,"Creatinin 108 µmol/L; kali 3,2 mmol/L.","e"],["Xét nghiệm C. difficile lại để chứng minh khỏi sau khi hết tiêu chảy",10,"Không thực hiện thường quy: không dùng xét nghiệm kiểm tra khỏi ở người đã hết triệu chứng.","w"]],"opt":{"ydx":["+Nhiễm Clostridioides difficile có triệu chứng, đợt đầu","Mang C. difficile không triệu chứng","Hội chứng ruột kích thích","Tắc ruột cơ học"],"dieu_tri":["+Fidaxomicin nếu phù hợp và có sẵn; vancomycin đường uống là lựa chọn thay thế chấp nhận được","Vancomycin tĩnh mạch đơn độc thay thế hoàn toàn đường uống","Chỉ dùng thuốc cầm tiêu chảy, không điều trị nguyên nhân","Tiếp tục mọi kháng sinh cũ dù không còn chỉ định"],"danh_gia":["+Theo dõi mất nước, điện giải và dấu diễn tiến tối cấp","Chỉ dựa vào tuổi để kết luận bệnh tối cấp","Xét nghiệm phân dương tính luôn đủ chẩn đoán dù không có triệu chứng","Hết sốt đồng nghĩa không thể tái phát"]},"actions":["+Rà và ngừng kháng sinh không còn cần thiết|2|Giảm tác động bất lợi lên hệ vi sinh.","+Bù nước, điều chỉnh điện giải và theo dõi diễn tiến|2|Tiêu chảy có thể gây thiếu dịch và hạ kali.","+Áp dụng phòng ngừa tiếp xúc, vệ sinh tay và môi trường theo quy trình|2|Hạn chế lây truyền trong cơ sở y tế.","!Làm xét nghiệm kiểm tra khỏi thường quy khi đã hết triệu chứng|0|Kết quả có thể còn dương tính và không phản ánh bệnh đang hoạt động."],"teach":"Cần kết hợp triệu chứng với xét nghiệm phù hợp, không đồng nhất mang vi khuẩn với nhiễm bệnh. Điều trị và kiểm soát lây nhiễm phải đi cùng đánh giá mất nước, biến chứng.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N07, nam, 72 tuổi, nghỉ hưu; nhập khoa Nội.","ly_do_vao_vien":"Tiêu chảy nhiều lần sau dùng kháng sinh.","benh_su":"Tiêu chảy nước 7 lần/ngày trong 3 ngày, đau quặn nhẹ và uống kém; xuất hiện sau một đợt kháng sinh.","tien_su":"Chưa nhiễm C. difficile trước đây; không dùng nhuận tràng.","luoc_qua_co_quan":"Tiểu ít; không khó thở hoặc triệu chứng thần kinh mới.","kham_hien_tai":"Niêm hơi khô, bụng mềm; chưa có tụt huyết áp, liệt ruột hoặc dấu phúc mạc.","can_lam_sang":"GDH và độc tố phân dương tính; hạ kali nhẹ; bạch cầu và creatinin chưa đạt ngưỡng nặng theo phân loại IDSA/SHEA 2017.","tom_tat":"Nam 72 tuổi có tiêu chảy sau kháng sinh, xét nghiệm độc tố phù hợp, kèm thiếu dịch nhẹ và hạ kali.","dat_van_de":"Nhiễm C. difficile; mất nước, điện giải; nguy cơ diễn tiến và tái phát.","chan_doan_so_bo":"Nghi nhiễm C. difficile.","bien_luan":"Có tiêu chảy mới không giải thích bằng nhuận tràng và xét nghiệm độc tố dương tính; không chỉ dựa vào tiền sử kháng sinh.","sinh_ly_benh":"Kháng sinh có thể làm mất cân bằng hệ vi sinh; độc tố C. difficile gây tổn thương và viêm đại tràng.","chan_doan_phan_biet":"Tiêu chảy do thuốc, nhiễm khuẩn đường ruột khác và bệnh viêm ruột.","chan_doan_xac_dinh":"Nhiễm C. difficile đợt đầu, hiện chưa có dấu tối cấp.","dieu_tri":"Điều trị đặc hiệu đường uống phù hợp, bù nước điện giải và kiểm soát lây nhiễm.","tien_luong":"Có thể đáp ứng tốt nhưng người cao tuổi có nguy cơ tái phát.","du_phong":"Sử dụng kháng sinh hợp lý; hướng dẫn tái khám khi tiêu chảy tái diễn."},"nguon":["IDSA/SHEA Clinical Practice Guideline for Clostridium difficile Infection in Adults and Children, bản 2017, công bố 2018. https://www.idsociety.org/practice-guideline/clostridium-difficile/","IDSA/SHEA Focused Update for Management of Clostridioides difficile Infection in Adults, 2021. https://www.idsociety.org/practice-guideline/
