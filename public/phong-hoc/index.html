<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phòng học lâm sàng</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Noto+Serif:wght@600;700&display=swap">
<style>
/* Bố cục: một cột kiểu bệnh án; thanh các mục I–XVI ở trên, mỗi mục là một bước làm trước – đối chiếu sau. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --ink:#14201C; --muted:#5A6B64; --line:#D3DCD7;
  --jade:#17705B; --jade-ink:#FFFFFF; --jade-soft:#DCEEE8;
  --alert:#B3301F; --alert-soft:#F8E1DC; --warn:#A8620A; --warn-soft:#F7E8CF;
  --f-display:'Noto Serif',Georgia,serif; --f-body:'Be Vietnam Pro',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1715; --surface:#15211E; --ink:#E6EFEA; --muted:#8FA39A; --line:#27372F;
  --jade:#4FC3A1; --jade-ink:#06201A; --jade-soft:#1B3A31;
  --alert:#FF7A66; --alert-soft:#3A1E19; --warn:#E5A04A; --warn-soft:#3A2D14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1715; --surface:#15211E; --ink:#E6EFEA; --muted:#8FA39A; --line:#27372F;
  --jade:#4FC3A1; --jade-ink:#06201A; --jade-soft:#1B3A31;
  --alert:#FF7A66; --alert-soft:#3A1E19; --warn:#E5A04A; --warn-soft:#3A2D14; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 40px}
*{box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto}
header.top{padding-block:18px 10px}
.crumb{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-size:26px;line-height:1.2;margin:6px 0 4px;text-wrap:balance}
.demo{display:inline-block;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;margin-top:6px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--jade);color:var(--jade-ink)}
.timer{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-left:auto}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.step{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 11px;font:500 13px var(--f-body);cursor:pointer;text-align:left;min-width:0}
.step small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.step[aria-selected="true"]{border-color:var(--jade);background:var(--jade-soft)}
.step.done small::after{content:" ✓";color:var(--jade)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
main{padding-block:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--f-display);font-size:19px;margin:0}
.code{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.intro{background:var(--jade-soft);border-radius:10px;padding:12px 14px}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.vitals div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.vitals b{display:block;font-size:16px;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.q{border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;padding:10px 12px;font:500 14px var(--f-body);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;width:100%}
.q .a{display:none;font-weight:400;color:var(--muted)}
.q.open{border-color:var(--jade)} .q.open .a{display:block;color:var(--ink)}
.q .tag{font-family:var(--f-mono);font-size:10.5px;color:var(--alert)}
textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:400 14px/1.5 var(--f-body);background:var(--bg);color:var(--ink)}
.btn{border:0;background:var(--jade);color:var(--jade-ink);font:600 14px var(--f-body);padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.model{border-left:3px solid var(--jade);background:var(--jade-soft);padding:12px 14px;border-radius:0 10px 10px 0;white-space:pre-line}
.why,.pit{border-radius:10px;padding:12px 14px}
.why{background:var(--surface);border:1px solid var(--jade)}
.pit{background:var(--warn-soft);color:var(--ink)}
.why h3,.pit h3{margin:0 0 4px;font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--jade)}
.pit h3{color:var(--warn)}
ul.tight{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.opt input{margin-top:4px;accent-color:var(--jade)}
.opt .fb{display:none;font-size:13px;color:var(--muted);margin-top:2px}
.opt.show.ok{border-color:var(--jade);background:var(--jade-soft)} .opt.show.no{border-color:var(--alert);background:var(--alert-soft)} .opt.show.mid{border-color:var(--warn);background:var(--warn-soft)}
.opt.show .fb{display:block}
.score{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td.hi{color:var(--alert);font-weight:600} td.lo{color:var(--warn);font-weight:600}
.tw{overflow-x:auto}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:4px;accent-color:var(--jade)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.lock{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.sum{display:grid;gap:8px}
.sum div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-block:6px;font-size:14px}
.bubble{background:var(--jade-soft);border-radius:4px 14px 14px 14px;padding:12px 14px;max-width:92%}
.bubble .who{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--jade);display:block;margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:400 14.5px var(--f-body);cursor:pointer}
.o b{font-family:var(--f-mono);color:var(--muted);font-weight:600}
.o[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--jade)}
.big{font-family:var(--f-display);font-size:44px;line-height:1}
.pass{color:var(--jade)} .fail{color:var(--alert)}
.sbar{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13.5px}
.sbar .prog{grid-column:1/-1}
.rev{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rev.bad{border-color:var(--alert);background:var(--alert-soft)}
.docsec h3{margin:10px 0 4px;font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--jade)}
.docsec p,.docsec li{margin:0}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="crumb"><a href="/vien-thuc-hanh/" style="color:inherit">‹ HIU TMC · Viện Thực Hành</a></div>
    <h1>Phòng học lâm sàng</h1>
  </header>

  <div class="bar">
    <div class="row">
      <div class="seg" role="group" aria-label="Chế độ"><button id="m-learn" aria-pressed="true" type="button">Học</button><button id="m-exam" aria-pressed="false" type="button">Thi vấn đáp</button></div>
      <span class="timer" id="timer" aria-live="off">Không giới hạn giờ</span>
    </div>
    <div class="steps" id="steps" role="tablist" aria-label="Các mục bệnh án"></div>
  </div>

  <main id="panel"></main>
</div>

<script>
// ---- Ca minh họa (tự soạn để xem giao diện; số liệu giả định) ----
const CASE = {
  intro: "Khoa Nội Tiêu hóa, 22:30. Ông H., 41 tuổi, tài xế, được vợ đưa vào vì đau bụng thượng vị dữ dội 10 giờ.",
  vitals: [["Mạch","98","l/p"],["Huyết áp","120/75","mmHg"],["Nhiệt độ","37.8","°C"],["Nhịp thở","22","l/p"],["SpO₂","97","%"]],
  ask: [
    ["Đau như thế nào, lan đi đâu?","Đau liên tục như dao đâm ở thượng vị, VAS 8/10, lan xuyên ra sau lưng.",1],
    ["Đau khởi phát khi nào, sau việc gì?","Đột ngột, khoảng 5 giờ sau bữa nhậu tối qua.",1],
    ["Tư thế nào đau tăng, tư thế nào đỡ?","Nằm ngửa đau hơn; ngồi cúi người ra trước thì đỡ.",1],
    ["Có nôn không? Nôn xong đau có giảm không?","Nôn 3 lần, thức ăn rồi dịch vàng. Nôn xong đau không giảm.",1],
    ["Còn trung tiện, đi tiêu được không?","Vẫn trung tiện, sáng nay đi tiêu 1 lần, phân vàng.",1],
    ["Uống rượu bia thế nào?","Khoảng 4–5 lon bia, 3 lần mỗi tuần, đã 15 năm. Hút thuốc 1 gói mỗi ngày.",1],
    ["Từng bị sỏi mật, đau bụng, mỡ máu cao chưa?","Chưa từng đi khám tổng quát. Ăn nhiều đồ chiên, nhiều dầu mỡ.",1],
    ["Có đau ngực, khó thở, vã mồ hôi không?","Không đau ngực, không khó thở.",1],
    ["Có sốt, ớn lạnh không?","Thấy ớn lạnh, chưa đo nhiệt độ.",0],
    ["Có chấn thương bụng gần đây không?","Không.",0],
    ["Đang dùng thuốc gì? Có dị ứng không?","Không dùng thuốc thường xuyên, không dị ứng.",0]
  ],
  exam: [
    ["Tổng quát","Tỉnh, nằm co người, vẻ mặt đau. Niêm hồng, củng mạc không vàng. Môi hơi khô.",1],
    ["Tim, phổi","Tim đều, không âm thổi. Phổi trong, không ran.",0],
    ["Bụng – nhìn, nghe","Bụng chướng nhẹ, di động theo nhịp thở. Nhu động ruột giảm, 3 lần/phút.",1],
    ["Bụng – sờ","Ấn đau thượng vị, đề kháng nhẹ vùng thượng vị, không co cứng như gỗ. Gan lách không sờ chạm.",1],
    ["Nghiệm pháp","Murphy (−). Cullen (−). Grey Turner (−).",1],
    ["Thần kinh, tứ chi","Cổ mềm, không dấu thần kinh khu trú. Mạch ngoại vi bắt rõ.",0]
  ],
  tomtat: "BN nam, 41 tuổi, nhập viện vì đau bụng thượng vị dữ dội giờ thứ 10. Đau liên tục, lan ra sau lưng, tăng khi nằm ngửa, giảm khi cúi người ra trước, kèm nôn không giảm đau. Tiền căn uống rượu bia nhiều, ăn nhiều dầu mỡ. Khám: sốt nhẹ 37,8 °C, mạch 98, bụng chướng nhẹ, ấn đau và đề kháng nhẹ thượng vị, các nghiệm pháp Murphy, Cullen, Grey Turner âm tính.",
  dat: "1. Hội chứng đau bụng cấp vùng thượng vị.\n2. Hội chứng viêm nhẹ (sốt nhẹ, mạch nhanh).\n3. Tiền căn: nghiện rượu; nghi rối loạn lipid máu.",
  sobo: [
    ["Viêm tụy cấp, nghĩ do rượu","ok","Đúng hướng: đau thượng vị lan sau lưng, giảm khi cúi người, nôn không giảm đau, rượu."],
    ["Thủng tạng rỗng (loét dạ dày – tá tràng thủng)","mid","Đưa vào chẩn đoán phân biệt, không chọn làm sơ bộ: bụng chưa co cứng, còn nhu động và còn trung tiện."],
    ["Nhồi máu cơ tim thành dưới","mid","Phải loại trừ vì đau thượng vị, nhưng không đau ngực, không khó thở nên ít nghĩ."],
    ["Tắc ruột","no","Ít phù hợp: còn trung tiện, còn đi tiêu, đau lan sau lưng không điển hình cho tắc ruột."],
    ["Viêm túi mật cấp","mid","Phân biệt: Murphy (−), không vàng da, nhưng sỏi mật vẫn là nguyên nhân hay gặp của viêm tụy cấp."]
  ],
  pb: [
    ["Viêm tụy cấp","ok","Chẩn đoán sơ bộ, không ghi lặp lại ở phần phân biệt."],
    ["Thủng tạng rỗng","ok","Phải loại trừ: X-quang bụng đứng tìm liềm hơi."],
    ["Nhồi máu cơ tim thành dưới","ok","Phải loại trừ: ECG và troponin."],
    ["Viêm túi mật cấp, sỏi mật","ok","Siêu âm bụng; cũng là nguyên nhân của viêm tụy."],
    ["Loét dạ dày – tá tràng","ok","Nội soi khi ổn định; tầm soát H. pylori."],
    ["Tắc ruột","ok","Còn trung tiện nên ít nghĩ, vẫn nêu và nói lý do loại trừ."],
    ["Hội chứng ruột kích thích","no","Không phù hợp bệnh cảnh cấp tính, đau dữ dội và có sốt."],
    ["Viêm bàng quang","no","Không có triệu chứng tiết niệu."]
  ],
  bienluan: "Ủng hộ viêm tụy cấp: đau thượng vị cấp, liên tục, lan ra sau lưng; giảm khi cúi người ra trước; nôn nhiều nhưng không giảm đau; tiền căn uống rượu bia nhiều; sốt nhẹ.\nThủng tạng rỗng ít nghĩ: không co cứng thành bụng, còn nhu động ruột, chưa có tiền căn loét. Đề nghị X-quang bụng đứng không sửa soạn.\nNhồi máu cơ tim thành dưới ít nghĩ: không đau ngực, không khó thở. Đề nghị ECG, troponin hs.\nViêm túi mật, sỏi mật ít nghĩ: Murphy (−), không vàng da. Đề nghị siêu âm bụng.\nLoét dạ dày – tá tràng ít nghĩ hơn vì đau lan sau lưng, kiểu giảm khi cúi người. Nội soi khi ổn định.\nTắc ruột ít nghĩ: còn trung tiện, còn đi tiêu.",
  rubricBL: ["Nêu ít nhất 3 yếu tố lâm sàng ủng hộ chẩn đoán sơ bộ","Mỗi chẩn đoán phân biệt đều có lý do nghĩ hoặc không nghĩ","Mỗi chẩn đoán phân biệt đi kèm xét nghiệm để loại trừ","Nêu hướng nguyên nhân (rượu, sỏi mật, tăng triglycerid)"],
  cls: [
    ["Lipase máu","ok","Ưu tiên số một: tăng sớm, đặc hiệu hơn amylase."],
    ["Công thức máu, CRP","ok","Đánh giá phản ứng viêm."],
    ["Glucose, ure, creatinin, ion đồ, calci máu","ok","Thường quy và theo dõi mất nước, rối loạn điện giải, tiên lượng."],
    ["AST, ALT, bilirubin","ok","Gợi ý nguyên nhân do mật và đánh giá gan do rượu."],
    ["Triglycerid máu","ok","Tìm nguyên nhân tăng triglycerid."],
    ["ECG, troponin hs","ok","Loại trừ nhồi máu cơ tim thành dưới."],
    ["X-quang bụng đứng không sửa soạn","ok","Loại trừ thủng tạng rỗng, tắc ruột."],
    ["Siêu âm bụng","ok","Tìm sỏi mật, giãn đường mật, hình ảnh tụy."],
    ["CT bụng có cản quang ngay lúc nhập viện","mid","Chưa bắt buộc nếu chẩn đoán đã rõ. Cân nhắc khi chẩn đoán còn nghi ngờ hoặc nghi biến chứng sau 48–72 giờ."],
    ["Nội soi dạ dày ngay trong cơn đau cấp","no","Không ưu tiên lúc đang đau cấp; làm sau khi ổn định."],
    ["MRI sọ não","no","Không liên quan."]
  ],
  kq: [
    ["Lipase","640","U/L","< 60","hi"],["Amylase","310","U/L","22–80","hi"],["Bạch cầu","13,8","K/μL","4–10","hi"],["CRP","120","mg/L","< 5","hi"],
    ["Glucose","7,8","mmol/L","4,1–5,6","hi"],["Kali","3,3","mmol/L","3,4–4,5","lo"],["Calci toàn phần","2,3","mmol/L","2,2–2,65",""],
    ["Triglycerid","3,1","mmol/L","< 1,7","hi"],["AST / ALT","78 / 42","U/L","< 50","hi"],["Creatinin","86","μmol/L","72–127",""]
  ],
  kqText: "Siêu âm bụng: tụy to, phù nề, không sỏi túi mật, đường mật không giãn. ECG: bình thường. X-quang bụng đứng: không liềm hơi.",
  cd: "Viêm tụy cấp do rượu, mức độ nhẹ (Atlanta 2012): không suy tạng, không biến chứng tại chỗ.\nTiêu chuẩn chẩn đoán (đủ 2 trong 3): đau bụng điển hình; lipase tăng ≥ 3 lần giới hạn trên; hình ảnh phù hợp.\nHướng xử trí tham khảo: bù dịch đẳng trương theo đáp ứng, giảm đau, bù kali, cho ăn đường miệng sớm khi đỡ đau, ngưng rượu, theo dõi suy tạng.",
  tl: "Tiên lượng gần: khá nếu không suy tạng; theo dõi 48–72 giờ vì có thể diễn tiến nặng.\nTiên lượng xa: nguy cơ tái phát nếu tiếp tục uống rượu, hút thuốc, ăn nhiều mỡ; tái phát nhiều lần có thể thành viêm tụy mạn.",
  dp: "Ngưng hoàn toàn rượu bia và thuốc lá.\nKiểm soát triglycerid, giảm ăn mỡ.\nTheo dõi: đau bụng tái lại, nôn, sốt thì khám ngay.\nTái khám định kỳ, tầm soát sỏi mật."
};

const STEPS = [
  { id:"hb", code:"I–V", title:"Hỏi bệnh", type:"ask", items:CASE.ask,
    why:"Tụy nằm sau phúc mạc, trước cột sống. Viêm và phù nề kích thích các sợi thần kinh tạng nên đau thượng vị lan xuyên ra sau lưng. Cúi người ra trước là tư thế kinh điển làm đau dịu bớt, thường giải thích do giảm căng kéo tụy phù nề và phúc mạc sau. Nôn không làm đau giảm vì nguyên nhân đau không nằm ở dạ dày.",
    pit:["Quên hỏi tiền căn rượu bia, sỏi mật và mỡ máu: đây là ba nguyên nhân thường gặp nhất.","Chỉ ghi “đau bụng”, không mô tả vị trí, hướng lan, yếu tố tăng giảm, hoàn cảnh khởi phát.","Không hỏi các triệu chứng âm tính để loại trừ (đau ngực, trung tiện, đại tiện)."] },
  { id:"kham", code:"VI", title:"Khám", type:"ask", items:CASE.exam,
    why:"Bụng chướng và nhu động giảm do viêm lan làm liệt ruột phản ứng. Cullen và Grey Turner dương tính là dấu xuất huyết sau phúc mạc, gặp ở thể nặng nên âm tính không loại trừ viêm tụy cấp. Đề kháng nhẹ khu trú thượng vị khác với co cứng như gỗ của thủng tạng rỗng.",
    pit:["Ghi “bụng mềm” trong khi bệnh nhân đang đau thượng vị và có đề kháng.","Không ghi rõ các nghiệm pháp bắt buộc: Murphy, Cullen, Grey Turner, Mayo-Robson.","Quên đo sinh hiệu và đánh giá mất nước."] },
  { id:"tt", code:"VII–VIII", title:"Tóm tắt, đặt vấn đề", type:"text",
    prompt:"Viết tóm tắt bệnh án (một đoạn) và đặt vấn đề (các hội chứng, triệu chứng chính, tiền căn).", model:CASE.tomtat+"\n\nĐặt vấn đề:\n"+CASE.dat,
    rubric:["Có tuổi, giới và lý do nhập viện kèm thời gian","Nêu đủ triệu chứng cơ năng then chốt (vị trí, lan, giảm khi cúi, nôn)","Nêu triệu chứng thực thể quan trọng, kể cả dấu âm tính có giá trị","Nêu tiền căn liên quan (rượu bia, ăn nhiều mỡ)","Đặt vấn đề theo hội chứng, không chép lại tóm tắt"],
    why:"Tóm tắt là lọc dữ kiện, không phải chép lại bệnh sử. Chỉ giữ những dữ kiện sẽ dùng ở phần biện luận. Đặt vấn đề gom dữ kiện thành hội chứng để dẫn tới chẩn đoán.",
    pit:["Tóm tắt dài như bệnh sử.","Đặt vấn đề bằng tên bệnh thay vì hội chứng.","Bỏ sót tiền căn quan trọng."] },
  { id:"cd", code:"IX–X", title:"Chẩn đoán sơ bộ, phân biệt", type:"pick2",
    why:"Rượu làm tăng co thắt cơ Oddi, làm dịch tụy đặc và tạo nút protein, đồng thời độc trực tiếp lên tế bào tuyến tụy. Calci nội bào tăng làm trypsinogen bị hoạt hóa ngay trong tế bào, tụy tự tiêu hóa và giải phóng các chất gây viêm.",
    pit:["Ghi chẩn đoán sơ bộ trùng với chẩn đoán phân biệt.","Chọn chẩn đoán sơ bộ không bám đúng triệu chứng nổi bật.","Quên các chẩn đoán nguy hiểm cần loại trừ ngay (thủng tạng rỗng, nhồi máu cơ tim thành dưới)."] },
  { id:"bl", code:"XI", title:"Biện luận lâm sàng", type:"text",
    prompt:"Biện luận: vì sao nghĩ chẩn đoán sơ bộ, vì sao nghĩ hoặc không nghĩ từng chẩn đoán phân biệt, đề nghị xét nghiệm tương ứng.", model:CASE.bienluan, rubric:CASE.rubricBL,
    why:"Giám khảo chấm logic: từ dữ kiện ra chẩn đoán, từ chẩn đoán ra xét nghiệm. Mỗi chẩn đoán phân biệt nên có một câu dạng “nghĩ hoặc không nghĩ vì…, đề nghị…”.",
    pit:["Liệt kê chẩn đoán phân biệt mà không nói lý do.","Đề nghị xét nghiệm không gắn với chẩn đoán nào.","Biện luận chẩn đoán không khớp chẩn đoán sơ bộ đã nêu."] },
  { id:"cls", code:"XII–XIII", title:"Đề nghị và kết quả CLS", type:"pick3",
    why:"Lipase tăng sớm (4–8 giờ) và còn cao 8–14 ngày, đặc hiệu hơn amylase. Triglycerid máu rất cao có thể làm amylase thấp giả. Kali giảm do nôn: mất H⁺ và Cl⁻ gây kiềm chuyển hóa, giảm thể tích kích hoạt aldosterone làm tăng thải kali qua thận.",
    pit:["Chỉ đề nghị amylase mà quên lipase.","Gom hết vào một dòng thay vì chia: chẩn đoán, biến chứng, thường quy.","Đọc kết quả mà không nêu ý nghĩa với bệnh nhân."] },
  { id:"kl", code:"XIV–XVI", title:"Chẩn đoán, tiên lượng, dự phòng", type:"final",
    why:"Hạ calci do xà phòng hóa mỡ quanh tụy, SIRS kéo dài và suy tạng quyết định mức nặng theo Atlanta. Vì vậy tiên lượng gần phải nêu rõ cần theo dõi 48–72 giờ chứ không chỉ viết “tốt”.",
    pit:["Tiên lượng chỉ ghi “tốt” hoặc “dè dặt” mà không nêu căn cứ.","Dự phòng chung chung, không nêu yếu tố nguy cơ riêng của bệnh nhân.","Không phân biệt dự phòng tái phát và dự phòng biến chứng."] }
];

// ---- Trạng thái ----
const S = { mode:"learn", cur:0, reveal:{}, submitted:false, seen:{}, text:{}, rub:{}, pick:{}, checked:{}, done:{} };
const $ = (s,r=document)=>r.querySelector(s);
const esc = t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const answersOpen = ()=> S.submitted || (S.mode==="learn" && !!S.reveal[STEPS[S.cur].id]);
let timerId=null, secs=0;

function setMode(m){
  S.mode=m; S.submitted=false;
  $("#m-learn").setAttribute("aria-pressed",m==="learn"); $("#m-exam").setAttribute("aria-pressed",m==="viva");
  clearInterval(timerId); clearInterval(V.timer);
  $("#steps").hidden = m==="viva";
  if(m==="viva"){ $("#timer").textContent="Thi vấn đáp"; return vivaPick(); }
  $("#timer").textContent="Không giới hạn giờ"; V.rank=null; learnList();
}
function learnList(){
  S.view="list"; S.mode="learn"; $("#steps").hidden=true; $("#timer").textContent="Không giới hạn giờ";
  const list=orderedDefs(d=>V.filter==="all"||d.track===V.filter);
  $("#panel").innerHTML=`<section class="card"><div class="code">Chọn bệnh án</div><h2>Học theo bệnh án</h2>${trackChips()}
  <div class="list">${list.map(d=>`<button class="q" data-v="lcase" data-id="${esc(d.id)}" type="button"><span><b>${esc(d.title)}</b></span><span class="a" style="display:block;color:var(--muted);font-size:13px">${esc(TRACKS[d.track])} · ${esc(d.level)}${d.id==="demo"?" · học đủ các mục bệnh án":""}</span></button>`).join("")}</div>
  ${list.length?"":`<div class="lock">Mục này chưa có ca. Ca mới đang được bổ sung.</div>`}
  <a class="btn ghost" href="/tu-chan/" style="text-align:center;text-decoration:none">Học xong? Vào trực ở Viện Thực Hành</a></section>`;
}
function bankStudy(def){
  const c=BANK.find(x=>x.id===def.id), yh=trackOf(c)==="yhct"; S.view="bank"; $("#steps").hidden=true;
  const plus=l=>(l||[]).filter(o=>o[0]==="+"||o[0]==="~").map(o=>o.slice(1));
  const A=c.actions.map(parseAct), by=k=>A.filter(a=>a.k===k);
  const li=(arr)=>arr.map(a=>`<li><b>${esc(a.text)}</b>${a.why?" · "+esc(a.why):""}</li>`).join("");
  const H=c.hbu||{}, EMPTY=`<p class="muted" style="margin:0;font-size:13px">Ca này chưa có phần này.</p>`;
  const P=t=>t?`<p style="margin:0 0 6px">${esc(t)}</p>`:"";
  const sec=(no,name,html)=>`<h3>${no}. ${name}</h3>${html||EMPTY}`;
  const ydxAll=c.opt.ydx||[], dd=plus(ydxAll), diff=ydxAll.filter(o=>o[0]!=="+"&&o[0]!=="~").map(o=>o.replace(/^[+~]/,""));
  const tl=arr=>arr.length?`<ul class="tight">${arr.map(t=>`<li><b>${esc(t[0])}</b>${t[2]?": "+esc(t[2]):""}</li>`).join("")}</ul>`:"";
  const es=c.tests.filter(t=>t[3]!=="w");
  const cdx=`<ul class="tight"><li><b>Tây y:</b> ${esc(dd.join("; "))}</li>${yh?["bd:Bệnh danh","bc:Bát cương","the:Thể bệnh","phap:Pháp","phuong:Phương","huyet:Huyệt"].map(x=>{const[k,n]=x.split(":");const v=plus(c.opt[k]);return v.length?`<li><b>${n}:</b> ${esc(v.join("; "))}</li>`:"";}).join(""):""}</ul>`;
  const dtri=(li(by("++"))+li(by("+")))?`<ul class="tight">${li(by("++"))}${li(by("+"))}</ul>`:"";
  const bad=by("!").length?`<h3>Không nên làm</h3><ul class="tight">${li(by("!"))}</ul>`:"";
  const ans=!S.lreveal?`<button class="btn" data-v="lreveal" type="button">Xem đáp án và bài học</button>`:`<div class="why docsec" style="margin-top:10px"><h3 style="margin-top:0">Phần suy luận và xử trí của bệnh án</h3>
  ${sec("VII","Tóm tắt bệnh án",P(H.tom_tat))}
  ${sec("VIII","Đặt vấn đề",P(H.dat_van_de))}
  ${sec("IX","Chẩn đoán sơ bộ",P(H.chan_doan_so_bo)||(dd.length?P(dd.join("; ")):""))}
  ${sec("X","Chẩn đoán phân biệt",P(H.chan_doan_phan_biet)||(diff.length?P(diff.join("; ")):""))}
  ${sec("XI","Biện luận và sinh lý bệnh",`<p style="margin:6px 0 2px"><b>Biện luận</b></p>${P(H.bien_luan)||EMPTY}<p style="margin:8px 0 2px"><b>Sinh lý bệnh: vì sao?</b></p>${P(H.sinh_ly_benh)||EMPTY}`)}
  ${sec("XII","Đề nghị cận lâm sàng",tl(es.map(t=>[t[0],""]))+(c.tests.some(t=>t[3]==="w")?`<p style="margin:6px 0 0"><b>Không có chỉ định:</b> ${esc(c.tests.filter(t=>t[3]==="w").map(t=>t[0]).join("; "))}</p>`:""))}
  ${sec("XIII","Kết quả cận lâm sàng",P(H.can_lam_sang)||tl(es))}
  ${sec("XIV","Chẩn đoán xác định",P(H.chan_doan_xac_dinh)+(dd.length?cdx:""))}
  ${sec("XV","Điều trị",P(H.dieu_tri)+dtri+bad)}
  ${sec("XVI","Tiên lượng",P(H.tien_luong))}
  ${sec("XVII","Dự phòng",P(H.du_phong))}
  ${(c.nguon&&c.nguon.length)?`<p style="margin:8px 0 0;color:var(--muted);font-size:13px">Nguồn tham khảo: ${c.nguon.map(esc).join(" ; ")}</p>`:""}</div>
  <div class="pit"><h3>Bài học then chốt</h3>${esc(tch(c))}</div>`;
  $("#panel").innerHTML=`<section class="card"><button class="btn ghost" data-v="lback" type="button">‹ Danh sách ca</button><div class="code">${esc(TRACKS[def.track])}</div><h2>${esc(c.title)}</h2>${bankDoc(c)}${ans}</section>`;
  window.scrollTo({top:0});
}
function renderSteps(){
  $("#steps").innerHTML = STEPS.map((st,i)=>`<button class="step ${S.done[st.id]?"done":""}" role="tab" aria-selected="${i===S.cur}" data-i="${i}" type="button"><small>${st.code}</small>${esc(st.title)}</button>`).join("");
}
function whyBlock(st){
  if(!answersOpen()) return S.mode==="learn" ? `<button class="btn ghost" id="reveal" type="button">Xem sinh lý bệnh và lỗi hay gặp</button>` : `<div class="lock">Phần sinh lý bệnh và lỗi hay gặp mở sau khi bấm “Nộp bài”.</div>`;
  return `<div class="why"><h3>Sinh lý bệnh: vì sao?</h3>${esc(st.why)}</div><div class="pit"><h3>Hay sai khi thi</h3><ul class="tight">${st.pit.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`;
}
function render(){
  renderSteps();
  const st=STEPS[S.cur]; let body="";
  const head=`<div class="code">Mục ${esc(st.code)}</div><h2>${esc(st.title)}</h2>`;
  if(st.type==="ask") body=renderAsk(st);
  else if(st.type==="text") body=renderText(st);
  else if(st.type==="pick2") body=renderPick2(st);
  else if(st.type==="pick3") body=renderPick3(st);
  else body=renderFinal(st);
  const first=S.cur===0, last=S.cur===STEPS.length-1;
  $("#panel").innerHTML = `<section class="card"><button class="btn ghost" data-v="lback" type="button">‹ Danh sách ca</button>${head}${S.cur===0?`<div class="intro"><b>Đau thượng vị cấp sau bữa nhậu.</b> ${esc(CASE.intro)}</div><div class="vitals">${CASE.vitals.map(v=>`<div>${esc(v[0])}<b>${esc(v[1])}</b>${esc(v[2])}</div>`).join("")}</div>`:""}${body}${whyBlock(st)}
    <div class="nav"><button class="btn ghost" data-nav="-1" ${first?"disabled":""} type="button">Mục trước</button>${last?`<button class="btn" id="submit" type="button">${S.mode==="exam"&&!S.submitted?"Nộp bài":"Xem điểm tự đánh giá"}</button>`:`<button class="btn" data-nav="1" type="button">Mục tiếp</button>`}</div></section>`;
}
function renderAsk(st){
  const seen=S.seen[st.id]||(S.seen[st.id]=new Set());
  const keyN=st.items.filter(i=>i[2]).length, keyGot=st.items.filter((i,k)=>i[2]&&seen.has(k)).length;
  const hint=st.id==="hb"?"Bấm câu hỏi bạn muốn hỏi bệnh nhân.":"Bấm phần bạn muốn khám.";
  return `<p style="margin:0;color:var(--muted)">${hint} Câu có nhãn “then chốt” là câu giám khảo thường chờ bạn hỏi.</p>
  <div class="list">${st.items.map((it,k)=>`<button class="q ${seen.has(k)?"open":""}" data-ask="${k}" type="button"><span>${esc(it[0])}${answersOpen()&&it[2]?` <span class="tag">THEN CHỐT</span>`:""}</span><span class="a">${esc(it[1])}</span></button>`).join("")}</div>
  <div class="score">Then chốt đã hỏi: ${keyGot}/${keyN}${answersOpen()&&keyGot<keyN?" · còn thiếu: "+esc(st.items.filter((i,k)=>i[2]&&!seen.has(k)).map(i=>i[0]).join("; ")):""}</div>`;
}
function renderText(st){
  const v=S.text[st.id]||"", rub=S.rub[st.id]||(S.rub[st.id]=new Set());
  return `<p style="margin:0">${esc(st.prompt)}</p><textarea id="ta" aria-label="Bài làm của bạn" placeholder="Viết bằng lời của bạn rồi so với đáp án mẫu…">${esc(v)}</textarea>
  ${answersOpen()?`<div class="model">${esc(st.model)}</div><div><b>Tự chấm</b> (đánh dấu mục bạn đã làm được)</div>${st.rubric.map((r,k)=>`<label class="check"><input type="checkbox" data-rub="${k}" ${rub.has(k)?"checked":""}><span>${esc(r)}</span></label>`).join("")}`:
  `<div class="lock">${S.mode==="exam"?"Đáp án mẫu mở sau khi nộp bài.":"Viết xong thì bấm “Xem sinh lý bệnh và lỗi hay gặp” bên dưới để mở đáp án mẫu."}</div>`}`;
}
function pickList(id,list,multi){
  const sel=S.pick[id]||(S.pick[id]=new Set()), shown=S.checked[id]&&answersOpenFor();
  return `<div class="list">${list.map((o,k)=>`<label class="opt ${shown?"show "+o[1]:""}"><input type="${multi?"checkbox":"radio"}" name="${id}" data-pick="${id}" data-k="${k}" ${sel.has(k)?"checked":""}><span>${esc(o[0])}<span class="fb">${esc(o[2])}</span></span></label>`).join("")}</div>`;
}
const answersOpenFor=()=>S.mode==="learn"||S.submitted;
function renderPick2(st){
  return `<p style="margin:0"><b>Chẩn đoán sơ bộ</b>: chọn một.</p>${pickList("sobo",CASE.sobo,false)}
  <p style="margin:0"><b>Chẩn đoán phân biệt</b>: chọn các chẩn đoán cần nêu.</p>${pickList("pb",CASE.pb,true)}
  ${S.mode==="learn"?`<button class="btn" data-check="cd" type="button">Kiểm tra</button>`:`<div class="lock">Đáp án mở sau khi nộp bài.</div>`}${S.checked.cd&&answersOpenFor()?`<div class="score">${scoreText("sobo",CASE.sobo)} · ${scoreText("pb",CASE.pb)}</div>`:""}`;
}
function renderPick3(st){
  const shown=S.checked.cls&&answersOpenFor();
  return `<p style="margin:0">Chọn các xét nghiệm bạn đề nghị cho bệnh nhân này.</p>${pickList("cls",CASE.cls,true)}
  ${S.mode==="learn"?`<button class="btn" data-check="cls" type="button">Kiểm tra và xem kết quả</button>`:`<div class="lock">Kết quả xét nghiệm mở sau khi nộp bài.</div>`}${shown?`<div class="score">${scoreText("cls",CASE.cls)}</div>
  <div class="tw"><table><thead><tr><th>Xét nghiệm</th><th>Kết quả</th><th>Đơn vị</th><th>Tham chiếu</th></tr></thead><tbody>${CASE.kq.map(r=>`<tr><td>${esc(r[0])}</td><td class="${r[4]}">${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}</tbody></table></div><p style="margin:0">${esc(CASE.kqText)}</p>`:""}`;
}
function scoreText(id,list){
  const sel=S.pick[id]||new Set(); const good=list.map((o,k)=>o[1]==="ok"?k:-1).filter(k=>k>=0);
  const hit=good.filter(k=>sel.has(k)).length, wrong=[...sel].filter(k=>list[k][1]==="no").length;
  return `Đúng ${hit}/${good.length}${wrong?`, chọn nhầm ${wrong}`:""}`;
}
function renderFinal(st){
  const t=S.text.final||"";
  return `<p style="margin:0">Viết chẩn đoán xác định, tiên lượng gần và xa, dự phòng.</p><textarea id="ta" aria-label="Bài làm của bạn">${esc(t)}</textarea>
  ${answersOpen()?`<div class="model">${esc(CASE.cd)}\n\n${esc(CASE.tl)}\n\n${esc(CASE.dp)}</div>${S.showSum?summary():""}`:`<div class="lock">${S.mode==="exam"?"Đáp án mẫu mở sau khi nộp bài.":"Viết xong thì bấm “Xem sinh lý bệnh và lỗi hay gặp” bên dưới để mở đáp án mẫu."}</div>`}`;
}
function summary(){
  const ask1=STEPS[0].items, ask2=STEPS[1].items, s1=S.seen.hb||new Set(), s2=S.seen.kham||new Set();
  const k=(items,seen)=>{const a=items.filter(i=>i[2]).length;const b=items.filter((i,x)=>i[2]&&seen.has(x)).length;return `${b}/${a}`};
  const r=(id)=>`${(S.rub[id]||new Set()).size}/${STEPS.find(s=>s.id===id).rubric.length}`;
  return `<div class="sum"><div><span>Hỏi bệnh: câu then chốt</span><b>${k(ask1,s1)}</b></div><div><span>Khám: mục then chốt</span><b>${k(ask2,s2)}</b></div><div><span>Tóm tắt, đặt vấn đề</span><b>${r("tt")}</b></div><div><span>Chẩn đoán sơ bộ</span><b>${scoreText("sobo",CASE.sobo)}</b></div><div><span>Chẩn đoán phân biệt</span><b>${scoreText("pb",CASE.pb)}</b></div><div><span>Biện luận</span><b>${r("bl")}</b></div><div><span>Đề nghị CLS</span><b>${scoreText("cls",CASE.cls)}</b></div></div>

}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,label"); if(!t) return;
  if(t.id==="m-learn") return setMode("learn");
  if(t.id==="m-exam") return setMode("viva");
  if(t.dataset.v) return vivaClick(t);
  if(t.classList.contains("step")){ keepText(); S.cur=+t.dataset.i; return render(); }
  if(t.dataset.nav){ keepText(); S.done[STEPS[S.cur].id]=true; S.cur=Math.min(STEPS.length-1,Math.max(0,S.cur+ +t.dataset.nav)); render(); return window.scrollTo({top:0}); }
  if(t.dataset.ask!==undefined){ const st=STEPS[S.cur]; (S.seen[st.id]||(S.seen[st.id]=new Set())).add(+t.dataset.ask); return render(); }
  if(t.id==="reveal"){ keepText(); S.reveal[STEPS[S.cur].id]=true; return render(); }
  if(t.id==="submit"){ keepText(); S.submitted=true; S.showSum=true; S.checked.cd=S.checked.cls=S.checked.sobo=S.checked.pb=true; S.done[STEPS[S.cur].id]=true; clearInterval(timerId); return render(); }
  if(t.dataset.check){ S.checked[t.dataset.check]=true; if(t.dataset.check==="cd") S.checked.sobo=S.checked.pb=true; S.reveal[STEPS[S.cur].id]=true; return render(); }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.pick){ const set=S.pick[t.dataset.pick]||(S.pick[t.dataset.pick]=new Set()); const k=+t.dataset.k; if(t.type==="radio") set.clear(); if(t.checked) set.add(k); else set.delete(k); }
  if(t.dataset.rub!==undefined){ const id=STEPS[S.cur].id; const set=S.rub[id]||(S.rub[id]=new Set()); const k=+t.dataset.rub; if(t.checked) set.add(k); else set.delete(k); }
});

Nhồi máu cơ tim cấp ST chênh lên (STEMI)","Đau thắt ngực ổn định","Bóc tách động mạch chủ","Viêm màng ngoài tim cấp","Trào ngược dạ dày thực quản"],"bd":["+Chân tâm thống","Vị quản thống","Hung tý (thể nhẹ)","Huyễn vựng"],"bc":["+Lý – Thực (huyết ứ trở mạch)","Biểu – Thực","Lý – Hư – Hàn","Lý – Hư – Nhiệt"],"the":["+Tâm huyết ứ trở","~Khí trệ huyết ứ","Đàm trọc bế tắc","Tâm thận dương hư","Âm hàn ngưng trệ"],"phap":["+Hoạt huyết hóa ứ, thông mạch chỉ thống (hỗ trợ sau can thiệp)","Hóa đàm khoan hung","Hồi dương cứu nghịch","Dưỡng âm thanh nhiệt"],"phuong":["+Huyết phủ trục ứ thang","Qua lâu giới bạch bán hạ thang","Tứ nghịch thang","Lục vị địa hoàng hoàn"],"huyet":["+Nội quan","+Đản trung","+Tâm du","+Cách du","Đại chùy","Hợp cốc","Thái xung","Quan nguyên"]},"actions":["++Gắn monitor, thở oxy qua mặt nạ|1|SpO2 88% cần bù oxy.","++Lập đường truyền tĩnh mạch|2|Chuẩn bị thuốc và theo dõi.","++Cho nhai aspirin 300 mg|1|Không dị ứng, chỉ định chuẩn trong STEMI.","++Hội chẩn tim mạch, kích hoạt can thiệp mạch vành thì đầu|3|Tái tưới máu sớm quyết định sống còn.","+Giảm đau bằng opioid liều nhỏ tĩnh mạch|1|Giảm đau khi đau nhiều, theo dõi huyết áp.","+Dùng thuốc chống đông/kháng kết tập thứ hai theo phác đồ|2|Theo hướng dẫn tim mạch.","!Cho uống thuốc thang hoạt huyết rồi theo dõi diễn tiến|5|Trì hoãn tái tưới máu. YHCT chỉ hỗ trợ sau can thiệp.","!Châm cứu kích thích mạnh, lưu kim lâu trước can thiệp|10|Mất thời gian vàng, không thay thế tái tưới máu.","!Cho thuốc hạ áp mạnh|2|Huyết áp đang thấp 90/60, có thể gây sốc."],"teach":"STEMI là cấp cứu: tái tưới máu trước, YHCT hỗ trợ sau. Chân tâm thống (đau tim thực sự) khác Hung tý nhẹ ở độ dữ dội, vã mồ hôi lạnh, tay chân lạnh, lưỡi tím mạch tế sáp. Sai lầm nguy hiểm nhất là cho thuốc thang hoặc châm cứu rồi đợi, làm chậm can thiệp.","hbu":{"tien_su":"Bản thân có tăng huyết áp, đái tháo đường và hút thuốc 30 năm; không dị ứng thuốc, không dùng thuốc chống đông. Chưa có dữ kiện về bệnh mạch vành trước đây, tiền sử gia đình hoặc các đợt đau ngực và chứng huyết ứ trước đó.","luoc_qua_co_quan":"Tim mạch có đau ngực đè nặng lan vai trái và hàm, tim nhanh, huyết áp thấp; hô hấp có khó thở, giảm oxy máu và ít ran ẩm hai đáy. Tiêu hóa có buồn nôn; thần kinh chưa ghi nhận ngất. Tiết niệu và cơ xương khớp chưa có dữ kiện; đau không thay đổi theo hô hấp hay tư thế, không xé ra sau lưng. Theo YHCT, có mồ hôi lạnh, chi lạnh, lưỡi tím tối có điểm ứ huyết và mạch tế sáp nhanh.","tom_tat":"Nam 62 tuổi, nền tăng huyết áp, đái tháo đường và hút thuốc lâu năm, vào viện vì đau ngực dữ dội kéo dài 40 phút, lan vai trái và hàm, không giảm khi nghỉ, kèm khó thở, buồn nôn và mồ hôi lạnh. Huyết áp 90/60 mmHg, SpO2 88%, chi lạnh ẩm, ran ẩm hai đáy; ST chênh lên ≥ 2 mm ở V2–V5, troponin tăng, giảm động thành trước và mỏm, EF khoảng 40%. Không đau xé ra lưng, không chênh huyết áp hai tay đáng kể, đau không phụ thuộc tư thế hay hơi thở. Lưỡi tím tối có điểm ứ huyết, mạch tế sáp nhanh gợi huyết ứ trở mạch.","dat_van_de":"Đau ngực cấp kiểu thiếu máu cơ tim, kèm giảm oxy máu, dấu giảm tưới máu ngoại vi và ứ huyết phổi trên nền nhiều yếu tố nguy cơ tim mạch. Chứng trạng YHCT gồm đau dữ dội, lưỡi tím có điểm ứ huyết, mạch tế sáp, chi lạnh và mồ hôi lạnh; cần đánh giá thêm dấu suy thoát.","bien_luan":"Đau ngực điển hình, ST chênh lên ở các chuyển đạo liên tiếp, troponin tăng và rối loạn vận động vùng xác định nhồi máu cơ tim cấp ST chênh lên; cần chụp mạch vành cấp cứu để tái tưới máu, không chờ thêm xét nghiệm. Bóc tách động mạch chủ ít gợi ý vì không đau xé ra lưng hay chênh huyết áp hai tay, nhưng nếu xuất hiện dấu nghi ngờ cần khảo sát động mạch chủ; thuyên tắc phổi ít phù hợp hơn với tổn thương điện tim và siêu âm theo vùng mạch vành, chỉ khảo sát khi có bằng chứng bổ sung. Viêm màng ngoài tim ít phù hợp vì đau không phụ thuộc tư thế, ST chênh theo vùng và có giảm động khu trú. YHCT thuộc Chân tâm thống, bát cương Lý–Thực, thể Tâm huyết ứ trở/Khí trệ huyết ứ; pháp hoạt huyết hóa ứ, thông mạch chỉ thống chỉ phối hợp sau can thiệp, không trì hoãn cấp cứu.","sinh_ly_benh":"Tắc cấp động mạch vành, thường do huyết khối trên mảng xơ vữa biến chứng, gây thiếu máu kéo dài và hoại tử cơ tim. Giảm co bóp thất trái gây giảm cung lượng tim, ứ huyết phổi và giảm oxy máu. Theo lý luận YHCT, khí huyết vận hành trở ngại, huyết ứ bế tắc tâm mạch gây đau; đây là diễn giải theo hệ lý luận YHCT, không thay thế cơ chế mạch vành.","tien_luong":"Gần: nặng, nguy cơ rối loạn nhịp, suy tim cấp và sốc tim; phụ thuộc tốc độ tái tưới máu và đáp ứng huyết động. Xa: có nguy cơ suy tim và tái phát biến cố tim mạch, cần đánh giá lại chức năng thất trái. Theo YHCT, huyết ứ kèm chi lạnh và mồ hôi lạnh là dấu cần theo dõi sát, chưa đủ dữ kiện kết luận chứng thoát.","du_phong":"Sau ổn định, bỏ thuốc lá, kiểm soát huyết áp và đường huyết, tuân thủ điều trị sau can thiệp và phục hồi chức năng tim theo hướng dẫn. Tái khám tim mạch đúng hẹn; gọi cấp cứu khi đau ngực tái phát, khó thở tăng hoặc ngất. YHCT chỉ phối hợp khi bác sĩ đánh giá phù hợp, tránh tự dùng thuốc hoạt huyết khi đang điều trị chống huyết khối."},"nguon":["ACC/AHA/ACEP/NAEMSP/SCAI, Guideline for the Management of Patients With Acute Coronary Syndromes, 2025.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020 — khung tham chiếu kết hợp; cần đối chiếu nguồn chuyên biệt về Chân tâm thống."],"status":"draft"},{"id":"trung-phong","title":"Méo miệng, liệt nửa người đột ngột","kind":"Cấp cứu","level":"Khó","group":"capcuu","place":"Phòng cấp cứu","clock":"08:00","name":"Bà Lê Thị Mận","age":68,"sex":"nữ","intro":"Phòng cấp cứu, 08:00. Con gái đưa bà vào vì sáng nay phát hiện méo miệng, yếu nửa người phải, nói khó. Lần cuối thấy bà bình thường là 07:00.","vitals":{"hr":92,"sbp":190,"dbp":105,"rr":18,"t":37,"spo2":96},"ask":[["Triệu chứng bắt đầu lúc nào, có đột ngột không?","Đột ngột, khoảng 40 phút trước, lúc đang đánh răng.","e"],["Tiền sử bệnh?","Tăng huyết áp nhiều năm, thỉnh thoảng hồi hộp, chưa điều trị đều.","e"],["Có dùng thuốc chống đông, có chấn thương đầu gần đây không?","Không dùng thuốc chống đông. Không ngã, không chấn thương.","e"],["Có đau đầu, nôn không?","Đau đầu nhẹ, nôn một lần.","n"],["Đại tiện, đờm?","Táo bón 3 ngày, đờm nhiều.","n"],["Ăn uống thường ngày?","Thích ăn béo ngọt, ít vận động.","n"]],"exam":[["K","Ý thức, thang điểm đột quỵ (NIHSS)","Tỉnh, lơ mơ nhẹ, nói ngọng. NIHSS khoảng 12.","e"],["K","Mặt","Méo miệng sang trái, nếp mũi má phải mờ (liệt VII trung ương phải).","e"],["K","Vận động tay chân","Tay chân phải lực cơ 2/5, bên trái 5/5.","e"],["V","Lưỡi","Lưỡi lệch phải, chất tối, bệu, rêu trắng dày nhớt.","e"],["T","Mạch","Mạch huyền, hoạt, không đều.","e"],["M","Tiếng đờm","Họng khò khè, đờm nhiều.","n"]],"tests":[["Đường huyết mao mạch",1,"7,2 mmol/L.","e"],["CT sọ không cản quang",15,"Không xuất huyết. Chưa thấy vùng giảm tỷ trọng rõ.","e"],["Điện tâm đồ",3,"Rung nhĩ, đáp ứng thất hơi nhanh.","e"],["Công thức máu, đông máu, điện giải",10,"INR 1,0. Tiểu cầu bình thường.","n"],["MRI sọ não",40,"Hạn chế khuếch tán vùng động mạch não giữa trái. Không nên chờ MRI để quyết định.","n"],["Chọc dịch não tủy",20,"Không có chỉ định.","w"]],"opt":{"ydx":["+Đột quỵ nhồi máu não cấp (nghi do rung nhĩ)","Xuất huyết não","Cơn thiếu máu não thoáng qua","Liệt Bell (liệt VII ngoại biên)"],"bd":["+Trúng phong – trúng kinh lạc","Trúng phong – trúng tạng phủ (bế chứng)","Khẩu nhãn oa tà","Nuy chứng"],"bc":["+Lý – Thực (bản hư tiêu thực)","Biểu – Thực – Hàn","Lý – Hư – Hàn","Biểu – Hư"],"the":["+Phong đàm ứ trở lạc mạch","Can dương thượng cang, phong động","Khí hư huyết ứ","Âm hư phong động"],"phap":["+Tức phong hóa đàm, hoạt huyết thông lạc","Bổ khí hoạt huyết","Tư âm tiềm dương","Hồi dương cố thoát"],"phuong":["+Hóa đàm thông lạc thang","+Bán hạ bạch truật thiên ma thang","Bổ dương hoàn ngũ thang","Độc sâm thang","Lục vị địa hoàng hoàn"],"huyet":["+Thủy câu","+Bách hội","+Hợp cốc","+Khúc trì","+Túc tam lý","+Phong long","Quan nguyên","Thận du","Nội quan"]},"actions":["++Kích hoạt báo động đột quỵ, hội chẩn thần kinh|2|Mỗi phút trôi qua mất tế bào thần kinh.","++Bảo đảm đường thở, theo dõi monitor và chọn tư thế đầu giường theo tình trạng hô hấp, nuốt, huyết động|1|Không có lợi ích chức năng đã chứng minh cho việc mặc định đầu cao 30° ở mọi đột quỵ thiếu máu; tư thế cần cá thể hóa.","++Hội chẩn quyết định tiêu sợi huyết hoặc lấy huyết khối cơ học|3|Chỉ sau khi CT loại trừ xuất huyết và còn trong cửa sổ thời gian.","+Quản lý huyết áp theo chiến lược tái tưới máu|1|Nếu đủ điều kiện tiêu sợi huyết tĩnh mạch, cần đạt <185/110 mmHg trước điều trị; nếu không tái tưới máu và không có chỉ định khác, tránh hạ áp tích cực quá mức.","+Châm cứu hỗ trợ sau khi đã ổn định và loại trừ xuất huyết|5|Phối hợp phục hồi chức năng.","!Hạ huyết áp nhanh về 120/80|2|Có thể làm vùng thiếu máu lan rộng.","!Cho aspirin và heparin ngay trước khi có CT|2|Chưa loại trừ xuất huyết.","!Cho uống thuốc thang rồi chờ xem diễn tiến 6 giờ|5|Mất cửa sổ điều trị.","!Chích nặn máu mười đầu ngón tay trước khi có CT|5|Không có vai trò, làm chậm điều trị."],"teach":"Thứ tự đúng: ổn định ABC, xác định thời điểm cuối bình thường, đo glucose, chụp não khẩn và quyết định tái thông. Nếu dự kiến tiêu sợi huyết tĩnh mạch, huyết áp cần được kiểm soát theo ngưỡng của phác đồ (thường <185/110 mmHg trước điều trị). Không mặc định đầu cao 30° cho mọi trường hợp; tư thế đầu giường cá thể hóa. YHCT chỉ phối hợp sau giai đoạn cấp và không làm chậm tái tưới máu.","hbu":{"tien_su":"Bản thân tăng huyết áp nhiều năm, điều trị không đều, thỉnh thoảng hồi hộp; không dùng thuốc chống đông và không chấn thương đầu gần đây. Thường ăn béo ngọt, ít vận động, là dữ kiện phù hợp để xem xét đàm thấp theo YHCT nhưng không đủ xác định thể bệnh nền. Chưa có dữ kiện về đột quỵ trước đây hoặc tiền sử gia đình.","luoc_qua_co_quan":"Thần kinh có yếu nửa người phải, liệt mặt trung ương phải, nói ngọng và lơ mơ nhẹ; tim mạch có huyết áp cao và rung nhĩ trên điện tâm đồ. Hô hấp có đờm nhiều, tiếng khò khè ở họng; tiêu hóa có nôn một lần và táo bón 3 ngày. Tiết niệu và bệnh lý cơ xương khớp độc lập chưa được khai thác. YHCT ghi nhận lưỡi tối, bệu, rêu trắng dày nhớt và mạch huyền hoạt không đều.","tom_tat":"Nữ 68 tuổi, tiền sử tăng huyết áp điều trị không đều và hồi hộp, vào viện vì đột ngột méo miệng, yếu nửa người phải và nói khó; lần cuối bình thường lúc 07:00. Khám có liệt VII trung ương phải, lực cơ bên phải 2/5, NIHSS khoảng 12, huyết áp 190/105 mmHg; CT không xuất huyết, MRI có hạn chế khuếch tán vùng động mạch não giữa trái và điện tâm đồ ghi nhận rung nhĩ. Đường huyết 7,2 mmol/L, không chấn thương đầu, không dùng thuốc chống đông. Đờm nhiều, lưỡi bệu rêu trắng dày nhớt và mạch huyền hoạt gợi phong đàm kèm ứ trở lạc mạch.","dat_van_de":"Hội chứng thần kinh khu trú khởi phát đột ngột bên phải, kèm rối loạn lời nói và thay đổi ý thức nhẹ, trên nền huyết áp cao và nhịp tim không đều. Chứng trạng YHCT gồm bán thân bất toại, khẩu nhãn oa tà, đờm nhiều, lưỡi bệu tối, rêu nhớt và mạch huyền hoạt; cần làm rõ mức độ rối loạn thần chí.","bien_luan":"Khởi phát đột ngột, thiếu sót thần kinh phù hợp tổn thương bán cầu trái, CT không xuất huyết và MRI xác nhận thiếu máu vùng động mạch não giữa trái phù hợp đột quỵ nhồi máu não cấp; rung nhĩ gợi nguồn thuyên tắc từ tim nhưng chưa chứng minh chắc chắn. Xuất huyết não không được ghi nhận trên CT, hạ đường huyết không phù hợp với đường huyết 7,2 mmol/L; liệt sau cơn động kinh ít gợi ý vì chưa có dữ kiện cơn co giật, cần hỏi người chứng kiến. Cần chụp mạch não để tìm tắc mạch lớn, đánh giá điều kiện tái thông và khảo sát nguồn thuyên tắc bằng siêu âm tim sau đó, không chờ MRI làm chậm quyết định cấp cứu. YHCT theo dữ liệu ca là Trúng phong–trúng kinh lạc, Lý–Thực trên nền bản hư tiêu thực, thể Phong đàm ứ trở lạc mạch; pháp tức phong hóa đàm, hoạt huyết thông lạc phối hợp khi đã ổn định.","sinh_ly_benh":"Tắc động mạch não làm giảm tưới máu, gây thiếu năng lượng tế bào, tổn thương vùng lõi và hình thành vùng mô còn có thể cứu nếu tái thông kịp thời. Rung nhĩ có thể gây huyết khối trong tim rồi thuyên tắc lên não. Theo YHCT, phong, đàm và ứ trở ngại kinh lạc gây rối loạn vận động và lời nói; bản hư cần thêm dữ kiện để xác định.","tien_luong":"Gần: dè dặt vì thiếu sót thần kinh mức đáng kể, có nguy cơ phù não, sặc và chuyển dạng xuất huyết; khả năng cải thiện phụ thuộc tái thông và chăm sóc giai đoạn cấp. Xa: nguy cơ di chứng vận động, rối loạn lời nói và tái phát nếu yếu tố nguy cơ không được kiểm soát. Theo YHCT, phục hồi chức năng kinh lạc cần phối hợp với phục hồi chức năng hiện đại, không thể dự đoán kết quả chỉ bằng lưỡi và mạch.","du_phong":"Sau ổn định, tuân thủ kế hoạch kiểm soát huyết áp và dự phòng đột quỵ liên quan rung nhĩ do chuyên khoa quyết định; đánh giá nuốt trước khi ăn uống và tập phục hồi theo khả năng. Giảm thức ăn quá béo ngọt, vận động phù hợp; YHCT hỗ trợ phục hồi khi có chỉ định. Tái khám thần kinh và tim mạch đúng hẹn, gọi cấp cứu ngay khi xuất hiện lại méo miệng, yếu tay chân hoặc nói khó."},"nguon":["AHA/ASA, Guideline for the Early Management of Patients With Acute Ischemic Stroke, 2026.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"trung-thu","title":"Công nhân gục giữa trưa nắng","kind":"Cấp cứu","level":"Trung bình","group":"capcuu","place":"Phòng cấp cứu","clock":"13:40","name":"Anh Nguyễn Văn Khoa","age":30,"sex":"nam","intro":"Phòng cấp cứu, 13:40. Anh làm việc ngoài trời 5 giờ, đồng nghiệp thấy gục xuống, lú lẫn, da nóng.","vitals":{"hr":128,"sbp":95,"dbp":55,"rr":28,"t":40.5,"spo2":95},"ask":[["Làm việc ngoài nắng bao lâu, có uống đủ nước không?","Khoảng 5 giờ liền, uống rất ít nước.","e"],["Lúc đầu có ra mồ hôi nhiều không? Bây giờ thì sao?","Lúc đầu vã mồ hôi nhiều, bây giờ da khô nóng, không ra mồ hôi.","e"],["Có ngất, co giật, lú lẫn không?","Ngất một lần, hiện nói sảng, lú lẫn.","e"],["Tiền sử bệnh, thuốc, rượu?","Không bệnh nền, không uống rượu hay thuốc.","n"],["Nước tiểu?","Ít, màu sẫm.","e"],["Có nôn, tiêu chảy không?","Nôn hai lần.","n"]],"exam":[["V","Da và thần sắc","Da đỏ, nóng khô, mặt đỏ, thở nhanh nông.","e"],["K","Ý thức","Lơ mơ, nói sảng, đáp ứng chậm.","e"],["V","Lưỡi","Chất lưỡi đỏ, rêu vàng khô, ít tân dịch.","e"],["T","Mạch","Mạch hồng, sác, ấn mạnh thấy vô lực.","e"],["K","Khám tim phổi, bụng","Tim nhanh đều. Phổi thông khí đều. Bụng mềm.","n"]],"tests":[["Nhiệt độ trung tâm (trực tràng)",1,"40,6 độ C.","e"],["Điện giải, creatinin, CK, men gan",10,"Na 148, K 3,2, creatinin 1,6, CK 4.800. Tổn thương thận cấp nhẹ, tiêu cơ vân.","e"],["Đường huyết mao mạch",1,"4,8 mmol/L.","n"],["Khí máu động mạch",5,"Nhiễm toan chuyển hóa.","n"],["Điện tâm đồ",3,"Nhịp nhanh xoang.","n"],["CT sọ não",20,"Không có chấn thương đầu. Làm chậm việc hạ nhiệt.","w"]],"opt":{"ydx":["+Đột quỵ nhiệt (say nắng nặng)","Kiệt sức do nóng","Viêm màng não","Hạ đường huyết","Cơn bão giáp"],"bd":["+Trúng thử","Trúng phong","Cảm mạo phong hàn","Thương thử nhẹ"],"bc":["+Lý – Thực – Nhiệt kiêm thương tân","Biểu – Thực – Hàn","Lý – Hư – Hàn","Lý – Thực – Hàn"],"the":["+Thử nhiệt nhập khí phận, khí âm lưỡng thương","Thử thấp, hàn bó biểu","Âm hư phong động","Dương hư hàn thịnh"],"phap":["+Thanh nhiệt giải thử, ích khí sinh tân","Phát hãn giải biểu, tán hàn","Ôn bổ thận dương","Hoạt huyết hóa ứ"],"phuong":["+Bạch hổ gia nhân sâm thang","~Sinh mạch tán","Hương nhu ẩm","Ma hoàng thang","Lý trung hoàn"],"huyet":["+Đại chùy","+Khúc trì","+Thập tuyên","+Nhân trung","Quan nguyên","Thận du","Tỳ du"]},"actions":["++Chuyển vào nơi mát, cởi quần áo, phun sương và quạt, chườm đá cổ nách bẹn|2|Hạ nhiệt tích cực là điều trị quyết định.","++Truyền dịch tĩnh mạch natri clorid 0,9% hoặc Ringer lactat|2|Bù dịch, hỗ trợ tuần hoàn và thận.","++Gắn monitor, đo nhiệt độ trung tâm liên tục|1|Theo dõi đáp ứng điều trị.","+Chích nặn máu Thập tuyên, châm Đại chùy, Khúc trì sau khi đã làm mát|3|Hỗ trợ giải nhiệt, không thay thế làm mát.","+Bồi phụ điện giải theo kết quả xét nghiệm|2|Hạ natri, kali theo chỉ định.","-Cho paracetamol hạ sốt là chính|1|Thuốc hạ sốt không hiệu quả trong đột quỵ nhiệt.","!Ủ ấm, đắp chăn dày cho ra mồ hôi|2|Làm nhiệt độ tăng thêm.","!Cho uống thuốc thang giải biểu nóng (Ma hoàng thang)|3|Sai pháp, làm thương tân dịch thêm.","!Ép uống nhiều nước lạnh nhanh khi đang lơ mơ|2|Nguy cơ sặc."],"teach":"Đột quỵ nhiệt là cấp cứu hạ nhiệt: mỗi phút nhiệt độ trung tâm cao đều gây tổn thương. YHCT gọi là Trúng thử, thuộc thử nhiệt nhập khí phận, khí âm lưỡng thương. Pháp thanh nhiệt giải thử, ích khí sinh tân đi sau hoặc song song với làm mát vật lý và bù dịch, không thay thế.","hbu":{"tien_su":"Theo bệnh sử, bản thân không có bệnh nền, không uống rượu và không dùng thuốc; làm việc ngoài trời liên tục khoảng 5 giờ, uống rất ít nước. Chưa có dữ kiện về tiền sử gia đình hoặc các đợt bệnh do nóng trước đây. Theo YHCT, phơi nắng nóng và mất tân dịch là yếu tố của đợt hiện tại, không đủ để suy ra cơ địa hư nhược sẵn có.","luoc_qua_co_quan":"Thần kinh có ngất một lần, hiện lơ mơ, lú lẫn và nói sảng; tim mạch có nhịp nhanh, huyết áp thấp, hô hấp thở nhanh nhưng phổi thông khí đều. Tiêu hóa có nôn hai lần, bụng mềm; tiết niệu có tiểu ít, sẫm màu. Chưa có mô tả triệu chứng cơ xương khớp dù xét nghiệm gợi tiêu cơ vân. YHCT có da nóng khô, lưỡi đỏ rêu vàng khô, ít tân dịch và mạch hồng sác, ấn mạnh vô lực.","tom_tat":"Nam 30 tuổi, không bệnh nền được ghi nhận, gục sau 5 giờ làm việc ngoài trời và uống ít nước, kèm ngất, lú lẫn, nôn và tiểu ít sẫm màu. Nhiệt độ trung tâm 40,6 độ C, mạch 128 lần/phút, huyết áp 95/55 mmHg, da nóng khô; xét nghiệm có rối loạn điện giải, CK 4.800 và nhiễm toan chuyển hóa. Đường huyết 4,8 mmol/L, phổi thông khí đều, bụng mềm, không ghi nhận dùng rượu hoặc thuốc. Lưỡi đỏ khô, mạch hồng sác vô lực khi ấn mạnh phù hợp thử nhiệt kèm hao tổn khí và tân dịch.","dat_van_de":"Tăng thân nhiệt trung tâm nặng kèm rối loạn ý thức sau phơi nóng và gắng sức, có giảm thể tích tuần hoàn, rối loạn điện giải, tổn thương cơ và nguy cơ tổn thương đa cơ quan. Chứng trạng YHCT gồm nhiệt thịnh, hao tân dịch và dấu khí suy; cần đánh giá thêm mức độ ảnh hưởng thần chí.","bien_luan":"Phơi nóng kéo dài, nhiệt độ trung tâm 40,6 độ C và rối loạn thần kinh trung ương xác định đột quỵ nhiệt; kiệt sức do nóng đơn thuần không giải thích đầy đủ tình trạng này. Hạ đường huyết ít phù hợp với đường huyết 4,8 mmol/L; nhiễm trùng thần kinh hoặc nhiễm khuẩn huyết cần khảo sát nếu có dấu nhiễm trùng hay rối loạn ý thức kéo dài sau làm mát, còn hội chứng tăng nhiệt do thuốc ít gợi ý theo bệnh sử hiện có. Cần theo dõi nối tiếp chức năng thận, CK, điện giải, men gan, đông máu, khí máu và nước tiểu trong khi làm mát ngay. YHCT theo dữ liệu ca là Trúng thử, Lý–Thực–Nhiệt kiêm thương tân, thể Thử nhiệt nhập khí phận, khí âm lưỡng thương; pháp thanh nhiệt giải thử, ích khí sinh tân chỉ phối hợp, không thay thế làm mát và hồi sức.","sinh_ly_benh":"Nhiệt sinh ra và hấp thu vượt khả năng thải nhiệt gây tổn thương tế bào trực tiếp, phản ứng viêm, rối loạn nội mô và nguy cơ rối loạn đông máu. Mất nước làm giảm tưới máu thận; tổn thương cơ có thể giải phóng myoglobin, góp phần gây tổn thương thận. Theo YHCT, thử nhiệt làm hao khí, thương tân dịch, gây nhiệt thịnh kèm biểu hiện khí âm bị tổn thương.","tien_luong":"Gần: nặng vì rối loạn ý thức, huyết áp thấp, tiêu cơ vân và nhiễm toan; tổn thương gan, thận hoặc đông máu có thể tiến triển dù nhiệt độ đã giảm. Xa: phụ thuộc tốc độ làm mát và mức tổn thương cơ quan, có thể còn di chứng thần kinh hoặc giảm khả năng chịu nóng. Theo YHCT, cần đánh giá lại khí và tân dịch sau giai đoạn cấp, không kết luận hồi phục chỉ dựa vào hết nóng.","du_phong":"Sau hồi phục, nghỉ và quay lại lao động theo đánh giá y khoa, thích nghi với nóng từng bước, bố trí nghỉ nơi mát và uống nước phù hợp với mức lao động. Theo YHCT, tránh tiếp tục phơi thử nhiệt và chú ý phục hồi tân dịch qua ăn uống phù hợp, không tự dùng phương thuốc thay cho bù dịch. Tái khám để kiểm tra chức năng cơ quan; cấp cứu khi lú lẫn, ngất, tiểu giảm hoặc nước tiểu sẫm trở lại."},"nguon":["Wilderness Medical Society, Clinical Practice Guidelines for the Prevention and Treatment of Heat Illness: 2024 Update, 2024.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020 — khung tham chiếu kết hợp; cần đối chiếu nguồn chuyên biệt về Trúng thử."],"status":"draft"},{"id":"hao-suyen","title":"Khó thở khò khè, xịt thuốc không đỡ","kind":"Cấp cứu Đông Tây y","level":"Khó","group":"capcuu","place":"Phòng cấp cứu","clock":"21:30","name":"Anh Võ Minh Quân","age":26,"sex":"nam","intro":"Phòng cấp cứu, 21:30. Anh ngồi chống tay hai bên, thở khò khè nặng nhọc, nói từng cụm ngắn. Đã xịt thuốc cắt cơn nhiều lần ở nhà.","vitals":{"hr":118,"sbp":130,"dbp":80,"rr":30,"t":37,"spo2":89},"ask":[["Khó thở khò khè bắt đầu từ lúc nào?","Khoảng 2 giờ nay, tăng dần sau khi hít khói bụi trời lạnh.","e"],["Tiền sử hen? Đã dùng thuốc gì?","Hen từ nhỏ. Đã xịt salbutamol 6 lần, không đỡ.","e"],["Có từng nhập viện, đặt ống thở vì hen không?","Một lần cách đây 2 năm phải vào hồi sức.","e"],["Có sốt, ho đờm màu gì?","Không sốt, ho ít đờm trắng loãng.","e"],["Có dùng thuốc chẹn beta, aspirin, kháng viêm giảm đau gần đây không?","Không.","n"],["Có dị ứng thức ăn, thuốc không?","Dị ứng phấn hoa, không dị ứng thuốc.","n"]],"exam":[["K","Tư thế, nói chuyện, cơ hô hấp phụ","Ngồi chống tay, nói được 2-3 từ mỗi hơi, co kéo cơ ức đòn chũm và liên sườn.","e"],["K","Nghe phổi","Ran rít, ran ngáy lan tỏa hai phế trường. Rì rào phế nang giảm. Chưa có phổi câm.","e"],["K","Lưu lượng đỉnh (PEF)","Khoảng 35% giá trị dự đoán.","e"],["V","Lưỡi","Chất lưỡi nhạt, rêu trắng trơn nhớt.","e"],["V","Sắc mặt, môi","Vã mồ hôi, môi tím nhẹ, sợ lạnh.","n"],["M","Tiếng thở, tiếng ho","Thở rít khò khè nghe rõ, ho ít, đờm trắng loãng.","n"],["T","Mạch","Mạch phù, khẩn, nhanh.","e"]],"tests":[["Khí máu động mạch",5,"pH 7,42, PaO2 58, PaCO2 36 mmHg. PaCO2 bình thường trong cơn nặng là dấu hiệu sắp kiệt sức.","e"],["X-quang ngực tại giường",10,"Phổi tăng sáng, không tràn khí màng phổi, không viêm phổi.","n"],["Công thức máu",10,"Bạch cầu bình thường, bạch cầu ái toan hơi tăng.","n"],["Điện tâm đồ",3,"Nhịp nhanh xoang.","n"],["CT ngực",30,"Không có chỉ định lúc này, làm chậm điều trị.","w"]],"opt":{"ydx":["+Cơn hen phế quản cấp mức nặng","Đợt cấp COPD","Phù phổi cấp","Thuyên tắc phổi","Dị vật đường thở"],"bd":["+Háo suyễn","Phế ung","Hung tý","Khái thấu nhẹ"],"bc":["+Thực – Hàn (hàn đàm, ngoại hàn nội ẩm)","Lý – Thực – Nhiệt","Lý – Hư – Hàn","Biểu – Hư"],"the":["+Hàn háo (hàn đàm trở phế)","Nhiệt háo (đàm nhiệt ủng phế)","Phế thận lưỡng hư","Phong đàm"],"phap":["+Ôn phế tán hàn, hóa đàm bình suyễn","Thanh phế hóa đàm, bình suyễn","Bổ thận nạp khí","Tư âm nhuận phế"],"phuong":["+Tiểu thanh long thang","+Xạ can ma hoàng thang","Ma hạnh thạch cam thang","Định suyễn thang","Bổ phế thang"],"huyet":["+Định suyễn","+Phế du","+Thiên đột","+Đản trung","+Liệt khuyết","Thái xung","Hành gian","Dũng tuyền","Huyết hải"]},"actions":["++Cho ngồi, thở oxy, gắn monitor SpO2 mục tiêu 93-95%|1|SpO2 89% cần bù oxy ngay.","++Khí dung salbutamol (có thể phối hợp ipratropium) liên tục|2|Thuốc giãn phế quản là điều trị cắt cơn chủ lực.","++Corticoid toàn thân sớm|2|Giảm viêm đường thở, phát huy tác dụng sau vài giờ nên cho sớm.","+Theo dõi PEF, nhịp thở, khí máu lặp lại|2|Phát hiện sớm dấu hiệu kiệt sức.","+Truyền magnesi sulfat nếu không đáp ứng sau điều trị đầu|2|Lựa chọn khi cơn nặng không đáp ứng.","+Sau khi ổn định: cứu Phế du, dạy kỹ thuật xịt thuốc và lập kế hoạch hành động hen|3|YHCT hỗ trợ giai đoạn sau, kết hợp giáo dục người bệnh.","-Kháng sinh thường quy|1|Không sốt, đờm trắng loãng, không có bằng chứng nhiễm khuẩn.","!Cho thuốc an thần (diazepam) để bớt vật vã|1|Ức chế hô hấp, nguy hiểm trong cơn hen nặng.","!Cho thuốc chẹn beta để giảm nhịp tim nhanh|1|Chống chỉ định trong hen, gây co thắt phế quản.","!Cho uống thuốc thang rồi theo dõi diễn tiến|5|Chậm dùng thuốc cắt cơn, có thể tử vong.","!Châm cứu lưu kim lâu trước khi dùng thuốc giãn phế quản|10|Không thay thế điều trị cắt cơn."],"teach":"Cơn hen nặng là cấp cứu hô hấp: oxy, giãn phế quản, corticoid trước. PaCO2 bình thường trong cơn nặng là dấu hiệu nguy hiểm. Tiền sử từng vào hồi sức là yếu tố nguy cơ tử vong. YHCT vào cuộc sau cơn: thể hàn háo, pháp ôn phế tán hàn hóa đàm, giáo dục người bệnh phòng tái phát.","hbu":{"tien_su":"Hen từ nhỏ, từng vào hồi sức vì hen cách đây 2 năm; dị ứng phấn hoa, không dị ứng thuốc. Đã xịt salbutamol 6 lần trong đợt này nhưng không đỡ, không dùng chẹn beta, aspirin hoặc thuốc kháng viêm giảm đau gần đây. Chưa có dữ kiện về điều trị kiểm soát, tiền sử gia đình hoặc chứng hư nền theo YHCT.","luoc_qua_co_quan":"Hô hấp có khó thở, khò khè, ho ít đờm trắng loãng, nói từng cụm ngắn và co kéo cơ hô hấp phụ; tim mạch có nhịp nhanh xoang. Không sốt; X-quang không ghi nhận viêm phổi hoặc tràn khí màng phổi. Tiêu hóa, tiết niệu, thần kinh và cơ xương khớp chưa có dữ kiện đầy đủ. YHCT có sợ lạnh, lưỡi nhạt rêu trắng trơn nhớt, mạch phù khẩn nhanh, phù hợp hàn đàm kèm ngoại hàn.","tom_tat":"Nam 26 tuổi, hen từ nhỏ và từng vào hồi sức, vào viện vì khó thở khò khè tăng trong 2 giờ sau hít khói bụi lúc trời lạnh, không đỡ sau xịt salbutamol 6 lần. Nhịp thở 30 lần/phút, SpO2 89%, nói 2–3 từ mỗi hơi, co kéo cơ hô hấp phụ, ran rít lan tỏa, PEF khoảng 35% dự đoán; khí máu có PaO2 58 và PaCO2 36 mmHg. Chưa có phổi câm, không sốt, X-quang không viêm phổi hay tràn khí màng phổi. Đờm trắng loãng, sợ lạnh, lưỡi nhạt rêu trắng nhớt và mạch phù khẩn gợi hàn háo.","dat_van_de":"Hội chứng tắc nghẽn đường thở cấp mức nặng kèm giảm oxy máu và nguy cơ mệt cơ hô hấp, trên nền bệnh đường thở tái diễn từ nhỏ, từng cần hồi sức. Chứng trạng YHCT gồm thở khò khè, đờm trắng loãng, sợ lạnh, rêu trắng nhớt và mạch phù khẩn, gợi ngoại hàn kèm hàn đàm trở phế.","bien_luan":"Tiền sử hen, yếu tố kích phát, khò khè lan tỏa và giảm PEF phù hợp cơn hen cấp mức nặng; PaCO2 không giảm trong bối cảnh thở nhanh là dấu đáng lo cần theo dõi kiệt sức. Viêm phổi và tràn khí màng phổi ít phù hợp vì không sốt, không tổn thương tương ứng trên X-quang; phản vệ chưa có dữ kiện da niêm, tuần hoàn hay phơi nhiễm dị nguyên cấp, còn suy tim ít gợi ý nhưng cần khảo sát nếu xuất hiện dấu bất thường. Cần theo dõi nối tiếp PEF, SpO2 và khí máu, xét nghiệm điện giải khi điều trị giãn phế quản nhiều lần; làm hô hấp ký sau ổn định nếu cần đánh giá lại. YHCT thuộc Háo suyễn, bát cương Thực–Hàn, ngoại hàn nội ẩm, thể Hàn háo; pháp ôn phế tán hàn, hóa đàm bình suyễn chỉ phối hợp sau kiểm soát cấp cứu.","sinh_ly_benh":"Viêm đường thở và tăng phản ứng phế quản gây co thắt cơ trơn, phù niêm mạc, tăng chất nhầy và hạn chế luồng khí thở ra. Mất tương xứng thông khí–tưới máu gây giảm oxy máu; tắc nghẽn kéo dài làm tăng công thở và nguy cơ kiệt sức. Theo YHCT, ngoại hàn dẫn động đàm ẩm, hàn đàm trở phế làm phế khí mất tuyên giáng, gây háo suyễn.","tien_luong":"Gần: dè dặt, có nguy cơ suy hô hấp vì PEF thấp, giảm oxy máu, đáp ứng kém tại nhà và tiền sử hồi sức. Xa: có thể kiểm soát tốt nếu điều trị nền và kỹ thuật dùng thuốc phù hợp, nhưng còn nguy cơ tái phát cơn nặng. Theo YHCT, cần đánh giá lại đàm và chứng nền khi hết cơn, không suy ra thể hư từ riêng đợt cấp này.","du_phong":"Sau ổn định, kiểm tra kỹ thuật xịt, tuân thủ điều trị kiểm soát đã được kê và có kế hoạch hành động hen; tránh khói bụi, phấn hoa và phơi lạnh. YHCT hỗ trợ khi phù hợp, không thay thuốc kiểm soát và không để khói cứu ngải kích phát khó thở. Tái khám sớm sau đợt cấp; cấp cứu khi nói khó vì hụt hơi, tím, lơ mơ hoặc thuốc cắt cơn không hiệu quả."},"nguon":["Global Initiative for Asthma, Summary Guide for Asthma Management and Prevention, 2025.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"vi-quan-thong","title":"Đau thượng vị âm ỉ","kind":"Nội","level":"Dễ","group":"noi","place":"Phòng khám Nội YHCT","clock":"09:15","name":"Bà Lê Thị Hạnh","age":52,"sex":"nữ","intro":"Khoa Nội YHCT, giường 12. Bà đến khám vì đau vùng thượng vị 3 tháng, đã tự mua thuốc giảm đau uống nhiều lần.","vitals":{"hr":78,"sbp":110,"dbp":70,"rr":18,"t":36.6,"spo2":98},"ask":[["Đau ở đâu, đau như thế nào?","Đau âm ỉ vùng thượng vị khoảng 3 tháng nay, lúc đau lúc không, không đau dữ dội.","e"],["Chườm ấm hoặc ăn uống có làm đỡ đau không?","Uống nước ấm, chườm ấm, xoa bụng thì đỡ. Lúc đói đau nhiều hơn, ăn vào đỡ một chút.","e"],["Có ợ hơi, buồn nôn hay nôn không?","Hay ợ hơi, thỉnh thoảng nôn ra nước trong. Không nôn ra máu.","e"],["Đại tiện thế nào? Phân màu gì?","Phân nhão, 2 lần mỗi ngày, màu vàng nâu, không đen.","e"],["Có sụt cân, nuốt nghẹn không?","Không sụt cân, không nuốt nghẹn.","e"],["Cảm giác nóng lạnh ra sao?","Sợ lạnh, tay chân lạnh, người mệt, ngại nói chuyện.","e"],["Có khát nước không? Thích uống nóng hay lạnh?","Không khát, chỉ thích uống nước ấm.","n"],["Đã dùng thuốc gì? Đã nội soi lần nào chưa?","Chưa nội soi lần nào. Thỉnh thoảng uống ibuprofen khi đau.","e"],["Giấc ngủ và ăn uống gần đây?","Ngủ được, ăn kém, hay đầy bụng sau ăn.","n"],["Có uống rượu, hút thuốc không?","Không uống rượu, không hút thuốc.","n"],["Kinh nguyệt?","Mãn kinh được 2 năm.","n"]],"exam":[["V","Thần sắc","Sắc mặt vàng nhợt, tinh thần mệt mỏi, thể trạng gầy.","e"],["V","Lưỡi","Chất lưỡi nhạt, bệu, có hằn răng, rêu trắng mỏng ướt.","e"],["M","Giọng nói, hơi thở","Tiếng nói nhỏ, yếu. Hơi thở không hôi.","n"],["T","Mạch","Mạch trầm, trì, nhược.","e"],["T","Sờ tay chân","Bàn tay, bàn chân lạnh.","n"],["K","Khám bụng","Thượng vị ấn đau nhẹ, bệnh nhân thích ấn. Bụng mềm, không phản ứng thành bụng.","e"],["K","Khám tim phổi","Không có dấu hiệu bất thường.","n"]],"tests":[["Công thức máu",10,"Hb 12,1 g/dL, bạch cầu bình thường.","n"],["Nội soi dạ dày",20,"Loét hang vị nhỏ 0,5 cm, đáy sạch, bờ đều, không nghi ngờ ác tính.","e"],["Test urease / hơi thở tìm H. pylori",15,"Dương tính.","e"],["CT ngực bụng có cản quang",40,"Không thấy bất thường. Không có chỉ định ở ca này.","w"],["Điện tâm đồ",3,"Nhịp xoang, không bất thường.","n"]],"opt":{"ydx":["+Loét dạ dày có nhiễm H. pylori","Hội chứng ruột kích thích","Ung thư dạ dày","Viêm tụy cấp"],"bd":["+Vị quản thống","Hung tý","Phúc thống","Tiết tả"],"bc":["+Lý – Hư – Hàn","Lý – Thực – Nhiệt","Biểu – Thực – Hàn","Lý – Hư – Nhiệt"],"the":["+Tỳ vị hư hàn","Can khí phạm vị","Vị âm hư","Thực tích đình trệ","Huyết ứ trở lạc"],"phap":["+Ôn trung kiện tỳ, hòa hoãn chỉ thống","Sơ can lý khí","Thanh nhiệt tả hỏa","Hoạt huyết hóa ứ","Dưỡng âm ích vị"],"phuong":["+Hoàng kỳ kiến trung thang","+Lý trung hoàn","Sài hồ sơ can tán","Ích vị thang","Bạch hổ thang"],"huyet":["+Trung quản","+Túc tam lý","+Tỳ du","+Vị du","+Nội quan","Thái xung","Hợp cốc","Đại chùy","Phong trì"]},"actions":["+Hướng dẫn ăn chín, ấm, chia nhỏ bữa|2|Chế độ ăn hợp với tỳ vị hư hàn.","+Dặn ngừng thuốc kháng viêm giảm đau (NSAID)|1|NSAID làm loét nặng thêm.","+Điều trị diệt H. pylori theo phác đồ YHHĐ|2|Loét có H. pylori cần diệt khuẩn.","+Cứu ngải vùng Trung quản, Quan nguyên|10|Ôn dương, tán hàn.","+Hẹn tái khám, nội soi kiểm tra sau điều trị|1|Theo dõi liền sẹo loét.","!Cho thuốc thanh nhiệt hàn lương (Hoàng liên, Thạch cao)|2|Thuốc hàn lương làm tổn thương thêm dương khí của tỳ vị.","!Truyền kháng sinh phổ rộng đường tĩnh mạch|3|Không có chỉ định, không phải nhiễm khuẩn toàn thân."],"teach":"Điểm mấu chốt: đau thích ấn, thích ấm, sợ lạnh, lưỡi nhạt bệu rêu trắng, mạch trầm trì nhược cho ra thể Tỳ vị hư hàn. Cần loại trừ dấu hiệu báo động (sụt cân, phân đen, nuốt nghẹn) và xác nhận nguyên nhân bằng nội soi, H. pylori. Thuốc hàn lương là bẫy thường gặp.","hbu":{"tien_su":"Bản thân chưa nội soi trước đợt này, thỉnh thoảng tự uống ibuprofen khi đau; không uống rượu, không hút thuốc, mãn kinh 2 năm. Chưa có dữ kiện về loét hoặc điều trị H. pylori trước đây, dị ứng và tiền sử gia đình ung thư dạ dày. Những biểu hiện sợ lạnh, ăn kém và phân nhão hiện tại phù hợp xem xét tỳ vị hư hàn, nhưng chưa rõ có từ trước hay mới xuất hiện.","luoc_qua_co_quan":"Tiêu hóa có đau thượng vị, ợ hơi, đầy bụng sau ăn, ăn kém, đôi lúc nôn nước trong và phân nhão; không nôn máu, phân đen, nuốt nghẹn hay sụt cân. Khám tim phổi không bất thường; ngủ được, nhưng chưa có khai thác thần kinh đầy đủ. Tiết niệu và cơ xương khớp chưa có dữ kiện. YHCT có mệt, tiếng nói yếu, sợ lạnh, chi lạnh, thích ấm và thích ấn.","tom_tat":"Nữ 52 tuổi, đau thượng vị âm ỉ từng đợt 3 tháng, tăng khi đói, giảm phần nào khi ăn, chườm ấm hoặc xoa bụng, kèm ợ hơi, ăn kém và phân nhão. Khám bụng mềm, thượng vị ấn đau nhẹ và thích ấn, không phản ứng thành bụng; nội soi thấy loét hang vị 0,5 cm, đáy sạch, bờ đều, xét nghiệm H. pylori dương tính. Không nôn máu, phân đen, sụt cân hoặc nuốt nghẹn; có dùng ibuprofen. Lưỡi nhạt bệu hằn răng, rêu trắng ướt và mạch trầm trì nhược phù hợp tỳ vị hư hàn.","dat_van_de":"Đau thượng vị kéo dài kèm triệu chứng khó tiêu, tổn thương loét trên nội soi và yếu tố dùng thuốc có nguy cơ tổn thương niêm mạc, chưa ghi nhận dấu xuất huyết hoặc kích thích phúc mạc. Chứng trạng YHCT gồm đau âm ỉ thích ấm, thích ấn, ăn kém, phân nhão, chi lạnh và dấu hư hàn của tỳ vị.","bien_luan":"Ổ loét hang vị trên nội soi và xét nghiệm H. pylori dương tính xác định loét dạ dày có nhiễm H. pylori; ibuprofen có thể góp phần gây tổn thương nhưng không phủ định nguyên nhân nhiễm khuẩn. Khó tiêu chức năng không phải chẩn đoán chính khi đã có ổ loét; trào ngược ít gợi ý vì chưa ghi nhận ợ nóng hay trớ chua, còn ung thư dạ dày chưa thể loại trừ hoàn toàn bằng hình dạng nội soi, cần đối chiếu sinh thiết và theo dõi lành loét. Xuất huyết hoặc thủng hiện ít gợi ý vì không nôn máu, phân đen hay phản ứng thành bụng; cần nội soi kiểm tra và xét nghiệm xác nhận tiệt trừ H. pylori sau điều trị. YHCT thuộc Vị quản thống, Lý–Hư–Hàn, thể Tỳ vị hư hàn; pháp ôn trung kiện tỳ, hòa hoãn chỉ thống phối hợp với điều trị nguyên nhân.","sinh_ly_benh":"H. pylori gây viêm và suy giảm hàng rào bảo vệ niêm mạc, làm mất cân bằng giữa yếu tố bảo vệ và tác động của acid–pepsin. NSAID ức chế tổng hợp prostaglandin, giảm bảo vệ niêm mạc và tăng nguy cơ loét hoặc biến chứng. Theo YHCT, tỳ vị hư hàn làm vận hóa suy, trung tiêu không được ôn dưỡng, gây đau thích ấm, ăn kém và phân nhão.","tien_luong":"Gần: tương đối thuận lợi nếu điều trị đúng vì ổ loét nhỏ, đáy sạch và chưa có dấu biến chứng cấp. Xa: phụ thuộc tiệt trừ H. pylori, ngừng tự dùng NSAID và xác nhận lành loét; vẫn cần loại trừ tổn thương ác tính theo chỉ định. Theo YHCT, triệu chứng hư hàn có thể cải thiện khi phục hồi ăn uống nhưng không thay thế kiểm tra ổ loét.","du_phong":"Tuân thủ phác đồ diệt H. pylori đã được kê, không tự dùng ibuprofen hoặc NSAID khác; ăn điều độ, chọn thức ăn dung nạp tốt, giữ vệ sinh tay và thực phẩm. Theo YHCT, ăn chín ấm, tránh thức ăn lạnh nếu làm tăng triệu chứng; cứu ngải chỉ do người có chuyên môn thực hiện. Tái khám để kiểm tra tiệt trừ và nội soi theo hẹn; cấp cứu nếu nôn máu, phân đen, choáng hoặc đau bụng đột ngột dữ dội."},"nguon":["American College of Gastroenterology, ACG Clinical Guideline: Treatment of Helicobacter pylori Infection, 2024.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"tiet-ta","title":"Tiêu chảy nước 8 lần sau gỏi hải sản","kind":"Nội Đông Tây y","level":"Dễ","group":"noi","place":"Phòng cấp cứu","clock":"08:30","name":"Chị Hồ Thị Thu","age":34,"sex":"nữ","intro":"Phòng cấp cứu, 08:30. Chị tiêu chảy 8 lần từ đêm qua, đau quặn bụng, chóng mặt khi đứng dậy. Người ăn cùng cũng bị.","vitals":{"hr":104,"sbp":100,"dbp":65,"rr":20,"t":37.8,"spo2":98},"ask":[["Phân thế nào, mấy lần, có máu hay nhầy không?","Phân lỏng như nước, vàng, mùi thối khắm, không máu, không nhầy. 8 lần từ đêm qua.","e"],["Có đau quặn bụng, mót rặn không?","Đau quặn quanh rốn, không mót rặn.","n"],["Hôm qua ăn gì? Người cùng ăn có bị không?","Ăn gỏi hải sản, nem chua. Hai người cùng ăn cũng bị tiêu chảy.","e"],["Có nôn, sốt không?","Nôn 2 lần, sốt nhẹ.","n"],["Nước tiểu, khát nước?","Nước tiểu ít, sẫm màu. Khát nhiều, thích uống mát.","e"],["Có chóng mặt, ngất khi đứng dậy không?","Chóng mặt khi đứng, chưa ngất.","e"]],"exam":[["K","Dấu mất nước","Môi khô, mắt hơi trũng, véo da mất chậm.","e"],["K","Khám bụng","Ấn đau lan tỏa nhẹ, nhu động ruột tăng, không có phản ứng thành bụng.","e"],["V","Lưỡi","Chất lưỡi đỏ, rêu vàng nhớt.","e"],["T","Mạch","Mạch hoạt, sác.","e"],["M","Mùi phân","Mùi thối khắm.","n"]],"tests":[["Điện giải đồ",10,"Na 134, K 3,3 mmol/L.","e"],["Công thức máu, CRP",10,"Bạch cầu 11.000, CRP hơi tăng.","n"],["Soi phân, cấy phân",15,"Hồng cầu không có, bạch cầu ít. Cấy phân có kết quả sau 48 giờ.","n"],["CT bụng",30,"Không có chỉ định.","w"]],"opt":{"ydx":["+Tiêu chảy cấp nhiễm khuẩn, mất nước mức vừa","Viêm đại tràng giả mạc","Hội chứng ruột kích thích","Viêm ruột thừa","Tả"],"bd":["+Tiết tả","~Hoắc loạn","Lỵ","Táo bón"],"bc":["+Lý – Thực – Nhiệt","Lý – Hư – Hàn","Biểu – Thực – Hàn","Biểu – Hư"],"the":["+Thấp nhiệt","Hàn thấp","Tỳ vị hư nhược","Thận dương hư"],"phap":["+Thanh nhiệt lợi thấp, chỉ tả","Ôn trung kiện tỳ","Ôn thận cố sáp","Sơ can kiện tỳ"],"phuong":["+Cát căn cầm liên thang","Lý trung thang","Sâm linh bạch truật tán","Tứ thần hoàn","Thống tả yếu phương"],"huyet":["+Thiên khu","+Túc tam lý","+Thượng cự hư","+Khúc trì","+Âm lăng tuyền","Quan nguyên","Mệnh môn","Thận du","Bách hội"]},"actions":["++Đánh giá mức độ mất nước, đo mạch huyết áp lặp lại|1|Quyết định đường bù dịch.","++Bù dịch ORS đường uống, hoặc Ringer lactat tĩnh mạch nếu không uống được|2|Bù dịch là điều trị quan trọng nhất.","+Theo dõi nước tiểu, bù kali theo điện giải|2|Kali 3,3 cần theo dõi và bù.","+Ăn cháo loãng, tiếp tục ăn sớm khi dung nạp|2|Phục hồi niêm mạc ruột.","+Châm Thiên khu, Túc tam lý, Thượng cự hư hỗ trợ|5|Điều hòa vận hóa đường ruột.","-Kháng sinh nhóm quinolon cho mọi ca tiêu chảy|2|Phần lớn tiêu chảy cấp không cần kháng sinh.","!Cho thuốc cầm tiêu chảy mạnh (loperamid) khi có sốt|1|Có thể giữ độc tố, nguy cơ biến chứng ở tiêu chảy nhiễm khuẩn có sốt.","!Nhịn ăn, nhịn uống 24 giờ|1|Làm mất nước nặng thêm.","!Chỉ cho uống thuốc thang, không bù dịch|3|Mất nước tiến triển, nguy hiểm."],"teach":"Tiêu chảy cấp xử trí đầu tiên là bù dịch. Thể thấp nhiệt: phân thối khắm, khát, lưỡi đỏ rêu vàng nhớt. Cầm tiêu chảy mạnh khi có sốt có thể có hại, kháng sinh không dùng thường quy. Hoắc loạn là danh pháp gần nghĩa, chỉ đúng một phần ở ca này.","hbu":{"tien_su":"Có ăn gỏi hải sản và nem chua trước khởi phát; hai người cùng ăn cũng bị tiêu chảy, gợi phơi nhiễm chung. Chưa có dữ kiện về bệnh nền, dị ứng, thuốc gần đây hoặc tiền sử gia đình. Theo YHCT, ăn uống không bảo đảm vệ sinh là yếu tố khởi phát cần xem xét, chưa đủ kết luận cơ địa thấp nhiệt sẵn có.","luoc_qua_co_quan":"Tiêu hóa có tiêu chảy nước 8 lần, đau quặn quanh rốn và nôn hai lần, không máu, nhầy hay mót rặn; bụng không phản ứng thành bụng. Tim mạch có mạch nhanh; thần kinh có chóng mặt khi đứng, chưa ngất. Tiết niệu có tiểu ít sẫm; hô hấp và cơ xương khớp chưa có dữ kiện triệu chứng. YHCT có khát thích mát, phân thối khắm, lưỡi đỏ rêu vàng nhớt và mạch hoạt sác.","tom_tat":"Nữ 34 tuổi, tiêu chảy nước 8 lần từ đêm sau ăn gỏi hải sản và nem chua, hai người cùng ăn có triệu chứng tương tự, kèm đau quặn quanh rốn, nôn và sốt nhẹ. Mạch 104 lần/phút, huyết áp 100/65 mmHg, môi khô, mắt hơi trũng, véo da mất chậm, tiểu ít và chóng mặt khi đứng; Na 134, K 3,3 mmol/L. Không phân máu, nhầy, mót rặn, ngất hoặc phản ứng thành bụng. Phân mùi thối khắm, khát thích mát, lưỡi đỏ rêu vàng nhớt và mạch hoạt sác phù hợp thấp nhiệt.","dat_van_de":"Tiêu chảy cấp liên quan bữa ăn chung, kèm nôn, sốt nhẹ, mất nước mức vừa và rối loạn điện giải, chưa có biểu hiện lỵ hoặc bụng ngoại khoa. Chứng trạng YHCT gồm tiết tả kèm nôn, thấp nhiệt ở trường vị và hao tổn tân dịch.","bien_luan":"Khởi phát cấp sau bữa ăn nguy cơ, có người cùng ăn mắc bệnh, sốt nhẹ và phản ứng viêm hỗ trợ chẩn đoán tiêu chảy cấp nhiễm khuẩn; các dấu khô môi, mắt trũng, véo da mất chậm, tiểu ít phù hợp mất nước mức vừa. Viêm ruột do virus hoặc độc tố thức ăn vẫn có thể gây bệnh cảnh tương tự, cần đối chiếu thời gian ủ bệnh và kết quả cấy phân; lỵ xâm lấn ít gợi ý vì không máu, nhầy hay mót rặn, còn tả do vi khuẩn cần xét nghiệm khi có yếu tố dịch tễ, không suy từ bệnh danh YHCT. Theo dõi điện giải, chức năng thận và nước tiểu, hoàn tất xét nghiệm phân để định hướng tác nhân, ưu tiên bù dịch và không mặc định cần kháng sinh. YHCT thuộc Tiết tả, có nôn–tả nên có thể liên hệ Hoắc loạn theo nghĩa cổ truyền, bát cương Lý–Thực–Nhiệt, thể Thấp nhiệt; pháp thanh nhiệt lợi thấp, chỉ tả phối hợp sau bảo đảm bù dịch.","sinh_ly_benh":"Tác nhân đường ruột hoặc độc tố làm tăng tiết dịch, giảm hấp thu và có thể gây viêm niêm mạc, dẫn đến tiêu chảy. Mất nước và điện giải qua phân, nôn làm giảm thể tích tuần hoàn, gây chóng mặt tư thế, tiểu ít và hạ kali. Theo YHCT, thấp nhiệt trở ngại trường vị và chức năng vận hóa, gây nôn–tả, đồng thời làm hao tân dịch.","tien_luong":"Gần: thường thuận lợi nếu bù dịch kịp thời, nhưng có nguy cơ giảm tưới máu thận và rối loạn điện giải nếu tiếp tục mất dịch. Xa: thường hồi phục hoàn toàn, cần đánh giá lại nếu tiêu chảy kéo dài hoặc tái diễn. Theo YHCT, theo dõi sự lui của thấp nhiệt và phục hồi tân dịch cùng các chỉ dấu lâm sàng hiện đại.","du_phong":"Ăn chín uống sạch, tránh hải sản sống, rửa tay và phòng nhiễm chéo; thông báo cơ sở y tế về nhóm người cùng mắc để đánh giá chùm ca liên quan thực phẩm. Pha ORS đúng hướng dẫn, tiếp tục ăn khi dung nạp; YHCT chỉ hỗ trợ, không dùng biện pháp chỉ tả để che lấp mất nước. Tái khám theo hẹn hoặc sớm hơn nếu không cải thiện; cấp cứu khi không uống được, tiểu rất ít, ngất, phân máu hoặc đau bụng tăng."},"nguon":["Infectious Diseases Society of America, Clinical Practice Guidelines for the Diagnosis and Management of Infectious Diarrhea, 2017.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020 — khung tham chiếu kết hợp; cần đối chiếu nguồn chuyên biệt về Tiết tả và Hoắc loạn."],"status":"draft"},{"id":"huyen-vung","title":"Chóng mặt đau đầu, huyết áp 168/102","kind":"Nội Đông Tây y","level":"Trung bình","group":"noi","place":"Khoa Nội, giường 8","clock":"10:00","name":"Bà Trương Thị Lan","age":58,"sex":"nữ","intro":"Khoa Nội, giường 8. Bà kể mấy ngày nay chóng mặt, đau đầu vùng thái dương, hay cáu gắt, ngủ kém.","vitals":{"hr":84,"sbp":168,"dbp":102,"rr":18,"t":36.7,"spo2":98},"ask":[["Chóng mặt, đau đầu thế nào, khi nào nặng thêm?","Chóng mặt, đau đầu thái dương, nặng thêm khi tức giận hoặc thiếu ngủ.","e"],["Có yếu liệt, nói khó, nhìn đôi, đau ngực, khó thở không?","Không có.","e"],["Tiền sử tăng huyết áp, dùng thuốc thế nào?","Tăng huyết áp 8 năm, uống amlodipin nhưng hay quên.","e"],["Có nóng nảy, miệng đắng, mắt đỏ không?","Hay cáu, miệng đắng, mắt đỏ.","e"],["Giấc ngủ, đại tiểu tiện?","Mất ngủ, hay mơ. Táo bón, tiểu vàng.","n"],["Ăn mặn, rượu, hút thuốc?","Ăn mặn, không rượu, không hút thuốc.","n"],["Kinh nguyệt?","Mãn kinh 6 năm.","n"]],"exam":[["K","Đo huyết áp đúng kỹ thuật, hai tay","Hai tay 168/102 và 166/100.","e"],["K","Khám thần kinh","Không có dấu thần kinh khu trú. Dây thần kinh sọ bình thường.","e"],["K","Khám tim phổi","Tim đều, phổi bình thường.","n"],["V","Sắc mặt, mắt, lưỡi","Mặt đỏ, mắt đỏ. Lưỡi đỏ, rêu vàng mỏng.","e"],["T","Mạch","Mạch huyền, sác.","e"]],"tests":[["Điện tâm đồ",3,"Dày thất trái nhẹ.","e"],["Điện giải, creatinin, đường huyết, lipid máu",10,"Cholesterol toàn phần 6,2 mmol/L. Chức năng thận bình thường.","e"],["Tổng phân tích nước tiểu",10,"Chưa có đạm niệu.","n"],["CT sọ não",20,"Không có chỉ định khi không có dấu thần kinh khu trú.","w"]],"opt":{"ydx":["+Tăng huyết áp độ 2 chưa kiểm soát, không có tổn thương cơ quan đích cấp","Cấp cứu tăng huyết áp","Đột quỵ thiếu máu não","Chóng mặt tư thế kịch phát lành tính","Thiếu máu"],"bd":["+Huyễn vựng","Trúng phong","Đầu thống do ngoại cảm","Tâm quý"],"bc":["+Lý – Thực kiêm Hư (bản hư tiêu thực)","Biểu – Thực – Hàn","Lý – Hư – Hàn","Biểu – Hư"],"the":["+Can dương thượng cang","Đàm thấp trở trệ","Khí huyết lưỡng hư","Thận tinh bất túc"],"phap":["+Bình can tiềm dương, tư âm","Kiện tỳ hóa đàm","Bổ khí dưỡng huyết","Bổ thận ích tủy"],"phuong":["+Thiên ma câu đằng ẩm","~Long đởm tả can thang","Bán hạ bạch truật thiên ma thang","Quy tỳ thang","Lục vị địa hoàng hoàn"],"huyet":["+Phong trì","+Thái xung","+Hành gian","+Thái khê","+Tam âm giao","Quan nguyên","Mệnh môn","Tỳ du","Đại chùy"]},"actions":["+Đo lại huyết áp ngồi nghỉ 5 phút, ghi nhật ký huyết áp tại nhà|2|Xác nhận mức huyết áp nền.","+Điều chỉnh thuốc hạ áp YHHĐ, dặn uống đều mỗi ngày|2|Nền tảng điều trị, thuốc cổ truyền không thay thế.","+Giảm muối, ngủ đủ, giữ tinh thần thư thái|2|Can dương dễ vượng khi thiếu ngủ và tức giận.","+Châm Phong trì, Thái xung, Hành gian, Thái khê|5|Bình can tiềm dương, hỗ trợ giảm triệu chứng.","-Nhập viện cấp cứu truyền thuốc hạ áp|3|Không có tổn thương cơ quan đích cấp, hạ áp từ từ bằng thuốc uống.","-Chụp CT sọ ngay|20|Không có dấu thần kinh khu trú.","!Ngậm nifedipine dưới lưỡi để hạ áp nhanh|1|Hạ áp đột ngột có thể gây thiếu máu cơ quan.","!Ngưng thuốc tây, chỉ dùng thuốc thang|2|Nguy cơ huyết áp tăng vọt, biến chứng tim mạch, não."],"teach":"Tăng huyết áp không có tổn thương cơ quan đích cấp thì hạ áp từ từ, không chạy theo con số. Thể can dương thượng cang: chóng mặt đau đầu khi tức giận, mắt đỏ, miệng đắng, lưỡi đỏ, mạch huyền sác. Kết hợp Đông Tây y: thuốc hạ áp tây y giữ nền, YHCT điều chỉnh triệu chứng và lối sống. Ngưng thuốc tây là bẫy nguy hiểm.","hbu":{"tien_su":"Tăng huyết áp 8 năm, đang dùng amlodipin nhưng hay quên; ăn mặn, không uống rượu, không hút thuốc, mãn kinh 6 năm. Chưa có dữ kiện về tiền sử gia đình, biến
