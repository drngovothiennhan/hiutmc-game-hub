c sẹo."},"nguon":["Bộ Y tế: Hướng dẫn chẩn đoán và điều trị bỏng.","American Burn Association: Advanced Burn Life Support (ABLS) Provider Manual, 2018.","International Society for Burn Injuries: ISBI Practice Guidelines for Burn Care, 2016.","ATLS 10th edition, American College of Surgeons, 2018: chương Thermal Injuries."],"status":"nhap"},{"id":"ngoai-chan-thuong-006","title":"Đạp phải sắt gỉ, vết rách lòng bàn chân dính bùn đất","kind":"Ngoại","level":"Dễ","group":"ngoai","name":"Anh L. V. B.","age":45,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Nam nông dân đến phòng khám ngoại sau 8 giờ vì vết thương lòng bàn chân phải do đạp phải mảnh sắt gỉ ngoài ruộng, chưa đi khám sớm.","vitals":{"hr":82,"sbp":128,"dbp":80,"rr":18,"t":36.8,"spo2":99},"ask":[["Vết thương do vật gì, xảy ra khi nào, ở đâu?","Đạp phải mảnh sắt gỉ ngoài ruộng cách đây 8 giờ; chân dính bùn đất, mới rửa qua bằng nước giếng.","e"],["Đã tiêm phòng uốn ván bao giờ chưa, có nhớ số mũi không?","Không nhớ đã tiêm lần nào, không có sổ tiêm chủng.","e"],["Có cứng hàm, khó há miệng, đau gáy, co cứng cơ không?","Không; ăn uống nói chuyện bình thường.","e"],["Vết thương hiện đau, sưng đỏ, chảy mủ hay có mùi hôi không?","Đau nhiều khi đi lại, sưng nhẹ quanh vết, chưa chảy mủ.","e"],["Có tiền sử dị ứng thuốc hoặc huyết thanh ngựa không?","Chưa từng dị ứng thuốc; chưa từng tiêm huyết thanh.","e"],["Bệnh nền (đái tháo đường, bệnh mạch máu, suy giảm miễn dịch)?","Không bệnh nền.","n"],["Có sốt, rét run hay mệt mỏi không?","Không.","n"]],"exam":[["K","Quan sát và sờ vết thương lòng bàn chân phải","Vết rách dài 4 cm, sâu 3 cm, bờ dập nát, dính nhiều bùn đất và mảnh sắt gỉ nhỏ; chảy máu ít, quanh vết sưng nhẹ.","e"],["K","Mạch và thần kinh bàn chân","Mạch chày sau và mu chân rõ, cảm giác bàn chân còn, cử động các ngón tốt.","e"],["K","Khám tìm dấu hiệu uốn ván (hàm, cổ, bụng)","Há miệng được 4 cm, cổ mềm, bụng mềm, không co cứng, không có co giật.","e"],["K","Dấu hiệu nhiễm khuẩn tại chỗ","Quanh vết đỏ nhẹ dưới 1 cm, không có mủ, không có tiếng lép bép dưới da, không hạch bẹn.","e"],["K","Khám toàn thân","Tỉnh táo, mạch 82, không sốt.","n"]],"tests":[["X-quang bàn chân phải thẳng, nghiêng",10,"Có dị vật kim loại dài khoảng 5 mm trong phần mềm lòng bàn chân, không gãy xương.","e"],["Đường huyết mao mạch",10,"5,6 mmol/L.","e"],["Công thức máu",10,"Bạch cầu 8,9 G/L; Hb 14,3 g/dL.","n"],["Thử phản ứng da với huyết thanh kháng độc tố uốn ván",10,"Âm tính.","e"],["Định lượng kháng thể kháng độc tố uốn ván trong máu để quyết định có tiêm hay không",10,"Không cần chờ kết quả; làm chậm dự phòng khi nguy cơ cao.","w"]],"opt":{"ydx":["Vết thương sạch, nhỏ, nguy cơ uốn ván thấp","Uốn ván toàn thân giai đoạn khởi phát","+Vết thương phần mềm bàn chân phải dập nát, nhiễm bẩn, nguy cơ cao uốn ván, tiền sử tiêm phòng không rõ, chưa có triệu chứng uốn ván","Viêm mô hoại tử đã hình thành"],"du_phong_uon_van":["Chỉ tiêm vắc xin một mũi","Không cần dự phòng vì chưa có triệu chứng","Chỉ tiêm kháng độc tố vì đã có vắc xin","+Kháng độc tố uốn ván (huyết thanh SAT sau thử phản ứng hoặc globulin miễn dịch người) kèm vắc xin hấp phụ ở hai vị trí khác nhau, hoàn thành lịch tiêm"],"xu_tri_vet_thuong":["Khâu kín ngay để giảm nhiễm khuẩn","Chỉ sát khuẩn bề mặt rồi băng kín","Đắp tro bếp hoặc lá cây cầm máu","+Rửa nhiều nước sạch, cắt lọc mô dập, lấy dị vật, để hở, khâu thì đầu muộn nếu cần"]},"actions":["++Rửa nhiều nước muối sinh lý hoặc nước sạch, cắt lọc mô dập nát, lấy dị vật, để hở|2|Vết thương bẩn, dập, sâu, dị vật là môi trường kỵ khí cho Clostridium tetani; làm sạch và cắt lọc là biện pháp quan trọng nhất.","++Tiêm kháng độc tố uốn ván và vắc xin hấp phụ uốn ván 0,5 mL ở hai vị trí khác nhau|2|Tiền sử không rõ và vết thương nguy cơ cao cần cả miễn dịch thụ động và chủ động.","+Thử phản ứng da trước khi tiêm huyết thanh kháng độc tố, chuẩn bị xử trí phản vệ|2|Huyết thanh nguồn gốc ngựa có thể gây phản vệ.","+Kháng sinh theo kinh nghiệm cho vết thương bẩn (như amoxicillin kết hợp clavulanat) trong 5 đến 7 ngày|2|Nguy cơ nhiễm khuẩn phối hợp do bùn đất.","+Băng vô khuẩn, hẹn thay băng sau 48 giờ, khâu thì đầu muộn khi sạch nếu cần|2|Vết thương nhiễm bẩn không khâu kín ban đầu.","+Hẹn mũi vắc xin thứ hai sau 4 tuần, mũi thứ ba sau 6 đến 12 tháng; dặn quay lại ngay nếu cứng hàm, đau cơ, sốt hoặc vết thương sưng đau tăng|2|Hoàn thành lịch tiêm tạo miễn dịch lâu dài; phát hiện sớm biến chứng.","!Khâu kín ngay vết thương bẩn bờ dập rồi bó chặt|0|Nhốt vi khuẩn kỵ khí, tăng nguy cơ uốn ván và hoại thư sinh hơi.","!Chỉ tiêm vắc xin mà không tiêm kháng độc tố vì ngại tiêm hai mũi|0|Vắc xin cần nhiều ngày mới tạo kháng thể; không bảo vệ ngay trong thời gian ủ bệnh.","!Đắp tro bếp hoặc lá cây lên vết thương để cầm máu|0|Đưa thêm vi khuẩn và bào tử vào vết thương."],"teach":"Vết thương bẩn, dập, có dị vật và tiền sử tiêm phòng không rõ là nguy cơ cao uốn ván: ngoài làm sạch và cắt lọc, cần tiêm đồng thời kháng độc tố và vắc xin ở hai vị trí khác nhau. Luôn hẹn tiêm đủ mũi và dặn dấu hiệu cần quay lại.","hbu":{"hanh_chinh":"Anh L. V. B., nam, 45 tuổi, nông dân; khám tại phòng khám ngoại.","ly_do_vao_vien":"Vết thương lòng bàn chân phải do đạp phải sắt gỉ.","benh_su":"Cách 8 giờ, anh đạp phải mảnh sắt gỉ ngoài ruộng, rách lòng bàn chân phải, chảy máu ít, dính bùn đất. Tự rửa bằng nước giếng, băng khăn sạch, đi lại đau nên đến khám. Không cứng hàm, không sốt, chưa chảy mủ.","tien_su":"Không bệnh nền, không dị ứng thuốc; chưa từng tiêm huyết thanh. Không có sổ tiêm chủng và không nhớ đã tiêm phòng uốn ván.","luoc_qua_co_quan":"Ăn uống và nói chuyện bình thường, không đau gáy, không co cứng cơ.","kham_hien_tai":"Mạch 82, huyết áp 128/80 mmHg, nhịp thở 18, nhiệt độ 36,8 độ C, SpO2 99%. Vết rách lòng bàn chân phải 4 cm, sâu 3 cm, bờ dập nát, dính bùn, mảnh sắt gỉ; mạch và cảm giác bàn chân bình thường. Không cứng hàm, không co cứng cơ.","can_lam_sang":"X-quang bàn chân phải: dị vật kim loại khoảng 5 mm trong phần mềm, không gãy xương. Bạch cầu 8,9 G/L; đường huyết 5,6 mmol/L. Thử phản ứng da với huyết thanh kháng độc tố: âm tính.","tom_tat":"Nam 45 tuổi, vết thương rách sâu lòng bàn chân phải do sắt gỉ, nhiều bùn đất, đến muộn 8 giờ, tiền sử tiêm phòng uốn ván không rõ; chưa có dấu hiệu uốn ván hay nhiễm khuẩn lan rộng; có dị vật kim loại trong phần mềm.","dat_van_de":"Vết thương nhiễm bẩn có nguy cơ cao uốn ván; cần làm sạch và lấy dị vật; dự phòng uốn ván chủ động và thụ động; nguy cơ nhiễm khuẩn phối hợp.","chan_doan_so_bo":"Vết thương phần mềm lòng bàn chân phải nhiễm bẩn, nguy cơ uốn ván.","bien_luan":"Vết thương sâu, dập nát, nhiều đất và vật gỉ, đến muộn thuộc nhóm vết thương dễ bị uốn ván. Tiền sử tiêm không rõ nên coi như chưa được tiêm đủ. Chưa có cứng hàm, co cứng cơ nên chưa phải uốn ván khởi phát, cần dự phòng chủ động và thụ động. Dị vật kim loại và mô dập là nguồn nhiễm khuẩn kéo dài nên phải cắt lọc và lấy bỏ.","sinh_ly_benh":"Bào tử Clostridium tetani có trong đất, phân động vật; vào vết thương dập nát thiếu oxy, nảy mầm thành vi khuẩn và sản xuất độc tố tetanospasmin. Độc tố theo dây thần kinh vận động lên tủy sống, ức chế giải phóng chất dẫn truyền ức chế, gây tăng trương lực và co cứng cơ. Kháng độc tố trung hòa độc tố tự do chưa vào thần kinh; vắc xin tạo miễn dịch chủ động.","chan_doan_phan_biet":"Vết thương nhiễm khuẩn thông thường; hoại thư sinh hơi do Clostridium khác; viêm mô tế bào, viêm mô hoại tử; dị vật tồn lưu; uốn ván khởi phát.","chan_doan_xac_dinh":"Vết thương phần mềm lòng bàn chân phải dập nát, nhiễm bẩn, có dị vật kim loại; nguy cơ cao uốn ván (chưa rõ tiền sử tiêm), chưa có triệu chứng uốn ván.","dieu_tri":"Rửa nhiều nước sạch, cắt lọc mô dập, lấy dị vật, để hở và băng vô khuẩn. Tiêm kháng độc tố uốn ván (huyết thanh sau thử phản ứng hoặc globulin miễn dịch người) kèm vắc xin hấp phụ 0,5 mL tiêm bắp ở vị trí khác. Kháng sinh 5 đến 7 ngày. Hẹn thay băng sau 48 giờ, khâu thì đầu muộn nếu cần. Hẹn mũi vắc xin thứ hai sau 4 tuần, mũi thứ ba sau 6 đến 12 tháng.","tien_luong":"Tốt nếu làm sạch triệt để, dự phòng đầy đủ và tuân thủ tái khám; uốn ván khởi phát có nguy cơ tử vong cao nên phòng ngừa là then chốt.","du_phong":"Tiêm đủ vắc xin uốn ván và nhắc lại theo lịch quốc gia; xử trí vết thương đúng và sớm; đi giày bảo hộ khi lao động ngoài ruộng; hướng dẫn cộng đồng không đắp lá, tro lên vết thương."},"nguon":["Bộ Y tế: Hướng dẫn chẩn đoán và điều trị bệnh uốn ván; Chương trình tiêm chủng mở rộng quốc gia.","WHO: Tetanus vaccines, position paper, Weekly Epidemiological Record, 2017.","CDC: Updated Recommendations for Use of Tetanus Toxoid, Reduced Diphtheria Toxoid, and Acellular Pertussis Vaccine (MMWR 2018) và hướng dẫn xử trí vết thương.","Giáo trình Ngoại bệnh lý, Đại học Y Hà Nội: bài Vết thương phần mềm."],"status":"nhap"},{"id":"ngoai-chan-thuong-007","title":"Xe tải đè, đau bụng dưới, huyết áp 82/48","kind":"Ngoại","level":"Khó","group":"ngoai","name":"Chị V. T. N.","age":26,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Nữ công nhân được đưa vào phòng cấp cứu 50 phút sau tai nạn giao thông, bị xe tải đè lên vùng chậu, đau bụng dưới dữ dội, lạnh, huyết áp thấp.","vitals":{"hr":128,"sbp":82,"dbp":48,"rr":28,"t":36,"spo2":94},"ask":[["Cơ chế tai nạn là gì?","Đi xe máy bị xe tải đè lên vùng chậu và bụng dưới khi ngã.","e"],["Đau ở đâu, có đi tiểu được không?","Đau dữ dội vùng bụng dưới, bẹn hai bên; chưa đi tiểu từ lúc tai nạn.","e"],["Có máu ở âm hộ, hậu môn hoặc nước tiểu không?","Thấy ít máu ở vùng âm hộ; chưa thấy máu ở hậu môn.","e"],["Có mất ý thức hoặc đập đầu không?","Tỉnh, không đập đầu.","e"],["Có thai không, kỳ kinh gần nhất?","Kinh cuối cách 2 tuần, không có thai theo lời kể.","e"],["Bệnh nền, dị ứng, thuốc đang dùng?","Khỏe mạnh, không dị ứng, không dùng thuốc.","n"],["Bữa ăn gần nhất?","Ăn sáng cách đây 6 giờ.","n"]],"exam":[["K","Đánh giá ABCDE","Đường thở thông, nói được, thở nhanh 28 lần/phút; da tái lạnh ẩm, thời gian đầy mao mạch 4 giây; Glasgow 14.","e"],["K","Khung chậu: quan sát, ép một lần nhẹ hai cánh chậu","Bầm máu vùng bẹn đùi hai bên, vùng mu; ép nhẹ một lần hai cánh chậu gây đau dữ dội và cảm giác di động bất thường; chân phải xoay ngoài.","e"],["K","Bụng","Chướng nhẹ, đau lan tỏa vùng dưới, không co cứng rõ.","e"],["K","Âm hộ, niệu đạo, trực tràng","Ít máu ở âm hộ và lỗ niệu đạo; khám trực tràng không có máu, không có mảnh xương.","e"],["K","Mạch và thần kinh hai chi dưới","Mạch bẹn và mu chân hai bên yếu nhưng sờ được; cảm giác và vận động hai chân còn.","n"]],"tests":[["Siêu âm eFAST tại giường",15,"Không thấy dịch tự do ổ bụng, màng ngoài tim và màng phổi hai bên.","e"],["X-quang ngực thẳng và khung chậu thẳng tại giường",10,"Phổi bình thường. Khung chậu: giãn khớp mu 3,5 cm, giãn khớp cùng chậu phải, cánh chậu phải mở ra ngoài.","e"],["Công thức máu, khí máu, lactate, đông máu, nhóm máu",10,"Hb 7,8 g/dL; lactate 4,6 mmol/L; BE âm 9; INR 1,4; tiểu cầu 130 G/L; đã kích hoạt quy trình truyền máu khối lượng lớn.","e"],["Đáp ứng với hồi sức ban đầu sau 1.000 mL tinh thể ấm và 2 đơn vị hồng cầu",10,"Huyết áp lên 90/54 mmHg rồi tụt lại 84/50 sau 20 phút: đáp ứng thoáng qua.","e"],["Chụp niệu đạo ngược dòng và hình bàng quang khi đã ổn định",10,"Chưa làm khi còn bất ổn huyết động; lên kế hoạch cùng tiết niệu.","n"],["CT toàn thân có cản quang ngay khi huyết áp 82/48 mmHg",40,"Không an toàn khi huyết động chưa ổn định; chỉ làm khi có đáp ứng.","w"]],"opt":{"ydx":["+Gãy khung chậu mất vững (kiểu ép trước sau) gây chảy máu sau phúc mạc, sốc mất máu độ III đến IV, nghi tổn thương niệu đạo","Vỡ tạng đặc trong ổ bụng đơn thuần","Gãy cổ xương đùi hai bên","Trật khớp mu đơn thuần không chảy máu"],"xu_tri_dau_tien":["Đặt thông tiểu ngay để theo dõi nước tiểu","Truyền tinh thể 4 đến 5 lít cho đến khi huyết áp bình thường","+Đai hoặc khăn ép khung chậu ngang mấu chuyển lớn, truyền máu sớm theo quy trình truyền máu khối lượng lớn","Đưa đi CT ngay để tìm nguồn chảy máu"],"kiem_soat_chay_mau":["Nằm theo dõi, chờ huyết áp tự ổn định","Cố định chân bằng nẹp ván hai chân","Mở bụng thăm dò khi eFAST âm tính và đã có giãn khớp mu","+Phối hợp chấn thương, chỉnh hình, can thiệp mạch: nút mạch hoặc nhét gạc trước phúc mạc, cố định ngoài khung chậu"]},"actions":["++Đai ép hoặc khăn ép khung chậu ngang mấu chuyển lớn, hai chân xoay trong nhẹ và buộc cố định|2|Giảm thể tích khoang chậu, ép tĩnh mạch và mặt xương gãy; làm sớm nhất khi nghi gãy khung chậu có sốc.","++Hai đường truyền lớn, truyền máu sớm theo tỷ lệ cân bằng, hạn chế tinh thể, giữ ấm, acid tranexamic|2|Kiểm soát tổn thương: ưu tiên chế phẩm máu, tránh loãng máu và hạ thân nhiệt.","++Làm eFAST, X-quang ngực, X-quang khung chậu tại giường trong lúc hồi sức|2|Tìm nguồn mất máu khác (ngực, bụng), xác định loại tổn thương khung chậu.","++Hội chẩn khẩn chấn thương, chỉnh hình, can thiệp mạch và tiết niệu|3|Đáp ứng thoáng qua: cần cầm máu bằng nút mạch hoặc nhét gạc tiền phúc mạc, kèm cố định ngoài.","+Chưa đặt thông tiểu qua niệu đạo vì có máu ở lỗ niệu đạo; tiết niệu quyết định dẫn lưu trên xương mu hay chụp niệu đạo|2|Tránh làm rách niệu đạo hoàn toàn.","+Sau cầm máu: hồi sức tích cực, CT khi ổn định, cố định xương chắc chắn, phòng huyết khối, theo dõi biến chứng|2|Phát hiện tổn thương phối hợp và hạn chế biến chứng muộn.","!Ép bập bênh hai cánh chậu nhiều lần để đánh giá độ vững|0|Làm bong cục máu đông, chảy máu nặng thêm.","!Đưa người bệnh đi chụp CT khi chưa ổn định huyết động|0|Tăng nguy cơ ngừng tim ngoài khu hồi sức.","!Truyền tinh thể ồ ạt 4 đến 5 lít để đưa huyết áp về bình thường|0|Gây loãng máu, hạ thân nhiệt, toan máu, rối loạn đông máu."],"teach":"Ở bệnh nhân chấn thương có sốc, khung chậu là một nguồn chảy máu quan trọng: ép khung chậu sớm, truyền máu theo kiểm soát tổn thương và cầm máu sớm bằng nút mạch hoặc nhét gạc tiền phúc mạc. Tránh ép bập bênh nhiều lần, tránh thông tiểu mù khi nghi vỡ niệu đạo, tránh đưa đi CT khi bất ổn.","hbu":{"hanh_chinh":"Chị V. T. N., nữ, 26 tuổi, công nhân may; nhập khoa Cấp cứu và chuyển phòng mổ hoặc phòng can thiệp mạch.","ly_do_vao_vien":"Đau bụng dưới và vùng chậu dữ dội sau bị xe tải đè.","benh_su":"Cách 50 phút, chị ngã xe máy và bị xe tải đè lên vùng chậu bụng dưới. Đau dữ dội, không đứng dậy được, thấy ít máu ở âm hộ, chưa đi tiểu. Tỉnh táo, không đập đầu. Được sơ cứu bất động cột sống tại chỗ và chuyển viện.","tien_su":"Khỏe mạnh, chưa phẫu thuật, không dị ứng. Kinh cuối cách 2 tuần, không có thai. Chưa rõ tiêm phòng uốn ván.","luoc_qua_co_quan":"Khát nước, hoa mắt, chưa đi tiểu từ lúc tai nạn; không khó thở; không nôn.","kham_hien_tai":"Mạch 128, huyết áp 82/48 mmHg, nhịp thở 28, SpO2 94%, nhiệt độ 36,0 độ C, Glasgow 14. Da tái lạnh ẩm, thời gian đầy mao mạch 4 giây. Bầm máu bẹn đùi hai bên, vùng mu; khung chậu đau và di động bất thường khi ép nhẹ một lần. Bụng chướng nhẹ. Ít máu ở lỗ niệu đạo và âm hộ.","can_lam_sang":"eFAST âm tính. X-quang khung chậu: giãn khớp mu 3,5 cm, giãn khớp cùng chậu phải. Hb 7,8 g/dL, lactate 4,6 mmol/L, BE âm 9, INR 1,4. Đáp ứng thoáng qua với 1.000 mL tinh thể và 2 đơn vị hồng cầu.","tom_tat":"Nữ 26 tuổi bị chấn thương năng lượng cao vùng chậu, sốc mất máu độ III đến IV (mạch 128, huyết áp 82/48, lactate 4,6); khung chậu mất vững với giãn khớp mu 3,5 cm và giãn khớp cùng chậu; eFAST âm tính; đáp ứng thoáng qua với hồi sức; có máu lỗ niệu đạo nghi tổn thương niệu đạo.","dat_van_de":"Sốc mất máu do gãy khung chậu mất vững, nguồn chảy máu sau phúc mạc; cần đóng khung chậu và cầm máu sớm; nghi tổn thương niệu đạo; loại trừ các nguồn mất máu khác.","chan_doan_so_bo":"Chấn thương đa chấn thương, gãy khung chậu mất vững, sốc mất máu.","bien_luan":"Cơ chế đè ép năng lượng cao, bầm máu vùng bẹn mu, khung chậu di động bất thường kèm mạch nhanh, huyết áp thấp, lactate tăng: gợi ý gãy khung chậu có chảy máu. eFAST âm tính loại trừ chảy máu ổ bụng, tim và ngực nên nguồn mất máu chủ yếu là khoang sau phúc mạc. X-quang cho thấy giãn khớp mu hơn 2,5 cm và giãn khớp cùng chậu, phù hợp kiểu ép trước sau. Đáp ứng thoáng qua sau hồi sức cho thấy chảy máu còn tiếp diễn, cần can thiệp cầm máu.","sinh_ly_benh":"Khung chậu là vòng xương có khoang sau phúc mạc rộng, chứa được nhiều lít máu. Gãy mở sách làm tăng thể tích khoang chậu và xé các đám rối tĩnh mạch cùng nhánh động mạch chậu trong, gây mất máu nhiều. Nguồn chảy máu gồm mặt xương gãy, tĩnh mạch (khoảng 80% trường hợp) và động mạch. Sốc kéo dài gây toan máu, hạ thân nhiệt, rối loạn đông máu.","chan_doan_phan_biet":"Chảy máu trong ổ bụng do vỡ tạng đặc; tràn máu màng phổi; chèn ép tim; chấn thương đầu có tụt huyết áp; chấn thương mạch lớn; vỡ niệu đạo hoặc bàng quang kèm theo.","chan_doan_xac_dinh":"Gãy khung chậu mất vững kiểu ép trước sau (giãn khớp mu và khớp cùng chậu) kèm sốc mất máu độ III đến IV; nghi tổn thương niệu đạo.","dieu_tri":"Đai ép khung chậu sớm, hai đường truyền lớn, truyền máu sớm theo quy trình truyền máu khối lượng lớn, giữ ấm, acid tranexamic. Hội chẩn chấn thương, chỉnh hình, can thiệp mạch: nhét gạc trước phúc mạc hoặc nút mạch kèm cố định ngoài. Không đặt thông tiểu khi có máu lỗ niệu đạo, tiết niệu quyết định dẫn lưu. Hậu phẫu: hồi sức, CT khi ổn định, cố định xương chắc chắn, phòng huyết khối, phục hồi chức năng.","tien_luong":"Nặng: tử vong cao nếu chậm cầm máu; nguy cơ tổn thương niệu sinh dục, thần kinh, di chứng đi lại và sinh hoạt.","du_phong":"Tuân thủ an toàn giao thông, tránh xe tải trong làn ưu tiên xe máy; hướng dẫn sơ cứu chấn thương nặng (không kéo người bị nạn, bất động cổ và chậu); phòng huyết khối tĩnh mạch sâu sau chấn thương."},"nguon":["ATLS 10th edition, American College of Surgeons, 2018: chương Shock và Musculoskeletal Trauma.","WSES Guidelines: Management of Pelvic Trauma in Hemodynamically Unstable Patients, 2017.","Bộ Y tế: Hướng dẫn quy trình xử trí chấn thương nặng và sốc chấn thương (tài liệu cấp cứu ngoại khoa).","Giáo trình Ngoại bệnh lý, Đại học Y Dược TP.HCM: bài Gãy khung chậu."],"status":"nhap"},{"id":"ngoai-tiet-nieu-001","title":"Đau quặn hố thắt lưng phải lan xuống bìu","kind":"Ngoại","level":"Trung bình","group":"ngoai","name":"Ông T.V.H.","age":38,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh đến cấp cứu vì cơn đau quặn hố thắt lưng phải dữ dội, vã mồ hôi, buồn nôn.","vitals":{"hr":98,"sbp":142,"dbp":90,"rr":20,"t":37.4,"spo2":98},"ask":[["Cơn đau bắt đầu thế nào, lan đi đâu?","Đau đột ngột từ sáng, quặn từng cơn ở hố thắt lưng phải, lan xuống hố chậu và bìu phải, không tìm được tư thế giảm đau.","e"],["Có sốt, rét run không?","Không sốt, không rét run.","e"],["Nước tiểu thế nào, có tiểu buốt, tiểu máu không?","Nước tiểu hơi hồng, tiểu hơi buốt; vẫn đi tiểu được.","e"],["Đã từng có cơn tương tự hoặc đi ra sỏi chưa?","Cách đây hai năm có một cơn nhẹ hơn, tự hết sau uống nhiều nước.","e"],["Uống nước, chế độ ăn, nghề nghiệp ra sao?","Làm công việc ngoài trời, uống ít nước, hay ăn đồ mặn.","n"],["Có tiền sử gút, bệnh thận, chỉ có một thận hoặc dùng thuốc chống đông không?","Không; chưa có chẩn đoán gút, không dùng chống đông.","e"],["Có dị ứng thuốc, bệnh dạ dày không?","Không dị ứng; chưa từng loét dạ dày.","n"]],"exam":[["K","Tư thế, vẻ mặt","Vã mồ hôi, vật vã, đi lại liên tục.","n"],["K","Khám hố thắt lưng","Rung thận phải (+), ấn góc sườn lưng phải đau; thận không sờ thấy.","e"],["K","Khám bụng","Bụng mềm, ấn nhẹ hố chậu phải hơi đau, không phản ứng thành bụng, không co cứng.","e"],["K","Khám bìu và sinh dục","Tinh hoàn hai bên bình thường, không sưng đau khu trú.","e"],["K","Sinh hiệu","Nhiệt 37,4 độ C; mạch nhanh do đau, huyết áp 142/90 mmHg.","n"]],"tests":[["Tổng phân tích nước tiểu",10,"Hồng cầu (+++), bạch cầu (+), nitrit âm, pH 5,5.","e"],["Siêu âm hệ tiết niệu",15,"Thận phải ứ nước độ 1; không thấy rõ sỏi niệu quản; thận trái bình thường.","e"],["CT bụng không cản quang liều thấp",40,"Sỏi 7 mm ở niệu quản phải đoạn 1/3 dưới, thận ứ nước nhẹ, mật độ sỏi 900 HU.","e"],["Creatinin, ure, điện giải, CRP, bạch cầu máu",10,"Creatinin 92 µmol/L, ure 5,6 mmol/L, bạch cầu 9,8 G/L, CRP 6 mg/L.","e"],["Chụp CT có tiêm cản quang toàn ổ bụng thường quy cho mọi cơn đau quặn thận",40,"Không có chỉ định thường quy; tăng tiếp xúc tia và thuốc cản quang không cần thiết.","w"]],"opt":{"ydx":["Viêm ruột thừa cấp","+Cơn đau quặn thận phải do sỏi niệu quản 1/3 dưới, ứ nước độ 1, chưa nhiễm trùng","Xoắn tinh hoàn phải","Viêm đài bể thận cấp có nhiễm khuẩn huyết"],"uu_tien":["Mổ lấy sỏi mở ngay trong đêm","Cho về không dùng thuốc, chờ tự hết","+Giảm đau bằng NSAID, loại trừ nhiễm trùng và tắc nghẽn nặng, xác định sỏi bằng hình ảnh","Truyền dịch thật nhiều để ép sỏi ra"],"huong_xu_tri":["Cắt thận phải ngay","~Tán sỏi ngoài cơ thể hoặc nội soi niệu quản khi không đáp ứng điều trị nội, sỏi lớn hoặc có biến chứng","Chỉ theo dõi, không hẹn tái khám","+Điều trị nội tống sỏi có theo dõi cho sỏi ≤ 10 mm chưa biến chứng, đánh giá lại sau 1 đến 2 tuần; can thiệp nếu thất bại"]},"actions":["++Giảm đau bằng NSAID đường tiêm hoặc đặt hậu môn, theo dõi đáp ứng|3|NSAID là lựa chọn đầu tay để giảm cơn đau quặn thận ở người không có chống chỉ định.","++Loại trừ nhiễm trùng niệu kèm tắc nghẽn: nhiệt độ, tổng phân tích nước tiểu, công thức máu, CRP|3|Sỏi gây tắc kèm nhiễm trùng là cấp cứu ngoại khoa cần dẫn lưu khẩn.","++Làm hình ảnh xác định sỏi: siêu âm và CT liều thấp|5|Xác định kích thước, vị trí, mật độ sỏi để chọn hướng điều trị.","++Cho thuốc chẹn alpha (tamsulosin) hỗ trợ tống sỏi, hẹn tái khám|3|Điều trị tống sỏi có hỗ trợ cho sỏi niệu quản đoạn xa ≤ 10 mm chưa biến chứng, cần giải thích rõ lợi ích hạn chế.","+Hướng dẫn lọc nước tiểu, uống đủ nước, quay lại ngay khi sốt hoặc đau không giảm|2|Dặn dò dấu hiệu cảnh báo giúp phát hiện sớm biến chứng.","!Cho tiêm opioid liều cao kéo dài rồi cho về không đánh giá|0|Bỏ sót nhiễm trùng, tắc nghẽn nặng và thiếu theo dõi."],"teach":"Cơn đau quặn thận cần phân biệt sớm với cấp cứu ngoại khoa khác và phát hiện nhiễm trùng kèm tắc nghẽn. Sỏi nhỏ đoạn xa ít biến chứng có thể điều trị nội có theo dõi.","hbu":{"hanh_chinh":"Ông T.V.H., 38 tuổi, nam, công nhân xây dựng; vào khoa Cấp cứu.","ly_do_vao_vien":"Đau quặn hố thắt lưng phải lan xuống bìu.","benh_su":"Sáng nay đột ngột đau quặn hố thắt lưng phải, lan xuống hố chậu và bìu phải, kèm buồn nôn, vã mồ hôi, nước tiểu hồng và hơi buốt. Không sốt. Chưa dùng thuốc.","tien_su":"Một cơn đau tương tự nhẹ cách đây hai năm tự hết. Thói quen uống ít nước, ăn mặn. Không gút, không bệnh thận, không dị ứng thuốc.","luoc_qua_co_quan":"Buồn nôn, không nôn; không sốt rét run; đại tiện bình thường; không đau bìu trước đó.","kham_hien_tai":"Tỉnh, vật vã, mạch 98 lần/phút, huyết áp 142/90 mmHg, nhiệt 37,4 độ C. Rung thận phải (+), bụng mềm, bìu bình thường.","can_lam_sang":"Nước tiểu hồng cầu (+++); siêu âm thận phải ứ nước độ 1; CT thấy sỏi 7 mm niệu quản phải 1/3 dưới, 900 HU; creatinin 92 µmol/L; bạch cầu 9,8 G/L, CRP 6 mg/L.","tom_tat":"Nam 38 tuổi, đau quặn thận phải điển hình lan xuống bìu, tiểu máu vi thể và đại thể nhẹ; CT có sỏi 7 mm niệu quản phải đoạn xa, ứ nước độ 1; chưa có nhiễm trùng, chức năng thận bình thường.","dat_van_de":"Cơn đau quặn thận; sỏi niệu quản; tắc nghẽn đường niệu trên; loại trừ nhiễm trùng; chọn hướng điều trị tống sỏi hay can thiệp.","chan_doan_so_bo":"Cơn đau quặn thận phải do sỏi niệu quản.","bien_luan":"Đau quặn từng cơn lan xuống bìu, tiểu máu, rung thận (+) gợi sỏi niệu quản. Không sốt, bạch cầu và CRP bình thường nên chưa nhiễm trùng. CT liều thấp xác định sỏi 7 mm, đoạn xa, là nhóm có khả năng tự tống cao. Tinh hoàn bình thường nên loại trừ xoắn tinh hoàn.","sinh_ly_benh":"Sỏi làm tắc dòng nước tiểu, tăng áp lực đài bể thận và co thắt cơ trơn niệu quản, gây cơn đau quặn, ứ nước thận và tiểu máu do niêm mạc tổn thương.","chan_doan_phan_biet":"Viêm ruột thừa cấp, xoắn tinh hoàn, phình động mạch chủ bụng vỡ ở người lớn tuổi, viêm đài bể thận cấp, bệnh lý phụ khoa ở nữ.","chan_doan_xac_dinh":"Sỏi niệu quản phải 1/3 dưới 7 mm, thận phải ứ nước độ 1, chưa nhiễm trùng, chức năng thận bình thường.","dieu_tri":"Giảm đau NSAID; thuốc chẹn alpha hỗ trợ tống sỏi; uống đủ nước; tái khám 1 đến 2 tuần với siêu âm hoặc X-quang. Chỉ định can thiệp (nội soi tán sỏi niệu quản ngược dòng hoặc tán sỏi ngoài cơ thể) nếu đau không kiểm soát, sỏi không xuống, tăng ứ nước hoặc suy thận. Nếu có nhiễm trùng kèm tắc nghẽn: dẫn lưu khẩn (đặt thông JJ hoặc mở thận ra da) và kháng sinh, tán sỏi thì hai.","tien_luong":"Tốt; sỏi ≤ 10 mm đoạn xa phần lớn tự tống trong vài tuần. Tái phát cao nếu không đổi thói quen.","du_phong":"Uống đủ nước để nước tiểu trên 2,5 lít/ngày, chế độ ăn vừa phải muối và đạm, phân tích thành phần sỏi, đánh giá chuyển hóa nếu tái phát."},"nguon":["EAU Guidelines on Urolithiasis, 2024.","Giáo trình Ngoại khoa, bài Sỏi tiết niệu, Đại học Y Dược TP.HCM.","Bệnh học Ngoại khoa Tiết niệu, Đại học Y Hà Nội."],"status":"nhap"},{"id":"ngoai-tiet-nieu-002","title":"Bí tiểu cấp ở người lớn tuổi tiểu khó nhiều năm","kind":"Ngoại","level":"Trung bình","group":"ngoai","name":"Ông L.V.B.","age":72,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh đến cấp cứu vì không tiểu được 12 giờ, đau tức vùng hạ vị.","vitals":{"hr":94,"sbp":158,"dbp":96,"rr":20,"t":36.8,"spo2":98},"ask":[["Không tiểu được từ khi nào, có uống rượu hoặc dùng thuốc gì trước đó không?","Không tiểu được 12 giờ, tối qua uống rượu và uống thuốc cảm có chlorpheniramin.","e"],["Trước đây có tiểu khó, tiểu đêm, tia tiểu yếu không?","Hơn ba năm nay tiểu đêm 3 đến 4 lần, tia yếu, tiểu ngắt quãng, chưa đi khám.","e"],["Có tiểu máu, sốt, tiểu buốt không?","Không tiểu máu, không sốt, không tiểu buốt.","e"],["Có chấn thương, thủ thuật niệu đạo trước đây không?","Không.","n"],["Có đái tháo đường, bệnh thần kinh, táo bón nhiều ngày không?","Không đái tháo đường; táo bón nhẹ 2 ngày nay.","e"],["Đang dùng thuốc gì thường xuyên?","Thuốc huyết áp amlodipin; thỉnh thoảng thuốc cảm.","e"],["Tiền sử gia đình ung thư tuyến tiền liệt?","Không rõ.","n"]],"exam":[["K","Khám bụng","Cầu bàng quang căng đến sát rốn, gõ đục, ấn đau.","e"],["K","Thăm trực tràng","Tuyến tiền liệt to đối xứng, mật độ chắc đàn hồi, mất rãnh giữa, không nhân cứng, không đau.","e"],["K","Khám bộ phận sinh dục ngoài","Không hẹp lỗ sáo, không chảy dịch.","n"],["K","Thần kinh vùng chậu","Cảm giác tầng sinh môn và trương lực cơ thắt hậu môn bình thường.","e"],["K","Sinh hiệu","Huyết áp 158/96 mmHg, mạch 94, đau tức làm bồn chồn.","n"]],"tests":[["Siêu âm bụng và tuyến tiền liệt",15,"Bàng quang căng 1100 mL; tuyến tiền liệt 62 mL, thùy giữa lồi vào bàng quang; thận hai bên ứ nước độ 1.","e"],["Creatinin, ure, điện giải",10,"Creatinin 138 µmol/L, ure 9,4 mmol/L, Na 138, K 4,6 mmol/L.","e"],["Tổng phân tích nước tiểu",10,"Bạch cầu (-), hồng cầu (+), nitrit âm.","e"],["PSA toàn phần",10,"6,9 ng/mL; đang bí tiểu, sẽ làm lại sau khi ổn định.","n"],["Chụp cộng hưởng từ vùng chậu ngay trong đêm cấp cứu",10,"Không cần thiết lúc bí tiểu cấp, không thay đổi xử trí ban đầu.","w"]],"opt":{"ydx":["Bí tiểu do hẹp niệu đạo","Bí tiểu do bàng quang thần kinh","+Bí tiểu cấp do phì đại lành tính tuyến tiền liệt, suy thận sau thận mức nhẹ do tắc nghẽn","Sỏi niệu đạo"],"uu_tien":["+Giải áp bàng quang bằng đặt thông tiểu, theo dõi lượng nước tiểu và điện giải","Cho thuốc lợi tiểu rồi chờ tiểu","Cho về tự theo dõi tại nhà","Mổ cắt tuyến tiền liệt ngay đêm đó"],"huong_xu_tri":["Cắt bỏ tuyến tiền liệt toàn bộ ngay","Chỉ dùng kháng sinh kéo dài","+Chẹn alpha, thử rút thông và đánh giá lại; mổ khi thất bại hoặc có biến chứng","Rút thông ngay sau 1 giờ không điều trị gì"]},"actions":["++Đặt thông tiểu Foley giải áp bàng quang, ghi nhận thể tích nước tiểu|3|Bí tiểu cấp cần giải áp ngay để giảm đau và bảo vệ thận.","++Theo dõi lượng nước tiểu và điện giải sau giải áp, nguy cơ đa niệu sau tắc nghẽn và tiểu máu|3|Giải áp có thể gây tiểu nhiều và mất nước, tiểu máu do giảm áp.","++Bắt đầu thuốc chẹn alpha trước khi rút thông|3|Tăng tỷ lệ rút thông thành công.","++Ngừng thuốc kháng cholinergic và thuốc cảm có chlorpheniramin|2|Thuốc là yếu tố khởi phát bí tiểu.","+Hẹn thử rút thông, siêu âm thể tích tồn lưu, hội chẩn Ngoại tiết niệu|3|Đánh giá khả năng tự tiểu, lên kế hoạch phẫu thuật nếu thất bại.","!Đặt thông cứng nhiều lần cố mở đường khi đau, không dùng bôi trơn|0|Gây tổn thương niệu đạo, chảy máu và hẹp niệu đạo."],"teach":"Bí tiểu cấp ở nam lớn tuổi thường do phì đại lành tính tuyến tiền liệt có yếu tố thúc đẩy. Giải áp đúng, theo dõi sau giải áp và hoạch định điều trị lâu dài.","hbu":{"hanh_chinh":"Ông L.V.B., 72 tuổi, nam, hưu trí; vào khoa Cấp cứu.","ly_do_vao_vien":"Không tiểu được 12 giờ, đau tức hạ vị.","benh_su":"Hơn ba năm có tiểu đêm 3 đến 4 lần, tia tiểu yếu, ngắt quãng, tiểu không hết. Tối qua uống rượu và thuốc cảm, sáng nay không tiểu được, đau tức hạ vị tăng dần. Không sốt, không tiểu máu.","tien_su":"Tăng huyết áp dùng amlodipin. Không đái tháo đường, không phẫu thuật tiết niệu. Táo bón nhẹ 2 ngày.","luoc_qua_co_quan":"Không đau ngực, không khó thở; không sụt cân; tiểu đêm nhiều lần; không đau xương.","kham_hien_tai":"Tỉnh, vật vã nhẹ, mạch 94, huyết áp 158/96 mmHg. Cầu bàng quang sát rốn. Thăm trực tràng tuyến tiền liệt to, chắc đàn hồi, không nhân cứng.","can_lam_sang":"Siêu âm bàng quang 1100 mL, tuyến tiền liệt 62 mL, thận ứ nước độ 1 hai bên; creatinin 138 µmol/L; nước tiểu không nhiễm trùng; PSA 6,9 ng/mL khi đang bí tiểu.","tom_tat":"Nam 72 tuổi có triệu chứng đường tiểu dưới nhiều năm, bí tiểu cấp sau rượu và thuốc cảm; tuyến tiền liệt to 62 mL; tăng creatinin do tắc nghẽn mức nhẹ.","dat_van_de":"Bí tiểu cấp; phì đại lành tính tuyến tiền liệt; suy thận sau thận; phải loại trừ ung thư tuyến tiền liệt; chiến lược điều trị lâu dài.","chan_doan_so_bo":"Bí tiểu cấp do phì đại lành tính tuyến tiền liệt.","bien_luan":"Tuổi cao, triệu chứng đường tiểu dưới nhiều năm, thăm trực tràng tuyến to đàn hồi, siêu âm tuyến 62 mL thùy giữa lồi vào bàng quang gợi phì đại lành tính. Yếu tố thúc đẩy gồm rượu, thuốc kháng histamin và táo bón. PSA tăng tạm thời do bí tiểu nên cần làm lại.","sinh_ly_benh":"Tuyến to và co thắt cơ trơn cổ bàng quang gây tắc nghẽn dưới bàng quang; cơ detrusor phì đại rồi mất bù, tồn lưu nước tiểu, bí tiểu cấp và ứ nước thận.","chan_doan_phan_biet":"Hẹp niệu đạo, bàng quang thần kinh, ung thư tuyến tiền liệt, sỏi hoặc cục máu đông bàng quang, thuốc gây bí tiểu.","chan_doan_xac_dinh":"Phì đại lành tính tuyến tiền liệt 62 mL, bí tiểu cấp, tăng creatinin do tắc nghẽn; chưa loại trừ ung thư (PSA làm lại).","dieu_tri":"Đặt thông Foley, theo dõi sau giải áp; chẹn alpha (tamsulosin hoặc alfuzosin), thử rút thông sau 2 đến 3 ngày; thuốc ức chế 5-alpha reductase khi tuyến lớn. Chỉ định phẫu thuật: bí tiểu tái phát hoặc thử rút thông thất bại, suy thận, sỏi bàng quang, nhiễm trùng tái phát, tiểu máu tái phát. Phẫu thuật: cắt đốt nội soi tuyến tiền liệt (TURP) hoặc bóc nhân qua nội soi laser. Hậu phẫu: rút thông theo dõi dòng nước rửa, theo dõi hội chứng TUR và chảy máu, kháng sinh dự phòng.","tien_luong":"Tốt nếu giải áp và điều trị đúng; khoảng một phần tư đến một nửa người bệnh bí tiểu cấp có thể tự tiểu sau thử rút thông có chẹn alpha, số còn lại cần phẫu thuật.","du_phong":"Tránh thuốc kháng cholinergic, hạn chế rượu, tránh táo bón, khám định kỳ triệu chứng đường tiểu dưới và PSA theo tư vấn, theo dõi sau mổ."},"nguon":["EAU Guidelines on Non-neurogenic Male LUTS, 2024.","Giáo trình Ngoại khoa, bài U xơ tuyến tiền liệt, Đại học Y Hà Nội.","AUA Guideline: Management of Benign Prostatic Hyperplasia, 2023."],"status":"nhap"},{"id":"ngoai-tiet-nieu-003","title":"Đau bìu trái đột ngột ở thiếu niên","kind":"Ngoại","level":"Khó","group":"ngoai","name":"Em N.M.K.","age":15,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Em đến cấp cứu cùng mẹ vì đau bìu trái dữ dội 4 giờ, buồn nôn.","vitals":{"hr":110,"sbp":128,"dbp":76,"rr":22,"t":37,"spo2":99},"ask":[["Đau bắt đầu lúc nào, đột ngột hay từ từ?","Đau dữ dội đột ngột lúc 2 giờ sáng, đánh thức em dậy, 4 giờ nay.","e"],["Có buồn nôn, nôn không?","Buồn nôn và nôn hai lần.","e"],["Có sốt, tiểu buốt, chảy dịch niệu đạo không?","Không sốt, không tiểu buốt, không chảy dịch.","e"],["Có chấn thương bìu hoặc vận động mạnh trước đó không?","Không chấn thương rõ; trước khi ngủ đá bóng cả buổi chiều.","e"],["Trước đây có những cơn đau bìu tự hết không?","Có hai lần đau bìu thoáng qua tuần trước, tự hết.","e"],["Có quan hệ tình dục không?","Không.","n"],["Có tiền sử gia đình bị xoắn tinh hoàn không?","Không biết.","n"]],"exam":[["K","Quan sát bìu","Bìu trái sưng đỏ nhẹ, tinh hoàn trái nằm cao và ngang.","e"],["K","Sờ tinh hoàn","Tinh hoàn trái căng, đau nhiều, mào tinh khó phân biệt, thừng tinh ngắn, dày.","e"],["K","Phản xạ cơ bìu (cremaster)","Mất bên trái, còn bên phải.","e"],["K","Dấu Prehn","Nâng tinh hoàn lên không giảm đau, đau tăng thêm.","e"],["K","Khám bụng, thận","Bụng mềm, không đau; không rung thận.","n"]],"tests":[["Siêu âm Doppler bìu khẩn",15,"Tinh hoàn trái kích thước lớn hơn, không thấy tín hiệu tưới máu; thừng tinh có hình xoáy; bên phải bình thường.","e"],["Tổng phân tích nước tiểu",10,"Bình thường, không bạch cầu.","n"],["Công thức máu, CRP",10,"Bạch cầu 10,8 G/L, CRP 4 mg/L.","n"],["Điểm TWIST (sưng, đau cứng, nôn, tinh hoàn cao, mất cremaster)",10,"Điểm 7, nguy cơ cao.","e"],["Chờ kết quả nuôi cấy nước tiểu 48 giờ và điều trị kháng sinh thử trước khi quyết định",10,"Làm chậm thời gian cứu tinh hoàn, không có chỉ định.","w"]],"opt":{"ydx":["Viêm mào tinh hoàn cấp","Thoát vị bẹn nghẹt","+Xoắn thừng tinh trái, nghi ngờ cao, cần phẫu thuật thám sát cấp cứu","Xoắn phần phụ tinh hoàn"],"uu_tien":["Giảm đau và theo dõi tại nhà","Siêu âm lặp lại sau 24 giờ","+Phẫu thuật thám sát khẩn, không trì hoãn chờ hình ảnh nếu nghi ngờ cao","Kháng sinh đường uống 7 ngày"],"huong_xu_tri":["Cắt tinh hoàn trái ngay không cần quan sát","+Tháo xoắn, đánh giá sống còn tinh hoàn, cố định hai bên; cắt nếu hoại tử","Chỉ cố định tinh hoàn trái","Chườm lạnh và nghỉ"]},"actions":["++Nghi ngờ xoắn tinh hoàn, báo ngay bác sĩ Ngoại niệu để thám sát khẩn|2|Cứu tinh hoàn phụ thuộc thời gian: tốt nhất trong 6 giờ.","++Nhịn ăn, chuẩn bị gây mê và chuyển phòng mổ|3|Chuẩn bị phẫu thuật không chậm trễ.","++Có thể nắn xoắn ngoài bằng tay mở sách trong lúc chờ nếu thành thạo, vẫn phải mổ|2|Giảm thời gian thiếu máu nhưng không thay thế phẫu thuật.","++Giảm đau đường tĩnh mạch, giải thích cho người nhà và xin đồng ý phẫu thuật|3|Giảm đau và thực hiện giải thích đồng thuận.","+Sau mổ: cố định cả hai tinh hoàn, theo dõi sưng, nhiễm trùng, tư vấn khả năng teo tinh hoàn|3|Bên đối diện cũng có nguy cơ xoắn do dị tật treo ngang.","!Chẩn đoán viêm mào tinh hoàn, cho kháng sinh và về nhà|0|Bỏ sót xoắn tinh hoàn dẫn đến hoại tử trong vài giờ."],"teach":"Đau bìu cấp ở thiếu niên là xoắn tinh hoàn cho đến khi chứng minh ngược lại. Quyết định mổ dựa lâm sàng, không chờ chậm trễ vì hình ảnh.","hbu":{"hanh_chinh":"Em N.M.K., 15 tuổi, nam, học sinh; vào khoa Cấp cứu cùng mẹ.","ly_do_vao_vien":"Đau bìu trái dữ dội 4 giờ, buồn nôn.","benh_su":"2 giờ sáng đột ngột đau bìu trái dữ dội, đánh thức khỏi giấc ngủ, buồn nôn, nôn hai lần. Không sốt, không tiểu buốt. Chiều hôm trước đá bóng. Tuần trước có hai lần đau bìu thoáng qua tự hết.","tien_su":"Khỏe mạnh, chưa phẫu thuật. Không rõ tiền sử gia đình.","luoc_qua_co_quan":"Không sốt, không tiểu buốt, không chảy dịch niệu đạo, không đau bụng khác.","kham_hien_tai":"Mạch 110, huyết áp 128/76, nhiệt 37,0 độ C. Bìu trái sưng đỏ, tinh hoàn nằm cao ngang, căng đau, mất phản xạ cremaster, Prehn âm tính.","can_lam_sang":"Siêu âm Doppler: tinh hoàn trái không thấy tín hiệu mạch, thừng tinh xoắn hình xoáy; nước tiểu bình thường; bạch cầu 10,8 G/L; điểm TWIST 7.","tom_tat":"Nam 15 tuổi, đau bìu trái đột ngột 4 giờ kèm nôn, tinh hoàn trái cao, ngang, mất cremaster; Doppler không tưới máu; điểm TWIST cao.","dat_van_de":"Đau bìu cấp; xoắn thừng tinh; thời gian cứu tinh hoàn; chỉ định phẫu thuật khẩn; phòng ngừa bên đối diện.","chan_doan_so_bo":"Xoắn tinh hoàn trái.","bien_luan":"Khởi phát đột ngột, đau dữ dội, buồn nôn, mất cremaster, tinh hoàn cao ngang là bộ dấu hiệu kinh điển. Nước tiểu bình thường, không sốt nên viêm mào tinh hoàn ít khả năng. Doppler không tưới máu hỗ trợ; nhưng quyết định mổ phải khẩn, không chờ.","sinh_ly_benh":"Tinh hoàn xoay quanh trục thừng tinh (thường do dị tật treo chuông, màng tinh bao bám cao) làm tắc tĩnh mạch rồi động mạch, gây phù, thiếu máu và hoại tử tinh hoàn sau vài giờ; cứu sống cao nếu tháo xoắn trong 6 giờ.","chan_doan_phan_biet":"Viêm mào tinh hoàn, xoắn phần phụ tinh hoàn, thoát vị bẹn nghẹt, chấn thương bìu, tràn dịch, u tinh hoàn.","chan_doan_xac_dinh":"Xoắn thừng tinh trái, được xác nhận khi mổ thám sát.","dieu_tri":"Phẫu thuật thám sát khẩn qua đường bìu: tháo xoắn, đánh giá sống còn (màu, chảy máu khi rạch, ấm lại sau gạc nóng); nếu sống: cố định tinh hoàn ba điểm; nếu hoại tử: cắt tinh hoàn. Cố định luôn tinh hoàn bên phải. Hậu phẫu: giảm đau, mặc quần nâng bìu, tái khám sau 1 tuần; tránh vận động mạnh 2 tuần; theo dõi nhiễm trùng, tụ máu bìu, teo tinh hoàn.","tien_luong":"Tinh hoàn cứu được trên 90% nếu mổ trong 6 giờ, giảm mạnh sau 12 giờ; nguy cơ teo và ảnh hưởng sinh sản nếu chậm.","du_phong":"Cố định hai bên; giáo dục thanh thiếu niên và phụ huynh đi khám ngay khi đau bìu cấp; không tự theo dõi tại nhà."},"nguon":["EAU Guidelines on Paediatric Urology, chương Acute Scrotum, 2024.","Giáo trình Ngoại khoa, bài Xoắn tinh hoàn, Đại học Y Dược TP.HCM.","Barbosa JA và cs. Development and initial validation of a scoring system to diagnose testicular torsion in children (TWIST). J Urol, 2013."],"status":"nhap"},{"id":"ngoai-vu-001","title":"Sờ thấy khối ở vú trái sau tắm","kind":"Ngoại","level":"Trung bình","group":"ngoai","name":"Bà P.T.N.","age":52,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Bà đến phòng khám ngoại vì tự sờ thấy khối ở vú trái 6 tuần, không đau.","vitals":{"hr":78,"sbp":126,"dbp":78,"rr":16,"t":36.7,"spo2":99},"ask":[["Khối xuất hiện từ khi nào, có to lên không?","Phát hiện cách đây 6 tuần khi tắm, có vẻ to hơn một chút.","e"],["Có đau, tiết dịch núm vú, thay đổi da vú không?","Không đau, không tiết dịch, da vú không đổi màu.","e"],["Tiền sử kinh nguyệt, sinh con, cho con bú?","Có kinh lần đầu 12 tuổi, mãn kinh 49 tuổi, sinh 2 con, cho con bú mỗi bé 12 tháng.","e"],["Tiền sử gia đình ung thư vú, buồng trứng?","Chị gái ung thư vú lúc 58 tuổi; mẹ không bệnh.","e"],["Có dùng liệu pháp hormone thay thế hoặc xạ trị vùng ngực không?","Không.","e"],["Có sụt cân, đau xương, ho kéo dài, đau đầu không?","Không có dấu hiệu toàn thân.","n"],["Đã chụp nhũ ảnh định kỳ chưa?","Lần cuối cách đây 3 năm, bình thường.","n"]],"exam":[["K","Quan sát và sờ vú trái","Khối 1,8 cm ở góc trên ngoài, cứng, bờ không đều, ít di động, không dính da, không co kéo núm vú.","e"],["K","Vú phải","Không sờ thấy khối.","e"],["K","Hạch nách, thượng đòn hai bên","Hạch nách trái không sờ thấy; hạch thượng đòn không.","e"],["K","Khám bụng, gan","Gan không to; không đau xương cột sống khi gõ.","n"],["K","Tình trạng chung","ECOG 0.","n"]],"tests":[["Nhũ ảnh hai vú",10,"Khối mật độ cao, bờ tua gai ở góc trên ngoài vú trái, kèm vi vôi hóa; BI-RADS 5.","e"],["Siêu âm vú và hạch nách",15,"Khối giảm âm 1,8 cm, trục dọc, bờ góc cạnh; hạch nách trái hình thái bình thường; BI-RADS 5.","e"],["Sinh thiết lõi dưới hướng dẫn siêu âm với hóa mô miễn dịch",15,"Ung thư biểu mô ống xâm lấn độ 2; ER dương 95%, PR dương 70%, HER2 âm (điểm 1+), Ki-67 18%.","e"],["Công thức máu, chức năng gan thận, canxi, phosphatase kiềm",10,"Trong giới hạn bình thường.","n"],["PET-CT toàn thân thường quy cho mọi ung thư vú giai đoạn I",40,"Không có chỉ định ở giai đoạn sớm không triệu chứng, hạch lâm sàng âm.","w"]],"opt":{"ydx":["U xơ tuyến vú","Bệnh xơ nang tuyến vú","Viêm vú mạn","+Ung thư biểu mô ống xâm lấn vú trái, cT1c N0 M0, ER dương, HER2 âm"],"uu_tien":["+Phẫu thuật bảo tồn vú kèm sinh thiết hạch cửa, sau đó xạ trị và điều trị nội tiết","Cắt vú không phân tích hạch, không điều trị bổ trợ","Hóa trị trước phẫu thuật cho mọi trường hợp","Theo dõi mỗi 6 tháng bằng nhũ ảnh"],"bo_tro":["Chỉ phẫu thuật, không điều trị gì thêm","Hóa trị 6 chu kỳ cho mọi trường hợp","Liệu pháp kháng HER2 kéo dài một năm","+Xạ trị toàn vú sau bảo tồn; điều trị nội tiết 5 năm trở lên; xem xét hóa trị theo điểm nguy cơ gen"]},"actions":["++Sinh thiết lõi trước điều trị với đầy đủ ER, PR, HER2, Ki-67|3|Xác định mô bệnh học và dấu ấn sinh học quyết định điều trị.","+Hội chẩn đa chuyên khoa ung bướu vú|3|Xác định giai đoạn lâm sàng cT1c N0 và kế hoạch điều trị.","+Phẫu thuật bảo tồn vú kèm sinh thiết hạch cửa, giải thích khả năng mổ lại nếu rìa dương tính|5|Với khối 1,8 cm, tỷ lệ khối/vú phù hợp, bảo tồn cho kết quả sống còn tương đương cắt vú.","+Sau mổ: xạ trị toàn vú, điều trị nội tiết (thuốc ức chế aromatase sau mãn kinh)|3|Giảm tái phát tại chỗ và xa.","+Tư vấn di truyền do gia đình có chị gái ung thư vú|2|Cân nhắc xét nghiệm BRCA theo tiêu chí.","!Cắt bỏ khối đơn thuần không sinh thiết trước rồi chờ giải phẫu bệnh|0|Phẫu thuật không kế hoạch làm khó điều trị đúng giai đoạn."],"teach":"Khối vú cứng, bờ không đều, BI-RADS 5 cần sinh thiết lõi trước điều trị; thể ER dương, HER2 âm, hạch lâm sàng âm điều trị chủ yếu bằng phẫu thuật bảo tồn, xạ trị và nội tiết.","hbu":{"hanh_chinh":"Bà P.T.N., 52 tuổi, nữ, giáo viên; khám tại phòng khám Ngoại.","ly_do_vao_vien":"Sờ thấy khối ở vú trái 6 tuần.","benh_su":"Cách đây 6 tuần tự sờ thấy khối góc trên ngoài vú trái khi tắm, không đau, hơi to dần, không tiết dịch núm vú, da vú không đổi. Không sụt cân, không đau xương.","tien_su":"Kinh lần đầu 12 tuổi, mãn kinh 49 tuổi, sinh 2 con, cho bú mỗi bé 12 tháng. Chị gái ung thư vú lúc 58 tuổi. Không dùng hormone thay thế, không xạ trị vùng ngực.","luoc_qua_co_quan":"Không ho kéo dài, không đau đầu, không đau bụng, không đau xương, tiêu tiểu bình thường.","kham_hien_tai":"Tỉnh, ECOG 0, mạch 78, huyết áp 126/78 mmHg. Vú trái khối 1,8 cm góc trên ngoài, cứng, bờ không đều, ít di động, không dính da. Hạch nách và thượng đòn không sờ thấy. Vú phải bình thường.","can_lam_sang":"Nhũ ảnh và siêu âm BI-RADS 5; sinh thiết lõi: ung thư biểu mô ống xâm lấn độ 2, ER dương 95%, PR dương 70%, HER2 âm, Ki-67 18%; hạch nách trên siêu âm bình thường; xét nghiệm máu bình thường.","tom_tat":"Nữ 52 tuổi mãn kinh, có người thân bậc một bị ung thư vú, khối vú trái 1,8 cm nghi ác, sinh thiết ung thư biểu mô ống xâm lấn ER dương HER2 âm, hạch lâm sàng âm.","dat_van_de":"Khối vú nghi ác; xác định mô bệnh học; phân giai đoạn; chọn phẫu thuật bảo tồn hay cắt vú; điều trị bổ trợ; yếu tố di truyền.","chan_doan_so_bo":"U vú trái nghi ác tính, BI-RADS 5.","bien_luan":"Khối cứng bờ không đều, vi vôi hóa, BI-RADS 5 và gia đình có ung thư vú nên nguy cơ cao. Giải phẫu bệnh khẳng định ung thư ống xâm lấn. Kích thước 1,8 cm, hạch lâm sàng và siêu âm âm tính, không triệu chứng xa: cT1c N0 M0 (giai đoạn lâm sàng I). Thể luminal A/B nên điều trị nội tiết có vai trò then chốt.","sinh_ly_benh":"Tế bào biểu mô ống tuyến vú tăng sinh ác tính dưới tác động hormone estrogen, xâm lấn mô đệm, theo đường bạch huyết đến hạch nách và theo đường máu đến xương, phổi, gan.","chan_doan_phan_biet":"U xơ tuyến vú, u nhú trong ống, nang vú, bệnh xơ nang, viêm vú mạn, u diệp thể.","chan_doan_xac_dinh":"Ung thư biểu mô ống xâm lấn vú trái độ 2, cT1c N0 M0, ER dương, PR dương, HER2 âm, Ki-67 18%.","dieu_tri":"Phẫu thuật bảo tồn vú, sinh thiết hạch cửa (nếu hạch cửa dương tính, xử trí theo tiêu chí ACOSOG Z0011). Hậu phẫu: dẫn lưu, theo dõi tụ dịch, phù bạch huyết, nhiễm trùng, tập vận động vai; giải phẫu bệnh sau mổ xét rìa mổ và hạch. Xạ trị toàn vú; điều trị nội tiết 5 đến 10 năm (thuốc ức chế aromatase); cân nhắc xét nghiệm đa gen quyết định hóa trị. Tư vấn di truyền.","tien_luong":"Tốt nếu phát hiện sớm: sống còn 5 năm trên 90% ở giai đoạn I thể luminal; cần theo dõi lâu dài vì nguy cơ tái phát muộn.","du_phong":"Tầm soát nhũ ảnh định kỳ theo tuổi và nguy cơ, tự khám vú, giữ cân nặng, hạn chế rượu, tư vấn di truyền cho gia đình, tầm soát cho người thân nguy cơ cao."},"nguon":["NCCN Clinical Practice Guidelines in Oncology: Breast Cancer, 2025.","ESMO Clinical Practice Guideline: Early Breast Cancer, 2024.","AJCC Cancer Staging Manual, 8th edition, 2017.","Hướng dẫn chẩn đoán và điều trị ung thư vú, Bộ Y tế Việt Nam."],"status":"nhap"},{"id":"ngoai-noi-tiet-001","title":"Nhân giáp phát hiện qua siêu âm kiểm tra sức khỏe","kind":"Ngoại","level":"Trung bình","group":"ngoai","name":"Bà H.T.M.","age":44,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Bà đến phòng khám ngoại vì phát hiện nhân giáp phải khi siêu âm kiểm tra sức khỏe định kỳ.","vitals":{"hr":76,"sbp":118,"dbp":74,"rr":16,"t":36.6,"spo2":99},"ask":[["Có tự sờ thấy khối ở cổ hoặc thấy cổ to không?","Mới sờ thấy cục nhỏ ở cổ phải sau khi có kết quả siêu âm.","e"],["Có khàn tiếng, khó nuốt, khó thở không?","Không khàn tiếng, không khó nuốt, không khó thở.","e"],["Có sụt cân, run tay, hồi hộp, sợ nóng hoặc mệt, tăng cân, sợ lạnh không?","Không có triệu chứng cường hay suy giáp.","e"],["Tiền sử chiếu xạ vùng đầu cổ khi nhỏ?","Không.","e"],["Tiền sử gia đình ung thư giáp hoặc bệnh nội tiết?","Không.","e"],["Sống ở vùng thiếu iod, bệnh giáp trước đây?","Sống ở thành phố, chưa bệnh giáp.","n"],["Thuốc đang dùng?","Không dùng thuốc thường xuyên.","n"]],"exam":[["K","Sờ tuyến giáp","Nhân thùy phải khoảng 1,5 cm, cứng, di động theo nuốt, không đau, bờ không rõ.","e"],["K","Thùy trái và eo","Không sờ thấy nhân.","e"],["K","Hạch cổ","Không sờ thấy hạch cổ hai bên.","e"],["K","Giọng nói","Giọng bình thường.","e"],["K","Dấu hiệu cường giáp, suy giáp","Không run tay, mạch 76, da bình thường.","n"]],"tests":[["Siêu âm tuyến giáp và hạch cổ",15,"Nhân thùy phải 1,6 cm giảm âm, bờ không đều, có vi vôi hóa, cao hơn rộng; phân loại ACR TI-RADS TR5 (EU-TIRADS 5); không hạch cổ nghi ngờ.","e"],["TSH, FT4",10,"TSH 1,2 mIU/L, FT4 bình thường.","e"],["Chọc hút tế bào bằng kim nhỏ dưới siêu âm",15,"Bethesda VI: ung thư biểu mô nhú.","e"],["Calci máu, PTH trước mổ",10,"Calci 2,3 mmol/L, PTH bình thường (giá trị nền).","n"],["Xạ hình iod phóng xạ cho mọi nhân giáp có TSH bình thường",10,"Không có chỉ định; nhân nhìn nguội không phân biệt lành ác và TSH bình thường.","w"]],"opt":{"ydx":["Bướu giáp nhân lành tính độc lập","Viêm giáp Hashimoto","+Ung thư biểu mô nhú tuyến giáp thùy phải, cT1b N0 M0, chưa xâm lấn ngoài tuyến","Ung thư biểu mô tuyến giáp thể tủy"],"uu_tien":["+Phẫu thuật cắt thùy giáp phải hoặc cắt giáp toàn bộ sau khi hội chẩn, không cần hóa trị","Theo dõi siêu âm mỗi năm một lần","Hóa trị toàn thân ngay","Xạ trị ngoài chùm tia vùng cổ trước tiên"],"hau_phau":["Ngừng thuốc và nằm yên trong 1 tháng","Chỉ theo dõi không dùng thuốc","+Theo dõi calci, giọng nói và chảy máu vết mổ; levothyroxine, xét TSH mục tiêu và xạ iod theo nguy cơ","Truyền calci cho mọi trường hợp dù không có triệu chứng"]},"actions":["++Xác định tế bào học bằng chọc hút kim nhỏ dưới siêu âm|3|Nhân TR5 trên 1 cm có chỉ định chọc hút để quyết định phẫu thuật.","+Đánh giá hạch cổ và chức năng dây thanh trước mổ (siêu âm, nội soi thanh quản)|3|Phát hiện hạch, liệt dây thanh trước mổ và làm cơ sở so sánh.","+Hội chẩn phẫu thuật: cắt thùy giáp hoặc cắt giáp toàn bộ theo nguy cơ|5|Ung thư nhú 1 đến 4 cm không xâm lấn, cN0: cắt thùy là đủ hoặc cắt toàn bộ nếu có yếu tố nguy cơ hoặc bệnh nhân chọn.","+Sau mổ: theo dõi calci, khàn tiếng, tụ máu cổ, giải phẫu bệnh sau mổ, levothyroxine|3|Đề phòng biến chứng hạ calci, tổn thương dây thanh quặt ngược.","+Theo dõi dài hạn: thyroglobulin, siêu âm cổ định kỳ|3|Phát hiện tái phát.","!Mổ cắt bỏ nhân đơn thuần không có kết quả tế bào học trước mổ|0|Mổ không chuẩn bị không đúng mức cắt và có thể phải mổ lại."],"teach":"Nhân giáp có dấu hiệu nghi ngờ trên siêu âm cần chọc hút kim nhỏ; ung thư nhú nhỏ không xâm lấn tiên lượng tốt, điều trị chính là phẫu thuật.","hbu":{"hanh_chinh":"Bà H.T.M., 44 tuổi, nữ, nhân viên văn phòng; khám tại phòng khám Ngoại.","ly_do_vao_vien":"Phát hiện nhân giáp phải qua siêu âm kiểm tra sức khỏe.","benh_su":"Siêu âm kiểm tra sức khỏe phát hiện nhân thùy phải tuyến giáp, sau đó tự sờ thấy cục nhỏ ở cổ phải, không đau. Không khàn tiếng, khó nuốt, khó thở, không triệu chứng cường hoặc suy giáp.","tien_su":"Không tiền sử chiếu xạ đầu cổ, không bệnh giáp, không ung thư giáp trong gia đình.","luoc_qua_co_quan":"Không sụt cân, không hồi hộp, không táo bón, không đau xương, không khó thở.","kham_hien_tai":"Mạch 76, huyết áp 118/74 mmHg, không sốt. Nhân thùy phải 1,5 cm, cứng, di động theo nuốt; không hạch cổ; giọng bình thường.","can_lam_sang":"Siêu âm: nhân 1,6 cm giảm âm, bờ không đều, vi vôi hóa, cao hơn rộng, TR5, không hạch nghi ngờ; TSH 1,2 mIU/L; chọc hút kim nhỏ Bethesda VI ung thư biểu mô nhú.","tom_tat":"Nữ 44 tuổi, nhân giáp phải 1,6 cm với nhiều dấu hiệu nghi ác trên siêu âm, chọc hút kim nhỏ ung thư biểu mô nhú, không hạch cổ, chức năng giáp bình thường.","dat_van_de":"Nhân giáp nghi ác; xác định tế bào học; giai đoạn; mức độ phẫu thuật; điều trị sau mổ; theo dõi.","chan_doan_so_bo":"Nhân giáp phải nghi ung thư, phân loại TR5.","bien_luan":"Nhân giảm âm, bờ không đều, vi vôi hóa, cao hơn rộng là các đặc điểm nguy cơ ác cao nên TR5 và có chỉ định chọc hút. Kết quả Bethesda VI xác định ung thư biểu mô nhú. Chưa thấy hạch cổ hoặc xâm lấn ngoài tuyến nên cT1b N0 M0; ở bệnh nhân dưới 55 tuổi thuộc giai đoạn I theo AJCC 8.","sinh_ly_benh":"Đột biến BRAF V600E hoặc RAS, tái sắp xếp RET/PTC làm tế bào nang tăng sinh; ung thư nhú lan chủ yếu theo bạch huyết đến hạch cổ trung tâm, ít di căn xa.","chan_doan_phan_biet":"Nhân giáp lành tính, nang giáp, viêm giáp Hashimoto thể nhân, ung thư giáp thể nang hoặc thể tủy, di căn đến giáp.","chan_doan_xac_dinh":"Ung thư biểu mô nhú tuyến giáp thùy phải, cT1b N0 M0, giai đoạn I.","dieu_tri":"Phẫu thuật: cắt thùy giáp phải kèm eo hoặc cắt giáp toàn bộ tùy yếu tố nguy cơ và mong muốn người bệnh; nạo hạch trung tâm khi có hạch lâm sàng. Hậu phẫu: theo dõi chảy máu và tụ máu cổ trong 24 giờ đầu, calci và triệu chứng hạ calci (nếu cắt toàn bộ), giọng nói (dây thanh quặt ngược), hạ calci cần bổ sung calci, vitamin D. Levothyroxine sau cắt toàn bộ; xạ iod tùy nguy cơ; theo dõi thyroglobulin và siêu âm.","tien_luong":"Rất tốt: sống còn 10 năm trên 90% với ung thư nhú giai đoạn I; theo dõi suốt đời vì có thể tái phát muộn.","du_phong":"Theo dõi định kỳ TSH, thyroglobulin, siêu âm cổ; dùng levothyroxine đều; tránh chiếu xạ không cần thiết vùng cổ; tư vấn người nhà khi có tiền sử gia đình."},"nguon":["2015 American Thyroid Association Management Guidelines for Adult Patients with Thyroid Nodules and Differentiated Thyroid Cancer.","ACR TI-RADS, American College of Radiology, 2017.","The Bethesda System for Reporting Thyroid Cytopathology, 2023.","Giáo trình Ngoại khoa, bài Bệnh lý tuyến giáp, Đại học Y Hà Nội."],"status":"nhap"},{"id":"ngoai-mach-001","title":"Đau chân trái đột ngột, lạnh, tê bì ở người rung nhĩ","kind":"Ngoại","level":"Khó","group":"ngoai","name":"Ông Đ.V.C.","age":68,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh đến cấp cứu vì đau chân trái đột ngột 5 giờ, chân lạnh và tê.","vitals":{"hr":112,"sbp":156,"dbp":92,"rr":20,"t":36.8,"spo2":96},"ask":[["Đau chân bắt đầu thế nào, từ lúc nào?","Đau đột ngột bắp chân trái lúc 9 giờ sáng, đã 5 giờ, đau dữ dội.","e"],["Chân có lạnh, tê, yếu hay thay đổi màu không?","Bàn chân lạnh, tái nhợt, tê bì cả bàn chân và khó gập ngón chân.","e"],["Trước đây có đau cách hồi khi đi bộ không?","Không.","e"],["Có bệnh tim, rung nhĩ hoặc dùng thuốc chống đông không?","Biết rung nhĩ hai năm, không dùng chống đông vì cho là không cần.","e"],["Có hút thuốc, tăng huyết áp, đái tháo đường, rối loạn mỡ máu không?","Hút thuốc 20 năm, tăng huyết áp; không đái tháo đường.","e"],["Có chấn thương hoặc thủ thuật mạch máu gần đây không?","Không.","n"],["Có dị ứng thuốc cản quang hoặc bệnh thận không?","Không dị ứng; chưa biết bệnh thận.","e"]],"exam":[["K","Nhìn và sờ chân trái","Bàn chân nhợt, lạnh từ dưới gối, mao mạch làm đầy chậm.","e"],["K","Mạch","Mạch bẹn trái yếu; khoeo, chày sau, mu chân trái không bắt được; chân phải mạch đầy đủ.","e"],["K","Cảm giác và vận động","Mất cảm giác nhẹ vượt quá ngón chân; gập bàn chân yếu (3/5) nhưng còn.","e"],["K","Tim","Rối loạn nhịp hoàn toàn không đều, tần số 112 lần/phút.","e"],["K","Khoang cơ bắp chân","Mềm, chưa căng, đau khi căng thụ động nhẹ.","n"]],"tests":[["Doppler cầm tay đo áp lực cổ chân",10,"Chân trái không nghe tín hiệu động mạch chày, còn tín hiệu tĩnh mạch; chân phải bình thường.","e"],["Điện tâm đồ",10,"Rung nhĩ đáp ứng thất nhanh 112 lần/phút.","e"],["Xét nghiệm đông máu, công thức máu, creatinin, điện giải, CK, lactate",10,"INR 1,0; Hb 142 g/L; creatinin 98 µmol/L; K 4,3; CK 180 U/L; lactate 2,2 mmol/L.","e"],["Chụp CT mạch máu chi dưới",40,"Tắc đột ngột động mạch khoeo trái đoạn thấp, hình ảnh huyết khối tắc, mạch dưới gối nghèo; không có mảng vữa nặng.","e"],["Chờ kết quả siêu âm tim 24 giờ rồi mới bắt đầu điều trị",15,"Chậm tái tưới máu, không phù hợp với cấp cứu mạch tạng.","w"]],"opt":{"ydx":["Bệnh động mạch ngoại biên mạn tính đợt kịch phát","+Thiếu máu chi dưới cấp do tắc động mạch do huyết khối từ tim (rung nhĩ), Rutherford IIb","Huyết khối tĩnh mạch sâu chi dưới","Hội chứng khoang cấp đơn thuần"],"uu_tien":["Giảm đau và hẹn chụp mạch ngày hôm sau","Nâng cao chân, chườm nóng bàn chân","Truyền dịch và theo dõi đến sáng","+Chống đông heparin ngay, giảm đau, hội chẩn khẩn phẫu thuật mạch máu để tái tưới máu"],"tai_tuoi_mau":["Chờ tuần hoàn bàng hệ hình thành","+Lấy huyết khối bằng ống thông Fogarty, kiểm tra tái tưới máu, rạch cân dự phòng nếu cần","Cắt cụt chân ngay","Dùng thuốc giãn mạch uống"]},"actions":["++Heparin không phân đoạn tĩnh mạch liều tải ngay khi nghi ngờ, không chờ hình ảnh|2|Chống đông ngăn lan rộng huyết khối.","++Hội chẩn khẩn phẫu thuật mạch máu, chuẩn bị mổ lấy huyết khối|3|Rutherford IIb cần tái tưới máu khẩn; chi có nguy cơ mất nếu trễ quá vài giờ.","++Giảm đau mạnh, giữ ấm chân, nằm đầu thấp hơn chân (không nâng chân)|2|Không chườm nóng; nâng chân làm giảm tưới máu.","++Chụp CT mạch hoặc chụp mạch trong mổ để định vị|5|Xác định vị trí tắc, đánh giá mạch dưới gối.","+Sau mổ: theo dõi hội chứng khoang, tiêu cơ vân, tăng kali, tổn thương thận cấp, chống đông kéo dài và điều trị rung nhĩ|3|Hội chứng tái tưới máu có thể đe dọa tính mạng.","!Xoa bóp mạnh và chườm nóng chân trái chờ tự hết|0|Làm nặng tổn thương, chậm điều trị và có thể mất chi."],"teach":"Thiếu máu chi cấp ở người rung nhĩ là cấp cứu mạch máu: chống đông ngay và tái tưới máu khẩn; theo dõi hậu phẫu hội chứng tái tưới máu và hội chứng khoang.","hbu":{"hanh_chinh":"Ông Đ.V.C., 68 tuổi, nam, tài xế hưu trí; vào khoa Cấp cứu.","ly_do_vao_vien":"Đau chân trái đột ngột 5 giờ, chân lạnh, tê bì.","benh_su":"9 giờ sáng đột ngột đau dữ dội bắp chân trái, sau đó bàn chân lạnh, tái, tê bì và khó gập ngón chân. Không đau cách hồi trước đó. Có rung nhĩ hai năm, không dùng chống đông.","tien_su":"Rung nhĩ không điều trị chống đông; tăng huyết áp; hút thuốc 20 năm. Không đái tháo đường, không phẫu thuật mạch máu.","luoc_qua_co_quan":"Không đau ngực, không khó thở, không liệt nửa người; không đau bụng; nước tiểu bình thường.","kham_hien_tai":"Mạch 112 không đều, huyết áp 156/92 mmHg, SpO2 96%. Chân trái nhợt, lạnh dưới gối, mất mạch khoeo, chày và mu chân; mất cảm giác nhẹ vượt ngón chân, yếu vận động nhẹ (3/5).","can_lam_sang":"Doppler: không tín hiệu động mạch chày trái, còn tín hiệu tĩnh mạch; ECG rung nhĩ đáp ứng nhanh; CK 180 U/L; lactate 2,2 mmol/L; creatinin 98 µmol/L; CT mạch: tắc động mạch khoeo trái do huyết khối.","tom_tat":"Nam 68 tuổi, rung nhĩ không chống đông, đau chân trái đột ngột 5 giờ với đủ dấu hiệu 5P (đau, nhợt, lạnh, mất mạch, tê), yếu vận động nhẹ; CT mạch tắc động mạch khoeo trái.","dat_van_de":"Thiếu máu chi cấp; nguyên nhân thuyên tắc từ tim; phân độ Rutherford; chỉ định tái tưới máu khẩn; biến chứng sau tái tưới máu.","chan_doan_so_bo":"Thiếu máu chi dưới cấp do tắc động mạch.","bien_luan":"Khởi phát đột ngột, không tiền sử đau cách hồi, rung nhĩ không chống đông gợi thuyên tắc từ tim. Còn tín hiệu tĩnh mạch nhưng mất tín hiệu động mạch, có yếu vận động nhẹ và mất cảm giác vượt ngón chân: Rutherford IIb, chi có nguy cơ mất nếu không tái tưới máu khẩn. CT mạch xác định vị trí tắc.","sinh_ly_benh":"Cục huyết khối từ nhĩ trái do rung nhĩ trôi xuống tắc động mạch khoeo, đột ngột mất tưới máu; mô thiếu máu quá 6 giờ gây hoại tử cơ, thần kinh; tái tưới máu có thể gây phù, hội chứng khoang, giải phóng kali và myoglobin.","chan_doan_phan_biet":"Huyết khối tại chỗ trên nền xơ vữa, huyết khối tĩnh mạch sâu có phlegmasia, bóc tách động mạch chủ, hội chứng khoang.","chan_doan_xac_dinh":"Thiếu máu chi dưới trái cấp do thuyên tắc động mạch khoeo, Rutherford IIb, trên nền rung nhĩ.","dieu_tri":"Heparin tĩnh mạch ngay; giảm đau; mổ lấy huyết khối bằng ống thông Fogarty (gây tê, đường bẹn), chụp mạch kiểm tra trong mổ, rạch cân bắp chân dự phòng nếu thiếu máu kéo dài hoặc nguy cơ hội chứng khoang; dùng tiêu sợi huyết tại chỗ nếu lựa chọn phù hợp. Hậu phẫu: theo dõi mạch, nhiệt độ, vận động, khoang cơ; kali, CK, creatinin; truyền dịch bảo vệ thận; heparin rồi chống đông kéo dài, kiểm soát nhịp rung nhĩ, siêu âm tim.","tien_luong":"Dè dặt: tỷ lệ cắt cụt và tử vong tăng nếu chậm; cứu chi tốt khi tái tưới máu sớm; nguy cơ tái tắc nếu không chống đông.","du_phong":"Chống đông kéo dài theo thang điểm CHA2DS2-VASc, kiểm soát huyết áp, bỏ thuốc lá, thuốc statin, tái khám mạch máu, giáo dục nhận biết triệu chứng."},"nguon":["Björck M và cs. Editor's Choice: European Society for Vascular Surgery 2020 Clinical Practice Guidelines on the Management of Acute Limb Ischaemia. Eur J Vasc Endovasc Surg, 2020.","2024 ACC/AHA Guideline for the Management of Lower Extremity Peripheral Artery Disease.","Giáo trình Ngoại khoa, bài Thiếu máu chi cấp, Đại học Y Dược TP.HCM."],"status":"nhap"},{"id":"ngoai-san-001","title":"Đau hạ vị phải dữ dội đột ngột kèm nôn ở phụ nữ trẻ","kind":"Ngoại","level":"Trung bình","group":"ngoai","name":"Chị V.T.L.","age":27,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Chị đến cấp cứu vì đau hạ vị phải dữ dội đột ngột 6 giờ, nôn nhiều.","vitals":{"hr":104,"sbp":118,"dbp":72,"rr":22,"t":37.6,"spo2":99},"ask":[["Đau bắt đầu thế nào, có liên quan động tác nào không?","Đau đột ngột dữ dội hạ vị phải sau khi chạy xe, đau thành từng cơn rồi liên tục, 6 giờ nay.","e"],["Có buồn nôn, nôn không?","Nôn 3 lần, buồn nôn nhiều.","e"],["Kinh nguyệt lần cuối, có chậm kinh không, ra huyết âm đạo không?","Kinh cách đây 12 ngày, đều, không ra huyết bất thường; không chậm kinh.","e"],["Có quan hệ tình dục, biện pháp tránh thai?","Có chồng, dùng bao cao su.","e"],["Tiền sử u nang buồng trứng hoặc phẫu thuật?","Siêu âm 6 tháng trước phát hiện u nang buồng trứng phải 5 cm, hẹn tái khám chưa đi.","e"],["Có sốt, tiểu buốt, khí hư?","Không sốt, không tiểu buốt, không khí hư bất thường.","n"],["Có bệnh khác, dị ứng thuốc?","Không.","n"]],"exam":[["K","Khám bụng","Hố chậu phải ấn đau nhiều, phản ứng thành bụng nhẹ, không co cứng lan tỏa.","e"],["K","Khám âm đạo bằng mỏ vịt","Không ra huyết, cổ tử cung bình thường.","e"],["K","Thăm âm đạo kết hợp nắn bụng","Cạnh tử cung phải khối khoảng 7 cm, căng, di động hạn chế, đau chói khi chạm; tử cung bình thường.","e"],["K","Dấu hiệu phúc mạc, Blumberg","Blumberg nhẹ (+) hố chậu phải.","n"],["K","Tuần hoàn","Mạch nhanh 104; không có dấu mất máu.","n"]],"tests":[["Thử thai nhanh hCG nước tiểu hoặc máu",10,"Âm tính.","e"],["Siêu âm đầu dò âm đạo kèm Doppler",15,"Khối 7 cm cạnh tử cung phải, echo hỗn hợp có đoạn tăng âm (nghĩ u quái); buồng trứng phải phù nề, nhiều nang nhỏ ở ngoại vi; ít dịch Douglas; Doppler còn tín hiệu động mạch yếu.","e"],["Công thức máu, CRP",10,"Bạch cầu 13,2 G/L, Hb 125 g/L, CRP 12 mg/L.","e"],["CA-125, AFP, hCG (dấu ấn u buồng trứng)",10,"CA-125 28 U/mL, AFP, hCG bình thường.","n"],["Chờ nội soi theo dõi và điều trị giảm đau 48 giờ nếu Doppler còn tín hiệu",20,"Doppler còn tín hiệu không loại trừ xoắn; chờ làm tăng nguy cơ hoại tử buồng trứng.","w"]],"opt":{"ydx":["Viêm ruột thừa cấp","Thai ngoài tử cung","+Xoắn u nang buồng trứng phải, nghi u quái trưởng thành","Viêm phần phụ cấp"],"uu_tien":["Giảm đau và hẹn tái khám sau 48 giờ","Kháng sinh đường uống điều trị viêm phần phụ","Chờ Doppler mất tín hiệu mới mổ","+Phẫu thuật nội soi cấp cứu để tháo xoắn, đánh giá buồng trứng"],"xu_tri_buong_trung":["+Tháo xoắn, bóc u bảo tồn buồng trứng, gửi giải phẫu bệnh","Cắt phần phụ phải ngay cho mọi trường hợp","Cắt tử cung toàn phần","Chỉ tháo xoắn không bóc u dù u lành, rồi quan sát"]},"actions":["++Nhịn ăn, đường truyền, giảm đau, xét nghiệm tiền phẫu và hội chẩn Sản phụ khoa cấp cứu|3|Nghi xoắn phần phụ là cấp cứu vì thời gian cửa sổ cứu buồng trứng ngắn.","++Loại trừ thai ngoài tử cung bằng hCG|2|Thai ngoài vỡ là chẩn đoán phân biệt cấp cứu khác cần loại trừ.","++Siêu âm đầu dò âm đạo kèm Doppler, nhưng không dựa vào Doppler để quyết định không mổ|5|Doppler còn tín hiệu không loại trừ xoắn.","++Phẫu thuật nội soi: tháo xoắn, bóc u quái bảo tồn buồng trứng, kiểm tra đối bên|5|Bảo tồn buồng trứng cho phụ nữ trẻ, ngay cả khi buồng trứng tím.","+Hậu phẫu: giảm đau, kháng sinh dự phòng nếu cần, theo dõi giải phẫu bệnh, siêu âm theo dõi sau 6 đến 8 tuần|3|Đánh giá phục hồi buồng trứng và u đối bên.","!Cắt buồng trứng phải ngay khi thấy tím đen mà không tháo xoắn|0|Buồng trứng thường hồi phục sau tháo xoắn dù hình thái tím."],"teach":"Đau hạ vị đột ngột kèm nôn ở phụ nữ trẻ có u nang buồng trứng phải nghĩ xoắn phần phụ; phẫu thuật nội soi tháo xoắn và bảo tồn buồng trứng là nguyên tắc.","hbu":{"hanh_chinh":"Chị V.T.L., 27 tuổi, nữ, nhân viên ngân hàng; vào khoa Cấp cứu.","ly_do_vao_vien":"Đau hạ vị phải dữ dội đột ngột 6 giờ, nôn nhiều.","benh_su":"Sau khi chạy xe đột ngột đau dữ dội hạ vị phải, đau từng cơn rồi liên tục, buồn nôn và nôn 3 lần. Không sốt, không ra huyết âm đạo. Kinh lần cuối cách 12 ngày.","tien_su":"Siêu âm 6 tháng trước phát hiện u nang buồng trứng phải 5 cm, chưa tái khám. Chưa phẫu thuật. Không dị ứng.","luoc_qua_co_quan":"Không tiểu buốt, không khí hư, không tiêu chảy, không sụt cân.","kham_hien_tai":"Tỉnh, vẻ mặt đau, mạch 104, huyết áp 118/72 mmHg, nhiệt 37,6 độ C. Hố chậu phải đau nhiều, phản ứng thành bụng nhẹ. Cạnh tử cung phải khối 7 cm, căng, đau chói.","can_lam_sang":"hCG âm tính; siêu âm khối 7 cm echo hỗn hợp nghĩ u quái, buồng trứng phù nề, Doppler tín hiệu yếu, ít dịch Douglas; bạch cầu 13,2 G/L, Hb 125 g/L, CRP 12 mg/L; CA-125 28 U/mL.","tom_tat":"Nữ 27 tuổi có u nang buồng trứng phải đã biết, đau hạ vị phải đột ngột kèm nôn, khối cạnh tử cung 7 cm đau, hCG âm tính, siêu âm phù nề buồng trứng và Doppler yếu.","dat_van_de":"Đau bụng cấp ở nữ trẻ; loại trừ thai ngoài; xoắn phần phụ; chỉ định mổ cấp cứu; bảo tồn buồng trứng.","chan_doan_so_bo":"Xoắn u nang buồng trứng phải.","bien_luan":"Khối phần phụ đã biết, kích thước tăng, đau đột ngột sau vận động, nôn, phản ứng thành bụng nhẹ là bối cảnh điển hình của xoắn. hCG âm tính loại trừ thai ngoài. Hình ảnh nghĩ u quái trưởng thành là loại u hay gây xoắn. Doppler còn tín hiệu không loại trừ xoắn nên quyết định dựa trên lâm sàng.","sinh_ly_benh":"U buồng trứng di động xoay quanh cuống mạch (dây chằng thắt lưng buồng trứng, dây chằng riêng), tắc tĩnh mạch rồi động mạch, gây phù, xuất huyết và hoại tử buồng trứng nếu không tháo xoắn kịp thời.","chan_doan_phan_biet":"Viêm ruột thừa cấp, thai ngoài tử cung, viêm phần phụ, vỡ nang xuất huyết, sỏi niệu quản, lạc nội mạc tử cung.","chan_doan_xac_dinh":"Xoắn u nang buồng trứng phải (u quái trưởng thành nghi ngờ), xác định khi phẫu thuật và giải phẫu bệnh.","dieu_tri":"Phẫu thuật nội soi cấp cứu: tháo xoắn, đánh giá buồng trứng, bóc u quái bảo tồn mô buồng trứng lành, cho u vào túi lấy bệnh phẩm, gửi giải phẫu bệnh, kiểm tra bên đối diện. Chỉ cắt phần phụ khi hoại tử không cứu vãn hoặc nghi ác tính. Hậu phẫu: giảm đau, đứng dậy sớm, dự phòng huyết khối khi cần, theo dõi nhiễm trùng và xuất huyết, siêu âm 6 đến 8 tuần sau mổ.","tien_luong":"Tốt nếu mổ sớm; hầu hết buồng trứng hồi phục chức năng sau tháo xoắn; chậm có thể mất buồng trứng và giảm khả năng sinh sản.","du_phong":"Khám và theo dõi u nang buồng trứng định kỳ, mổ chủ động khi u lớn có triệu chứng, đi khám sớm khi đau bụng cấp, tư vấn sinh sản."},"nguon":["ACOG Committee Opinion No. 783: Adnexal Torsion in Adolescents, 2019.","RCOG Green-top Guideline No. 62: Management of Suspected Ovarian Masses in Premenopausal Women, 2011.","Giáo trình Sản phụ khoa, Đại học Y Hà Nội."],"status":"nhap"}];
const MODERN_SECS = BANK_SECS.filter(x=>x[0]!=="yhct"&&x[0]!=="pp");
const GROUPS = {capcuu:"Cấp cứu",noi:"Nội",ngoai:"Ngoại",cxk:"Cơ xương khớp, thần kinh",sannhi:"Sản, Nhi",phuctap:"Phức tạp"};
const uniq = a=>[...new Set(a)];
const rint=(n)=>Math.floor(Math.random()*n);
const shuf=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rint(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick3=a=>shuf(a).slice(0,3);
const parseAct=s=>{ const m=String(s).match(/^(\+\+|\+|-|!)(.*)$/); const p=m[2].split("|"); return {k:m[1],text:p[0].trim(),why:(p[2]||"").trim()}; };
const firstSent=t=>{ const m=String(t).match(/^.{40,200}?[.!?](\s|$)/); return (m?m[0]:String(t).slice(0,180)).trim(); };
const TYPE_LABEL={V:"Vọng",M:"Văn",T:"Thiết",K:"Khám thực thể"};
const TYPE_LABEL_TAY={V:"Quan sát",M:"Nghe, ngửi",T:"Sờ, bắt mạch",K:"Khám thực thể"};
const TRACKS={noi:"Nội",ngoai:"Ngoại",yhct:"Y học cổ truyền"};
const TRACK_NOTE={noi:"Chỉ bệnh án y học hiện đại.",ngoai:"Chỉ bệnh án y học hiện đại.",yhct:"Đông y và Tây y kết hợp trong cùng một bệnh án."};
/* Mục của ca: ca có phần biện chứng YHCT (bệnh danh) là ca Đông – Tây y; ca chỉ có chẩn đoán Tây y thuộc Nội hoặc Ngoại. */
const trackOf=c=>(c.opt&&c.opt.bd)?"yhct":((c.group==="ngoai"||c.id==="thai-ngoai-tu-cung-vo")?"ngoai":"noi");
const tch=c=>trackOf(c)==="yhct"?c.teach:c.teach.split(/(?<=[.!?])\s+/).filter(x=>!/YHCT|y học cổ truyền|Đông y/i.test(x)).join(" ");
const lab=(c,t)=>(trackOf(c)==="yhct"?TYPE_LABEL:TYPE_LABEL_TAY)[t]||"";
function numWrongs(v,steps,fmt,floor=1){ const out=[]; for(const d of shuf(steps)){ const x=v+d; if(x>=floor && fmt(x)!==fmt(v) && !out.includes(fmt(x))) out.push(fmt(x)); if(out.length>=3) break; } return out; }

function mkPool(c){
  const P=[]; const others=BANK.filter(x=>x.id!==c.id);
  const add=(id,sec,q,correct,wrongs,e)=>{ wrongs=uniq(wrongs.filter(w=>w&&w!==correct)); if(!correct||wrongs.length<3) return; P.push({id:c.id+":"+id,sec,q,o:[correct,...pick3(wrongs)],e:e||""}); };
  const v=c.vitals, vit=`mạch ${v.hr}, HA ${v.sbp}/${v.dbp}, nhịp thở ${v.rr}, SpO₂ ${v.spo2}%, nhiệt độ ${v.t} °C`;
  add("age","doc","Bệnh nhân bao nhiêu tuổi?",`${c.age} tuổi`,numWrongs(c.age,[-30,-20,-12,-8,-5,-3,3,5,8,12,20,30],x=>x+" tuổi"),"Hành chính: "+c.name+", "+c.age+" tuổi.");
  add("hr","doc","Mạch lúc vào là bao nhiêu?",`${v.hr} lần/phút`,numWrongs(v.hr,[-30,-20,-12,12,20,30],x=>x+" lần/phút",30),"Sinh hiệu lúc vào: "+vit+".");
  add("bp","doc","Huyết áp lúc vào là bao nhiêu?",`${v.sbp}/${v.dbp} mmHg`,numWrongs(v.sbp,[-40,-30,-20,20,30,40],x=>x+"/"+(x-v.sbp+v.dbp>40?x-v.sbp+v.dbp:v.dbp)+" mmHg",60),"Sinh hiệu lúc vào: "+vit+".");
  add("spo2","doc","SpO₂ lúc vào là bao nhiêu?",`${v.spo2}%`,numWrongs(v.spo2,[-12,-8,-5,-3,3,5,8].filter(d=>v.spo2+d<=100),x=>x+"%",70),"Sinh hiệu lúc vào: "+vit+".");
  add("rr","doc","Nhịp thở lúc vào là bao nhiêu?",`${v.rr} lần/phút`,numWrongs(v.rr,[-8,-6,-4,4,6,10,14],x=>x+" lần/phút",8),"Sinh hiệu lúc vào: "+vit+".");
  c.ask.forEach((a,k)=>add("ask"+k,"doc",`Khi hỏi “${a[0]}”, bệnh nhân trả lời thế nào?`,a[1],c.ask.filter((_,j)=>j!==k).map(x=>x[1]),"Đọc lại phần bệnh sử của bệnh án."));
  c.exam.forEach((a,k)=>add("exam"+k,"doc",`Khám ${lab(c,a[0])} “${a[1]}”: bạn ghi nhận gì?`.replace("  "," "),a[2],c.exam.filter((_,j)=>j!==k).map(x=>x[2]),"Đọc lại phần khám của bệnh án."));
  // chẩn đoán
  const plus=l=>(l||[]).filter(o=>o[0]==="+").map(o=>o.slice(1)), plain=l=>(l||[]).filter(o=>o[0]!=="+"&&o[0]!=="~");
  const oneOf=(key,id,sec,q)=>{ const l=c.opt[key]; if(!l) return; const ok=plus(l); if(!ok.length) return; add(id,sec,q,ok[0],plain(l),tch(c)); };
  oneOf("ydx","ydx","ydx","Chẩn đoán Tây y phù hợp nhất với bệnh nhân này là gì?");
  oneOf("bd","bd","yhct","Bệnh danh YHCT phù hợp nhất là gì?");
  oneOf("bc","bc","yhct","Bát cương của bệnh nhân này là gì?");
  oneOf("the","the","yhct","Thể bệnh (chứng) phù hợp nhất là gì?");
  oneOf("phap","phap","pp","Pháp điều trị phù hợp nhất là gì?");
  oneOf("phuong","phuong","pp","Bài thuốc (phương) phù hợp nhất là gì?");
  /* Các nhóm lựa chọn thêm của ca soạn theo mẫu bệnh án: mỗi nhóm thành một câu hỏi */
  const EXTRA={tieu_chuan:["ydx","Tiêu chuẩn chẩn đoán nào là đúng?"],phan_biet:["ydx","Nhận định nào về chẩn đoán phân biệt là đúng?"],sinh_ly_benh:["bh","Cơ chế sinh lý bệnh nào phù hợp nhất với ca này?"],uu_tien:["xt","Hướng xử trí ưu tiên phù hợp nhất cho ca này là gì?"],noi_soi:["xt","Thời điểm và chỉ định nội soi phù hợp nhất là gì?"],kiem_tra_tiet_tru:["xt","Cách xác nhận kết quả điều trị phù hợp nhất là gì?"],dau_bao_dong:["ydx","Nhận định nào về dấu hiệu báo động là đúng?"],danh_gia:["xt","Việc đánh giá và theo dõi nào phù hợp nhất?"],du_phong:["bh","Biện pháp dự phòng nào phù hợp nhất?"],dieu_tri:["xt","Hướng điều trị nào phù hợp nhất?"],kiem_soat_nguon_nhiem:["xt","Cách kiểm soát nguồn nhiễm nào phù hợp nhất?"]};
  Object.keys(c.opt).forEach(k=>{ if(EXTRA[k]) oneOf(k,k,EXTRA[k][0],EXTRA[k][1]); });
  if(c.opt.huyet){ const ok=plus(c.opt.huyet), bad=plain(c.opt.huyet); ok.forEach((h,k)=>add("huyet"+k,"pp","Huyệt nào phù hợp trong phác đồ châm cứu hỗ trợ cho ca này?",h,bad,tch(c))); }
  // cận lâm sàng
  const T=c.tests;
  T.forEach((t,k)=>{
    if(t[3]==="e") add("tprio"+k,"cls","Xét nghiệm nào cần làm ưu tiên ngay cho bệnh nhân này?",t[0],T.filter(x=>x[3]!=="e").map(x=>x[0]),"Kết quả: "+t[2]);
    if(t[3]==="w") add("twaste"+k,"cls","Xét nghiệm nào không có chỉ định hoặc làm mất thời gian ở bệnh nhân này?",t[0],T.filter(x=>x[3]!=="w").map(x=>x[0]),t[2]);
    if(t[3]!=="w") add("tres"+k,"cls",`Kết quả của “${t[0]}” ở bệnh nhân này là gì?`,t[2],T.filter((_,j)=>j!==k).map(x=>x[2]),"Đọc lại phần cận lâm sàng của bệnh án.");
  });
  // xử trí
  const A=c.actions.map(parseAct);
  A.forEach((a,k)=>{
    if(a.k==="++") add("aprio"+k,"xt","Việc nào cần làm ngay, ưu tiên hàng đầu?",a.text,A.filter(x=>x.k==="!"||x.k==="-").map(x=>x.text).concat(A.filter(x=>x.k==="+").map(x=>x.text)),a.why);
    if(a.k==="!") add("abad"+k,"xt","Việc nào dưới đây KHÔNG nên làm ở bệnh nhân này?",a.text,A.filter(x=>x.k==="++"||x.k==="+").map(x=>x.text),a.why);
  });
  // bài học
  add("teach","bh","Bài học then chốt của ca này là gì?",firstSent(tch(c)),others.map(x=>firstSent(tch(x))),tch(c));
  return P;
}
function bankDoc(c){
  const v=c.vitals, H=c.hbu||{}, E=`<p class="muted" style="font-size:13px">Ca này chưa có phần này.</p>`;
  const P=t=>t?`<p>${esc(t)}</p>`:"";
  return `<div class="docsec"><h3>I. Hành chính</h3><p>${esc(H.hanh_chinh||(c.name+", "+c.age+" tuổi, "+c.sex+". "+(c.place||"")+(c.clock?" lúc "+c.clock:"")+"."))}</p>
  <h3>II. Lý do vào viện</h3><p>${esc(H.ly_do_vao_vien||c.intro)}</p>
  <h3>III. Bệnh sử</h3>${P(H.benh_su)}<ul class="tight">${c.ask.map(a=>`<li><b>${esc(a[0])}</b> ${esc(a[1])}</li>`).join("")}</ul>
  <h3>IV. Tiền sử</h3>${P(H.tien_su)||E}
  <h3>V. Lược qua các cơ quan</h3>${P(H.luoc_qua_co_quan)||E}
  <h3>VI. Khám hiện tại</h3><p>Mạch ${v.hr} · HA ${v.sbp}/${v.dbp} · Nhịp thở ${v.rr} · SpO₂ ${v.spo2}% · Nhiệt độ ${v.t} °C</p>${P(H.kham_hien_tai)}<ul class="tight">${c.exam.map(a=>`<li><b>${esc(lab(c,a[0])||a[0])} · ${esc(a[1])}:</b> ${esc(a[2])}</li>`).join("")}</ul></div>`;
}
const CASEDEFS = [
  {id:"demo",title:"Đau thượng vị cấp sau bữa nhậu",kind:"Nội khoa · Tiêu hóa",level:"Trung bình",group:"mau",track:"noi",secs:DEMO_SECS,doc:()=>caseDoc(),pool:()=>POOL.map(p=>({...p}))},
  ...BANK.map(c=>({id:c.id,title:c.title,kind:c.kind,level:c.level,group:c.group,track:trackOf(c),secs:trackOf(c)==="yhct"?BANK_SECS:MODERN_SECS,doc:()=>bankDoc(c),pool:()=>mkPool(c)}))
];
const _muc=new URLSearchParams(location.search).get("muc");
const V = { phase:"pick", fast:false, closed:true, n:15, filter:TRACKS[_muc]?_muc:"all", rank:null, def:null, elapsed:0, left:0, qs:[], i:0, pickd:-1, ans:[], timer:null };
const SEEN_KEY = "viva-seen-v2";
const loadSeenAll=()=>{ try{ return JSON.parse(localStorage.getItem(SEEN_KEY)||"{}"); }catch(e){ return {}; } };
const seenOf=id=>new Set(loadSeenAll()[id]||[]);
const saveSeen=(id,ids,poolN)=>{ try{ const all=loadSeenAll(); const s=new Set(all[id]||[]); ids.forEach(i=>s.add(i)); all[id]=s.size>=poolN?[]:[...s]; localStorage.setItem(SEEN_KEY,JSON.stringify(all)); }catch(e){} };
/* Đổi vị trí ca: mỗi lần mở danh sách (hoặc đổi mục) thứ tự ca được xáo lại. */
function orderedDefs(fn){
  if(!V.rank) V.rank=Object.fromEntries(shuf(CASEDEFS.map(d=>d.id)).map((id,i)=>[id,i]));
  return CASEDEFS.filter(fn).sort((a,b)=>V.rank[a.id]-V.rank[b.id]);
}
function trackChips(){
  const chips=[["all","Tất cả"],...Object.entries(TRACKS)];
  return `<div class="steps" role="group" aria-label="Chọn mục">${chips.map(c=>`<button class="step" data-v="tfilter" data-f="${c[0]}" aria-selected="${V.filter===c[0]}" type="button">${esc(c[1])}</button>`).join("")}</div>`+(TRACK_NOTE[V.filter]?`<p style="margin:0;color:var(--muted);font-size:13px">${esc(TRACK_NOTE[V.filter])}</p>`:"");
}
function drawQuestions(def,n){
  const pool=def.pool(), seen=seenOf(def.id), out=[], used=new Set();
  const total=def.secs.reduce((a,x)=>a+x[2],0);
  const quota=def.secs.map(x=>Math.max(0,Math.round(x[2]*n/total)));
  let diff=n-quota.reduce((a,b)=>a+b,0); for(let i=0;diff!==0;i=(i+1)%quota.length){ if(diff>0){quota[i]++;diff--;} else if(quota[i]>0){quota[i]--;diff++;} }
  const usedQ=new Set(); const take=(items,k)=>{ const f=shuf(items.filter(p=>!seen.has(p.id)&&!used.has(p.id))).concat(shuf(items.filter(p=>seen.has(p.id)&&!used.has(p.id)))); let got=0; for(const p of f){ if(got>=k) break; if(usedQ.has(p.q)) continue; out.push(p); used.add(p.id); usedQ.add(p.q); got++; } };
  def.secs.forEach((s,i)=>take(pool.filter(p=>p.sec===s[0]),quota[i]));
  if(out.length<n) take(pool,n-out.length);
  /* Đổi vị trí câu hỏi và đáp án mỗi lượt thi */
  return shuf(out).map(p=>({...p, opts:shuf(p.o.map((t,k)=>({t,ok:k===0})))}));
}
const mmss=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
function caseDoc(){
  return `<div class="docsec"><h3>I. Hành chính</h3><p>${esc(CASE.intro)}</p>
  <h3>III. Bệnh sử</h3><ul class="tight">${CASE.ask.map(a=>`<li>${esc(a[1])}</li>`).join("")}</ul>
  <h3>Sinh hiệu lúc vào viện</h3><p>${CASE.vitals.map(v=>esc(v[0]+" "+v[1]+" "+v[2])).join(" · ")}</p>
  <h3>VI. Khám lâm sàng</h3><ul class="tight">${CASE.exam.map(a=>`<li><b>${esc(a[0])}:</b> ${esc(a[1])}</li>`).join("")}</ul>
  <h3>XIII. Kết quả cận lâm sàng</h3><div class="tw"><table><thead><tr><th>Xét nghiệm</th><th>Kết quả</th><th>Đơn vị</th><th>Tham chiếu</th></tr></thead><tbody>${CASE.kq.map(r=>`<tr><td>${esc(r[0])}</td><td class="${r[4]}">${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}</tbody></table></div><p>${esc(CASE.kqText)}</p></div>`;
}
function vivaPick(){
  clearInterval(V.timer); V.phase="pick";
  const all=orderedDefs(d=>V.filter==="all"||d.track===V.filter), P=pageOf(all), list=P.items;
  const sel=V.def;
  $("#panel").innerHTML=`<section class="card"><div class="code">Chọn bệnh án</div><h2>Thi vấn đáp</h2>
  ${trackChips()}
  <div class="list">${list.map(d=>{ const sn=seenOf(d.id).size; return `<button class="q ${sel&&sel.id===d.id?"open":""}" data-v="case" data-id="${esc(d.id)}" type="button"><span><b>${esc(d.title)}</b></span><span class="a" style="display:block;color:var(--muted);font-weight:400">${esc(d.kind)} · ${esc(d.level)}${sn?` · đã gặp ${sn} câu`:""}</span></button>`; }).join("")}</div>
  ${pager(P)}
  ${sel?setupBlock(sel):`<div class="lock">Chọn một bệnh án ở trên để bắt đầu.</div>`}</section>`;
}
function setupBlock(def){
  const pn=def.pool().length, max=Math.min(20,pn);
  const opts=[10,15,20].filter(x=>x<=max); if(!opts.length) opts.push(max);
  if(!opts.includes(V.n)) V.n=opts[opts.length-1];
  return `<div class="rev"><b>${esc(def.title)}</b>
  <ul class="tight"><li>Đọc bệnh án tối thiểu <b>2 phút</b>, tối đa <b>5 phút</b>; hết 2 phút bạn tự quyết định vào thi.</li>
  <li>Giám khảo hỏi trắc nghiệm theo thứ tự các mục, mỗi câu 4 đáp án, <b>${V.n} câu = ${V.n} phút</b>. Không quay lại câu trước.</li>
  <li>Ca này có ${pn} câu trong ngân hàng; mỗi lượt rút ngẫu nhiên, câu chưa gặp được ưu tiên.</li></ul>
  ${def.id==="demo"?"":`<span style="color:var(--muted);font-size:13px">Ca mô phỏng để luyện phản xạ lâm sàng.</span>`}</div>
  <label class="check"><span>Số câu:</span><select id="v-n" aria-label="Số câu">${opts.map(x=>`<option value="${x}" ${x===V.n?"selected":""}>${x} câu · ${x} phút</option>`).join("")}</select></label>
  <label class="check"><input type="checkbox" id="v-closed" ${V.closed?"checked":""}><span>Đóng sách khi thi (bệnh án ẩn, giống thi thật)</span></label>
  <button class="btn" data-v="start" type="button">Vào phòng đọc bệnh án</button>`;
}
function vivaRead(){
  V.phase="read"; V.elapsed=0; clearInterval(V.timer);
  const minS=120, maxS=300;
  const draw=()=>{
    const btn=$("#v-go"), lab=$("#timer"); if(!btn) return;
    if(V.elapsed<minS){ lab.textContent="Đọc tối thiểu: còn "+mmss(minS-V.elapsed); btn.disabled=true; }
    else { lab.textContent="Tự vào thi sau "+mmss(maxS-V.elapsed); btn.disabled=false; }
  };
  $("#panel").innerHTML=`<section class="card"><div class="code">Phòng đọc bệnh án</div><h2>${esc(V.def.title)}</h2>${V.def.doc()}<button class="btn" id="v-go" data-v="go" type="button" disabled>Vào thi</button></section>`;
  draw();
  V.timer=setInterval(()=>{ V.elapsed++; draw(); if(V.elapsed>=maxS) vivaStart(); },1000);
}
function vivaStart(){
  clearInterval(V.timer);
  V.phase="exam"; V.qs=drawQuestions(V.def,V.n); V.i=0; V.pickd=-1; V.ans=[]; V.left=V.qs.length*60; V.total=V.left;
  V.timer=setInterval(()=>{ V.left--; $("#timer").textContent="Còn "+mmss(Math.max(0,V.left)); if(V.left<=0) vivaFinish(); },1000);
  $("#timer").textContent="Còn "+mmss(V.left); vivaQ();
}
function vivaQ(){
  const q=V.qs[V.i], sec=V.def.secs.find(x=>x[0]===q.sec), last=V.i===V.qs.length-1;
  $("#panel").innerHTML=`<section class="card"><div class="row"><span class="code">Câu ${V.i+1}/${V.qs.length} · ${esc(sec[1])}</span></div>
  <div class="prog" aria-hidden="true"><i style="width:${(V.i/V.qs.length)*100}%"></i></div>
  <div class="bubble"><span class="who">Giám khảo</span>${esc(sec[3])} ${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="o" data-v="opt" data-k="${k}" aria-pressed="${V.pickd===k}" type="button"><b>${"ABCD"[k]}</b><span>${esc(o.t)}</span></button>`).join("")}</div>
  ${V.closed?"":`<details><summary>Xem lại bệnh án</summary>${V.def.doc()}</details>`}
  <button class="btn" data-v="next" type="button" ${V.pickd<0?"disabled":""}>${last?"Nộp bài":"Trả lời, sang câu tiếp"}</button></section>`;
}
function vivaFinish(){
  clearInterval(V.timer); V.phase="result";
  while(V.ans.length<V.qs.length) V.ans.push(-1);
  saveSeen(V.def.id,V.qs.map(q=>q.id),V.def.pool().length);
  const ok=V.qs.map((q,i)=>V.ans[i]>=0 && q.opts[V.ans[i]].ok);
  const right=ok.filter(Boolean).length, score=Math.round(right/V.qs.length*100)/10, used=V.total-Math.max(0,V.left);
  $("#timer").textContent="Đã nộp bài";
  const bySec=V.def.secs.map(([id,name])=>{ const idx=V.qs.map((q,i)=>q.sec===id?i:-1).filter(i=>i>=0); return [name,idx.filter(i=>ok[i]).length,idx.length]; }).filter(x=>x[2]>0);
  const weak=bySec.filter(x=>x[1]<x[2]).map(x=>x[0]);
  $("#panel").innerHTML=`<section class="card"><div class="code">Kết quả · ${esc(V.def.title)}</div>
  <div><span class="big ${score>=5?"pass":"fail"}">${String(score).replace(".",",")}</span> <span style="color:var(--muted)">/ 10 · ${right}/${V.qs.length} câu đúng · ${score>=5?"Đạt":"Chưa đạt"} (tạm tính ngưỡng 5,0)</span></div>
  <div class="score">Thời gian làm bài: ${mmss(used)}${V.ans.includes(-1)?" · có câu chưa trả lời, tính là sai":""}</div>
  ${bySec.map(x=>`<div class="sbar"><span>${esc(x[0])}</span><b>${x[1]}/${x[2]}</b><div class="prog"><i style="width:${x[1]/x[2]*100}%"></i></div></div>`).join("")}
  ${weak.length?`<div class="pit"><h3>Nên ôn lại</h3>${esc(weak.join(", "))}.</div>`:`<div class="why"><h3>Tốt lắm</h3>Bạn đúng ở mọi mục. Thi lại để gặp các câu mới.</div>`}
  <h2 style="font-size:17px">Xem lại từng câu</h2>
  ${V.qs.map((q,i)=>`<div class="rev ${ok[i]?"":"bad"}"><b>Câu ${i+1}. ${esc(q.q)}</b><span>Bạn chọn: ${V.ans[i]>=0?esc(q.opts[V.ans[i]].t):"(không trả lời)"}</span>${ok[i]?"":`<span>Đáp án đúng: <b>${esc(q.opts.find(o=>o.ok).t)}</b></span>`}${q.e?`<span style="color:var(--muted)">${esc(q.e)}</span>`:""}</div>`).join("")}
  <div class="nav"><button class="btn ghost" data-v="again" type="button">Chọn ca khác</button><button class="btn" data-v="retry" type="button">Thi lại ca này, câu mới</button></div></section>`;
  window.scrollTo({top:0});
}
function vivaClick(t){
  const a=t.dataset.v;
  if(a==="filter"){ V.filter=t.dataset.f; V.pg=0; return vivaPick(); }
  if(a==="pg"){ V.pg=(V.pg||0)+(+t.dataset.d); return S.mode==="learn"?learnList():vivaPick(); }
  if(a==="tfilter"){ V.filter=t.dataset.f; V.pg=0; V.rank=null; V.def=null; return S.mode==="learn"?learnList():vivaPick(); }
  if(a==="lcase"){ const d=CASEDEFS.find(x=>x.id===t.dataset.id); S.lreveal=false; S.lid=d.id; if(d.id==="demo"){ S.view="case"; S.cur=0; $("#steps").hidden=false; render(); return window.scrollTo({top:0}); } return bankStudy(d); }
  if(a==="lreveal"){ S.lreveal=true; return bankStudy(CASEDEFS.find(x=>x.id===S.lid)); }
  if(a==="lback") return learnList();
  if(a==="case"){ V.def=CASEDEFS.find(d=>d.id===t.dataset.id); vivaPick(); const s=$("#v-n"); return s&&s.scrollIntoView({block:"center"}); }
  if(a==="start"){ V.n=+$("#v-n").value; V.closed=$("#v-closed").checked; return vivaRead(); }
  if(a==="go") return vivaStart();
  if(a==="opt"){ V.pickd=+t.dataset.k; return vivaQ(); }
  if(a==="next"){ V.ans[V.i]=V.pickd; V.pickd=-1; if(V.i>=V.qs.length-1) return vivaFinish(); V.i++; vivaQ(); return window.scrollTo({top:0}); }
  if(a==="again"){ V.def=null; V.rank=null; return vivaPick(); }
  if(a==="retry") return vivaRead();
  if(a==="learn") return setMode("learn");
}

learnList();
</script>
