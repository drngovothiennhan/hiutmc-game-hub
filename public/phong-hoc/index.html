ớc biến cố chưa có dữ kiện.","luoc_qua_co_quan":"Thần kinh có lơ mơ, định hướng kém, trả lời chậm và run chi; không ghi nhận co giật hoặc yếu liệt khu trú rõ. Tim mạch có hồi hộp, nhịp nhanh xoang, không đau ngực; hô hấp thở đều, không ho, nhưng phản xạ bảo vệ đường thở giảm. Tiêu hóa có buồn nôn và ăn ít, không sốt; tiết niệu và cơ xương khớp chưa có dữ kiện. YHCT ghi nhận lưỡi ẩm rêu trắng mỏng, chưa đủ xác lập tỳ khí hư.","tom_tat":"Nam 58 tuổi, đái tháo đường type 2 đang dùng thuốc, ăn rất ít tối trước nhưng vẫn dùng thuốc, được phát hiện run, vã mồ hôi và lơ mơ gần sáng. Khám định hướng kém, gọi mở mắt, phản xạ bảo vệ đường thở giảm, mạch 116 lần/phút; glucose mao mạch 2,1 mmol/L và ECG nhịp nhanh xoang. Không sốt, ho, đau ngực, co giật hoặc yếu liệt khu trú rõ. Theo YHCT, ca được xếp quyết chứng do hạ đường huyết; nhận định tỳ khí hư cần kiểm chứng sau tỉnh.","dat_van_de":"Rối loạn tri giác cấp kèm dấu kích hoạt giao cảm và glucose máu thấp ở người dùng thuốc hạ đường huyết sau giảm ăn, có nguy cơ mất bảo vệ đường thở và tái diễn. Chứng trạng YHCT gồm thanh khiếu không được nuôi dưỡng, thuộc nhận định lý hư của ca, cần bổ sung căn cứ về tỳ khí.","bien_luan":"Glucose 2,1 mmol/L cùng rối loạn tri giác cần người khác hỗ trợ xác định hạ đường huyết nặng; ăn ít trong khi vẫn dùng thuốc là yếu tố thuận lợi. Đột quỵ ít gợi ý vì không có thiếu hụt khu trú rõ, nhưng phải đánh giá lại nếu tri giác hoặc dấu thần kinh không hồi phục sau điều chỉnh glucose; co giật và nhiễm trùng chưa có bằng chứng hiện tại. Cần đo glucose nối tiếp, xác minh thuốc và thời điểm dùng, kiểm tra chức năng thận, điện giải và nguyên nhân buồn nôn; HbA1c phục vụ điều chỉnh lâu dài, không cần chờ khi cấp cứu. YHCT theo ca là Quyết chứng do hạ đường huyết, bát cương Lý–Hư, thể Tỳ khí hư, tinh khí không nuôi dưỡng thanh khiếu; bù glucose trước, sau tỉnh mới đánh giá để cân nhắc ích khí kiện tỳ.","sinh_ly_benh":"Lượng glucose cung cấp không đáp ứng tác dụng của thuốc có thể gây hạ glucose máu, kích hoạt giao cảm làm run, vã mồ hôi và tim nhanh. Thiếu glucose cho não gây rối loạn nhận thức và tri giác; suy thận nếu có có thể kéo dài tác dụng một số thuốc. Theo YHCT, thanh khiếu thất dưỡng là diễn giải của ca, không thay thế cơ chế thiếu glucose não hoặc chứng minh tỳ khí hư.","tien_luong":"Gần: thường cải thiện khi bù glucose kịp thời, nhưng có nguy cơ sặc, tổn thương thần kinh nếu kéo dài và tái hạ đường huyết tùy thuốc. Xa: phụ thuộc điều chỉnh điều trị, bữa ăn và khả năng nhận biết dấu báo trước. Biện chứng YHCT cần đánh giá lại sau hồi phục, không mặc định duy trì thể tỳ khí hư.","du_phong":"Không cho ăn uống khi chưa tỉnh và chưa nuốt an toàn; sau hồi phục cần kế hoạch xử trí khi ăn kém, tránh tự điều chỉnh thuốc thiếu hướng dẫn. Hướng dẫn gia đình nhận biết dấu hạ đường huyết, theo dõi glucose và đưa đi cấp cứu khi người bệnh lơ mơ hoặc không tự xử trí được. YHCT chỉ hỗ trợ khi có chỉ định, cần rà soát tương tác và tiếp tục theo dõi glucose; tái khám sớm để điều chỉnh phác đồ."},"nguon":["American Diabetes Association, Glycemic Goals, Hypoglycemia, and Hyperglycemic Crises: Standards of Care in Diabetes, 2026.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020 — khung tham chiếu kết hợp; cần đối chiếu nguồn chuyên biệt về Quyết chứng."],"status":"draft"},{"id":"xhth-tren-xo-gan","title":"Nôn máu và đi ngoài phân đen","kind":"Cấp cứu","level":"Trung bình","group":"capcuu","place":"Khoa Cấp cứu","clock":"23:15","name":"Ông Đặng Văn Tám","age":67,"sex":"nam","intro":"Người bệnh nôn ra máu đỏ sẫm hai lần và đi ngoài phân đen trong ngày. Có tiền sử xơ gan do rượu; gần đây mệt tăng. Gia đình không rõ người bệnh có đang dùng thuốc chống đông hay không.","vitals":{"hr":122,"sbp":88,"dbp":54,"rr":24,"t":36.6,"spo2":95},"ask":[["Nôn máu bắt đầu khi nào và số lần?","Nôn máu đỏ sẫm hai lần trong vài giờ gần đây.","e"],["Lượng máu ước tính và có cục máu không?","Gia đình thấy một lượng đáng kể, có lẫn cục máu; không cân đo được.","e"],["Phân có màu đen, dính và mùi khẳm không?","Đi ngoài phân đen, dính, mùi khẳm từ sáng.","e"],["Có chóng mặt, ngất hoặc yếu lả không?","Choáng khi đứng, mệt lả.","e"],["Có tiền sử bệnh gan, loét dạ dày hoặc xuất huyết tiêu hóa không?","Được chẩn đoán xơ gan; từng đau thượng vị nhưng chưa nội soi gần đây.","e"],["Có dùng thuốc chống đông, aspirin hoặc thuốc giảm đau kháng viêm không?","Gia đình không rõ; cần kiểm tra toa thuốc.","e"],["Có uống rượu gần đây không?","Có uống rượu nhiều năm, gần đây vẫn uống.","n"],["Có đau bụng dữ dội hoặc sốt không?","Không đau bụng dữ dội, không sốt.","n"]],"exam":[["V","Da và niêm mạc","Da nhợt, niêm mạc nhạt.","e"],["V","Tri giác","Tỉnh nhưng mệt, trả lời chậm.","n"],["V","Bụng","Bụng hơi chướng, có tuần hoàn bàng hệ nhẹ.","n"],["M","Chất nôn","Có dịch nôn màu đỏ sẫm lẫn cục máu theo ghi nhận của gia đình.","e"],["M","Hơi thở","Không khó thở rõ; có mùi rượu nhẹ.","n"],["T","Mạch (thiết)","Nhanh nhỏ, đầu chi lạnh; mạch tế sác.","e"],["V","Quan sát lưỡi","Lưỡi nhạt tím, rêu vàng bẩn.","e"],["K","Tuần hoàn và bụng","Hạ huyết áp tư thế/choáng, bụng mềm, không phản ứng thành bụng.","e"]],"tests":[["Công thức máu",15,"Hb 7,8 g/dL; cần diễn giải cùng tình trạng huyết động và diễn tiến chảy máu.","e"],["Nhóm máu, sàng lọc kháng thể và phản ứng chéo",20,"Đang tiến hành chuẩn bị chế phẩm máu nếu có chỉ định.","e"],["Ure, creatinin, điện giải và chức năng gan",20,"Ure tăng; cần đánh giá bệnh gan và rối loạn chuyển hóa.","n"],["Đông máu",15,"INR tăng nhẹ; cần tìm thuốc chống đông và bệnh gan liên quan.","e"],["CT sọ não",30,"Không có chỉ định ban đầu khi không có triệu chứng thần kinh hoặc chấn thương.","w"]],"opt":{"ydx":["+Xuất huyết tiêu hóa trên có sốc giảm thể tích, nghi tăng áp cửa","Xuất huyết tiêu hóa dưới","Viêm dạ dày không biến chứng","Tắc ruột","Hội chứng Mallory Weiss đơn thuần"],"bd":["+Thổ huyết, tiện huyết","Vị quản thống đơn thuần","Tiết tả","Huyễn vựng mạn","Cổ trướng đơn thuần"],"bc":["+Lý hư nhiệt, khí huyết hao thoát","Biểu hư hàn","Biểu thực nhiệt","Lý hư hàn","Lý thực hàn"],"the":["+Vị nhiệt thương lạc, khí huyết hao thoát","Tỳ vị hư hàn","Can khí phạm vị","Vị âm hư","Phong hàn phạm biểu"],"phap":["+Hồi sức và kiểm soát chảy máu YHHĐ trước, sau đó ích khí nhiếp huyết","Chỉ dùng thuốc cầm máu YHCT thay hồi sức","Ôn trung chỉ thống","Thanh nhiệt táo thấp đơn trị","Hoạt huyết hóa ứ"],"phuong":["+Độc sâm thang hỗ trợ ích khí (chỉ sau hồi sức)","Hoàng thổ thang thay hồi sức","Bạch hổ thang","Lý trung hoàn","Huyết phủ trục ứ thang"],"huyet":["+Túc tam lý","+Nội quan","+Công tôn","+Trung quản","Hợp cốc","Phong trì","Thái uyên"]},"actions":["++Gọi hỗ trợ cấp cứu, đánh giá ABC và theo dõi huyết động liên tục|1|Nôn máu kèm tụt huyết áp, mạch nhanh.","++Thiết lập đường truyền ngoại vi phù hợp, lấy xét nghiệm và chuẩn bị chế phẩm máu theo quy trình|5|Có dấu hiệu sốc và thiếu máu.","++Hồi sức tuần hoàn, đánh giá đáp ứng và chỉ định truyền máu theo hướng dẫn hiện hành|5|Không trì hoãn hồi sức khi huyết động không ổn định.","++Hội chẩn tiêu hóa/nội soi và đánh giá nguyên nhân tăng áp cửa hoặc loét|5|Cần kiểm soát nguồn chảy máu.","+Rà soát thuốc chống đông, kháng kết tập và NSAID; đánh giá chức năng gan/đông máu|5|Các yếu tố này ảnh hưởng chảy máu và kế hoạch điều trị.","+Giữ nhịn ăn uống, chuẩn bị đường thở nếu nôn máu nhiều hoặc tri giác giảm|2|Giảm nguy cơ sặc.","!Cho người bệnh về nhà vì nôn máu đã tạm ngừng|1|Có thể tiếp tục xuất huyết và sốc.","!Cho uống thuốc YHCT cầm máu hoặc châm cứu thay hồi sức và nội soi|10|Trì hoãn xử trí xuất huyết tiêu hóa nguy kịch."],"teach":"Nôn máu, phân đen, mạch nhanh và huyết áp thấp gợi ý xuất huyết tiêu hóa trên có giảm thể tích tuần hoàn. Ưu tiên ABC, theo dõi, đường truyền, xét nghiệm/chuẩn bị máu và phối hợp kiểm soát nguồn chảy máu. Cần rà soát thuốc chống đông, thuốc kháng kết tập, NSAID và bệnh gan; YHCT không thay thế hồi sức.","hbu":{"tien_su":"Có xơ gan do rượu, uống rượu nhiều năm và gần đây vẫn uống; từng đau thượng vị, chưa nội soi gần đây. Gia đình chưa rõ việc dùng chống đông, aspirin hoặc NSAID; tiền sử gia đình và các đợt xuất huyết trước chưa có dữ kiện. Tiền căn bệnh gan là nền quan trọng, nhưng không tự xác lập vị nhiệt theo YHCT.","luoc_qua_co_quan":"Tiêu hóa có nôn máu đỏ sẫm lẫn cục máu, phân đen dính, bụng hơi chướng và tuần hoàn bàng hệ; không đau bụng dữ dội hoặc phản ứng thành bụng. Tim mạch có mạch nhanh nhỏ, huyết áp thấp, chi lạnh; thần kinh còn tỉnh nhưng mệt, trả lời chậm và choáng khi đứng. Không sốt, không khó thở rõ; tiết niệu và cơ xương khớp chưa có dữ kiện. YHCT có lưỡi nhạt tím, rêu vàng bẩn và dấu khí huyết hao thoát.","tom_tat":"Nam 67 tuổi, xơ gan do rượu và vẫn uống rượu, vào viện vì nôn máu đỏ sẫm hai lần, có cục máu, đi phân đen và mệt lả. Huyết áp 88/54 mmHg, mạch 122 lần/phút, da niêm nhợt, chi lạnh, bụng hơi chướng có tuần hoàn bàng hệ; Hb 7,8 g/dL, ure tăng và INR tăng nhẹ. Không sốt, đau bụng dữ dội hoặc phản ứng thành bụng; chưa xác định nguồn chảy máu bằng nội soi. Theo YHCT, thổ huyết, tiện huyết và khí huyết hao thoát được ghi nhận, còn vị nhiệt cần đối chiếu.","dat_van_de":"Xuất huyết đường tiêu hóa trên đang diễn tiến, kèm thiếu máu và sốc giảm thể tích trên nền bệnh gan mạn, có dấu gợi tăng áp lực hệ cửa. Chứng trạng YHCT gồm nôn huyết, tiện huyết, khí huyết hao thoát; căn cứ vị nhiệt và hư nhiệt chưa đầy đủ.","bien_luan":"Nôn máu và phân đen xác định xuất huyết tiêu hóa trên; mạch nhanh, huyết áp thấp, chi lạnh và mệt lả phù hợp sốc giảm thể tích do mất máu. Xơ gan cùng tuần hoàn bàng hệ gợi xuất huyết liên quan tăng áp cửa, nhưng loét dạ dày tá tràng vẫn phải xét vì từng đau thượng vị và thuốc chưa rõ; rách niêm mạc sau nôn ít gợi ý khi chưa có tiền sử nôn gắng sức trước chảy máu. Cần nội soi sau hồi sức ban đầu để xác định và kiểm soát nguồn chảy máu, theo dõi công thức máu, huyết động, chức năng gan thận và rà soát thuốc; INR tăng nhẹ không tự chứng minh dùng chống đông hoặc định lượng nguy cơ chảy máu trong xơ gan. YHCT theo ca là Thổ huyết, Tiện huyết, Lý–Hư–Nhiệt, khí huyết hao thoát, thể Vị nhiệt thương lạc kèm khí huyết hao thoát; hồi sức và cầm máu trước, sau đó mới đánh giá pháp ích khí nhiếp huyết.","sinh_ly_benh":"Xơ gan làm tăng sức cản dòng máu qua gan, gây tăng áp cửa và hình thành tuần hoàn bàng hệ, có thể dẫn đến vỡ tĩnh mạch giãn. Mất máu làm giảm thể tích tuần hoàn, giảm cung cấp oxy mô và gây sốc; nguồn chảy máu cụ thể chưa được xác nhận. Theo YHCT, ca được diễn giải là lạc mạch tổn thương và khí huyết hao thoát, nhưng cơ chế vị nhiệt cần thêm chứng trạng.","tien_luong":"Gần: nặng vì sốc, thiếu máu và nguy cơ sặc máu, phụ thuộc hồi sức và kiểm soát nguồn chảy máu. Xa: có nguy cơ tái xuất huyết và mất bù bệnh gan; chưa đủ dữ liệu phân tầng theo Child-Pugh hoặc MELD. Theo YHCT, cần đánh giá lại khí huyết sau cầm máu, không dùng cải thiện mạch làm căn cứ duy nhất cho hồi phục.","du_phong":"Sau ổn định, ngừng rượu và theo dõi bệnh gan, tuân thủ kế hoạch dự phòng tái xuất huyết theo nguyên nhân nội soi, không tự dùng NSAID hoặc thay thuốc chống huyết khối. YHCT chỉ cân nhắc sau hồi sức và rà soát tương tác, không thay kiểm soát tăng áp cửa hoặc cầm máu. Tái khám tiêu hóa đúng hẹn; cấp cứu khi nôn máu, phân đen tăng, choáng hoặc thay đổi tri giác."},"nguon":["Baveno VII, Renewing Consensus in Portal Hypertension, 2022.","World Society of Emergency Surgery, Perforated and Bleeding Peptic Ulcer: WSES Guidelines, 2020.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020 — khung tham chiếu kết hợp; cần đối chiếu nguồn chuyên biệt về Thổ huyết, Tiện huyết."],"status":"draft"},{"id":"co-giat-do-sot-cao-tre-em","title":"Trẻ 2 tuổi sốt cao, đang co giật","kind":"Nhi","level":"Dễ","group":"sannhi","place":"Khoa Cấp cứu Nhi","clock":"02:40","name":"Bé Đặng Gia Bảo","age":2,"sex":"nam","intro":"Mẹ bế bé vào khoa Cấp cứu lúc nửa đêm vì bé lên cơn co giật toàn thân khoảng 5 phút trước, đến giờ vẫn chưa dừng hẳn. Bé sốt từ chiều, ho và sổ mũi hai ngày nay.","vitals":{"hr":168,"sbp":96,"dbp":58,"rr":38,"t":39.8,"spo2":90},"ask":[["Cơn co giật bắt đầu khi nào, đã kéo dài bao lâu?","Khoảng 5 phút trước, bé co cứng rồi giật cả hai tay chân, mắt trợn ngược, đến giờ vẫn chưa dừng hẳn.","e"],["Cơn giật là cả người hay một bên? Môi bé có tím không?","Giật cả hai bên người, môi hơi tím.","e"],["Bé sốt từ khi nào, cao nhất bao nhiêu? Đã cho uống thuốc hạ sốt chưa?","Sốt từ chiều nay, ở nhà đo được 39,5 độ, chưa kịp cho uống thuốc hạ sốt.","n"],["Có ho, sổ mũi, đau họng, nôn ói hoặc tiêu chảy kèm theo không?","Ho, sổ mũi hai ngày nay. Không nôn, không tiêu chảy.","e"],["Trước cơn bé có quấy khóc dữ dội, nôn vọt, nổi ban hoặc li bì không?","Không nôn vọt, không nổi ban. Trước cơn bé vẫn chơi và bú được.","e"],["Bé đã từng co giật lần nào chưa? Gia đình có ai bị sốt co giật hoặc động kinh không?","Đây là lần đầu. Anh ruột lúc nhỏ có bị sốt co giật.","n"],["Bé có ngã đập đầu hoặc uống nhầm thuốc, hóa chất không?","Không ngã, không uống nhầm thuốc.","n"],["Tiền sử sinh nở, phát triển và tiêm chủng của bé?","Sinh đủ tháng, phát triển bình thường, tiêm chủng đủ theo lịch.","n"],["Mấy ngày nay bé ăn bú thế nào?","Vẫn bú được, hơi kém hơn ngày thường.","n"]],"exam":[["V","Quan sát cơn co giật","Co giật toàn thể kiểu cứng rồi giật, mắt trợn ngược, thở nông, chưa dừng sau khoảng 5 phút.","e"],["V","Da và môi","Da đỏ, nóng, vã mồ hôi; môi tím nhẹ.","e"],["V","Da, thóp, phù","Không có ban xuất huyết, không phù.","n"],["M","Tiếng thở","Thở nhanh, có tiếng khò khè đờm dãi ở họng, không rít thanh quản.","n"],["M","Mùi hơi thở và chất nôn","Không có mùi hóa chất lạ.","n"],["T","Mạch và da","Mạch quay nhanh, nảy, đều; da nóng ẩm.","n"],["K","Khám họng, tai","Họng đỏ, amidan sung huyết, không có mủ; màng nhĩ bình thường.","e"],["K","Dấu hiệu màng não và thần kinh","Khi cơn giật tạm ngưng: cổ mềm, Brudzinski âm tính, không có dấu thần kinh khu trú.","e"],["K","Khám phổi và tim","Phổi thô, ít ran ngáy; tim nhanh đều, không có âm thổi.","n"]],"tests":[["Đường huyết mao mạch",2,"4,8 mmol/L, loại trừ hạ đường huyết.","e"],["Công thức máu và CRP",15,"Bạch cầu 12 G/L, CRP không cao, gợi ý nhiễm virus.","n"],["Điện giải đồ và canxi máu",15,"Natri, canxi trong giới hạn bình thường.","n"],["Test nhanh cúm A và B",15,"Âm tính.","n"],["Chọc dò dịch não tủy",30,"Chỉ làm khi có dấu màng não hoặc nghi ngờ viêm màng não; ở ca này không có chỉ định thường quy.","n"],["CT sọ não không cản quang",30,"Không có chỉ định: không chấn thương, không dấu thần kinh khu trú, bé hồi phục tri giác.","w"],["Điện não đồ",30,"Không có chỉ định thường quy sau một cơn sốt co giật đơn thuần.","w"]],"opt":{"ydx":["+Co giật do sốt đơn thuần, cơn kéo dài cần cắt cơn","Viêm màng não mủ","Động kinh toàn thể khởi phát sớm","Hạ đường huyết gây co giật","Co giật do hạ canxi máu","Ngộ độc thuốc hoặc hóa chất gây co giật"]},"actions":["++Đặt bé nằm nghiêng an toàn, nới quần áo, hút đờm dãi, giữ thông thoáng đường thở|1|Bảo vệ đường thở, tránh sặc trong cơn giật.","++Thở oxy qua mặt nạ, theo dõi SpO2 và nhịp thở liên tục|1|SpO2 90% và môi tím trong lúc giật.","++Cắt cơn bằng thuốc nhóm benzodiazepin theo phác đồ nhi khoa, theo dõi nhịp thở sau dùng|2|Cơn giật đã quá 5 phút nên cần thuốc cắt cơn, không chờ tự hết.","+Thiết lập đường truyền tĩnh mạch ngoại vi|2|Để lấy máu xét nghiệm và dùng thuốc cắt cơn bước hai nếu cần.","+Hạ sốt bằng paracetamol sau khi hết giật, kết hợp lau ấm|2|Giúp bé dễ chịu, nhưng không dự phòng được cơn giật tái phát.","+Theo dõi tại khoa cấp cứu vài giờ sau cơn, đánh giá lại tri giác và dấu màng não|3|Loại trừ nhiễm trùng thần kinh trung ương trước khi cho về.","+Giải thích cho cha mẹ cách xử trí khi bé giật lại, không nhét vật vào miệng|2|Sốt co giật hay tái phát, cần hướng dẫn gia đình.","-Dùng kháng sinh phổ rộng tĩnh mạch thường quy|3|Không có bằng chứng nhiễm khuẩn nặng, bệnh cảnh gợi ý nhiễm virus hô hấp.","-Cho phenobarbital dự phòng kéo dài|2|Không chỉ định thuốc chống động kinh dự phòng sau sốt co giật đơn thuần.","!Nhét vật cứng hoặc muỗng vào miệng bé để chống cắn lưỡi|1|Gây tổn thương răng, tắc đường thở; bé ít khi cắn lưỡi nguy hiểm.","!Cho bé uống thuốc hạ sốt và nước trong khi đang co giật|1|Nguy cơ hít sặc.","!Lau người bằng cồn hoặc chườm nước đá|2|Gây co mạch, run, hấp thu cồn qua da ở trẻ nhỏ; không hạ sốt hiệu quả."],"teach":"Sốt co giật đơn thuần ở trẻ 6 tháng đến 5 tuổi thường lành tính, nhưng cơn kéo dài trên 5 phút cần cắt cơn ngay và phải loại trừ hạ đường huyết, viêm màng não. Việc đầu tiên là đường thở, oxy và thuốc cắt cơn, không nhét vật vào miệng. Hạ sốt chỉ để bé dễ chịu, không ngăn được cơn giật tái phát. YHCT (chứng kinh phong do nhiệt) chỉ hỗ trợ sau khi bé ổn định.","hbu":{"tien_su":"Đây là cơn co giật đầu tiên; sinh đủ tháng, phát triển bình thường và tiêm chủng đủ theo lịch. Anh ruột từng sốt co giật khi nhỏ. Không chấn thương đầu hoặc uống nhầm thuốc, hóa chất; bệnh nền và dị ứng chưa được cung cấp.","luoc_qua_co_quan":"Thần kinh có co giật toàn thể đang kéo dài, khi tạm ngưng cổ mềm, Brudzinski âm tính và không có dấu khu trú. Hô hấp có ho, sổ mũi, thở nông trong cơn, đờm dãi và tím môi nhẹ; tim nhanh đều. Tiêu hóa không nôn hoặc tiêu chảy, bú hơi kém; tiết niệu và cơ xương khớp chưa có dữ kiện. Không ban xuất huyết, không nôn vọt, trước cơn vẫn chơi và bú được.","tom_tat":"Trẻ nam 2 tuổi, lần đầu co giật toàn thể kiểu cứng–giật trong bối cảnh sốt từ chiều và ho, sổ mũi hai ngày, cơn khoảng 5 phút vẫn chưa dừng hẳn. Nhiệt độ 39,8 độ C, SpO2 90%, thở nông, môi tím nhẹ; glucose 4,8 mmol/L, natri và canxi bình thường. Khi cơn tạm ngưng không cứng gáy hay dấu thần kinh khu trú, không ban xuất huyết, chấn thương hoặc phơi nhiễm độc chất. Chẩn đoán đơn thuần cần đối chiếu tổng thời gian cơn và diễn tiến trong 24 giờ.","dat_van_de":"Co giật toàn thể trong bối cảnh sốt ở trẻ đang phát triển bình thường, cơn đạt ngưỡng cần cắt cơn khẩn và kèm giảm oxy máu. Cần bảo vệ đường thở, tìm nguồn sốt và loại trừ nhiễm trùng thần kinh hoặc rối loạn chuyển hóa.","bien_luan":"Tuổi 2 năm, sốt, cơn toàn thể, phát triển bình thường và chưa có bằng chứng nhiễm trùng thần kinh hoặc rối loạn chuyển hóa phù hợp định hướng co giật do sốt đơn thuần của ca. Tuy nhiên, cơn đang tiếp diễn khoảng 5 phút cần điều trị cấp cứu, còn phân loại đơn thuần chỉ được xác nhận khi tổng thời gian dưới 15 phút và không tái diễn trong 24 giờ. Hạ đường huyết, rối loạn natri và canxi ít phù hợp với xét nghiệm; viêm màng não hoặc viêm não vẫn phải đánh giá nếu tri giác không hồi phục, có dấu màng não hay diễn tiến bất thường, khi đó cân nhắc dịch não tủy sau ổn định. Không cần EEG hoặc hình ảnh não thường quy nếu sau theo dõi xác nhận cơn đơn thuần và khám thần kinh bình thường; chỉ dấu viêm thấp và test cúm âm tính chưa xác định chắc căn nguyên virus.","sinh_ly_benh":"Não trẻ nhỏ có ngưỡng co giật thấp hơn, trong khi sốt và đáp ứng viêm có thể làm tăng tính kích thích thần kinh ở trẻ có cơ địa nhạy cảm. Cơn kéo dài có thể gây giảm thông khí, tăng nhu cầu oxy và thiếu oxy máu. Tiền sử anh ruột sốt co giật gợi yếu tố gia đình nhưng không đồng nghĩa trẻ mắc động kinh.","tien_luong":"Gần: cần theo dõi sát hô hấp, đáp ứng cắt cơn và hồi phục tri giác; thường thuận lợi nếu cơn được kiểm soát và không có bệnh nguyên nghiêm trọng. Xa: thường lành tính nếu xác nhận cơn đơn thuần, nhưng có thể tái phát khi sốt. Chưa thể dự báo riêng nguy cơ động kinh khi tổng thời gian và diễn tiến cơn chưa hoàn tất.","du_phong":"Dặn cha mẹ đặt trẻ nằm nghiêng an toàn, bảo vệ khỏi va đập, ghi thời gian cơn, không ghì giữ, nhét vật vào miệng hoặc cho uống khi đang giật. Gọi cấp cứu nếu cơn kéo dài từ 5 phút, khó thở hoặc không hồi tỉnh; hạ sốt giúp dễ chịu nhưng không bảo đảm ngăn tái phát. Tái khám để theo dõi nguồn sốt và diễn tiến, trở lại ngay nếu li bì kéo dài, cứng gáy, ban xuất huyết hoặc cơn khu trú."},"nguon":["American Academy of Pediatrics, Febrile Seizures: Guideline for the Neurodiagnostic Evaluation of the Child With a Simple Febrile Seizure, 2011.","NICE, Epilepsies in Children, Young People and Adults, NG217, 2022 — mục xử trí trạng thái động kinh co giật."],"status":"draft"},{"id":"thung-o-loet-da-day-ta-trang","title":"Đau bụng dữ dội, bụng cứng như gỗ","kind":"Ngoại","level":"Dễ","group":"ngoai","place":"Khoa Cấp cứu","clock":"23:10","name":"Ông Võ Văn Thịnh","age":52,"sex":"nam","intro":"Ông được người nhà đưa vào cấp cứu vì đau bụng đột ngột, dữ dội vùng thượng vị cách đây 4 giờ, sau đó đau lan khắp bụng. Ông có tiền sử đau dạ dày nhiều năm và hay uống thuốc giảm đau xương khớp.","vitals":{"hr":112,"sbp":100,"dbp":64,"rr":24,"t":37.9,"spo2":96},"ask":[["Đau bắt đầu như thế nào, ở đâu, mức độ ra sao?","Đột ngột như dao đâm ở vùng thượng vị cách đây khoảng 4 giờ, sau đó lan khắp bụng. Đau 9 trên 10, không dám cử động.","e"],["Trước đây có đau dạ dày, đã nội soi chưa? Có dùng thuốc giảm đau, kháng viêm không?","Đau thượng vị âm ỉ nhiều năm, chưa nội soi. Hay uống ibuprofen và diclofenac vì đau khớp gối.","e"],["Có nôn, nôn ra máu hoặc đi cầu phân đen không?","Buồn nôn, nôn một lần ra dịch vàng. Không nôn ra máu, phân vàng.","e"],["Đau có lan lên vai không? Thay đổi tư thế hay thở sâu có đau thêm không?","Đau lan lên vai phải. Ho hoặc hít sâu đau tăng, nằm im co gối thì đỡ hơn.","n"],["Còn trung tiện được không? Bụng có chướng không?","Còn trung tiện, bụng căng.","n"],["Có sốt hoặc rét run không?","Hơi nóng người, không rét run.","n"],["Có uống rượu hoặc ăn no trước khi đau không?","Có uống vài ly rượu và ăn tối no rồi mới đau.","n"],["Có bệnh tim mạch, đái tháo đường, dị ứng thuốc không?","Không có bệnh nền, chưa biết dị ứng thuốc.","n"]],"exam":[["V","Tư thế và vẻ mặt","Nằm im co gối, mặt tái, vẻ đau đớn, vã mồ hôi.","e"],["V","Hình dạng bụng","Bụng hơi chướng, di động theo nhịp thở kém.","n"],["M","Giọng nói và hơi thở","Nói ngắn từng câu, thở nông nhanh.","n"],["M","Mùi hơi thở","Có mùi rượu nhẹ.","n"],["T","Mạch và đầu chi","Mạch nhanh, nhỏ; đầu chi mát, ẩm.","n"],["K","Sờ nắn bụng","Bụng cứng như gỗ, co cứng thành bụng toàn bộ, đau nhiều nhất ở thượng vị, phản ứng dội dương tính.","e"],["K","Gõ bụng","Mất vùng đục trước gan.","e"],["K","Nghe nhu động ruột","Nhu động ruột giảm rõ.","n"],["K","Thăm trực tràng","Túi cùng Douglas căng đau nhẹ, không có máu trên găng.","n"]],"tests":[["X-quang ngực thẳng và bụng đứng không chuẩn bị",10,"Liềm hơi dưới vòm hoành phải.","e"],["Công thức máu",10,"Bạch cầu 15,8 G/L, tăng bạch cầu đa nhân trung tính; Hb 13,5 g/dL.","e"],["Nhóm máu, đông máu, sinh hóa cơ bản",15,"Trong giới hạn cho phép phẫu thuật; creatinin bình thường.","n"],["Siêu âm bụng",10,"Có hơi và dịch tự do ổ bụng lượng ít, không sỏi túi mật.","n"],["Amylase máu",15,"Tăng nhẹ, không phù hợp viêm tụy cấp điển hình.","n"],["Điện tâm đồ",5,"Nhịp nhanh xoang, không có ST chênh.","n"],["Nội soi dạ dày tá tràng",25,"Không nên làm khi nghi thủng tạng rỗng: bơm hơi làm tăng thoát hơi và dịch tiêu hóa vào ổ bụng.","w"]],"opt":{"ydx":["+Thủng ổ loét dạ dày tá tràng gây viêm phúc mạc","Viêm tụy cấp","Nhồi máu cơ tim thành dưới","Tắc ruột cơ học","Viêm ruột thừa cấp","Viêm túi mật cấp"]},"actions":["++Cho nhịn ăn uống hoàn toàn, đặt hai đường truyền tĩnh mạch, theo dõi monitor|2|Có dấu hiệu viêm phúc mạc, mạch nhanh, huyết áp thấp biên.","++Hồi sức dịch tinh thể tĩnh mạch và giảm đau đường tĩnh mạch theo phác đồ|3|Bù thể tích mất vào ổ bụng; giảm đau đúng cách không làm che lấp chẩn đoán.","++Hội chẩn ngoại khoa ngay để chuẩn bị phẫu thuật cấp cứu kiểm soát nguồn|2|Thủng tạng rỗng kèm viêm phúc mạc cần xử trí ngoại khoa sớm; kỹ thuật mổ phụ thuộc vị trí, kích thước lỗ thủng và tình trạng người bệnh.","+Dùng kháng sinh phổ rộng đường tĩnh mạch và thuốc ức chế bơm proton đường tĩnh mạch|2|Hạn chế nhiễm khuẩn ổ bụng, giảm tiết acid.","+Đặt sonde dạ dày hút liên tục và sonde tiểu theo dõi nước tiểu|3|Giảm dịch tiêu hóa tràn vào ổ bụng, đánh giá tưới máu.","+Giải thích tình trạng cho gia đình và chuẩn bị hồ sơ trước mổ|2|Hoàn thiện thủ tục đồng ý phẫu thuật.","-Chụp CT bụng có cản quang để tìm thêm tổn thương trước khi quyết định mổ|40|Đã đủ chẩn đoán bằng lâm sàng và X-quang, chụp thêm làm chậm mổ.","!Cho uống hỗn dịch bari để chụp dạ dày|5|Bari thoát qua lỗ thủng gây viêm phúc mạc bari, rất khó điều trị.","!Cho uống thuốc kháng acid, giảm đau và hẹn theo dõi ngoại trú|3|Trì hoãn xử trí viêm phúc mạc, nguy cơ sốc nhiễm khuẩn."],"teach":"Đau bụng đột ngột kèm dấu viêm phúc mạc và khí tự do gợi ý thủng tạng rỗng. Ưu tiên hồi sức, nhịn ăn, kháng sinh và hội chẩn ngoại khoa sớm. CT là phương tiện được khuyến nghị khi nghi thủng nếu có thể thực hiện kịp thời và người bệnh phù hợp; X-quang có khí tự do kèm bệnh cảnh điển hình có thể đủ để quyết định thăm dò phẫu thuật, vì vậy không nên biến CT thành đáp án sai tuyệt đối. Không nội soi bơm hơi khi đang nghi thủng.","hbu":{"tien_su":"Đau thượng vị nhiều năm, chưa nội soi, thường dùng ibuprofen và diclofenac vì đau khớp gối. Có uống rượu trước cơn đau; theo bệnh sử không có bệnh nền khác và chưa biết dị ứng thuốc. Tiền sử gia đình, H. pylori và điều trị bệnh dạ dày trước đây chưa có dữ kiện.","luoc_qua_co_quan":"Tiêu hóa có đau thượng vị đột ngột lan toàn bụng, nôn dịch vàng, bụng căng và nhu động giảm; không nôn máu, phân vàng, còn trung tiện. Hô hấp thở nông nhanh vì đau, ho hoặc hít sâu làm tăng đau; tim mạch có mạch nhanh nhỏ và chi mát ẩm. Thần kinh và tiết niệu chưa có khai thác đầy đủ. Cơ xương khớp có tiền sử đau gối, đau lan vai phải trong đợt hiện tại.","tom_tat":"Nam 52 tuổi, đau thượng vị kéo dài và thường dùng NSAID, vào viện vì đau đột ngột như dao đâm 4 giờ trước, sau lan khắp bụng và lên vai phải, kèm buồn nôn, nôn dịch vàng. Khám bụng cứng như gỗ, phản ứng dội dương tính, mất vùng đục trước gan, nhu động giảm; X-quang có liềm hơi dưới hoành phải, bạch cầu 15,8 G/L. Không nôn máu, phân đen hoặc rét run; creatinin bình thường, ECG không ST chênh. Bệnh cảnh phù hợp thủng ổ loét gây viêm phúc mạc, vị trí cụ thể cần xác nhận khi mổ.","dat_van_de":"Đau bụng cấp đột ngột kèm hội chứng kích thích phúc mạc toàn thể và khí tự do ổ bụng, có dấu giảm thể tích tuần hoàn. Tiền căn đau thượng vị kéo dài và sử dụng thuốc kháng viêm giảm đau là yếu tố nguy cơ quan trọng.","bien_luan":"Đau thượng vị đột ngột rồi lan toàn bụng, co cứng như gỗ và khí tự do dưới hoành xác định bệnh cảnh thủng tạng rỗng; tiền căn đau thượng vị và dùng NSAID làm nghĩ nhiều thủng ổ loét dạ dày tá tràng. Viêm tụy cấp ít phù hợp với khí tự do và bộ dấu thủng, amylase tăng nhẹ không đặc hiệu; viêm túi mật ít gợi ý vì không sỏi và không giải thích liềm hơi. Thiếu máu cơ tim ít phù hợp với dấu phúc mạc rõ, nhưng ECG không ST chênh không loại trừ mọi hội chứng vành; thủng đoạn ruột khác vẫn cần đối chiếu khi mổ. Cần hồi sức và phẫu thuật sớm, CT chỉ khi còn nghi ngờ và có thể thực hiện mà không trì hoãn, đồng thời theo dõi lactat, chức năng cơ quan và xác định vị trí, nguyên nhân tổn thương.","sinh_ly_benh":"Ổ loét ăn xuyên thành dạ dày hoặc tá tràng làm dịch tiêu hóa và khí thoát vào ổ bụng, gây viêm phúc mạc hóa học rồi nhiễm khuẩn. Đáp ứng viêm và thoát dịch vào khoang thứ ba gây giảm thể tích tuần hoàn, có thể tiến triển nhiễm khuẩn huyết. NSAID giảm tổng hợp prostaglandin bảo vệ niêm mạc, làm tăng nguy cơ loét và biến chứng.","tien_luong":"Gần: nặng vì viêm phúc mạc toàn thể và dấu giảm tưới máu, phụ thuộc thời gian kiểm soát nguồn nhiễm và hồi sức. Xa: có thể hồi phục tốt nhưng có nguy cơ biến chứng hậu phẫu và tái loét nếu nguyên nhân chưa được xử trí. Chưa đủ dữ kiện để tính điểm nguy cơ phẫu thuật cụ thể.","du_phong":"Sau mổ, tuân thủ điều trị và tái khám ngoại khoa–tiêu hóa, đánh giá H. pylori và nguyên nhân ổ loét khi phù hợp. Không tự dùng ibuprofen, diclofenac hoặc phối hợp NSAID; hạn chế rượu và theo kế hoạch giảm đau khớp an toàn. Trở lại viện khi đau bụng tăng, sốt, nôn kéo dài, phân đen hoặc vết mổ bất thường."},"nguon":["World Society of Emergency Surgery, Perforated and Bleeding Peptic Ulcer: WSES Guidelines, 2020."],"status":"draft"},{"id":"ngo-doc-phospho-huu-co","title":"Uống nhầm thuốc trừ sâu, vã mồ hôi, khó thở","kind":"Cấp cứu","level":"Trung bình","group":"capcuu","place":"Khoa Cấp cứu","clock":"17:35","name":"Ông Lương Văn Sáu","age":47,"sex":"nam","intro":"Ông được người nhà đưa vào cấp cứu sau khi uống nhầm chai thuốc trừ sâu đựng trong chai nước ngọt cách đây khoảng 45 phút. Người nhà mang theo chai thuốc, có mùi rất hắc. Ông nôn nhiều, chảy dãi và khó thở.","vitals":{"hr":52,"sbp":100,"dbp":60,"rr":28,"t":36.8,"spo2":88},"ask":[["Ông uống phải thứ gì, bao nhiêu và cách đây bao lâu?","Tôi tưởng chai nước ngọt, uống nhầm khoảng nửa ly, cách đây chừng 45 phút.","e"],["Hiện ông thấy những gì?","Buồn nôn, nôn nhiều, đau quặn bụng, chảy nước dãi, đổ mồ hôi, tức ngực và khó thở.","e"],["Người nhà có biết tên hoạt chất, nhãn chai ghi gì không?","Nhãn ghi thuốc trừ sâu nhóm phospho hữu cơ, mùi rất hắc.","e"],["Ông có ho nhiều đờm, khò khè không?","Ho đờm nhiều, thở khò khè, tức ngực.","e"],["Mắt nhìn thế nào?","Nhìn mờ, tối.","n"],["Có đại tiểu tiện không tự chủ, tiêu chảy không?","Đã đi tiêu phân lỏng một lần, són tiểu.","n"],["Có giật cơ, yếu tay chân không?","Thấy giật ở mặt và đùi, chân tay yếu.","n"],["Có bệnh nền, dị ứng thuốc, uống rượu cùng lúc không?","Không bệnh nền, không dị ứng, không uống rượu hôm nay.","n"]],"exam":[["V","Đồng tử","Co nhỏ như đầu đinh ghim hai bên, phản xạ ánh sáng chậm.","e"],["V","Da và tiết dịch","Vã mồ hôi đầm đìa, chảy nhiều nước dãi, chảy nước mắt.","e"],["V","Co giật cơ","Rung giật các bó cơ ở mặt và chi.","n"],["M","Mùi hơi thở và quần áo","Mùi hắc đặc trưng của thuốc trừ sâu phospho hữu cơ.","e"],["M","Tiếng thở","Thở khò khè, ran ngáy ẩm, đờm dãi nhiều.","n"],["T","Mạch","Mạch chậm 52 lần mỗi phút, yếu.","n"],["K","Nghe phổi","Ran ẩm và ran rít lan tỏa hai phế trường do tăng tiết và co thắt phế quản.","e"],["K","Khám bụng","Bụng mềm, tăng nhu động ruột, không phản ứng thành bụng.","n"],["K","Tri giác","Li bì nhưng gọi trả lời được, Glasgow 13 điểm.","n"]],"tests":[["Khí máu động mạch",8,"Thiếu oxy máu, toan hô hấp nhẹ.","e"],["Điện tâm đồ",5,"Nhịp chậm xoang, QTc kéo dài nhẹ, không block nhĩ thất.","e"],["Hoạt tính cholinesterase huyết tương",30,"Giảm rõ, xác nhận ức chế cholinesterase. Không chờ kết quả mới xử trí.","n"],["Đường huyết mao mạch",3,"6,4 mmol/L.","n"],["Điện giải đồ, chức năng gan thận",15,"Kali giảm nhẹ, chức năng thận bình thường.","n"],["X-quang ngực thẳng",10,"Mờ rải rác hai phế trường, không tràn khí.","n"],["CT sọ não không cản quang",25,"Không có chỉ định, không chấn thương, không dấu thần kinh khu trú.","w"]],"opt":{"ydx":["+Ngộ độc cấp thuốc trừ sâu phospho hữu cơ (hội chứng cholinergic)","Ngộ độc paraquat","Cơn hen phế quản nặng","Nhồi máu cơ tim cấp","Ngộ độc rượu methanol","Sốc phản vệ"]},"actions":["++Bảo đảm đường thở, hút đờm dãi, thở oxy, gắn monitor, sẵn sàng đặt nội khí quản và thở máy|2|SpO2 88% với tăng tiết phế quản nhiều, nguy cơ suy hô hấp.","++Tiêm tĩnh mạch atropin, lặp lại và tăng liều đến khi đạt dấu hiệu atropin hóa (hết ran phổi, mạch lên, khô dịch tiết)|3|Atropin là thuốc giải chính đối với biểu hiện muscarinic; mục tiêu là khô dịch tiết phế quản, không phải giãn đồng tử.","++Thiết lập đường truyền tĩnh mạch, lấy máu xét nghiệm và truyền dịch|2|Cần đường truyền để dùng atropin liên tục và bù dịch mất qua nôn, tiêu chảy.","+Cởi bỏ quần áo nhiễm, rửa da bằng nước sạch và xà phòng; nhân viên mang găng và áo choàng|2|Ngừng hấp thu qua da và bảo vệ nhân viên y tế.","+Chỉ cân nhắc khử độc đường tiêu hóa ở người đến rất sớm sau uống lượng độc đáng kể, sau khi đã ổn định và bảo vệ đường thở, theo tư vấn độc chất/phác đồ cơ sở|6|Lợi ích của rửa dạ dày hoặc than hoạt chưa chắc chắn; không được làm trước hồi sức, oxy và atropin, và không gây nôn cưỡng bức.","+Cân nhắc pralidoxim sau khi đã atropin hóa theo phác đồ cơ sở|3|Có thể tái hoạt hóa cholinesterase trong ngộ độc nặng; hiệu quả còn tranh luận.","+Chuyển hồi sức, theo dõi 24 đến 72 giờ|2|Nguy cơ suy hô hấp muộn do hội chứng trung gian và tái phát triệu chứng.","-Cho uống sữa hoặc dầu ăn để giảm hấp thu độc chất|1|Không có bằng chứng lợi ích, dầu có thể tăng hấp thu chất tan trong mỡ.","-Cho furosemid để giảm ran ẩm|2|Ran ẩm do tăng tiết phế quản chứ không do ứ dịch; cần atropin, không phải lợi tiểu.","!Gây nôn bằng móc họng hoặc cho uống nước muối đậm đặc|1|Nguy cơ hít sặc dịch chứa dung môi, bệnh nhân li bì.","!Dùng succinylcholin để đặt nội khí quản|2|Ức chế cholinesterase làm kéo dài tác dụng succinylcholin, gây liệt cơ kéo dài."],"teach":"Ngộ độc phospho hữu cơ gây hội chứng cholinergic: tăng tiết, co đồng tử, nhịp chậm, ran phổi và có thể yếu cơ. Ưu tiên đường thở, oxy/thông khí và atropin chuẩn độ theo dịch tiết-phổi; không chờ cholinesterase mới điều trị. Khử độc đường tiêu hóa chỉ cân nhắc chọn lọc sau ổn định, đặc biệt khi đến rất sớm, vì bằng chứng lợi ích hạn chế và có nguy cơ hít sặc. Tránh succinylcholine khi có thể do tác dụng có thể kéo dài.","hbu":{"tien_su":"Uống nhầm thuốc trừ sâu chứa trong chai nước ngọt khoảng 45 phút trước, lượng ước tính nửa ly; gia đình mang theo chai có nhãn nhóm phospho hữu cơ. Theo bệnh sử không bệnh nền, không dị ứng và không uống rượu cùng ngày. Tiền sử gia đình, thuốc đang dùng và phơi nhiễm nghề nghiệp chưa được cung cấp.","luoc_qua_co_quan":"Hô hấp có khó thở, khò khè, tăng tiết đờm dãi và giảm oxy máu; tim mạch có nhịp chậm xoang, mạch yếu. Tiêu hóa có nôn nhiều, đau quặn và phân lỏng, bụng mềm không phản ứng thành bụng; tiết niệu có són tiểu. Thần kinh có li bì, Glasgow 13, nhìn mờ, đồng tử co nhỏ; cơ xương khớp có rung giật bó cơ và yếu chi. Da vã mồ hôi, chảy nước mắt và nước bọt nhiều.","tom_tat":"Nam 47 tuổi, uống nhầm khoảng nửa ly thuốc trừ sâu có nhãn phospho hữu cơ 45 phút trước, sau đó nôn, đau bụng, tăng tiết, khó thở và yếu chi. Khám đồng tử co nhỏ, vã mồ hôi, rung giật bó cơ, ran ẩm–rít lan tỏa, mạch 52 lần/phút, SpO2 88%, Glasgow 13. Cholinesterase huyết tương giảm rõ, khí máu thiếu oxy và toan hô hấp nhẹ; ECG nhịp chậm xoang, không block nhĩ thất, bụng không phản ứng thành bụng. Các dấu phù hợp hội chứng cholinergic do ngộ độc cấp phospho hữu cơ.","dat_van_de":"Hội chứng tăng hoạt cholinergic gồm tăng tiết, co đồng tử, nhịp chậm, co thắt đường thở, rung giật bó cơ và thay đổi tri giác sau uống hóa chất. Có suy hô hấp và nguy cơ yếu cơ hô hấp, cần hồi sức và hạn chế nhiễm độc thứ phát cho nhân viên.","bien_luan":"Phơi nhiễm theo nhãn chai, phối hợp dấu muscarinic, nicotinic và thần kinh trung ương cùng cholinesterase giảm rõ xác định ngộ độc cấp phospho hữu cơ theo dữ liệu ca. Carbamat có thể gây hội chứng tương tự nên cần xác minh hoạt chất; ngộ độc opioid ít phù hợp vì không giải thích đầy đủ tăng tiết, tiêu chảy và rung giật bó cơ, còn tổn thương thần kinh trung ương không giải thích trình tự phơi nhiễm này. Mờ hai phế trường có thể do tăng tiết, hít sặc hoặc tổn thương phổi khác, chưa thể quy cho một cơ chế duy nhất. Cần theo dõi khí máu, ECG, điện giải, chức năng cơ quan và sức cơ, xác định hoạt chất từ chai thuốc; không chờ cholinesterase để bảo vệ đường thở và dùng atropin.","sinh_ly_benh":"Phospho hữu cơ ức chế acetylcholinesterase, gây tích tụ acetylcholine tại synap tự chủ, bản vận động và thần kinh trung ương. Tác động muscarinic gây tăng tiết, co thắt phế quản, nhịp chậm và tăng nhu động; tác động nicotinic gây rung giật rồi yếu cơ. Suy hô hấp có thể phối hợp tăng tiết, co thắt phế quản, yếu cơ và suy giảm điều khiển hô hấp trung ương.","tien_luong":"Gần: nặng vì thiếu oxy, tăng tiết đường thở và thay đổi tri giác, có nguy cơ cần thở máy hoặc rối loạn nhịp. Xa: phụ thuộc hoạt chất, liều hấp thu và biến chứng, cần theo dõi hội chứng trung gian cùng bệnh thần kinh muộn. Cải thiện sau atropin không tự chứng minh đã hết nguy cơ yếu cơ.","du_phong":"Bảo quản thuốc trừ sâu trong bao bì gốc có nhãn, khóa riêng khỏi thực phẩm, tuyệt đối không dùng chai nước uống và dùng bảo hộ khi tiếp xúc. Khi có phơi nhiễm mới, không tự gây nôn, đưa đến cấp cứu cùng nhãn sản phẩm nếu an toàn. Tái khám theo kế hoạch sau hồi phục; khám ngay khi yếu cổ, yếu chi, khó nuốt, khó thở hoặc tê bì tiến triển."},"nguon":["Bộ Y tế, Hướng dẫn chẩn đoán và xử trí ngộ độc, Quyết định 3610/QĐ-BYT, 2015.","AACT/EAPCCT, Position Paper Update: Gastric Lavage for Gastrointestinal Decontamination, 2013."],"status":"draft"},{"id":"nhiem-toan-ceton-dai-thao-duong","title":"Nôn, đau bụng, thở sâu ở người đái tháo đường","kind":"Nội","level":"Trung bình","group":"noi","place":"Khoa Cấp cứu","clock":"10:05","name":"Chị Trần Thu Hà","age":24,"sex":"nữ","intro":"Chị Hà được bạn đưa vào cấp cứu vì mệt lả, buồn nôn, nôn nhiều và đau bụng hai ngày nay. Chị bị đái tháo đường typ 1 từ năm 15 tuổi, ba ngày gần đây bỏ tiêm insulin vì đau họng và ăn kém.","vitals":{"hr":124,"sbp":92,"dbp":56,"rr":30,"t":37.8,"spo2":98},"ask":[["Các triệu chứng bắt đầu khi nào và diễn tiến ra sao?","Hai ngày nay khát nước nhiều, tiểu nhiều, mệt, buồn nôn và nôn nhiều lần.","e"],["Chị có bệnh nền gì, đang dùng insulin thế nào?","Đái tháo đường typ 1 từ năm 15 tuổi, trước đây tiêm insulin mỗi ngày.","e"],["Gần đây chị có ngưng hoặc giảm insulin, hoặc có bệnh gì kèm theo không?","Ba ngày nay bỏ tiêm vì sợ hạ đường huyết khi ăn kém. Đau họng, sốt nhẹ.","e"],["Chị có thấy thở nhanh, sâu hoặc hơi thở có mùi lạ không?","Thấy thở nhanh, sâu, miệng có mùi như trái cây chín.","e"],["Đau bụng ở đâu, tính chất thế nào?","Đau âm ỉ khắp bụng, không rõ chỗ, kèm buồn nôn.","n"],["Có đái buốt, ho, tiêu chảy không?","Đau họng, không đái buốt, không tiêu chảy.","n"],["Có thấy lơ mơ, buồn ngủ nhiều không?","Mệt nhiều, buồn ngủ nhưng vẫn tỉnh, trả lời đúng.","n"],["Kinh nguyệt, có khả năng mang thai không?","Kinh lần cuối cách đây 2 tuần, không có thai.","n"],["Có dị ứng thuốc không?","Không.","n"]],"exam":[["V","Kiểu thở","Thở nhanh, sâu, đều kiểu Kussmaul.","e"],["V","Da và niêm mạc","Da khô, niêm mạc khô, nếp véo da mất chậm, mắt trũng.","e"],["V","Tri giác","Tỉnh, hơi lơ mơ, trả lời chậm.","n"],["M","Hơi thở","Mùi aceton như trái cây chín.","e"],["M","Giọng nói","Nói chậm, ngắt quãng vì thở nhanh.","n"],["T","Mạch và đầu chi","Mạch nhanh, nhỏ; đầu chi mát.","n"],["K","Khám bụng","Bụng mềm, ấn đau lan tỏa nhẹ, không phản ứng thành bụng.","e"],["K","Khám họng","Họng đỏ, amidan viêm nhẹ, là yếu tố khởi phát có thể.","n"],["K","Khám tim phổi","Tim nhanh đều; phổi rì rào phế nang rõ, không ran.","n"]],"tests":[["Đường huyết mao mạch",2,"28,4 mmol/L.","e"],["Ceton máu hoặc ceton niệu",5,"Ceton máu tăng cao, ceton niệu dương tính mạnh.","e"],["Khí máu động mạch",8,"pH 7,08; HCO3 7 mmol/L; PaCO2 20 mmHg: toan chuyển hóa tăng khoảng trống anion.","e"],["Điện giải đồ, ure, creatinin",10,"Natri 131 mmol/L, kali 5,0 mmol/L, creatinin tăng nhẹ do mất nước.","e"],["Công thức máu và CRP",15,"Bạch cầu 17 G/L, CRP tăng nhẹ, phù hợp stress hoặc nhiễm khuẩn hô hấp.","n"],["Điện tâm đồ",5,"Nhịp nhanh xoang, sóng T cao nhẹ, không loạn nhịp nguy hiểm.","n"],["X-quang ngực thẳng",10,"Không có đông đặc.","n"],["CT bụng có cản quang",40,"Không có chỉ định; đau bụng do toan ceton thường giảm khi điều trị nền, cản quang là gánh nặng thêm cho thận đang mất nước.","w"]],"opt":{"ydx":["+Nhiễm toan ceton do đái tháo đường typ 1","Tăng áp lực thẩm thấu máu tăng đường huyết (không toan ceton)","Hạ đường huyết nặng","Viêm tụy cấp","Viêm ruột thừa cấp","Viêm dạ dày ruột cấp mất nước"]},"actions":["++Đánh giá ABC, gắn monitor, đặt hai đường truyền tĩnh mạch ngoại vi|2|Mất nước nặng, nhịp nhanh, toan chuyển hóa nặng.","++Bù dịch NaCl 0,9% tĩnh mạch nhanh trong giờ đầu rồi giảm tốc độ theo đáp ứng|3|Mất dịch lớn; bù dịch là bước đầu tiên và quan trọng nhất.","++Truyền insulin thường tĩnh mạch liên tục sau khi đã biết kali máu không thấp|3|Ngăn tạo ceton và hạ đường huyết; phải biết kali trước để tránh hạ kali nặng.","+Theo dõi đường huyết mỗi giờ, kali và khí máu định kỳ; bổ sung kali theo kết quả|2|Insulin đưa kali vào tế bào nên kali máu giảm nhanh.","+Thêm dung dịch có glucose khi đường huyết xuống dưới ngưỡng theo phác đồ và vẫn tiếp tục insulin|2|Để tiếp tục khử ceton mà không gây hạ đường huyết.","+Tìm và điều trị yếu tố khởi phát (viêm họng, nhiễm khuẩn)|3|Nhiễm trùng và bỏ insulin là nguyên nhân thường gặp.","+Chuyển hồi sức hoặc đơn vị theo dõi sát, tư vấn không bỏ insulin nền|2|Nguy cơ tái phát; cần giáo dục bệnh nhân.","-Truyền natri bicarbonat thường quy|2|pH 7,08 chưa ở mức toan rất nặng; đồng thuận quốc tế 2024 chỉ cân nhắc bicarbonat khi pH < 7,0 vì dùng thường quy không cải thiện kết cục và có thể gây hạ kali.","-Dùng kháng sinh phổ rộng thường quy khi chưa có bằng chứng nhiễm khuẩn|3|Họng viêm nhẹ, chưa có chỉ định.","!Truyền insulin tĩnh mạch liều cao ngay, không chờ kết quả kali máu|1|Kali có thể tụt nhanh, gây loạn nhịp và ngừng tim.","!Truyền dung dịch glucose 5% thay cho NaCl 0,9% ở giai đoạn đầu|1|Đường huyết 28 mmol/L, dung dịch glucose làm tăng thêm áp lực thẩm thấu và không bù được thể tích."],"teach":"Nhiễm toan ceton gồm tăng đường huyết hoặc tiền sử đái tháo đường, tăng ceton và toan chuyển hóa. Trình tự ưu tiên: bù dịch, đánh giá và bù kali thích hợp, insulin, theo dõi sát rồi tìm yếu tố khởi phát. Nếu kali <3,5 mmol/L, trì hoãn insulin cho đến khi kali >3,5 mmol/L. Bicarbonat không dùng thường quy; chỉ cân nhắc khi pH <7,0. YHCT chỉ hỗ trợ sau khi bệnh nhân ổn định, không thay thế insulin.","hbu":{"tien_su":"Đái tháo đường typ 1 từ năm 15 tuổi, trước đây tiêm insulin hằng ngày, bỏ tiêm 3 ngày vì ăn kém và sợ hạ đường huyết. Có đau họng, sốt nhẹ; khai không dị ứng thuốc và không mang thai. Tiền sử gia đình, các đợt nhiễm toan trước và phác đồ insulin cụ thể chưa có dữ kiện.","luoc_qua_co_quan":"Tiêu hóa có nôn nhiều, đau bụng lan tỏa nhẹ và ăn kém, không tiêu chảy hoặc phản ứng thành bụng. Tiết niệu có tiểu nhiều, không tiểu buốt; hô hấp có thở nhanh sâu, mùi aceton, phổi không ran và X-quang không đông đặc. Tim mạch có nhịp nhanh, huyết áp thấp, chi mát; thần kinh buồn ngủ, trả lời chậm nhưng còn đáp ứng. Cơ xương khớp chưa có dữ kiện; họng đỏ và viêm amidan nhẹ.","tom_tat":"Nữ 24 tuổi, đái tháo đường typ 1 từ năm 15 tuổi, bỏ insulin 3 ngày khi đau họng và ăn kém, vào viện vì khát, tiểu nhiều, mệt, nôn và đau bụng trong 2 ngày. Có mất nước, huyết áp 92/56 mmHg, thở Kussmaul và mùi aceton; glucose 28,4 mmol/L, ceton tăng, pH 7,08, HCO3 7 mmol/L, kali 5,0 mmol/L. Bụng mềm không phản ứng thành bụng, không tiểu buốt hoặc tiêu chảy, phổi không ran và không đông đặc. Bệnh cảnh phù hợp nhiễm toan ceton do thiếu insulin, yếu tố nhiễm trùng cần xác minh.","dat_van_de":"Tăng glucose máu kèm ceton và toan chuyển hóa, có mất nước, giảm thể tích tuần hoàn và thay đổi tri giác nhẹ trên nền thiếu insulin sau ngừng điều trị. Có biểu hiện viêm họng và nguy cơ biến động kali trong quá trình hồi sức.","bien_luan":"Tiền sử typ 1, bỏ insulin, tăng glucose, ceton và toan chuyển hóa xác định nhiễm toan ceton do đái tháo đường. Tăng áp lực thẩm thấu đơn thuần ít phù hợp vì có ceton và toan rõ, nhưng cần tính áp lực thẩm thấu để đánh giá chồng lấp; nhiễm ceton do đói đơn thuần không giải thích đầy đủ bệnh cảnh thiếu insulin và tăng glucose. Bệnh bụng ngoại khoa ít gợi ý khi bụng mềm không phản ứng thành bụng, nhưng phải đánh giá lại nếu đau còn sau điều chỉnh chuyển hóa; bạch cầu tăng có thể do stress, chưa xác nhận nhiễm khuẩn. Cần định lượng beta-hydroxybutyrate, điện giải đầy đủ gồm chlorid, theo dõi khí máu, glucose, kali, chức năng thận và khảo sát nhiễm trùng theo dấu lâm sàng, không trì hoãn hồi sức.","sinh_ly_benh":"Thiếu insulin cùng tăng hormon đối kháng làm tăng sản xuất glucose, ly giải mỡ và tạo thể ceton gây toan chuyển hóa. Tăng glucose gây lợi niệu thẩm thấu, mất nước và điện giải, làm giảm tưới máu thận. Kali toàn cơ thể thường thiếu dù kali máu ban đầu bình thường hoặc cao do dịch chuyển ra ngoài tế bào; insulin và điều chỉnh toan có thể làm kali máu giảm nhanh.","tien_luong":"Gần: nặng vì toan rõ, mất nước, huyết áp thấp và nguy cơ biến động kali, cần theo dõi sát đáp ứng điều trị. Xa: thường hồi phục khi giải quyết thiếu insulin và yếu tố khởi phát, nhưng có nguy cơ tái diễn nếu tiếp tục bỏ insulin. Cần đánh giá khả năng tự quản lý và kế hoạch khi ốm trước xuất viện.","du_phong":"Không tự bỏ insulin nền khi ăn kém; cần kế hoạch ngày ốm về theo dõi glucose, ceton, bù nước và điều chỉnh insulin do chuyên môn hướng dẫn. Tái khám nội tiết sau xuất viện để kiểm tra kỹ thuật tiêm, phác đồ và nguyên nhân ngừng thuốc. Đến cấp cứu khi nôn kéo dài, không uống được, ceton tăng, thở sâu hoặc lơ mơ."},"nguon":["ADA/EASD/JBDS/AACE/DTS, Hyperglycemic Crises in Adults With Diabetes: A Consensus Report, 2024."],"status":"draft"},{"id":"vo-lach-chan-thuong-bung-kin","title":"Tai nạn xe máy, đau hạ sườn trái, choáng","kind":"Ngoại","level":"Khó","group":"ngoai","place":"Khoa Cấp cứu","clock":"19:50","name":"Anh Nguyễn Hoàng Long","age":24,"sex":"nam","intro":"Anh Long được xe cấp cứu đưa vào sau khi đi xe máy tông vào xe tải đỗ, hạ sườn trái đập mạnh vào tay lái cách đây 90 phút. Anh còn tỉnh, kêu đau bụng trên trái, hoa mắt và khát nước.","vitals":{"hr":126,"sbp":84,"dbp":52,"rr":28,"t":36.4,"spo2":95},"ask":[["Tai nạn xảy ra như thế nào, đau ở đâu?","Ngã xe, tay lái đập mạnh vào hạ sườn trái. Đau bụng trên bên trái, lan lên vai trái.","e"],["Anh có choáng, hoa mắt, khát nước, lạnh người không?","Choáng váng, khát nước, lạnh, hoa mắt khi cố ngồi dậy.","e"],["Có đội mũ bảo hiểm không? Có mất ý thức hoặc đau cổ không?","Có đội mũ, tỉnh suốt, không đau cổ.","e"],["Có bệnh nền hoặc đang dùng thuốc chống đông không?","Khỏe mạnh, không dùng thuốc.","e"],["Có nôn, tiểu máu hoặc ra máu trực tràng không?","Buồn nôn, không nôn máu, nước tiểu vàng sậm, không đỏ.","n"],["Có đau ngực hoặc khó thở không?","Đau tức nhẹ khi hít sâu ở ngực dưới trái.","n"],["Lần ăn uống cuối cùng?","Ăn cơm chiều cách đây khoảng 2 giờ.","n"],["Có dị ứng thuốc không? Đã tiêm phòng uốn ván chưa?","Không dị ứng; tiêm uốn ván cách đây 3 năm.","n"]],"exam":[["V","Da và niêm mạc","Da niêm nhợt, vã mồ hôi lạnh.","e"],["V","Vùng hạ sườn trái","Vết trầy và bầm tím vùng hạ sườn trái.","e"],["V","Tri giác và kiểu thở","Tỉnh, lo lắng, thở nhanh nông.","n"],["M","Giọng nói","Nói ngắn, hơi thở nhanh nhưng rõ.","n"],["T","Mạch và đầu chi","Mạch nhanh, nhỏ, khó bắt; đầu chi lạnh, thời gian đổ đầy mao mạch trên 3 giây.","e"],["K","Sờ nắn bụng","Bụng chướng nhẹ, ấn đau và có phản ứng thành bụng vùng hạ sườn trái, lan dần ra khắp bụng; ấn đau lan lên vai trái (dấu Kehr).","e"],["K","Khám ngực và xương sườn","Ấn đau các xương sườn thấp bên trái; phổi thông khí đều hai bên, không tràn khí dưới da.","n"],["K","Khám khung chậu và cột sống","Ép khung chậu không đau, cột sống không có điểm đau.","n"],["K","Thăm trực tràng và niệu đạo","Không có máu trên găng, không chảy máu ở lỗ niệu đạo.","n"]],"tests":[["Siêu âm FAST tại giường",3,"Dịch tự do quanh lách và túi cùng Douglas; không có dịch màng tim, màng phổi.","e"],["Hemoglobin nhanh",5,"Hb 9,6 g/dL (còn sớm, chưa phản ánh hết lượng máu mất).","e"],["Nhóm máu và phản ứng chéo",10,"Nhóm O Rh dương, đã chuẩn bị hồng cầu lắng.","e"],["Khí máu và lactate",8,"Lactate 4,2 mmol/L, toan chuyển hóa nhẹ.","n"],["Xét nghiệm đông máu",15,"Chưa rối loạn.","n"],["CT bụng có cản quang",40,"Chỉ dành cho bệnh nhân huyết động ổn định. Ca này huyết áp thấp, FAST dương tính nên không chuyển đi chụp.","w"],["CT sọ não không cản quang",30,"Không có chỉ định: tỉnh, Glasgow 15, không mất ý thức, không dấu thần kinh khu trú.","w"]],"opt":{"ydx":["+Vỡ lách do chấn thương bụng kín, sốc mất máu","Vỡ gan do chấn thương","Vỡ tạng rỗng (ruột, đại tràng)","Chấn thương thận trái","Tràn máu màng phổi trái đơn thuần","Tổn thương tụy do chấn thương"]},"actions":["++Đánh giá ABCDE theo quy trình chấn thương, thở oxy lưu lượng cao, gắn monitor|2|Sốc mất máu với SpO2 95% và thở nhanh.","++Đặt hai đường truyền tĩnh mạch lớn, lấy máu, hồi sức dịch tinh thể ấm lượng vừa phải|3|Cần duy trì tưới máu tối thiểu, không đẩy huyết áp lên cao khi chưa cầm máu.","++Báo động đỏ, hội chẩn ngoại khoa và gây mê hồi sức để mổ cấp cứu|2|Huyết động không ổn định kèm FAST dương tính là chỉ định mổ cấp cứu, không chờ chụp CT.","++Kích hoạt truyền máu (hồng cầu lắng, theo quy trình truyền máu khối lượng lớn nếu cần)|3|Mất máu phải thay bằng máu.","+Cân nhắc tranexamic acid đường tĩnh mạch trong 3 giờ đầu theo phác đồ|2|Giảm tử vong do chảy máu nếu dùng sớm.","+Giữ ấm, nhịn ăn uống, giảm đau tĩnh mạch liều nhỏ có theo dõi|2|Hạ thân nhiệt làm rối loạn đông máu; nhịn ăn để chuẩn bị gây mê.","+Đặt sonde tiểu theo dõi nước tiểu khi không có dấu hiệu tổn thương niệu đạo|2|Theo dõi tưới máu thận, lượng nước tiểu.","-Chọc rửa ổ bụng chẩn đoán|10|Đã có FAST dương tính, không cần thêm, làm chậm mổ.","-Chườm nóng vùng hạ sườn trái để giảm đau|3|Chưa kiểm soát chảy máu, trì hoãn hồi sức.","!Xoa bóp mạnh vùng hạ sườn trái để giảm đau|3|Có thể làm tăng chảy máu từ lách vỡ và trì hoãn mổ.","!Đưa bệnh nhân đi chụp CT bụng khi huyết áp còn thấp, không có bác sĩ đi kèm|5|Huyết động không ổn định, nguy cơ ngừng tim ngoài khoa cấp cứu và trì hoãn mổ.","!Truyền nhanh lượng lớn dịch tinh thể để đưa huyết áp về bình thường|3|Pha loãng máu, hạ thân nhiệt, tăng chảy máu."],"teach":"Chấn thương hạ sườn trái, đau lan vai trái (dấu Kehr), mạch nhanh, huyết áp thấp và FAST dương tính nghĩ ngay vỡ lách chảy máu. Bệnh nhân huyết động không ổn định không đi chụp CT mà chuyển mổ. Hồi sức bằng máu, hạn chế dịch tinh thể, giữ ấm, cầm máu sớm. YHCT chỉ hỗ trợ phục hồi sau mổ, không được dùng giác hơi hoặc xoa bóp ở vùng chấn thương.","hbu":{"tien_su":"Theo bệnh sử khỏe mạnh, không dùng thuốc và không dị ứng; đã tiêm uốn ván cách đây 3 năm. Có đội mũ bảo hiểm, không mất ý thức, lần ăn cuối khoảng 2 giờ trước. Tiền sử gia đình, phẫu thuật và bệnh lý huyết học chưa có dữ kiện.","luoc_qua_co_quan":"Tiêu hóa có đau bụng trên trái lan vai trái, buồn nôn, bụng chướng và phản ứng thành bụng; không nôn máu hoặc máu trên găng khi thăm trực tràng. Tim mạch có mạch nhanh nhỏ, huyết áp thấp, chi lạnh và choáng; hô hấp thở nhanh, đau ngực dưới trái khi hít sâu, phổi thông khí đều. Tiết niệu có nước tiểu sẫm nhưng không đỏ và không máu ở lỗ niệu đạo; thần kinh tỉnh suốt, không đau cổ. Cơ xương khớp có đau xương sườn thấp trái, khám khung chậu và cột sống chưa thấy điểm đau.","tom_tat":"Nam 24 tuổi, sau chấn thương tay lái đập hạ sườn trái 90 phút, đau vùng trên trái lan vai trái, choáng, khát và lạnh người. Huyết áp 84/52 mmHg, mạch 126 lần/phút, da niêm nhợt, chi lạnh, đổ đầy mao mạch trên 3 giây, có bầm vùng hạ sườn trái và dấu Kehr. FAST có dịch quanh lách và túi cùng Douglas, Hb 9,6 g/dL, lactat 4,2 mmol/L; không dịch màng tim hoặc màng phổi. Còn tỉnh, phổi thông khí đều, không máu ở lỗ niệu đạo; chẩn đoán ca là vỡ lách với sốc mất máu, mức tổn thương cần xác nhận khi can thiệp.","dat_van_de":"Chấn thương bụng kín vùng hạ sườn trái kèm đau lan vai, dịch tự do ổ bụng và sốc mất máu đang diễn tiến. Cần kiểm soát nguồn chảy máu khẩn và tìm tổn thương phối hợp ở ngực, bụng, khung chậu hoặc thần kinh.","bien_luan":"Cơ chế va đập vùng lách, đau hạ sườn trái lan vai, FAST dương tính và sốc mất máu phù hợp vỡ lách theo chẩn đoán ca. Chảy máu từ gan hoặc mạc treo và tổn thương tạng rỗng có thể phối hợp, FAST không xác định đầy đủ nguồn hay phân độ nên cần đánh giá trong mổ. Chèn ép tim và tràn máu màng phổi ít gợi ý với FAST hiện tại; nguồn chảy máu khung chậu ít gợi ý theo khám nhưng vẫn phải rà soát theo ABCDE. Khi huyết động còn không ổn định, cần kiểm soát xuất huyết khẩn, không trì hoãn để CT; theo dõi nối tiếp Hb, lactat, đông máu, nhiệt độ và nước tiểu trong hồi sức.","sinh_ly_benh":"Lực chấn thương làm rách nhu mô hoặc mạch lách, gây chảy máu trong ổ bụng. Máu kích thích cơ hoành có thể gây đau quy chiếu lên vai trái; mất máu làm giảm hồi lưu, cung lượng tim và tưới máu mô, gây tăng lactat. Hạ thân nhiệt và rối loạn đông máu có thể làm xuất huyết tiến triển.","tien_luong":"Gần: nguy kịch vì huyết động không ổn định và dấu giảm tưới máu, phụ thuộc tốc độ kiểm soát nguồn chảy máu, hồi sức máu và tổn thương phối hợp. Xa: phụ thuộc khả năng bảo tồn lách và hồi phục sau chấn thương; nếu cắt lách sẽ có nguy cơ nhiễm trùng đặc biệt cần dự phòng. Chưa đủ dữ kiện xác định phân độ tổn thương hoặc loại phẫu thuật.","du_phong":"Sau điều trị, tuân thủ giới hạn vận động và lịch tái khám ngoại khoa, tránh va chạm hoặc lao động nặng đến khi được cho phép. Nếu cắt lách hoặc mất chức năng lách, cần kế hoạch tiêm chủng, giáo dục nguy cơ nhiễm trùng và xử trí sốt theo chuyên khoa. Trở lại cấp cứu khi đau bụng tăng, choáng, ngất hoặc sốt; thực hiện an toàn giao thông và dùng bảo hộ phù hợp."},"nguon":["World Society of Emergency Surgery, Splenic Trauma: WSES Classification and Guidelines for Adult and Pediatric Patients, 2017.","European Guideline on Management of Major Bleeding and Coagulopathy Following Trauma, Sixth Edition, 2023."],"status":"draft"},{"id":"thai-ngoai-tu-cung-vo","title":"Chậm kinh, đau bụng dưới, ngất","kind":"Sản","level":"Khó","group":"sannhi","place":"Khoa Cấp cứu","clock":"14:20","name":"Chị Lê Thị Mỹ Duyên","age":29,"sex":"nữ","intro":"Chị Duyên được chồng đưa vào cấp cứu vì đau bụng dưới dữ dội đột ngột kèm choáng, ngất thoáng qua ở nhà vệ sinh. Chị chậm kinh khoảng 7 tuần và ra ít máu âm đạo ba ngày nay.","vitals":{"hr":128,"sbp":78,"dbp":48,"rr":28,"t":36.7,"spo2":96},"ask":[["Kỳ kinh cuối cách đây bao lâu? Chị đã thử thai chưa?","Chậm kinh khoảng 7 tuần. Que thử thai hai vạch cách đây một tuần, chưa đi khám thai.","e"],["Đau bụng bắt đầu thế nào, ở vị trí nào?","Đau dữ dội đột ngột ở bụng dưới bên phải, lan lên thượng vị và vai phải, rồi đau khắp bụng.","e"],["Ra huyết âm đạo như thế nào?","Ra ít máu đỏ sẫm từ ba ngày nay.","e"],["Chị có choáng, ngất, hoa mắt không?","Ngất thoáng qua ở nhà vệ sinh, hiện chóng mặt và khát nước.","e"],["Có tiền sử viêm vùng chậu, thai ngoài tử cung, mổ vùng chậu hoặc đặt vòng tránh thai không?","Hai năm trước từng bị viêm vùng chậu phải nằm viện. Không đặt vòng.","e"],["Chị mang thai và sinh con mấy lần?","Đây là lần mang thai đầu tiên, chưa sinh con.","n"],["Có sốt, nôn hoặc tiêu chảy không?","Không sốt, buồn nôn nhẹ, mót rặn muốn đi cầu.","n"],["Chị có dị ứng thuốc không? Nhóm máu của chị là gì?","Không dị ứng. Chị không nhớ nhóm máu.","n"]],"exam":[["V","Sắc mặt","Da niêm nhợt, vã mồ hôi lạnh, vẻ mặt đau và lo lắng.","e"],["V","Tư thế","Nằm co người, không dám cử động.","n"],["M","Giọng nói và hơi thở","Nói nhỏ, thở nhanh nông.","n"],["M","Mùi","Không có mùi hôi âm đạo.","n"],["T","Mạch và đầu chi","Mạch nhanh, nhỏ; đầu chi lạnh, mao mạch hồi phục chậm.","e"],["K","Khám bụng","Bụng chướng nhẹ, ấn đau khắp bụng nhiều nhất ở hố chậu phải, có phản ứng thành bụng.","e"],["K","Khám mỏ vịt và khám âm đạo","Ra ít máu đỏ sẫm; cổ tử cung đóng, di động cổ tử cung đau, túi cùng sau căng đầy đau, mơ hồ khối cạnh tử cung phải.","e"],["K","Khám tim phổi","Tim nhanh đều, phổi rì rào phế nang rõ.","n"]],"tests":[["Thử thai nhanh hCG nước tiểu",3,"Dương tính.","e"],["Siêu âm bụng và đầu dò âm đạo tại giường",6,"Không thấy túi thai trong buồng tử cung; dịch tự do nhiều ở túi cùng Douglas và quanh gan; khối hỗn hợp âm cạnh phần phụ phải.","e"],["Hemoglobin nhanh",5,"Hb 7,9 g/dL.","e"],["Nhóm máu, Rh và phản ứng chéo",10,"Nhóm A Rh dương; đã chuẩn bị hồng cầu lắng.","e"],["Định lượng beta-hCG máu",30,"Tăng, xác nhận thai nhưng không cần chờ khi đã có dịch ổ bụng, siêu âm gợi ý và huyết động không ổn định.","n"],["Xét nghiệm đông máu cơ bản",15,"Trong giới hạn bình thường.","n"],["Chụp X-quang tử cung vòi trứng",30,"Chống chỉ định ở người nghi có thai, không có giá trị trong cấp cứu.","w"]],"opt":{"ydx":["+Thai ngoài tử cung vỡ, chảy máu ổ bụng, sốc mất máu","Vỡ nang hoàng thể xuất huyết","Viêm ruột thừa cấp","Xoắn u nang buồng trứng","Sẩy thai đang tiến triển","Viêm phần phụ cấp"]},"actions":["++Đánh giá ABC, thở oxy, gắn monitor, đặt hai đường truyền tĩnh mạch lớn|2|Sốc mất máu với huyết áp 78/48 và mạch 128.","++Hồi sức dịch tinh thể ấm, chuẩn bị và truyền máu sớm theo mức độ sốc|3|Cần thay thể tích tuần hoàn, ưu tiên máu khi mất máu nhiều.","++Hội chẩn sản khoa và gây mê hồi sức, chuyển mổ cấp cứu cầm máu|2|Chảy máu đang tiếp diễn; phẫu thuật cầm máu là điều trị quyết định, không chờ huyết áp lên hẳn.","+Giữ ấm, nhịn ăn uống hoàn toàn, giảm đau tĩnh mạch có theo dõi|2|Chuẩn bị gây mê, tránh hạ thân nhiệt.","+Đặt sonde tiểu theo dõi lượng nước tiểu|2|Đánh giá tưới máu cơ quan.","+Xác định Rh; nếu Rh âm thì tiêm globulin miễn dịch kháng D theo phác đồ|2|Phòng đồng miễn dịch Rh ở lần mang thai sau.","+Giải thích tình trạng và thực hiện đồng thuận phẫu thuật theo năng lực quyết định và quy định cấp cứu của cơ sở|2|Ưu tiên trao đổi trực tiếp với người bệnh khi có khả năng quyết định; nếu tình trạng đe dọa tính mạng, không để thủ tục hành chính làm trì hoãn cầm máu cấp cứu.","-Chọc dò túi cùng sau Douglas để chẩn đoán|5|Siêu âm đã thấy dịch tự do; làm thêm trì hoãn xử trí.","-Truyền oxytocin hoặc dùng thuốc co hồi tử cung|2|Không có vai trò trong thai ngoài tử cung vỡ.","!Điều trị nội khoa bằng methotrexate|3|Chống chỉ định khi huyết động không ổn định và đã vỡ khối thai.","!Cho về theo dõi tại nhà, hẹn siêu âm lại sau 48 giờ|2|Nguy cơ tử vong do mất máu ở người đã có dấu hiệu sốc."],"teach":"Chậm kinh, đau bụng dưới, ra huyết âm đạo và sốc là thai ngoài tử cung vỡ cho đến khi chứng minh ngược lại. Thử thai dương tính, siêu âm không thấy túi thai trong tử cung kèm dịch tự do ổ bụng và huyết động không ổn định là chỉ định mổ cấp cứu, không chờ định lượng beta-hCG. Methotrexate chỉ dành cho người ổn định, chưa vỡ. YHCT chỉ hỗ trợ phục hồi khí huyết sau mổ.","hbu":{"tien_su":"Hai năm trước từng viêm vùng chậu phải nằm viện, đây là yếu tố nguy cơ của thai ngoài tử cung. Chưa từng mang thai hay sinh con, không đặt vòng tránh thai, không dị ứng thuốc. Chưa có dữ kiện về phẫu thuật vùng chậu, bệnh nội khoa nền và tiền sử gia đình; nhóm máu chưa biết trước khi vào viện.","luoc_qua_co_quan":"Sản phụ khoa có chậm kinh khoảng 7 tuần và ra ít máu đỏ sẫm âm đạo ba ngày, không có khí hư hôi. Tuần hoàn có ngất thoáng qua, chóng mặt, tim nhanh; hô hấp thở nhanh nông, phổi rì rào rõ. Tiêu hóa có buồn nôn nhẹ và mót rặn, không nôn hoặc tiêu chảy; tiết niệu chưa có dữ kiện bất thường. Thần kinh còn tỉnh, trả lời được.","tom_tat":"Nữ 29 tuổi, chậm kinh khoảng 7 tuần với que thử thai hai vạch, tiền sử viêm vùng chậu, ra ít máu âm đạo ba ngày rồi đau bụng dưới phải dữ dội đột ngột lan vai phải, ngất thoáng qua. Mạch 128 lần/phút, huyết áp 78/48 mmHg, da niêm nhợt, vã mồ hôi lạnh, bụng chướng nhẹ có phản ứng thành bụng, cổ tử cung đóng, di động cổ tử cung đau, túi cùng sau căng đau. Hemoglobin 7,9 g/dL; siêu âm không thấy túi thai trong buồng tử cung, có dịch tự do nhiều quanh gan và túi cùng Douglas, khối hỗn hợp cạnh phần phụ phải.","dat_van_de":"Chậm kinh kèm thử thai dương tính và ra huyết âm đạo bất thường. Đau bụng dưới cấp dữ dội kèm dấu kích thích phúc mạc, dịch tự do ổ bụng trên siêu âm. Sốc giảm thể tích với thiếu máu cấp trên bệnh nhân có tiền sử viêm vùng chậu.","bien_luan":"Chậm kinh, thử thai dương tính, ra huyết âm đạo, đau bụng đột ngột, sốc và siêu âm không thấy túi thai trong tử cung kèm dịch tự do ổ bụng phù hợp thai ngoài tử cung vỡ gây chảy máu trong ổ bụng; tiền sử viêm vùng chậu là yếu tố nguy cơ. Sẩy thai hoặc dọa sẩy thai không giải thích được sốc và dịch tự do nhiều quanh gan, còn buồng tử cung trống làm thai trong tử cung rất ít phù hợp. Xoắn hoặc vỡ nang buồng trứng có thể gây đau cấp và hemoperitoneum nhưng ít phù hợp khi thử thai dương tính và khối cạnh phần phụ đi kèm hCG tăng; viêm ruột thừa ít gợi ý vì có chậm kinh, thử thai dương tính và dấu sốc mất máu rõ. Khi huyết động không ổn định và đã có dịch tự do ổ bụng thì chuyển mổ cấp cứu cầm máu, không chờ định lượng beta-hCG; đồng thời hồi sức, truyền máu sớm, xác định nhóm máu và Rh.","sinh_ly_benh":"Phôi làm tổ ngoài buồng tử cung, thường ở vòi tử cung; tổn thương vòi do viêm vùng chậu làm chậm vận chuyển phôi và là yếu tố thuận lợi. Khi khối thai phát triển làm vòi căng và vỡ, mạch máu bị tổn thương gây chảy máu vào ổ bụng, kích thích phúc mạc và đau quy chiếu lên vai do máu kích thích cơ hoành. Mất máu cấp làm giảm thể tích tuần hoàn, giảm cung lượng tim và gây sốc.","tien_luong":"Gần: nguy kịch nếu chậm kiểm soát chảy máu, phụ thuộc tốc độ hồi sức và phẫu thuật. Xa: nếu được xử trí kịp thời thường hồi phục tốt; khả năng có thai sau này phụ thuộc phần vòi còn lại, và nguy cơ thai ngoài tử cung tái phát cao hơn bình thường. Người bệnh cần được tư vấn về khả năng sinh sản.","du_phong":"Sau mổ, tái khám sản phụ khoa đúng hẹn và tư vấn tránh thai trong thời gian phục hồi. Lần có thai sau cần siêu âm sớm để xác định vị trí thai. Nếu Rh âm cần tiêm globulin miễn dịch kháng D theo phác đồ; điều trị triệt để viêm vùng chậu và hạn chế yếu tố nguy cơ lây nhiễm qua đường tình dục. Đi cấp cứu ngay khi chậm kinh kèm đau bụng dưới, ra huyết âm đạo hoặc choáng."},"nguon":["American College of Obstetricians and Gynecologists, Practice Bulletin No. 193: Tubal Ectopic Pregnancy, 2018.","European Society of Human Reproduction and Embryology, Guideline on the Management of Ectopic Pregnancy, 2022."],"status":"draft"},{"id":"kham-tyc-viem-mui-di-ung","title":"Hắt hơi, sổ mũi mỗi sáng sớm","kind":"Nội","level":"Dễ","group":"noi","place":"Phòng khám Nội YHCT","clock":"08:20","name":"Chị Nguyễn Thị Mai Anh","age":27,"sex":"nữ","intro":"Phòng khám Nội YHCT. Chị là nhân viên văn phòng, đến khám vì hắt hơi, sổ mũi, ngạt mũi tái diễn khoảng 2 năm, nặng nhất vào sáng sớm và khi thời tiết chuyển lạnh.","vitals":{"hr":76,"sbp":108,"dbp":68,"rr":16,"t":36.6,"spo2":99},"ask":[["Triệu chứng chính là gì, xuất hiện lúc nào trong ngày?","Hắt hơi từng tràng 5 đến 10 cái liền, chảy nước mũi trong như nước, ngạt mũi, nhất là sáng sớm vừa ngủ dậy và khi ra chỗ máy lạnh. Ngứa mũi, hay dụi mũi.","e"],["Có ngứa mắt, chảy nước mắt, ngứa họng không?","Ngứa mắt nhẹ, chảy nước mắt khi lên cơn. Ngứa vòm họng thỉnh thoảng.","n"],["Có yếu tố khởi phát nào rõ không (bụi, phấn hoa, lông thú, mùi lạ, thay đổi thời tiết)?","Nặng hơn khi quét dọn bụi, khi gió lạnh hoặc trời chuyển mùa. Nhà nuôi một con mèo.","e"],["Nước mũi màu gì? Có đau vùng mặt, sốt hoặc chảy mũi mủ không?","Nước mũi luôn trong, loãng. Không sốt, không đau nhức vùng má hay trán, không có mủ.","e"],["Có chảy máu mũi, ngạt chỉ một bên, giảm khứu giác kéo dài không?","Ngạt hai bên luân phiên, ngửi mùi hơi kém khi nghẹt nặng. Không chảy máu mũi.","e"],["Có khò khè, khó thở, ho về đêm hay tiền sử hen, chàm không?","Không khò khè, không khó thở. Hồi nhỏ có chàm nhẹ ở khuỷu tay. Mẹ bị viêm mũi dị ứng.","e"],["Cơ thể hay sợ lạnh, ra mồ hôi, dễ cảm không?","Người sợ gió, sợ lạnh, tự ra mồ hôi nhẹ, mỗi lần đổi thời tiết là hay cảm cúm. Hay mệt, ít nói.","e"],["Ăn uống, đại tiểu tiện thế nào?","Ăn bình thường, hơi đầy bụng nếu ăn đồ lạnh. Đại tiện nhão, tiểu trong.","n"],["Đã dùng thuốc gì cho mũi? Có hay nhỏ thuốc co mạch không?","Thỉnh thoảng uống thuốc kháng histamin thì đỡ vài giờ. Mua thuốc nhỏ mũi ngoài tiệm thuốc dùng khi nghẹt, khoảng 3 tuần nay mỗi ngày.","e"],["Giấc ngủ, đặc điểm công việc?","Ngủ được nhưng nghẹt mũi làm thức giấc. Làm việc phòng máy lạnh nhiều giờ.","n"]],"exam":[["V","Thần sắc","Sắc mặt trắng nhợt, tinh thần hơi mệt, không sốt.","n"],["V","Lưỡi","Chất lưỡi nhạt, rêu trắng mỏng, hơi ướt.","e"],["V","Mũi (nhìn ngoài)","Có nếp ngang sống mũi do hay dụi, quầng thâm nhẹ dưới mắt. Không biến dạng, không sưng đỏ vùng xoang.","n"],["M","Giọng nói, hơi thở","Giọng nói có âm mũi, nhỏ. Hơi thở không hôi.","n"],["M","Hắt hơi, ho","Hắt hơi từng tràng ngắn lúc khám. Không ho, không khò khè.","n"],["T","Mạch","Mạch phù, hoãn, nhược.","e"],["T","Sờ tay chân, da","Bàn tay hơi lạnh, da ẩm nhẹ.","n"],["K","Khám mũi (đèn soi)","Niêm mạc cuốn mũi dưới phù nề, nhợt màu hơi tím, dịch trong. Vách ngăn không lệch, không polyp, không mủ ở khe giữa.","e"],["K","Khám họng, tai, phổi","Họng không đỏ, có vài hạt lympho ở thành sau. Phổi thông khí rõ, không ran rít.","e"]],"tests":[["Công thức máu (bạch cầu ái toan)",10,"Bạch cầu bình thường, ái toan 6 phần trăm (hơi tăng).","n"],["Test lẩy da hoặc IgE đặc hiệu dị nguyên hô hấp",30,"Dương tính với mạt bụi nhà và lông mèo.","e"],["Nội soi mũi",10,"Cuốn mũi dưới phù nề nhợt, dịch trong, không polyp, khe giữa sạch, vách ngăn thẳng.","e"],["X-quang ngực thẳng",10,"Không bất thường. Không có chỉ định ở ca này.","w"],["CT xoang không cản quang",30,"Dày niêm mạc nhẹ ở cuốn mũi, các xoang thông thoáng. Không có chỉ định ở ca này, chi phí và liều tia không cần thiết.","w"]],"opt":{"ydx":["+Viêm mũi dị ứng quanh năm, mức độ nhẹ đến vừa","Viêm mũi xoang cấp do vi khuẩn","Polyp mũi","Viêm xoang mạn tính","Lệch vách ngăn mũi"],"bd":["+Tỵ cừu","Tỵ uyên","Cảm mạo","Khái thấu","Tỵ nục"],"bc":["+Lý – Hư – Hàn","Biểu – Thực – Hàn","Lý – Thực – Nhiệt","Biểu – Hư – Nhiệt","Lý – Thực – Hàn"],"the":["+Phế khí hư hàn","Phế kinh uất nhiệt","Tỳ khí hư nhược","Thận dương hư","Phong nhiệt phạm phế"],"phap":["+Ôn phế, ích khí, cố biểu, thông khiếu","Thanh tiết phế nhiệt, thông khiếu","Sơ phong thanh nhiệt","Kiện tỳ ích khí, thăng dương","Ôn bổ thận dương"],"phuong":["+Ngọc bình phong tán gia Tân di, Thương nhĩ tử","+Ôn phế chỉ lưu đan","Tân di thanh phế thang","Ngân kiều tán","Bổ trung ích khí thang"],"huyet":["+Nghênh hương","+Hợp cốc","+Phế du","+Túc tam lý","+Ấn đường","Thái xung","Dương lăng tuyền","Chi câu","Thiên khu"]},"actions":["+Hướng dẫn hạn chế dị nguyên (bụi, thú nuôi, giặt chăn ga nước nóng)|3|Giảm tiếp xúc dị nguyên là nền tảng điều trị.","+Rửa mũi nước muối sinh lý hằng ngày|2|Làm sạch dị nguyên, giảm phù nề niêm mạc.","+Dùng thuốc xịt mũi corticoid tại chỗ hoặc kháng histamin theo phác đồ YHHĐ|2|Điều trị đầu tay theo hướng dẫn viêm mũi dị ứng.","+Cứu hoặc châm Phế du, Túc tam lý, Nghênh hương|15|Ôn phế, ích khí, cố biểu thông khiếu.","+Hướng dẫn giữ ấm cổ, gáy, tránh gió lạnh trực tiếp từ máy lạnh|2|Phòng tái phát ở thể phế khí hư hàn.","+Hẹn tái khám, chuyển khám Tai Mũi Họng nếu ngạt một bên, chảy máu mũi, mủ, đau mặt hoặc khò khè|2|Sàng lọc dấu hiệu cảnh báo.","-Chụp CT xoang thường quy|40|Không có dấu hiệu viêm xoang, không cần thiết.","!Dùng thuốc nhỏ mũi co mạch hằng ngày kéo dài|1|Gây viêm mũi do thuốc, ngạt mũi dội ngược; cần ngừng thuốc nhỏ mũi co mạch đang dùng.","!Cho thuốc thanh nhiệt hàn lương mạnh (Hoàng liên, Thạch cao)|2|Thể phế khí hư hàn, thuốc hàn lương làm tổn thương thêm dương khí."],"teach":"Hắt hơi từng tràng, nước mũi trong, ngạt mũi sáng sớm, niêm mạc cuốn mũi nhợt phù cùng tiền sử dị ứng gia đình hướng tới viêm mũi dị ứng; thể Phế khí hư hàn với sợ gió, tự ra mồ hôi, lưỡi nhạt, mạch phù hoãn nhược. Dấu hiệu cảnh báo cần chuyển Tai Mũi Họng: ngạt một bên, chảy máu mũi, mủ, đau mặt, mất khứu giác kéo dài. Lưu ý nhóm thuốc co mạch nhỏ mũi gây ngạt dội ngược.","hbu":{"tien_su":"Hồi nhỏ có chàm nhẹ ở khuỷu tay, mẹ bị viêm mũi dị ứng. Không hen, không khò khè, không dùng thuốc thường xuyên ngoài thỉnh thoảng uống kháng histamin. Khoảng 3 tuần nay tự mua thuốc nhỏ mũi co mạch dùng mỗi ngày; nhà nuôi một con mèo. Chưa có dữ kiện về phẫu thuật mũi xoang hoặc dị ứng thuốc.","luoc_qua_co_quan":"Mũi có hắt hơi từng tràng, chảy nước trong, ngạt hai bên luân phiên và ngửi kém khi ngạt nặng, không chảy máu mũi hay mủ. Mắt có ngứa nhẹ, chảy nước mắt khi lên cơn; họng ngứa thỉnh thoảng. Hô hấp không ho đêm, không khò khè, không khó thở. Tiêu hóa hơi đầy bụng khi ăn đồ lạnh, đại tiện nhão; tiểu trong. Theo YHCT có sợ gió, sợ lạnh, tự ra mồ hôi nhẹ, hay mệt và ít nói.","tom_tat":"Nữ 27 tuổi, làm việc nhiều giờ trong phòng máy lạnh, hắt hơi từng tràng, chảy nước mũi trong và ngạt mũi tái diễn khoảng 2 năm, nặng nhất sáng sớm và khi trời lạnh hoặc quét dọn bụi, có tiền sử chàm và mẹ bị viêm mũi dị ứng. Khám cuốn mũi dưới phù nề, nhợt màu hơi tím, dịch trong, không polyp, vách ngăn thẳng, không mủ; bạch cầu ái toan 6%, test lẩy da dương tính với mạt bụi nhà và lông mèo. Không sốt, không đau vùng xoang. Theo YHCT, sợ gió, tự ra mồ hôi, lưỡi nhạt rêu trắng mỏng ướt và mạch phù hoãn nhược.","dat_van_de":"Hội chứng mũi tái diễn mạn tính gồm hắt hơi, chảy nước mũi trong, ngạt và ngứa mũi theo yếu tố khởi phát, trên cơ địa dị ứng cá nhân và gia đình. Có dùng thuốc co mạch nhỏ mũi kéo dài mỗi ngày. Chứng trạng YHCT gồm sợ gió lạnh, tự ra mồ hôi, dễ cảm khi đổi thời tiết, lưỡi nhạt và mạch phù hoãn nhược.","bien_luan":"Hắt hơi từng tràng, chảy nước mũi trong, ngạt mũi, ngứa mũi và mắt kèm yếu tố khởi phát bụi và lông mèo, tiền sử cơ địa dị ứng, niêm mạc cuốn mũi phù nhợt, ái toan hơi tăng và test lẩy da dương tính xác định viêm mũi dị ứng quanh năm mức độ nhẹ đến vừa. Viêm mũi xoang nhiễm khuẩn ít phù hợp vì dịch luôn trong, không sốt, không đau mặt, khe giữa sạch; polyp mũi và lệch vách ngăn được loại trừ bằng nội soi. Viêm mũi do thuốc co mạch có thể góp phần gây ngạt dội ngược nên cần ngưng thuốc nhỏ mũi tự mua; hen kèm theo ít gợi ý vì không khò khè, ho đêm. Cần đánh giá lại nếu ngạt một bên, chảy máu mũi, mủ, đau mặt hoặc mất khứu giác kéo dài. Theo các khóa YHCT của ca, bệnh danh Tỵ cừu, bát cương Lý–Hư–Hàn, thể Phế khí hư hàn; pháp ôn phế, ích khí, cố biểu, thông khiếu, phối hợp với kiểm soát dị nguyên và thuốc theo phác đồ y học hiện đại.","sinh_ly_benh":"Dị nguyên hít vào gắn IgE trên dưỡng bào niêm mạc mũi, giải phóng histamin và các chất trung gian gây ngứa, hắt hơi, tăng tiết và giãn mạch phù nề. Viêm mạn làm niêm mạc tăng phản ứng với các yếu tố kích thích như lạnh và bụi. Thuốc co mạch dùng kéo dài gây ngạt dội ngược. Theo lý luận YHCT, Phế khí hư làm vệ biểu không vững, ngoại tà dễ xâm nhập, tân dịch ứ đọng ở khiếu mũi.","tien_luong":"Gần: triệu chứng thường cải thiện khi tránh dị nguyên, ngưng thuốc co mạch và dùng thuốc đúng phác đồ. Xa: bệnh mạn tính, có thể tái phát khi tiếp xúc dị nguyên và có thể phối hợp hen. Theo YHCT, cần đánh giá lại sức đề kháng và chứng sợ gió lạnh sau đợt điều trị.","du_phong":"Hạn chế dị nguyên: giặt chăn ga bằng nước nóng, giảm bụi, hạn chế tiếp xúc lông mèo; rửa mũi nước muối sinh lý hằng ngày; giữ ấm cổ, gáy và tránh gió lạnh trực tiếp từ máy lạnh. Không dùng thuốc nhỏ mũi co mạch kéo dài. Tái khám để đánh giá đáp ứng; chuyển Tai Mũi Họng khi có dấu cảnh báo. Châm cứu hoặc thuốc YHCT chỉ hỗ trợ theo chỉ định."},"nguon":["American Academy of Otolaryngology–Head and Neck Surgery Foundation, Clinical Practice Guideline: Allergic Rhinitis, 2015.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"kham-nhi-bieng-an-ty-hu","title":"Bé 4 tuổi chậm ăn, hay ốm vặt","kind":"Nhi","level":"Dễ","group":"sannhi","place":"Phòng khám Nhi YHCT","clock":"15:10","name":"Bé Trần Gia Huy","age":4,"sex":"nam","intro":"Phòng khám Nhi YHCT. Mẹ đưa bé trai 4 tuổi đến khám vì chậm ăn, bỏ bữa, hay ốm vặt khoảng 5 tháng nay.","vitals":{"hr":98,"sbp":90,"dbp":56,"rr":22,"t":36.7,"spo2":99},"ask":[["Bé biếng ăn từ khi nào, ăn được bao nhiêu so với trước?","Khoảng 5 tháng nay. Mỗi bữa chỉ ăn được nửa chén cơm, nhai lâu rồi ngậm, phải dỗ hoặc cho xem điện thoại mới ăn.","e"],["Bé có sụt cân, chậm tăng cân hay chậm cao so với bạn cùng tuổi?","Cân nặng từ lúc 3 tuổi đến nay tăng rất ít. Hiện cân 14 kg, cao 98 cm. Mẹ thấy bé nhỏ con hơn các bạn.","e"],["Có nôn, đau bụng, tiêu chảy kéo dài hay phân có máu, phân mỡ không?","Không nôn, không đau bụng dữ dội. Phân lúc nhão lúc thành khuôn, không máu, không thấy mỡ.","e"],["Có sốt kéo dài, ho kéo dài, ra mồ hôi trộm hay nổi hạch không?","Không sốt kéo dài. Hay cảm ho nhẹ 1 đến 2 tháng một lần, khỏi sau vài ngày. Không ra mồ hôi trộm, không nổi hạch.","e"],["Bé có nuốt khó, ngậm thức ăn, đau miệng, sâu răng không?","Không nuốt sặc. Có 2 răng sâu nhẹ, không loét miệng.","n"],["Chế độ ăn: uống sữa, nước ngọt, ăn vặt trước bữa chính thế nào?","Uống sữa hộp 3 lần mỗi ngày, hay ăn bánh kẹo, uống nước ngọt trước bữa cơm. Ít rau, ít thịt đỏ.","e"],["Đại tiện, tiểu tiện, giấc ngủ, mồ hôi?","Đại tiện nhão, 1 đến 2 lần mỗi ngày. Ngủ không sâu, hay ra mồ hôi đầu khi ngủ. Tiểu trong.","n"],["Bé có tính tình ra sao, thích uống nước lạnh hay ấm? Hay mệt, ít chạy nhảy?","Hiền, ít nghịch, hay mệt, không thích chạy nhiều. Thích uống nước ấm, không khát nhiều.","n"],["Đã tẩy giun chưa, đã dùng thuốc kích thích ăn ngon chưa?","Tẩy giun cách đây 1 năm. Mẹ tự mua siro bổ cho ăn ngon uống 1 tháng, không đỡ nhiều.","n"]],"exam":[["V","Thần sắc, thể trạng","Bé tỉnh, nhanh nhẹn vừa phải, gầy, da hơi xanh, tóc thưa. Không phù, không vàng da.","e"],["V","Lưỡi","Chất lưỡi nhạt, rêu trắng mỏng. Không bợt rêu dày.","e"],["V","Móng, niêm mạc mắt","Niêm mạc mắt nhợt nhẹ, móng tay hơi nhợt.","n"],["M","Giọng khóc, hơi thở","Giọng nói nhỏ, hơi thở không hôi.","n"],["T","Mạch","Mạch hoãn, nhược, khó bắt rõ vì bé quấy.","e"],["T","Sờ bụng, tay chân","Tay chân hơi mát, bụng mềm, không chướng.","n"],["K","Cân đo","Cân nặng 14 kg, cao 98 cm, dưới trung vị rõ rệt trên biểu đồ tăng trưởng WHO, trong khoảng âm một đến âm hai độ lệch chuẩn. Không phù.","e"],["K","Khám bụng, gan lách, hạch","Bụng mềm, không khối, gan lách không to, không sờ thấy hạch bất thường.","e"],["K","Khám tim phổi","Tim đều không âm thổi. Phổi rõ, không ran.","n"]],"tests":[["Công thức máu",10,"Hb 10,6 g/dL, MCV 72 fL, bạch cầu bình thường.","e"],["Ferritin huyết thanh",20,"Giảm (thiếu sắt).","e"],["Soi phân tìm trứng và ký sinh trùng đường ruột",15,"Không thấy trứng giun, không thấy ký sinh trùng.","n"],["Tổng phân tích nước tiểu",10,"Bình thường.","n"],["CT ngực bụng có cản quang",40,"Không bất thường. Không có chỉ định ở ca này, trẻ nhỏ, liều tia không cần thiết.","w"],["Nội soi dạ dày",45,"Không có chỉ định ở trẻ biếng ăn không dấu hiệu báo động.","w"]],"opt":{"ydx":["+Biếng ăn chức năng (do chế độ ăn, hành vi) kèm thiếu máu thiếu sắt nhẹ","Suy dinh dưỡng cấp nặng","Bệnh celiac","Nhiễm giun sán","Lao sơ nhiễm"],"bd":["+Yếm thực","Cam tích","Tiết tả","Nhi hãn chứng","Ế cách"],"bc":["+Lý – Hư – Hàn","Lý – Thực – Nhiệt","Biểu – Thực – Hàn","Lý – Hư – Nhiệt","Biểu – Hư – Nhiệt"],"the":["+Tỳ vị khí hư","Nhũ thực tích trệ","Vị âm bất túc","Can vượng khắc tỳ","Tỳ thận dương hư"],"phap":["+Kiện tỳ ích khí, khai vị tiêu thực","Tiêu thực đạo trệ, thông phủ","Dưỡng âm sinh tân, ích vị","Sơ can lý khí","Ôn bổ thận dương"],"phuong":["+Dị công tán","+Sâm linh bạch truật tán","Bảo hòa hoàn","Ích vị thang","Tiêu dao tán"],"huyet":["+Túc tam lý","+Tỳ du","+Vị du","+Trung quản","+Tứ phùng","Phong long","Thái xung","Đại chùy","Nội quan"]},"actions":["+Tư vấn nếp ăn: giờ ăn cố định, không xem điện thoại, hạn chế sữa hộp, bánh kẹo, nước ngọt trước bữa|4|Biếng ăn chức năng chủ yếu do chế độ ăn và thói quen.","+Bổ sung sắt theo phác đồ nhi khoa và theo dõi Hb|2|Có thiếu máu thiếu sắt nhẹ kèm ferritin thấp.","+Xoa bóp bấm huyệt vùng bụng, bấm Túc tam lý, Tỳ du|10|Kiện tỳ, khai vị, an toàn ở trẻ nhỏ.","+Cứu ôn hòa hoặc xoa bóp nhẹ vùng bụng, không dùng châm sâu|5|Trẻ 4 tuổi ưu tiên kỹ thuật nhẹ nhàng, ít xâm lấn.","+Theo dõi cân nặng, chiều cao hằng tháng, hẹn tái khám|2|Đánh giá đáp ứng điều trị.","+Dặn chuyển khám Nhi nếu sụt cân, sốt kéo dài, nôn, tiêu chảy kéo dài, phân mỡ hoặc chậm lớn rõ|2|Sàng lọc dấu hiệu cảnh báo bệnh lý thực thể.","-Chụp CT ngực bụng|40|Không có chỉ định ở trẻ nhỏ.","!Ép ăn, dọa nạt, cho ăn rong chạy theo bé|1|Củng cố hành vi ăn uống xấu, làm trẻ chán ăn thêm.","!Cho thuốc tẩy hạ mạnh (Đại hoàng, Mang tiêu) vì nghĩ là tích|2|Thể Tỳ vị khí hư, thuốc công phạt làm tỳ vị tổn thương thêm, nguy cơ mất nước."],"teach":"Trẻ biếng ăn kéo dài cần đánh giá tăng trưởng trước, loại trừ bệnh thực thể và thiếu vi chất (thiếu sắt thường gặp). Thể Tỳ vị khí hư: ăn ít, người gầy, sắc mặt nhợt, lưỡi nhạt, mạch hoãn nhược. Ở trẻ nhỏ ưu tiên điều chỉnh chế độ ăn, xoa bóp bấm huyệt, thuốc kiện tỳ; tránh công phạt mạnh. Dấu hiệu cảnh báo cần chuyển tuyến: sụt cân, sốt kéo dài, nôn, tiêu chảy mạn, thiếu máu nặng.","hbu":{"tien_su":"Khoảng 5 tháng nay biếng ăn, chế độ ăn nhiều sữa hộp, bánh kẹo, nước ngọt trước bữa, ít rau và thịt đỏ. Hay cảm ho nhẹ 1 đến 2 tháng một lần và tự khỏi. Tẩy giun cách đây 1 năm; mẹ tự mua siro bổ cho ăn ngon uống 1 tháng không đỡ nhiều. Chưa có dữ kiện về tiền sử sinh, tiêm chủng, dị ứng và tiền sử gia đình.","luoc_qua_co_quan":"Tiêu hóa không nôn, không đau bụng dữ dội, phân lúc nhão lúc thành khuôn, không máu, không phân mỡ; có 2 răng sâu nhẹ, không loét miệng, không sặc. Hô hấp không ho kéo dài, tim phổi bình thường. Không sốt kéo dài, không ra mồ hôi trộm, không nổi hạch; tiểu trong. Giấc ngủ không sâu, hay ra mồ hôi đầu khi ngủ. Theo YHCT, tính hiền, ít vận động, hay mệt, thích uống nước ấm, tay chân hơi mát.","tom_tat":"Bé trai 4 tuổi, biếng ăn 5 tháng với mỗi bữa chỉ ăn nửa chén cơm, nhai lâu rồi ngậm, cân nặng tăng rất ít từ 3 tuổi, chế độ ăn nhiều sữa hộp, bánh kẹo, nước ngọt. Khám 14 kg, cao 98 cm, nằm dưới trung vị trên biểu đồ WHO trong khoảng âm một đến âm hai độ lệch chuẩn; da hơi xanh, niêm mạc mắt và móng nhợt nhẹ, bụng mềm, không khối, gan lách hạch không to, tim phổi bình thường. Hb 10,6 g/dL, MCV 72 fL, ferritin giảm; soi phân không ký sinh trùng. Theo YHCT, lưỡi nhạt rêu trắng mỏng, mạch hoãn nhược, tay chân hơi mát.","dat_van_de":"Biếng ăn kéo dài kèm tăng trưởng chậm nhẹ ở trẻ 4 tuổi, thiếu máu hồng cầu nhỏ với ferritin giảm, chế độ ăn và nếp ăn chưa phù hợp. Chưa có dấu cảnh báo bệnh thực thể. Chứng trạng YHCT gồm ăn ít, người gầy, sắc mặt nhợt, lưỡi nhạt, mạch hoãn nhược.","bien_luan":"Biếng ăn kéo dài ở trẻ có chế độ ăn nhiều sữa và đồ ngọt trước bữa, khám thực thể không phát hiện bệnh đường tiêu hóa, nhiễm trùng mạn hay ký sinh trùng, kèm thiếu máu thiếu sắt nhẹ, phù hợp biếng ăn chức năng do chế độ ăn và hành vi kèm thiếu sắt. Bệnh tiêu hóa thực thể như celiac hay hấp thu kém ít phù hợp vì không tiêu chảy kéo dài, phân không mỡ, không sụt cân; nhiễm giun được loại trừ bằng soi phân; lao hoặc bệnh mạn khác ít gợi ý vì không sốt, ho kéo dài, ra mồ hôi trộm hay hạch. Cần theo dõi tăng trưởng theo biểu đồ, đánh giá lại Hb sau điều trị sắt, và chuyển khám Nhi nếu sụt cân, sốt kéo dài, nôn, tiêu chảy mạn hoặc chậm lớn rõ. Theo các khóa YHCT của ca, bệnh danh Yếm thực, bát cương Lý–Hư–Hàn, thể Tỳ vị khí hư; pháp kiện tỳ ích khí, khai vị tiêu thực; ở trẻ nhỏ ưu tiên điều chỉnh chế độ ăn, xoa bóp bấm huyệt, tránh công phạt mạnh.","sinh_ly_benh":"Ăn nhiều sữa và đồ ngọt trước bữa làm giảm cảm giác đói, bữa chính ít thịt đỏ và rau làm khẩu phần sắt và vi chất thiếu; thiếu sắt lại có thể làm biếng ăn nặng hơn, tạo vòng xoắn giảm ăn, thiếu sắt và chậm tăng trưởng. Môi trường ăn uống bị phân tán bởi điện thoại duy trì hành vi biếng ăn. Theo YHCT, tỳ vị khí hư làm vận hóa kém, khí huyết sinh hóa không đủ, gây ăn ít, gầy và nhợt.","tien_luong":"Gần: thường cải thiện khi điều chỉnh nếp ăn và bổ sung sắt, Hb cần được kiểm tra lại. Xa: thuận lợi nếu theo dõi tăng trưởng đều đặn; nếu không cải thiện hoặc có dấu cảnh báo phải tìm nguyên nhân thực thể. Theo YHCT, đánh giá lại ăn uống, sắc mặt và sức lực sau điều trị.","du_phong":"Giờ ăn cố định, không xem điện thoại khi ăn, hạn chế sữa hộp, bánh kẹo, nước ngọt trước bữa; tăng rau, thịt đỏ và thực phẩm giàu sắt. Bổ sung sắt theo phác đồ nhi khoa và theo dõi Hb. Theo dõi cân nặng, chiều cao hằng tháng, tái khám đúng hẹn; dặn chuyển khám Nhi khi có dấu cảnh báo. Xoa bóp bấm huyệt vùng bụng chỉ thực hiện nhẹ nhàng, không châm sâu ở trẻ nhỏ."},"nguon":["World Health Organization, Guideline on Haemoglobin Cutoffs to Define Anaemia in Individuals and Populations, 2024.","World Health Organization, WHO Guideline on Use of Ferritin Concentrations to Assess Iron Status in Individuals and Populations, 2020.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"kham-ho-man-viem-phe-quan-dam-thap","title":"Ho khạc đờm kéo dài ở người hút thuốc","kind":"Nội","level":"Trung bình","group":"noi","place":"Phòng khám Nội YHCT","clock":"0
