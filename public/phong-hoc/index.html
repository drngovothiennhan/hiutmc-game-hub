clostridioides-difficile-2021-focused-update/"],"status":"nhap"},{"id":"noi-tieu-hoa-008","title":"Mệt kéo dài ở người đã biết nhiễm viêm gan B","kind":"Nội","level":"Trung bình","group":"noi","name":"Người bệnh mô phỏng N08","age":43,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh đến khám vì mệt kéo dài, có hồ sơ HBsAg dương tính từ hai năm trước nhưng chưa theo dõi đều.","vitals":{"hr":82,"sbp":120,"dbp":76,"rr":17,"t":36.7,"spo2":98},"ask":[["HBsAg được phát hiện khi nào và có hồ sơ không?","Có kết quả dương tính hai năm trước và một năm trước.","e"],["Đã dùng thuốc kháng virus hoặc tự ngừng thuốc chưa?","Chưa dùng thuốc kháng virus.","e"],["Có vàng da, bụng to, phù chân hoặc xuất huyết không?","Không ghi nhận.","e"],["Có uống rượu hoặc dùng thuốc, thực phẩm bổ sung không rõ thành phần không?","Ít uống rượu, không dùng sản phẩm không rõ thành phần.","e"],["Gia đình có xơ gan hoặc ung thư gan không?","Cha từng được điều trị ung thư gan.","e"],["Người sống cùng đã xét nghiệm và tiêm vaccine chưa?","Vợ chưa rõ tình trạng xét nghiệm và tiêm vaccine.","e"],["Có đau bụng liên tục hoặc sụt cân không?","Không đau bụng liên tục, cân nặng ổn định.","n"]],"exam":[["K","Toàn trạng","Tỉnh, không vàng da rõ, không dấu mất nước.","e"],["K","Khám bụng","Bụng mềm, không dấu cổ trướng, không sờ thấy khối.","e"],["K","Dấu mất bù","Không phù chân, không rối loạn tri giác hoặc dấu xuất huyết.","e"],["K","Tim và phổi","Không ghi nhận bất thường.","n"]],"tests":[["HBsAg, HBeAg và HBV DNA",10,"HBsAg dương tính; HBeAg âm tính; HBV DNA 180.000 IU/mL.","e"],["Men gan, bilirubin, albumin và INR",10,"ALT 126 U/L, lần trước 118 U/L; AST 82 U/L; bilirubin 17 µmol/L; albumin 41 g/L; INR 1,0.","e"],["Chức năng thận và đánh giá đồng nhiễm",10,"Creatinin 86 µmol/L; HIV, anti-HCV và anti-HDV âm tính.","e"],["Siêu âm gan và đánh giá xơ hóa theo quy trình",15,"Không có tổn thương khu trú hoặc cổ trướng; mức xơ hóa cần hoàn tất đánh giá chuyên khoa.","e"],["CT gan lặp hằng tháng khi không có dấu nghi ngờ",40,"Không thực hiện: không phải chiến lược theo dõi thường quy phù hợp.","w"]],"opt":{"ydx":["+Viêm gan B mạn có hoạt động, cần đánh giá điều trị và xơ hóa","Viêm gan B cấp chỉ dựa vào HBsAg hiện tại","Xơ gan mất bù đã xác định","Ung thư gan đã xác định chỉ từ tiền sử gia đình"],"dieu_tri":["+Đánh giá điều trị kháng virus dựa trên hướng dẫn, chức năng thận và bệnh cảnh","Không điều trị vì HBeAg âm tính","Chỉ dùng thuốc hạ men gan thay mọi điều trị nguyên nhân","Đợi vàng da hoặc cổ trướng mới theo dõi"],"du_phong":["+Xét nghiệm và tiêm vaccine cho người tiếp xúc phù hợp chưa miễn dịch","Cách ly hoàn toàn mọi tiếp xúc sinh hoạt","Dùng chung dao cạo để người thân quen dần với virus","HBV DNA giảm đồng nghĩa luôn có thể tự ngừng thuốc"]},"actions":["+Đánh giá xơ hóa và chỉ định kháng virus|2|Không suy ra mức xơ hóa chỉ từ ALT.","+Lập kế hoạch theo dõi ung thư gan theo mức nguy cơ|2|Tiền sử gia đình cần được đưa vào đánh giá.","+Tư vấn đường lây, xét nghiệm và vaccine cho người tiếp xúc|2|Giảm lây truyền mà không kỳ thị.","!Khẳng định HBeAg âm tính nghĩa là virus không hoạt động|0|Cần kết hợp HBV DNA và tổn thương gan."],"teach":"HBsAg tồn tại kéo dài giúp xác định nhiễm mạn, nhưng đánh giá hoạt động và điều trị cần thêm dữ kiện. Men gan, tải lượng virus, xơ hóa và nguy cơ ung thư gan có vai trò khác nhau.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N08, nam, 43 tuổi, kỹ thuật viên; khám ngoại trú.","ly_do_vao_vien":"Mệt kéo dài và kiểm tra viêm gan B.","benh_su":"Mệt khoảng hai tháng, không vàng da, cổ trướng hoặc xuất huyết; theo dõi HBV không đều.","tien_su":"HBsAg dương tính được ghi nhận trên hai năm; chưa điều trị kháng virus; cha có ung thư gan.","luoc_qua_co_quan":"Không khó thở, rối loạn tri giác hoặc tiểu ít.","kham_hien_tai":"Sinh hiệu ổn định, chưa có dấu mất bù.","can_lam_sang":"HBV DNA tăng, ALT tăng lặp lại; chức năng tổng hợp gan còn bảo tồn; chưa hoàn tất phân mức xơ hóa.","tom_tat":"Nam 43 tuổi nhiễm HBV mạn, có bằng chứng hoạt động và tiền sử gia đình ung thư gan.","dat_van_de":"Hoạt động HBV; đánh giá xơ hóa; chỉ định điều trị; nguy cơ ung thư và lây truyền.","chan_doan_so_bo":"Viêm gan B mạn có hoạt động.","bien_luan":"Hồ sơ kéo dài xác định nhiễm mạn; tải lượng virus và ALT hỗ trợ hoạt động bệnh, đồng thời cần xem xét nguyên nhân tổn thương gan khác.","sinh_ly_benh":"Đáp ứng miễn dịch đối với tế bào gan nhiễm HBV góp phần gây viêm và tổn thương; diễn tiến kéo dài có thể gây xơ hóa.","chan_doan_phan_biet":"Bệnh gan chuyển hóa, tổn thương gan do thuốc, đồng nhiễm và bệnh gan khác khi có dữ kiện gợi ý.","chan_doan_xac_dinh":"Viêm gan B mạn có hoạt động; chưa xác định mức xơ hóa.","dieu_tri":"Đánh giá và triển khai kháng virus phù hợp, theo dõi đáp ứng và an toàn thuốc.","tien_luong":"Phụ thuộc xơ hóa, kiểm soát virus và tuân thủ; điều trị không loại bỏ hoàn toàn nguy cơ ung thư.","du_phong":"Vaccine cho người phù hợp, tránh dùng chung vật dụng dính máu và duy trì theo dõi."},"nguon":["WHO, Guidelines for the prevention, diagnosis, care and treatment for people with chronic hepatitis B infection, 2024. https://www.who.int/publications/i/item/9789240090903"],"status":"nhap"},{"id":"noi-tieu-hoa-009","title":"Tiêu chảy máu và mót rặn kéo dài","kind":"Nội","level":"Trung bình","group":"noi","name":"Người bệnh mô phỏng N09","age":32,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh khám chuyên khoa Tiêu hóa vì tiêu chảy có máu và mót rặn trong 6 tuần.","vitals":{"hr":84,"sbp":110,"dbp":72,"rr":18,"t":36.8,"spo2":99},"ask":[["Đi tiêu bao nhiêu lần và máu xuất hiện thế nào?","Khoảng 4 lần/ngày, phân mềm có máu và nhầy.","e"],["Có mót rặn hoặc phải đi tiêu ban đêm không?","Có mót rặn; đôi khi thức giấc để đi tiêu.","e"],["Có sốt, sụt cân hoặc đau bụng tăng không?","Sụt khoảng 2 kg trong 6 tuần; đau bụng dưới nhẹ; không sốt.","e"],["Có dùng kháng sinh, đi xa hoặc người cùng ăn mắc bệnh không?","Không dùng kháng sinh gần đây, không đi xa hoặc có người cùng ăn mắc bệnh.","e"],["Có đau khớp, mắt đỏ đau hoặc tổn thương da không?","Chưa ghi nhận.","e"],["Có dùng NSAID hoặc từng mắc bệnh tương tự không?","Không dùng NSAID; đây là đợt đầu.","e"],["Gia đình có bệnh viêm ruột không?","Không ghi nhận.","n"]],"exam":[["K","Toàn trạng","Tỉnh, hơi nhợt, không mất nước rõ.","e"],["K","Khám bụng","Đau nhẹ bụng dưới trái, bụng không chướng hoặc có dấu phúc mạc.","e"],["K","Đánh giá mắt, da và khớp","Chưa ghi nhận biểu hiện ngoài ruột.","n"],["K","Khám vùng hậu môn khi phù hợp và có đồng thuận","Không thấy tổn thương quanh hậu môn rõ hoặc trĩ giải thích toàn bộ bệnh cảnh.","e"]],"tests":[["Công thức máu, CRP và albumin",10,"Hemoglobin 11,4 g/dL; CRP 12 mg/L; albumin 38 g/L.","e"],["Xét nghiệm phân tìm nguyên nhân nhiễm trùng",10,"Không phát hiện tác nhân gây bệnh trong bộ xét nghiệm của cơ sở; C. difficile âm tính.","e"],["Nội soi đại tràng và sinh thiết sau đánh giá an toàn",20,"Viêm liên tục từ trực tràng đến đại tràng xuống; sinh thiết gợi ý viêm đại tràng mạn hoạt động với biến dạng cấu trúc tuyến.","e"],["Calprotectin phân",10,"620 µg/g; tăng theo ngưỡng của phòng xét nghiệm.","n"],["Xét nghiệm máu ẩn trong phân khi đã thấy máu rõ",10,"Không thực hiện: không giải quyết câu hỏi chẩn đoán hiện tại.","w"]],"opt":{"ydx":["+Viêm loét đại tràng, tổn thương đại tràng trái","Hội chứng ruột kích thích","Trĩ đơn thuần","Viêm tụy cấp"],"uu_tien":["+Kết hợp bệnh cảnh, nội soi, mô học và đánh giá nhiễm trùng","Chẩn đoán chỉ từ calprotectin tăng","Dùng corticoid ngay mà bỏ đánh giá nhiễm trùng","Cho rằng máu trong phân luôn do trĩ"],"dieu_tri":["+Điều trị theo mức hoạt động và phạm vi bệnh; cân nhắc 5-ASA cho bệnh phù hợp","Dùng corticoid kéo dài làm điều trị duy trì thường quy","Chỉ dùng thuốc cầm tiêu chảy bất kể mức độ","Không cần theo dõi sau khi hết máu trong phân"]},"actions":["+Phân mức hoạt động và rà nguy cơ cần nhập viện|2|Quyết định điều trị không chỉ dựa vào phạm vi nội soi.","+Cân nhắc phối hợp 5-ASA đường uống và trực tràng theo chuyên khoa|2|Phù hợp một số bệnh cảnh đại tràng trái nhẹ đến vừa.","+Đặt mục tiêu cải thiện triệu chứng và kiểm soát viêm|2|Hết triệu chứng không luôn đồng nghĩa hết hoạt động bệnh.","!Dùng corticoid lâu dài để duy trì lui bệnh|0|Cần chiến lược duy trì không phụ thuộc corticoid."],"teach":"Tiêu chảy máu, mót rặn và triệu chứng ban đêm không phù hợp với IBS đơn thuần. Chẩn đoán bệnh viêm ruột cần tổng hợp dữ kiện và đánh giá nguyên nhân nhiễm trùng.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N09, nữ, 32 tuổi, giáo viên; khám chuyên khoa.","ly_do_vao_vien":"Tiêu chảy máu và mót rặn.","benh_su":"Triệu chứng 6 tuần, khoảng 4 lần/ngày, có máu nhầy, mót rặn và đôi khi đi tiêu ban đêm; giảm cân nhẹ.","tien_su":"Đợt đầu, không dùng NSAID hoặc kháng sinh gần đây.","luoc_qua_co_quan":"Chưa có biểu hiện khớp, mắt hoặc da; không khó thở.","kham_hien_tai":"Sinh hiệu ổn định, đau nhẹ bụng dưới trái, không dấu phúc mạc.","can_lam_sang":"Thiếu máu nhẹ, dấu viêm tăng; nội soi và mô học phù hợp viêm loét đại tràng; xét nghiệm nhiễm trùng ban đầu không phát hiện tác nhân.","tom_tat":"Nữ 32 tuổi tiêu chảy máu kéo dài với tổn thương viêm liên tục từ trực tràng đến đại tràng xuống.","dat_van_de":"Viêm đại tràng mạn; mức hoạt động và phạm vi bệnh; thiếu máu; loại trừ nhiễm trùng.","chan_doan_so_bo":"Bệnh viêm ruột, nghĩ viêm loét đại tràng.","bien_luan":"Phân bố liên tục từ trực tràng và mô học hỗ trợ chẩn đoán; calprotectin phản ánh viêm, không xác định bệnh riêng lẻ.","sinh_ly_benh":"Viêm niêm mạc đại tràng gây chảy máu, giảm khả năng hấp thu và tăng nhu cầu đi tiêu.","chan_doan_phan_biet":"Viêm đại tràng nhiễm trùng, Crohn đại tràng và nguyên nhân viêm khác.","chan_doan_xac_dinh":"Viêm loét đại tràng, phạm vi đại tràng trái trong tình huống mô phỏng.","dieu_tri":"Điều trị theo mức hoạt động; cân nhắc 5-ASA phù hợp và đánh giá đáp ứng để điều chỉnh.","tien_luong":"Bệnh mạn có thể tái phát; cần theo dõi kiểm soát viêm.","du_phong":"Tuân thủ điều trị duy trì, rà vaccine và giám sát biến chứng theo thời gian mắc bệnh."},"nguon":["ACG Clinical Guideline Update: Ulcerative Colitis in Adults, 2025; bản tóm lược chính thức của ACG. https://gi.org/journals-publications/ebgi/alkazzi_aug2025/"],"status":"nhap"},{"id":"noi-tieu-hoa-010","title":"Sốt rét run, vàng da và đau hạ sườn phải","kind":"Nội","level":"Khó","group":"noi","name":"Người bệnh mô phỏng N10","age":76,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh đến cấp cứu vì sốt rét run, vàng da và đau hạ sườn phải, cần phối hợp Nội Tiêu hóa, hồi sức và đội can thiệp đường mật.","vitals":{"hr":116,"sbp":86,"dbp":50,"rr":26,"t":39.2,"spo2":95},"ask":[["Đau và sốt xuất hiện thế nào?","Đau hạ sườn phải hai ngày; sốt rét run từ hôm qua.","e"],["Vàng da, nước tiểu hoặc màu phân thay đổi không?","Vàng mắt tăng, nước tiểu sẫm, phân nhạt hơn thường ngày.","e"],["Có lú lẫn, ngất hoặc tiểu ít không?","Tiểu ít; gia đình thấy trả lời chậm hơn thường ngày.","e"],["Có tiền sử sỏi hoặc can thiệp đường mật không?","Từng phát hiện sỏi túi mật; chưa can thiệp đường mật.","e"],["Có dùng chống đông, dị ứng hoặc bệnh tim, thận không?","Không dùng chống đông, chưa ghi nhận dị ứng; có tăng huyết áp.","e"],["Gần đây có nhập viện hoặc dùng kháng sinh không?","Không trong ba tháng gần đây.","e"],["Có nôn máu hoặc đi phân đen không?","Không có.","n"]],"exam":[["K","Tri giác và tưới máu","Trả lời chậm, chi mát, thời gian làm đầy mao mạch 4 giây.","e"],["K","Da và mắt","Vàng da, vàng củng mạc.","e"],["K","Khám bụng","Đau hạ sườn phải, không co cứng lan tỏa.","e"],["K","Tim và phổi","Tim nhanh đều; thở nhanh, chưa có ran rõ.","e"]],"tests":[["Công thức máu, CRP, lactate và xét nghiệm chức năng cơ quan",10,"Bạch cầu 19,2 G/L; CRP 180 mg/L; lactate 3,8 mmol/L; creatinin 176 µmol/L; tiểu cầu 145 G/L.","e"],["Xét nghiệm gan mật và đông máu",10,"Bilirubin toàn phần 118 µmol/L, trực tiếp 86 µmol/L; ALP và GGT tăng; INR 1,3.","e"],["Cấy máu trước kháng sinh nếu không làm chậm điều trị",10,"Đã lấy hai bộ cấy; kết quả đang chờ.","e"],["Siêu âm đường mật",15,"Ống mật chủ giãn 12 mm, có hình ảnh sỏi khoảng 9 mm.","e"],["MRCP bắt buộc trước mọi quyết định dẫn lưu dù người bệnh không ổn",40,"Không ưu tiên nếu làm chậm kiểm soát nguồn nhiễm đã có bằng chứng rõ.","w"]],"opt":{"ydx":["+Viêm đường mật cấp do sỏi ống mật chủ, có dấu suy cơ quan và bất ổn tuần hoàn","Viêm túi mật đơn thuần đã giải thích đầy đủ mọi dấu hiệu","Viêm gan B mạn ổn định","Hội chứng ruột kích thích"],"uu_tien":["+Hồi sức, kháng sinh sớm và phối hợp dẫn lưu đường mật khẩn","Đợi hết sốt hoàn toàn mới hội chẩn can thiệp","Chỉ giảm đau và cho về","Chờ cấy máu dương tính mới điều trị"],"kiem_soat_nguon_nhiem":["+Giải áp đường mật bằng phương pháp phù hợp sau ổn định ban đầu, không trì hoãn không cần thiết","Kháng sinh luôn thay thế được dẫn lưu khi có tắc nghẽn và diễn tiến nặng","Mổ lấy túi mật là phương án duy nhất trong mọi tình huống","MRCP là biện pháp điều trị tắc nghẽn"]},"actions":["++Đánh giá ABC, hồi sức theo đáp ứng và huy động đội hồi sức|2|Người bệnh có dấu giảm tưới máu và rối loạn tri giác.","++Khởi kháng sinh sớm, hiệu chỉnh theo chức năng thận và dữ liệu kháng thuốc|2|Không chờ kết quả cấy khi đang diễn tiến nặng.","+Hội chẩn can thiệp dẫn lưu đường mật khẩn|2|Điều trị cần kiểm soát nguồn nhiễm bên cạnh kháng sinh.","!Trì hoãn can thiệp nhiều ngày để chờ bilirubin tự giảm|0|Tắc nghẽn nhiễm trùng có thể tiếp tục gây suy cơ quan."],"teach":"Sốt, ứ mật và bằng chứng tắc đường mật giúp định hướng viêm đường mật. Tụt huyết áp hoặc rối loạn tri giác đòi hỏi xử trí khẩn, không chỉ làm thêm xét nghiệm.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N10, nữ, 76 tuổi, nghỉ hưu; tiếp nhận tại cấp cứu.","ly_do_vao_vien":"Sốt rét run, vàng da và đau hạ sườn phải.","benh_su":"Đau hai ngày, sốt từ hôm trước, vàng da tăng và tiểu ít; gia đình nhận thấy trả lời chậm.","tien_su":"Đã biết sỏi túi mật; chưa can thiệp đường mật; có tăng huyết áp.","luoc_qua_co_quan":"Không xuất huyết tiêu hóa; tiểu ít và rối loạn đáp ứng mới xuất hiện.","kham_hien_tai":"Sốt cao, huyết áp thấp, thở nhanh, chi mát, vàng da và đau hạ sườn phải.","can_lam_sang":"Dấu viêm, ứ mật và lactate tăng; siêu âm có giãn ống mật chủ và sỏi; cấy đang chờ.","tom_tat":"Nữ 76 tuổi có nhiễm trùng đường mật kèm tắc nghẽn, giảm tưới máu và rối loạn tri giác.","dat_van_de":"Viêm đường mật cấp; tắc nghẽn; suy cơ quan; nhu cầu kiểm soát nguồn nhiễm.","chan_doan_so_bo":"Viêm đường mật cấp do sỏi ống mật chủ.","bien_luan":"Có ba nhóm dữ kiện: viêm toàn thân, ứ mật và hình ảnh nguyên nhân tắc. Rối loạn tri giác là dấu cần phân loại nặng theo Tokyo; mức độ phải được ghi nhận chính thức.","sinh_ly_benh":"Tắc nghẽn làm tăng áp lực đường mật, thuận lợi cho nhiễm trùng; đáp ứng toàn thân có thể gây giảm tưới máu và suy cơ quan.","chan_doan_phan_biet":"Viêm túi mật, áp xe gan, viêm gan cấp và các ổ nhiễm khác.","chan_doan_xac_dinh":"Viêm đường mật cấp do sỏi ống mật chủ, có dấu nặng; chưa kết luận sốc nhiễm khuẩn theo tiêu chuẩn đầy đủ.","dieu_tri":"Hồi sức, kháng sinh và dẫn lưu đường mật khẩn bằng phương pháp phù hợp; theo dõi chức năng cơ quan.","tien_luong":"Dè dặt, phụ thuộc đáp ứng hồi sức và kiểm soát nguồn nhiễm.","du_phong":"Sau ổn định, xử lý sỏi và lập kế hoạch phòng tái phát theo đội chuyên khoa."},"nguon":["Tokyo Guidelines 2018: diagnostic criteria and severity grading of acute cholangitis. DOI: 10.1002/jhbp.512.","Tokyo Guidelines 2018: initial management of acute biliary infection and flowchart for acute cholangitis. DOI: 10.1002/jhbp.509.","Danh mục hướng dẫn của Japanese Society of Hepato-Biliary-Pancreatic Surgery. https://www.jshbps.jp/modules/en/index.php?content_id=47"],"status":"nhap"},{"id":"noi-tim-mach-001","title":"Đau ngực dữ dội 2 giờ, điện tim ST chênh lên vùng trước","kind":"Nội","level":"Trung bình","group":"noi","name":"Ông N. V. T. (mô phỏng)","age":58,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Ông được đưa đến cấp cứu vì đau thắt ngực dữ dội 2 giờ, vã mồ hôi, không đỡ khi nghỉ.","vitals":{"hr":92,"sbp":138,"dbp":86,"rr":20,"t":36.8,"spo2":96},"ask":[["Đau ngực bắt đầu lúc nào, đau thế nào, lan đi đâu?","Đau thắt như bị đè nặng sau xương ức, bắt đầu cách đây 2 giờ khi đang nghỉ, lan lên cổ và cánh tay trái, kéo dài liên tục.","e"],["Cơn đau có đỡ khi nghỉ hoặc ngậm nitroglycerin không?","Nghỉ không đỡ; vợ cho ngậm một viên nitroglycerin dưới lưỡi, đau chỉ giảm nhẹ rồi lại tăng.","e"],["Có vã mồ hôi, buồn nôn, khó thở, ngất không?","Vã mồ hôi lạnh, buồn nôn, hơi khó thở; không ngất.","e"],["Tiền sử tăng huyết áp, đái tháo đường, rối loạn lipid, hút thuốc?","Tăng huyết áp 8 năm điều trị không đều; rối loạn lipid chưa dùng statin; hút khoảng 20 gói-năm, còn hút.","e"],["Trước đây có từng đau ngực khi gắng sức không?","Hai tháng nay đôi khi tức ngực khi leo cầu thang, nghỉ vài phút hết.","e"],["Có đau xé ra sau lưng, chấn thương ngực, hoặc dùng chống đông, phẫu thuật gần đây không (chống chỉ định tiêu sợi huyết)?","Không đau xé ra lưng; không chấn thương, không mổ, không xuất huyết, không đột quỵ trước đây; không dùng chống đông.","e"],["Gia đình có ai bệnh mạch vành sớm không?","Cha mất đột ngột năm 55 tuổi, nghi bệnh tim.","n"],["Nghề nghiệp, chế độ ăn?","Chủ cửa hàng, ăn mặn và nhiều mỡ, ít vận động.","n"]],"exam":[["K","Tim","Nhịp đều, tần số 92 lần/phút, T1 T2 rõ, không có tiếng thổi, không T3.","e"],["K","Phổi","Rì rào phế nang rõ, không ran (Killip I).","e"],["K","Tuần hoàn ngoại vi và tĩnh mạch cổ","Da ẩm lạnh nhẹ, tĩnh mạch cổ không nổi, không phù chân, mạch quay hai bên đều.","e"],["K","Huyết áp hai tay","Hai tay chênh dưới 10 mmHg.","e"],["K","Bụng","Mềm, không điểm đau khu trú.","n"]],"tests":[["Điện tâm đồ 12 chuyển đạo (trong 10 phút đầu)",10,"Nhịp xoang 92 l/p; ST chênh lên 3–4 mm ở V1–V4, chênh lên ở I và aVL, ST chênh xuống soi gương ở DII, DIII, aVF.","e"],["Troponin T hoặc I siêu nhạy",10,"hs-cTnI 420 ng/L (tham chiếu dưới 34 ng/L); không được chờ kết quả để quyết định tái tưới máu.","e"],["Công thức máu, đường huyết, creatinin, điện giải, lipid, đông máu",10,"Bạch cầu 11,2 G/L, Hb 146 g/L, tiểu cầu 238 G/L; glucose 7,4 mmol/L; creatinin 92 µmol/L; K 4,1 mmol/L; LDL-C 4,0 mmol/L; INR 1,0.","e"],["Siêu âm tim tại giường",15,"Giảm động vùng mỏm và thành trước vách, EF ước tính 45%, không tràn dịch màng tim, không hở van nặng.","e"],["X-quang ngực thẳng",10,"Bóng tim không to, phổi sáng, không xung huyết.","n"],["CT mạch máu toàn bộ để loại trừ bóc tách trước khi quyết định can thiệp",40,"Không có chỉ định khi điện tim điển hình và không có dấu hiệu bóc tách; làm chậm tái tưới máu.","w"]],"opt":{"ydx":["+Nhồi máu cơ tim cấp ST chênh lên thành trước, Killip I","Hội chứng vành cấp không ST chênh","Bóc tách động mạch chủ ngực","Viêm màng ngoài tim cấp"],"chien_luoc_tai_tuoi_mau":["Chờ troponin lần hai rồi mới quyết định tái tưới máu","+Can thiệp mạch vành qua da thì đầu (PCI) khẩn nếu thời gian từ chẩn đoán đến luồn dây dưới 120 phút; nếu không thể thì tiêu sợi huyết trong vòng 10 phút kể từ chẩn đoán","Nhập khoa Nội, dùng thuốc và chụp mạch vành chọn lọc sau 3 ngày","Chỉ dùng thuốc chống đau, tái tưới máu khi có suy tim"],"chong_ket_tap_tieu_cau":["Chỉ aspirin liều 81 mg, không dùng thuốc thứ hai","Clopidogrel 75 mg, hoãn aspirin đến sau can thiệp","+Aspirin 150–300 mg nhai và chất ức chế P2Y12 (ticagrelor 180 mg hoặc clopidogrel 600 mg) cùng chống đông trong thủ thuật","Chỉ heparin, không dùng thuốc kháng tiểu cầu"],"oxy":["Thở oxy lưu lượng cao cho mọi người bệnh nhồi máu cơ tim","Oxy chỉ để giảm đau","Thở máy xâm nhập sớm phòng ngừa","+Chỉ thở oxy khi SpO2 dưới 90%; ở ca này không cần"]},"actions":["++Ghi điện tim 12 chuyển đạo trong 10 phút, gắn monitor và đường truyền tĩnh mạch|2|Chẩn đoán STEMI dựa vào điện tim; mọi quyết định sau đó phụ thuộc thời gian.","++Aspirin nhai 300 mg, ticagrelor 180 mg và heparin không phân đoạn theo cân nặng|2|Điều trị chống huyết khối kép ngay trước can thiệp.","++Kích hoạt đội can thiệp tim mạch, chuyển phòng thông tim|2|Thời gian cửa đến bóng dưới 90 phút (trong 120 phút nếu chuyển viện) quyết định lượng cơ tim cứu được.","++Atorvastatin 80 mg và dặn giữ yên giường|2|Statin liều cao sớm làm giảm biến cố; huyết động ổn định, chưa có suy tim nên có thể cân nhắc chẹn beta liều thấp đường uống.","-Morphin tĩnh mạch ngay khi vừa thấy đau nhẹ|1|Chỉ dùng khi đau không kiểm soát; morphin có thể làm chậm hấp thu thuốc kháng tiểu cầu.","!Cho ra về theo dõi vì troponin chưa có kết quả|0|Điện tim STEMI điển hình là chẩn đoán đủ để cấp cứu tái tưới máu, trì hoãn gây tử vong.","!Tiêm bắp thuốc giảm đau và dùng thuốc chống đông đường tiêm bắp|0|Tiêm bắp làm tăng nguy cơ tụ máu và làm sai lệch men tim, không có chỉ định."],"teach":"ST chênh lên kèm đau ngực điển hình đủ để chẩn đoán STEMI và mở động mạch thủ phạm càng sớm càng tốt; không chờ troponin. Điều trị bao gồm chống kết tập tiểu cầu kép, chống đông và tái tưới máu, oxy chỉ khi giảm oxy máu.","hbu":{"hanh_chinh":"Ông N. V. T. (mô phỏng), nam, 58 tuổi, chủ cửa hàng; vào cấp cứu lúc có đau ngực 2 giờ.","ly_do_vao_vien":"Đau thắt ngực dữ dội 2 giờ, vã mồ hôi.","benh_su":"Cách nhập viện 2 giờ, đang nghỉ ngơi ông xuất hiện đau thắt sau xương ức như bị đè nặng, lan lên cổ và cánh tay trái, kèm vã mồ hôi lạnh, buồn nôn và khó thở nhẹ. Ngậm một viên nitroglycerin chỉ đỡ thoáng qua. Hai tháng trước có những cơn tức ngực khi gắng sức, nghỉ vài phút hết. Không ngất, không đau xé ra lưng, không sốt, không ho.","tien_su":"Tăng huyết áp 8 năm, điều trị không đều; rối loạn lipid máu chưa dùng statin; hút thuốc khoảng 20 gói-năm. Cha mất đột ngột ở tuổi 55 nghi bệnh tim. Không tiền sử xuất huyết, đột quỵ, phẫu thuật gần đây, không dùng thuốc chống đông.","luoc_qua_co_quan":"Không ho, không sốt, không đau bụng, không rối loạn tiêu hóa; không phù chân; không có triệu chứng thần kinh khu trú.","kham_hien_tai":"Tỉnh, vã mồ hôi nhẹ; mạch 92 l/p, huyết áp 138/86 mmHg, nhịp thở 20 l/p, nhiệt độ 36,8 độ C, SpO2 96% khí trời. Tim đều, không tiếng thổi; phổi không ran (Killip I); tĩnh mạch cổ không nổi, không phù. Huyết áp hai tay không chênh lệch đáng kể.","can_lam_sang":"Điện tim: ST chênh lên 3–4 mm V1–V4, I, aVL, ST chênh xuống soi gương DII, DIII, aVF. hs-cTnI 420 ng/L. Glucose 7,4 mmol/L, LDL-C 4,0 mmol/L, creatinin 92 µmol/L, K 4,1. Siêu âm tim: giảm động vùng trước vách và mỏm, EF khoảng 45%, không tràn dịch màng tim.","tom_tat":"Nam 58 tuổi có nhiều yếu tố nguy cơ tim mạch (tăng huyết áp, rối loạn lipid, hút thuốc), đau thắt ngực điển hình khi nghỉ 2 giờ, điện tim ST chênh lên V1–V4, I, aVL kèm men tim tăng và giảm động vùng trước; huyết động ổn định, Killip I.","dat_van_de":"1) Đau ngực cấp kiểu thiếu máu cơ tim. 2) ST chênh lên vùng trước. 3) Tăng men tim. 4) Cần tái tưới máu khẩn và phòng ngừa biến chứng. 5) Yếu tố nguy cơ chưa kiểm soát.","chan_doan_so_bo":"Nhồi máu cơ tim cấp có ST chênh lên thành trước rộng, Killip I, nghi tắc động mạch liên thất trước đoạn gần.","bien_luan":"Đau thắt ngực điển hình kéo dài trên 20 phút không đáp ứng nghỉ, đi kèm triệu chứng thần kinh tự chủ (vã mồ hôi, buồn nôn), trên nền nhiều yếu tố nguy cơ, gợi ý hội chứng vành cấp. Điện tim cho thấy ST chênh lên liên tiếp ở V1–V4, I, aVL (đạt ngưỡng 2 mm ở nam trên 40 tuổi tại V2–V3) kèm ST chênh xuống soi gương ở thành dưới, đủ để chẩn đoán nhồi máu cơ tim cấp ST chênh lên; vị trí gợi ý tắc động mạch liên thất trước. hs-cTnI tăng và siêu âm giảm động vùng tương ứng củng cố chẩn đoán nhưng không phải điều kiện để bắt đầu tái tưới máu. Phân độ Killip I (không ran phổi, huyết động ổn định) cho tiên lượng ngắn hạn tốt hơn nếu mở mạch sớm. Bóc tách động mạch chủ ít nghĩ vì đau không xé ra lưng, huyết áp hai tay đều, không tiếng thổi hở chủ; viêm màng ngoài tim ít nghĩ vì ST chênh lên có hình lồi, có soi gương và không có PR chênh xuống lan tỏa.","sinh_ly_benh":"Mảng xơ vữa ở động mạch vành bị nứt hoặc bào mòn làm lộ lõi lipid, kích hoạt tiểu cầu và dòng thác đông máu hình thành huyết khối gây tắc hoàn toàn lòng mạch. Vùng cơ tim phía sau thiếu máu xuyên thành, hoại tử tiến triển từ nội tâm mạc ra ngoại tâm mạc trong vài giờ, vì vậy thời gian là cơ tim. Điện tim ST chênh lên phản ánh dòng điện tổn thương xuyên thành; troponin được giải phóng khi màng tế bào cơ tim bị phá vỡ. Mất cơ tim co bóp làm giảm EF, tăng áp lực cuối tâm trương, nguy cơ suy tim, rối loạn nhịp thất và biến chứng cơ học.","chan_doan_phan_biet":"Bóc tách động mạch chủ; viêm màng ngoài tim cấp; thuyên tắc phổi; co thắt mạch vành; viêm cơ tim; Takotsubo; trào ngược dạ dày thực quản. Ở ca này điện tim ST chênh lên khu trú vùng động mạch liên thất trước kèm men tim tăng ủng hộ STEMI.","chan_doan_xac_dinh":"Nhồi máu cơ tim cấp ST chênh lên thành trước rộng, Killip I; tăng huyết áp; rối loạn lipid máu; hút thuốc lá.","dieu_tri":"Chống kết tập tiểu cầu kép (aspirin 300 mg nhai, ticagrelor 180 mg), heparin không phân đoạn theo cân nặng; PCI thì đầu khẩn cấp, mục tiêu cửa đến bóng dưới 90 phút (tổng thời gian từ chẩn đoán đến luồn dây dưới 120 phút nếu chuyển viện); nếu không đạt thì tiêu sợi huyết trong 10 phút và chuyển chụp mạch trong 2–24 giờ. Atorvastatin 80 mg, chẹn beta liều thấp khi không có suy tim và huyết động ổn định, ức chế men chuyển/chẹn thụ thể sớm khi EF dưới 40% hoặc tăng huyết áp. Oxy chỉ khi SpO2 dưới 90%. Giảm đau bằng nitrat, morphin khi cần.","tien_luong":"Tốt nếu tái tưới máu sớm; theo dõi loạn nhịp thất 48 giờ đầu, suy tim, biến chứng cơ học; tiên lượng xa phụ thuộc EF và kiểm soát yếu tố nguy cơ.","du_phong":"Bỏ thuốc lá, chế độ ăn giảm muối giảm mỡ, tập phục hồi chức năng tim; statin cường độ cao dài hạn, mục tiêu LDL-C dưới 1,4 mmol/L, kháng tiểu cầu kép 12 tháng, kiểm soát huyết áp; tái khám định kỳ, đánh giá EF sau 1–3 tháng."},"nguon":["Hướng dẫn chẩn đoán và điều trị nhồi máu cơ tim cấp có ST chênh lên, Bộ Y tế Việt Nam, 2022.","2023 ESC Guidelines for the management of acute coronary syndromes, Eur Heart J 2023.","Giáo trình Nội khoa, Bộ môn Nội, Trường Đại học Y Hà Nội, phần Bệnh mạch vành."],"status":"nhap"},{"id":"noi-tim-mach-002","title":"Đau ngực khi nghỉ, ST chênh xuống và troponin tăng ở người đái tháo đường","kind":"Nội","level":"Trung bình","group":"noi","name":"Bà L. T. M. (mô phỏng)","age":67,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Bà nhập khoa Tim mạch vì đau tức ngực hai lần trong ngày, mỗi lần khoảng 20 phút.","vitals":{"hr":84,"sbp":150,"dbp":84,"rr":18,"t":37,"spo2":97},"ask":[["Cơn đau ngực xảy ra khi nào, kéo dài bao lâu?","Hai cơn trong hôm nay, đang ngồi nghỉ, mỗi cơn 20 phút, đau tức giữa ngực lan lên hàm; cơn thứ hai mới hết cách đây 1 giờ.","e"],["Trước đó có đau ngực khi gắng sức không?","Hai tuần nay đi bộ 200 m đã tức ngực, nghỉ 5 phút hết, tần suất tăng dần.","e"],["Có khó thở, vã mồ hôi, hồi hộp, ngất không?","Hơi khó thở và vã mồ hôi trong cơn; không hồi hộp, không ngất.","e"],["Bệnh nền nào đang điều trị?","Đái tháo đường típ 2 mười hai năm dùng metformin; tăng huyết áp mười năm; rối loạn lipid chưa dùng statin đều.","e"],["Đang dùng thuốc nào, có dị ứng aspirin hoặc từng xuất huyết tiêu hóa không?","Amlodipin 5 mg và metformin; không dị ứng aspirin, chưa từng xuất huyết tiêu hóa.","e"],["Có đau ngực tăng khi hít sâu hoặc đổi tư thế, có sốt không?","Không đổi theo hơi thở hay tư thế; không sốt.","e"],["Hút thuốc, uống rượu?","Không hút thuốc, không uống rượu.","n"]],"exam":[["K","Tim và phổi","Tim đều 84 l/p, không tiếng thổi; phổi không ran.","e"],["K","Huyết áp, tuần hoàn","Huyết áp 150/84 mmHg, không phù, tĩnh mạch cổ không nổi, mạch ngoại vi đều.","e"],["K","Thể trạng","BMI 29 kg/m2, tỉnh, không tím.","e"],["K","Bụng, chân","Bụng mềm, hai chân không sưng đau, không dấu viêm tĩnh mạch.","n"]],"tests":[["Điện tâm đồ 12 chuyển đạo lúc đau và lặp lại sau 15–30 phút",10,"Nhịp xoang 84 l/p; ST chênh xuống 1,5 mm ở V4–V6, sóng T đảo sâu; không ST chênh lên; hết cơn đau, ST còn chênh xuống nhẹ.","e"],["hs-troponin T lúc nhập viện và sau 1–3 giờ",10,"Lúc 0 giờ 48 ng/L, lúc 3 giờ 190 ng/L (tham chiếu dưới 14 ng/L): tăng rồi tăng tiếp, có động học.","e"],["Glucose, HbA1c, creatinin, lipid, công thức máu",10,"Glucose 9,8 mmol/L; HbA1c 8,4%; creatinin 88 µmol/L, eGFR 62; LDL-C 3,6 mmol/L; Hb 124 g/L.","e"],["Siêu âm tim",15,"EF 52%, giảm động vùng sau bên nhẹ, không hở van nặng, không tràn dịch.","e"],["Nghiệm pháp gắng sức trên thảm chạy để chẩn đoán trước khi dùng thuốc",10,"Chống chỉ định khi đang có đau ngực nghỉ và troponin tăng, nguy cơ biến cố cao.","w"]],"opt":{"ydx":["Đau thắt ngực ổn định","+Nhồi máu cơ tim cấp không ST chênh lên (NSTEMI)","Thuyên tắc phổi","Viêm màng ngoài tim cấp"],"chien_luoc_xam_lan":["Chỉ điều trị nội khoa, không bao giờ cần chụp mạch","Chờ ổn định vài tuần rồi nghiệm pháp gắng sức","+Chụp mạch vành xâm lấn sớm trong 24 giờ vì troponin tăng có động học và ST chênh xuống (nguy cơ cao theo GRACE)","Tiêu sợi huyết đường tĩnh mạch ngay"],"thuoc_thiet_yeu":["Chỉ dùng thuốc giãn mạch uống khi đau","Corticoid liều cao chống viêm","Thuốc lợi tiểu quai thường quy","+Aspirin 150–300 mg, ức chế P2Y12 và chống đông (enoxaparin hoặc UFH), statin cường độ cao"],"metformin":["+Tạm ngưng metformin quanh thời điểm dùng thuốc cản quang và theo dõi eGFR; kiểm soát đường huyết bằng insulin nếu cần","Tiếp tục metformin liều cao không cần xét thuốc cản quang","Ngừng mọi thuốc đái tháo đường kéo dài","Tăng liều sulfonylurea tối đa"]},"actions":["++Nằm nghỉ, monitor điện tim, đường truyền, ghi điện tim lặp lại|2|Cần phát hiện thay đổi ST, loạn nhịp khi đang có đau ngực nghỉ.","++Aspirin nhai và chống đông (enoxaparin 1 mg/kg tiêm dưới da mỗi 12 giờ, điều chỉnh theo eGFR)|2|Điều trị thuốc chống huyết khối ngay khi chẩn đoán NSTE-ACS.","+Thêm chất ức chế P2Y12, statin liều cao và nitrat ngậm khi còn đau|2|Giảm biến cố; nitrat giảm đau do thiếu máu khi huyết áp cho phép.","+Hội chẩn tim mạch can thiệp để chụp mạch vành trong 24 giờ|2|Nguy cơ cao theo GRACE nên chiến lược xâm lấn sớm cải thiện tiên lượng.","-Làm nghiệm pháp gắng sức thảm chạy trước khi quyết định|1|Không phù hợp khi có đau ngực nghỉ và men tim tăng.","!Cho về với hẹn khám ngoại trú vì ST không chênh lên|0|ST chênh xuống kèm troponin tăng là nhồi máu cơ tim, nguy cơ biến cố trong những ngày đầu.","!Dùng thuốc tiêu sợi huyết đường tĩnh mạch|0|Không có lợi và làm tăng xuất huyết trong NSTE-ACS."],"teach":"Ở hội chứng vành cấp không ST chênh lên, chẩn đoán dựa trên triệu chứng, điện tim và động học troponin; chia nguy cơ (GRACE) để chọn thời điểm chụp mạch. Tiêu sợi huyết không có chỉ định.","hbu":{"hanh_chinh":"Bà L. T. M. (mô phỏng), nữ, 67 tuổi, hưu trí; nhập khoa Tim mạch.","ly_do_vao_vien":"Đau tức ngực khi nghỉ hai lần trong ngày.","benh_su":"Hai tuần nay bà đau tức ngực khi đi bộ khoảng 200 m, nghỉ 5 phút hết, cơn tăng dần. Hôm nay có hai cơn đau thắt giữa ngực lan lên hàm khi đang ngồi nghỉ, mỗi cơn khoảng 20 phút, kèm khó thở nhẹ và vã mồ hôi. Cơn thứ hai vừa hết cách nhập viện 1 giờ. Không sốt, không đau thay đổi theo hơi thở.","tien_su":"Đái tháo đường típ 2 mười hai năm (metformin), tăng huyết áp mười năm (amlodipin), rối loạn lipid máu không điều trị đều. Không hút thuốc. Không dị ứng aspirin, chưa xuất huyết tiêu hóa.","luoc_qua_co_quan":"Không ho, không sốt; không đau chân, không sưng chân; ăn uống bình thường; tiểu bình thường.","kham_hien_tai":"Tỉnh; mạch 84 l/p, huyết áp 150/84 mmHg, nhịp thở 18 l/p, nhiệt độ 37,0 độ C, SpO2 97%. BMI 29. Tim đều không tiếng thổi, phổi không ran, không phù, bụng mềm.","can_lam_sang":"Điện tim: ST chênh xuống 1,5 mm V4–V6, T đảo, không ST chênh lên. hs-troponin T 48 rồi 190 ng/L. Glucose 9,8 mmol/L, HbA1c 8,4%, eGFR 62, LDL-C 3,6 mmol/L. Siêu âm tim EF 52%, giảm động vùng sau bên nhẹ.","tom_tat":"Nữ 67 tuổi, đái tháo đường, tăng huyết áp, rối loạn lipid; đau thắt ngực tiến triển rồi đau khi nghỉ; điện tim ST chênh xuống và T đảo vùng bên; troponin tăng có động học; không ST chênh lên; huyết động ổn định.","dat_van_de":"1) Đau thắt ngực mới khởi phát và nặng dần. 2) ST chênh xuống, T đảo. 3) Tăng và động học troponin. 4) Nhiều yếu tố nguy cơ chưa kiểm soát (đái tháo đường, tăng huyết áp, lipid). 5) Quyết định chiến lược xâm lấn.","chan_doan_so_bo":"Nhồi máu cơ tim cấp không ST chênh lên, nguy cơ cao (GRACE trên 140 ước tính), huyết động ổn định.","bien_luan":"Cơn đau thắt ngực mới khởi phát, cường độ tăng dần rồi xuất hiện khi nghỉ kéo dài trên 20 phút là đau thắt ngực không ổn định theo tiêu chuẩn lâm sàng. Điện tim ST chênh xuống ở V4–V6 và T đảo là bằng chứng thiếu máu cơ tim không xuyên thành. Troponin siêu nhạy vượt ngưỡng tham chiếu và tăng thêm giữa hai lần đo (đường 0/3 giờ) chứng tỏ có hoại tử cơ tim, nên chẩn đoán là nhồi máu cơ tim không ST chênh lên thay vì đau thắt ngực không ổn định. Nguy cơ cao do troponin tăng, ST chênh xuống và đái tháo đường; do đó chiến lược xâm lấn sớm trong 24 giờ là hợp lý. Phân biệt với thuyên tắc phổi (không khó thở nặng, không đau kiểu màng phổi, không có yếu tố huyết khối tĩnh mạch), viêm màng ngoài tim (ST chênh lên lan tỏa, đau thay đổi theo tư thế) và bóc tách động mạch chủ (đau xé, huyết áp hai tay chênh). Siêu âm tim cho EF bảo tồn ở mức 52%, giảm động vùng sau bên nhẹ phù hợp thiếu máu vùng bên.","sinh_ly_benh":"Cơ chế thường là mảng xơ vữa nứt hoặc bào mòn kèm huyết khối giàu tiểu cầu gây tắc không hoàn toàn hoặc tắc thoáng qua lòng mạch, hoặc tắc nghẽn mạch xa do mảnh huyết khối. Thiếu máu cơ tim dưới nội mạc thể hiện bằng ST chênh xuống; hoại tử vi thể giải phóng troponin. Ở người đái tháo đường, rối loạn chức năng nội mô, viêm mạn và bệnh nhiều nhánh mạch vành làm tăng nguy cơ biến cố tái phát.","chan_doan_phan_biet":"Đau thắt ngực ổn định; thuyên tắc phổi; viêm màng ngoài tim; bóc tách động mạch chủ; viêm thực quản trào ngược; đau cơ xương ngực. Dữ liệu cận lâm sàng và động học troponin ủng hộ NSTEMI.","chan_doan_xac_dinh":"Nhồi máu cơ tim cấp không ST chênh lên; đái tháo đường típ 2 kiểm soát kém; tăng huyết áp; rối loạn lipid máu; thừa cân.","dieu_tri":"Aspirin 150–300 mg rồi 75–100 mg/ngày, ticagrelor 180 mg rồi 90 mg x 2/ngày (hoặc clopidogrel); enoxaparin 1 mg/kg x 2/ngày (chỉnh theo eGFR) hoặc UFH; atorvastatin 80 mg; chẹn beta nếu không có chống chỉ định; nitrat khi đau; chụp mạch vành trong 24 giờ và tái thông theo tổn thương; kiểm soát đường huyết, tạm ngưng metformin quanh thủ thuật, theo dõi chức năng thận.","tien_luong":"Dè dặt đến khá nếu được tái thông; nguy cơ biến cố tái phát cao hơn do đái tháo đường; theo dõi 6–12 tháng.","du_phong":"Kiểm soát đường huyết (HbA1c dưới 7%), huyết áp dưới 130/80 mmHg, LDL-C dưới 1,4 mmol/L; kháng tiểu cầu kép 12 tháng nếu không nguy cơ chảy máu cao; phục hồi chức năng tim, ăn uống, vận động đều; tái khám tim mạch và nội tiết."},"nguon":["2023 ESC Guidelines for the management of acute coronary syndromes, Eur Heart J 2023.","Hướng dẫn chẩn đoán và điều trị hội chứng vành cấp không ST chênh lên, Hội Tim mạch học Việt Nam, bản cập nhật.","Giáo trình Nội khoa, Bộ môn Nội, Trường Đại học Y Dược TPHCM, phần Bệnh mạch vành."],"status":"nhap"},{"id":"noi-tim-mach-003","title":"Đau đầu dữ dội, lú lẫn, huyết áp 232/128 mmHg","kind":"Nội","level":"Trung bình","group":"noi","name":"Ông T. Q. H. (mô phỏng)","age":49,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Ông được vợ đưa vào cấp cứu vì đau đầu dữ dội, nôn và lú lẫn từ sáng.","vitals":{"hr":98,"sbp":232,"dbp":128,"rr":20,"t":37,"spo2":97},"ask":[["Đau đầu bắt đầu thế nào, có nôn, nhìn mờ không?","Đau đầu âm ỉ hai ngày rồi tăng dữ dội từ sáng, nôn hai lần, nhìn mờ cả hai mắt.","e"],["Có lú lẫn, co giật, yếu liệt, nói khó không?","Vợ thấy ông nói chuyện lẫn, hỏi trước quên sau; không co giật, không yếu liệt, không méo miệng.","e"],["Có đau ngực, khó thở, đau lưng không?","Tức ngực nhẹ, không khó thở, không đau lưng xé.","e"],["Tiền sử tăng huyết áp và thuốc đang dùng?","Tăng huyết áp 6 năm, tự ngưng thuốc 3 tuần nay vì thấy khỏe; trước đó dùng amlodipin và losartan.","e"],["Gần đây có dùng thuốc, chất kích thích, thuốc cảm giảm nghẹt mũi, thuốc giảm đau, rượu nặng không?","Không dùng chất kích thích; không dùng thuốc cảm; uống rượu vừa.","e"],["Có chấn thương đầu, bệnh thận, đang mang thai (đối với nữ), bệnh tuyến thượng thận không?","Không chấn thương đầu; chưa biết bệnh thận; không có cơn đau đầu đỏ bừng mặt đánh trống ngực đột ngột trước đây.","e"],["Ăn uống, hút thuốc?","Ăn mặn, hút nửa gói mỗi ngày.","n"]],"exam":[["K","Thần kinh","Lơ mơ, định hướng kém, GCS 14 (M6 V4 E4), không dấu thần kinh khu trú, không cứng gáy; đồng tử đều phản xạ tốt.","e"],["K","Đáy mắt","Phù gai thị hai bên, xuất huyết hình ngọn lửa và xuất tiết võng mạc.","e"],["K","Tim phổi","Tim đều 98 l/p, T2 vang ở ổ chủ, không tiếng thổi; phổi vài ran ẩm nhỏ ở đáy hai bên.","e"],["K","Huyết áp hai tay và mạch","Huyết áp tay phải 232/128, tay trái 228/126 mmHg; mạch hai bên đều, không tiếng thổi động mạch cảnh.","e"],["K","Bụng, phù","Bụng mềm, không âm thổi vùng thượng vị; không phù.","n"]],"tests":[["CT sọ não không cản quang",40,"Không xuất huyết, không nhồi máu mới, không khối choán chỗ; có dấu hiệu phù não nhẹ lan tỏa vùng sau.","e"],["Điện tim",10,"Nhịp xoang 98 l/p, dày thất trái, không thay đổi ST cấp.","e"],["Creatinin, ure, điện giải, tổng phân tích nước tiểu",10,"Creatinin 142 µmol/L, ure 11 mmol/L, K 4,0 mmol/L; nước tiểu protein 2+, hồng cầu 1+.","e"],["Troponin siêu nhạy, X-quang ngực, công thức máu",10,"Troponin 22 ng/L (tham chiếu dưới 34), tim to nhẹ, xung huyết phổi nhẹ; Hb 138 g/L, tiểu cầu bình thường.","e"],["Cộng hưởng từ sọ não, mạch máu khẩn trước mọi thuốc hạ áp",10,"Làm trước khi hạ áp là không cần thiết và gây chậm trễ khi CT đã loại trừ xuất huyết.","w"]],"opt":{"ydx":["Cơn tăng huyết áp không triệu chứng đơn thuần","Xuất huyết não tự phát","+Cấp cứu tăng huyết áp với bệnh não tăng huyết áp","Viêm màng não do vi khuẩn"],"muc_tieu_ha":["Hạ ngay về 120/80 mmHg trong 30 phút","Cho nifedipin ngậm dưới lưỡi liều cao","Không dùng thuốc, chờ huyết áp tự giảm","+Dùng thuốc tĩnh mạch chỉnh liều (nicardipin hoặc labetalol), hạ huyết áp trung bình không quá 25% trong giờ đầu, rồi mục tiêu 160/100 mmHg trong 2–6 giờ, về bình thường sau 24–48 giờ"],"loai_thuoc_tranh":["+Tránh nifedipin tác dụng nhanh ngậm dưới lưỡi và hạ áp quá nhanh vì có nguy cơ thiếu máu não, tim","Ưu tiên nitroprussid cho mọi ca để hạ nhanh nhất","Dùng thuốc lợi tiểu liều lớn làm khô nước","Dùng thuốc an thần mạnh làm ngủ sâu"],"tim_nguyen_nhan":["Không cần tìm nguyên nhân khi đã có tiền sử tăng huyết áp","+Tìm tổn thương cơ quan đích và nguyên nhân thứ phát (thận, mạch thận, u tủy thượng thận) sau khi ổn định huyết áp","Chỉ làm sinh thiết thận ngay","Chỉ siêu âm bụng sau một tháng"]},"actions":["++Nằm đầu cao 30 độ, monitor, hai đường truyền, theo dõi huyết áp mỗi 5 phút|2|Cần theo dõi sát khi dùng thuốc hạ áp tĩnh mạch.","++Truyền nicardipin hoặc labetalol tĩnh mạch chỉnh liều đạt mục tiêu giảm huyết áp trung bình 20–25% trong giờ đầu|2|Giảm tổn thương cơ quan đích nhưng tránh thiếu máu não do hạ áp quá nhanh.","++Chụp CT sọ loại trừ xuất huyết và đánh giá chức năng thận, nước tiểu|2|Phân biệt với xuất huyết não và tìm tổn thương cơ quan đích.","++Nhập hồi sức tim mạch, theo dõi tri giác, lượng nước tiểu|2|Bệnh não tăng huyết áp cần theo dõi liên tục.","-Cho thuốc lợi tiểu quai tiêm tĩnh mạch liều cao thường quy|1|Chỉ dùng khi có quá tải thể tích hoặc phù phổi; ở đây chỉ có ran nhẹ.","!Ngậm nifedipin tác dụng nhanh để hạ nhanh|0|Hạ áp mạnh và không kiểm soát làm giảm tưới máu não, tim, thận.","!Cho về uống thuốc huyết áp lại như thường|0|Ca có bệnh não và phù gai thị cần can thiệp khẩn tại hồi sức."],"teach":"Phân biệt cấp cứu tăng huyết áp (có tổn thương cơ quan đích) với cơn tăng huyết áp không triệu chứng; cấp cứu cần thuốc tĩnh mạch hạ áp có kiểm soát, tránh hạ nhanh quá mức và tìm nguyên nhân sau đó.","hbu":{"hanh_chinh":"Ông T. Q. H. (mô phỏng), nam, 49 tuổi, tài xế; vào cấp cứu lúc sáng.","ly_do_vao_vien":"Đau đầu dữ dội, nôn, lú lẫn.","benh_su":"Ông có tăng huyết áp 6 năm, tự ngưng thuốc 3 tuần nay. Hai ngày nay đau đầu âm ỉ, sáng nay đau dữ dội kèm nhìn mờ, nôn hai lần và nói lẫn. Không co giật, không yếu liệt, không đau ngực dữ dội ngoài cảm giác tức nhẹ, không khó thở nặng.","tien_su":"Tăng huyết áp 6 năm, trước dùng amlodipin và losartan nhưng ngưng 3 tuần; hút thuốc nửa gói mỗi ngày; uống rượu vừa; chưa biết bệnh thận. Không dùng chất kích thích hay thuốc cảm.","luoc_qua_co_quan":"Không sốt, không cứng gáy; tiểu ít hơn thường lệ; không đau bụng; không đánh trống ngực kịch phát.","kham_hien_tai":"Lơ mơ, GCS 14, định hướng kém, không dấu thần kinh khu trú; huyết áp 232/128 mmHg hai tay gần bằng nhau, mạch 98 l/p, nhịp thở 20 l/p, SpO2 97%. Đáy mắt phù gai thị, xuất huyết hình ngọn lửa. Phổi vài ran ẩm nền, tim T2 vang.","can_lam_sang":"CT sọ không xuất huyết, phù não nhẹ vùng sau. Điện tim dày thất trái. Creatinin 142 µmol/L, protein niệu 2+. X-quang ngực xung huyết nhẹ. Troponin siêu nhạy không tăng.","tom_tat":"Nam 49 tuổi tăng huyết áp ngưng thuốc, huyết áp 232/128 mmHg kèm đau đầu, nôn, nhìn mờ, lú lẫn, phù gai thị, suy thận cấp nhẹ, CT sọ không xuất huyết: biểu hiện của tăng huyết áp cấp cứu có bệnh não tăng huyết áp.","dat_van_de":"1) Huyết áp tăng rất cao. 2) Rối loạn tri giác, phù gai thị. 3) Tổn thương thận. 4) Cần loại trừ xuất huyết não và hội chứng vành cấp. 5) Hạ áp có kiểm soát và tìm nguyên nhân.","chan_doan_so_bo":"Cấp cứu tăng huyết áp, bệnh não tăng huyết áp, tổn thương thận.","bien_luan":"Điểm phân loại then chốt là có hay không tổn thương cơ quan đích mới. Ở đây huyết áp 232/128 kèm đau đầu, nôn, rối loạn tri giác, phù gai thị và xuất huyết võng mạc, creatinin tăng và protein niệu, nên đây là tăng huyết áp cấp cứu chứ không phải cơn tăng huyết áp không triệu chứng. Bệnh não tăng huyết áp xảy ra khi huyết áp vượt khả năng tự điều hòa của tuần hoàn não, gây tăng tưới máu và phù não, thường vùng sau. CT sọ không xuất huyết nên xuất huyết não ít nghĩ; không dấu màng não nên viêm màng não ít nghĩ. Troponin bình thường và điện tim không ST chênh nên chưa có nhồi máu cơ tim, X-quang xung huyết nhẹ cho thấy ngưỡng nguy cơ suy tim. Nguyên nhân là ngưng thuốc đột ngột trên nền tăng huyết áp nhiều năm, nhưng cần rà soát nguyên nhân thứ phát vì tổn thương thận và tuổi 49.","sinh_ly_benh":"Khi huyết áp vượt giới hạn tự điều hòa, mạch máu não mất co thắt bảo vệ, hàng rào máu não bị phá vỡ, gây phù não và tăng áp lực nội sọ. Tăng huyết áp cấp làm hoại tử dạng fibrin ở tiểu động mạch, gây thiếu máu cơ quan đích (thận, võng mạc) và có thể kích hoạt hệ renin–angiotensin, tạo vòng xoắn bệnh lý nên cần hạ áp có kiểm soát.","chan_doan_phan_biet":"Xuất huyết não; nhồi máu não; viêm màng não; u tủy thượng thận; tiền sản giật (không áp dụng); hội chứng vành cấp; phù phổi cấp; bóc tách động mạch chủ. CT sọ và khám lâm sàng giúp loại trừ.","chan_doan_xac_dinh":"Cấp cứu tăng huyết áp với bệnh não tăng huyết áp; bệnh thận do tăng huyết áp nghi ngờ; tăng huyết áp mạn không tuân thủ điều trị.","dieu_tri":"Nhập hồi sức; nicardipin 5 mg/giờ tăng 2,5 mg mỗi 5–15 phút (tối đa 15 mg/giờ) hoặc labetalol tĩnh mạch; mục tiêu giảm huyết áp trung bình không quá 25% trong giờ đầu, sau đó 160/100 mmHg trong 2–6 giờ, rồi dần về bình thường trong 24–48 giờ; chuyển thuốc uống sớm; theo dõi tri giác, nước tiểu, chức năng thận; tránh nifedipin ngậm.","tien_luong":"Tốt nếu hạ áp kiểm soát, hồi phục tri giác trong 24–48 giờ; nguy cơ tổn thương thận mạn và tái phát nếu không tuân thủ.","du_phong":"Giáo dục tuân thủ thuốc, đo huyết áp tại nhà, phối hợp thuốc viên đơn liều cố định; giảm muối, bỏ thuốc lá, hạn chế rượu; tầm soát nguyên nhân thứ phát và biến chứng thận; hẹn tái khám 1–2 tuần."},"nguon":["Hướng dẫn chẩn đoán và điều trị tăng huyết áp, Bộ Y tế Việt Nam, 2010 và cập nhật Hội Tim mạch học Việt Nam 2022.","2018 ESC/ESH Guidelines for the management of arterial hypertension, Eur Heart J 2018.","Giáo trình Nội khoa, Bộ môn Nội, Trường Đại học Y Hà Nội, phần Tăng huyết áp."],"status":"nhap"},{"id":"noi-tim-mach-004","title":"Khó thở dữ dội về đêm, khạc bọt hồng ở người nhồi máu cơ tim cũ","kind":"Nội","level":"Trung bình","group":"noi","name":"Ông P. V. D. (mô phỏng)","age":72,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Ông được đưa vào cấp cứu lúc 2 giờ sáng vì khó thở dữ dội phải ngồi dậy, khạc đờm bọt hồng.","vitals":{"hr":114,"sbp":158,"dbp":96,"rr":34,"t":37.1,"spo2":84},"ask":[["Khó thở bắt đầu thế nào, có phải ngồi dậy mới thở được không?","Đang ngủ thì tỉnh dậy vì ngộp, phải ngồi thẳng, khó thở tăng nhanh trong 1 giờ; những ngày qua phải kê ba gối.","e"],["Có khạc bọt hồng, ho, đau ngực, hồi hộp không?","Ho khạc bọt hồng loãng, hồi hộp, không đau ngực dữ dội.","e"],["Tiền sử bệnh tim, nhồi máu cơ tim, tăng huyết áp, đái tháo đường?","Nhồi máu cơ tim cách đây 5 năm, EF 35%; tăng huyết áp; đái tháo đường típ 2.","e"],["Thuốc đang dùng và tuân thủ ra sao?","Có furosemid, enalapril, bisoprolol nhưng hai tuần nay ngưng thuốc lợi tiểu vì sợ tiểu nhiều.","e"],["Gần đây có ăn mặn, tiệc, uống nhiều nước, nhiễm trùng, dùng thuốc giảm đau chống viêm không?","Ăn tiệc cưới nhiều muối ba ngày trước; có uống thuốc giảm đau vì đau lưng; không sốt.","e"],["Có phù chân, tăng cân, tiểu ít không?","Phù hai chân, tăng 3 kg trong 10 ngày, tiểu ít.","e"],["Có sốt, ho đờm mủ, đau ngực kiểu màng phổi không?","Không sốt, không đờm mủ.","n"]],"exam":[["K","Hô hấp","Thở nhanh 34 l/p, co kéo cơ hô hấp phụ, ran ẩm dâng đầy từ đáy lên quá nửa hai phổi, vài ran rít.","e"],["K","Tim","Nhịp nhanh 114 l/p, T3 ngựa phi, tiếng thổi tâm thu mỏm 2/6; tĩnh mạch cổ nổi.","e"],["K","Phù và gan","Phù mềm hai chân đến gối, gan to 2 cm dưới bờ sườn, phản hồi gan–tĩnh mạch cổ dương tính.","e"],["K","Tưới máu","Da ẩm, chi ấm, thời gian làm đầy mao mạch 2 giây, huyết áp 158/96 mmHg (type ấm–ướt).","e"],["K","Thần kinh","Tỉnh, kích thích, nói ngắt quãng.","n"]],"tests":[["SpO2 liên tục và khí máu động mạch",10,"SpO2 84% khí trời; pH 7,36, PaO2 54, PaCO2 38, lactate 1,8 mmol/L.","e"],["Điện tim",10,"Nhịp xoang nhanh 114 l/p, sóng Q cũ V1–V4, block nhánh trái không hoàn toàn; không ST chênh lên mới.","e"],["NT-proBNP, troponin siêu nhạy",10,"NT-proBNP 8200 pg/mL (tham chiếu dưới 300); hs-troponin 52 ng/L hơi tăng, ổn định trong ba giờ.","e"],["X-quang ngực thẳng",10,"Bóng tim to, phổi mờ dạng cánh bướm hai bên, đường Kerley B, tràn dịch màng phổi nhỏ hai bên.","e"],["Siêu âm tim tại giường",15,"EF 28%, thất trái giãn, vận động kém vùng trước vách, hở hai lá mức vừa, IVC giãn.","e"],["Creatinin, điện giải",10,"Creatinin 128 µmol/L, K 4,4, Na 133 mmol/L.","e"],["CT ngực cản quang khẩn để xác định mọi ca khó thở cấp",40,"Không cần thiết, làm chậm xử trí khi lâm sàng và X-quang đã chẩn đoán phù phổi.","w"]],"opt":{"ydx":["Đợt cấp COPD","Hen tim hoàn toàn do bệnh phổi","Thuyên tắc phổi cấp","+Suy tim cấp mất bù, phù phổi cấp huyết động (type ướt–ấm), bệnh tim thiếu máu cục bộ"],"xu_tri_ban_dau":["+Ngồi thẳng, oxy hoặc CPAP/NIV, furosemid tĩnh mạch 40–80 mg và nitrat tĩnh mạch khi huyết áp tâm thu trên 110 mmHg","Truyền dịch nhanh 1000 ml muối đẳng trương","Dùng chẹn beta tĩnh mạch liều cao","Chỉ dùng thuốc an thần mạnh để ngủ"],"thuoc_tranh":["Morphin cho mọi người bệnh phù phổi cấp","+Tránh morphin thường quy, tránh truyền dịch nhiều và NSAID; không dùng chẹn beta tĩnh mạch khi đang phù phổi","NSAID để giảm đau lưng","Truyền dịch tăng thể tích để nâng huyết áp"],"tim_yeu_to_thuc_day":["Chỉ cần điều trị triệu chứng, không cần tìm nguyên nhân","Chỉ xét nghiệm vi sinh đờm","+Rà soát yếu tố thúc đẩy: ngưng lợi tiểu, ăn mặn, NSAID, thiếu máu cơ tim, rối loạn nhịp, nhiễm trùng","Chỉ siêu âm bụng"]},"actions":["++Ngồi đầu cao, gắn monitor, thở oxy hoặc CPAP/NIV để đạt SpO2 trên 94%|2|Giảm công thở, giảm tiền tải và cải thiện oxy máu.","++Furosemid 40–80 mg tiêm tĩnh mạch và nitroglycerin tĩnh mạch chỉnh liều theo huyết áp|2|Giảm tiền tải, giảm xung huyết phổi nhanh khi huyết áp còn cao.","++Thông tiểu hoặc theo dõi nước tiểu, theo dõi điện giải, creatinin sau lợi tiểu|2|Đánh giá đáp ứng lợi tiểu (đủ trên 100–150 ml/giờ ở 6 giờ đầu).","++Tìm yếu tố thúc đẩy: điện tim, troponin, siêu âm tim, hỏi về ngưng thuốc và NSAID|2|Điều chỉnh nguyên nhân làm mất bù.","-Dùng morphin tiêm tĩnh mạch để giảm khó thở|1|Không thường quy, có thể gây ức chế hô hấp, tăng nhu cầu thở máy.","!Truyền nhanh dịch muối đẳng trương để nâng huyết áp|0|Huyết áp cao, phổi đã ngập nước, truyền dịch làm nặng thêm.","!Cho thuốc giảm đau NSAID cho đau lưng|0|NSAID giữ nước, muối và làm nặng suy tim."],"teach":"Phù phổi cấp ở người suy tim thường do mất bù với tăng tiền tải: ưu tiên oxy hoặc thông khí hỗ trợ, lợi tiểu quai và nitrat tĩnh mạch nếu huyết áp cho phép. Cần tìm yếu tố thúc đẩy như ngưng lợi tiểu, NSAID, thiếu máu cơ tim.","hbu":{"hanh_chinh":"Ông P. V. D. (mô phỏng), nam, 72 tuổi, hưu trí; vào cấp cứu lúc 2 giờ sáng.","ly_do_vao_vien":"Khó thở dữ dội, ngồi dậy, khạc bọt hồng.","benh_su":"Ông đã có nhồi máu cơ tim cách đây 5 năm, EF 35%. Hai tuần nay ngưng thuốc lợi tiểu, ăn tiệc nhiều muối, uống thuốc giảm đau vì đau lưng. Tăng 3 kg, phù hai chân, kê ba gối khi ngủ. Đêm nay đột ngột tỉnh dậy vì ngộp, ngồi thẳng, ho khạc bọt hồng, hồi hộp. Không sốt, không đau ngực dữ dội.","tien_su":"Nhồi máu cơ tim 5 năm trước, EF 35%; tăng huyết áp; đái tháo đường típ 2; đang dùng furosemid, enalapril, bisoprolol (ngưng lợi tiểu 2 tuần). Dùng thuốc giảm đau không steroid gần đây.","luoc_qua_co_quan":"Tiểu ít, không tiểu buốt; không tiêu chảy; không sốt; không đau ngực kiểu màng phổi.","kham_hien_tai":"Kích thích, ngồi, thở nhanh 34 l/p co kéo; mạch 114 l/p, huyết áp 158/96 mmHg, nhiệt 37,1 độ C, SpO2 84% khí trời. Ran ẩm dâng đầy quá nửa hai phổi, T3, thổi mỏm, tĩnh mạch cổ nổi, gan to, phù chân; chi ấm.","can_lam_sang":"Khí máu pH 7,36, PaO2 54, PaCO2 38, lactate 1,8. NT-proBNP 8200 pg/mL; hs-troponin hơi tăng ổn định. X-quang: cánh bướm, Kerley B, tràn dịch màng phổi nhỏ. Siêu âm tim: EF 28%, hở hai lá vừa. Creatinin 128.","tom_tat":"Nam 72 tuổi tiền sử nhồi máu cơ tim và EF giảm, ngưng lợi tiểu và ăn mặn, khó thở cấp dữ dội, ran ẩm khắp phổi, T3, tĩnh mạch cổ nổi, SpO2 84%, NT-proBNP rất cao, X-quang phù phổi; huyết áp cao, chi ấm (ướt–ấm).","dat_van_de":"1) Suy hô hấp giảm oxy máu. 2) Phù phổi cấp huyết động. 3) Suy tim EF giảm mất bù. 4) Yếu tố thúc đẩy. 5) Nguy cơ hội chứng vành cấp và tổn thương thận.","chan_doan_so_bo":"Suy tim cấp mất bù với phù phổi cấp, type ướt–ấm, suy tim EF giảm do bệnh tim thiếu máu cục bộ.","bien_luan":"Khó thở khi nằm, khó thở kịch phát về đêm kèm ran ẩm dâng đầy hai phổi, T3 ngựa phi, tĩnh mạch cổ nổi, phù và gan to, phối hợp NT-proBNP rất cao, X-quang cánh bướm với Kerley B và siêu âm EF 28% khẳng định suy tim cấp với phù phổi. Phân loại huyết động theo tưới máu và xung huyết: da ấm, huyết áp cao, mao mạch tốt nên thuộc ướt–ấm, nên ưu tiên lợi tiểu và giãn mạch thay vì tăng co bóp. Yếu tố thúc đẩy rõ: ngưng lợi tiểu, nhiều muối, NSAID; cần loại trừ hội chứng vành cấp (troponin tăng nhẹ ổn định, không ST chênh mới) và rối loạn nhịp. Đợt cấp COPD ít nghĩ vì không tiền sử bệnh phổi, PaCO2 bình thường; thuyên tắc phổi ít nghĩ vì có chứng cứ xung huyết phổi rõ.","sinh_ly_benh":"Suy giảm co bóp thất trái làm tăng áp lực cuối tâm trương, áp lực mao mạch phổi vượt áp lực keo, dịch thoát vào phế nang gây phù phổi, giảm trao đổi khí và thiếu oxy máu. Tăng hoạt hệ thần kinh giao cảm và renin–angiotensin–aldosteron gây giữ muối nước, co mạch, tăng hậu tải, nhịp nhanh. Muối, nước, NSAID làm tăng tiền tải và hậu tải, phá vỡ cân bằng.","chan_doan_phan_biet":"Đợt cấp COPD; hen phế quản nặng; thuyên tắc phổi; viêm phổi nặng; hội chứng vành cấp có suy tim; tổn thương phổi cấp không do tim.","chan_doan_xac_dinh":"Suy tim cấp mất bù (phù phổi cấp), suy tim EF giảm, bệnh tim thiếu máu cục bộ cũ, tăng huyết áp, đái tháo đường típ 2.","dieu_tri":"Tư thế ngồi, oxy duy trì SpO2 94% hoặc CPAP/NIV nếu suy hô hấp; furosemid 40–80 mg tĩnh mạch (gấp 1–2,5 lần liều uống hàng ngày), nitroglycerin tĩnh mạch khi huyết áp tâm thu trên 110 mmHg; theo dõi nước tiểu, điện giải; tránh dịch truyền, NSAID, chẹn beta tĩnh mạch; sau ổn định tối ưu liệu pháp bốn nhóm thuốc (chẹn beta, ức chế men chuyển/ARNI, kháng aldosteron, SGLT2) và cân nhắc tái tưới máu, ICD theo EF.","tien_luong":"Dè dặt; nguy cơ tái nhập viện cao; cải thiện nếu tuân thủ thuốc, hạn chế muối.","du_phong":"Tuân thủ thuốc, cân nặng hằng ngày, hạn chế muối dưới 5 g và nước, tránh NSAID, tiêm vắc xin cúm phế cầu; tái khám sớm trong 7–14 ngày; chương trình quản lý suy tim."},"nguon":["Hướng dẫn chẩn đoán và điều trị suy tim, Bộ Y tế Việt Nam, 2020.","2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure, Eur Heart J 2021.","Giáo trình Nội khoa, Bộ môn Nội, Trường Đại học Y Dược TPHCM, phần Suy tim."],"status":"nhap"},{"id":"noi-tim-mach-005","title":"Hồi hộp, tim đập không đều 2 ngày, mạch 148 lần/phút","kind":"Nội","level":"Trung bình","group":"noi","name":"Bà H. T. L. (mô phỏng)","age":66,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Bà đến cấp cứu vì hồi hộp, đánh trống ngực và mệt hai ngày, huyết động còn ổn định.","vitals":{"hr":148,"sbp":118,"dbp":72,"rr":20,"t":36.9,"spo2":97},"ask":[["Hồi hộp bắt đầu khi nào, liên tục hay từng cơn, tim đập đều hay không?","Bắt đầu cách đây khoảng 2 ngày, lúc 8 giờ sáng, đập loạn xạ liên tục, không đều.","e"],["Có đau ngực, khó thở, choáng, ngất không?","Hơi khó thở khi đi lại, choáng nhẹ; không đau ngực, không ngất.","e"],["Tiền sử tăng huyết áp, đái tháo đường, bệnh tim, đột quỵ?","Tăng huyết áp 10 năm dùng amlodipin; không đái tháo đường; không bệnh van tim, không đột quỵ.","e"],["Có dấu hiệu cường giáp, sụt cân, run tay, nóng sợ nóng không?","Không sụt cân, không run tay, không sợ nóng.","e"],["Uống rượu, cà phê, thuốc kích thích, thuốc cảm, thuốc lá không?","Không uống rượu; 2 ly cà phê mỗi sáng; không hút thuốc.","e"],["Có sốt, ho, nhiễm trùng gần đây không?","Không sốt, không ho.","e"],["Có đang dùng thuốc chống đông hoặc có tiền sử xuất huyết không?","Không dùng thuốc chống đông; chưa từng xuất huyết lớn.","e"],["Sinh hoạt hằng ngày?","Còn tự đi lại và làm việc nhà.","n"]],"exam":[["K","Mạch và nhịp tim","Nhịp tim hoàn toàn không đều, tần số thất 148 l/p, mạch quay thấp hơn nhịp tim (hụt mạch).","e"],["K","Huyết động","Huyết áp 118/72 mmHg, chi ấm, tỉnh, không dấu hiệu sốc.","e"],["K","Phổi và tĩnh mạch cổ","Phổi không ran, tĩnh mạch cổ không nổi, không phù.","e"],["K","Tim: tiếng thổi","Không tiếng thổi van đáng kể; T1 thay đổi cường độ.","e"],["K","Tuyến giáp","Không to, không rung miu, mắt không lồi.","n"]],"tests":[["Điện tâm đồ 12 chuyển đạo",10,"Nhịp không đều hoàn toàn, không có sóng P, sóng f nhỏ, QRS hẹp 148 l/p; không ST chênh lên.","e"],["TSH, FT4, điện giải, creatinin, công thức máu, đường huyết",10,"TSH 1,8 mU/L bình thường, K 4,0, Mg 0,85 mmol/L, creatinin 78 µmol/L, Hb 128 g/L.","e"],["Siêu âm tim qua thành ngực",15,"EF 56%, nhĩ trái 44 mm, không bệnh van trung bình–nặng, không huyết khối thấy được trên siêu âm qua thành ngực.","e"],["Troponin siêu nhạy",10,"12 ng/L, không tăng.","e"],["X-quang ngực",10,"Bóng tim bình thường, phổi không xung huyết.","n"],["Sốc điện chuyển nhịp ngay không chuẩn bị chống đông dù huyết động ổn định",10,"Không có chỉ định; rung nhĩ trên 48 giờ cần chống đông trước hoặc TEE loại trừ huyết khối.","w"]],"opt":{"ydx":["+Rung nhĩ không do bệnh van tim, đáp ứng thất nhanh, huyết động ổn định","Cơn nhịp nhanh trên thất do vòng vào lại","Cuồng nhĩ 2:1","Nhịp nhanh thất"],"kiem_soat_nhip":["Sốc điện ngay vì nhịp nhanh","+Kiểm soát tần số thất bằng thuốc chẹn beta hoặc diltiazem (khi EF bảo tồn), mục tiêu dưới 110 lần/phút lúc nghỉ trước","Dùng amiodaron liều cao kéo dài ngay mà không chống đông","Chỉ truyền dịch"],"chong_dong":["Chỉ dùng aspirin vì rung nhĩ không nguy cơ","Không cần chống đông vì huyết áp bình thường","+Chống đông đường uống dài hạn vì CHA2DS2-VASc 3 điểm; ưu tiên thuốc chống đông đường uống không đối kháng vitamin K","Chỉ chống đông trong vài ngày rồi ngưng"],"chuyen_nhip":["Chuyển nhịp ngay bằng sốc điện không cần chuẩn bị","Chuyển nhịp bằng thuốc đường tĩnh mạch ngay","Không bao giờ chuyển nhịp","+Khởi phát trên 48 giờ hoặc không rõ: chỉ chuyển nhịp sau ít nhất 3 tuần chống đông hoặc có TEE loại trừ huyết khối nhĩ trái"]},"actions":["++Monitor điện tim, đường truyền, đánh giá huyết động và điện tim 12 chuyển đạo|2|Xác nhận rung nhĩ, loại trừ rối loạn nhịp khác và đánh giá có bất ổn huyết động hay không.","++Kiểm soát tần số bằng diltiazem hoặc metoprolol tĩnh mạch/uống, chỉnh theo huyết áp|2|EF bảo tồn, huyết động ổn định nên giảm tần số thất là ưu tiên.","+Xét nghiệm TSH, điện giải, siêu âm tim, tính CHA2DS2-VASc|2|Tìm nguyên nhân và quyết định chống đông dài hạn.","+Bắt đầu chống đông (ví dụ rivaroxaban hoặc apixaban hoặc heparin trọng lượng phân tử thấp rồi chuyển)|2|CHA2DS2-VASc 3 điểm (tuổi 65–74, nữ, tăng huyết áp) chỉ định chống đông.","-Dùng digoxin làm thuốc đầu tay duy nhất|1|Tác dụng chậm, kiểm soát tần số khi gắng sức kém; để dành cho suy tim hoặc hạ huyết áp.","!Sốc điện chuyển nhịp ngay khi chưa chống đông|0|Rung nhĩ kéo dài trên 48 giờ có thể có huyết khối nhĩ trái, nguy cơ đột quỵ.","!Dùng verapamil tĩnh mạch kết hợp chẹn beta tĩnh mạch đồng thời|0|Phối hợp có nguy cơ ngừng xoang, block nhĩ thất."],"teach":"Rung nhĩ có đáp ứng thất nhanh và huyết động ổn định: ưu tiên kiểm soát tần số, đánh giá nguy cơ đột quỵ bằng CHA2DS2-VASc và chống đông; không chuyển nhịp vội khi khởi phát hơn 48 giờ nếu chưa an toàn.","hbu":{"hanh_chinh":"Bà H. T. L. (mô phỏng), nữ, 66 tuổi, hưu trí; đến cấp cứu.","ly_do_vao_vien":"Hồi hộp, đánh trống ngực hai ngày.","benh_su":"Hai ngày nay bà hồi hộp liên tục, tim đập loạn xạ, mệt, khó thở nhẹ khi đi lại và choáng nhẹ. Không đau ngực, không ngất, không sốt, không sụt cân, không run tay. Hai ly cà phê mỗi sáng. Không dùng chống đông.","tien_su":"Tăng huyết áp 10 năm (amlodipin). Không đái tháo đường, không bệnh van tim, không đột quỵ hay xuất huyết lớn. Không hút thuốc, không rượu.","luoc_qua_co_quan":"Không ho, không sốt; không sụt cân, không tiêu chảy; tiểu bình thường; không yếu liệt hay nói khó thoáng qua.","kham_hien_tai":"Tỉnh, mạch 148 l/p không đều, huyết áp 118/72 mmHg, nhịp thở 20 l/p, SpO2 97%, nhiệt độ 36,9 độ C; tim loạn nhịp hoàn toàn, không tiếng thổi; phổi không ran; không phù; tuyến giáp bình thường.","can_lam_sang":"Điện tim: rung nhĩ đáp ứng thất nhanh, QRS hẹp. TSH 1,8; K 4,0; Mg 0,85; creatinin 78. Siêu âm tim EF 56%, nhĩ trái 44 mm, không bệnh van nặng. Troponin 12 ng/L.","tom_tat":"Nữ 66 tuổi tăng huyết áp, hồi hộp hai ngày; mạch 148 l/p không đều, hụt mạch; điện tim rung nhĩ QRS hẹp; huyết động ổn định, EF bảo tồn, TSH bình thường; CHA2DS2-VASc 3 điểm.","dat_van_de":"1) Rối loạn nhịp nhanh không đều. 2) Rung nhĩ khởi phát khoảng 48 giờ. 3) Kiểm soát tần số. 4) Nguy cơ đột quỵ, chỉ định chống đông. 5) Tìm nguyên nhân và yếu tố thúc đẩy.","chan_doan_so_bo":"Rung nhĩ không do bệnh van, mới phát hiện, đáp ứng thất nhanh, huyết động ổn định.","bien_luan":"Tim đập loạn xạ khởi phát đột ngột, mạch không đều hoàn toàn, hụt mạch (mạch quay chậm hơn nhịp tim), điện tim không có sóng P, nền dao động và RR không đều gợi chẩn đoán rung nhĩ. QRS hẹp nên đáp ứng thất qua nút nhĩ thất, loại nhịp nhanh thất. Huyết động ổn định (huyết áp 118/72, tỉnh, chi ấm) nên chưa có chỉ định sốc điện cấp cứu. Siêu âm cho thấy EF 56% và nhĩ trái 44 mm, không bệnh van trung bình–nặng, nên là rung nhĩ không do bệnh van; vì vậy dùng thuốc chống đông đường uống không đối kháng vitamin K được. Nguyên nhân/yếu tố thúc đẩy: tăng huyết áp mạn là nguyên nhân thường gặp; TSH bình thường loại trừ cường giáp; điện giải bình thường. Tính CHA2DS2-VASc: tuổi 65–74 (1), nữ (1), tăng huyết áp (1) tổng 3 điểm, chỉ định chống đông. Vì thời điểm khởi phát khoảng 48 giờ, không đảm bảo an toàn để chuyển nhịp ngay.","sinh_ly_benh":"Rung nhĩ do nhiều vòng vào lại nhỏ và ổ phát xung ngoài tử cung (thường từ tĩnh mạch phổi) trên nền nhĩ tái cấu trúc do tăng huyết áp. Nhĩ co bóp mất phối hợp làm giảm đổ đầy thất, thất đáp ứng nhanh và không đều làm giảm cung lượng, gây hồi hộp, khó thở. Ứ trệ máu trong tiểu nhĩ trái gây huyết khối, gây thuyên tắc hệ thống như đột quỵ.","chan_doan_phan_biet":"Cuồng nhĩ dẫn truyền thay đổi; nhịp nhanh nhĩ đa ổ; nhịp nhanh trên thất vòng vào lại; ngoại tâm thu nhĩ dày; cường giáp gây rung nhĩ.","chan_doan_xac_dinh":"Rung nhĩ không do bệnh van tim, mới phát hiện, đáp ứng thất nhanh; tăng huyết áp mạn; CHA2DS2-VASc 3 điểm.","dieu_tri":"Kiểm soát tần số: diltiazem hoặc metoprolol (tĩnh mạch rồi uống), mục tiêu dưới 110 l/p lúc nghỉ, chặt hơn nếu còn triệu chứng; khởi đầu chống đông (apixaban 5 mg x 2 hoặc rivaroxaban 20 mg, hoặc enoxaparin chuyển tiếp) và duy trì dài hạn; tối ưu huyết áp. Chuyển nhịp chọn lọc sau 3 tuần chống đông hoặc TEE loại trừ huyết khối; bất ổn huyết động thì sốc điện đồng bộ cấp cứu.","tien_luong":"Tốt nếu kiểm soát tần số và chống đông tốt; nguy cơ tái phát và đột quỵ nếu không tuân thủ.","du_phong":"Chống đông liên tục; kiểm soát huyết áp, cân nặng, rượu và giấc ngủ; theo dõi chức năng thận và chảy máu; tái khám tim mạch, cân nhắc kiểm soát nhịp hoặc triệt đốt nếu có triệu chứng."},"nguon":["2020 ESC Guidelines for the diagnosis and management of atrial fibrillation, Eur Heart J 2021.","Khuyến cáo về chẩn đoán và điều trị rung nhĩ, Hội Tim mạch học Việt Nam, bản cập nhật.","Giáo trình Nội khoa, Bộ môn Nội, Trường Đại học Y Hà Nội, phần Rối loạn nhịp tim."],"status":"nhap"},{"id":"noi-tim-mach-006","title":"Tăng huyết áp mạn cần lập kế hoạch điều trị ngoại trú","kind":"Nội","level":"Dễ","group":"noi","name":"Ông Đ. M. K. (mô phỏng)","age":54,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Ông đến phòng khám vì đo huyết áp tại cơ quan nhiều lần cao, không triệu chứng.","vitals":{"hr":78,"sbp":158,"dbp":98,"rr":16,"t":36.7,"spo2":98},"ask":[["Huyết áp được phát hiện khi nào, đo thế nào, mức bao nhiêu?","Hai tháng nay đo tại cơ quan 150–165/92–100 mmHg; chưa uống thuốc.","e"],["Có đau đầu, chóng mặt, hồi hộp, đau ngực, khó thở không?","Thỉnh thoảng nặng đầu buổi sáng; không đau ngực, không khó thở, không hồi hộp.","e"],["Có triệu chứng gợi ý nguyên nhân thứ phát như ngáy ngưng thở, đánh trống ngực từng cơn, yếu cơ, tiểu đêm nhiều?","Ngáy to, đôi khi ngủ gật ban ngày; không có cơn đỏ bừng mặt, không yếu cơ.","e"],["Tiền sử đái tháo đường, rối loạn lipid, bệnh thận, đột quỵ, bệnh tim?","Rối loạn lipid phát hiện năm ngoái chưa điều trị; không đái tháo đường, không bệnh thận.","e"],["Gia đình có ai tăng huyết áp, đột quỵ, bệnh mạch vành không?","Cha bị tăng huyết áp và đột quỵ ở 65 tuổi.","e"],["Lối sống: muối, rượu, thuốc lá, vận động?","Ăn mặn, uống bia 3–4 lon cuối tuần, hút nửa gói mỗi ngày, ít vận động.","e"],["Đang dùng thuốc nào làm tăng huyết áp (NSAID, thuốc cảm, corticoid, thuốc ngừa thai)?","Thỉnh thoảng uống thuốc giảm đau chống viêm vì đau lưng.","e"],["Nghề nghiệp?","Nhân viên văn phòng, hay thức khuya.","n"]],"exam":[["K","Đo huyết áp đúng quy trình","Hai tay, ngồi nghỉ 5 phút: tay phải 158/98 và 156/96 mmHg; chênh hai tay dưới 10 mmHg.","e"],["K","Nhân trắc","BMI 29,5 kg/m2; vòng bụng 98 cm.","e"],["K","Tim phổi","Tim đều, T2 mạnh ở ổ chủ, không tiếng thổi; phổi trong.","e"],["K","Đáy mắt, thần kinh","Đáy mắt có hẹp tiểu động mạch độ I; thần kinh bình thường.","e"],["K","Bụng, mạch đùi","Không âm thổi vùng bụng, mạch đùi bắt rõ, không phù.","e"]],"tests":[["Đo huyết áp lưu động 24 giờ hoặc đo tại nhà để xác nhận",10,"Trung bình 24 giờ 148/92 mmHg, ban ngày 152/95, ban đêm 138/84: xác nhận tăng huyết áp.","e"],["Creatinin, eGFR, điện giải, glucose, HbA1c, lipid máu, acid uric",10,"Creatinin 86 µmol/L, eGFR 96, K 4,2 mmol/L, glucose 5,6 mmol/L, HbA1c 5,7%, LDL-C 3,8 mmol/L, TG 2,3 mmol/L.","e"],["Tổng phân tích nước tiểu và tỉ lệ albumin/creatinin niệu",10,"Không có protein; ACR 18 mg/g (bình thường dưới 30).","e"],["Điện tim",10,"Nhịp xoang 78 l/p, dày thất trái nhẹ theo chỉ số Sokolow-Lyon 36 mm.","e"],["Siêu âm tim",15,"EF 62%, dày vách liên thất 12 mm, rối loạn tâm trương độ I.","e"],["MRI mạch thận và CT bụng chụp mạch ngay cho mọi người bệnh tăng huyết áp mới",40,"Không có chỉ định thường quy khi không có dấu hiệu gợi ý nguyên nhân thứ phát.","w"]],"opt":{"ydx":["Tăng huyết áp áo choàng trắng đơn thuần","+Tăng huyết áp nguyên phát độ 2 có nguy cơ tim mạch cao (có tổn thương cơ quan đích)","Tăng huyết áp thứ phát do hẹp động mạch thận","Cơn tăng huyết áp cấp cứu"],"khoi_dau_thuoc":["Chỉ chẹn beta liều thấp làm thuốc đầu tay","Chỉ thay đổi lối sống 6 tháng rồi mới dùng thuốc","+Phối hợp thuốc ức chế men chuyển hoặc chẹn thụ thể với chẹn kênh calci (viên phối hợp liều cố định) kèm thay đổi lối sống","Nifedipin ngậm dưới lưỡi khi cần"],"muc_tieu":["Dưới 160/100 mmHg","Dưới 150/90 mmHg ở mọi người bệnh","Càng thấp càng tốt, kể cả dưới 100/60","+Mục tiêu huyết áp dưới 130/80 mmHg (không dưới 120/70) nếu dung nạp"],"tai_kham":["+Tái đánh giá sau 2–4 tuần để chỉnh thuốc, kiểm tra creatinin, kali sau khi dùng thuốc ức chế men chuyển/chẹn thụ thể","Tái khám sau 6 tháng","Chỉ tái khám khi đau đầu","Không cần tái khám"]},"actions":["++Xác nhận chẩn đoán bằng đo tại nhà hoặc lưu động và đánh giá nguy cơ tim mạch toàn bộ|2|Phân biệt tăng huyết áp thật với áo choàng trắng và định mức nguy cơ.","++Bắt đầu phối hợp thuốc liều cố định (ức chế men chuyển hoặc chẹn thụ thể + chẹn kênh calci) và tư vấn lối sống|2|Phối hợp sớm tăng khả năng đạt mục tiêu và tuân thủ.","+Xét nghiệm creatinin, kali, lipid, đường huyết, nước tiểu, điện tim, siêu âm tim|2|Tìm tổn thương cơ quan đích và bệnh đi kèm.","+Chỉ định statin theo nguy cơ và khám chuyên khoa giấc ngủ|2|LDL-C 3,8 mmol/L và ngáy to nghi ngưng thở khi ngủ, yếu tố làm tăng huyết áp.","-Làm MRI mạch thận ngay|1|Chưa có dấu hiệu gợi ý nguyên nhân thứ phát; đắt và không cần.","!Dùng NSAID kéo dài cho đau lưng|0|NSAID làm tăng huyết áp, giữ muối nước, hại thận.","!Ngậm nifedipin ngắn để hạ nhanh về bình thường|0|Hạ áp quá nhanh không cần thiết, gây thiếu máu cơ quan."],"teach":"Tăng huyết áp mạn cần xác nhận bằng đo ngoài phòng khám, đánh giá nguy cơ và tổn thương cơ quan đích, bắt đầu phối hợp thuốc đúng nhóm cùng thay đổi lối sống, và hẹn tái khám chỉnh liều.","hbu":{"hanh_chinh":"Ông Đ. M. K. (mô phỏng), nam, 54 tuổi, nhân viên văn phòng; khám ngoại trú.","ly_do_vao_vien":"Huyết áp cao khi đo tại cơ quan, không triệu chứng.","benh_su":"Hai tháng nay ông đo huyết áp nhiều lần 150–165/92–100 mmHg, chưa điều trị. Thỉnh thoảng nặng đầu buổi sáng, ngáy to và ngủ gật ban ngày. Không đau ngực, không khó thở, không hồi hộp từng cơn, không yếu cơ. Thỉnh thoảng dùng thuốc giảm đau chống viêm.","tien_su":"Rối loạn lipid máu phát hiện năm ngoái, chưa điều trị. Không đái tháo đường, không bệnh thận. Cha tăng huyết áp và đột quỵ lúc 65 tuổi. Hút nửa gói thuốc mỗi ngày, uống bia cuối tuần, ăn mặn, ít vận động.","luoc_qua_co_quan":"Không sụt cân; không tiểu đêm nhiều; không yếu cơ; không cơn đỏ bừng mặt; ngáy to.","kham_hien_tai":"Tỉnh, mạch 78 l/p, huyết áp 158/98 mmHg (ngồi, hai lần), nhịp thở 16 l/p, SpO2 98%. BMI 29,5, vòng bụng 98 cm. T2 mạnh, không tiếng thổi; phổi trong; đáy mắt hẹp tiểu động mạch độ I; không âm thổi bụng; không phù.","can_lam_sang":"Huyết áp lưu động 24 giờ trung bình 148/92. Creatinin 86, eGFR 96, K 4,2, HbA1c 5,7%, LDL-C 3,8, TG 2,3. ACR 18 mg/g. Điện tim dày thất trái nhẹ; siêu âm tim EF 62%, vách 12 mm, rối loạn tâm trương độ I.","tom_tat":"Nam 54 tuổi béo bụng, hút thuốc, rối loạn lipid, ăn mặn, huyết áp ngoài phòng khám và lưu động đều cao (trung bình 148/92), có dày thất trái nhẹ và rối loạn tâm trương, đáy mắt độ I; không dấu hiệu nguyên nhân thứ phát rõ; chức năng thận bình thường.","dat_van_de":"1) Tăng huyết áp độ 2 mới phát hiện. 2) Tổn thương cơ quan đích sớm (tim, mắt). 3) Nhiều yếu tố nguy cơ khác. 4) Ngáy to, nghi ngưng thở khi ngủ. 5) Lập kế hoạch điều trị và tái khám.","chan_doan_so_bo":"Tăng huyết áp nguyên phát độ 2, nguy cơ tim mạch cao; rối loạn lipid máu; thừa cân; nghi ngưng thở khi ngủ.","bien_luan":"Huyết áp phòng khám lặp lại từ 140/90 mmHg trở lên và được xác nhận bằng đo lưu động 24 giờ trung bình 148/92 (ngưỡng 130/80) nên loại trừ tăng huyết áp áo choàng trắng; phân độ 2 theo mức 160/100 gần ngưỡng. Không có triệu chứng cơn cấp cứu, nên điều trị ngoại trú. Tổn thương cơ quan đích sớm: dày thất trái trên điện tim và siêu âm, rối loạn tâm trương độ I, hẹp tiểu động mạch võng mạc; không có albumin niệu, eGFR bình thường. Chẩn đoán nguyên phát vì tuổi khởi phát trên 40, tiền sử gia đình, thừa cân và ăn mặn, không dấu gợi ý nguyên nhân thứ phát (kali bình thường, không âm thổi bụng, không cơn kịch phát). Tuy vậy ngáy to và buồn ngủ ban ngày nghi ngưng thở khi ngủ, cần đánh giá. Nguy cơ tim mạch cao do có tổn thương cơ quan đích, hút thuốc và rối loạn lipid; mục tiêu điều trị dưới 130/80 mmHg.","sinh_ly_benh":"Tăng huyết áp nguyên phát do tương tác giữa di truyền và môi trường: ăn mặn làm tăng thể tích, béo phì và kháng insulin kích hoạt hệ giao cảm và renin–angiotensin–aldosteron, tăng sức cản ngoại vi. Áp lực kéo dài gây phì đại thất trái, rối loạn chức năng tâm trương, tổn thương nội mô và xơ cứng động mạch, dẫn đến biến cố tim, não và thận.","chan_doan_phan_biet":"Tăng huyết áp áo choàng trắng; tăng huyết áp thứ phát (thận, hẹp động mạch thận, cường aldosteron, u tủy thượng thận, ngưng thở khi ngủ, thuốc); tăng huyết áp do NSAID.","chan_doan_xac_dinh":"Tăng huyết áp nguyên phát độ 2 có tổn thương cơ quan đích sớm; rối loạn lipid máu; thừa cân; nghi hội chứng ngưng thở khi ngủ tắc nghẽn.","dieu_tri":"Thay đổi lối sống: giảm muối dưới 5 g/ngày, giảm cân, bỏ thuốc lá, hạn chế rượu, vận động 150 phút/tuần. Thuốc: phối hợp liều cố định ức chế men chuyển hoặc chẹn thụ thể với chẹn kênh calci (ví dụ perindopril/amlodipin) và tăng dần, thêm lợi tiểu thiazide nếu chưa đạt; statin cường độ vừa–cao; dừng NSAID. Tái khám sau 2–4 tuần, kiểm tra creatinin và kali; đánh giá giấc ngủ.","tien_luong":"Tốt nếu đạt mục tiêu huyết áp và điều chỉnh yếu tố nguy cơ; nguy cơ đột quỵ, bệnh mạch vành, suy thận nếu không điều trị.","du_phong":"Tự đo huyết áp tại nhà, ghi nhật ký; tuân thủ thuốc; tầm soát bệnh thận, đường huyết hằng năm; tiêm vắc xin theo khuyến cáo; tư vấn bỏ thuốc lá; tái khám định kỳ 3–6 tháng khi ổn định."},"nguon":["Hướng dẫn chẩn đoán và điều trị tăng huyết áp, Bộ Y tế Việt Nam, 2010.","Khuyến cáo của Hội Tim mạch học Việt Nam về chẩn đoán và điều trị tăng huyết áp, 2022.","2018 ESC/ESH Guidelines for the management of arterial hypertension, Eur Heart J 2018."],"status":"nhap"},{"id":"noi-ho-hap-001","title":"Khó thở nặng, khò khè, nói từng từ ở người bị hen","kind":"Nội","level":"Trung bình","group":"noi","name":"Bà V. T. N. (mô phỏng)","age":28,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Bà được đưa vào cấp cứu vì khó thở tăng dần từ chiều, xịt thuốc giãn phế quản nhiều lần không đỡ.","vitals":{"hr":128,"sbp":124,"dbp":76,"rr":32,"t":37,"spo2":89},"ask":[["Khó thở bắt đầu thế nào, có khò khè, ho, tức ngực không?","Ho và khò khè từ tối qua, chiều nay khó thở tăng nhanh, tức ngực, không nói trọn câu.","e"],["Đã dùng thuốc xịt gì, bao nhiêu lần, có đỡ không?","Xịt salbutamol khoảng 10 nhát trong 3 giờ, chỉ đỡ vài phút.","e"],["Tiền sử hen, nhập viện, đặt nội khí quản trước đây?","Hen từ nhỏ, dùng thuốc dự phòng không đều; năm ngoái nhập viện một lần, chưa đặt nội khí quản.","e"],["Yếu tố khởi phát: nhiễm trùng hô hấp, tiếp xúc dị nguyên, thuốc (aspirin, chẹn beta), khói?","Cảm sổ mũi 3 ngày; dọn nhà nhiều bụi; không dùng aspirin hay chẹn beta.","e"],["Có sốt, đờm mủ, đau ngực kiểu màng phổi không?","Không sốt; đờm trắng ít.","e"],["Có khó nuốt, phù môi mặt, nổi mề đay (loại phản vệ) không?","Không phù mặt, không mề đay.","e"],["Có tiền sử dị ứng, viêm mũi dị ứng, chàm không?","Viêm mũi dị ứng, dị ứng bụi nhà.","n"],["Có hút thuốc lá không?","Không hút thuốc.","n"]],"exam":[["K","Hô hấp: tần số và co kéo","Thở 32 l/p, co kéo cơ ức đòn chũm và liên sườn, nói từng từ.","e"],["K","Phổi nghe","Ran rít, ran ngáy lan tỏa hai phổi cả hai thì, rì rào phế nang giảm ở đáy; chưa có phổi câm.","e"],["K","Tim mạch","Tim nhanh 128 l/p, huyết áp 124/76 mmHg, mạch nghịch đảo khoảng 18 mmHg.","e"],["K","Tri giác","Tỉnh, vật vã nhưng còn hợp tác; không tím tái.","e"],["K","Da, họng","Không nổi mề đay, không phù thanh quản.","n"]],"tests":[["Đo lưu lượng đỉnh (PEF) hoặc FEV1 nếu thực hiện được",10,"PEF 140 L/phút, khoảng 28% so với giá trị dự đoán (500 L/phút).","e"],["Khí máu động mạch",10,"pH 7,38; PaO2 60 mmHg; PaCO2 44 mmHg; HCO3 25: PaCO2 đã trở về bình thường trong khi đang thở nhanh, cảnh báo kiệt sức.","e"],["X-quang ngực thẳng",10,"Phổi tăng sáng, không tràn khí màng phổi, không đông đặc.","e"],["Công thức máu, điện giải",10,"Bạch cầu 13,5 G/L, bạch cầu ưa acid 0,3 G/L; K 3,6 mmol/L.","e"],["Điện tim",10,"Nhịp xoang nhanh 128 l/p, không thiếu máu cơ tim.","n"],["CT ngực độ phân giải cao ngay để chẩn đoán trước khi điều trị",40,"Không cần khi lâm sàng điển hình; trì hoãn điều trị cơn nặng.","w"]],"opt":{"ydx":["Đợt cấp COPD","Tràn khí màng phổi tự phát","+Cơn hen phế quản cấp nặng, nguy cơ suy hô hấp","Phản vệ có co thắt phế quản"],"thuoc_dau":["Chỉ kháng sinh liều cao","Thuốc an thần để giảm lo lắng","Thuốc chẹn beta để giảm nhịp nhanh","+Oxy (SpO2 mục tiêu 93–95%), salbutamol phun khí dung liên tiếp kèm ipratropium trong giờ đầu và corticoid toàn thân sớm"],"neu_khong_dap_ung":["+Magnesium sulfat 2 g truyền tĩnh mạch 20 phút, cân nhắc ICU, NIV hoặc đặt nội khí quản nếu kiệt sức hoặc tăng CO2","Tăng liều thuốc an thần","Tiếp tục xịt đơn thuần tại nhà","Truyền dịch lượng lớn"],"dau_hieu_nguy_hiem":["Nhịp tim nhanh luôn là dấu hiệu lành","+PaCO2 bình thường hoặc tăng, phổi câm, nói không thành tiếng, lơ mơ là dấu hiệu sắp suy hô hấp","Ran rít nhiều chứng tỏ cơn nhẹ","Huyết áp cao là dấu hiệu tốt"]},"actions":["++Ngồi, monitor SpO2, thở oxy duy trì SpO2 93–95%|2|Thiếu oxy máu cần sửa ngay; tránh quá liều oxy.","++Salbutamol 2,5–5 mg phun khí dung kèm ipratropium mỗi 20 phút trong giờ đầu|2|Giãn phế quản nhanh là nền tảng xử trí cơn hen nặng.","++Corticoid toàn thân sớm (methylprednisolon tĩnh mạch hoặc prednisolon uống 40–50 mg)|2|Giảm viêm đường thở, hiệu quả sau vài giờ nên cần cho sớm.","++Magnesium sulfat tĩnh mạch nếu đáp ứng kém sau giờ đầu|2|Bổ sung giãn phế quản ở cơn nặng không đáp ứng.","++Theo dõi khí máu lặp lại và chuẩn bị chuyển hồi sức|2|PaCO2 bình thường trong cơn nặng là dấu hiệu nguy hiểm.","-Kháng sinh thường quy|1|Không có sốt, đờm mủ hay bằng chứng nhiễm khuẩn; cảm do virus là yếu tố khởi phát.","!Dùng thuốc an thần để giúp bà nghỉ ngơi|0|Ức chế hô hấp và có thể gây suy hô hấp đột ngột."],"teach":"Cơn hen nặng được nhận biết bằng nói từng từ, PEF dưới 50%, SpO2 giảm; PaCO2 bình thường khi đang thở nhanh là báo động suy hô hấp. Điều trị bằng oxy, đồng vận beta-2 và kháng cholinergic khí dung, corticoid toàn thân sớm, magnesium nếu kém đáp ứng.","hbu":{"hanh_chinh":"Bà V. T. N. (mô phỏng), nữ, 28 tuổi, nhân viên văn phòng; vào cấp cứu buổi tối.","ly_do_vao_vien":"Khó thở nặng, khò khè, xịt thuốc không đỡ.","benh_su":"Bà có hen từ nhỏ, dùng thuốc dự phòng không đều. Ba ngày nay sổ mũi, hôm qua dọn nhà nhiều bụi, tối qua ho và khò khè. Chiều nay khó thở tăng nhanh, tức ngực, nói không trọn câu, xịt khoảng 10 nhát salbutamol trong 3 giờ chỉ đỡ vài phút. Không sốt, không phù mặt, không mề đay.","tien_su":"Hen phế quản từ nhỏ, một lần nhập viện năm ngoái, chưa đặt nội khí quản; viêm mũi dị ứng; không hút thuốc; không dùng aspirin hay chẹn beta.","luoc_qua_co_quan":"Không đau bụng, không nôn; không phù chân; không đau ngực kiểu màng phổi; không yếu liệt.","kham_hien_tai":"Tỉnh, vật vã, nói từng từ; nhịp thở 32 l/p, co kéo cơ hô hấp phụ, mạch 128 l/p, huyết áp 124/76 mmHg, nhiệt 37,0 độ C, SpO2 89% khí trời; ran rít lan tỏa hai thì, rì rào phế nang giảm ở đáy, mạch nghịch đảo 18 mmHg.","can_lam_sang":"PEF 140 L/phút (28% dự đoán). Khí máu pH 7,38, PaO2 60, PaCO2 44. X-quang không tràn khí. Bạch cầu 13,5 G/L, ưa acid 0,3. K 3,6 mmol/L.","tom_tat":"Nữ 28 tuổi tiền sử hen, sau nhiễm virus và tiếp xúc bụi, khó thở nặng, nói từng từ, co kéo, ran rít lan tỏa, SpO2 89%, PEF 28%, PaCO2 44 đã về bình thường trong khi thở nhanh, không đáp ứng salbutamol xịt.","dat_van_de":"1) Cơn hen cấp nặng. 2) Giảm oxy máu. 3) Dấu hiệu nguy cơ suy hô hấp (PaCO2 tăng tương đối, PEF thấp). 4) Yếu tố khởi phát. 5) Kế hoạch ngăn tái phát.","chan_doan_so_bo":"Cơn hen phế quản cấp nặng (đe dọa suy hô hấp), có yếu tố khởi phát do nhiễm virus và dị nguyên.","bien_luan":"Tiền sử hen từ nhỏ với viêm mũi dị ứng, khởi phát sau nhiễm virus và bụi, khò khè lan tỏa hai thì, đáp ứng kém với đồng vận beta-2 tác dụng ngắn, nghĩ nhiều cơn hen cấp. Mức độ nặng thể hiện ở: nói từng từ, nhịp thở 32 l/p, mạch trên 120, SpO2 dưới 90%, PEF dưới 50% (28%), mạch nghịch đảo. PaCO2 44 trong khi đang thở nhanh là dấu hiệu bất thường vì ở cơn nặng thường PaCO2 thấp do tăng thông khí; PaCO2 trở về bình thường cho thấy cơ hô hấp kiệt sức và nguy cơ suy hô hấp, cần chuẩn bị hồi sức. Loại trừ COPD do trẻ tuổi, không hút thuốc, bệnh sử hen; loại trừ tràn khí màng phổi vì X-quang; loại trừ phản vệ vì không mề đay, không phù thanh quản; thuyên tắc phổi ít nghĩ vì khò khè lan tỏa và tiền sử hen. Chưa có chỉ định kháng sinh vì không bằng chứng nhiễm khuẩn.","sinh_ly_benh":"Hen là viêm mạn đường thở với tăng đáp ứng phế quản. Dị nguyên và virus kích hoạt tế bào viêm giải phóng cytokine, gây co thắt cơ trơn, phù nề niêm mạc và tăng tiết đờm, làm hẹp lòng phế quản, tăng sức cản đường thở, ứ khí và tăng công thở. Tăng thông khí ban đầu làm PaCO2 giảm; khi cơ hô hấp mệt, PaCO2 tăng lên bình thường rồi tăng cao, kèm toan hô hấp.","chan_doan_phan_biet":"Đợt cấp COPD; tràn khí màng phổi; phản vệ; dị vật đường thở; suy tim; thuyên tắc phổi; rối loạn chức năng dây thanh.","chan_doan_xac_dinh":"Cơn hen phế quản cấp nặng; viêm mũi dị ứng; kiểm soát hen kém.","dieu_tri":"Oxy duy trì SpO2 93–95%; salbutamol 2,5–5 mg phun khí dung mỗi 20 phút x 3 kèm ipratropium 0,5 mg; corticoid toàn thân (prednisolon 40–50 mg uống hoặc methylprednisolon 1 mg/kg tĩnh mạch); magnesium sulfat 2 g tĩnh mạch nếu kém đáp ứng; theo dõi khí máu, PEF, bù kali; chuyển hồi sức, NIV hoặc đặt nội khí quản khi lơ mơ, PaCO2 tăng, kiệt sức. Sau ra viện: corticoid hít kết hợp đồng vận beta-2 tác dụng kéo dài, kế hoạch hành động hen.","tien_luong":"Tốt nếu đáp ứng điều trị trong 1–2 giờ; nguy cơ tử vong do hen ở người đã nhập viện, kiểm soát kém; cần theo dõi sát.","du_phong":"Điều trị duy trì bằng corticoid hít, kỹ thuật dùng bình xịt, kế hoạch hành động bằng chỉ số PEF, tránh dị nguyên, tiêm vắc xin cúm, tái khám sau 2–7 ngày và mỗi 1–3 tháng."},"nguon":["Hướng dẫn chẩn đoán và điều trị hen phế quản, Bộ Y tế Việt Nam, 2016.","Global Initiative for Asthma (GINA) report, bản cập nhật hiện hành.","Giáo trình Nội khoa, Bộ môn Nội, Trường Đại học Y Hà Nội, phần Hen phế quản."],"status":"nhap"},{"id":"noi-ho-hap-002","title":"Ho đờm mủ tăng, khó thở và lơ mơ ở người COPD","kind":"Nội","level":"Khó","group":"noi","name":"Ông C. H. B. (mô phỏng)","age":70,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Ông được đưa vào cấp cứu vì khó thở tăng ba ngày, ho đờm vàng đục nhiều hơn và ngủ gà từ sáng.","vitals":{"hr":108,"sbp":142,"dbp":84,"rr":28,"t":37.9,"spo2":84},"ask":[["Khó thở và ho đờm thay đổi thế nào trong 3 ngày?","Khó thở tăng dần, đi vài bước đã thở dốc; ho nhiều, đờm chuyển từ trắng sang vàng đục và nhiều hơn gấp đôi.","e"],["Có sốt, đau ngực, khò khè nhiều hơn không?","Sốt nhẹ, khò khè nhiều; không đau ngực kiểu màng phổi.","e"],["Tiền sử COPD, đợt cấp, nhập viện, thở oxy tại nhà?","COPD 8 năm, GOLD nhóm E, 3 đợt cấp năm qua,
