idsociety.org/practice-guideline/clostridioides-difficile-2021-focused-update/"],"status":"nhap"},{"id":"noi-tieu-hoa-008","title":"Mệt kéo dài ở người đã biết nhiễm viêm gan B","kind":"Nội","level":"Trung bình","group":"noi","name":"Người bệnh mô phỏng N08","age":43,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh đến khám vì mệt kéo dài, có hồ sơ HBsAg dương tính từ hai năm trước nhưng chưa theo dõi đều.","vitals":{"hr":82,"sbp":120,"dbp":76,"rr":17,"t":36.7,"spo2":98},"ask":[["HBsAg được phát hiện khi nào và có hồ sơ không?","Có kết quả dương tính hai năm trước và một năm trước.","e"],["Đã dùng thuốc kháng virus hoặc tự ngừng thuốc chưa?","Chưa dùng thuốc kháng virus.","e"],["Có vàng da, bụng to, phù chân hoặc xuất huyết không?","Không ghi nhận.","e"],["Có uống rượu hoặc dùng thuốc, thực phẩm bổ sung không rõ thành phần không?","Ít uống rượu, không dùng sản phẩm không rõ thành phần.","e"],["Gia đình có xơ gan hoặc ung thư gan không?","Cha từng được điều trị ung thư gan.","e"],["Người sống cùng đã xét nghiệm và tiêm vaccine chưa?","Vợ chưa rõ tình trạng xét nghiệm và tiêm vaccine.","e"],["Có đau bụng liên tục hoặc sụt cân không?","Không đau bụng liên tục, cân nặng ổn định.","n"]],"exam":[["K","Toàn trạng","Tỉnh, không vàng da rõ, không dấu mất nước.","e"],["K","Khám bụng","Bụng mềm, không dấu cổ trướng, không sờ thấy khối.","e"],["K","Dấu mất bù","Không phù chân, không rối loạn tri giác hoặc dấu xuất huyết.","e"],["K","Tim và phổi","Không ghi nhận bất thường.","n"]],"tests":[["HBsAg, HBeAg và HBV DNA",10,"HBsAg dương tính; HBeAg âm tính; HBV DNA 180.000 IU/mL.","e"],["Men gan, bilirubin, albumin và INR",10,"ALT 126 U/L, lần trước 118 U/L; AST 82 U/L; bilirubin 17 µmol/L; albumin 41 g/L; INR 1,0.","e"],["Chức năng thận và đánh giá đồng nhiễm",10,"Creatinin 86 µmol/L; HIV, anti-HCV và anti-HDV âm tính.","e"],["Siêu âm gan và đánh giá xơ hóa theo quy trình",15,"Không có tổn thương khu trú hoặc cổ trướng; mức xơ hóa cần hoàn tất đánh giá chuyên khoa.","e"],["CT gan lặp hằng tháng khi không có dấu nghi ngờ",40,"Không thực hiện: không phải chiến lược theo dõi thường quy phù hợp.","w"]],"opt":{"ydx":["+Viêm gan B mạn có hoạt động, cần đánh giá điều trị và xơ hóa","Viêm gan B cấp chỉ dựa vào HBsAg hiện tại","Xơ gan mất bù đã xác định","Ung thư gan đã xác định chỉ từ tiền sử gia đình"],"dieu_tri":["+Đánh giá điều trị kháng virus dựa trên hướng dẫn, chức năng thận và bệnh cảnh","Không điều trị vì HBeAg âm tính","Chỉ dùng thuốc hạ men gan thay mọi điều trị nguyên nhân","Đợi vàng da hoặc cổ trướng mới theo dõi"],"du_phong":["+Xét nghiệm và tiêm vaccine cho người tiếp xúc phù hợp chưa miễn dịch","Cách ly hoàn toàn mọi tiếp xúc sinh hoạt","Dùng chung dao cạo để người thân quen dần với virus","HBV DNA giảm đồng nghĩa luôn có thể tự ngừng thuốc"]},"actions":["+Đánh giá xơ hóa và chỉ định kháng virus|2|Không suy ra mức xơ hóa chỉ từ ALT.","+Lập kế hoạch theo dõi ung thư gan theo mức nguy cơ|2|Tiền sử gia đình cần được đưa vào đánh giá.","+Tư vấn đường lây, xét nghiệm và vaccine cho người tiếp xúc|2|Giảm lây truyền mà không kỳ thị.","!Khẳng định HBeAg âm tính nghĩa là virus không hoạt động|0|Cần kết hợp HBV DNA và tổn thương gan."],"teach":"HBsAg tồn tại kéo dài giúp xác định nhiễm mạn, nhưng đánh giá hoạt động và điều trị cần thêm dữ kiện. Men gan, tải lượng virus, xơ hóa và nguy cơ ung thư gan có vai trò khác nhau.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N08, nam, 43 tuổi, kỹ thuật viên; khám ngoại trú.","ly_do_vao_vien":"Mệt kéo dài và kiểm tra viêm gan B.","benh_su":"Mệt khoảng hai tháng, không vàng da, cổ trướng hoặc xuất huyết; theo dõi HBV không đều.","tien_su":"HBsAg dương tính được ghi nhận trên hai năm; chưa điều trị kháng virus; cha có ung thư gan.","luoc_qua_co_quan":"Không khó thở, rối loạn tri giác hoặc tiểu ít.","kham_hien_tai":"Sinh hiệu ổn định, chưa có dấu mất bù.","can_lam_sang":"HBV DNA tăng, ALT tăng lặp lại; chức năng tổng hợp gan còn bảo tồn; chưa hoàn tất phân mức xơ hóa.","tom_tat":"Nam 43 tuổi nhiễm HBV mạn, có bằng chứng hoạt động và tiền sử gia đình ung thư gan.","dat_van_de":"Hoạt động HBV; đánh giá xơ hóa; chỉ định điều trị; nguy cơ ung thư và lây truyền.","chan_doan_so_bo":"Viêm gan B mạn có hoạt động.","bien_luan":"Hồ sơ kéo dài xác định nhiễm mạn; tải lượng virus và ALT hỗ trợ hoạt động bệnh, đồng thời cần xem xét nguyên nhân tổn thương gan khác.","sinh_ly_benh":"Đáp ứng miễn dịch đối với tế bào gan nhiễm HBV góp phần gây viêm và tổn thương; diễn tiến kéo dài có thể gây xơ hóa.","chan_doan_phan_biet":"Bệnh gan chuyển hóa, tổn thương gan do thuốc, đồng nhiễm và bệnh gan khác khi có dữ kiện gợi ý.","chan_doan_xac_dinh":"Viêm gan B mạn có hoạt động; chưa xác định mức xơ hóa.","dieu_tri":"Đánh giá và triển khai kháng virus phù hợp, theo dõi đáp ứng và an toàn thuốc.","tien_luong":"Phụ thuộc xơ hóa, kiểm soát virus và tuân thủ; điều trị không loại bỏ hoàn toàn nguy cơ ung thư.","du_phong":"Vaccine cho người phù hợp, tránh dùng chung vật dụng dính máu và duy trì theo dõi."},"nguon":["WHO, Guidelines for the prevention, diagnosis, care and treatment for people with chronic hepatitis B infection, 2024. https://www.who.int/publications/i/item/9789240090903"],"status":"nhap"},{"id":"noi-tieu-hoa-009","title":"Tiêu chảy máu và mót rặn kéo dài","kind":"Nội","level":"Trung bình","group":"noi","name":"Người bệnh mô phỏng N09","age":32,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh khám chuyên khoa Tiêu hóa vì tiêu chảy có máu và mót rặn trong 6 tuần.","vitals":{"hr":84,"sbp":110,"dbp":72,"rr":18,"t":36.8,"spo2":99},"ask":[["Đi tiêu bao nhiêu lần và máu xuất hiện thế nào?","Khoảng 4 lần/ngày, phân mềm có máu và nhầy.","e"],["Có mót rặn hoặc phải đi tiêu ban đêm không?","Có mót rặn; đôi khi thức giấc để đi tiêu.","e"],["Có sốt, sụt cân hoặc đau bụng tăng không?","Sụt khoảng 2 kg trong 6 tuần; đau bụng dưới nhẹ; không sốt.","e"],["Có dùng kháng sinh, đi xa hoặc người cùng ăn mắc bệnh không?","Không dùng kháng sinh gần đây, không đi xa hoặc có người cùng ăn mắc bệnh.","e"],["Có đau khớp, mắt đỏ đau hoặc tổn thương da không?","Chưa ghi nhận.","e"],["Có dùng NSAID hoặc từng mắc bệnh tương tự không?","Không dùng NSAID; đây là đợt đầu.","e"],["Gia đình có bệnh viêm ruột không?","Không ghi nhận.","n"]],"exam":[["K","Toàn trạng","Tỉnh, hơi nhợt, không mất nước rõ.","e"],["K","Khám bụng","Đau nhẹ bụng dưới trái, bụng không chướng hoặc có dấu phúc mạc.","e"],["K","Đánh giá mắt, da và khớp","Chưa ghi nhận biểu hiện ngoài ruột.","n"],["K","Khám vùng hậu môn khi phù hợp và có đồng thuận","Không thấy tổn thương quanh hậu môn rõ hoặc trĩ giải thích toàn bộ bệnh cảnh.","e"]],"tests":[["Công thức máu, CRP và albumin",10,"Hemoglobin 11,4 g/dL; CRP 12 mg/L; albumin 38 g/L.","e"],["Xét nghiệm phân tìm nguyên nhân nhiễm trùng",10,"Không phát hiện tác nhân gây bệnh trong bộ xét nghiệm của cơ sở; C. difficile âm tính.","e"],["Nội soi đại tràng và sinh thiết sau đánh giá an toàn",20,"Viêm liên tục từ trực tràng đến đại tràng xuống; sinh thiết gợi ý viêm đại tràng mạn hoạt động với biến dạng cấu trúc tuyến.","e"],["Calprotectin phân",10,"620 µg/g; tăng theo ngưỡng của phòng xét nghiệm.","n"],["Xét nghiệm máu ẩn trong phân khi đã thấy máu rõ",10,"Không thực hiện: không giải quyết câu hỏi chẩn đoán hiện tại.","w"]],"opt":{"ydx":["+Viêm loét đại tràng, tổn thương đại tràng trái","Hội chứng ruột kích thích","Trĩ đơn thuần","Viêm tụy cấp"],"uu_tien":["+Kết hợp bệnh cảnh, nội soi, mô học và đánh giá nhiễm trùng","Chẩn đoán chỉ từ calprotectin tăng","Dùng corticoid ngay mà bỏ đánh giá nhiễm trùng","Cho rằng máu trong phân luôn do trĩ"],"dieu_tri":["+Điều trị theo mức hoạt động và phạm vi bệnh; cân nhắc 5-ASA cho bệnh phù hợp","Dùng corticoid kéo dài làm điều trị duy trì thường quy","Chỉ dùng thuốc cầm tiêu chảy bất kể mức độ","Không cần theo dõi sau khi hết máu trong phân"]},"actions":["+Phân mức hoạt động và rà nguy cơ cần nhập viện|2|Quyết định điều trị không chỉ dựa vào phạm vi nội soi.","+Cân nhắc phối hợp 5-ASA đường uống và trực tràng theo chuyên khoa|2|Phù hợp một số bệnh cảnh đại tràng trái nhẹ đến vừa.","+Đặt mục tiêu cải thiện triệu chứng và kiểm soát viêm|2|Hết triệu chứng không luôn đồng nghĩa hết hoạt động bệnh.","!Dùng corticoid lâu dài để duy trì lui bệnh|0|Cần chiến lược duy trì không phụ thuộc corticoid."],"teach":"Tiêu chảy máu, mót rặn và triệu chứng ban đêm không phù hợp với IBS đơn thuần. Chẩn đoán bệnh viêm ruột cần tổng hợp dữ kiện và đánh giá nguyên nhân nhiễm trùng.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N09, nữ, 32 tuổi, giáo viên; khám chuyên khoa.","ly_do_vao_vien":"Tiêu chảy máu và mót rặn.","benh_su":"Triệu chứng 6 tuần, khoảng 4 lần/ngày, có máu nhầy, mót rặn và đôi khi đi tiêu ban đêm; giảm cân nhẹ.","tien_su":"Đợt đầu, không dùng NSAID hoặc kháng sinh gần đây.","luoc_qua_co_quan":"Chưa có biểu hiện khớp, mắt hoặc da; không khó thở.","kham_hien_tai":"Sinh hiệu ổn định, đau nhẹ bụng dưới trái, không dấu phúc mạc.","can_lam_sang":"Thiếu máu nhẹ, dấu viêm tăng; nội soi và mô học phù hợp viêm loét đại tràng; xét nghiệm nhiễm trùng ban đầu không phát hiện tác nhân.","tom_tat":"Nữ 32 tuổi tiêu chảy máu kéo dài với tổn thương viêm liên tục từ trực tràng đến đại tràng xuống.","dat_van_de":"Viêm đại tràng mạn; mức hoạt động và phạm vi bệnh; thiếu máu; loại trừ nhiễm trùng.","chan_doan_so_bo":"Bệnh viêm ruột, nghĩ viêm loét đại tràng.","bien_luan":"Phân bố liên tục từ trực tràng và mô học hỗ trợ chẩn đoán; calprotectin phản ánh viêm, không xác định bệnh riêng lẻ.","sinh_ly_benh":"Viêm niêm mạc đại tràng gây chảy máu, giảm khả năng hấp thu và tăng nhu cầu đi tiêu.","chan_doan_phan_biet":"Viêm đại tràng nhiễm trùng, Crohn đại tràng và nguyên nhân viêm khác.","chan_doan_xac_dinh":"Viêm loét đại tràng, phạm vi đại tràng trái trong tình huống mô phỏng.","dieu_tri":"Điều trị theo mức hoạt động; cân nhắc 5-ASA phù hợp và đánh giá đáp ứng để điều chỉnh.","tien_luong":"Bệnh mạn có thể tái phát; cần theo dõi kiểm soát viêm.","du_phong":"Tuân thủ điều trị duy trì, rà vaccine và giám sát biến chứng theo thời gian mắc bệnh."},"nguon":["ACG Clinical Guideline Update: Ulcerative Colitis in Adults, 2025; bản tóm lược chính thức của ACG. https://gi.org/journals-publications/ebgi/alkazzi_aug2025/"],"status":"nhap"},{"id":"noi-tieu-hoa-010","title":"Sốt rét run, vàng da và đau hạ sườn phải","kind":"Nội","level":"Khó","group":"noi","name":"Người bệnh mô phỏng N10","age":76,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh đến cấp cứu vì sốt rét run, vàng da và đau hạ sườn phải, cần phối hợp Nội Tiêu hóa, hồi sức và đội can thiệp đường mật.","vitals":{"hr":116,"sbp":86,"dbp":50,"rr":26,"t":39.2,"spo2":95},"ask":[["Đau và sốt xuất hiện thế nào?","Đau hạ sườn phải hai ngày; sốt rét run từ hôm qua.","e"],["Vàng da, nước tiểu hoặc màu phân thay đổi không?","Vàng mắt tăng, nước tiểu sẫm, phân nhạt hơn thường ngày.","e"],["Có lú lẫn, ngất hoặc tiểu ít không?","Tiểu ít; gia đình thấy trả lời chậm hơn thường ngày.","e"],["Có tiền sử sỏi hoặc can thiệp đường mật không?","Từng phát hiện sỏi túi mật; chưa can thiệp đường mật.","e"],["Có dùng chống đông, dị ứng hoặc bệnh tim, thận không?","Không dùng chống đông, chưa ghi nhận dị ứng; có tăng huyết áp.","e"],["Gần đây có nhập viện hoặc dùng kháng sinh không?","Không trong ba tháng gần đây.","e"],["Có nôn máu hoặc đi phân đen không?","Không có.","n"]],"exam":[["K","Tri giác và tưới máu","Trả lời chậm, chi mát, thời gian làm đầy mao mạch 4 giây.","e"],["K","Da và mắt","Vàng da, vàng củng mạc.","e"],["K","Khám bụng","Đau hạ sườn phải, không co cứng lan tỏa.","e"],["K","Tim và phổi","Tim nhanh đều; thở nhanh, chưa có ran rõ.","e"]],"tests":[["Công thức máu, CRP, lactate và xét nghiệm chức năng cơ quan",10,"Bạch cầu 19,2 G/L; CRP 180 mg/L; lactate 3,8 mmol/L; creatinin 176 µmol/L; tiểu cầu 145 G/L.","e"],["Xét nghiệm gan mật và đông máu",10,"Bilirubin toàn phần 118 µmol/L, trực tiếp 86 µmol/L; ALP và GGT tăng; INR 1,3.","e"],["Cấy máu trước kháng sinh nếu không làm chậm điều trị",10,"Đã lấy hai bộ cấy; kết quả đang chờ.","e"],["Siêu âm đường mật",15,"Ống mật chủ giãn 12 mm, có hình ảnh sỏi khoảng 9 mm.","e"],["MRCP bắt buộc trước mọi quyết định dẫn lưu dù người bệnh không ổn",40,"Không ưu tiên nếu làm chậm kiểm soát nguồn nhiễm đã có bằng chứng rõ.","w"]],"opt":{"ydx":["+Viêm đường mật cấp do sỏi ống mật chủ, có dấu suy cơ quan và bất ổn tuần hoàn","Viêm túi mật đơn thuần đã giải thích đầy đủ mọi dấu hiệu","Viêm gan B mạn ổn định","Hội chứng ruột kích thích"],"uu_tien":["+Hồi sức, kháng sinh sớm và phối hợp dẫn lưu đường mật khẩn","Đợi hết sốt hoàn toàn mới hội chẩn can thiệp","Chỉ giảm đau và cho về","Chờ cấy máu dương tính mới điều trị"],"kiem_soat_nguon_nhiem":["+Giải áp đường mật bằng phương pháp phù hợp sau ổn định ban đầu, không trì hoãn không cần thiết","Kháng sinh luôn thay thế được dẫn lưu khi có tắc nghẽn và diễn tiến nặng","Mổ lấy túi mật là phương án duy nhất trong mọi tình huống","MRCP là biện pháp điều trị tắc nghẽn"]},"actions":["++Đánh giá ABC, hồi sức theo đáp ứng và huy động đội hồi sức|2|Người bệnh có dấu giảm tưới máu và rối loạn tri giác.","++Khởi kháng sinh sớm, hiệu chỉnh theo chức năng thận và dữ liệu kháng thuốc|2|Không chờ kết quả cấy khi đang diễn tiến nặng.","+Hội chẩn can thiệp dẫn lưu đường mật khẩn|2|Điều trị cần kiểm soát nguồn nhiễm bên cạnh kháng sinh.","!Trì hoãn can thiệp nhiều ngày để chờ bilirubin tự giảm|0|Tắc nghẽn nhiễm trùng có thể tiếp tục gây suy cơ quan."],"teach":"Sốt, ứ mật và bằng chứng tắc đường mật giúp định hướng viêm đường mật. Tụt huyết áp hoặc rối loạn tri giác đòi hỏi xử trí khẩn, không chỉ làm thêm xét nghiệm.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N10, nữ, 76 tuổi, nghỉ hưu; tiếp nhận tại cấp cứu.","ly_do_vao_vien":"Sốt rét run, vàng da và đau hạ sườn phải.","benh_su":"Đau hai ngày, sốt từ hôm trước, vàng da tăng và tiểu ít; gia đình nhận thấy trả lời chậm.","tien_su":"Đã biết sỏi túi mật; chưa can thiệp đường mật; có tăng huyết áp.","luoc_qua_co_quan":"Không xuất huyết tiêu hóa; tiểu ít và rối loạn đáp ứng mới xuất hiện.","kham_hien_tai":"Sốt cao, huyết áp thấp, thở nhanh, chi mát, vàng da và đau hạ sườn phải.","can_lam_sang":"Dấu viêm, ứ mật và lactate tăng; siêu âm có giãn ống mật chủ và sỏi; cấy đang chờ.","tom_tat":"Nữ 76 tuổi có nhiễm trùng đường mật kèm tắc nghẽn, giảm tưới máu và rối loạn tri giác.","dat_van_de":"Viêm đường mật cấp; tắc nghẽn; suy cơ quan; nhu cầu kiểm soát nguồn nhiễm.","chan_doan_so_bo":"Viêm đường mật cấp do sỏi ống mật chủ.","bien_luan":"Có ba nhóm dữ kiện: viêm toàn thân, ứ mật và hình ảnh nguyên nhân tắc. Rối loạn tri giác là dấu cần phân loại nặng theo Tokyo; mức độ phải được ghi nhận chính thức.","sinh_ly_benh":"Tắc nghẽn làm tăng áp lực đường mật, thuận lợi cho nhiễm trùng; đáp ứng toàn thân có thể gây giảm tưới máu và suy cơ quan.","chan_doan_phan_biet":"Viêm túi mật, áp xe gan, viêm gan cấp và các ổ nhiễm khác.","chan_doan_xac_dinh":"Viêm đường mật cấp do sỏi ống mật chủ, có dấu nặng; chưa kết luận sốc nhiễm khuẩn theo tiêu chuẩn đầy đủ.","dieu_tri":"Hồi sức, kháng sinh và dẫn lưu đường mật khẩn bằng phương pháp phù hợp; theo dõi chức năng cơ quan.","tien_luong":"Dè dặt, phụ thuộc đáp ứng hồi sức và kiểm soát nguồn nhiễm.","du_phong":"Sau ổn định, xử lý sỏi và lập kế hoạch phòng tái phát theo đội chuyên khoa."},"nguon":["Tokyo Guidelines 2018: diagnostic criteria and severity grading of acute cholangitis. DOI: 10.1002/jhbp.512.","Tokyo Guidelines 2018: initial management of acute biliary infection and flowchart for acute cholangitis. DOI: 10.1002/jhbp.509.","Danh mục hướng dẫn của Japanese Society of Hepato-Biliary-Pancreatic Surgery. https://www.jshbps.jp/modules/en/index.php?content_id=47"],"status":"nhap"}];

  });
  // xử trí
  const A=c.actions.map(parseAct);
  A.forEach((a,k)=>{

function drawQuestions(def,n){
  const pool=def.pool(), seen=seenOf(def.id), out=[], used=new Set();
  const total=def.secs.reduce((a,x)=>a+x[2],0);
  const quota=def.secs.map(x=>Math.max(0,Math.round(x[2]*n/total)));
  let diff=n-quota.reduce((a,b)=>a+b,0); for(let i=0;diff!==0;i=(i+1)%quota.length){ if(diff>0){quota[i]++;diff--;} else if(quota[i]>0){quota[i]--;diff++;} }
  const usedQ=new Set(); const take=(items,k)=>{ const f=shuf(items.filter(p=>!seen.has(p.id)&&!used.has(p.id))).concat(shuf(items.filter(p=>seen.has(p.id)&&!used.has(p.id)))); let got=0; for(const p of f){ if(got>=k) break; if(usedQ.has(p.q)) continue; out.push(p); used.add(p.id); usedQ.add(p.q); got++; } };
  def.secs.forEach((s,i)=>take(pool.filter(p=>p.sec===s[0]),quota[i]));
  if(out.length<n) take(pool,n-out.length);
  /* Đổi vị trí câu hỏi và đáp án mỗi lượt thi */
  return shuf(out).map(p=>({...p, opts:shuf(p.o.map((t,k)=>({t,ok:k===0})))}));
}

function vivaStart(){
  clearInterval(V.timer);
  V.phase="exam"; V.qs=drawQuestions(V.def,V.n); V.i=0; V.pickd=-1; V.ans=[]; V.left=V.qs.length*60; V.total=V.left;
  V.timer=setInterval(()=>{ V.left--; $("#timer").textContent="Còn "+mmss(Math.max(0,V.left)); if(V.left<=0) vivaFinish(); },1000);
  $("#timer").textContent="Còn "+mmss(V.left); vivaQ();
}
function vivaQ(){
  const q=V.qs[V.i], sec=V.def.secs.find(x=>x[0]===q.sec), last=V.i===V.qs.length-1;
  $("#panel").innerHTML=`<section class="card"><div class="row"><span class="code">Câu ${V.i+1}/${V.qs.length} · ${esc(sec[1])}</span></div>
  <div class="prog" aria-hidden="true"><i style="width:${(V.i/V.qs.length)*100}%"></i></div>
  <div class="bubble"><span class="who">Giám khảo</span>${esc(sec[3])} ${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="o" data-v="opt" data-k="${k}" aria-pressed="${V.pickd===k}" type="button"><b>${"ABCD"[k]}</b><span>${esc(o.t)}</span></button>`).join("")}</div>
  ${V.closed?"":`<details><summary>Xem lại bệnh án</summary>${V.def.doc()}</details>`}
  <button class="btn" data-v="next" type="button" ${V.pickd<0?"disabled":""}>${last?"Nộp bài":"Trả lời, sang câu tiếp"}</button></section>`;
}
function vivaFinish(){
  clearInterval(V.timer); V.phase="result";
  while(V.ans.length<V.qs.length) V.ans.push(-1);
  saveSeen(V.def.id,V.qs.map(q=>q.id),V.def.pool().length);
  const ok=V.qs.map((q,i)=>V.ans[i]>=0 && q.opts[V.ans[i]].ok);
  const right=ok.filter(Boolean).length, score=Math.round(right/V.qs.length*100)/10, used=V.total-Math.max(0,V.left);
  $("#timer").textContent="Đã nộp bài";
  const bySec=V.def.secs.map(([id,name])=>{ const idx=V.qs.map((q,i)=>q.sec===id?i:-1).filter(i=>i>=0); return [name,idx.filter(i=>ok[i]).length,idx.length]; }).filter(x=>x[2]>0);
  const weak=bySec.filter(x=>x[1]<x[2]).map(x=>x[0]);
  $("#panel").innerHTML=`<section class="card"><div class="code">Kết quả · ${esc(V.def.title)}</div>
  <div><span class="big ${score>=5?"pass":"fail"}">${String(score).replace(".",",")}</span> <span style="color:var(--muted)">/ 10 · ${right}/${V.qs.length} câu đúng · ${score>=5?"Đạt":"Chưa đạt"} (tạm tính ngưỡng 5,0)</span></div>
  <div class="score">Thời gian làm bài: ${mmss(used)}${V.ans.includes(-1)?" · có câu chưa trả lời, tính là sai":""}</div>
  ${bySec.map(x=>`<div class="sbar"><span>${esc(x[0])}</span><b>${x[1]}/${x[2]}</b><div class="prog"><i style="width:${x[1]/x[2]*100}%"></i></div></div>`).join("")}
  ${weak.length?`<div class="pit"><h3>Nên ôn lại</h3>${esc(weak.join(", "))}.</div>`:`<div class="why"><h3>Tốt lắm</h3>Bạn đúng ở mọi mục. Thi lại để gặp các câu mới.</div>`}
  <h2 style="font-size:17px">Xem lại từng câu</h2>
  ${V.qs.map((q,i)=>`<div class="rev ${ok[i]?"":"bad"}"><b>Câu ${i+1}. ${esc(q.q)}</b><span>Bạn chọn: ${V.ans[i]>=0?esc(q.opts[V.ans[i]].t):"(không trả lời)"}</span>${ok[i]?"":`<span>Đáp án đúng: <b>${esc(q.opts.find(o=>o.ok).t)}</b></span>`}${q.e?`<span style="color:var(--muted)">${esc(q.e)}</span>`:""}</div>`).join("")}
  <div class="nav"><button class="btn ghost" data-v="again" type="button">Chọn ca khác</button><button class="btn" data-v="retry" type="button">Thi lại ca này, câu mới</button></div></section>`;
  window.scrollTo({top:0});
}
function vivaClick(t){
  const a=t.dataset.v;
  if(a==="filter"){ V.filter=t.dataset.f; return vivaPick(); }
  if(a==="tfilter"){ V.filter=t.dataset.f; V.rank=null; V.def=null; return S.mode==="learn"?learnList():vivaPick(); }
  if(a==="lcase"){ const d=CASEDEFS.find(x=>x.id===t.dataset.id); S.lreveal=false; S.lid=d.id; if(d.id==="demo"){ S.view="case"; S.cur=0; $("#steps").hidden=false; render(); return window.scrollTo({top:0}); } return bankStudy(d); }
  if(a==="lreveal"){ S.lreveal=true; return bankStudy(CASEDEFS.find(x=>x.id===S.lid)); }
  if(a==="lback") return learnList();
  if(a==="case"){ V.def=CASEDEFS.find(d=>d.id===t.dataset.id); vivaPick(); const s=$("#v-n"); return s&&s.scrollIntoView({block:"center"}); }
  if(a==="start"){ V.n=+$("#v-n").value; V.closed=$("#v-closed").checked; return vivaRead(); }
  if(a==="go") return vivaStart();
  if(a==="opt"){ V.pickd=+t.dataset.k; return vivaQ(); }
  if(a==="next"){ V.ans[V.i]=V.pickd; V.pickd=-1; if(V.i>=V.qs.length-1) return vivaFinish(); V.i++; vivaQ(); return window.scrollTo({top:0}); }
  if(a==="again"){ V.def=null; V.rank=null; return vivaPick(); }
  if(a==="retry") return vivaRead();
  if(a==="learn") return setMode("learn");
}

learnList();
</script>

</body>
</html>
