:"Phòng khám Nội YHCT","clock":"09:40","name":"Ông Trần Văn Hậu","age":58,"sex":"nam","intro":"Phòng khám Nội YHCT. Ông là tài xế, hút thuốc lá nhiều năm, đến khám vì ho khạc đờm kéo dài mỗi sáng, 4 tháng nay, nhiều đợt ho kéo dài mỗi năm.","vitals":{"hr":82,"sbp":130,"dbp":80,"rr":19,"t":36.8,"spo2":96},"ask":[["Ho từ bao lâu, ho vào lúc nào, đờm màu gì?","Ho khạc đờm hằng ngày, chủ yếu buổi sáng, đã gần 4 tháng; những năm trước cũng ho vài tháng mỗi năm. Đờm trắng, dính, dễ khạc, lượng nhiều.","e"],["Có ho ra máu, đau ngực, khàn tiếng kéo dài không?","Không ho ra máu, không đau ngực. Giọng bình thường.","e"],["Có sụt cân, sốt về chiều, ra mồ hôi trộm không?","Không sụt cân đáng kể, không sốt, không ra mồ hôi trộm.","e"],["Có khó thở khi gắng sức, khò khè không?","Leo 2 tầng lầu thấy hơi hụt hơi, nghỉ vài phút hết. Thỉnh thoảng khò khè lúc sáng. Không khó thở khi nghỉ.","e"],["Hút thuốc bao nhiêu, bao lâu? Môi trường làm việc, tiếp xúc bụi?","Hút 1 bao mỗi ngày gần 30 năm. Lái xe, hay hít khói bụi đường.","e"],["Cảm giác ngực, ăn uống, đại tiện thế nào?","Ngực đầy tức, nặng nề, ăn kém, bụng đầy. Người hay buồn ngủ, thân thể nặng. Đại tiện nhão.","e"],["Có sợ lạnh hay khát nước, thích uống nóng hay lạnh?","Sợ lạnh nhẹ, ít khát, thích uống nước ấm.","n"],["Có ợ chua, trào ngược, ho nhiều về đêm không? Tiền sử hen, lao, bệnh tim?","Thỉnh thoảng ợ chua. Chưa từng mắc lao, hen hay bệnh tim. Cũng chưa đo chức năng hô hấp bao giờ.","n"],["Đã dùng thuốc gì? Đã tiêm vắc xin cúm, phế cầu chưa?","Uống kháng sinh 2 đợt không rõ loại, đỡ ít. Chưa tiêm vắc xin nào.","n"]],"exam":[["V","Thần sắc, thể trạng","Thể trạng béo nhẹ, sắc mặt xám, tinh thần tỉnh táo. Không xanh tím, không phù.","n"],["V","Lưỡi","Chất lưỡi nhạt bệu, rêu trắng dày nhớt.","e"],["V","Lồng ngực, ngón tay","Lồng ngực bình thường, không co kéo cơ hô hấp phụ. Ngón tay không dùi trống.","n"],["M","Tiếng ho, đờm","Ho khạc nặng tiếng, đờm trắng dính trong ống. Hơi thở không hôi.","e"],["T","Mạch","Mạch hoạt, hoãn.","e"],["T","Sờ tay chân, bụng","Tay chân ấm, bụng đầy nhẹ, mềm.","n"],["K","Nghe phổi","Rì rào phế nang giảm nhẹ hai đáy, ran ngáy rải rác, vài ran rít cuối thì thở ra. Không ran nổ cố định.","e"],["K","Khám tim, bụng, hạch","Tim đều, không âm thổi. Gan lách không to. Không phù chi dưới, hạch cổ không to.","n"],["K","Đo SpO2, nhịp thở","SpO2 96 phần trăm khí phòng, nhịp thở 19 lần mỗi phút, nói được câu dài.","n"]],"tests":[["X-quang ngực thẳng",10,"Tăng đậm rốn phổi hai bên, không thấy khối, không đông đặc, không tràn dịch màng phổi.","e"],["Đo hô hấp ký (chức năng thông khí) sau test giãn phế quản",25,"FEV1/FVC sau test 0,74, FEV1 90 phần trăm trị số dự đoán. Chưa thấy tắc nghẽn luồng khí cố định.","e"],["Công thức máu",10,"Bạch cầu 8,2 G/L, trung tính bình thường. Hb 15 g/dL.","n"],["Soi đờm tìm AFB hoặc Xpert MTB/RIF",60,"Âm tính.","n"],["CT ngực có cản quang",40,"Không có chỉ định ở lần khám đầu khi X-quang không bất thường và không có dấu hiệu báo động.","w"],["Nội soi phế quản",60,"Không có chỉ định ở ca này.","w"]],"opt":{"ydx":["+Viêm phế quản mạn, cần đo hô hấp ký để loại trừ COPD","Lao phổi","Ung thư phế quản","Hen phế quản","Giãn phế quản"],"bd":["+Khái thấu","Háo suyễn","Phế ung","Hung tý","Phế nuy"],"bc":["+Lý – Thực – Hàn","Biểu – Thực – Hàn","Lý – Thực – Nhiệt","Lý – Hư – Nhiệt","Biểu – Hư – Hàn"],"the":["+Đàm thấp trở phế (Tỳ hư sinh đàm)","Phong hàn phạm phế","Đàm nhiệt úng phế","Phế âm hư","Can hỏa phạm phế"],"phap":["+Kiện tỳ táo thấp, hóa đàm chỉ khái","Sơ phong tán hàn, tuyên phế","Thanh nhiệt hóa đàm","Tư âm nhuận phế","Bình can giáng nghịch"],"phuong":["+Nhị trần thang","~Tam tử dưỡng thân thang","Tang cúc ẩm","Thanh khí hóa đàm hoàn","Bách hợp cố kim thang"],"huyet":["+Phế du","+Phong long","+Túc tam lý","+Thiên đột","+Liệt khuyết","Thái xung","Hành gian","Dương lăng tuyền","Giải khê"]},"actions":["+Tư vấn bỏ thuốc lá, hướng dẫn hỗ trợ cai thuốc|5|Bỏ thuốc là biện pháp quan trọng nhất làm chậm tiến triển bệnh phổi mạn.","+Tiêm phòng cúm hằng năm và phế cầu theo khuyến cáo|2|Giảm đợt cấp, biến chứng nhiễm trùng hô hấp.","+Hướng dẫn tập thở, tránh khói bụi, đeo khẩu trang|3|Hỗ trợ thông khí, giảm kích thích đường thở.","+Châm hoặc cứu Phế du, Phong long, Túc tam lý|20|Kiện tỳ hóa đàm, hỗ trợ giảm ho đờm.","+Hẹn tái khám, đánh giá lại hô hấp ký, theo dõi SpO2|2|Theo dõi diễn tiến, phát hiện COPD.","+Dặn tái khám khẩn khi ho ra máu, sụt cân, khó thở tăng, sốt kéo dài, khàn tiếng trên 3 tuần|2|Sàng lọc dấu hiệu báo động ung thư phổi, lao.","-Chỉ định CT ngực ngay lần đầu|40|Chưa có chỉ định khi X-quang bình thường và không có dấu hiệu báo động.","!Cho thuốc ức chế ho trung ương mạnh (codein) khi đờm nhiều|1|Ứ đờm, nguy cơ bội nhiễm, không phù hợp ho nhiều đờm.","!Dùng kháng sinh phổ rộng kéo dài khi đờm trắng, không sốt|3|Không có bằng chứng nhiễm khuẩn, tăng nguy cơ kháng thuốc."],"teach":"Ho khạc đờm hơn 3 tháng mỗi năm ở người hút thuốc là viêm phế quản mạn; hô hấp ký sau giãn phế quản quyết định có COPD hay không. Thể Đàm thấp trở phế: đờm trắng dính nhiều, ngực đầy, rêu trắng dày nhớt, mạch hoạt. Phải sàng lọc ho ra máu, sụt cân, sốt chiều, khàn tiếng để loại trừ lao và ung thư phổi, kèm khuyên bỏ thuốc lá.","hbu":{"tien_su":"Hút thuốc 1 bao mỗi ngày gần 30 năm, làm tài xế hay hít khói bụi đường. Những năm trước cũng ho khạc đờm vài tháng mỗi năm. Chưa từng mắc lao, hen hay bệnh tim; thỉnh thoảng ợ chua; chưa đo chức năng hô hấp và chưa tiêm vắc xin cúm hoặc phế cầu. Đã uống kháng sinh 2 đợt không rõ loại, đỡ ít.","luoc_qua_co_quan":"Hô hấp có ho khạc đờm trắng dính hằng ngày, chủ yếu buổi sáng, hụt hơi khi leo 2 tầng lầu, thỉnh thoảng khò khè buổi sáng; không ho ra máu, không đau ngực, giọng bình thường. Tim mạch không phù chi dưới. Tiêu hóa có đầy bụng, ăn kém, đại tiện nhão, thỉnh thoảng ợ chua. Không sốt, không ra mồ hôi trộm, không sụt cân đáng kể. Theo YHCT, ngực đầy tức, thân thể nặng nề, hay buồn ngủ, sợ lạnh nhẹ, ít khát, thích uống nước ấm.","tom_tat":"Nam 58 tuổi, tài xế, hút thuốc khoảng 30 gói-năm, ho khạc đờm trắng dính hằng ngày vào buổi sáng gần 4 tháng, những năm trước cũng ho nhiều tháng mỗi năm, hụt hơi nhẹ khi gắng sức. Khám phổi rì rào phế nang giảm nhẹ hai đáy, ran ngáy rải rác, vài ran rít cuối thì thở ra, SpO2 96%, không dùi trống, không phù, không hạch. X-quang ngực tăng đậm rốn phổi, không khối hay đông đặc; hô hấp ký sau test giãn phế quản FEV1/FVC 0,74, FEV1 90% dự đoán; AFB hoặc Xpert âm tính. Theo YHCT, lưỡi nhạt bệu rêu trắng dày nhớt, mạch hoạt hoãn.","dat_van_de":"Ho khạc đờm kéo dài trên 3 tháng mỗi năm ở người hút thuốc lâu năm, kèm hụt hơi nhẹ khi gắng sức và dấu hiệu ran phổi rải rác. Chưa có dấu báo động như ho ra máu, sụt cân, sốt chiều. Chứng trạng YHCT gồm ho đờm trắng dính nhiều, ngực đầy, thân nặng, rêu trắng dày nhớt, mạch hoạt.","bien_luan":"Ho khạc đờm hằng ngày kéo dài nhiều tháng mỗi năm ở người hút thuốc phù hợp viêm phế quản mạn; hô hấp ký sau giãn phế quản có FEV1/FVC 0,74, trên 0,70 nên chưa chứng minh tắc nghẽn luồng khí cố định, do đó chưa chẩn đoán COPD tại thời điểm này nhưng cần theo dõi vì nguy cơ cao. Lao phổi ít gợi ý vì không sốt chiều, mồ hôi trộm, sụt cân và AFB hoặc Xpert âm tính; ung thư phổi ít gợi ý khi không ho ra máu, khàn tiếng, sụt cân và X-quang không khối, nhưng người hút thuốc lâu năm cần sàng lọc theo chỉ định. Hen phế quản ít phù hợp vì chưa có khò khè rõ, không tiền sử hen, test giãn phế quản không đáp ứng rõ; trào ngược dạ dày thực quản có thể góp phần gây ho nên cần đánh giá nếu ho dai dẳng sau bỏ thuốc. Cần tư vấn bỏ thuốc lá, tiêm phòng, đo lại hô hấp ký định kỳ. Theo các khóa YHCT của ca, bệnh danh Khái thấu, bát cương Lý–Thực–Hàn, thể Đàm thấp trở phế (Tỳ hư sinh đàm); pháp kiện tỳ táo thấp, hóa đàm chỉ khái, phối hợp với điều trị y học hiện đại.","sinh_ly_benh":"Khói thuốc và bụi kích thích niêm mạc phế quản gây viêm mạn, tăng sản tuyến nhầy và giảm vận chuyển nhầy lông chuyển, làm đờm ứ đọng và ho kéo dài. Viêm kéo dài có thể dần dẫn đến hẹp đường thở và COPD ở một số người. Theo YHCT, Tỳ hư sinh đàm thấp, đàm thấp ứ ở phế làm phế khí mất túc giáng, gây ho đờm nhiều và ngực đầy.","tien_luong":"Gần: triệu chứng thường giảm khi bỏ thuốc lá và tránh khói bụi. Xa: nguy cơ tiến triển COPD, nhiễm trùng đường hô hấp tái diễn và ung thư phổi nếu tiếp tục hút thuốc; cần theo dõi hô hấp ký định kỳ. Theo YHCT, đánh giá lại lượng đờm và tình trạng đầy bụng sau điều trị.","du_phong":"Bỏ thuốc lá với hỗ trợ cai thuốc, tránh khói bụi và đeo khẩu trang khi lái xe. Tiêm phòng cúm hằng năm và phế cầu theo khuyến cáo, tập thở. Tái khám đo lại hô hấp ký và theo dõi SpO2; tái khám khẩn khi ho ra máu, sụt cân, khó thở tăng, sốt kéo dài hoặc khàn tiếng trên 3 tuần. Châm cứu hoặc thuốc YHCT chỉ hỗ trợ theo chỉ định."},"nguon":["Global Initiative for Chronic Obstructive Lung Disease, Global Strategy for the Diagnosis, Management, and Prevention of COPD, 2025 Report.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"kham-dau-nua-dau-can-duong","title":"Đau nửa đầu từng cơn, buồn nôn sợ ánh sáng","kind":"Nội","level":"Trung bình","group":"noi","place":"Phòng khám Nội YHCT","clock":"14:00","name":"Chị Đỗ Thị Thu Hà","age":34,"sex":"nữ","intro":"Phòng khám Nội YHCT. Chị là kế toán, đến khám vì đau nửa đầu bên phải từng cơn khoảng 2 năm, những tháng gần đây dày hơn khi áp lực công việc.","vitals":{"hr":78,"sbp":112,"dbp":70,"rr":16,"t":36.7,"spo2":99},"ask":[["Đau ở đâu, tính chất đau thế nào, mỗi cơn kéo dài bao lâu?","Đau nửa đầu bên phải, thường từ thái dương lan ra sau mắt, đau theo nhịp mạch đập. Mỗi cơn 6 đến 24 giờ, 2 đến 3 cơn mỗi tháng.","e"],["Có buồn nôn, nôn, sợ ánh sáng, sợ tiếng ồn khi đau không?","Buồn nôn nhiều, từng nôn một lần. Phải nằm phòng tối, yên tĩnh. Vận động làm đau tăng.","e"],["Có thấy ánh sáng nhấp nháy, tê, yếu liệt hay rối loạn nói trước hoặc trong cơn không?","Không có ánh sáng nhấp nháy, không tê, không yếu liệt, không nói khó.","e"],["Cơn đau đầu này có khác trước, đau đột ngột dữ dội như sét đánh, sốt, cứng gáy không?","Cơn đau vẫn giống những năm trước, không đột ngột dữ dội, không sốt, không cứng gáy.","e"],["Có yếu tố khởi phát: căng thẳng, thiếu ngủ, bỏ bữa, rượu, mùi mạnh, kỳ kinh?","Dễ lên cơn khi nóng giận, căng thẳng kéo dài, thiếu ngủ, hay trước kỳ kinh 1 đến 2 ngày.","e"],["Cảm giác nóng giận, miệng đắng, ngủ, đại tiểu tiện?","Dễ cáu gắt, miệng đắng, họng khô, mắt hay đỏ. Ngủ hay mộng mị, đại tiện táo, nước tiểu vàng.","e"],["Đã dùng thuốc giảm đau gì, bao nhiêu ngày mỗi tháng? Có dùng thuốc tránh thai không?","Uống paracetamol khoảng 4 ngày mỗi tháng thì đỡ ít. Không dùng thuốc tránh thai.","n"],["Có tiền sử gia đình đau nửa đầu, bệnh lý mạch máu não, chấn thương đầu gần đây không?","Mẹ bị đau nửa đầu. Không chấn thương đầu, không bệnh mạch máu não.","n"],["Thị lực, chóng mặt, ù tai?","Thị lực bình thường. Thỉnh thoảng hơi choáng khi đau. Không ù tai.","n"]],"exam":[["V","Thần sắc","Sắc mặt hơi đỏ, mắt đỏ nhẹ, vẻ mặt căng thẳng, dễ kích động.","n"],["V","Lưỡi","Chất lưỡi đỏ, rêu vàng mỏng.","e"],["M","Giọng nói, hơi thở","Giọng nói to, nhanh, hơi thở hơi nóng, không hôi.","n"],["T","Mạch","Mạch huyền, sác.","e"],["T","Ấn huyệt vùng đầu cổ","Ấn đau vùng thái dương phải và cơ thang hai bên. Không cứng gáy.","n"],["K","Khám thần kinh","Tỉnh táo, đồng tử đều, vận động và cảm giác bình thường, phản xạ gân xương bình thường, dấu Babinski âm tính, không dấu màng não.","e"],["K","Soi đáy mắt","Gai thị bờ rõ, không phù gai thị.","e"],["K","Đo huyết áp hai tay, khám tim phổi","Huyết áp 112 trên 70 mmHg hai tay đều. Tim phổi bình thường.","n"],["K","Khám vùng mặt, xoang, hàm","Không đau vùng xoang, khớp thái dương hàm không đau.","n"]],"tests":[["Công thức máu, tốc độ máu lắng",15,"Bình thường.","n"],["Đường huyết mao mạch",5,"5,2 mmol/L.","n"],["Nhật ký đau đầu và thang điểm tàn tật MIDAS",15,"Điểm MIDAS cho thấy ảnh hưởng mức vừa.","n"],["MRI sọ não",45,"Không bất thường. Không có chỉ định ở đau nửa đầu điển hình, khám thần kinh bình thường.","w"],["CT sọ não",20,"Không bất thường. Không có chỉ định ở ca này.","w"],["Điện não đồ",30,"Không đặc hiệu. Không có chỉ định để chẩn đoán đau nửa đầu.","w"]],"opt":{"ydx":["+Đau nửa đầu không có aura (migraine)","Đau đầu căng thẳng","Đau đầu cụm","Xuất huyết dưới nhện","Viêm xoang cấp"],"bd":["+Thiên đầu thống","Huyễn vựng","Trúng phong","Đầu thống do ngoại cảm","Tỵ uyên"],"bc":["+Lý – Thực – Nhiệt","Biểu – Thực – Hàn","Lý – Hư – Hàn","Biểu – Thực – Nhiệt","Lý – Hư – Nhiệt"],"the":["+Can dương thượng cang","Phong hàn thượng phạm","Đàm trọc thượng nhiễu","Huyết ứ trở lạc","Khí huyết lưỡng hư"],"phap":["+Bình can tiềm dương, tức phong chỉ thống","Sơ phong tán hàn chỉ thống","Hóa đàm giáng nghịch","Hoạt huyết hóa ứ thông lạc","Bổ ích khí huyết"],"phuong":["+Thiên ma câu đằng ẩm","~Long đởm tả can thang","Xuyên khung trà điều tán","Bán hạ bạch truật thiên ma thang","Quy tỳ thang"],"huyet":["+Phong trì","+Thái dương","+Suất cốc","+Thái xung","+Hợp cốc","Quan nguyên","Tỳ du","Thận du","Túc tam lý"]},"actions":["+Hướng dẫn ghi nhật ký đau đầu, nhận diện và tránh yếu tố khởi phát|5|Nền tảng điều trị dự phòng đau nửa đầu.","+Vệ sinh giấc ngủ, ăn đúng bữa, giảm căng thẳng, vận động đều|3|Giảm tần suất cơn.","+Châm Phong trì, Thái dương, Suất cốc, Thái xung, Hợp cốc|20|Bình can tiềm dương, giảm đau.","+Hướng dẫn dùng thuốc cắt cơn sớm theo phác đồ YHHĐ (NSAID, triptan nếu không chống chỉ định)|3|Thuốc cắt cơn hiệu quả khi dùng sớm.","+Dặn tái khám khẩn khi đau đột ngột dữ dội, sốt, cứng gáy, yếu liệt, rối loạn nói, ngất, đau đầu kiểu mới thay đổi|2|Sàng lọc dấu hiệu cảnh báo đau đầu thứ phát.","+Hẹn tái khám, giới hạn thuốc giảm đau không quá 10 ngày mỗi tháng|2|Tránh đau đầu do lạm dụng thuốc.","-Chụp MRI sọ não thường quy|45|Đau nửa đầu điển hình, khám thần kinh bình thường, không có dấu hiệu báo động.","!Kê thuốc opioid (codein, tramadol) hoặc thuốc giảm đau dùng hằng ngày|1|Không khuyến cáo, nguy cơ phụ thuộc và đau đầu do lạm dụng thuốc.","!Cho thuốc ôn nhiệt cay nóng (Phụ tử, Can khương, Quế chi liều cao)|2|Thể Can dương thượng cang, thuốc ôn nhiệt làm dương cang nặng thêm."],"teach":"Đau nửa đầu một bên, đập theo mạch, 6 đến 24 giờ, buồn nôn, sợ ánh sáng và tiếng ồn, khám thần kinh bình thường là đủ chẩn đoán lâm sàng; không cần chẩn đoán hình ảnh thường quy. Thể Can dương thượng cang: cáu gắt, miệng đắng, lưỡi đỏ rêu vàng mỏng, mạch huyền sác. Phải loại trừ dấu hiệu cảnh báo: đau sét đánh, sốt cứng gáy, triệu chứng thần kinh khu trú, khởi phát sau 50 tuổi, phù gai thị.","hbu":{"tien_su":"Mẹ bị đau nửa đầu. Đau nửa đầu bên phải từng cơn khoảng 2 năm; uống paracetamol khoảng 4 ngày mỗi tháng thì đỡ ít, không dùng thuốc tránh thai. Không chấn thương đầu, không bệnh mạch máu não, chưa có dữ kiện về dị ứng thuốc và bệnh nền khác.","luoc_qua_co_quan":"Thần kinh có đau nửa đầu theo nhịp mạch, buồn nôn, sợ ánh sáng và tiếng ồn, thỉnh thoảng choáng nhẹ khi đau; không ánh sáng nhấp nháy, không tê, yếu liệt hay nói khó, không ù tai, thị lực bình thường. Tiêu hóa có buồn nôn, từng nôn một lần, đại tiện táo. Tim mạch, hô hấp không triệu chứng; tiết niệu nước tiểu vàng. Theo YHCT, cáu gắt, miệng đắng, họng khô, mắt hay đỏ, ngủ mộng mị.","tom_tat":"Nữ 34 tuổi, kế toán, đau nửa đầu phải từng cơn 2 năm, đau theo nhịp mạch từ thái dương ra sau mắt, mỗi cơn 6 đến 24 giờ, 2 đến 3 cơn mỗi tháng, kèm buồn nôn, sợ ánh sáng và tiếng ồn, vận động làm đau tăng, dễ lên cơn khi căng thẳng, thiếu ngủ hoặc trước kỳ kinh; mẹ bị đau nửa đầu. Khám thần kinh bình thường, không dấu màng não, gai thị bờ rõ, huyết áp hai tay 112/70 mmHg; công thức máu, máu lắng, đường huyết bình thường, điểm MIDAS cho thấy ảnh hưởng mức vừa. Theo YHCT, sắc mặt hơi đỏ, lưỡi đỏ rêu vàng mỏng, mạch huyền sác.","dat_van_de":"Đau đầu cơn tái diễn một bên, tính chất mạch đập, kèm buồn nôn, sợ ánh sáng, sợ tiếng ồn và có yếu tố khởi phát, khám thần kinh bình thường, không dấu hiệu cảnh báo. Có dùng thuốc giảm đau và cần giới hạn số ngày dùng. Chứng trạng YHCT gồm cáu gắt, miệng đắng, mắt đỏ, lưỡi đỏ rêu vàng, mạch huyền sác.","bien_luan":"Đau nửa đầu từng cơn kéo dài 6 đến 24 giờ, một bên, tính chất mạch đập, mức độ vừa đến nặng, tăng khi vận động, kèm buồn nôn, sợ ánh sáng và tiếng ồn, không có aura, khám thần kinh bình thường và có tiền sử gia đình, phù hợp đau nửa đầu không có aura theo tiêu chuẩn lâm sàng. Đau đầu căng thẳng ít phù hợp vì đau mạch đập, một bên, nặng lên khi vận động và kèm buồn nôn. Đau đầu do nguyên nhân thứ phát như xuất huyết dưới nhện, viêm màng não, tăng áp lực nội sọ ít gợi ý vì cơn giống các cơn trước, không đau sét đánh, không sốt cứng gáy, không phù gai thị hay dấu thần kinh khu trú; đau đầu do lạm dụng thuốc cần theo dõi vì đã dùng thuốc giảm đau hằng tháng. Không cần chẩn đoán hình ảnh thường quy khi không có dấu cảnh báo. Theo các khóa YHCT của ca, bệnh danh Thiên đầu thống, bát cương Lý–Thực–Nhiệt, thể Can dương thượng cang; pháp bình can tiềm dương, tức phong chỉ thống, phối hợp với thuốc cắt cơn theo phác đồ y học hiện đại.","sinh_ly_benh":"Đau nửa đầu liên quan hoạt hóa hệ thần kinh tam thoa mạch máu, giải phóng các peptid như CGRP gây viêm thần kinh và giãn mạch màng não, tạo cơn đau mạch đập kèm buồn nôn và nhạy cảm với ánh sáng. Căng thẳng, thiếu ngủ và biến động nội tiết quanh kỳ kinh là các yếu tố khởi phát thường gặp; cơ địa gia đình đóng vai trò. Theo YHCT, Can dương thượng cang làm dương khí bốc lên đầu, kèm tình chí uất kết, gây đau đầu từng cơn, mắt đỏ và cáu gắt.","tien_luong":"Gần: các cơn thường đáp ứng khi dùng thuốc cắt cơn sớm và tránh yếu tố khởi phát. Xa: bệnh mạn tính có thể kéo dài nhiều năm với tần suất dao động; nguy cơ đau đầu do lạm dụng thuốc nếu dùng thuốc giảm đau quá nhiều ngày. Theo YHCT, đánh giá lại tình chí, giấc ngủ và tần suất cơn sau điều trị.","du_phong":"Ghi nhật ký đau đầu, nhận diện và tránh yếu tố khởi phát, ngủ đủ, ăn đúng bữa, giảm căng thẳng, vận động đều. Dùng thuốc cắt cơn sớm theo chỉ định, giới hạn thuốc giảm đau không quá 10 ngày mỗi tháng. Tái khám sau theo dõi; tái khám khẩn khi đau đột ngột dữ dội, sốt, cứng gáy, yếu liệt, nói khó, ngất hoặc đau đầu kiểu mới. Châm cứu hoặc thuốc YHCT chỉ hỗ trợ theo chỉ định."},"nguon":["International Headache Society, The International Classification of Headache Disorders, 3rd edition (ICHD-3), 2018.","American Headache Society, The American Headache Society Position Statement on Integrating New Migraine Treatments Into Clinical Practice, 2021.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"kham-thong-ta-ruot-kich-thich","title":"Đau quặn bụng rồi đi ngoài phân nát","kind":"Nội","level":"Trung bình","group":"noi","place":"Phòng khám Nội YHCT","clock":"10:30","name":"Anh Võ Minh Quân","age":38,"sex":"nam","intro":"Phòng khám Nội YHCT. Anh là nhân viên ngân hàng, đến khám vì đau quặn bụng, đi ngoài phân nát nhiều lần mỗi ngày kéo dài khoảng 8 tháng, tăng khi căng thẳng.","vitals":{"hr":80,"sbp":118,"dbp":76,"rr":17,"t":36.7,"spo2":99},"ask":[["Đau bụng ở đâu, tính chất thế nào, liên quan đến đi ngoài ra sao?","Đau quặn quanh bụng dưới và hố chậu trái, đau muốn đi ngoài, đi xong thì đỡ. Đau từng cơn, vài lần mỗi tuần, khoảng 8 tháng nay.","e"],["Đại tiện mấy lần mỗi ngày, phân thế nào, có máu hay nhầy, đi ngoài ban đêm không?","Đi 3 đến 4 lần mỗi ngày, phân nát hoặc sệt, có ít nhầy trắng. Không thấy máu, không đen. Không phải dậy đêm đi ngoài.","e"],["Có sụt cân, sốt, thiếu máu, mệt nhiều không?","Cân nặng ổn định 65 kg. Không sốt. Chỉ hơi mệt, không chóng mặt.","e"],["Có tiền sử gia đình ung thư đại trực tràng, bệnh viêm ruột, bệnh celiac không?","Không ai trong gia đình mắc các bệnh này.","e"],["Triệu chứng nặng lên khi nào?","Nặng hơn khi căng thẳng, áp lực công việc, sau bữa ăn nhiều dầu mỡ, sữa. Cuối tuần nghỉ ngơi thì đỡ.","e"],["Có đầy hơi, ợ hơi, sôi bụng, cảm giác đi chưa hết phân không?","Hay đầy hơi, sôi bụng, sau đi vẫn thấy chưa hết phân.","n"],["Tính tình, ngủ, ăn uống?","Dễ cáu gắt, hay lo lắng, ngủ nông. Ăn kém, sợ ăn nhiều vì sợ đau bụng. Người mệt, ít sức.","e"],["Có sợ lạnh, tay chân lạnh, đi ngoài lúc rạng sáng không?","Không đi ngoài lúc rạng sáng, không đặc biệt sợ lạnh.","n"],["Đã dùng thuốc gì, có dùng kháng sinh gần đây không? Có đi du lịch hay ăn thực phẩm lạ?","Uống men vi sinh và thuốc cầm tiêu chảy đôi lần, đỡ tạm thời. Không dùng kháng sinh, không đi xa gần đây.","n"]],"exam":[["V","Thần sắc, thể trạng","Thể trạng trung bình, sắc mặt hơi vàng nhạt, vẻ lo lắng. Không xanh xao rõ.","n"],["V","Lưỡi","Chất lưỡi nhạt hơi bệu, bên có vết hằn răng, rêu trắng mỏng.","e"],["M","Giọng nói, hơi thở, bụng","Hay thở dài. Hơi thở không hôi. Nghe bụng nhu động ruột tăng nhẹ.","n"],["T","Mạch","Mạch huyền, hoãn (huyền ở bộ quan trái, hoãn nhược ở bộ quan phải).","e"],["T","Sờ tay chân","Tay chân không lạnh, hơi ẩm.","n"],["K","Khám bụng","Bụng mềm, ấn đau nhẹ hố chậu trái, không phản ứng thành bụng, không khối, gan lách không to.","e"],["K","Thăm trực tràng","Trương lực cơ thắt bình thường, không khối, găng không dính máu.","e"],["K","Khám da, niêm mạc, tuyến giáp","Niêm mạc mắt hồng, không loét miệng, tuyến giáp không to.","n"]],"tests":[["Công thức máu",10,"Hb 14,2 g/dL, bạch cầu bình thường.","e"],["CRP",15,"Bình thường.","e"],["Calprotectin phân",60,"Dưới 50 microgam mỗi gam (bình thường).","e"],["Soi phân, cấy phân, tìm ký sinh trùng",30,"Không bạch cầu, hồng cầu, không có ký sinh trùng.","n"],["Kháng thể kháng transglutaminase mô IgA",60,"Âm tính.","n"],["CT bụng có cản quang",40,"Không bất thường. Không có chỉ định ở ca này.","w"]],"opt":{"ydx":["+Hội chứng ruột kích thích thể tiêu chảy (theo tiêu chuẩn Rome IV)","Viêm loét đại trực tràng chảy máu","Bệnh Crohn","Ung thư đại tràng","Bệnh celiac"],"bd":["+Thống tả","Lỵ","Phúc thống","Táo bón","Tiện huyết"],"bc":["+Lý – Hư thực thác tạp – Hàn","Biểu – Thực – Hàn","Lý – Thực – Nhiệt","Lý – Hư – Nhiệt","Biểu – Hư – Hàn"],"the":["+Can uất tỳ hư (Can khí phạm Tỳ)","Thấp nhiệt đại trường","Tỳ thận dương hư","Thực tích đình trệ","Hàn thấp khốn tỳ"],"phap":["+Sơ can kiện tỳ, ức can phù tỳ, chỉ tả","Thanh nhiệt lợi thấp, chỉ tả","Ôn bổ tỳ thận, cố sáp chỉ tả","Tiêu thực đạo trệ","Ôn trung tán hàn, hóa thấp"],"phuong":["+Thống tả yếu phương","~Sâm linh bạch truật tán","Cát căn cầm liên thang","Tứ thần hoàn","Bảo hòa hoàn"],"huyet":["+Thiên khu","+Túc tam lý","+Tỳ du","+Thái xung","+Âm lăng tuyền","Đại chùy","Thái dương","Phế du","Dũng tuyền"]},"actions":["+Giải thích bản chất hội chứng ruột kích thích, trấn an, khuyên giảm căng thẳng|5|Ca chức năng, liệu pháp giáo dục, tâm lý có lợi.","+Ghi nhật ký ăn uống, hạn chế thực phẩm gây khởi phát (dầu mỡ, sữa, rượu, caffeine, thực phẩm nhiều FODMAP)|4|Thay đổi chế độ ăn giúp giảm triệu chứng.","+Châm cứu Thiên khu, Túc tam lý, Tỳ du, Thái xung|20|Sơ can kiện tỳ, điều hòa vận hóa.","+Hướng dẫn tập thể dục đều, ngủ đủ, kỹ thuật thư giãn|3|Điều hòa trục ruột não.","+Hẹn tái khám 4 đến 6 tuần, nội soi đại tràng nếu xuất hiện dấu hiệu báo động (đi ngoài ra máu, sụt cân, thiếu máu, tiêu chảy đêm, khối bụng)|2|Sàng lọc dấu hiệu cảnh báo bệnh thực thể.","+Dùng thuốc YHHĐ triệu chứng khi cần (chống co thắt, men vi sinh) theo chỉ định|2|Hỗ trợ giảm đau bụng, tiêu chảy.","-Chụp CT bụng có cản quang|40|Không có chỉ định ở ca không dấu hiệu báo động.","!Cho thuốc tả hạ công trục (Đại hoàng, Mang tiêu) vì nghĩ là thực tích|2|Thể Can uất tỳ hư, thuốc tả hạ làm tỳ vị tổn thương, tiêu chảy nặng thêm.","!Dùng kháng sinh phổ rộng kéo dài|3|Không có bằng chứng nhiễm khuẩn, gây rối loạn hệ vi sinh đường ruột."],"teach":"Đau bụng liên quan đại tiện, thay đổi tính chất phân, không sụt cân, không máu, xét nghiệm viêm và calprotectin bình thường gợi ý hội chứng ruột kích thích thể tiêu chảy. Thể Can uất Tỳ hư: đau muốn đi ngoài, đi xong thì đỡ, tăng khi căng thẳng, lưỡi nhạt bệu hằn răng, mạch huyền hoãn. Bắt buộc sàng lọc dấu hiệu báo động (máu trong phân, sụt cân, thiếu máu, tiêu chảy đêm, khởi phát sau 50 tuổi, tiền sử gia đình) để chỉ định nội soi và loại trừ bệnh viêm ruột, ung thư.","hbu":{"tien_su":"Không có tiền sử gia đình ung thư đại trực tràng, bệnh viêm ruột hay bệnh celiac. Không dùng kháng sinh gần đây, không đi xa hoặc ăn thực phẩm lạ. Đã tự uống men vi sinh và thuốc cầm tiêu chảy đôi lần, chỉ đỡ tạm thời. Chưa có dữ kiện về phẫu thuật bụng, dị ứng và bệnh nền khác.","luoc_qua_co_quan":"Tiêu hóa có đau quặn bụng dưới và hố chậu trái muốn đi ngoài, đi xong đỡ, đại tiện 3 đến 4 lần mỗi ngày phân nát hoặc sệt có ít nhầy trắng, đầy hơi, sôi bụng, cảm giác đi chưa hết phân; không máu, không phân đen, không đi ngoài ban đêm hay rạng sáng. Toàn thân không sốt, cân nặng ổn định 65 kg, hơi mệt. Tim mạch, hô hấp, tiết niệu không bất thường. Theo YHCT, dễ cáu gắt, lo lắng, ngủ nông, ăn kém, không sợ lạnh đặc biệt.","tom_tat":"Nam 38 tuổi, nhân viên ngân hàng, đau quặn bụng dưới và hố chậu trái muốn đi ngoài, đi xong thì đỡ, kèm đi ngoài phân nát hoặc sệt 3 đến 4 lần mỗi ngày có ít nhầy, kéo dài khoảng 8 tháng, tăng khi căng thẳng và sau bữa nhiều dầu mỡ hoặc sữa, không máu, không sụt cân, không sốt, không đi ngoài đêm. Khám bụng mềm, ấn đau nhẹ hố chậu trái, không phản ứng thành bụng, không khối; thăm trực tràng không khối, găng không dính máu. Công thức máu, CRP, calprotectin phân, soi và cấy phân, kháng thể kháng transglutaminase mô đều bình thường hoặc âm tính. Theo YHCT, lưỡi nhạt bệu có vết hằn răng, mạch huyền hoãn.","dat_van_de":"Đau bụng mạn tính liên quan đại tiện kèm thay đổi tính chất phân dạng tiêu chảy kéo dài 8 tháng, không có dấu hiệu báo động, các xét nghiệm viêm và nhiễm trùng không bất thường. Yếu tố căng thẳng và thức ăn làm nặng triệu chứng. Chứng trạng YHCT gồm đau muốn đi ngoài, đi xong thì đỡ, cáu gắt, lưỡi bệu hằn răng, mạch huyền hoãn.","bien_luan":"Đau bụng tái diễn liên quan đại tiện, thay đổi tần suất và hình dạng phân, kéo dài trên 6 tháng, không dấu hiệu báo động và xét nghiệm viêm, nhiễm trùng, celiac bình thường phù hợp hội chứng ruột kích thích thể tiêu chảy theo tiêu chuẩn Rome IV. Bệnh viêm ruột ít phù hợp vì không máu trong phân, không sụt cân, không thiếu máu, CRP và calprotectin phân bình thường; nhiễm trùng hoặc ký sinh trùng ít gợi ý vì soi, cấy phân âm tính, không dùng kháng sinh gần đây; bệnh celiac ít phù hợp khi kháng thể IgA âm tính. Ung thư đại trực tràng ít gợi ý ở người 38 tuổi không dấu báo động nhưng cần nội soi đại tràng nếu xuất hiện máu trong phân, sụt cân, thiếu máu, tiêu chảy đêm hoặc khối bụng. Theo các khóa YHCT của ca, bệnh danh Thống tả, bát cương Lý–Hư thực thác tạp–Hàn, thể Can uất Tỳ hư (Can khí phạm Tỳ); pháp sơ can kiện tỳ, ức can phù tỳ, chỉ tả, phối hợp với giải thích, điều chỉnh ăn uống và thuốc triệu chứng theo y học hiện đại.","sinh_ly_benh":"Hội chứng ruột kích thích liên quan rối loạn tương tác ruột và não, tăng nhạy cảm nội tạng, thay đổi vận động ruột, và có thể liên quan hệ vi sinh vật đường ruột cùng viêm nhẹ ở niêm mạc; căng thẳng tâm lý làm nặng triệu chứng. Thức ăn nhiều dầu mỡ, sữa hoặc thực phẩm nhiều FODMAP có thể kích hoạt. Theo YHCT, Can khí uất kết phạm Tỳ làm Tỳ mất kiện vận, thủy thấp chảy xuống đại trường gây đau quặn rồi đi ngoài phân nát.","tien_luong":"Gần: triệu chứng thường cải thiện khi người bệnh hiểu bệnh, giảm căng thẳng và điều chỉnh ăn uống. Xa: bệnh mạn tính dao động, không làm tăng nguy cơ ung thư hay tử vong nhưng có thể ảnh hưởng chất lượng sống. Theo YHCT, đánh giá lại tình chí và chức năng tiêu hóa sau điều trị.","du_phong":"Ghi nhật ký ăn uống, hạn chế thực phẩm khởi phát như dầu mỡ, sữa, rượu, caffeine, thực phẩm nhiều FODMAP; tập thể dục đều, ngủ đủ, học kỹ thuật thư giãn. Tái khám sau 4 đến 6 tuần; nội soi đại tràng khi xuất hiện máu trong phân, sụt cân, thiếu máu, tiêu chảy đêm hoặc khối bụng. Thuốc chống co thắt, men vi sinh dùng khi cần theo chỉ định; châm cứu hoặc thuốc YHCT chỉ hỗ trợ."},"nguon":["American College of Gastroenterology, ACG Clinical Guideline: Management of Irritable Bowel Syndrome, 2021.","Rome Foundation, Rome IV Functional Gastrointestinal Disorders, 2016.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"kham-thong-kinh-khi-tre-huyet-u","title":"Đau bụng dưới dữ dội mỗi kỳ kinh","kind":"Sản phụ khoa","level":"Trung bình","group":"sannhi","place":"Phòng khám Sản phụ khoa YHCT","clock":"16:20","name":"Cô Lê Thu Trang","age":21,"sex":"nữ","intro":"Phòng khám Sản phụ khoa YHCT. Cô là sinh viên, đến khám vì đau bụng dưới dữ dội mỗi kỳ kinh khoảng 6 năm, mấy tháng nay phải nghỉ học vào ngày đầu.","vitals":{"hr":82,"sbp":106,"dbp":66,"rr":16,"t":36.6,"spo2":99},"ask":[["Đau bụng kinh bắt đầu từ khi nào, đau ở đâu, kéo dài bao lâu?","Có kinh năm 13 tuổi, đau từ khoảng 15 tuổi. Đau quặn bụng dưới, lan ra thắt lưng, bắt đầu trước kỳ kinh 1 đến 2 ngày và nặng nhất ngày đầu, kéo dài 2 đến 3 ngày.","e"],["Tính chất kinh nguyệt: chu kỳ, lượng, màu máu, máu cục?","Chu kỳ 28 đến 30 ngày đều. Lượng vừa, màu tối, nhiều máu cục. Ra máu cục xong thì đỡ đau.","e"],["Đau có đỡ khi chườm ấm hay xoa bóp không? Đau trướng hay đau quặn?","Đau trướng, quặn, ấn vào thì đau hơn. Chườm ấm đỡ một phần. Vú căng tức trước kỳ kinh.","e"],["Có ra khí hư bất thường, sốt, đau bụng ngoài kỳ kinh, đau khi quan hệ không?","Không ra khí hư hôi, không sốt. Không đau bụng ngoài kỳ kinh. Chưa có quan hệ tình dục.","e"],["Có đau tăng dần theo thời gian, đau không đáp ứng thuốc giảm đau, rong huyết ngoài kỳ không?","Đau ổn định, uống ibuprofen đầu kỳ thì giảm khá. Không ra huyết ngoài kỳ kinh.","e"],["Có buồn nôn, tiêu chảy, mệt lả, ngất khi đau không?","Buồn nôn nhẹ, không ngất, không tiêu chảy.","n"],["Tính tình, giấc ngủ, ăn uống?","Hay cáu gắt trước kỳ kinh, tức ngực, ngủ ngon. Ăn bình thường.","n"],["Có sợ lạnh, tay chân lạnh, đau tăng khi trời lạnh?","Không đặc biệt sợ lạnh.","n"],["Tiền sử gia đình (mẹ, chị) có đau bụng kinh nặng, lạc nội mạc tử cung, u xơ?","Mẹ cũng từng đau bụng kinh khi trẻ, đã đỡ sau sinh. Không ai mắc lạc nội mạc tử cung.","n"]],"exam":[["V","Thần sắc","Sắc mặt hơi sạm, vẻ mặt khó chịu nhưng tỉnh táo, không xanh xao.","n"],["V","Lưỡi","Chất lưỡi tím tối, có điểm ứ huyết hai bên rìa, rêu trắng mỏng.","e"],["M","Giọng nói, hơi thở","Hay thở dài, giọng nói bình thường.","n"],["T","Mạch","Mạch huyền, sáp.","e"],["T","Ấn bụng dưới, sờ tay chân","Bụng dưới ấn đau, cự án. Tay chân không lạnh.","n"],["K","Khám bụng","Bụng mềm, ấn đau nhẹ trên xương mu, không phản ứng thành bụng, không khối vùng chậu, không dấu hiệu viêm phúc mạc.","e"],["K","Khám tổng quát","Không sốt, niêm mạc hồng, tuyến giáp không to. Chỉ số khối cơ thể 20,5.","n"],["K","Khám vú và hạch","Vú không khối, hơi căng tức. Không hạch.","n"]],"tests":[["Thử thai nhanh hoặc beta hCG",10,"Âm tính.","e"],["Siêu âm bụng, tử cung và phần phụ",20,"Tử cung kích thước bình thường, không u xơ, không u nang buồng trứng, không dịch túi cùng.","e"],["Công thức máu",10,"Hb 12,8 g/dL, bình thường.","n"],["Xét nghiệm dịch âm đạo, tìm tác nhân viêm nhiễm",20,"Không có tác nhân bệnh. Không có chỉ định thường quy ở ca chưa quan hệ tình dục.","n"],["CA-125",60,"Bình thường. Không có chỉ định ở ca không nghi ung thư buồng trứng hay lạc nội mạc tử cung nặng.","w"],["MRI vùng chậu",50,"Không bất thường. Không có chỉ định ở lần khám đầu khi siêu âm bình thường.","w"]],"opt":{"ydx":["+Đau bụng kinh nguyên phát","Lạc nội mạc tử cung","Bệnh viêm vùng chậu mạn","Thai ngoài tử cung","U nang buồng trứng"],"bd":["+Thống kinh","Kinh nguyệt không đều","Băng lậu","Phúc thống","Bế kinh"],"bc":["+Lý – Thực (huyết ứ, khí trệ)","Biểu – Thực – Hàn","Lý – Hư – Hàn","Lý – Hư – Nhiệt","Biểu – Hư – Nhiệt"],"the":["+Khí trệ huyết ứ","Hàn thấp ngưng trệ","Khí huyết hư nhược","Can thận hư tổn","Thấp nhiệt uẩn kết"],"phap":["+Hành khí hoạt huyết, hóa ứ chỉ thống","Ôn kinh tán hàn, trừ thấp","Bổ ích khí huyết","Tư dưỡng can thận","Thanh nhiệt lợi thấp"],"phuong":["+Cách hạ trục ứ thang","~Thiếu phúc trục ứ thang","Ôn kinh thang","Bát trân thang","Thanh nhiệt điều huyết thang"],"huyet":["+Tam âm giao","+Thái xung","+Huyết hải","+Khí hải","+Quan nguyên","Phong trì","Thái dương","Phế du","Dũng tuyền"]},"actions":["+Giải thích đây là đau bụng kinh nguyên phát, trấn an, hướng dẫn chườm ấm bụng dưới|3|Cải thiện triệu chứng, giảm lo lắng.","+Dùng thuốc giảm đau kháng viêm không steroid (NSAID) từ trước hoặc đầu kỳ kinh theo chỉ định nếu không chống chỉ định|2|Điều trị đầu tay theo YHHĐ.","+Châm hoặc cứu Tam âm giao, Quan nguyên, Khí hải, Huyết hải, Thái xung|20|Hành khí hoạt huyết, thông kinh chỉ thống.","+Hướng dẫn vận động nhẹ, ngủ đủ, hạn chế đồ lạnh, giảm căng thẳng trước kỳ kinh|3|Giảm tần suất, mức độ đau.","+Theo dõi lịch kinh, hẹn tái khám 2 đến 3 chu kỳ, chuyển khám Sản phụ khoa nếu đau tăng dần, không đáp ứng NSAID, ra huyết bất thường hoặc khối vùng chậu|2|Sàng lọc đau bụng kinh thứ phát (lạc nội mạc tử cung).","+Thử thai trước khi dùng thuốc hoạt huyết hoặc châm vùng bụng|1|Loại trừ có thai.","-Chỉ định MRI vùng chậu ngay lần đầu|50|Siêu âm bình thường, không có dấu hiệu thứ phát.","!Dùng thuốc hoạt huyết phá ứ mạnh (Tam lăng, Nga truật, Đào nhân liều cao) khi chưa loại trừ có thai|2|Có nguy cơ sảy thai nếu có thai.","!Ấn mạnh, xoa bóp sâu vùng bụng dưới khi chưa loại trừ thai ngoài tử cung, khối vùng chậu|1|Có nguy cơ vỡ khối, nguy hiểm tính mạng."],"teach":"Đau bụng kinh xuất hiện sau vài năm có kinh, ngay trước hoặc đầu kỳ kinh, đáp ứng NSAID, khám và siêu âm bình thường gợi ý thể nguyên phát. Thể Khí trệ huyết ứ: đau trướng, cự án, máu tối có cục, ra cục thì đỡ, lưỡi tím tối, mạch huyền sáp. Ở phụ nữ trong tuổi sinh sản luôn loại trừ có thai trước khi dùng thuốc hoạt huyết; cảnh báo cần chuyển tuyến: đau tăng dần, đau ngoài kỳ kinh, không đáp ứng thuốc, sốt, khí hư mủ, khối vùng chậu.","hbu":{"tien_su":"Có kinh năm 13 tuổi, đau bụng kinh từ khoảng 15 tuổi, chu kỳ 28 đến 30 ngày đều, lượng vừa, màu tối nhiều máu cục. Chưa quan hệ tình dục. Mẹ từng đau bụng kinh khi trẻ, đã đỡ sau sinh, không ai trong gia đình mắc lạc nội mạc tử cung. Chưa có dữ kiện về bệnh nội ngoại khoa khác và dị ứng thuốc.","luoc_qua_co_quan":"Sản phụ khoa có đau quặn bụng dưới lan ra thắt lưng bắt đầu trước kỳ kinh 1 đến 2 ngày, nặng nhất ngày đầu, ra máu cục xong thì đỡ đau, vú căng tức trước kỳ kinh; không khí hư hôi, không đau bụng ngoài kỳ kinh, không ra huyết ngoài kỳ. Tiêu hóa có buồn nôn nhẹ, không tiêu chảy; thần kinh không ngất, ngủ ngon. Theo YHCT, hay cáu gắt trước kỳ kinh, tức ngực, không sợ lạnh đặc biệt, tay chân không lạnh.","tom_tat":"Nữ 21 tuổi, sinh viên, đau bụng dưới dữ dội mỗi kỳ kinh khoảng 6 năm, những tháng gần đây phải nghỉ học ngày đầu, đau trướng quặn lan thắt lưng bắt đầu trước kỳ kinh 1 đến 2 ngày, kinh đều lượng vừa, máu tối nhiều cục, ra cục thì đỡ, chườm ấm đỡ một phần, uống ibuprofen đầu kỳ giảm khá. Khám bụng mềm, ấn đau nhẹ trên xương mu, không khối vùng chậu, không phản ứng thành bụng; thử thai âm tính, siêu âm tử cung phần phụ bình thường, Hb 12,8 g/dL. Theo YHCT, lưỡi tím tối có điểm ứ huyết, mạch huyền sáp.","dat_van_de":"Đau bụng kinh dữ dội, tái diễn mỗi chu kỳ, bắt đầu sau vài năm có kinh, ảnh hưởng sinh hoạt, đáp ứng với thuốc kháng viêm không steroid, khám và siêu âm vùng chậu bình thường. Chưa có dấu hiệu gợi đau bụng kinh thứ phát. Chứng trạng YHCT gồm đau trướng cự án, máu kinh tối có cục, ra cục thì đỡ, lưỡi tím tối, mạch huyền sáp.","bien_luan":"Đau bụng kinh bắt đầu sau vài năm có kinh, xuất hiện trước và đầu kỳ kinh, chu kỳ đều, đáp ứng ibuprofen, khám vùng chậu và siêu âm bình thường phù hợp đau bụng kinh nguyên phát. Lạc nội mạc tử cung hoặc bệnh tuyến cơ tử cung ít gợi ý vì đau ổn định, không đau ngoài kỳ, không đau tăng dần, không rong huyết, siêu âm không u lạc nội mạc, nhưng cần theo dõi nếu đau tăng dần hoặc không đáp ứng thuốc; viêm vùng chậu ít phù hợp vì không sốt, không khí hư, không đau ngoài kỳ kinh; thai ngoài tử cung và sẩy thai được loại trừ bằng thử thai âm tính. Hemoglobin bình thường nên chưa có thiếu máu do kinh. Cần thử thai trước khi dùng thuốc hoạt huyết hoặc châm vùng bụng, và chuyển Sản phụ khoa khi có dấu hiệu cảnh báo. Theo các khóa YHCT của ca, bệnh danh Thống kinh, bát cương Lý–Thực (huyết ứ, khí trệ), thể Khí trệ huyết ứ; pháp hành khí hoạt huyết, hóa ứ chỉ thống, phối hợp với thuốc giảm đau theo y học hiện đại.","sinh_ly_benh":"Trong giai đoạn hoàng thể, giảm progesteron làm nội mạc tử cung giải phóng prostaglandin, đặc biệt PGF2 alpha, gây co thắt cơ tử cung mạnh, giảm tưới máu cơ tử cung và kích thích đầu mút thần kinh đau, gây đau quặn kèm buồn nôn. Thuốc kháng viêm không steroid ức chế tổng hợp prostaglandin nên giảm đau. Theo YHCT, khí trệ huyết ứ ở bào cung làm kinh huyết không thông, bất thông tắc thống nên đau trướng, máu có cục.","tien_luong":"Gần: thường đáp ứng tốt với thuốc kháng viêm không steroid và biện pháp hỗ trợ. Xa: đau bụng kinh nguyên phát thường giảm theo tuổi hoặc sau sinh; cần theo dõi nếu đau tăng dần hoặc không đáp ứng để tìm nguyên nhân thứ phát như lạc nội mạc tử cung. Theo YHCT, đánh giá lại máu kinh và lưỡi mạch sau vài chu kỳ.","du_phong":"Chườm ấm bụng dưới, vận động nhẹ, ngủ đủ, hạn chế đồ lạnh và căng thẳng trước kỳ kinh; dùng thuốc giảm đau kháng viêm không steroid từ trước hoặc đầu kỳ kinh theo chỉ định nếu không chống chỉ định. Theo dõi lịch kinh, tái khám sau 2 đến 3 chu kỳ; chuyển Sản phụ khoa nếu đau tăng dần, không đáp ứng, ra huyết bất thường, sốt, khí hư mủ hoặc có khối vùng chậu. Thử thai trước khi dùng thuốc hoạt huyết hoặc châm vùng bụng."},"nguon":["American College of Obstetricians and Gynecologists, Committee Opinion No. 760: Dysmenorrhea and Endometriosis in the Adolescent, 2018.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"kham-tieu-khat-dai-thao-duong-tip-2","title":"Khát nước, tiểu nhiều, mệt, mới phát hiện đường huyết cao","kind":"Nội","level":"Khó","group":"noi","place":"Phòng khám Nội YHCT","clock":"08:50","name":"Ông Phạm Quốc Bảo","age":49,"sex":"nam","intro":"Phòng khám Nội YHCT. Ông là chủ cửa hàng, thừa cân, đến khám vì khát nước, tiểu nhiều, mệt mỏi khoảng 2 tháng. Kết quả khám sức khỏe gần đây báo đường huyết đói cao.","vitals":{"hr":84,"sbp":132,"dbp":84,"rr":17,"t":36.7,"spo2":98},"ask":[["Có khát nước nhiều, uống nhiều, tiểu nhiều không? Từ khi nào?","Khát, hay uống nước, tiểu 6 đến 7 lần mỗi ngày, đêm dậy tiểu 2 lần, khoảng 2 tháng nay.","e"],["Có sụt cân nhanh, buồn nôn, nôn, đau bụng, thở nhanh sâu không?","Sụt khoảng 2 kg trong 2 tháng. Không nôn, không đau bụng, không thở nhanh.","e"],["Có mờ mắt, tê bì chân, loét hoặc vết thương lâu lành, nhiễm trùng da không?","Hơi mờ mắt thoáng qua. Tê nhẹ đầu ngón chân. Không có vết loét ở bàn chân.","e"],["Có đau ngực, khó thở khi gắng sức, đau cách hồi chân không?","Không đau ngực, không đau cách hồi.","e"],["Tiền sử gia đình đái tháo đường, tăng huyết áp, rối loạn mỡ máu? Cân nặng, vòng bụng?","Cha bị đái tháo đường. Cân nặng 78 kg, cao 1,68 m. Bụng to, ít vận động.","e"],["Cảm giác mệt, ăn uống, miệng khô, ra mồ hôi?","Mệt, ít sức, miệng họng khô, ăn bình thường, hay ra mồ hôi tay. Lòng bàn tay chân hơi nóng.","e"],["Giấc ngủ, đại tiện?","Ngủ không sâu, đại tiện hơi táo.","n"],["Có dùng thuốc, thực phẩm chức năng hoặc thuốc nam nào không?","Chưa dùng thuốc điều trị đái tháo đường. Có uống thuốc nam bạn tặng, không rõ thành phần.","e"],["Có hút thuốc, uống rượu không?","Hút khoảng nửa bao mỗi ngày, uống bia cuối tuần.","n"]],"exam":[["V","Thần sắc, thể trạng","Thể trạng thừa cân (chỉ số khối cơ thể 27,6), tinh thần hơi mệt, da khô.","n"],["V","Lưỡi","Chất lưỡi đỏ nhạt, ít tân dịch, rêu trắng mỏng khô.","e"],["M","Giọng nói, hơi thở","Giọng nói nhỏ, hơi thở không có mùi trái cây (aceton).","e"],["T","Mạch","Mạch tế, nhược, hơi sác.","e"],["T","Sờ lòng bàn tay chân","Lòng bàn tay, bàn chân ấm nóng nhẹ, da khô.","n"],["K","Khám bàn chân (monofilament, mạch mu chân)","Giảm cảm giác nhẹ đầu ngón chân khi thử monofilament, mạch mu chân bắt được, không loét, da không nứt nẻ.","e"],["K","Khám tim, phổi, bụng","Tim đều, phổi rõ, bụng mềm, gan không to.","n"],["K","Đo huyết áp, chu vi vòng bụng","Huyết áp 132 trên 84 mmHg, vòng bụng 96 cm.","n"]],"tests":[["Đường huyết tĩnh mạch lúc đói",10,"8,4 mmol/L (lần 2 cũng trên 7).","e"],["HbA1c",30,"7,6 phần trăm.","e"],["Tổng phân tích nước tiểu, ceton niệu",15,"Glucose niệu dương tính, ceton âm tính.","e"],["Creatinin máu và eGFR, tỷ lệ albumin trên creatinin niệu",30,"Creatinin bình thường, eGFR 98, albumin niệu bình thường.","e"],["Lipid máu, men gan",30,"Triglycerid 2,8 mmol/L, LDL-C 3,5 mmol/L, men gan bình thường.","n"],["Điện tâm đồ",5,"Nhịp xoang, không bất thường.","n"],["Kháng thể kháng GAD",90,"Không cần thiết ở bệnh nhân người lớn thừa cân, không ceton, nghi típ 2 điển hình.","w"],["MRI tụy",60,"Không có chỉ định ở ca này.","w"]],"opt":{"ydx":["+Đái tháo đường típ 2 mới phát hiện, chưa biến chứng cấp","Đái tháo đường típ 1","Tiền đái tháo đường","Đái tháo nhạt","Cường giáp"],"bd":["+Tiêu khát","Lâm chứng","Hư lao","Huyễn vựng","Tỳ đản"],"bc":["+Lý – Hư – Nhiệt","Lý – Thực – Nhiệt","Biểu – Thực – Hàn","Lý – Hư – Hàn","Biểu – Hư – Nhiệt"],"the":["+Khí âm lưỡng hư","Phế vị táo nhiệt","Can thận âm hư","Âm dương lưỡng hư","Thấp nhiệt trung tiêu"],"phap":["+Ích khí dưỡng âm, sinh tân chỉ khát","Thanh nhiệt tả hỏa, sinh tân","Bổ thận tư âm","Ôn bổ thận dương","Thanh nhiệt lợi thấp"],"phuong":["+Sinh mạch tán gia vị","+Ngọc tuyền hoàn","Bạch hổ gia nhân sâm thang","Kim quỹ thận khí hoàn","Long đởm tả can thang"],"huyet":["+Tỳ du","+Thận du","+Túc tam lý","+Tam âm giao","+Thái khê","Phong trì","Thái dương","Đại chùy","Dương lăng tuyền"]},"actions":["+Tư vấn thay đổi lối sống: chế độ ăn kiểm soát carbohydrate, tăng vận động ít nhất 150 phút mỗi tuần, giảm cân|8|Nền tảng kiểm soát đái tháo đường típ 2.","+Khởi đầu điều trị đái tháo đường theo phác đồ YHHĐ (thường metformin nếu eGFR cho phép và không chống chỉ định)|3|Cần điều trị nền YHHĐ để kiểm soát đường huyết.","+Hướng dẫn tự theo dõi đường huyết, nhận biết hạ đường huyết và triệu chứng tăng đường huyết nặng|5|Tự quản lý bệnh.","+Sàng lọc biến chứng: khám mắt, đáy mắt, nước tiểu albumin, bàn chân, tim mạch|5|Chẩn đoán đã có tê chân nhẹ, cần đánh giá sớm.","+Châm cứu hoặc thuốc YHCT hỗ trợ (Tỳ du, Thận du, Túc tam lý, Tam âm giao, Thái khê)|20|Ích khí dưỡng âm hỗ trợ kiểm soát đường huyết, triệu chứng.","+Hướng dẫn bỏ thuốc lá, hạn chế bia rượu, hẹn kiểm tra HbA1c sau 3 tháng|3|Giảm nguy cơ tim mạch, theo dõi đáp ứng.","+Dặn đến cấp cứu khi buồn nôn nôn, đau bụng, thở nhanh sâu, lơ mơ, khát dữ dội hoặc đường huyết rất cao|2|Sàng lọc dấu hiệu nhiễm toan ceton, tăng áp lực thẩm thấu.","-Chụp MRI tụy|60|Không có chỉ định.","!Ngừng thuốc YHHĐ, chỉ dùng thuốc nam hoặc thực phẩm chức năng để hạ đường huyết|1|Nguy cơ tăng đường huyết, biến chứng, thuốc nam không rõ thành phần có thể chứa corticoid hoặc sulfonylurea.","!Cho thuốc ôn nhiệt bổ dương (Phụ tử, Nhục quế liều cao)|2|Thể khí âm lưỡng hư, thuốc ôn nhiệt làm hao thương âm dịch thêm."],"teach":"Triệu chứng khát, tiểu nhiều, sụt cân với đường huyết đói 7 mmol/L trở lên hai lần hoặc HbA1c từ 6,5 phần trăm cho phép chẩn đoán đái tháo đường; cần xác nhận típ, ceton niệu và sàng lọc biến chứng ngay từ đầu. Thể Khí âm lưỡng hư: mệt, miệng khô, lưỡi đỏ nhạt ít tân, mạch tế nhược. YHCT hỗ trợ, không thay thế thuốc YHHĐ; cảnh báo khẩn cấp: buồn nôn, đau bụng, thở sâu, lơ mơ, vết loét bàn chân.","hbu":{"tien_su":"Cha bị đái tháo đường. Thừa cân, ít vận động, hút khoảng nửa bao thuốc mỗi ngày, uống bia cuối tuần. Chưa dùng thuốc điều trị đái tháo đường; có uống thuốc nam do bạn tặng, không rõ thành phần. Chưa có dữ kiện về tăng huyết áp, rối loạn mỡ máu đã chẩn đoán trước đó, dị ứng thuốc và biến cố tim mạch.","luoc_qua_co_quan":"Nội tiết chuyển hóa có khát nước, uống nhiều, tiểu 6 đến 7 lần mỗi ngày, tiểu đêm 2 lần, sụt khoảng 2 kg trong 2 tháng. Mắt hơi mờ thoáng qua; thần kinh tê nhẹ đầu ngón chân. Tim mạch không đau ngực, không đau cách hồi; tiêu hóa không nôn, không đau bụng, đại tiện hơi táo; hô hấp không thở nhanh sâu. Da và chi không loét, không nhiễm trùng da. Theo YHCT, mệt, miệng họng khô, hay ra mồ hôi tay, lòng bàn tay chân hơi nóng, ngủ không sâu.","tom_tat":"Nam 49 tuổi, thừa cân, cha bị đái tháo đường, khát nước, tiểu nhiều, mệt mỏi khoảng 2 tháng, sụt 2 kg, mờ mắt thoáng qua và tê nhẹ đầu ngón chân. Khám BMI 27,6, vòng bụng 96 cm, huyết áp 132/84 mmHg, giảm cảm giác nhẹ đầu ngón chân khi thử monofilament, mạch mu chân bắt được, không loét. Đường huyết tĩnh mạch lúc đói 8,4 mmol/L (lần 2 cũng trên 7), HbA1c 7,6%, glucose niệu dương tính, ceton âm tính, eGFR 98, albumin niệu bình thường, triglycerid 2,8 và LDL-C 3,5 mmol/L, điện tâm đồ bình thường. Theo YHCT, lưỡi đỏ nhạt ít tân dịch rêu trắng mỏng khô, mạch tế nhược hơi sác.","dat_van_de":"Hội chứng tăng đường huyết mạn gồm khát, tiểu nhiều, sụt cân kèm mệt trên người thừa cân có tiền sử gia đình; đường huyết đói và HbA1c đạt ngưỡng chẩn đoán. Có dấu hiệu gợi tổn thương thần kinh ngoại biên sớm và rối loạn lipid máu, chưa có biến chứng cấp. Chứng trạng YHCT gồm khát, miệng họng khô, mệt, lòng bàn tay chân nóng, lưỡi đỏ nhạt ít tân, mạch tế nhược hơi sác.","bien_luan":"Triệu chứng khát, tiểu nhiều, sụt cân cùng đường huyết đói trên 7 mmol/L hai lần và HbA1c 7,6%, vượt ngưỡng 6,5%, xác định đái tháo đường; thừa cân, vòng bụng lớn, tiền sử gia đình và khởi phát ở người trung niên phù hợp típ 2. Đái tháo đường típ 1 hoặc dạng khởi phát muộn ít gợi ý vì thể trạng thừa cân, sụt cân nhẹ, ceton niệu âm tính và không có nhiễm toan; nhiễm toan ceton hoặc tình trạng tăng áp lực thẩm thấu được loại trừ khi không nôn, đau bụng, thở sâu hay lơ mơ. Tê đầu ngón chân kèm giảm monofilament gợi biến chứng thần kinh sớm, cần sàng lọc đáy mắt, albumin niệu, bàn chân và nguy cơ tim mạch ngay từ đầu; rối loạn lipid và hút thuốc làm tăng nguy cơ tim mạch. Cần khởi đầu thay đổi lối sống và thuốc theo phác đồ, chẳng hạn metformin khi eGFR cho phép và không chống chỉ định. Theo các khóa YHCT của ca, bệnh danh Tiêu khát, bát cương Lý–Hư–Nhiệt, thể Khí âm lưỡng hư; pháp ích khí dưỡng âm, sinh tân chỉ khát, chỉ hỗ trợ và không thay thế thuốc y học hiện đại.","sinh_ly_benh":"Đề kháng insulin ở mô cơ, gan và mỡ cùng suy giảm dần tiết insulin của tế bào beta tụy gây tăng glucose máu mạn. Khi glucose vượt ngưỡng thận gây lợi niệu thẩm thấu, dẫn tới tiểu nhiều, khát nước và mất nước. Tăng glucose kéo dài tổn thương mạch nhỏ và thần kinh ngoại biên. Theo YHCT, khí âm lưỡng hư làm tân dịch thiếu, hư nhiệt nội sinh gây khát, miệng khô và lòng bàn tay chân nóng.","tien_luong":"Gần: chưa biến chứng cấp, đường huyết thường cải thiện nhanh khi điều trị và thay đổi lối sống. Xa: nguy cơ biến chứng mạch nhỏ, mạch lớn và thần kinh nếu kiểm soát kém; cần kiểm soát đường huyết, huyết áp, lipid và bỏ thuốc lá. Theo YHCT, đánh giá lại khát, mệt và lưỡi mạch sau điều trị, đồng thời theo dõi chỉ số y học hiện đại.","du_phong":"Chế độ ăn kiểm soát carbohydrate, vận động ít nhất 150 phút mỗi tuần, giảm cân, bỏ thuốc lá, hạn chế bia rượu. Tự theo dõi đường huyết, nhận biết hạ đường huyết và triệu chứng tăng đường huyết nặng; kiểm tra HbA1c sau 3 tháng, sàng lọc mắt, thận, bàn chân và tim mạch định kỳ. Đến cấp cứu khi buồn nôn, nôn, đau bụng, thở nhanh sâu, lơ mơ hoặc khát dữ dội. Châm cứu hoặc thuốc YHCT chỉ hỗ trợ; không dùng thuốc nam không rõ thành phần."},"nguon":["American Diabetes Association, Standards of Care in Diabetes—2025, Diabetes Care.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"kham-tao-bon-man-cao-tuoi-da-benh","title":"Cụ bà 72 tuổi đại tiện khó, nhiều ngày một lần","kind":"Nội","level":"Khó","group":"phuctap","place":"Phòng khám Nội YHCT","clock":"09:05","name":"Bà Lê Thị Bích","age":72,"sex":"nữ","intro":"Phòng khám Nội YHCT. Bà đã nghỉ hưu, bị tăng huyết áp, đái tháo đường típ 2 và thoái hóa khớp gối, đến khám vì đại tiện khó, 4 đến 5 ngày mới đi một lần, phân khô cứng khoảng 7 tháng.","vitals":{"hr":74,"sbp":138,"dbp":78,"rr":17,"t":36.5,"spo2":97},"ask":[["Đại tiện thế nào: số lần, hình dạng phân, có rặn nhiều, có cảm giác đi chưa hết không?","Khoảng 4 đến 5 ngày mới đi một lần, phân khô, viên cứng như phân dê, rặn nhiều, đi xong vẫn thấy chưa hết. Khoảng 7 tháng nay.","e"],["Phân có máu, có đổi màu đen, có sụt cân, mệt nhiều, thiếu máu không?","Không thấy máu, phân không đen. Cân nặng ổn định 52 kg, không sụt cân đáng kể.","e"],["Có đau bụng, đầy chướng, buồn nôn, nôn không? Có bí trung tiện không?","Đầy bụng nhẹ khi nhiều ngày chưa đi, không nôn, vẫn trung tiện được.","e"],["Có tiền sử gia đình ung thư đại trực tràng, đã nội soi đại tràng lần nào chưa?","Chưa ai trong gia đình mắc. Đã nội soi đại tràng cách đây 4 năm, được bảo là bình thường.","e"],["Có đang dùng thuốc: canxi, thuốc huyết áp, thuốc đái tháo đường, giảm đau, sắt?","Uống amlodipine, metformin, canxi carbonat mỗi ngày. Thỉnh thoảng uống thuốc giảm đau khớp.","e"],["Uống nước, ăn rau, vận động thế nào?","Uống ít nước vì sợ tiểu đêm, ăn ít rau, ngồi nhiều vì đau khớp gối.","e"],["Cảm giác chóng mặt, hồi hộp, da khô, môi khô, ngủ?","Hay chóng mặt nhẹ khi đứng dậy, hồi hộp, da khô, môi khô, ngủ kém.","e"],["Có hay dùng thuốc nhuận tràng, thuốc xổ không?","Mua thuốc nhuận tràng kích thích ngoài hiệu thuốc, dùng 2 đến 3 lần mỗi tuần, đỡ rồi lại táo.","n"],["Có sợ lạnh, chậm chạp, tăng cân, da khô (nghi suy giáp)?","Không sợ lạnh đặc biệt, cân nặng ổn định.","n"]],"exam":[["V","Thần sắc, thể trạng","Cụ gầy, sắc mặt nhợt nhạt, da khô, tinh thần mệt mỏi.","n"],["V","Lưỡi","Chất lưỡi nhạt, ít tân dịch, rêu trắng mỏng khô.","e"],["M","Giọng nói, hơi thở","Giọng nói nhỏ, ngắt quãng. Hơi thở không hôi.","n"],["T","Mạch","Mạch tế, sáp.","e"],["T","Sờ tay chân, da","Tay chân hơi mát, da khô, bụng không đau.","n"],["K","Khám bụng","Bụng mềm, hố chậu trái sờ thấy cục phân, không đau, không khối, không dấu tắc ruột, nhu động ruột giảm nhẹ.","e"],["K","Thăm trực tràng","Phân cứng trong bóng trực tràng, không khối u, không trĩ chảy máu, trương lực cơ thắt bình thường.","e"],["K","Khám tuyến giáp, thần kinh, đo huyết áp tư thế","Tuyến giáp không to, phản xạ bình thường. Huyết áp nằm 138 trên 78, đứng 128 trên 74 mmHg.","n"]],"tests":[["Công thức máu",10,"Hb 12,4 g/dL, MCV bình thường.","e"],["Xét nghiệm máu ẩn trong phân (FIT)",20,"Âm tính.","e"],["TSH",30,"Bình thường.","e"],["Đường huyết, HbA1c, canxi máu, creatinin, điện giải đồ",40,"Đường huyết đói 7,2 mmol/L, HbA1c 7,0 phần trăm, canxi máu hơi cao bình thường, creatinin bình thường, K bình thường.","e"],["X-quang bụng không chuẩn bị",15,"Phân ứ đọng đại tràng sigma, không có mức nước hơi, không giãn quai ruột.","n"],["CT bụng có cản quang",40,"Không bất thường lớn. Không có chỉ định ở ca không dấu hiệu báo động, tăng nguy cơ ở người cao tuổi dùng metformin.","w"]],"opt":{"ydx":["+Táo bón mạn thứ phát do thuốc, ít uống nước và ít vận động (không dấu hiệu báo động)","Ung thư đại trực tràng","Suy giáp","Tắc ruột bán cấp","Hội chứng ruột kích thích thể táo bón"],"bd":["+Tiện bí","Phúc thống","Tiết tả","Lỵ","Hư lao"],"bc":["+Lý – Hư – Nhiệt (tân dịch khuy tổn)","Lý – Thực – Nhiệt","Biểu – Thực – Hàn","Lý – Thực – Hàn","Biểu – Hư – Hàn"],"the":["+Huyết hư tân khuy (Âm huyết bất túc)","Nhiệt bí (Vị tràng thực nhiệt)","Khí bí (Can khí uất)","Hàn bí (Dương hư)","Tỳ ước"],"phap":["+Dưỡng huyết tư âm, nhuận tràng thông tiện","Tả nhiệt thông tiện (công hạ mạnh)","Thuận khí đạo trệ, thông tiện","Ôn dương thông tiện","Sơ can giải uất"],"phuong":["+Nhuận tràng hoàn","~Tăng dịch thang","Đại thừa khí thang","Lục ma thang","Tế xuyên tiễn"],"huyet":["+Thiên khu","+Đại trường du","+Chi câu","+Tam âm giao","+Túc tam lý","Phong trì","Thái dương","Liệt khuyết","Đại chùy"]},"actions":["+Tăng uống nước theo khả năng, ăn thêm rau, chất xơ, thói quen đi đại tiện đúng giờ|4|Điều chỉnh yếu tố cơ bản gây táo bón.","+Xem xét lại thuốc: đổi dạng canxi hoặc điều chỉnh liều, hội chẩn bác sĩ kê đơn về nhóm thuốc có thể gây táo bón|3|Canxi, thuốc chẹn kênh canxi có thể góp phần.","+Dùng thuốc nhuận tràng thẩm thấu hoặc thuốc tạo khối phân theo chỉ định thay vì thuốc kích thích kéo dài|2|An toàn và phù hợp cho táo bón mạn ở người già.","+Châm hoặc xoa bóp bấm huyệt Thiên khu, Đại trường du, Chi câu, Tam âm giao, Túc tam lý|20|Dưỡng huyết nhuận tràng, điều hòa vận hóa đại trường.","+Hướng dẫn vận động nhẹ, xoa bụng theo chiều kim đồng hồ|5|Tăng nhu động ruột, phù hợp bệnh nhân đau khớp gối.","+Dặn tái khám sớm và nội soi đại tràng khi thấy máu trong phân, phân đen, sụt cân, thiếu máu, đau bụng tăng, bí trung tiện, nôn|2|Sàng lọc dấu hiệu báo động ung thư, tắc ruột.","-Chụp CT bụng có cản quang|40|Không có chỉ định, nguy cơ ở người cao tuổi dùng metformin.","!Dùng thuốc tả hạ mạnh có Đại hoàng, Mang tiêu kéo dài|2|Thể huyết hư tân khuy ở người già, công hạ mạnh gây mất nước, rối loạn điện giải, hao thương chính khí.","!Dùng thuốc nhuận tràng kích thích mỗi ngày kéo dài|1|Gây phụ thuộc, mất kali, tổn thương chức năng đại tràng."],"teach":"Ở người cao tuổi đa bệnh, táo bón mạn thường do thuốc (canxi, thuốc chẹn kênh canxi), ít nước, ít vận động; cần loại trừ suy giáp, tăng canxi, đái tháo đường. Thể Huyết hư tân khuy: phân khô như phân dê, da khô, chóng mặt, lưỡi nhạt ít tân, mạch tế sáp, dùng dưỡng huyết nhuận tràng, tránh công hạ mạnh. Dấu hiệu báo động cần nội soi và chuyển tuyến: máu trong phân, sụt cân, thiếu máu, táo bón mới xuất hiện sau 50 tuổi, bí trung tiện.","hbu":{"tien_su":"Tăng huyết áp, đái tháo đường típ 2 và thoái hóa khớp gối; đang dùng amlodipin, metformin và canxi carbonat mỗi ngày, thỉnh thoảng uống thuốc giảm đau khớp. Mua thuốc nhuận tràng kích thích dùng 2 đến 3 lần mỗi tuần, đỡ rồi lại táo. Đã nội soi đại tràng cách đây 4 năm được báo bình thường; không ai trong gia đình mắc ung thư đại trực tràng.","luoc_qua_co_quan":"Tiêu hóa có đại tiện 4 đến 5 ngày một lần, phân khô như phân dê, rặn nhiều, cảm giác chưa hết phân, đầy bụng nhẹ khi nhiều ngày chưa đi, vẫn trung tiện, không nôn, không phân máu hoặc đen. Toàn thân cân nặng ổn định 52 kg, mệt mỏi, da khô, môi khô; tim mạch chóng mặt nhẹ khi đứng dậy và hồi hộp. Thần kinh ngủ kém; không sợ lạnh đặc biệt. Cơ xương khớp đau khớp gối nên ngồi nhiều. Theo YHCT, tay chân hơi mát, ít uống nước vì sợ tiểu đêm.","tom_tat":"Nữ 72 tuổi, nền tăng huyết áp, đái tháo đường típ 2 và thoái hóa khớp gối, đại tiện khó 4 đến 5 ngày một lần, phân khô cứng, rặn nhiều khoảng 7 tháng, uống ít nước, ăn ít rau, ít vận động, đang dùng canxi carbonat và amlodipin, hay dùng thuốc nhuận tràng kích thích. Khám bụng mềm, cục phân ở hố chậu trái, không đau, không dấu tắc ruột; thăm trực tràng có phân cứng trong bóng trực tràng, không khối. Hb 12,4 g/dL, FIT âm tính, TSH bình thường, HbA1c 7,0%, canxi máu hơi cao bình thường, X-quang bụng thấy phân ứ ở sigma, không mức nước hơi. Theo YHCT, lưỡi nhạt ít tân dịch rêu trắng mỏng khô, mạch tế sáp.","dat_van_de":"Táo bón mạn tính ở người cao tuổi nhiều bệnh nền, có yếu tố thuốc (canxi, amlodipin, nhuận tràng kích thích), ít uống nước và ít vận động; không có dấu hiệu báo động. Có chóng mặt tư thế nhẹ và da môi khô gợi giảm thể tích. Chứng trạng YHCT gồm phân khô, da khô, tân dịch ít, lưỡi nhạt, mạch tế sáp.","bien_luan":"Phân khô cứng, đi thưa kéo dài 7 tháng ở người cao tuổi có dùng canxi carbonat, thuốc chẹn kênh canxi, ít uống nước, ít vận động, không máu trong phân, không sụt cân, không thiếu máu, FIT âm tính, TSH bình thường và X-quang chỉ thấy phân ứ, phù hợp táo bón mạn thứ phát do thuốc và lối sống, không có dấu hiệu báo động. Ung thư đại trực tràng ít gợi ý vì không máu, không sụt cân, không thiếu máu, nội soi 4 năm trước bình thường và FIT âm tính, nhưng cần nội soi sớm nếu xuất hiện dấu hiệu báo động; tắc ruột ít gợi ý vì còn trung tiện, không nôn, không mức nước hơi; suy giáp ít phù hợp khi TSH bình thường; tăng canxi máu có thể gây táo bón nên cần theo dõi canxi, nhất là khi canxi máu hơi cao bình thường và đang bổ sung canxi. Cần rà soát thuốc, dùng thuốc nhuận tràng thẩm thấu hoặc tạo khối thay vì thuốc kích thích kéo dài. Theo các khóa YHCT của ca, bệnh danh Tiện bí, bát cương Lý–Hư–Nhiệt (tân dịch khuy tổn), thể Huyết hư tân khuy (Âm huyết bất túc); pháp dưỡng huyết tư âm, nhuận tràng thông tiện, tránh công hạ mạnh, phối hợp với điều chỉnh thuốc và lối sống.","sinh_ly_benh":"Ở người cao tuổi nhu động đại tràng giảm, uống ít nước và ít chất xơ làm phân khô cứng; ít vận động làm thời gian vận chuyển ở đại tràng kéo dài. Canxi carbonat và thuốc chẹn kênh canxi làm giảm nhu động ruột; thuốc nhuận tràng kích thích dùng kéo dài có thể làm đại tràng phụ thuộc thuốc. Theo YHCT, âm huyết bất túc làm tân dịch khuy tổn, đại trường mất nhuận nên phân khô như phân dê, kèm da khô, môi khô và chóng mặt.","tien_luong":"Gần: thường cải thiện khi điều chỉnh nước, chất xơ, vận động và rà soát thuốc. Xa: có nguy cơ tái phát, biến chứng phân ứ đọng, trĩ, nứt hậu môn nếu không điều chỉnh yếu tố gây bệnh. Theo YHCT, đánh giá lại tân dịch, chứng da khô, chóng mặt và lưỡi mạch sau điều trị.","du_phong":"Tăng uống nước theo khả năng, ăn thêm rau và chất xơ, tập thói quen đại tiện đúng giờ, vận động nhẹ, xoa bụng theo chiều kim đồng hồ. Hội chẩn bác sĩ kê đơn về dạng canxi và nhóm thuốc có thể gây táo bón; dùng thuốc nhuận tràng thẩm thấu hoặc tạo khối theo chỉ định thay vì thuốc kích thích kéo dài. Tái khám sớm, nội soi đại tràng khi thấy máu trong phân, phân đen, sụt cân, thiếu máu, đau bụng tăng, bí trung tiện hoặc nôn. Châm hoặc xoa bóp bấm huyệt chỉ hỗ trợ."},"nguon":["American Gastroenterological Association and American College of Gastroenterology, Clinical Practice Guideline: Pharmacological Management of Chronic Idiopathic Constipation, 2023.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"canh-vai-tay-thoai-hoa-csc","title":"Đau cổ vai lan xuống tay, tê ngón cái và ngón trỏ","kind":"Cơ xương khớp","level":"Trung bình","group":"cxk","place":"Phòng châm cứu","clock":"08:40","name":"Ông Trần Văn Khải","age":56,"sex":"nam","intro":"Ông làm kế toán, ngồi máy tính nhiều giờ mỗi ngày. Ông đến vì đau cổ vai gáy 2 tháng, mấy tuần nay đau lan xuống cánh tay phải kèm tê ngón cái và ngón trỏ.","vitals":{"hr":76,"sbp":130,"dbp":80,"rr":18,"t":36.6,"spo2":98},"ask":[["Đau từ khi nào, đau ở đâu, lan đi đâu?","Đau cổ vai gáy bên phải khoảng 2 tháng, 3 tuần nay đau lan dọc mặt ngoài cánh tay xuống cẳng tay, tới ngón cái và ngón trỏ.","e"],["Có tê, kim châm hoặc yếu tay không?","Tê như kiến bò ở ngón cái, ngón trỏ tay phải. Cầm bút, cầm ly còn được, chưa rơi đồ.","e"],["Đau tăng khi nào, đỡ khi nào?","Đau tăng khi ngửa cổ, quay cổ sang phải, khi ngồi máy lạnh lâu và buổi sáng sớm. Chườm ấm, xoa bóp nhẹ thì dễ chịu.","e"],["Có sợ gió, sợ lạnh, người nặng nề không?","Sợ gió lạnh, cổ gáy cứng như bị chèn, hay quấn khăn. Người hơi nặng nề, trời ẩm đau nhiều hơn.","e"],["Có yếu hai chân, đi loạng choạng, vụng về khi cài khuy áo không?","Không yếu chân, đi đứng bình thường, cài khuy áo bình thường.","e"],["Có rối loạn đại tiểu tiện không?","Đại tiểu tiện bình thường.","e"],["Có sốt, sụt cân, đau về đêm không giảm khi đổi tư thế không?","Không sốt, không sụt cân. Đau có đỡ khi đổi tư thế.","e"],["Có chấn thương cổ hoặc tai nạn gần đây không?","Không có chấn thương.","n"],["Ăn uống, ngủ nghỉ ra sao?","Ăn được, ngủ hơi khó vì đau khi nằm nghiêng bên phải.","n"],["Tiền sử bệnh nội khoa và thuốc đang dùng?","Tăng huyết áp nhẹ, đang uống một viên thuốc hạ áp mỗi ngày. Không đái tháo đường.","n"]],"exam":[["V","Thần sắc, dáng đi","Tỉnh táo, sắc mặt bình thường, dáng đi bình thường. Đầu hơi nghiêng sang trái, vai phải hơi nhô.","n"],["V","Lưỡi","Chất lưỡi nhạt, rêu trắng mỏng.","e"],["M","Giọng nói, hơi thở","Tiếng nói rõ, hơi thở không hôi.","n"],["T","Mạch","Mạch phù khẩn.","e"],["T","Sờ vùng cổ vai","Cơ thang, cơ nâng vai bên phải co cứng, ấn đau, sờ thấy lạnh hơn bên trái.","e"],["K","Tầm vận động cột sống cổ","Hạn chế ngửa và xoay phải, khi ngửa và nghiêng phải thì đau lan xuống tay (nghiệm pháp Spurling dương tính).","e"],["K","Thần kinh chi trên","Giảm cảm giác nhẹ ngón cái và ngón trỏ phải, cơ lực 5/5, phản xạ gân cơ nhị đầu bên phải giảm nhẹ. Dấu Hoffmann âm tính hai bên.","e"],["K","Thần kinh chi dưới","Cơ lực chi dưới 5/5, phản xạ gân gối bình thường, không có dấu Babinski.","e"]],"tests":[["X-quang cột sống cổ thẳng, nghiêng, chếch 3/4",15,"Mất đường cong sinh lý, hẹp khe C5-C6, gai xương bờ trước thân đốt C5-C6, hẹp lỗ liên hợp C5-C6 bên phải.","e"],["MRI cột sống cổ",45,"Thoái hóa đĩa đệm C5-C6, phồng đĩa đệm lệch cạnh phải chèn ép nhẹ rễ C6 phải. Tủy sống không bị chèn ép, không có tín hiệu bất thường trong tủy.","e"],["Điện cơ và dẫn truyền thần kinh chi trên",30,"Gợi ý tổn thương rễ C6 phải mức độ nhẹ.","n"],["Công thức máu, tốc độ máu lắng",20,"Bình thường.","n"],["Chụp mạch máu não (DSA)",60,"Không có chỉ định ở ca này, thủ thuật xâm lấn.","w"]],"opt":{"ydx":["+Hội chứng cổ vai cánh tay do thoái hóa cột sống cổ (chèn ép rễ C6)","Bệnh lý tủy cổ do thoái hóa","Hội chứng ống cổ tay","Viêm quanh khớp vai","Ung thư di căn cột sống cổ"],"bd":["+Cảnh tý (kiên tý)","Ngũ thập kiên","Trúng phong","Hạng cường do ngoại cảm","Thống phong"],"bc":["+Biểu – Thực – Hàn","Lý – Hư – Hàn","Lý – Thực – Nhiệt","Biểu – Thực – Nhiệt","Lý – Hư – Nhiệt"],"the":["+Phong hàn thấp tý","Khí trệ huyết ứ","Can thận hư","Đàm thấp trở lạc","Khí huyết hư"],"phap":["+Khu phong tán hàn trừ thấp, thông kinh hoạt lạc","Bổ can thận, cường cân cốt","Hoạt huyết hóa ứ, hành khí chỉ thống","Thanh nhiệt lợi thấp","Kiện tỳ hóa đàm"],"phuong":["+Cát căn thang","+Quyên tý thang","Độc hoạt tang ký sinh thang","Thân thống trục ứ thang","Bạch hổ gia quế chi thang"],"huyet":["+Phong trì","+Kiên tỉnh","+Đại chùy","+Khúc trì","+Hợp cốc","Dũng tuyền","Thái khê","Quan nguyên","Thừa sơn"]},"actions":["+Châm Phong trì, Kiên tỉnh (Đởm), Đại chùy (Đốc mạch), Khúc trì, Hợp cốc (Đại trường), kèm giác hơi hoặc cứu vùng cổ gáy|25|Khu phong tán hàn, thông kinh lạc vùng cổ vai tay.","+Sàng lọc dấu hiệu chèn ép tủy cổ (Hoffmann, Babinski, rối loạn cơ tròn, đi vụng về)|3|Phát hiện bệnh lý tủy cần chuyển phẫu thuật thần kinh.","+Hướng dẫn tư thế làm việc, chỉnh độ cao màn hình, nghỉ giải lao mỗi 45 phút|3|Giảm tải cho cột sống cổ, ngừa tái phát.","+Chiếu đèn hồng ngoại hoặc chườm ấm vùng cổ gáy|10|Hợp với thể phong hàn thấp.","+Dặn quay lại ngay nếu yếu tay chân tăng, đi loạng choạng, bí tiểu|2|Dấu hiệu chèn ép tủy tiến triển.","-Kéo giãn cột sống cổ cường độ cao kèm xoay bẻ mạnh|10|Không cần thiết, tăng nguy cơ tổn thương.","!Nắn bẻ cột sống cổ mạnh, xoay đột ngột|5|Có thể gây tổn thương rễ, tủy hoặc động mạch đốt sống.","!Cho thuốc thanh nhiệt hàn lương mạnh (Hoàng liên, Thạch cao)|2|Thể phong hàn thấp, thuốc hàn làm tà khí ngưng trệ nặng hơn."],"teach":"Đau cổ lan tay theo dải C6, tê ngón cái ngón trỏ, nghiệm pháp Spurling dương tính gợi ý chèn ép rễ C6. Sợ lạnh, rêu trắng mỏng, mạch phù khẩn cho ra thể phong hàn thấp tý. Luôn tìm dấu hiệu bệnh lý tủy cổ (Hoffmann, rối loạn cơ tròn, đi vụng về) và dấu hiệu ác tính (sụt cân, đau đêm) trước khi châm cứu.","hbu":{"tien_su":"Tăng huyết áp nhẹ, đang uống một viên thuốc hạ áp mỗi ngày; không đái tháo đường. Làm kế toán, ngồi máy tính nhiều giờ mỗi ngày trong phòng máy lạnh. Không chấn thương cổ hoặc tai nạn gần đây; chưa có dữ kiện về tiền sử gia đình, phẫu thuật cột sống và dị ứng thuốc.","luoc_qua_co_quan":"Cơ xương khớp có đau cổ vai gáy bên phải, đau lan mặt ngoài cánh tay xuống ngón cái và ngón trỏ, tăng khi ngửa hoặc quay cổ sang phải; thần kinh có tê như kiến bò ngón cái và ngón trỏ phải, cầm bút và ly còn được. Không yếu chân, đi đứng bình thường, cài khuy áo bình thường; đại tiểu tiện bình thường. Toàn thân không sốt, không sụt cân, đau đổi tư thế thì đỡ, ngủ hơi khó vì đau khi nằm nghiêng phải. Theo YHCT, sợ gió lạnh, cổ gáy cứng, người nặng nề, trời ẩm đau nhiều hơn.","tom_tat":"Nam 56 tuổi, kế toán ngồi máy tính nhiều giờ, đau cổ vai gáy phải 2 tháng, 3 tuần nay đau lan dọc mặt ngoài cánh tay tới ngón cái và ngón trỏ, tê như kiến bò, tăng khi ngửa và xoay cổ phải, đỡ khi chườm ấm. Khám cơ thang và cơ nâng vai phải co cứng ấn đau, hạn chế ngửa và xoay phải, Spurling dương tính, giảm cảm giác nhẹ ngón cái và ngón trỏ phải, cơ lực 5/5, phản xạ nhị đầu phải giảm nhẹ, Hoffmann và Babinski âm tính. X-quang hẹp khe C5-C6 với gai xương và hẹp lỗ liên hợp phải; MRI phồng đĩa C5-C6 lệch phải chèn ép nhẹ rễ C6 phải, tủy không bị chèn ép; điện cơ gợi tổn thương rễ C6 phải mức nhẹ. Theo YHCT, lưỡi nhạt rêu trắng mỏng, mạch phù khẩn.","dat_van_de":"Đau cổ vai lan xuống tay theo dải C6 kèm tê và giảm cảm giác ngón cái, ngón trỏ, nghiệm pháp Spurling dương tính, chưa có dấu hiệu chèn ép tủy cổ hay dấu hiệu báo động. Có yếu tố nguy cơ nghề nghiệp. Chứng trạng YHCT gồm sợ gió lạnh, cổ gáy cứng, đau tăng khi lạnh ẩm, lưỡi nhạt rêu trắng mỏng, mạch phù khẩn.","bien_luan":"Đau cổ lan xuống mặt ngoài cánh tay tới ngón cái và ngón trỏ, tê theo dải C6, Spurling dương tính, giảm phản xạ nhị đầu, cùng hình ảnh X-quang, MRI và điện cơ phù hợp hội chứng cổ vai cánh tay do thoái hóa cột sống cổ gây chèn ép rễ C6 phải mức nhẹ. Bệnh lý tủy cổ ít gợi ý vì Hoffmann và Babinski âm tính, không yếu chân, không rối loạn cơ tròn, MRI tủy không bị chèn ép; hội chứng ống cổ tay cũng có thể gây tê ngón cái và ngón trỏ nhưng ít phù hợp khi đau cổ vai lan dọc cánh tay, Spurling dương tính và điện cơ gợi tổn thương rễ. Viêm quanh khớp vai ít phù hợp vì đau tăng khi cử động cổ chứ không do cử động khớp vai; nguyên nhân ác tính hoặc nhiễm trùng ít gợi ý vì không sốt, không sụt cân, đau đỡ khi đổi tư thế, máu lắng bình thường. Luôn sàng lọc dấu hiệu bệnh lý tủy cổ và dấu hiệu ác tính trước khi châm cứu. Theo các khóa YHCT của ca, bệnh danh Cảnh tý (kiên tý), bát cương Biểu–Thực–Hàn, thể Phong hàn thấp tý; pháp khu phong tán hàn trừ thấp, thông kinh hoạt lạc, phối hợp với điều chỉnh tư thế làm việc và theo dõi thần kinh.","sinh_ly_benh":"Thoái hóa đĩa đệm C5-C6 làm giảm chiều cao đĩa, gai xương và phồng đĩa làm hẹp lỗ liên hợp, chèn ép và gây viêm quanh rễ thần kinh C6, gây đau lan theo dải rễ, tê và giảm phản xạ. Tư thế cổ cúi hoặc ngồi lâu tăng tải lên đĩa; co cứng cơ cạnh sống làm nặng thêm đau. Theo YHCT, phong hàn thấp xâm nhập kinh lạc vùng cổ vai làm khí huyết bế tắc, gây đau, cứng, tê và nặng nề.","tien_luong":"Gần: chèn ép rễ mức nhẹ thường cải thiện với điều trị bảo tồn. Xa: bệnh thoái hóa mạn tính, có thể tái phát khi tư thế làm việc không được điều chỉnh; cần theo dõi để phát hiện sớm bệnh lý tủy cổ. Theo YHCT, đánh giá lại chứng sợ gió lạnh, cứng gáy và tầm vận động sau điều trị.","du_phong":"Chỉnh độ cao màn hình, ngồi đúng tư thế, nghỉ giải lao mỗi 45 phút, tập cơ vùng cổ vai, giữ ấm cổ gáy và tránh gió lạnh từ máy lạnh. Chườm ấm hoặc chiếu đèn hồng ngoại vùng cổ gáy. Quay lại ngay nếu yếu tay chân tăng, đi loạng choạng, rối loạn cơ tròn hoặc bí tiểu. Châm cứu, giác hơi, cứu chỉ thực hiện sau khi đã sàng lọc dấu hiệu báo động và theo chỉ định."},"nguon":["North American Spine Society, Evidence-Based Clinical Guidelines for Multidisciplinary Spine Care: Diagnosis and Treatment of Cervical Radiculopathy from Degenerative Disorders, 2010.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"thoai-hoa-khop-goi-han-that","title":"Đau hai gối khi lên xuống cầu thang","kind":"Cơ xương khớp","level":"Dễ","group":"cxk","place":"Phòng châm cứu","clock":"14:10","name":"Bà Nguyễn Thị Tâm","age":63,"sex":"nữ","intro":"Bà về hưu, đến vì đau hai gối khoảng 1 năm, nặng dần, đau khi lên xuống cầu thang và đi bộ xa, trời lạnh đau nhiều hơn.","vitals":{"hr":74,"sbp":125,"dbp":78,"rr":18,"t":36.7,"spo2":98},"ask":[["Đau gối như thế nào, bên nào nhiều hơn?","Đau âm ỉ hai gối, gối phải nhiều hơn, đau khi đứng lên ngồi xuống, lên xuống cầu thang. Nghỉ thì đỡ.","e"],["Buổi sáng có cứng khớp không, bao lâu?","Cứng gối khi mới ngủ dậy, khoảng 10 đến 15 phút là đi lại được.","e"],["Gối có sưng, nóng, đỏ không? Có sốt không?","Không sưng nóng đỏ, không sốt. Thỉnh thoảng gối hơi tràn dịch nhẹ sau khi đi nhiều.","e"],["Trời lạnh, chườm nóng ảnh hưởng thế nào?","Trời lạnh, trời mưa đau tăng. Chườm ấm thì đỡ.","e"],["Có đau lưng, mỏi gối, ù tai, tiểu đêm không?","Hay đau mỏi lưng, gối mỏi yếu, tiểu đêm 2 đến 3 lần, tai ù nhẹ.","e"],["Có đau nhiều khớp nhỏ ở bàn tay, sưng đối xứng không?","Không, các khớp bàn tay bình thường.","e"],["Cân nặng, nghề nghiệp trước đây?","Thừa cân, BMI khoảng 27. Trước đây là nhân viên bán hàng đứng nhiều.","n"],["Đã dùng thuốc giảm đau chưa?","Thỉnh thoảng uống thuốc giảm đau kháng viêm mua ngoài, đỡ chút rồi lại đau.","n"],["Ăn ngủ ra sao?","Ăn được, ngủ tạm, đôi lúc đau khi trở mình.","n"]],"exam":[["V","Dáng đi, hình dạng khớp gối","Dáng đi hơi khập khiễng, hai gối hơi vẹo trong, không sưng đỏ.","e"],["V","Lưỡi","Chất lưỡi nhạt, rêu trắng mỏng.","e"],["M","Giọng nói, hơi thở","Tiếng nói bình thường, hơi thở không hôi.","n"],["T","Mạch","Mạch trầm tế nhược, hai bộ xích yếu.","e"],["T","Sờ gối","Da gối không nóng, sờ hơi lạnh, có lạo xạo khi cử động, ấn đau khe khớp trong.","e"],["K","Khám khớp gối","Tầm vận động gập 120 độ, duỗi đủ, có tiếng lục cục. Nghiệm pháp bập bềnh xương bánh chè dương tính nhẹ ở gối phải.","e"],["K","Thần kinh chi dưới","Cơ lực 5/5, cảm giác và phản xạ bình thường, không có dấu thần kinh khu trú.","n"],["K","Khám khớp háng cùng bên","Tầm vận động khớp háng bình thường, không đau.","n"]],"tests":[["X-quang khớp gối thẳng và nghiêng khi đứng",15,"Hẹp khe khớp đùi chày trong, gai xương bờ khớp, xơ cứng xương dưới sụn, Kellgren-Lawrence độ 2 đến 3.","e"],["Tốc độ máu lắng, CRP",20,"Bình thường.","n"],["Acid uric máu",15,"Bình thường.","n"],["Yếu tố dạng thấp (RF), anti-CCP",30,"Âm tính.","n"],["MRI khớp gối",45,"Không có chỉ định để chẩn đoán thoái hóa khớp thông thường nếu đã có X-quang điển hình.","w"]],"opt":{"ydx":["+Thoái hóa khớp gối nguyên phát","Viêm khớp dạng thấp","Gút mạn","Viêm khớp gối nhiễm khuẩn","Hoại tử vô khuẩn chỏm xương đùi"],"bd":["+Hạc tất phong (tý chứng vùng gối)","Thống phong","Yêu thống","Lịch tiết phong","Nuy chứng"],"bc":["+Lý – Hư kiêm Thực – Hàn","Biểu – Thực – Nhiệt","Lý – Thực – Nhiệt","Biểu – Hư – Hàn","Lý – Hư – Nhiệt"],"the":["+Can thận hư kèm phong hàn thấp","Thấp nhiệt tý","Khí trệ huyết ứ","Đàm thấp trở lạc","Tỳ vị hư"],"phap":["+Bổ can thận, khu phong tán hàn trừ thấp, thông kinh hoạt lạc","Thanh nhiệt lợi thấp, thông lạc","Hoạt huyết hóa ứ, hành khí","Kiện tỳ ích khí","Giải biểu tán hàn"],"phuong":["+Độc hoạt tang ký sinh thang","Bạch hổ gia quế chi thang","Thân thống trục ứ thang","Tứ quân tử thang","Ngân kiều tán"],"huyet":["+Độc tỵ","+Nội tất nhãn","+Huyết hải","+Dương lăng tuyền","+Thận du","Hợp cốc","Phong trì","Nội quan","Thái xung"]},"actions":["+Châm Độc tỵ, Dương lăng tuyền, Huyết hải, Nội tất nhãn, Thận du, kèm cứu ngải quanh gối|25|Bổ can thận, tán hàn thông lạc.","+Sàng lọc dấu hiệu viêm khớp cấp: sưng nóng đỏ, sốt, đau dữ dội khi nghỉ|3|Loại trừ viêm khớp nhiễm khuẩn, gút, viêm khớp dạng thấp.","+Hướng dẫn giảm cân, tập mạnh cơ tứ đầu đùi, tránh ngồi xổm, leo cầu thang nhiều|4|Giảm tải khớp gối.","+Chườm ấm hoặc chiếu đèn hồng ngoại vùng gối|10|Hợp thể hàn thấp.","+Dặn thận trọng với thuốc kháng viêm giảm đau, nên dùng khi cần và theo hướng dẫn thầy thuốc|2|Tránh tác dụng phụ trên dạ dày, thận.","-Chụp MRI khớp gối thường quy|45|Không cần khi X-quang đã điển hình.","!Châm sâu, lưu kim lâu ngay vào gối đang sưng nóng đỏ nghi viêm nhiễm|5|Nguy cơ đưa vi khuẩn vào khớp.","!Tiêm corticoid nội khớp lặp lại liên tục mỗi tuần|5|Làm tổn thương sụn, tăng nguy cơ nhiễm khuẩn."],"teach":"Đau cơ giới tăng khi vận động, cứng khớp buổi sáng dưới 30 phút, X-quang hẹp khe khớp và gai xương là thoái hóa khớp gối. Thể can thận hư (đau mỏi lưng gối, tiểu đêm, mạch trầm tế) kèm phong hàn thấp (đau tăng khi lạnh). Cần phân biệt với viêm khớp nhiễm khuẩn, gút, viêm khớp dạng thấp.","hbu":{"tien_su":"Về hưu, trước đây là nhân viên bán hàng đứng nhiều, thừa cân với BMI khoảng 27. Thỉnh thoảng tự uống thuốc giảm đau kháng viêm mua ngoài, đỡ chút rồi lại đau. Không có tiền sử viêm khớp dạng thấp, gút hay nhiễm trùng khớp được ghi nhận; chưa có dữ kiện về tiền sử gia đình, chấn thương gối trước đây, bệnh nền khác và dị ứng thuốc.","luoc_qua_co_quan":"Cơ xương khớp có đau âm ỉ hai gối, gối phải nhiều hơn, đau khi đứng lên ngồi xuống, lên xuống cầu thang và đi bộ xa, nghỉ thì đỡ, cứng gối buổi sáng 10 đến 15 phút, thỉnh thoảng hơi tràn dịch sau khi đi nhiều; không sưng nóng đỏ, không sốt, khớp bàn tay bình thường. Hay đau mỏi lưng, tiểu đêm 2 đến 3 lần, ù tai nhẹ. Thần kinh chi dưới không yếu hay tê; ăn được, ngủ tạm, đau khi trở mình. Theo YHCT, trời lạnh hoặc mưa đau tăng, chườm ấm thì đỡ.","tom_tat":"Nữ 63 tuổi, thừa cân, đau hai gối khoảng 1 năm nặng dần, đau cơ giới khi lên xuống cầu thang và đi bộ xa, nghỉ thì đỡ, cứng gối buổi sáng dưới 15 phút, trời lạnh đau tăng, kèm đau mỏi lưng, tiểu đêm 2 đến 3 lần. Khám dáng đi hơi khập khiễng, hai gối hơi vẹo trong, không nóng đỏ, lạo xạo khi cử động, ấn đau khe khớp trong, gập 120 độ, bập bềnh xương bánh chè dương tính nhẹ ở gối phải, thần kinh chi dưới bình thường, khớp háng bình thường. X-quang gối đứng hẹp khe đùi chày trong, gai xương, xơ cứng xương dưới sụn, Kellgren-Lawrence độ 2 đến 3; máu lắng, CRP, acid uric bình thường, RF và anti-CCP âm tính. Theo YHCT, lưỡi nhạt rêu trắng mỏng, mạch trầm tế nhược, hai bộ xích yếu.","dat_van_de":"Đau khớp gối cơ giới hai bên tiến triển chậm, cứng khớp buổi sáng ngắn, thoái hóa trên X-quang, không có dấu hiệu viêm cấp và các xét nghiệm viêm, thấp khớp bình thường, trên người thừa cân lớn tuổi. Chứng trạng YHCT gồm đau mỏi lưng gối, tiểu đêm, ù tai, đau tăng khi lạnh, lưỡi nhạt, mạch trầm tế nhược.","bien_luan":"Đau cơ giới tăng khi vận động, nghỉ thì đỡ, cứng khớp buổi sáng dưới 30 phút, tiếng lạo xạo, hẹp khe khớp, gai xương, xơ cứng xương dưới sụn trên X-quang ở người lớn tuổi thừa cân phù hợp thoái hóa khớp gối nguyên phát, Kellgren-Lawrence độ 2 đến 3. Viêm khớp dạng thấp ít phù hợp vì cứng khớp buổi sáng ngắn, không tổn thương khớp bàn tay, RF và anti-CCP âm tính, CRP bình thường; gút ít phù hợp vì không sưng nóng đỏ cấp, acid uric bình thường; viêm khớp nhiễm khuẩn ít gợi ý vì không sốt, không sưng nóng đỏ, chỉ số viêm bình thường. Đau lan từ khớp háng hoặc từ cột sống thắt lưng được loại bớt vì khớp háng bình thường và thần kinh chi dưới bình thường. Cần cân nhắc thận trọng khi dùng thuốc kháng viêm giảm đau không steroid ở người lớn tuổi, dùng khi cần và theo hướng dẫn. Theo các khóa YHCT của ca, bệnh danh Hạc tất phong (tý chứng vùng gối), bát cương Lý–Hư kiêm Thực–Hàn, thể Can thận hư kèm phong hàn thấp; pháp bổ can thận, khu phong tán hàn trừ thấp, thông kinh hoạt lạc, phối hợp với giảm cân và tập luyện.","sinh_ly_benh":"Thoái hóa khớp là bệnh của toàn bộ khớp: sụn khớp bị mòn, xương dưới sụn xơ cứng, hình thành gai xương và viêm màng hoạt dịch mức nhẹ. Thừa cân và tải trọng cơ học lặp lại làm tăng áp lực lên khe khớp đùi chày trong; yếu cơ tứ đầu đùi làm giảm bảo vệ khớp. Theo YHCT, Can thận hư làm gân xương mất nuôi dưỡng, phong hàn thấp xâm nhập làm kinh lạc bế tắc gây đau tăng khi lạnh.","tien_luong":"Gần: triệu chứng có thể giảm khi giảm cân, tập luyện đúng và dùng thuốc hợp lý. Xa: bệnh mạn tính tiến triển chậm; nguy cơ hạn chế vận động và cần cân nhắc điều trị can thiệp nếu thoái hóa nặng hơn. Theo YHCT, đánh giá lại chứng đau mỏi lưng gối, tiểu đêm và đáp ứng với giữ ấm.","du_phong":"Giảm cân, tập mạnh cơ tứ đầu đùi, tránh ngồi xổm và leo cầu thang nhiều, giữ ấm gối, chườm ấm hoặc chiếu đèn hồng ngoại vùng gối. Thận trọng với thuốc kháng viêm giảm đau, chỉ dùng khi cần và theo hướng dẫn. Tái khám khi gối sưng nóng đỏ, sốt, đau dữ dội khi nghỉ hoặc hạn chế vận động tăng. Châm cứu, cứu ngải quanh gối chỉ hỗ trợ theo chỉ định."},"nguon":["American College of Rheumatology and Arthritis Foundation, 2019 Guideline for the Management of Osteoarthritis of the Hand, Hip, and Knee.","Osteoarthritis Research Society International, OARSI Guidelines for the Non-Surgical Management of Knee, Hip, and Polyarticular Osteoarthritis, 2019.","Bộ Y tế, Hướng dẫn chẩn đoán và điều trị bệnh theo y học cổ truyền, kết hợp y học cổ truyền với y học hiện đại, Quyết định 5013/QĐ-BYT, 2020."],"status":"draft"},{"id":"toa-cot-phong-thoat-vi-dia-dem","title":"Đau thắt lưng lan chân phải, yếu bàn chân","kind":"Cơ xương khớp","level":"Khó","group":"cxk","place":"Phòng châm cứu","clock":"10:20","name":"Anh Lê Quốc Bảo","age":42,"sex":"nam","intro":"Anh làm tài xế đường dài, đến vì đau thắt lưng lan xuống chân phải 5 tuần, mấy ngày nay thấy tê mu bàn chân và hơi khó nhấc mũi chân.","vitals":{"hr":80,"sbp":128,"dbp":82,"rr":18,"t":36.8,"spo2":98},"ask":[["Đau bắt đầu thế nào, lan đi đâu?","Đau thắt lưng sau khi khuân đồ nặng 5 tuần trước, sau đó đau lan mông, mặt ngoài đùi, ngoài cẳng chân tới mu bàn chân phải.","e"],["Đau như thế nào, tăng khi nào?","Đau như dao đâm, cố định, tăng khi ho, hắt hơi, ngồi lâu, cúi người. Đêm đau nhiều hơn, phải nằm co chân.","e"],["Có yếu chân, vấp ngón chân khi đi không?","Mấy ngày nay hay vấp mũi chân phải, nhấc ngón cái lên khó hơn bên trái.","e"],["Có tê vùng sinh dục, hậu môn, bí tiểu hoặc tiểu không tự chủ không?","Không tê vùng đáy chậu. Tiểu tiện, đại tiện bình thường. Chức năng sinh lý chưa thay đổi.","e"],["Có yếu hoặc tê cả hai chân không?","Chỉ chân phải, chân trái bình thường.","e"],["Có sốt, sụt cân, tiền sử ung thư, tiêm chích hoặc nhiễm trùng gần đây không?","Không sốt, không sụt cân, không tiền sử ung thư, không có nhiễm trùng gần đây.","e"],["Chườm nóng, nghỉ ngơi có đỡ không?","Chườm nóng đỡ, trời lạnh đau tăng. Nằm nghỉ đỡ nhưng đêm vẫn đau.","n"],["Ăn uống, ngủ nghỉ thế nào?","Ngủ kém vì đau, ăn bình thường, hay táo bón nhẹ.","n"],["Đã dùng thuốc nào, đã chụp phim chưa?","Uống thuốc giảm đau và giãn cơ 1 tuần, đỡ ít. Chưa chụp phim.","n"]],"exam":[["V","Thần sắc, tư thế, dáng đi","Sắc mặt hơi tối, tư thế nghiêng người sang trái khi đứng, dáng đi thận trọng, chân phải bước nhẹ, hơi vấp mũi chân.","e"],["V","Lưỡi","Chất lưỡi tím tối, có điểm ứ huyết hai bên rìa, rêu trắng mỏng.","e"],["M","Giọng nói, hơi thở","Nói rõ, thở không hôi, hay thở dài vì đau.","n"],["T","Mạch","Mạch huyền sáp.","e"],["T","Sờ vùng thắt lưng","Co cứng cơ cạnh sống L4-L5 phải, ấn đau điểm cạnh sống L4-L5 và dọc đường đi thần kinh tọa, sờ hơi lạnh.","e"],["K","Dấu Lasègue và Valleix","Lasègue dương tính phải ở 40 độ, điểm Valleix đau.","e"],["K","Cơ lực và cảm giác chi dưới phải","Gập mu bàn chân và duỗi ngón cái phải 4/5, giảm cảm giác mu bàn chân và mặt ngoài cẳng chân phải. Phản xạ gân gót bình thường.","e"],["K","Cảm giác vùng yên ngựa, trương lực cơ vòng hậu môn","Cảm giác vùng đáy chậu bình thường, trương lực cơ vòng hậu môn bình thường.","e"]],"tests":[["MRI cột sống thắt lưng",45,"Thoát vị đĩa đệm L4-L5 lệch cạnh phải, chèn ép rễ L5 phải. Ống sống không hẹp nặng, không chèn ép chùm đuôi ngựa, không thấy khối u hay viêm đĩa đệm.","e"],["X-quang cột sống thắt lưng thẳng nghiêng",15,"Hẹp khe đĩa đệm L4-L5, gai xương nhẹ.","n"],["Công thức máu, CRP, tốc độ máu lắng",20,"Bình thường.","n"],["Điện cơ chi dưới phải",30,"Tổn thương rễ L5 phải mức độ nhẹ đến vừa.","n"],["PET-CT toàn thân",120,"Không có chỉ định ở ca này khi chưa có dấu hiệu nghi ngờ ác tính.","w"]],"opt":{"ydx":["+Đau thần kinh tọa do thoát vị đĩa đệm L4-L5 chèn ép rễ L5","Hội chứng đuôi ngựa","Viêm khớp cùng chậu","Hẹp ống sống do ung thư di căn","Hội chứng cơ lê"],"bd":["+Tọa cốt phong","Yêu thống do thận hư","Chứng nuy","Hạc tất phong","Thống phong"],"bc":["+Lý – Thực – Không hàn không nhiệ
