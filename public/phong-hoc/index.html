oại khoa, Đại học Y Hà Nội, bài Sỏi mật và viêm túi mật."],"status":"nhap"},{"id":"ngoai-bung-005","title":"Sốt cao, vàng da, đau hạ sườn phải ở người đã cắt túi mật","kind":"Ngoại","level":"Trung bình","group":"ngoai","name":"Người bệnh mô phỏng L. V. D.","age":68,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Nam 68 tuổi đã cắt túi mật, nhập viện vì đau hạ sườn phải, sốt cao rét run và vàng da tăng dần trong 3 ngày.","vitals":{"hr":108,"sbp":98,"dbp":60,"rr":22,"t":39.4,"spo2":96},"ask":[["Triệu chứng khởi phát và diễn tiến thế nào?","Đau hạ sườn phải âm ỉ rồi tăng, sốt cao rét run 2 ngày, vàng da tăng dần từ hôm qua.","e"],["Nước tiểu và phân thay đổi ra sao?","Nước tiểu sẫm như nước trà, phân nhạt màu, ngứa nhẹ.","e"],["Có tiền sử sỏi mật, mổ hoặc can thiệp đường mật không?","Cắt túi mật mổ mở 6 năm trước vì sỏi túi mật; từng có sỏi ống mật chủ lấy qua ERCP 2 năm trước.","e"],["Có mệt lả, lú lẫn, tiểu ít hoặc choáng váng không?","Vẫn tỉnh táo nhưng mệt, tiểu ít từ sáng nay, chóng mặt khi đứng dậy.","e"],["Có nôn, đau lan ra sau lưng hoặc đau thượng vị dữ dội không?","Buồn nôn, không nôn, đau không lan ra lưng.","n"],["Có bệnh nền, dùng thuốc chống đông hoặc kháng sinh gần đây không?","Tăng huyết áp dùng enalapril; không dùng chống đông; không dùng kháng sinh gần đây.","e"],["Có sụt cân, ăn kém kéo dài không?","Không sụt cân rõ rệt trong 6 tháng.","n"]],"exam":[["K","Dấu hiệu sinh tồn và tưới máu","Mạch 108 lần/phút, huyết áp 98/60 mmHg, chi mát, thời gian đầy mao mạch 3 giây.","e"],["K","Da và củng mạc","Vàng da, vàng củng mạc rõ, vết gãi trầy xước nhẹ.","e"],["K","Khám bụng hạ sườn phải","Ấn đau hạ sườn phải, không co cứng lan tỏa; sẹo mổ cũ dưới sườn phải; gan không to, không sờ túi mật.","e"],["K","Tri giác","Tỉnh, trả lời đúng, GCS 15, mệt mỏi.","e"],["K","Tim phổi","Tim nhanh đều; phổi thông khí rõ.","n"],["K","Dấu hiệu xuất huyết","Không bầm máu, không xuất huyết dưới da.","n"]],"tests":[["Công thức máu, CRP, lactate, creatinin",10,"Bạch cầu 17,8 G/L; CRP 168 mg/L; lactate 3,2 mmol/L; creatinin 156 µmol/L; tiểu cầu 128 G/L.","e"],["Chức năng gan mật và đông máu",10,"Bilirubin toàn phần 98 µmol/L, trực tiếp 74 µmol/L; AST 188, ALT 210 U/L; ALP và GGT tăng gấp 3 lần; INR 1,3.","e"],["Cấy máu hai bộ trước kháng sinh",10,"Đã lấy hai bộ cấy; kết quả chờ.","e"],["Siêu âm bụng",15,"Ống mật chủ giãn 13 mm, trong ống có sỏi khoảng 10 mm, gan trong và ngoài gan giãn nhẹ; không có túi mật.","e"],["MRCP trước mọi quyết định dẫn lưu",40,"Không cần thiết và làm chậm giải áp khi đã đủ bằng chứng và người bệnh không ổn định.","w"],["Nội soi dạ dày kiểm tra",20,"Không giúp xác định nguyên nhân, không có chỉ định.","w"]],"opt":{"ydx":["Viêm gan virus cấp","+Viêm đường mật cấp do sỏi ống mật chủ, Tokyo độ II (trung bình), có đáp ứng viêm hệ thống","Viêm túi mật cấp","Ung thư đầu tụy gây tắc mật"],"xu_tri":["Chỉ dùng kháng sinh uống rồi hẹn tái khám","Chờ MRCP và hẹn nội soi sau 1 tuần","+Hồi sức, kháng sinh tĩnh mạch sớm và giải áp đường mật bằng ERCP lấy sỏi sớm","Mổ mở lấy sỏi ngay không hồi sức"],"phuong_phap_giai_ap":["Chỉ cần giảm đau và chờ sỏi tự ra","Cắt dạ dày để giải áp","Chọc dò dạ dày bằng kim","+ERCP cắt cơ vòng và lấy sỏi, hoặc đặt stent mật, dẫn lưu qua gan nếu ERCP thất bại"]},"actions":["++Hồi sức: oxy, truyền dịch tinh thể, theo dõi huyết áp và nước tiểu|2|Huyết áp 98/60, lactate 3,2, có dấu giảm tưới máu.","++Cấy máu rồi kháng sinh tĩnh mạch phổ rộng trong giờ đầu (ví dụ piperacillin-tazobactam)|2|Viêm đường mật có đáp ứng viêm hệ thống cần kháng sinh sớm.","++Hội chẩn tiêu hóa can thiệp để giải áp đường mật bằng ERCP sớm|2|Kiểm soát nguồn nhiễm là điều trị then chốt.","++Vitamin K tĩnh mạch nếu INR kéo dài trước thủ thuật|1|Giảm nguy cơ chảy máu khi cắt cơ vòng.","+Theo dõi lactate, creatinin, bilirubin mỗi 6 đến 12 giờ|2|Đánh giá đáp ứng và suy cơ quan.","-Chỉ cho thuốc hạ sốt và theo dõi tại khoa|0|Không giải quyết tắc mật và nhiễm trùng.","!Trì hoãn giải áp nhiều ngày để chờ bilirubin giảm|0|Tắc mật nhiễm trùng không giải áp dễ tiến triển sốc nhiễm khuẩn."],"teach":"Bộ ba Charcot (đau hạ sườn phải, sốt rét run, vàng da) cộng với hình ảnh giãn ống mật có sỏi xác định viêm đường mật cấp. Kháng sinh sớm phải đi cùng giải áp đường mật; mức nặng Tokyo quyết định thời điểm và phương pháp.","hbu":{"hanh_chinh":"Người bệnh mô phỏng L. V. D., nam, 68 tuổi, nghỉ hưu; nhập cấp cứu rồi chuyển Ngoại tiêu hóa.","ly_do_vao_vien":"Đau hạ sườn phải, sốt cao rét run và vàng da 3 ngày.","benh_su":"Ba ngày trước đau âm ỉ hạ sườn phải, hôm sau sốt cao rét run, vàng da và vàng mắt tăng dần, nước tiểu sẫm, phân nhạt, ngứa. Hôm nay mệt nhiều, tiểu ít, chóng mặt khi đứng. Chưa điều trị kháng sinh trước nhập viện.","tien_su":"Cắt túi mật mổ mở 6 năm trước vì sỏi; lấy sỏi ống mật chủ qua ERCP 2 năm trước; tăng huyết áp dùng enalapril; không dùng chống đông; không dị ứng thuốc.","luoc_qua_co_quan":"Buồn nôn, không nôn máu, không đi cầu phân đen; không khó thở; tiểu ít hôm nay.","kham_hien_tai":"Mạch 108, huyết áp 98/60 mmHg, nhiệt độ 39,4 độ C, nhịp thở 22, SpO2 96%. Vàng da và củng mạc, vết gãi; tỉnh GCS 15; chi mát. Bụng mềm, ấn đau hạ sườn phải, sẹo mổ cũ, không phản ứng phúc mạc; không sờ được túi mật; gan không to.","can_lam_sang":"Bạch cầu 17,8 G/L, CRP 168 mg/L, lactate 3,2 mmol/L, creatinin 156 µmol/L, tiểu cầu 128 G/L. Bilirubin toàn phần 98 µmol/L, trực tiếp 74; AST 188, ALT 210 U/L; ALP, GGT tăng; INR 1,3. Siêu âm: ống mật chủ 13 mm, sỏi khoảng 10 mm, đường mật trong gan giãn nhẹ.","tom_tat":"Nam 68 tuổi đã cắt túi mật, có tiền sử sỏi ống mật chủ, đau hạ sườn phải, sốt rét run, vàng da (Charcot), huyết áp 98/60, bạch cầu 17,8, CRP cao, bilirubin 98 µmol/L, tăng ALP và GGT; siêu âm ống mật chủ giãn 13 mm có sỏi 10 mm.","dat_van_de":"Hội chứng nhiễm trùng đường mật; hội chứng tắc mật; nguyên nhân sỏi ống mật chủ; mức độ nặng; kiểm soát nguồn nhiễm.","chan_doan_so_bo":"Viêm đường mật cấp do sỏi ống mật chủ, Tokyo độ II.","bien_luan":"Bước 1: bộ ba Charcot có đủ ba dấu. Bước 2: tiêu chí Tokyo 2018: A viêm toàn thân (sốt rét run 39,4 độ, bạch cầu 17,8, CRP tăng), B ứ mật (vàng da bilirubin 98 µmol/L lớn hơn 34, men gan ALP GGT AST ALT tăng trên 1,5 lần giới hạn trên), C hình ảnh (giãn ống mật chủ, sỏi): có một dấu A, một dấu B, một dấu C nên chẩn đoán xác định. Bước 3: phân độ: độ II khi có ít nhất hai tiêu chí trong bạch cầu trên 12 hoặc dưới 4, sốt trên 39, tuổi từ 75 trở lên, bilirubin từ 5 mg/dL trở lên, albumin thấp; ở đây bạch cầu 17,8, sốt 39,4, bilirubin 98 µmol/L tương đương khoảng 5,7 mg/dL: đủ độ II. Độ III nếu suy tuần hoàn cần vận mạch, rối loạn ý thức, suy hô hấp PaO2/FiO2 dưới 300, suy thận creatinin trên 2 mg/dL, INR trên 1,5 hoặc tiểu cầu dưới 100; người bệnh còn tỉnh (GCS 15), huyết áp 98/60 chưa cần vận mạch, creatinin 156 µmol/L khoảng 1,8 mg/dL dưới ngưỡng 2,0 mg/dL: chưa đủ độ III nhưng cần theo dõi sát khả năng chuyển độ III. Bước 4: loại viêm túi mật vì không còn túi mật; loại viêm gan virus vì sốt rét run và ứ mật, hình ảnh sỏi.","sinh_ly_benh":"Sỏi ống mật chủ gây tắc nghẽn cơ học làm ứ mật và tăng áp lực đường mật. Mật bình thường vô khuẩn; khi ứ, vi khuẩn từ tá tràng ngược dòng hoặc đã có sẵn nhân lên (E. coli, Klebsiella, Enterococcus, kỵ khí). Áp lực mật tăng làm vi khuẩn và độc tố vượt qua rào cản tế bào gan qua xoang gan vào máu (trào ngược mật - máu) gây nhiễm khuẩn huyết, đáp ứng viêm hệ thống, rối loạn tưới máu, tổn thương thận. Ứ mật giảm bài tiết bilirubin và muối mật gây vàng da, ngứa, phân nhạt màu, giảm hấp thu vitamin K nên INR kéo dài.","chan_doan_phan_biet":"Viêm túi mật cấp, áp xe gan, viêm gan virus cấp hoặc rượu, ung thư đầu tụy hoặc đường mật gây tắc, viêm tụy cấp do sỏi, hẹp miệng nối mật ruột, nhiễm khuẩn huyết nguồn khác.","chan_doan_xac_dinh":"Viêm đường mật cấp do sỏi ống mật chủ trên người bệnh đã cắt túi mật, Tokyo độ II, nguy cơ chuyển độ III.","dieu_tri":"Hồi sức tích cực: oxy, truyền dịch tinh thể 20 đến 30 ml/kg theo đáp ứng, theo dõi nước tiểu, vận mạch nếu huyết áp không đáp ứng. Cấy máu rồi kháng sinh tĩnh mạch trong giờ đầu, ví dụ piperacillin-tazobactam hoặc carbapenem khi nặng, điều chỉnh theo kháng sinh đồ và chức năng thận. Giải áp đường mật: độ II cần ERCP sớm (cắt cơ vòng Oddi, lấy sỏi bằng rọ hoặc bóng, đặt stent hoặc dẫn lưu mũi mật) trong 24 đến 48 giờ; độ III hoặc không ổn định cần giải áp khẩn sau hồi sức. Nếu ERCP thất bại: dẫn lưu đường mật qua da qua gan (PTBD) hoặc phẫu thuật mở ống mật chủ lấy sỏi, dẫn lưu Kehr khi không còn lựa chọn. Vitamin K nếu INR kéo dài. Theo dõi sau thủ thuật: bilirubin giảm, men gan, sốt, dấu hiệu viêm tụy, chảy máu, thủng. Kháng sinh 4 đến 7 ngày sau giải áp thành công, kéo dài nếu cấy máu dương tính với một số vi khuẩn. Lấy sỏi triệt để nếu mới đặt stent.","tien_luong":"Dè dặt nếu chuyển độ III; tốt khi giải áp sớm, tỷ lệ tử vong giảm rõ; nguy cơ tái phát sỏi cao ở người từng có sỏi ống mật chủ.","du_phong":"Lấy sạch sỏi ống mật chủ và theo dõi sau lấy sỏi; siêu âm bụng và xét nghiệm gan định kỳ; khám ngay khi đau hạ sườn phải, sốt, vàng da; ăn ít mỡ, kiểm soát cân nặng; điều trị nguyên nhân tái phát như hẹp, sỏi trong gan."},"nguon":["Kiriyama S et al. Tokyo Guidelines 2018: diagnostic criteria and severity grading of acute cholangitis. J Hepatobiliary Pancreat Sci 2018.","Miura F et al. Tokyo Guidelines 2018: initial management of acute biliary infection and flowchart for acute cholangitis. J Hepatobiliary Pancreat Sci 2018.","ESGE Clinical Guideline: Endoscopic management of common bile duct stones, 2019."],"status":"nhap"},{"id":"ngoai-bung-006","title":"Đau bụng nhiều ngày rồi bụng cứng khắp bụng, sốt cao","kind":"Ngoại","level":"Khó","group":"ngoai","name":"Người bệnh mô phỏng P. V. K.","age":71,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Nam 71 tuổi đái tháo đường, đau bụng 4 ngày tự dùng thuốc giảm đau, hôm nay đau khắp bụng, sốt cao, mệt lả.","vitals":{"hr":118,"sbp":92,"dbp":55,"rr":26,"t":39,"spo2":94},"ask":[["Đau bụng khởi phát và diễn tiến như thế nào?","Bốn ngày trước đau quanh rốn rồi chuyển hố chậu phải; hôm qua đau giảm một lúc rồi nay đau dữ dội khắp bụng.","e"],["Có sốt, nôn, bí trung đại tiện không?","Sốt cao rét run từ đêm qua, nôn nhiều, không trung tiện từ sáng.","e"],["Đã dùng thuốc gì trước khi nhập viện?","Tự mua thuốc giảm đau paracetamol và kháng viêm, không dùng kháng sinh.","e"],["Có bệnh nền nào, như đái tháo đường, bệnh tim, dùng corticoid không?","Đái tháo đường type 2 mười năm, tăng huyết áp; không dùng corticoid.","e"],["Có tiền sử mổ bụng hoặc loét dạ dày, viêm túi thừa không?","Chưa mổ bụng, không loét dạ dày.","e"],["Có đau lan lên vai, khó thở hoặc ho không?","Hơi khó thở khi nằm, không ho.","n"],["Có dị ứng thuốc không?","Không dị ứng.","n"]],"exam":[["K","Dấu hiệu nhiễm khuẩn huyết và sốc","Mạch 118, huyết áp 92/55, nhịp thở 26, SpO2 94%, chi mát, mặt hốc hác, môi khô.","e"],["K","Khám bụng toàn bộ","Bụng chướng nhẹ, ít di động theo nhịp thở, co cứng thành bụng lan tỏa như gỗ, phản ứng dội (+) khắp bụng, ấn đau rõ hố chậu phải.","e"],["K","Gõ và nghe bụng","Gõ đục vùng thấp, mất vùng đục trước gan; nhu động ruột giảm.","e"],["K","Thăm trực tràng","Túi cùng Douglas căng đau, không có máu.","e"],["K","Tim phổi","Tim nhanh đều; phổi đáy phải ran ẩm nhẹ.","n"],["K","Dấu mất nước","Da nhăn, tiểu ít sẫm màu.","n"]],"tests":[["Công thức máu, CRP, procalcitonin, lactate, khí máu",10,"Bạch cầu 21,6 G/L, đa nhân trung tính 92%; CRP 286 mg/L; procalcitonin 8,4 ng/ml; lactate 4,1 mmol/L; pH 7,31.","e"],["Điện giải, creatinin, đường huyết, đông máu",10,"Na 131, K 3,3 mmol/L; creatinin 164 µmol/L; đường huyết 16,8 mmol/L; INR 1,4.","e"],["CT bụng chậu có cản quang",40,"Ruột thừa thủng, có sỏi phân ở hố chậu phải, ổ áp xe 4 x 3 cm quanh manh tràng, ít khí tự do ngoài lòng ruột, dịch ổ bụng lan tỏa, quai ruột non giãn nhẹ.","e"],["X quang ngực bụng đứng",10,"Ít khí tự do dưới cơ hoành phải, đáy phổi phải mờ nhẹ.","e"],["Nội soi đại tràng ngay để tìm nguyên nhân",20,"Chống chỉ định khi viêm phúc mạc, nguy cơ thủng.","w"],["Chờ cấy máu có kết quả mới dùng kháng sinh",10,"Chậm kháng sinh trong nhiễm khuẩn huyết làm tăng tử vong.","w"]],"opt":{"ydx":["Tắc ruột do dính sau mổ","+Viêm phúc mạc toàn thể do ruột thừa vỡ, có nhiễm khuẩn huyết","Viêm tụy cấp hoại tử","Viêm dạ dày ruột cấp"],"uu_tien":["Hội chẩn tiêu hóa nội soi can thiệp","+Hồi sức tích cực, kháng sinh trong giờ đầu và mổ cấp cứu kiểm soát nguồn nhiễm","Chỉ dùng kháng sinh và theo dõi vài ngày","Cho thuốc giảm đau và hẹn tái khám"],"phuong_phap_mo":["Chỉ rạch hố chậu phải dẫn lưu và không cắt ruột thừa","+Mở bụng đường giữa hoặc nội soi nếu ổn định, cắt ruột thừa, rửa bụng, dẫn lưu hố chậu","Cắt manh tràng và làm hậu môn nhân tạo ngay cho mọi trường hợp","Mở bụng thăm dò rồi đóng bụng"]},"actions":["++Hồi sức: 2 đường truyền, oxy, truyền dịch tinh thể 30 ml/kg, theo dõi huyết áp và nước tiểu|2|Huyết áp 92/55, lactate 4,1, có dấu giảm tưới máu.","++Cấy máu rồi kháng sinh tĩnh mạch phổ rộng trong giờ đầu (piperacillin-tazobactam hoặc carbapenem)|2|Nhiễm khuẩn huyết do viêm phúc mạc cần kháng sinh sớm.","++Hội chẩn ngoại khoa và gây mê hồi sức để mổ cấp cứu kiểm soát nguồn nhiễm|2|Viêm phúc mạc toàn thể cần mổ sớm sau hồi sức nhanh.","++Đặt sonde dạ dày, sonde tiểu theo dõi nước tiểu|2|Giảm chướng, theo dõi tưới máu thận.","++Kiểm soát đường huyết bằng insulin truyền|2|Đường huyết 16,8 làm nặng nhiễm trùng.","-Cho thuốc giảm đau mạnh rồi quan sát 24 giờ|0|Làm chậm điều trị nguồn nhiễm.","!Làm nội soi đại tràng để tìm nguyên nhân khi bụng cứng|0|Nguy cơ thủng, chống chỉ định khi viêm phúc mạc."],"teach":"Đau bụng hố chậu phải nhiều ngày rồi co cứng khắp bụng kèm sốt cao, mạch nhanh, tụt huyết áp, lactate cao là viêm phúc mạc toàn thể do vỡ ruột thừa cho đến khi chứng minh ngược lại. Hồi sức nhanh, kháng sinh sớm và mổ kiểm soát nguồn nhiễm là ba trụ cột.","hbu":{"hanh_chinh":"Người bệnh mô phỏng P. V. K., nam, 71 tuổi, nghỉ hưu; nhập cấp cứu rồi chuyển Ngoại tiêu hóa và hồi sức.","ly_do_vao_vien":"Đau bụng khắp bụng dữ dội, sốt cao, mệt lả sau 4 ngày đau bụng.","benh_su":"Bốn ngày trước đau quanh rốn rồi chuyển hố chậu phải, chán ăn, nôn, sốt nhẹ. Tự dùng paracetamol và kháng viêm, đau giảm tạm thời ngày thứ ba rồi tăng dữ dội khắp bụng từ hôm qua, sốt cao rét run, nôn nhiều, không trung tiện, tiểu ít, mệt lả.","tien_su":"Đái tháo đường type 2 mười năm, điều trị metformin không đều; tăng huyết áp; không mổ bụng; không dùng corticoid kéo dài; không dị ứng thuốc.","luoc_qua_co_quan":"Hơi khó thở khi nằm, không ho đờm; tiểu ít; không phân máu.","kham_hien_tai":"Mạch 118, huyết áp 92/55, nhiệt độ 39 độ C, nhịp thở 26, SpO2 94%. Mệt lả, chi mát, môi khô. Bụng chướng nhẹ, ít di động theo nhịp thở, co cứng lan tỏa, phản ứng dội khắp bụng, đau rõ hố chậu phải; mất vùng đục trước gan; nhu động giảm; thăm trực tràng túi cùng Douglas đau.","can_lam_sang":"Bạch cầu 21,6 G/L, CRP 286 mg/L, procalcitonin 8,4 ng/ml, lactate 4,1 mmol/L, pH 7,31; creatinin 164 µmol/L; đường huyết 16,8 mmol/L; Na 131, K 3,3. CT: ruột thừa thủng, sỏi phân, ổ áp xe 4 x 3 cm, ít khí tự do, dịch lan tỏa. X quang: ít khí dưới hoành.","tom_tat":"Nam 71 tuổi đái tháo đường, đau hố chậu phải 4 ngày rồi lan khắp bụng, sốt cao, nôn, bụng cứng như gỗ, phản ứng dội lan tỏa, mạch 118, huyết áp 92/55, nhịp thở 26, lactate 4,1, bạch cầu 21,6, procalcitonin cao, creatinin tăng; CT ruột thừa thủng và dịch lan tỏa.","dat_van_de":"Hội chứng viêm phúc mạc toàn thể; nhiễm khuẩn huyết và giảm tưới máu; nguyên nhân ruột thừa vỡ; nhu cầu hồi sức và mổ cấp cứu.","chan_doan_so_bo":"Viêm phúc mạc toàn thể do ruột thừa vỡ, nhiễm khuẩn huyết, đái tháo đường type 2 tăng đường huyết.","bien_luan":"Bước 1: có viêm phúc mạc vì bụng cứng lan tỏa, phản ứng dội, mất vùng đục trước gan, túi cùng Douglas đau. Bước 2: nguyên nhân từ ruột thừa vì khởi phát điển hình quanh rốn xuống hố chậu phải, đau tại hố chậu phải rõ nhất, đỡ tạm thời rồi tăng khi thủng, CT xác nhận ruột thừa thủng có sỏi phân. Bước 3: có nhiễm khuẩn huyết vì sốt 39, nhịp thở 26, mạch 118, bạch cầu 21,6, procalcitonin 8,4, qSOFA 2 điểm (nhịp thở trên 22, huyết áp tâm thu dưới 100), lactate 4,1, creatinin tăng gợi tổn thương thận. Bước 4: đái tháo đường và tuổi cao làm bệnh nặng hơn, giảm đáp ứng, dấu hiệu bị che lấp bởi thuốc giảm đau. Bước 5: loại thủng dạ dày tá tràng, viêm tụy hoại tử, thiếu máu ruột bằng CT và tiền sử.","sinh_ly_benh":"Tắc lòng ruột thừa gây ứ dịch, viêm, thiếu máu, hoại tử thành rồi thủng sau 24 đến 72 giờ. Khi thủng, dịch mủ và phân tràn vào ổ phúc mạc, gây viêm phúc mạc: phúc mạc viêm phù nề, tiết dịch, liệt ruột do phản xạ, thoát dịch vào khoang thứ ba giảm thể tích tuần hoàn. Vi khuẩn (E. coli, Bacteroides) và nội độc tố vào máu qua phúc mạc, hệ bạch huyết gây đáp ứng viêm hệ thống, giãn mạch, giảm tưới máu, tăng lactate, suy thận. Đường huyết cao và tuổi già làm giảm miễn dịch, làm bệnh tiến triển nhanh. Phúc mạc bị kích thích làm co cứng thành bụng phản xạ.","chan_doan_phan_biet":"Thủng dạ dày tá tràng, viêm túi thừa đại tràng thủng, thủng đại tràng do u, viêm tụy cấp hoại tử, nhồi máu mạc treo, tắc ruột có thủng, vỡ phình động mạch chủ bụng. Các chẩn đoán này được phân biệt bằng CT.","chan_doan_xac_dinh":"Viêm phúc mạc toàn thể do ruột thừa vỡ, nhiễm khuẩn huyết (qSOFA 2), tăng đường huyết, tổn thương thận cấp.","dieu_tri":"Hồi sức song song với chuẩn bị mổ: đường truyền lớn, truyền dịch tinh thể 30 ml/kg trong 3 giờ đầu, mục tiêu huyết áp trung bình từ 65 mmHg, vận mạch (noradrenalin) nếu hạ huyết áp kéo dài, oxy, sonde tiểu theo dõi nước tiểu. Cấy máu rồi kháng sinh tĩnh mạch trong giờ đầu: piperacillin-tazobactam hoặc carbapenem, điều chỉnh theo kháng sinh đồ và chức năng thận. Insulin truyền mục tiêu đường huyết 8 đến 10 mmol/L. Mổ cấp cứu kiểm soát nguồn nhiễm trong vài giờ sau hồi sức: mở bụng đường giữa hoặc nội soi nếu huyết động ổn, cắt ruột thừa, lấy sỏi phân, rửa ổ bụng nhiều nước muối ấm, dẫn lưu hố chậu và Douglas; cắt đoạn manh tràng khi hoại tử lan. Hậu phẫu: hồi sức tích cực, kháng sinh 4 đến 7 ngày, nuôi dưỡng sớm, theo dõi áp xe tồn dư, rò, nhiễm trùng vết mổ, dự phòng huyết khối, theo dõi đường huyết và thận.","tien_luong":"Dè dặt do tuổi cao, đái tháo đường, viêm phúc mạc toàn thể và nhiễm khuẩn huyết; tỷ lệ tử vong và biến chứng cao; nhiều khả năng cần hồi sức kéo dài.","du_phong":"Đến viện sớm khi đau bụng dữ dội, tránh tự dùng thuốc giảm đau và kháng viêm che lấp triệu chứng; kiểm soát đường huyết; người cao tuổi đau hố chậu phải cần khám ngay; theo dõi vết mổ, tái khám sau 2 tuần; kiểm tra nội soi đại tràng sau điều trị ở người trên 50 tuổi để loại trừ u."},"nguon":["Di Saverio S et al. WSES Jerusalem guidelines for diagnosis and treatment of acute appendicitis, 2020.","Sartelli M et al. WSES/GAIS/SIS-E/WSIS/AAST global guidelines for intra-abdominal infections. World J Emerg Surg 2021.","Evans L et al. Surviving Sepsis Campaign: International Guidelines for Management of Sepsis and Septic Shock 2021."],"status":"nhap"},{"id":"ngoai-bung-007","title":"Thay đổi thói quen đi cầu nhiều tháng, nay bụng chướng và bí trung đại tiện","kind":"Ngoại","level":"Khó","group":"ngoai","name":"Người bệnh mô phỏng Đ. T. H.","age":66,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Nữ 66 tuổi, 3 tháng nay đi cầu phân nhỏ lẫn máu, sụt cân, thiếu máu; 3 ngày nay bụng chướng to, nôn và không trung tiện.","vitals":{"hr":110,"sbp":100,"dbp":62,"rr":22,"t":37.6,"spo2":96},"ask":[["Thói quen đại tiện thay đổi từ khi nào, như thế nào?","Ba tháng nay táo bón xen kẽ tiêu chảy, phân nhỏ dẹt, thỉnh thoảng lẫn máu đỏ sẫm và nhầy.","e"],["Có sụt cân, mệt, ăn kém không?","Sụt 6 kg trong 3 tháng, mệt, da xanh, ăn kém.","e"],["Ba ngày nay bụng thế nào?","Bụng chướng to dần, đau quặn từng cơn vùng bụng dưới, nôn muộn ra dịch vàng, không trung tiện, không đi cầu 3 ngày.","e"],["Có tiền sử polyp, bệnh viêm ruột hoặc ung thư trong gia đình không?","Chưa nội soi đại tràng bao giờ; mẹ mất do ung thư đại tràng lúc 70 tuổi.","e"],["Có tiền sử mổ bụng không?","Chưa mổ bụng.","e"],["Có bệnh nền và dùng thuốc gì không?","Tăng huyết áp dùng amlodipin; không đái tháo đường; không dùng chống đông.","n"],["Có sốt, đau bụng liên tục hoặc ngất không?","Sốt nhẹ, không ngất, đau quặn từng cơn.","n"]],"exam":[["K","Khám bụng: nhìn, sờ, gõ","Bụng chướng căng không đều, nhìn thấy quai ruột nổi ở khung đại tràng, gõ vang, ấn đau nhẹ hố chậu trái, không co cứng.","e"],["K","Nghe nhu động ruột","Nhu động tăng, âm sắc cao, thỉnh thoảng có tiếng nước óc ách.","e"],["K","Thăm trực tràng","Bóng trực tràng rỗng, không sờ thấy khối thấp; găng dính ít phân nhầy lẫn máu.","e"],["K","Da niêm mạc và hạch","Da niêm mạc nhợt, môi khô; không hạch thượng đòn, không hạch bẹn.","e"],["K","Gan và dấu hiệu di căn","Gan không to, không dịch cổ trướng rõ.","n"],["K","Tim phổi","Tim nhanh đều; phổi trong.","n"]],"tests":[["Công thức máu, điện giải, creatinin, lactate",10,"Hồng cầu 3,2 T/L, Hb 82 g/L, MCV 72 fL; bạch cầu 11,4 G/L; Na 133, K 3,0 mmol/L; creatinin 112 µmol/L; lactate 2,0 mmol/L.","e"],["X quang bụng đứng không chuẩn bị",10,"Đại tràng giãn khung, manh tràng 9,5 cm, ít hơi ở trực tràng, vài mức nước hơi ruột non.","e"],["CT bụng chậu có cản quang",40,"Khối u dày thành đồng tâm đại tràng sigma dài khoảng 5 cm gây hẹp lòng; đại tràng phía trên giãn, manh tràng 9,5 cm; van hồi manh tràng đóng; không thủng, không khí tự do; vài hạch mạc treo 1 cm; một nốt gan 1,2 cm nghi di căn.","e"],["CEA máu",10,"CEA 24 ng/ml (tăng).","n"],["Nội soi đại tràng ống cứng chuẩn bị bằng thuốc xổ ngay",20,"Chống chỉ định khi tắc ruột và nguy cơ thủng; không dùng thuốc xổ nhiều.","w"],["Uống bari hoặc bơm thuốc cản quang bari đường hậu môn tùy tiện",10,"Nguy cơ thủng, không thay thế CT.","w"]],"opt":{"ydx":["Tắc ruột do dính","Xoắn đại tràng sigma","Viêm túi thừa đại tràng sigma","+Ung thư đại tràng sigma gây tắc ruột đại tràng kèm thiếu máu thiếu sắt"],"xu_tri":["Cho thuốc xổ mạnh và theo dõi","+Hồi sức bù dịch và điện giải, sonde dạ dày, kháng sinh, chuẩn bị mổ cấp cứu hoặc đặt stent làm cầu nối theo hội chẩn","Nội soi đại tràng ngay để chẩn đoán rồi về","Nhịn ăn và theo dõi 1 tuần"],"phuong_phap_mo":["Cắt đoạn đại tràng và nối ngay trong mọi tình huống kể cả khi nhiễm bẩn nặng","+Cắt đoạn đại tràng sigma kiểu Hartmann hoặc cắt nối có hậu môn nhân tạo bảo vệ, hoặc stent làm cầu nối rồi mổ chương trình","Chỉ làm hậu môn nhân tạo mà không giải quyết khối u trong mọi trường hợp","Chỉ mở bụng thăm dò rồi đóng"]},"actions":["++Nhịn ăn, đặt sonde dạ dày hút, truyền dịch tinh thể|2|Giảm chướng, bù dịch cho người bệnh mất nước và hạ natri.","++Bù kali, theo dõi điện giải, truyền hồng cầu khi cần|2|K 3,0 mmol/L và Hb 82 g/L cần điều chỉnh trước mổ.","++Kháng sinh dự phòng hoặc điều trị (ví dụ ceftriaxone phối hợp metronidazol)|2|Giảm nguy cơ nhiễm khuẩn, tiên lượng thủng.","++Hội chẩn ngoại, nội soi tiêu hóa can thiệp và gây mê hồi sức|2|Quyết định mổ cấp cứu hay đặt stent làm cầu nối.","+Đánh dấu vị trí hậu môn nhân tạo, giải thích người bệnh và gia đình|2|Chuẩn bị tâm lý, cho khả năng cắt Hartmann.","-Thụt tháo bằng nước nhiều lần|0|Có thể gây thủng, không giải quyết tắc nghẽn cơ học.","!Nội soi đại tràng ống cứng ngay khi đại tràng giãn căng|0|Nguy cơ thủng đại tràng, không có chỉ định cấp cứu."],"teach":"Thay đổi thói quen đại tiện, phân máu, sụt cân, thiếu máu thiếu sắt ở người trên 50 tuổi là báo động ung thư đại trực tràng. Khi tắc ruột đại tràng, manh tràng giãn quá 10 đến 12 cm kèm van hồi manh tràng đóng cần xử trí khẩn để tránh thủng.","hbu":{"hanh_chinh":"Người bệnh mô phỏng Đ. T. H., nữ, 66 tuổi, nội trợ; nhập cấp cứu rồi chuyển Ngoại tiêu hóa.","ly_do_vao_vien":"Bụng chướng, nôn và bí trung đại tiện 3 ngày, trên nền rối loạn đại tiện 3 tháng.","benh_su":"Ba tháng nay táo bón xen kẽ tiêu chảy, phân nhỏ dẹt, thỉnh thoảng lẫn máu đỏ sẫm và nhầy, sụt 6 kg, mệt, da xanh, chưa đi khám. Ba ngày nay bụng chướng to dần, đau quặn từng cơn vùng bụng dưới, nôn muộn dịch vàng, không trung tiện, không đi cầu. Sốt nhẹ.","tien_su":"Tăng huyết áp dùng amlodipin. Chưa nội soi đại tràng; mẹ mất do ung thư đại tràng lúc 70 tuổi. Chưa mổ bụng. Không dùng chống đông. Không dị ứng thuốc.","luoc_qua_co_quan":"Mệt mỏi, hồi hộp khi gắng sức; không ho; không tiểu máu; không vàng da.","kham_hien_tai":"Mạch 110, huyết áp 100/62 mmHg, nhiệt độ 37,6 độ C, nhịp thở 22, SpO2 96%. Da niêm mạc nhợt, môi khô. Bụng chướng căng không đều, thấy quai ruột nổi khung đại tràng, gõ vang, nhu động tăng, âm sắc cao, ấn đau nhẹ hố chậu trái, không co cứng. Thăm trực tràng rỗng, dính phân nhầy lẫn máu. Không hạch ngoại biên.","can_lam_sang":"Hb 82 g/L, MCV 72 fL; bạch cầu 11,4 G/L; Na 133, K 3,0; creatinin 112 µmol/L; lactate 2,0. X quang: đại tràng giãn khung, manh tràng 9,5 cm. CT: khối u dày thành sigma dài 5 cm gây hẹp, đại tràng trên giãn, van hồi manh tràng đóng, nốt gan 1,2 cm nghi di căn, hạch mạc treo 1 cm, không thủng. CEA 24 ng/ml.","tom_tat":"Nữ 66 tuổi, thay đổi thói quen đại tiện, phân máu, sụt 6 kg trong 3 tháng, thiếu máu hồng cầu nhỏ (Hb 82 g/L), tiền sử mẹ ung thư đại tràng; vào vì tắc ruột 3 ngày: chướng bụng, nôn, bí trung đại tiện, đại tràng giãn khung, manh tràng 9,5 cm; CT u sigma hẹp lòng, nghi di căn gan, CEA 24.","dat_van_de":"Hội chứng tắc ruột thấp (đại tràng); nghi ung thư đại tràng sigma có di căn; thiếu máu thiếu sắt; rối loạn nước và điện giải; nguy cơ thủng manh tràng.","chan_doan_so_bo":"Tắc ruột đại tràng do u sigma, nghi ung thư đại tràng giai đoạn muộn, thiếu máu thiếu sắt.","bien_luan":"Bước 1: bụng chướng căng không đều ở khung đại tràng, nôn muộn, bí trung đại tiện, thăm trực tràng rỗng, X quang đại tràng giãn khung là tắc ruột đại tràng. Bước 2: nguyên nhân do u vì tiền triệu 3 tháng thay đổi thói quen đại tiện, phân nhỏ, phân máu nhầy, sụt cân, thiếu máu thiếu sắt (MCV 72), tuổi trên 50, mẹ ung thư đại tràng; CT thấy u sigma dày thành đồng tâm gây hẹp; ít khả năng dính vì chưa mổ bụng, ít khả năng xoắn vì có khối u. Bước 3: mức độ khẩn: manh tràng 9,5 cm gần ngưỡng nguy cơ thủng (10 đến 12 cm), van hồi manh tràng đóng nên tạo quai kín, nôn muộn, nhịp tim nhanh, K 3,0, lactate 2,0 cần theo dõi sát. Bước 4: giai đoạn: có nốt gan 1,2 cm và CEA 24 nghi di căn (cần xác định thêm), hạch mạc treo.","sinh_ly_benh":"Ung thư biểu mô tuyến đại tràng phát triển từ polyp tuyến qua chuỗi đột biến (APC, KRAS, TP53...). Khối u dày thành đồng tâm làm hẹp dần lòng đại tràng sigma, ban đầu phân nhỏ, táo bón xen tiêu chảy; khi hẹp tới mức làm tắc hoàn toàn, hơi và phân ứ phía trên. Nếu van hồi manh tràng đóng kín, hơi không thoát ngược lên ruột non, đại tràng giãn như quai kín, theo định luật Laplace manh tràng (đường kính lớn nhất) chịu sức căng thành lớn nhất, giảm tưới máu, thiếu máu, thủng. Chảy máu rỉ rả từ khối u gây thiếu máu thiếu sắt hồng cầu nhỏ. Nôn muộn và thoát dịch vào lòng ruột gây mất nước, hạ natri, hạ kali.","chan_doan_phan_biet":"Tắc ruột do dính, xoắn đại tràng sigma, viêm túi thừa đại tràng sigma gây hẹp, lồng ruột, polyp lớn, hẹp do viêm ruột (Crohn), thiếu máu đại tràng, giả tắc đại tràng cấp (hội chứng Ogilvie).","chan_doan_xac_dinh":"Tắc ruột đại tràng do ung thư đại tràng sigma (xác định giải phẫu bệnh sau mổ hoặc sinh thiết qua nội soi), nghi di căn gan, chưa xác định giai đoạn đầy đủ; thiếu máu thiếu sắt.","dieu_tri":"Hồi sức tiền phẫu: nhịn ăn, sonde dạ dày, truyền dịch tinh thể, bù natri và kali theo điện giải, truyền hồng cầu lắng khi Hb dưới 70 đến 80 g/L hoặc có triệu chứng, kháng sinh (ceftriaxone phối hợp metronidazol), dự phòng huyết khối. Hội chẩn đa chuyên khoa. Chỉ định phẫu thuật khẩn nếu có dấu hiệu thủng, viêm phúc mạc, thiếu máu đại tràng hoặc manh tràng sắp thủng; mổ cắt đoạn sigma kiểu Hartmann hoặc cắt nối kèm hậu môn nhân tạo bảo vệ tùy tình trạng người bệnh và bẩn ổ bụng. Nếu không có thủng và nguy cơ mổ cao: đặt stent kim loại nội soi làm cầu nối rồi mổ chương trình sau 2 tuần, hoặc làm hậu môn nhân tạo giảm tắc. Sau đó xác định giai đoạn (CT ngực, MRI gan) và hóa trị theo ung bướu nếu di căn. Hậu phẫu: giảm đau đa mô thức, kháng sinh, nuôi ăn sớm, chăm sóc hậu môn nhân tạo, dự phòng huyết khối, theo dõi rò miệng nối, nhiễm trùng vết mổ, giải phẫu bệnh để quyết định điều trị bổ trợ.","tien_luong":"Dè dặt: tắc ruột do ung thư đại tràng có tỷ lệ biến chứng và tử vong cao hơn mổ chương trình; tiên lượng lâu dài phụ thuộc giai đoạn, di căn gan và đáp ứng điều trị hệ thống.","du_phong":"Sàng lọc ung thư đại trực tràng từ 45 đến 50 tuổi bằng xét nghiệm máu ẩn trong phân và nội soi đại tràng, sớm hơn ở người có tiền sử gia đình; khám khi có phân máu, thay đổi thói quen đại tiện, thiếu máu thiếu sắt; chế độ ăn nhiều chất xơ, hạn chế thịt đỏ và chế biến sẵn, vận động, bỏ thuốc lá, hạn chế rượu; tầm soát người thân bậc một."},"nguon":["Pisano M et al. 2017 WSES guidelines on colon and rectal cancer emergencies: obstruction and perforation. World J Emerg Surg 2018.","van Hooft JE et al. Self-expandable metal stents for obstructing colonic and extracolonic cancer: ESGE Clinical Guideline update. Endoscopy 2020.","Bộ Y tế. Hướng dẫn chẩn đoán và điều trị ung thư đại trực tràng, Quyết định hiện hành."],"status":"nhap"},{"id":"ngoai-bung-008","title":"Đau nhức nhối cạnh hậu môn, sưng nóng đỏ và sốt","kind":"Ngoại","level":"Dễ","group":"ngoai","name":"Người bệnh mô phỏng V. M. Q.","age":34,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Nam 34 tuổi đến khám vì đau nhức nhối vùng hậu môn bên trái 4 ngày, có cục sưng nóng đỏ, ngồi đau và sốt.","vitals":{"hr":94,"sbp":122,"dbp":76,"rr":18,"t":38.4,"spo2":99},"ask":[["Đau và sưng cạnh hậu môn khởi phát thế nào?","Bốn ngày nay đau nhức nhối, tăng dần, có cục sưng nóng đỏ cạnh hậu môn bên trái, ngồi hoặc đi lại đau nhiều, đau cả đêm.","e"],["Có sốt, rét run không?","Sốt khoảng 38 độ và ớn lạnh từ hôm qua.","e"],["Có chảy mủ, chảy dịch hoặc đại tiện đau không?","Chưa có mủ chảy ra; đại tiện đau nhiều, hơi táo bón vài ngày.","e"],["Có tiền sử áp xe hoặc rò hậu môn, bệnh viêm ruột không?","Cách đây 2 năm có một lần sưng đau tương tự, tự giảm sau uống kháng sinh.","e"],["Có đái tháo đường, suy giảm miễn dịch hoặc dùng corticoid không?","Không bệnh nền, không dùng corticoid.","e"],["Có quan hệ tình dục hậu môn hoặc chấn thương vùng hậu môn không?","Không chấn thương; không quan hệ qua hậu môn.","n"],["Có tiểu khó, tiểu buốt hay sút cân không?","Không.","n"]],"exam":[["K","Nhìn vùng quanh hậu môn","Khối sưng nóng đỏ cạnh hậu môn vị trí 9 giờ (tư thế sản khoa), đường kính khoảng 4 cm, cách bờ hậu môn khoảng 2 cm, da căng bóng.","e"],["K","Sờ khối","Rất đau, căng, nóng, có dấu bập bềnh (+), không có bờ hậu môn bị tụt xuống.","e"],["K","Thăm trực tràng","Đau nhiều, khó thăm; sờ thấy vùng căng cứng thành bên trái ống hậu môn; không khối trực tràng.","e"],["K","Toàn trạng","Tỉnh, vẻ mặt đau, nhiệt độ 38,4 độ C, không dấu hiệu nhiễm khuẩn huyết.","e"],["K","Khám bụng","Bụng mềm, không đau.","n"],["K","Hạch bẹn","Không hạch bẹn to.","n"]],"tests":[["Công thức máu và CRP",10,"Bạch cầu 14,6 G/L; CRP 54 mg/L.","e"],["Đường huyết lúc đói",10,"Đường huyết 5,6 mmol/L.","e"],["Siêu âm phần mềm hoặc siêu âm nội trực tràng",15,"Ổ tụ dịch 3,8 x 2,6 cm dưới da cạnh hậu môn bên trái, có vách mỏng, chưa thấy lỗ dò rõ.","e"],["MRI vùng chậu",10,"Chỉ định khi áp xe phức tạp, tái phát hoặc nghi dò phức tạp, không cần ở ca đơn giản này.","n"],["Chụp CT bụng chậu thường quy cho mọi người bệnh",40,"Không cần ở ca áp xe quanh hậu môn đơn giản, tăng chi phí và bức xạ.","w"],["Chỉ cho kháng sinh uống và chờ áp xe tự vỡ",10,"Không đủ, áp xe mủ cần dẫn lưu.","w"]],"opt":{"ydx":["Trĩ ngoại tắc mạch","Nứt kẽ hậu môn cấp","Nang lông vùng cụt bị viêm","+Áp xe quanh hậu môn dưới da bên trái"],"xu_tri":["+Rạch dẫn lưu mủ sớm, kèm giảm đau và ngâm ngồi ấm","Chỉ dùng kháng sinh uống 5 đến 7 ngày","Chườm lạnh và chờ khối tự xẹp","Chờ khối chín mười ngày rồi mới can thiệp"],"sau_dan_luu":["Luôn mổ cắt đường dò ngay mọi trường hợp","+Hẹn khám lại tìm đường dò hậu môn và điều trị dò khi đã ổn viêm","Kháng sinh dài ngày để ngừa dò","Không cần theo dõi sau dẫn lưu"]},"actions":["++Giải thích thủ thuật, ký cam kết và chuẩn bị rạch dẫn lưu|2|Áp xe có mủ cần dẫn lưu, kháng sinh đơn thuần không đủ.","++Rạch dẫn lưu mủ tại chỗ hoặc trong phòng mổ dưới gây tê, rạch gần bờ hậu môn|2|Dẫn lưu sớm giảm đau, giảm lan rộng; rạch gần bờ hậu môn giảm đường dò dài.","+Giảm đau (paracetamol, NSAID), nhuận tràng mềm phân|2|Giảm đau khi đại tiện và hạn chế táo bón.","+Ngâm ngồi nước ấm 2 đến 3 lần mỗi ngày sau dẫn lưu, thay băng|2|Giúp vết thương dẫn lưu liền từ đáy.","+Gửi dịch mủ nuôi cấy khi có yếu tố nguy cơ, đái tháo đường hoặc tái phát|1|Chọn kháng sinh theo vi khuẩn khi cần.","-Chỉ chườm ấm và uống kháng sinh|0|Không dẫn lưu mủ, bệnh kéo dài và dễ lan.","!Chọc hút mủ nhiều lần rồi đóng kín vết rạch|0|Áp xe tái phát nhanh, tăng nguy cơ dò và nhiễm trùng lan."],"teach":"Đau nhức nhối cạnh hậu môn kèm khối sưng nóng đỏ, dấu bập bềnh là áp xe quanh hậu môn; điều trị cơ bản là rạch dẫn lưu mủ. Khoảng 30 đến 50% có dò hậu môn về sau nên cần hẹn tái khám.","hbu":{"hanh_chinh":"Người bệnh mô phỏng V. M. Q., nam, 34 tuổi, lái xe; khám phòng khám ngoại tiêu hóa rồi nhập khoa ngoại.","ly_do_vao_vien":"Đau nhức nhối và sưng nóng đỏ cạnh hậu môn trái 4 ngày kèm sốt.","benh_su":"Bốn ngày nay đau nhức nhối cạnh hậu môn bên trái, tăng dần, có cục sưng nóng đỏ, đau khi ngồi và đại tiện, đau cả đêm, hôm qua sốt 38 độ kèm ớn lạnh. Chưa chảy mủ. Táo bón vài ngày. Tiền sử 2 năm trước một đợt sưng đau tương tự, hết sau uống kháng sinh.","tien_su":"Không đái tháo đường, không dùng corticoid, không bệnh viêm ruột, chưa phẫu thuật hậu môn. Không dị ứng thuốc.","luoc_qua_co_quan":"Không tiểu khó; không sụt cân; không tiêu chảy máu; không đau bụng.","kham_hien_tai":"Mạch 94, huyết áp 122/76 mmHg, nhiệt độ 38,4 độ C, nhịp thở 18. Khối sưng nóng đỏ cạnh hậu môn vị trí 9 giờ (tư thế sản khoa), khoảng 4 cm, cách bờ hậu môn 2 cm, da căng bóng, rất đau, bập bềnh (+). Thăm trực tràng khó, đau, vùng cứng thành bên trái ống hậu môn. Bụng mềm.","can_lam_sang":"Bạch cầu 14,6 G/L, CRP 54 mg/L; đường huyết lúc đói 5,6 mmol/L. Siêu âm: ổ tụ dịch 3,8 x 2,6 cm dưới da cạnh hậu môn trái, chưa thấy lỗ dò rõ.","tom_tat":"Nam 34 tuổi đau nhức nhối cạnh hậu môn trái 4 ngày, sốt 38,4, khối sưng nóng đỏ 4 cm vị trí 9 giờ, bập bềnh (+), bạch cầu và CRP tăng, siêu âm ổ tụ dịch 3,8 x 2,6 cm dưới da; không đái tháo đường; có một đợt tương tự cách 2 năm.","dat_van_de":"Khối sưng viêm quanh hậu môn; hội chứng nhiễm trùng; nguyên nhân từ tuyến hậu môn; cần dẫn lưu và đánh giá đường dò.","chan_doan_so_bo":"Áp xe quanh hậu môn dưới da bên trái.","bien_luan":"Bước 1: có quá trình viêm mủ khu trú vì sưng nóng đỏ đau, sốt, bạch cầu tăng. Bước 2: vị trí quanh hậu môn, cách bờ hậu môn 2 cm, nằm dưới da (nông) và bập bềnh nên là ổ mủ đã thành. Bước 3: nguyên nhân thường do nhiễm trùng tuyến hậu môn ở đường lược (thuyết tuyến hậu môn); có đợt tương tự trước nên nghi có dò hậu môn kèm theo. Bước 4: không có dấu hiệu lan sâu (không đau bụng, thăm trực tràng không khối trên cơ nâng hậu môn), không nhiễm khuẩn huyết, không đái tháo đường. Bước 5: loại trừ trĩ ngoại tắc mạch (không có cục tím nhẹ, không sốt), nứt kẽ hậu môn (đau lúc đi cầu nhưng không sưng áp xe), nang lông (vị trí vùng cụt).","sinh_ly_benh":"Các tuyến hậu môn đổ vào hậu môn ở đường lược trong khoảng giữa cơ thắt trong và ngoài. Tắc nghẽn ống tuyến do phân, dị vật hoặc viêm làm ứ dịch, vi khuẩn đường ruột (E. coli, Bacteroides, Enterococcus, tụ cầu) nhân lên tạo ổ nhiễm khuẩn ở khoảng gian cơ thắt. Mủ lan theo các khoảng quanh hậu môn: xuống dưới tạo áp xe quanh hậu môn dưới da; ra ngoài cơ thắt ngoài tạo áp xe ngồi - trực tràng; lên trên tạo áp xe liên cơ thắt hoặc cơ nâng. Áp lực mủ gây đau nhức nhối, nóng đỏ, sốt. Sau dẫn lưu, đường thông từ tuyến hậu môn ra da còn tồn tại sẽ thành dò hậu môn ở khoảng 30 đến 50% người bệnh.","chan_doan_phan_biet":"Trĩ ngoại tắc mạch, nứt kẽ hậu môn, nang lông vùng cụt bị viêm, hidradenitis suppurativa, u nang bã nhiễm trùng, viêm ruột Crohn có áp xe, áp xe vùng chậu sâu, bệnh lây truyền qua đường tình dục vùng hậu môn.","chan_doan_xac_dinh":"Áp xe quanh hậu môn dưới da bên trái, chưa biến chứng nhiễm khuẩn huyết; nghi có đường dò hậu môn kèm theo (xác định khi khám sau dẫn lưu).","dieu_tri":"Điều trị cơ bản là rạch dẫn lưu mủ sớm. Thực hiện dưới tê tại chỗ hoặc tê tủy/ gây mê nếu ổ lớn, đau nhiều: rạch đường thẳng hoặc hình chữ thập gần bờ hậu môn nhất có thể để giảm chiều dài đường dò, lấy sạch mủ, bơm rửa, không nhét gạc chặt. Có thể nhét sonde hoặc dẫn lưu nhỏ nếu ổ sâu. Kháng sinh không cần thường quy sau dẫn lưu đủ; chỉ dùng khi có viêm mô tế bào lan rộng, đái tháo đường, suy giảm miễn dịch, bệnh van tim, nhiễm khuẩn huyết (ví dụ amoxicillin-acid clavulanic hoặc ceftriaxone phối hợp metronidazol). Giảm đau paracetamol, NSAID; nhuận tràng mềm phân; ngâm ngồi nước ấm 2 đến 3 lần mỗi ngày; thay băng. Khám tìm đường dò sau 4 đến 6 tuần nếu còn chảy dịch; khi có dò đơn giản và thấp có thể rạch mở dò (fistulotomy), dò phức tạp cần siêu âm nội trực tràng hoặc MRI, dùng seton hoặc kỹ thuật bảo tồn cơ thắt. Theo dõi: hết đau, hết sốt, vết rạch liền từ đáy, không chảy dịch kéo dài.","tien_luong":"Tốt nếu dẫn lưu kịp thời; nguy cơ tái phát hoặc hình thành dò hậu môn khoảng 30 đến 50%; nguy cơ nhiễm khuẩn hoại thư Fournier ở người đái tháo đường hoặc chậm trễ.","du_phong":"Giữ vệ sinh vùng hậu môn, ngâm ngồi nước ấm sau đại tiện, tránh táo bón và rặn mạnh (ăn nhiều chất xơ, uống đủ nước), điều trị sớm áp xe, kiểm soát đường huyết, khám ngay khi đau nhức nhối cạnh hậu môn kèm sưng sốt; tái khám sau dẫn lưu để phát hiện dò."},"nguon":["Gaertner WB et al. The American Society of Colon and Rectal Surgeons Clinical Practice Guidelines for the Management of Anorectal Abscess, Fistula-in-Ano, and Rectovaginal Fistula. Dis Colon Rectum 2022.","Giáo trình Bệnh học Ngoại khoa, Đại học Y Hà Nội, bài Áp xe hậu môn và rò hậu môn.","Townsend CM et al. Sabiston Textbook of Surgery, 21st edition, 2022, chương Anus."],"status":"nhap"},{"id":"ngoai-chan-thuong-001","title":"Ngã xe máy, tỉnh rồi li bì, đồng tử phải giãn","kind":"Ngoại","level":"Khó","group":"ngoai","name":"Anh Q. M. T.","age":24,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Nam thanh niên được đưa vào phòng cấp cứu sau ngã xe máy không đội mũ bảo hiểm khoảng 3 giờ, ban đầu tỉnh táo nhưng nay li bì dần, nôn và đau đầu tăng.","vitals":{"hr":56,"sbp":164,"dbp":92,"rr":14,"t":36.8,"spo2":96},"ask":[["Tai nạn xảy ra thế nào, anh có bị đập đầu không?","Ngã xe máy cách đây khoảng 3 giờ, không đội mũ bảo hiểm, đập đầu bên phải xuống mặt đường.","e"],["Sau tai nạn có mất ý thức không, có tỉnh lại rồi mới li bì không?","Choáng vài phút rồi tỉnh, nói chuyện được khoảng một giờ; sau đó đau đầu tăng, nôn và li bì dần (người nhà kể).","e"],["Có nôn, co giật, chảy máu hoặc dịch qua tai, mũi không?","Nôn vọt hai lần; chảy ít máu từ tai phải; chưa co giật.","e"],["Có dùng rượu hoặc thuốc chống đông, chống kết tập tiểu cầu không?","Uống ít bia trước khi đi xe; không dùng thuốc chống đông.","e"],["Có đau cổ, đau ngực, đau bụng hoặc yếu tay chân không?","Đau cổ nhẹ; tay chân trái yếu hơn bên phải; ngực bụng không than đau.","e"],["Tiền sử bệnh, dị ứng, tiêm phòng uốn ván?","Khỏe mạnh, không dị ứng; chưa nhớ đã tiêm phòng uốn ván.","n"],["Bữa ăn gần nhất cách đây bao lâu?","Bữa trưa, cách đây khoảng 4 giờ.","n"]],"exam":[["K","Đánh giá ABCDE và điểm Glasgow","Đường thở thông nhưng nguy cơ tắc khi nôn; Glasgow 11 điểm (E3 V3 M5), giảm từ 14 điểm lúc ở hiện trường.","e"],["K","Đồng tử và dấu thần kinh khu trú","Đồng tử phải 5 mm, phản xạ ánh sáng chậm; trái 3 mm, phản xạ tốt. Yếu nửa người trái, sức cơ 3/5.","e"],["K","Da đầu và nền sọ","Tụ máu dưới da thái dương phải, vết rách da đầu 4 cm đã cầm máu; máu khô ở ống tai ngoài phải; chưa thấy mắt gấu.","e"],["K","Cột sống cổ","Đau nhẹ vùng cổ, chưa có dấu thần kinh tủy; đang cố định bằng nẹp cổ.","e"],["K","Ngực, bụng, khung chậu và các chi","Không thấy dấu tổn thương ngực bụng; khung chậu vững; chi không biến dạng.","n"]],"tests":[["Đường huyết mao mạch",10,"6,2 mmol/L.","e"],["CT sọ não không cản quang (có cửa sổ xương)",40,"Tụ máu ngoài màng cứng thái dương đỉnh phải hình thấu kính, dày tối đa 24 mm, thể tích ước tính khoảng 47 mL; đường giữa lệch sang trái 8 mm; nứt xương thái dương phải qua rãnh động mạch màng não giữa.","e"],["Công thức máu, nhóm máu, đông máu toàn bộ",10,"Hb 14,1 g/dL; tiểu cầu 238 G/L; INR 1,0; đã có nhóm máu và chuẩn bị máu.","e"],["CT cột sống cổ (cùng đợt chụp sọ não)",40,"Không thấy gãy hay trật.","n"],["Điện giải đồ, chức năng thận",10,"Na 138 mmol/L, K 3,9 mmol/L, creatinin bình thường.","n"],["MRI sọ não trước khi quyết định mổ",10,"Không cần thiết, làm chậm phẫu thuật cấp cứu khi CT đã chẩn đoán rõ.","w"]],"opt":{"ydx":["Tụ máu dưới màng cứng cấp do rách tĩnh mạch cầu nối","+Tụ máu ngoài màng cứng thái dương đỉnh phải do tổn thương động mạch màng não giữa, có dấu thoát vị thái dương","Chấn thương sọ não nhẹ, có thể theo dõi tại nhà","Xuất huyết dưới nhện tự phát do vỡ phình mạch"],"xu_tri_ban_dau":["Truyền tinh thể nhanh để hạ áp, không cần bảo vệ đường thở","Dùng an thần mạnh để người bệnh yên rồi mới chụp phim","+Cố định cổ, bảo đảm đường thở và oxy, nâng đầu 30 độ, tránh hạ huyết áp, đặt nội khí quản nếu Glasgow tụt xuống 8 hoặc thấp hơn","Hạ huyết áp tích cực xuống 110/70 mmHg để giảm chảy máu"],"chi_dinh_phau_thuat":["Theo dõi nội khoa và chụp lại CT sau 72 giờ","+Mở sọ lấy máu tụ cấp cứu và cầm máu động mạch màng não giữa","Chọc hút qua lỗ khoan nhỏ tại khoa cấp cứu","Chỉ truyền Manitol rồi chuyển khoa nội thần kinh"]},"actions":["++Đánh giá ABCDE, cố định cổ, thở oxy, nâng đầu 30 độ|2|Ưu tiên đường thở và oxy; thiếu oxy và hạ huyết áp gây tổn thương não thứ phát.","++Chụp CT sọ não khẩn ngay khi ổn định ban đầu và gọi phẫu thuật thần kinh|2|Tri giác giảm, đồng tử không đều gợi ý thoát vị; CT xác định chẩn đoán và chỉ định mổ.","++Đặt hai đường truyền, lấy máu, đặt thông tiểu, theo dõi tri giác và đồng tử mỗi 15 phút|2|Theo dõi sát giúp phát hiện sớm diễn tiến xấu và chuẩn bị mổ.","++Dùng dung dịch ưu trương (Manitol hoặc NaCl 3%) như cầu nối khi có dấu thoát vị|2|Giảm tạm thời áp lực nội sọ trong lúc chuẩn bị mổ, không thay thế phẫu thuật.","+Mở sọ lấy máu tụ ngoài màng cứng cấp cứu|3|Thể tích trên 30 mL là chỉ định mổ bất kể Glasgow; ở đây còn có đồng tử bất thường và lệch đường giữa.","+Sau mổ theo dõi hồi sức, CT kiểm tra, dự phòng co giật sớm, chăm sóc vết thương, phòng uốn ván|2|Đề phòng chảy máu tái phát, phù não và biến chứng thứ phát.","!Chọc dò dịch não tủy thắt lưng để khẳng định chẩn đoán|0|Khi áp lực nội sọ tăng có thể gây tụt kẹt hạnh nhân tiểu não.","!Cho nằm quan sát vài giờ ở khoa thường rồi chụp lại CT|0|Đã có dấu thoát vị; chậm trễ làm tăng tử vong và di chứng."],"teach":"Khoảng tỉnh rồi li bì, đồng tử giãn cùng bên tụ máu, mạch chậm huyết áp cao và nứt xương thái dương là bộ khung của tụ máu ngoài màng cứng. Đây là cấp cứu ngoại thần kinh: bảo vệ đường thở, CT khẩn và mổ sớm quyết định tiên lượng.","hbu":{"hanh_chinh":"Anh Q. M. T., nam, 24 tuổi, công nhân; nhập khoa Cấp cứu sau tai nạn giao thông khoảng 3 giờ.","ly_do_vao_vien":"Chấn thương đầu sau ngã xe máy, đau đầu tăng, nôn và li bì.","benh_su":"Ngã xe máy không đội mũ bảo hiểm, đập đầu bên phải xuống đường. Mất ý thức vài phút, sau đó tỉnh táo khoảng một giờ rồi đau đầu tăng dần, nôn vọt hai lần, li bì, yếu nửa người trái. Chảy ít máu từ tai phải. Không co giật.","tien_su":"Khỏe mạnh, chưa phẫu thuật, không dị ứng, không dùng thuốc chống đông. Chưa rõ tiêm phòng uốn ván.","luoc_qua_co_quan":"Không khó thở, không đau ngực bụng; đau cổ nhẹ; yếu tay chân trái mới xuất hiện.","kham_hien_tai":"Mạch 56 lần/phút, huyết áp 164/92 mmHg, nhịp thở 14 lần/phút, nhiệt độ 36,8 độ C, SpO2 96%. Glasgow 11 điểm (E3 V3 M5). Đồng tử phải 5 mm, phản xạ chậm; trái 3 mm. Yếu nửa người trái 3/5. Tụ máu thái dương phải, máu khô ống tai phải.","can_lam_sang":"CT sọ não: tụ máu ngoài màng cứng thái dương đỉnh phải hình thấu kính, dày 24 mm, khoảng 47 mL, lệch đường giữa 8 mm, nứt xương thái dương phải. CT cột sống cổ bình thường. Hb 14,1 g/dL; INR 1,0.","tom_tat":"Nam 24 tuổi chấn thương đầu kín sau ngã xe máy, có khoảng tỉnh, sau đó giảm tri giác (Glasgow 14 xuống 11), giãn đồng tử phải, yếu nửa người trái, mạch chậm huyết áp cao; CT có tụ máu ngoài màng cứng thái dương phải thể tích lớn, lệch đường giữa.","dat_van_de":"Chấn thương sọ não kèm tụ máu ngoài màng cứng và hội chứng tăng áp lực nội sọ cấp; nguy cơ thoát vị thái dương; cần bảo vệ đường thở và mổ cấp cứu; loại trừ tổn thương cột sống cổ.","chan_doan_so_bo":"Chấn thương sọ não kín, nghi tụ máu ngoài màng cứng thái dương phải.","bien_luan":"Cơ chế lực đập trực tiếp vào vùng thái dương, khoảng tỉnh rồi suy giảm tri giác nhanh là nét điển hình của chảy máu động mạch. Giãn đồng tử cùng bên và dấu liệt đối bên chứng tỏ khối choán chỗ đè thùy thái dương. Mạch chậm, huyết áp tăng gợi phản xạ Cushing, báo hiệu nguy cơ tụt kẹt. CT cho thấy hình thấu kính hai mặt lồi, nứt xương qua rãnh động mạch màng não giữa, xác định chẩn đoán.","sinh_ly_benh":"Gãy xương thái dương làm rách động mạch màng não giữa; máu dưới áp lực động mạch bóc màng cứng khỏi xương, tạo khối máu tụ lồi, giới hạn bởi các đường khớp sọ. Khối máu tụ tăng thể tích làm tăng áp lực nội sọ, đẩy thùy thái dương vào khe lều, chèn dây thần kinh sọ III và thân não. Thiếu máu não thứ phát làm nặng thêm tổn thương.","chan_doan_phan_biet":"Tụ máu dưới màng cứng cấp (hình liềm, thường kèm tổn thương não nặng); chảy máu trong não do dập não; xuất huyết dưới nhện; tụ máu dưới màng cứng mạn không phù hợp thời gian.","chan_doan_xac_dinh":"Tụ máu ngoài màng cứng thái dương đỉnh phải khoảng 47 mL, lệch đường giữa 8 mm, kèm nứt xương thái dương phải; chấn thương sọ não Glasgow 11 điểm đang diễn tiến nặng, thoát vị thái dương.","dieu_tri":"Sơ cứu theo ABCDE: cố định cổ, bảo đảm đường thở, oxy, giữ huyết áp tâm thu không dưới 110 mmHg, nâng đầu 30 độ, dung dịch ưu trương khi có dấu thoát vị. Mở sọ lấy máu tụ cấp cứu, cầm máu động mạch màng não giữa, treo màng cứng. Hậu phẫu: hồi sức, CT kiểm tra, dự phòng co giật sớm, phòng uốn ván, phục hồi chức năng.","tien_luong":"Tốt nếu mổ sớm, trước khi có tổn thương thân não không hồi phục; nặng nếu chậm trễ hoặc có tổn thương não phối hợp.","du_phong":"Đội mũ bảo hiểm đạt chuẩn, không lái xe sau uống rượu bia; hướng dẫn người nhà nhận biết khoảng tỉnh sau chấn thương đầu và đưa người bệnh đi khám sớm."},"nguon":["ATLS 10th edition, American College of Surgeons, 2018: chương Chấn thương đầu.","Brain Trauma Foundation: Guidelines for the Management of Severe Traumatic Brain Injury, 4th edition, 2016; Surgical Management of Acute Epidural Hematomas, 2006.","Giáo trình Ngoại bệnh lý (Đại học Y Hà Nội và Đại học Y Dược TP.HCM): bài Chấn thương sọ não."],"status":"nhap"},{"id":"ngoai-chan-thuong-002","title":"Cụ bà trượt ngã, đau háng phải, chân ngắn xoay ngoài","kind":"Ngoại","level":"Trung bình","group":"ngoai","name":"Bà N. T. L.","age":79,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Cụ bà được con cháu đưa vào khoa Chấn thương chỉnh hình sau trượt ngã trong nhà tắm 6 giờ, đau háng phải, không đứng dậy được.","vitals":{"hr":92,"sbp":150,"dbp":84,"rr":20,"t":36.9,"spo2":96},"ask":[["Bà ngã như thế nào, có ngất trước khi ngã không?","Trượt chân trong nhà tắm, ngã nghiêng sang phải; không choáng váng, không mất ý thức.","e"],["Đau ở đâu, có đứng dậy hoặc bước đi được không?","Đau sâu vùng bẹn và háng phải, tăng khi cử động, không đứng dậy được.","e"],["Trước khi ngã bà đi lại ra sao?","Tự đi lại trong nhà, ra ngoài cần người đỡ; không dùng dụng cụ; sinh hoạt cơ bản tự làm.","e"],["Có đập đầu, đau cổ, đau lưng hoặc đau ở nơi khác không?","Không đập đầu; hơi đau cổ tay phải nhưng nhẹ.","e"],["Bệnh nền và thuốc đang dùng?","Tăng huyết áp 15 năm (amlodipin), đái tháo đường típ 2 (metformin); biết loãng xương nhưng chưa điều trị.","e"],["Có dùng thuốc chống đông hoặc dị ứng thuốc không?","Không dùng chống đông; không dị ứng.","e"],["Trí nhớ và ăn uống gần đây thế nào?","Tỉnh táo, nhớ tốt; ăn sáng cách đây 8 giờ.","n"]],"exam":[["K","Quan sát và đo chiều dài chi","Chân phải ngắn khoảng 2 cm, xoay ngoài, bàn chân đổ ra ngoài; vùng bẹn sưng nhẹ, bầm ít.","e"],["K","Sờ và nghiệm pháp vận động háng","Ấn đau nếp bẹn phải; đau tăng khi xoay hoặc gõ dọc trục gót; không nhấc được gót khỏi giường.","e"],["K","Tuần hoàn và thần kinh chi dưới phải","Mạch mu chân rõ, đầu chi ấm, cảm giác và vận động ngón chân bình thường.","e"],["K","Khám toàn thân và tìm tổn thương phối hợp","Tim đều, phổi không ran; cột sống cổ, lưng không đau chói; cổ tay phải đau nhẹ, không biến dạng.","e"],["K","Da vùng cùng cụt và gót","Da nguyên vẹn.","n"]],"tests":[["X-quang khung chậu thẳng và háng phải thẳng, nghiêng",10,"Gãy cổ xương đùi phải dưới chỏm, di lệch nhiều (Garden IV), mất đường Shenton, xương thưa rõ.","e"],["Điện tâm đồ",10,"Nhịp xoang 90 lần/phút, không dấu thiếu máu cục bộ cũ hay mới.","e"],["Công thức máu, nhóm máu, đông máu",10,"Hb 11,6 g/dL; tiểu cầu 220 G/L; INR 1,0; có nhóm máu.","e"],["Ure, creatinin, điện giải đồ, đường huyết",10,"Creatinin 92 µmol/L; Na 137, K 4,2 mmol/L; đường huyết 9,1 mmol/L.","e"],["X-quang ngực thẳng",10,"Tim phổi bình thường.","n"],["Đo mật độ xương DEXA trước mổ để quyết định thời điểm phẫu thuật",10,"Không cần làm trước mổ, làm chậm điều trị; việc đánh giá loãng xương thực hiện sau.","w"]],"opt":{"ydx":["Gãy mấu chuyển lớn xương đùi phải ổn định","Trật khớp háng phải ra sau","+Gãy cổ xương đùi phải di lệch (Garden IV) trên nền loãng xương","Viêm khớp háng nhiễm khuẩn cấp"],"huong_dieu_tri":["Nắn kín và bó bột chậu đùi cẳng chân 8 tuần","Kéo liên tục bằng trọng lực 6 tuần rồi tập đi","+Thay khớp háng bán phần trong 24 đến 48 giờ sau khi tối ưu hóa bệnh nội khoa","Kết hợp xương bằng vít xốp, không chịu lực 3 tháng"],"giam_dau_ban_dau":["Diclofenac liều cao tiêm bắp lặp lại","Morphin liều cao tiêm tĩnh mạch nhanh, không theo dõi","Không dùng thuốc để khỏi che lấp triệu chứng","+Paracetamol phối hợp phong bế thần kinh vùng, opioid liều thấp khi cần"]},"actions":["++Đánh giá nguyên nhân ngã (ngất, loạn nhịp, hạ đường huyết) và tìm tổn thương phối hợp|2|Ngã ở người già có thể do bệnh nội khoa; bỏ sót làm tăng nguy cơ biến chứng và tử vong.","++Giảm đau sớm bằng paracetamol, phong bế thần kinh vùng và bất động chi, tránh NSAID|2|Chức năng thận giảm theo tuổi, lại có tăng huyết áp; giảm đau tốt giúp hạn chế sảng và suy hô hấp.","+Chụp X-quang khung chậu, háng phải, làm điện tâm đồ và xét nghiệm tiền phẫu|2|Xác định loại gãy, phân độ Garden và đánh giá nguy cơ gây mê.","+Hội chẩn gây mê và nội khoa, tối ưu huyết áp, đường huyết, dịch|3|Giữ thời gian chờ mổ ngắn, không trì hoãn chỉ để hoàn hảo hóa số liệu.","+Thay khớp háng bán phần, kháng sinh dự phòng trước rạch da, phòng huyết khối bằng heparin trọng lượng phân tử thấp|3|Gãy di lệch ở người trên 75 tuổi, đi lại hạn chế: thay khớp cho phép chịu lực sớm, ít mổ lại hơn kết hợp xương.","+Cho ngồi dậy, tập đi ngay ngày đầu sau mổ, phục hồi chức năng, điều trị loãng xương và phòng ngã|2|Vận động sớm giảm viêm phổi, loét tỳ đè, huyết khối.","!Cho nằm bất động nhiều tuần tại giường để chờ giảm đau rồi mới tính mổ|0|Bất động kéo dài gây viêm phổi, loét tỳ đè, huyết khối, suy kiệt.","!Cho về nhà dùng thuốc giảm đau, hẹn tái khám sau một tháng|0|Gãy cổ xương đùi di lệch không tự liền, biến chứng nặng và tử vong cao nếu không mổ."],"teach":"Gãy cổ xương đùi di lệch ở người trên 75 tuổi là cấp cứu chương trình: giảm đau tốt, tối ưu nội khoa nhanh và mổ trong 24 đến 48 giờ. Thay khớp bán phần thường là lựa chọn phù hợp khi người bệnh đi lại hạn chế; vận động sớm và điều trị loãng xương quyết định tiên lượng.","hbu":{"hanh_chinh":"Bà N. T. L., nữ, 79 tuổi, nghỉ hưu, sống cùng con; nhập khoa Chấn thương chỉnh hình.","ly_do_vao_vien":"Đau háng phải và không đi được sau ngã.","benh_su":"Cách 6 giờ, bà trượt chân trong nhà tắm, ngã nghiêng phải, không mất ý thức, không đập đầu. Sau ngã đau sâu vùng bẹn háng phải, không đứng dậy được, chân phải xoay ngoài. Được đưa tới cấp cứu.","tien_su":"Tăng huyết áp 15 năm, đái tháo đường típ 2, loãng xương chưa điều trị. Không dùng chống đông, không dị ứng. Trước ngã tự đi lại trong nhà, ra ngoài cần người đỡ.","luoc_qua_co_quan":"Không đau ngực, không khó thở, không tiểu khó; ăn uống bình thường; đau nhẹ cổ tay phải.","kham_hien_tai":"Mạch 92, huyết áp 150/84 mmHg, nhịp thở 20, SpO2 96%, nhiệt độ 36,9 độ C. Chân phải ngắn 2 cm, xoay ngoài, ấn đau nếp bẹn, không nhấc gót. Mạch mu chân rõ, cảm giác bình thường.","can_lam_sang":"X-quang: gãy cổ xương đùi phải dưới chỏm, Garden IV, loãng xương rõ. Điện tâm đồ nhịp xoang. Hb 11,6 g/dL, creatinin 92 µmol/L, đường huyết 9,1 mmol/L, INR 1,0.","tom_tat":"Bà 79 tuổi, tăng huyết áp, đái tháo đường, loãng xương, sau ngã thấp có đau háng phải, chân ngắn và xoay ngoài; X-quang gãy cổ xương đùi phải di lệch Garden IV; chưa có tổn thương thần kinh mạch máu, các xét nghiệm tiền phẫu chấp nhận được.","dat_van_de":"Gãy cổ xương đùi di lệch ở người cao tuổi; bệnh nội khoa đồng mắc cần tối ưu; nguy cơ biến chứng do bất động; loãng xương cần điều trị lâu dài.","chan_doan_so_bo":"Gãy cổ xương đùi phải sau chấn thương năng lượng thấp.","bien_luan":"Cơ chế ngã thấp ở người loãng xương, biến dạng điển hình chân ngắn và xoay ngoài, đau nếp bẹn và mất nhấc gót hướng tới gãy đầu trên xương đùi. Hình ảnh X-quang cho thấy gãy trong bao khớp, dưới chỏm, di lệch hoàn toàn (Garden IV). Ở tuổi này, nguy cơ không liền và hoại tử chỏm cao nên chọn thay khớp thay vì giữ chỏm. Đi lại hạn chế ngoài nhà và bệnh nền ủng hộ thay bán phần.","sinh_ly_benh":"Chỏm và cổ xương đùi được nuôi chủ yếu bởi các nhánh động mạch mũ đùi trong chạy dọc cổ xương; gãy di lệch làm rách mạch nuôi, gây thiếu máu chỏm. Cộng thêm loãng xương làm giảm sức chịu lực, khả năng liền xương kém. Đau và bất động gây tăng đông, giảm thông khí, nguy cơ viêm phổi, huyết khối.","chan_doan_phan_biet":"Gãy mấu chuyển lớn, gãy liên mấu chuyển (thường chân ngắn xoay ngoài kèm bầm máu nhiều); trật khớp háng; gãy ngành mu ngồi; viêm khớp háng, di căn xương bệnh lý.","chan_doan_xac_dinh":"Gãy cổ xương đùi phải dưới chỏm, di lệch (Garden IV), loãng xương; tăng huyết áp; đái tháo đường típ 2.","dieu_tri":"Giảm đau đa mô thức (paracetamol, phong bế thần kinh vùng), tránh NSAID. Tối ưu nội khoa, hội chẩn gây mê, mổ trong 24 đến 48 giờ: thay khớp háng bán phần. Kháng sinh dự phòng, phòng huyết khối bằng heparin trọng lượng phân tử thấp, chăm sóc da. Ngồi dậy và tập đi ngày thứ nhất, phục hồi chức năng, điều trị loãng xương, phòng ngã.","tien_luong":"Khá nếu mổ sớm và vận động sớm; tử vong trong năm đầu và mất khả năng đi lại độc lập vẫn còn đáng kể ở nhóm tuổi này.","du_phong":"Điều trị loãng xương (calci, vitamin D, thuốc chống hủy xương), cải tạo nhà cửa phòng ngã (sàn chống trượt, tay vịn), rà soát thuốc gây chóng mặt, tập thăng bằng, đánh giá thị lực."},"nguon":["Bộ Y tế: Hướng dẫn chẩn đoán và điều trị loãng xương (cập nhật).","Giáo trình Chấn thương chỉnh hình, Đại học Y Hà Nội: bài Gãy cổ xương đùi.","NICE guideline NG124, Hip fracture: management, 2023.","AAOS Management of Hip Fractures in Older Adults, 2021."],"status":"nhap"},{"id":"ngoai-chan-thuong-003","title":"Ngã xe, cẳng tay trái biến dạng, sưng đau","kind":"Ngoại","level":"Dễ","group":"ngoai","name":"Anh H. V. D.","age":28,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Nam thanh niên đến khoa Chấn thương chỉnh hình sau ngã xe máy 2 giờ, tay trái chống xuống đất, cẳng tay biến dạng, sưng đau nhiều.","vitals":{"hr":94,"sbp":124,"dbp":78,"rr":18,"t":37,"spo2":99},"ask":[["Tai nạn xảy ra thế nào, tay nào chống xuống đất?","Ngã xe máy cách 2 giờ, chống tay trái xuống mặt đường rồi ngã nghiêng.","e"],["Đau ở đâu, có cử động được cổ tay, ngón tay không?","Đau dữ dội giữa cẳng tay trái, cử động ngón tay được nhưng đau tăng.","e"],["Có tê bì hoặc lạnh ngón tay không?","Hơi tê đầu ngón nhưng cảm giác còn; ngón tay không lạnh.","e"],["Có vết thương hở hoặc chảy máu tại chỗ đau không?","Da nguyên vẹn, chỉ có trầy xước ngoài da khuỷu tay.","e"],["Có chấn thương đầu, ngực, bụng hoặc nơi khác không?","Không đập đầu, không đau nơi nào khác ngoài cẳng tay.","e"],["Tiền sử bệnh, dị ứng, thuốc đang dùng?","Khỏe mạnh, không dị ứng, không dùng thuốc.","n"],["Lần ăn uống gần nhất?","Ăn trưa cách đây 3 giờ.","n"]],"exam":[["K","Quan sát cẳng tay trái","Sưng nề, biến dạng gập góc ở 1/3 giữa, da nguyên vẹn, bầm tím nhẹ.","e"],["K","Sờ nắn và ép dọc trục","Điểm đau chói 1/3 giữa cẳng tay, có tiếng lạo xạo xương; không có vết thương thông với ổ gãy.","e"],["K","Mạch, đầu chi, thần kinh","Mạch quay rõ, thời gian đầy mao mạch 2 giây, cảm giác ngón 1 đến 3 bình thường, gập ngón cái được.","e"],["K","Khoang cẳng tay (dấu hiệu chèn ép khoang)","Khoang gấp căng nhưng còn mềm; duỗi thụ động ngón tay chỉ đau ở ổ gãy, không đau tăng đặc biệt.","e"],["K","Khuỷu và cổ tay hai bên","Không đau, cử động đủ biên độ, không biến dạng.","n"]],"tests":[["X-quang cẳng tay trái thẳng và nghiêng, bao gồm khuỷu và cổ tay",10,"Gãy 1/3 giữa xương quay và 1/3 giữa xương trụ, gập góc 25 độ, chồng ngắn 10 mm; khớp quay trụ gần và xa không trật.","e"],["Công thức máu, nhóm máu",10,"Hb 14,8 g/dL; tiểu cầu 260 G/L.","e"],["Điện giải đồ, chức năng thận, đường huyết",10,"Trong giới hạn bình thường.","n"],["Điện tâm đồ tiền phẫu",10,"Nhịp xoang 90 lần/phút.","n"],["X-quang ngực thẳng",10,"Không tổn thương.","n"],["Chụp mạch máu cản quang thường quy khi mạch quay bắt rõ",10,"Không có chỉ định; làm chậm điều trị và có nguy cơ.","w"]],"opt":{"ydx":["Gãy kín đầu dưới xương quay kiểu Colles","Gãy Monteggia (gãy xương trụ kèm trật chỏm quay)","Bong gân độ III cổ tay trái","+Gãy kín hai xương cẳng tay trái 1/3 giữa, di lệch, chưa có biến chứng mạch, thần kinh hay chèn ép khoang"],"huong_xu_tri":["Nắn kín bó bột tròn cánh cẳng bàn tay không rạch bột 8 tuần","Treo tay bằng khăn tam giác 6 tuần, không bất động","+Nẹp tạm, theo dõi chèn ép khoang, mổ kết hợp xương nẹp vít cả hai xương","Chỉ đóng đinh Kirschner qua da rồi bó bột"],"bien_chung_can_theo_doi":["Viêm phổi ứ đọng","+Hội chứng chèn ép khoang cẳng tay (đau không tương xứng, căng tức, đau tăng khi duỗi thụ động ngón tay)","Loét tỳ đè vùng cùng cụt","Tắc mạch phổi trong 6 giờ đầu"]},"actions":["++Nẹp bất động tạm từ cánh tay đến bàn tay, nâng cao chi, giảm đau|2|Giảm đau, hạn chế di lệch thêm và phù nề trước khi mổ.","++Đánh giá và ghi nhận mạch, cảm giác, vận động, đau khi duỗi thụ động ngón tay mỗi 1 đến 2 giờ|2|Chèn ép khoang là biến chứng hay bị bỏ sót; phát hiện sớm tránh hoại tử cơ.","+Chụp X-quang cẳng tay hai tư thế bao gồm khuỷu và cổ tay|2|Loại trừ tổn thương Monteggia, Galeazzi.","+Nhịn ăn, hội chẩn gây mê, chuẩn bị mổ sớm|2|Gãy hai xương ở người lớn là gãy không vững, thường cần mổ.","+Mổ kết hợp xương bằng nẹp vít xương quay và xương trụ, kháng sinh dự phòng|3|Phục hồi chiều dài, độ cong và xoay cẳng tay, cho phép tập sớm.","+Sau mổ: nâng cao chi, tập ngón tay ngay, tập khuỷu và xoay sớm, tái khám X-quang theo lịch|2|Phòng cứng khớp, hạn chế xoay cẳng tay.","!Nắn mạnh nhiều lần không gây mê rồi bó bột tròn kín ngay|0|Gây đau, tăng phù nề, nguy cơ chèn ép khoang; gãy hai xương hiếm giữ được đường nắn kín.","!Cho về nhà, dùng giảm đau, hẹn tái khám sau 1 tuần mà không bất động|0|Di lệch tăng, tổn thương mô mềm và mạch thần kinh."],"teach":"Gãy hai xương cẳng tay ở người lớn là gãy không vững, điều trị chuẩn là mổ kết hợp xương nẹp vít. Luôn kiểm tra khuỷu và cổ tay để không bỏ sót Monteggia, Galeazzi, và theo dõi sát dấu hiệu chèn ép khoang.","hbu":{"hanh_chinh":"Anh H. V. D., nam, 28 tuổi, nhân viên giao hàng; nhập khoa Chấn thương chỉnh hình.","ly_do_vao_vien":"Đau và biến dạng cẳng tay trái sau ngã xe máy.","benh_su":"Cách 2 giờ, ngã xe máy, chống tay trái xuống đường. Đau dữ dội giữa cẳng tay, thấy biến dạng, sưng nhanh, không cử động cẳng tay được. Không có vết thương hở, không đập đầu. Được sơ cứu tại chỗ và chuyển viện.","tien_su":"Khỏe mạnh, chưa phẫu thuật, không dị ứng, không dùng thuốc. Chưa rõ tiêm phòng uốn ván.","luoc_qua_co_quan":"Không chóng mặt, không đau ngực bụng; tê nhẹ đầu ngón tay trái.","kham_hien_tai":"Mạch 94, huyết áp 124/78 mmHg, nhịp thở 18, nhiệt độ 37,0 độ C, SpO2 99%. Cẳng tay trái biến dạng gập góc 1/3 giữa, sưng, đau chói, lạo xạo xương. Mạch quay rõ, cảm giác và vận động ngón còn. Khoang cẳng tay căng nhưng mềm.","can_lam_sang":"X-quang: gãy 1/3 giữa xương quay và xương trụ, gập góc 25 độ, chồng ngắn 10 mm; khớp quay trụ gần và xa không trật. Hb 14,8 g/dL.","tom_tat":"Nam 28 tuổi chấn thương cẳng tay trái do ngã chống tay, có biến dạng, đau, lạo xạo xương; X-quang gãy kín hai xương cẳng tay 1/3 giữa, di lệch; tuần hoàn thần kinh còn; chưa có dấu hiệu chèn ép khoang.","dat_van_de":"Gãy hai xương cẳng tay không vững; nguy cơ chèn ép khoang và tổn thương thần kinh; cần quyết định phương pháp cố định và thời điểm mổ.","chan_doan_so_bo":"Gãy kín hai xương cẳng tay trái.","bien_luan":"Cơ chế ngã chống tay, biến dạng gập góc, đau chói và lạo xạo xương chẩn đoán gãy xương; X-quang xác định gãy cả xương quay và trụ cùng mức, di lệch gập góc và chồng ngắn. Không có trật khớp quay trụ gần hoặc xa nên không phải Monteggia hay Galeazzi. Hai xương cùng gãy làm mất sự ổn định nên khó giữ nắn kín, cần kết hợp xương vững chắc.","sinh_ly_benh":"Cẳng tay là hệ thống hai xương nối với nhau bằng màng liên cốt và hai khớp quay trụ; gãy cả hai xương làm mất nâng đỡ, các cơ làm di lệch thêm và hạn chế xoay. Chảy máu và phù nề trong các khoang cân kín làm tăng áp lực khoang, giảm tưới máu cơ và thần kinh nếu không được theo dõi.","chan_doan_phan_biet":"Gãy Monteggia, gãy Galeazzi, gãy một xương cẳng tay, gãy bệnh lý, chấn thương mạch máu kèm theo.","chan_doan_xac_dinh":"Gãy kín hai xương cẳng tay trái 1/3 giữa, di lệch, không có biến chứng mạch, thần kinh hoặc chèn ép khoang tại thời điểm khám.","dieu_tri":"Nẹp tạm, giảm đau, nâng cao chi và theo dõi chèn ép khoang. Mổ kết hợp xương nẹp vít cả hai xương trong thời gian sớm sau khi người bệnh ổn định, kháng sinh dự phòng. Hậu phẫu: nâng cao chi, tập ngón tay ngay, tập khuỷu và xoay sớm, X-quang theo dõi, tháo chỉ khoảng 2 tuần.","tien_luong":"Tốt nếu cố định vững chắc và phục hồi sớm; biến chứng gồm không liền, can lệch, cứng khớp, nhiễm trùng, chèn ép khoang.","du_phong":"Đội mũ bảo hiểm, tuân thủ giao thông; hướng dẫn người bệnh nhận biết sớm đau tăng, tê, tím ngón tay để quay lại; tái khám đúng hẹn, tập phục hồi chức năng theo hướng dẫn."},"nguon":["Giáo trình Chấn thương chỉnh hình, Đại học Y Hà Nội: bài Gãy hai xương cẳng tay.","Rockwood and Green's Fractures in Adults, 9th edition, 2019: chương Fractures of the shafts of the radius and ulna.","ATLS 10th edition, American College of Surgeons, 2018: phần Chấn thương cơ xương khớp."],"status":"nhap"},{"id":"ngoai-chan-thuong-004","title":"Ngã giàn giáo, đau ngực trái, khó thở, vã mồ hôi","kind":"Ngoại","level":"Khó","group":"ngoai","name":"Anh P. Q. K.","age":34,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Nam công nhân xây dựng được đưa vào phòng cấp cứu 40 phút sau khi ngã giàn giáo cao khoảng 4 m, đập ngực trái xuống nền, khó thở và da lạnh.","vitals":{"hr":118,"sbp":92,"dbp":58,"rr":30,"t":36.5,"spo2":90},"ask":[["Cơ chế chấn thương là gì, ngã từ độ cao bao nhiêu?","Ngã giàn giáo khoảng 4 m, đập ngực trái vào cạnh sắt rồi xuống nền.","e"],["Đau và khó thở ra sao?","Đau ngực trái nhiều, thở nông, không nằm ngửa được, nói từng câu ngắn.","e"],["Có ho ra máu, đau bụng, đau vai trái hoặc đau chỗ khác không?","Ho ít đờm lẫn máu; đau nhẹ bụng trên trái; chưa than đau cổ.","e"],["Có mất ý thức sau ngã không?","Không mất ý thức, tỉnh táo.","e"],["Có bệnh phổi, tim hoặc dùng thuốc chống đông không?","Hút thuốc lá 10 năm; không bệnh tim, không dùng chống đông.","e"],["Dị ứng thuốc, tiêm phòng uốn ván?","Không dị ứng; chưa nhớ tiêm phòng uốn ván.","n"],["Lần ăn gần nhất?","Ăn trưa cách đây 3 giờ.","n"]],"exam":[["K","Đường thở, hô hấp và quan sát lồng ngực","Nói được từng câu ngắn, thở nhanh nông, bầm tím và lõm vùng ngực trái, không có vết thương hở, khí quản ở giữa.","e"],["K","Gõ và nghe phổi","Gõ đục nửa dưới phổi trái, rì rào phế nang giảm hẳn bên trái; phổi phải bình thường.","e"],["K","Tuần hoàn","Mạch nhanh nhẹ, chi lạnh, da tái vã mồ hôi, thời gian đầy mao mạch 4 giây; tĩnh mạch cổ xẹp.","e"],["K","Khám bụng","Bụng mềm, ấn đau nhẹ hạ sườn trái, chưa phản ứng thành bụng.","e"],["K","Khám cổ và khung chậu","Cột sống cổ không điểm đau; khung chậu vững.","n"]],"tests":[["Siêu âm eFAST tại giường",15,"Có dịch khoang màng phổi trái; ổ bụng và màng ngoài tim không thấy dịch tự do.","e"],["X-quang ngực thẳng tại giường",10,"Mờ nửa dưới phổi trái, mất góc sườn hoành, gãy cung sau xương sườn 6 đến 8 trái, không tràn khí rõ.","e"],["Công thức máu, nhóm máu, đông máu, khí máu",10,"Hb 8,9 g/dL; lactate 4,2 mmol/L; pH 7,30; tiểu cầu 190 G/L; INR 1,1; đã chuẩn bị máu.","e"],["Dẫn lưu màng phổi liên sườn 5 đường nách giữa: lượng dịch dẫn lưu",10,"Ra ngay 1.600 mL máu đỏ tươi trong 15 phút đầu, vẫn chảy liên tục.","e"],["Điện tâm đồ",10,"Nhịp nhanh xoang 118 lần/phút, không dấu thiếu máu cục bộ.","n"],["CT ngực có cản quang trước khi dẫn lưu khi huyết áp 92/58 mmHg",40,"Không an toàn; chậm hồi sức và dẫn lưu cấp cứu.","w"]],"opt":{"ydx":["Tràn khí màng phổi áp lực trái","+Tràn máu màng phổi trái lượng nhiều do chấn thương ngực kín, gãy xương sườn 6 đến 8, sốc mất máu độ III","Chèn ép tim cấp do máu màng ngoài tim","Vỡ cơ hoành trái đơn thuần"],"xu_tri_bat_buoc":["Chọc hút bằng kim nhỏ và theo dõi","Chụp CT ngực, nếu cần mới đặt dẫn lưu","Chỉ thở oxy, giảm đau và theo dõi 24 giờ","+Đặt dẫn lưu màng phổi cỡ lớn khoang liên sườn 5 đường nách giữa, hồi sức bằng máu"],"chi_dinh_mo_nguc_cap_cuu":["Ra 300 mL máu trong 24 giờ, huyết động ổn","Chỉ cần thấy gãy từ 3 xương sườn trên X-quang","+Ra ngay từ 1.500 mL máu qua dẫn lưu hoặc từ 200 mL mỗi giờ liên tục 2 đến 4 giờ, huyết động xấu","Hb thấp hơn 12 g/dL"]},"actions":["++Thở oxy lưu lượng cao, đặt hai đường truyền lớn, lấy máu xét nghiệm và nhóm máu|2|Ưu tiên oxy hóa và tuần hoàn; SpO2 90% và sốc mất máu đồng thời.","++Đặt dẫn lưu màng phổi trái cỡ lớn ngay, không chờ thêm xét nghiệm|2|Dẫn lưu vừa điều trị vừa định lượng chảy máu; tràn máu lượng nhiều gây suy hô hấp và sốc.","++Truyền máu sớm (nhóm O hoặc cùng nhóm), hạn chế tinh thể, giữ ấm|2|Mất máu là chính; truyền ồ ạt tinh thể gây loãng máu, rối loạn đông máu.","++Làm eFAST và X-quang ngực tại giường trong lúc hồi sức|2|Phát hiện dịch màng phổi, tràn khí, loại trừ chảy máu bụng hoặc tim.","+Hội chẩn ngoại lồng ngực và chuyển mổ mở ngực cấp cứu khi dẫn lưu ra từ 1.500 mL ngay|3|Chảy máu liên tục sau dẫn lưu là chỉ định mổ cầm máu, không chờ.","+Sau mổ: giảm đau đa mô thức, vật lý trị liệu hô hấp, rút dẫn lưu khi dịch dưới 200 mL mỗi 24 giờ, phòng uốn ván|2|Gãy nhiều xương sườn gây đau hạn chế thông khí; giảm đau tốt phòng viêm phổi và xẹp phổi.","!Chuyển đi chụp CT ngực khi huyết áp còn 92/58 mmHg và đang sốc|0|Đưa người bệnh sốc ra khỏi khu hồi sức làm tăng nguy cơ ngừng tim.","!Truyền 3 đến 4 lít tinh thể nhanh để đưa huyết áp về bình thường|0|Gây loãng máu, hạ thân nhiệt, rối loạn đông máu và tăng chảy máu."],"teach":"Ở người bệnh chấn thương ngực có sốc, giảm thông khí một bên, gõ đục và rì rào phế nang giảm cần nghĩ tới tràn máu màng phổi lớn: đặt dẫn lưu ngay, hồi sức bằng máu. Dẫn lưu ra từ 1.500 mL ngay hoặc chảy liên tục từ 200 mL mỗi giờ là chỉ định mở ngực cầm máu.","hbu":{"hanh_chinh":"Anh P. Q. K., nam, 34 tuổi, công nhân xây dựng; nhập khoa Cấp cứu, sau đó chuyển phòng mổ.","ly_do_vao_vien":"Đau ngực trái và khó thở sau ngã từ độ cao.","benh_su":"Cách 40 phút, anh ngã từ giàn giáo cao khoảng 4 m, ngực trái đập vào cạnh sắt rồi xuống nền. Đau ngực trái dữ dội, khó thở tăng, vã mồ hôi, ho ít đờm lẫn máu, không mất ý thức. Được đưa vào cấp cứu.","tien_su":"Hút thuốc lá 10 năm; không bệnh tim phổi, không dị ứng, không dùng chống đông. Chưa rõ tiêm phòng uốn ván.","luoc_qua_co_quan":"Đau nhẹ hạ sườn trái, chưa nôn, chưa tiểu máu; không đau cổ.","kham_hien_tai":"Mạch 118, huyết áp 92/58 mmHg, nhịp thở 30, SpO2 90% khí phòng, nhiệt độ 36,5 độ C. Tái, vã mồ hôi, chi lạnh, thời gian đầy mao mạch 4 giây. Ngực trái bầm tím, gõ đục nửa dưới, rì rào phế nang giảm. Khí quản ở giữa, tĩnh mạch cổ xẹp.","can_lam_sang":"eFAST: dịch màng phổi trái, ổ bụng và màng ngoài tim không dịch. X-quang ngực: mờ nửa dưới phổi trái, gãy xương sườn 6 đến 8 trái. Hb 8,9 g/dL, lactate 4,2 mmol/L. Dẫn lưu ra 1.600 mL máu đỏ tươi trong 15 phút đầu.","tom_tat":"Nam 34 tuổi ngã cao, chấn thương ngực kín trái, suy hô hấp và sốc mất máu; lâm sàng và hình ảnh tràn máu màng phổi trái lớn kèm gãy ba xương sườn; dẫn lưu ra 1.600 mL máu ngay và còn chảy.","dat_van_de":"Tràn máu màng phổi trái lượng nhiều kèm sốc; gãy xương sườn gây đau hạn chế hô hấp; cần loại trừ tổn thương ngực bụng khác; quyết định mở ngực cấp cứu.","chan_doan_so_bo":"Chấn thương ngực kín, tràn máu màng phổi trái, sốc mất máu.","bien_luan":"Cơ chế năng lượng cao kèm suy hô hấp, hạ huyết áp, gõ đục và rì rào phế nang giảm một bên hướng đến tràn máu màng phổi. Tĩnh mạch cổ xẹp và khí quản ở giữa phân biệt với tràn khí áp lực (tĩnh mạch cổ căng, khí quản lệch) và chèn ép tim. eFAST và X-quang xác nhận dịch màng phổi trái, gãy ba xương sườn. Dẫn lưu ra lượng lớn máu ngay, vẫn tiếp tục chảy, là chỉ định mổ cầm máu cấp cứu.","sinh_ly_benh":"Mỗi bên khoang màng phổi chứa được khoảng 3 lít máu. Đầu xương sườn gãy rách mạch liên sườn và nhu mô phổi, mạch vú trong, có thể cả mạch rốn phổi. Mất máu làm giảm thể tích tuần hoàn, máu trong khoang chèn ép phổi gây giảm thông khí, giảm oxy máu, nhiễm toan.","chan_doan_phan_biet":"Tràn khí màng phổi áp lực; chèn ép tim; vỡ lách hoặc tạng đặc gây tràn máu màng phổi do thủng cơ hoành; dập phổi; vỡ phế quản; tổn thương mạch lớn trong lồng ngực.","chan_doan_xac_dinh":"Tràn máu màng phổi trái lượng nhiều (hơn 1.500 mL ngay khi dẫn lưu) do chấn thương ngực kín, gãy xương sườn 6 đến 8 trái, sốc mất máu độ III.","dieu_tri":"Oxy, hai đường truyền lớn, truyền máu sớm, hạn chế tinh thể, giữ ấm. Dẫn lưu màng phổi cỡ lớn khoang liên sườn 5 đường nách giữa. Mổ mở ngực cấp cứu cầm máu khi dẫn lưu ra từ 1.500 mL ngay hoặc từ 200 mL mỗi giờ liên tục 2 đến 4 giờ hoặc huyết động xấu. Hậu phẫu: giảm đau đa mô thức, vật lý trị liệu hô hấp, rút dẫn lưu khi dịch dưới 200 mL mỗi 24 giờ, kháng sinh dự phòng theo quy trình.","tien_luong":"Dè dặt trong 24 giờ đầu; tốt hơn nếu cầm máu sớm và hồi sức đủ. Nguy cơ biến chứng gồm máu đông màng phổi, nhiễm trùng mủ màng phổi, viêm phổi, suy hô hấp cấp.","du_phong":"Tuân thủ trang bị bảo hộ khi làm việc trên cao; huấn luyện sơ cứu ban đầu tại công trường; theo dõi sau mổ phát hiện máu đông màng phổi (chụp phim, nội soi lồng ngực khi cần)."},"nguon":["ATLS 10th edition, American College of Surgeons, 2018: chương Thoracic Trauma.","Giáo trình Ngoại bệnh lý, Đại học Y Dược TP.HCM: bài Chấn thương ngực.","Bộ Y tế: Hướng dẫn quy trình kỹ thuật chuyên ngành ngoại khoa (dẫn lưu màng phổi)."],"status":"nhap"},{"id":"ngoai-chan-thuong-005","title":"Nổ bếp gas, bỏng lửa diện rộng, khàn tiếng","kind":"Ngoại","level":"Khó","group":"ngoai","name":"Anh T. M. H.","age":32,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Nam thanh niên nặng 60 kg được đưa vào phòng cấp cứu 1 giờ sau vụ nổ bếp gas trong nhà kín, bỏng lửa vùng mặt, ngực bụng và hai tay, giọng khàn.","vitals":{"hr":124,"sbp":104,"dbp":64,"rr":28,"t":36.2,"spo2":94},"ask":[["Bỏng xảy ra thế nào, trong nhà kín hay ngoài trời?","Nổ bếp gas trong bếp kín, lửa bùng vào người, quần áo bắt cháy; được dập lửa sau khoảng 1 phút.","e"],["Bỏng cách đây bao lâu, đã sơ cứu gì?","Cách 1 giờ; người nhà dội nước mát và cởi áo, quấn khăn sạch.","e"],["Có ho, khàn tiếng, khó thở hoặc khạc đờm đen không?","Khàn giọng, ho đờm lẫn bồ hóng, thở nhanh.","e"],["Có tỉnh táo không, có ngạt khói trong phòng kín không?","Tỉnh, đau đầu; ở trong phòng đầy khói khoảng 2 phút.","e"],["Có chấn thương kèm theo (ngã, va đập) không?","Bị hất ngã nhưng không đập đầu, không đau cổ, ngực bụng.","e"],["Bệnh nền, dị ứng, thuốc đang dùng?","Khỏe mạnh, không bệnh nền, không dị ứng.","n"],["Lần ăn uống gần nhất?","Ăn tối cách 3 giờ.","n"]],"exam":[["K","Đường thở và vùng mặt cổ","Khàn tiếng, bồ hóng quanh mũi miệng, lông mũi cháy sém, niêm mạc miệng đỏ phù nhẹ; thở khò khè, không rút lõm ngực.","e"],["K","Đánh giá diện tích và độ sâu bỏng (quy tắc số 9)","Thân trước 18%, hai chi trên 18% (cả chu vi), mặt cổ 4%: tổng 40%. Vùng ngực trước và mặt trong cẳng tay có da trắng ngà, mất cảm giác (độ III) khoảng 15%; phần còn lại độ II sâu phồng nước.","e"],["K","Tuần hoàn chi trên và ngực","Chi trên phải phù căng, mạch quay yếu, đầu ngón lạnh; chi trên trái mạch quay rõ; ngực bỏng sâu hạn chế giãn nở.","e"],["K","Tri giác và tuần hoàn toàn thân","Tỉnh, Glasgow 15; da lạnh ẩm, thời gian đầy mao mạch 3 giây.","e"],["K","Tìm tổn thương kèm theo","Cột sống cổ, ngực, bụng và khung chậu không điểm đau; không biến dạng chi.","n"]],"tests":[["Khí máu động mạch và COHb",10,"pH 7,31; lactate 3,4 mmol/L; BE âm 5; COHb 14% (đã thở oxy 100%).","e"],["Công thức máu, ure, creatinin, điện giải đồ",10,"Hb 17,0 g/dL, hematocrit 51% (cô đặc); Na 138, K 4,4 mmol/L; creatinin 88 µmol/L.","e"],["Điện tâm đồ",10,"Nhịp nhanh xoang 120 lần/phút, không dấu thiếu máu cục bộ.","n"],["X-quang ngực thẳng tại giường",10,"Chưa thấy tổn thương nhu mô rõ; thường chưa thay đổi sớm trong bỏng hô hấp.","n"],["Nội soi phế quản ống mềm khi đã bảo đảm đường thở",20,"Bồ hóng và phù nề niêm mạc thanh môn, khí quản; xác nhận tổn thương hô hấp do hít khói.","n"],["Cấy vết bỏng ngay khi tiếp nhận để quyết định kháng sinh dự phòng toàn thân",10,"Không có chỉ định; vết bỏng sớm thường chưa nhiễm khuẩn và kháng sinh dự phòng toàn thân không thường quy.","w"]],"opt":{"ydx":["Bỏng độ II nông diện hẹp vùng mặt và ngực","Hội chứng suy hô hấp cấp do viêm phổi hít","Phản vệ độ III","+Bỏng lửa nặng khoảng 40% diện tích da (độ II sâu và độ III), nghi bỏng đường hô hấp và ngộ độc CO, đang vào giai đoạn sốc bỏng"],"dich_hoi_suc":["Uống ORS 100 mL mỗi giờ, không truyền tĩnh mạch","Natri clorid 0,9% bolus 2.000 mL một lần rồi dừng","+Ringer lactat khởi đầu 400 mL mỗi giờ, chỉnh theo nước tiểu 30 đến 50 mL mỗi giờ","Ringer lactat 100 mL mỗi giờ cố định trong 24 giờ"],"duong_tho":["Chờ thấy tím rồi mới đặt nội khí quản","Chỉ khí dung giãn phế quản","Mở khí quản thường quy cho mọi bỏng vùng mặt","+Đặt nội khí quản sớm khi nghi bỏng hô hấp, trước khi phù nề tăng; thở oxy 100% khi nghi ngộ độc CO"]},"actions":["++Thở oxy 100% và đặt nội khí quản sớm|2|Khàn tiếng, bồ hóng, lông mũi cháy sém báo hiệu phù nề đường thở tăng nhanh, đặt muộn có thể không còn khả thi.","++Đặt hai đường truyền lớn qua da lành, bắt đầu Ringer lactat 400 mL mỗi giờ, đặt thông tiểu theo dõi nước tiểu|2|Bỏng trên 20% diện tích cần bù dịch sớm; điều chỉnh 10 đến 20% mỗi giờ theo nước tiểu 0,5 mL mỗi kg mỗi giờ.","++Cởi bỏ quần áo, trang sức; che vết bỏng bằng gạc vô khuẩn khô hoặc màng sạch, giữ ấm|2|Hạn chế mất nhiệt và nhiễm khuẩn; làm mát kéo dài trên diện rộng gây hạ thân nhiệt.","++Giảm đau opioid tĩnh mạch liều nhỏ chia nhiều lần, tiêm phòng uốn ván|2|Bỏng đau dữ dội; tiêm phòng uốn ván là bắt buộc.","+Rạch giải áp hoại tử chi trên phải, theo dõi chi trên trái và ngực|3|Bỏng sâu vòng quanh chi làm chèn ép tuần hoàn; ngực bỏng sâu hạn chế thở.","+Chuyển trung tâm bỏng; cắt lọc hoại tử sớm và ghép da; nuôi dưỡng tiêu hóa sớm|3|Bỏng sâu rộng cần cắt hoại tử sớm; nuôi ăn sớm giảm hồi biến chuyển hóa.","!Chườm đá lạnh hoặc ngâm cả người nước đá kéo dài|0|Gây hạ thân nhiệt, co mạch, làm sâu thêm tổn thương.","!Bôi kem đánh răng, nước mắm hoặc mỡ động vật lên vết bỏng rồi băng kín|0|Nhiễm khuẩn, che lấp đánh giá độ sâu, khó làm sạch.","!Hạn chế dịch trong 24 giờ đầu và dùng lợi tiểu sớm để tránh phù phổi|0|Gây sốc bỏng nặng, thiếu tưới máu, tổn thương thận cấp."],"teach":"Bỏng lửa trong không gian kín kèm khàn tiếng, bồ hóng cần nghĩ ngay bỏng hô hấp và ngộ độc CO: bảo đảm đường thở sớm và oxy 100%. Bù dịch theo công thức khởi đầu rồi chỉnh theo nước tiểu; bỏng sâu vòng quanh chi hoặc ngực cần theo dõi và rạch giải áp.","hbu":{"hanh_chinh":"Anh T. M. H., nam, 32 tuổi, nặng 60 kg, thợ hàn; nhập khoa Cấp cứu rồi chuyển đơn vị bỏng.","ly_do_vao_vien":"Bỏng lửa toàn thân sau nổ bếp gas, khàn tiếng.","benh_su":"Cách 1 giờ, nổ bếp gas trong bếp kín, lửa bùng vào người, quần áo cháy; dập lửa sau khoảng 1 phút. Ở trong khói khoảng 2 phút. Sau đó đau bỏng dữ dội, khàn tiếng, ho đờm lẫn bồ hóng, đau đầu. Được dội nước mát, cởi áo và đưa đi cấp cứu.","tien_su":"Khỏe mạnh, không bệnh nền, không dị ứng. Chưa rõ tiêm phòng uốn ván.","luoc_qua_co_quan":"Khó thở nhẹ, ho; tiểu chưa theo dõi; không nôn, không đau bụng.","kham_hien_tai":"Mạch 124, huyết áp 104/64 mmHg, nhịp thở 28, SpO2 94% khí phòng, nhiệt độ 36,2 độ C, Glasgow 15. Khàn tiếng, bồ hóng quanh mũi miệng, lông mũi cháy sém. Bỏng tổng cộng khoảng 40% diện tích da (thân trước 18%, hai chi trên 18%, mặt cổ 4%), trong đó khoảng 15% độ III. Chi trên phải phù căng, mạch quay yếu.","can_lam_sang":"Khí máu: pH 7,31, lactate 3,4 mmol/L, COHb 14%. Hb 17,0 g/dL, hematocrit 51%, creatinin 88 µmol/L. Điện tâm đồ nhịp nhanh xoang. Nội soi phế quản: bồ hóng và phù nề thanh môn, khí quản.","tom_tat":"Nam 32 tuổi, bỏng lửa trong không gian kín khoảng 40% diện tích da kèm 15% độ III, có dấu hiệu bỏng đường hô hấp và ngộ độc CO, thở nhanh, tim nhanh, huyết áp thấp, cô đặc máu; bỏng sâu chi trên phải làm giảm tưới máu đầu chi.","dat_van_de":"Bảo vệ đường thở trước khi phù nề; bù dịch khối lượng lớn theo công thức; theo dõi chèn ép do bỏng sâu vòng quanh; kiểm soát đau, nhiễm khuẩn, dinh dưỡng; chuyển điều trị chuyên sâu.","chan_doan_so_bo":"Bỏng lửa nặng, nghi bỏng đường hô hấp và ngộ độc CO.","bien_luan":"Diện tích bỏng ước tính 40% bằng quy tắc số 9: thân trước 18, hai chi trên 18, mặt cổ 4. Độ sâu: vùng da trắng ngà, mất cảm giác là độ III. Khàn tiếng, bồ hóng, lông mũi cháy sém và nguồn lửa trong không gian kín gợi ý bỏng hô hấp; COHb 14% ngay cả sau khi đã thở oxy cho thấy ngạt khói. Mạch nhanh, hạ huyết áp, lactate tăng, hematocrit cao là biểu hiện của sốc bỏng.","sinh_ly_benh":"Bỏng làm tăng tính thấm mao mạch toàn thân, huyết tương thoát ra khoảng kẽ gây giảm thể tích tuần hoàn, phù nề và cô đặc máu; cao điểm trong 8 đến 12 giờ đầu. Bỏng hô hấp gây phù nề đường thở, tăng tiết, suy giảm trao đổi khí. CO gắn với hemoglobin làm giảm vận chuyển oxy. Hoại tử da vòng quanh chi làm tăng áp lực khoang, giảm tưới máu ngọn chi.","chan_doan_phan_biet":"Bỏng nhiệt diện hẹp; ngạt khói do ngộ độc cyanide kèm theo; chấn thương ngực kín; phản vệ; sốc tim.","chan_doan_xac_dinh":"Bỏng lửa 40% diện tích da (độ II sâu và độ III 15%), bỏng đường hô hấp do hít khói, ngộ độc CO, sốc bỏng sớm, bỏng sâu chi trên phải có thiếu máu đầu chi.","dieu_tri":"Oxy 100%, đặt nội khí quản sớm. Hai đường truyền lớn, Ringer lactat khởi đầu 400 mL mỗi giờ (10 mL nhân %TBSA cho người lớn 40 đến 80 kg), điều chỉnh theo nước tiểu 30 đến 50 mL mỗi giờ. Giảm đau opioid, phòng uốn ván, che vết bỏng bằng gạc sạch, giữ ấm. Rạch giải áp chi trên phải. Chuyển trung tâm bỏng, cắt lọc hoại tử sớm, ghép da, nuôi dưỡng tiêu hóa sớm, theo dõi nhiễm khuẩn, phục hồi chức năng và chăm sóc sẹo.","tien_luong":"Nặng: diện tích bỏng lớn, bỏng hô hấp, tuổi trẻ giúp tiên lượng thuận lợi hơn; nguy cơ nhiễm khuẩn huyết, suy đa cơ quan, sẹo co kéo.","du_phong":"An toàn bếp gas (kiểm tra van, ống dẫn, thông gió); huấn luyện sơ cứu bỏng đúng cách: ngừng tiếp xúc, làm mát ngắn bằng nước sạch, che sạch, không bôi chất lạ; phục hồi chức năng sớm, chăm só
