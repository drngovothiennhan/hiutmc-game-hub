i","Chất lưỡi nhạt, rêu trắng mỏng.","e"],["M","Giọng nói, hơi thở","Tiếng nói rõ, hơi thở không hôi.","n"],["T","Mạch","Mạch phù khẩn.","e"],["T","Sờ vùng cổ vai","Cơ thang, cơ nâng vai bên phải co cứng, ấn đau, sờ thấy lạnh hơn bên trái.","e"],["K","Tầm vận động cột sống cổ","Hạn chế ngửa và xoay phải, khi ngửa và nghiêng phải thì đau lan xuống tay (nghiệm pháp Spurling dương tính).","e"],["K","Thần kinh chi trên","Giảm cảm giác nhẹ ngón cái và ngón trỏ phải, cơ lực 5/5, phản xạ gân cơ nhị đầu bên phải giảm nhẹ. Dấu Hoffmann âm tính hai bên.","e"],["K","Thần kinh chi dưới","Cơ lực chi dưới 5/5, phản xạ gân gối bình thường, không có dấu Babinski.","e"]],"tests":[["X-quang cột sống cổ thẳng, nghiêng, chếch 3/4",15,"Mất đường cong sinh lý, hẹp khe C5-C6, gai xương bờ trước thân đốt C5-C6, hẹp lỗ liên hợp C5-C6 bên phải.","e"],["MRI cột sống cổ",45,"Thoái hóa đĩa đệm C5-C6, phồng đĩa đệm lệch cạnh phải chèn ép nhẹ rễ C6 phải. Tủy sống không bị chèn ép, không có tín hiệu bất thường trong tủy.","e"],["Điện cơ và dẫn truyền thần kinh chi trên",30,"Gợi ý tổn thương rễ C6 phải mức độ nhẹ.","n"],["Công thức máu, tốc độ máu lắng",20,"Bình thường.","n"],["Chụp mạch máu não (DSA)",60,"Không có chỉ định ở ca này, thủ thuật xâm lấn.","w"]],"opt":{"ydx":["+Hội chứng cổ vai cánh tay do thoái hóa cột sống cổ (chèn ép rễ C6)","Bệnh lý tủy cổ do thoái hóa","Hội chứng ống cổ tay","Viêm quanh khớp vai","Ung thư di căn cột sống cổ"],"bd":["+Cảnh tý (kiên tý)","Ngũ thập kiên","Trúng phong","Hạng cường do ngoại cảm","Thống phong"],"bc":["+Biểu – Thực – Hàn","Lý – Hư – Hàn","Lý – Thực – Nhiệt","Biểu – Thực – Nhiệt","Lý – Hư – Nhiệt"],"the":["+Phong hàn thấp tý","Khí trệ huyết ứ","Can thận hư","Đàm thấp trở lạc","Khí huyết hư"],"phap":["+Khu phong tán hàn trừ thấp, thông kinh hoạt lạc","Bổ can thận, cường cân cốt","Hoạt huyết hóa ứ, hành khí chỉ thống","Thanh nhiệt lợi thấp","Kiện tỳ hóa đàm"],"phuong":["+Cát căn thang","+Quyên tý thang","Độc hoạt tang ký sinh thang","Thân thống trục ứ thang","Bạch hổ gia quế chi thang"],"huyet":["+Phong trì","+Kiên tỉnh","+Đại chùy","+Khúc trì","+Hợp cốc","Dũng tuyền","Thái khê","Quan nguyên","Thừa sơn"]},"actions":["+Châm Phong trì, Kiên tỉnh (Đởm), Đại chùy (Đốc mạch), Khúc trì, Hợp cốc (Đại trường), kèm giác hơi hoặc cứu vùng cổ gáy|25|Khu phong tán hàn, thông kinh lạc vùng cổ vai tay.","+Sàng lọc dấu hiệu chèn ép tủy cổ (Hoffmann, Babinski, rối loạn cơ tròn, đi vụng về)|3|Phát hiện bệnh lý tủy cần chuyển phẫu thuật thần kinh.","+Hướng dẫn tư thế làm việc, chỉnh độ cao màn hình, nghỉ giải lao mỗi 45 phút|3|Giảm tải cho cột sống cổ, ngừa tái phát.","+Chiếu đèn hồng ngoại hoặc chườm ấm vùng cổ gáy|10|Hợp với thể phong hàn thấp.","+Dặn quay lại ngay nếu yếu tay chân tăng, đi loạng choạng, bí tiểu|2|Dấu hiệu chèn ép tủy tiến triển.","-Kéo giãn cột sống cổ cường độ cao kèm xoay bẻ mạnh|10|Không cần thiết, tăng nguy cơ tổn thương.","!Nắn bẻ cột sống cổ mạnh, xoay đột ngột|5|Có thể gây tổn thương rễ, tủy hoặc động mạch đốt sống.","!Cho thuốc thanh nhiệt hàn lương mạnh (Hoàng liên, Thạch cao)|2|Thể phong hàn thấp, thuốc hàn làm tà khí ngưng trệ nặng hơn."],"teach":"Đau cổ lan tay theo dải C6, tê ngón cái ngón trỏ, nghiệm pháp Spurling dương tính gợi ý chèn ép rễ C6. Sợ lạnh, rêu trắng mỏng, mạch phù khẩn cho ra thể phong hàn thấp tý. Luôn tìm dấu hiệu bệnh lý tủy cổ (Hoffmann, rối loạn cơ tròn, đi vụng về) và dấu hiệu ác tính (sụt cân, đau đêm) trước khi châm cứu.","status":"draft"},{"id":"thoai-hoa-khop-goi-han-that","title":"Đau hai gối khi lên xuống cầu thang","kind":"Cơ xương khớp","level":"Dễ","group":"cxk","place":"Phòng châm cứu","clock":"14:10","name":"Bà Nguyễn Thị Tâm","age":63,"sex":"nữ","intro":"Bà về hưu, đến vì đau hai gối khoảng 1 năm, nặng dần, đau khi lên xuống cầu thang và đi bộ xa, trời lạnh đau nhiều hơn.","vitals":{"hr":74,"sbp":125,"dbp":78,"rr":18,"t":36.7,"spo2":98},"ask":[["Đau gối như thế nào, bên nào nhiều hơn?","Đau âm ỉ hai gối, gối phải nhiều hơn, đau khi đứng lên ngồi xuống, lên xuống cầu thang. Nghỉ thì đỡ.","e"],["Buổi sáng có cứng khớp không, bao lâu?","Cứng gối khi mới ngủ dậy, khoảng 10 đến 15 phút là đi lại được.","e"],["Gối có sưng, nóng, đỏ không? Có sốt không?","Không sưng nóng đỏ, không sốt. Thỉnh thoảng gối hơi tràn dịch nhẹ sau khi đi nhiều.","e"],["Trời lạnh, chườm nóng ảnh hưởng thế nào?","Trời lạnh, trời mưa đau tăng. Chườm ấm thì đỡ.","e"],["Có đau lưng, mỏi gối, ù tai, tiểu đêm không?","Hay đau mỏi lưng, gối mỏi yếu, tiểu đêm 2 đến 3 lần, tai ù nhẹ.","e"],["Có đau nhiều khớp nhỏ ở bàn tay, sưng đối xứng không?","Không, các khớp bàn tay bình thường.","e"],["Cân nặng, nghề nghiệp trước đây?","Thừa cân, BMI khoảng 27. Trước đây là nhân viên bán hàng đứng nhiều.","n"],["Đã dùng thuốc giảm đau chưa?","Thỉnh thoảng uống thuốc giảm đau kháng viêm mua ngoài, đỡ chút rồi lại đau.","n"],["Ăn ngủ ra sao?","Ăn được, ngủ tạm, đôi lúc đau khi trở mình.","n"]],"exam":[["V","Dáng đi, hình dạng khớp gối","Dáng đi hơi khập khiễng, hai gối hơi vẹo trong, không sưng đỏ.","e"],["V","Lưỡi","Chất lưỡi nhạt, rêu trắng mỏng.","e"],["M","Giọng nói, hơi thở","Tiếng nói bình thường, hơi thở không hôi.","n"],["T","Mạch","Mạch trầm tế nhược, hai bộ xích yếu.","e"],["T","Sờ gối","Da gối không nóng, sờ hơi lạnh, có lạo xạo khi cử động, ấn đau khe khớp trong.","e"],["K","Khám khớp gối","Tầm vận động gập 120 độ, duỗi đủ, có tiếng lục cục. Nghiệm pháp bập bềnh xương bánh chè dương tính nhẹ ở gối phải.","e"],["K","Thần kinh chi dưới","Cơ lực 5/5, cảm giác và phản xạ bình thường, không có dấu thần kinh khu trú.","n"],["K","Khám khớp háng cùng bên","Tầm vận động khớp háng bình thường, không đau.","n"]],"tests":[["X-quang khớp gối thẳng và nghiêng khi đứng",15,"Hẹp khe khớp đùi chày trong, gai xương bờ khớp, xơ cứng xương dưới sụn, Kellgren-Lawrence độ 2 đến 3.","e"],["Tốc độ máu lắng, CRP",20,"Bình thường.","n"],["Acid uric máu",15,"Bình thường.","n"],["Yếu tố dạng thấp (RF), anti-CCP",30,"Âm tính.","n"],["MRI khớp gối",45,"Không có chỉ định để chẩn đoán thoái hóa khớp thông thường nếu đã có X-quang điển hình.","w"]],"opt":{"ydx":["+Thoái hóa khớp gối nguyên phát","Viêm khớp dạng thấp","Gút mạn","Viêm khớp gối nhiễm khuẩn","Hoại tử vô khuẩn chỏm xương đùi"],"bd":["+Hạc tất phong (tý chứng vùng gối)","Thống phong","Yêu thống","Lịch tiết phong","Nuy chứng"],"bc":["+Lý – Hư kiêm Thực – Hàn","Biểu – Thực – Nhiệt","Lý – Thực – Nhiệt","Biểu – Hư – Hàn","Lý – Hư – Nhiệt"],"the":["+Can thận hư kèm phong hàn thấp","Thấp nhiệt tý","Khí trệ huyết ứ","Đàm thấp trở lạc","Tỳ vị hư"],"phap":["+Bổ can thận, khu phong tán hàn trừ thấp, thông kinh hoạt lạc","Thanh nhiệt lợi thấp, thông lạc","Hoạt huyết hóa ứ, hành khí","Kiện tỳ ích khí","Giải biểu tán hàn"],"phuong":["+Độc hoạt tang ký sinh thang","Bạch hổ gia quế chi thang","Thân thống trục ứ thang","Tứ quân tử thang","Ngân kiều tán"],"huyet":["+Độc tỵ","+Nội tất nhãn","+Huyết hải","+Dương lăng tuyền","+Thận du","Hợp cốc","Phong trì","Nội quan","Thái xung"]},"actions":["+Châm Độc tỵ, Dương lăng tuyền, Huyết hải, Nội tất nhãn, Thận du, kèm cứu ngải quanh gối|25|Bổ can thận, tán hàn thông lạc.","+Sàng lọc dấu hiệu viêm khớp cấp: sưng nóng đỏ, sốt, đau dữ dội khi nghỉ|3|Loại trừ viêm khớp nhiễm khuẩn, gút, viêm khớp dạng thấp.","+Hướng dẫn giảm cân, tập mạnh cơ tứ đầu đùi, tránh ngồi xổm, leo cầu thang nhiều|4|Giảm tải khớp gối.","+Chườm ấm hoặc chiếu đèn hồng ngoại vùng gối|10|Hợp thể hàn thấp.","+Dặn thận trọng với thuốc kháng viêm giảm đau, nên dùng khi cần và theo hướng dẫn thầy thuốc|2|Tránh tác dụng phụ trên dạ dày, thận.","-Chụp MRI khớp gối thường quy|45|Không cần khi X-quang đã điển hình.","!Châm sâu, lưu kim lâu ngay vào gối đang sưng nóng đỏ nghi viêm nhiễm|5|Nguy cơ đưa vi khuẩn vào khớp.","!Tiêm corticoid nội khớp lặp lại liên tục mỗi tuần|5|Làm tổn thương sụn, tăng nguy cơ nhiễm khuẩn."],"teach":"Đau cơ giới tăng khi vận động, cứng khớp buổi sáng dưới 30 phút, X-quang hẹp khe khớp và gai xương là thoái hóa khớp gối. Thể can thận hư (đau mỏi lưng gối, tiểu đêm, mạch trầm tế) kèm phong hàn thấp (đau tăng khi lạnh). Cần phân biệt với viêm khớp nhiễm khuẩn, gút, viêm khớp dạng thấp.","status":"draft"},{"id":"toa-cot-phong-thoat-vi-dia-dem","title":"Đau thắt lưng lan chân phải, yếu bàn chân","kind":"Cơ xương khớp","level":"Khó","group":"cxk","place":"Phòng châm cứu","clock":"10:20","name":"Anh Lê Quốc Bảo","age":42,"sex":"nam","intro":"Anh làm tài xế đường dài, đến vì đau thắt lưng lan xuống chân phải 5 tuần, mấy ngày nay thấy tê mu bàn chân và hơi khó nhấc mũi chân.","vitals":{"hr":80,"sbp":128,"dbp":82,"rr":18,"t":36.8,"spo2":98},"ask":[["Đau bắt đầu thế nào, lan đi đâu?","Đau thắt lưng sau khi khuân đồ nặng 5 tuần trước, sau đó đau lan mông, mặt ngoài đùi, ngoài cẳng chân tới mu bàn chân phải.","e"],["Đau như thế nào, tăng khi nào?","Đau như dao đâm, cố định, tăng khi ho, hắt hơi, ngồi lâu, cúi người. Đêm đau nhiều hơn, phải nằm co chân.","e"],["Có yếu chân, vấp ngón chân khi đi không?","Mấy ngày nay hay vấp mũi chân phải, nhấc ngón cái lên khó hơn bên trái.","e"],["Có tê vùng sinh dục, hậu môn, bí tiểu hoặc tiểu không tự chủ không?","Không tê vùng đáy chậu. Tiểu tiện, đại tiện bình thường. Chức năng sinh lý chưa thay đổi.","e"],["Có yếu hoặc tê cả hai chân không?","Chỉ chân phải, chân trái bình thường.","e"],["Có sốt, sụt cân, tiền sử ung thư, tiêm chích hoặc nhiễm trùng gần đây không?","Không sốt, không sụt cân, không tiền sử ung thư, không có nhiễm trùng gần đây.","e"],["Chườm nóng, nghỉ ngơi có đỡ không?","Chườm nóng đỡ, trời lạnh đau tăng. Nằm nghỉ đỡ nhưng đêm vẫn đau.","n"],["Ăn uống, ngủ nghỉ thế nào?","Ngủ kém vì đau, ăn bình thường, hay táo bón nhẹ.","n"],["Đã dùng thuốc nào, đã chụp phim chưa?","Uống thuốc giảm đau và giãn cơ 1 tuần, đỡ ít. Chưa chụp phim.","n"]],"exam":[["V","Thần sắc, tư thế, dáng đi","Sắc mặt hơi tối, tư thế nghiêng người sang trái khi đứng, dáng đi thận trọng, chân phải bước nhẹ, hơi vấp mũi chân.","e"],["V","Lưỡi","Chất lưỡi tím tối, có điểm ứ huyết hai bên rìa, rêu trắng mỏng.","e"],["M","Giọng nói, hơi thở","Nói rõ, thở không hôi, hay thở dài vì đau.","n"],["T","Mạch","Mạch huyền sáp.","e"],["T","Sờ vùng thắt lưng","Co cứng cơ cạnh sống L4-L5 phải, ấn đau điểm cạnh sống L4-L5 và dọc đường đi thần kinh tọa, sờ hơi lạnh.","e"],["K","Dấu Lasègue và Valleix","Lasègue dương tính phải ở 40 độ, điểm Valleix đau.","e"],["K","Cơ lực và cảm giác chi dưới phải","Gập mu bàn chân và duỗi ngón cái phải 4/5, giảm cảm giác mu bàn chân và mặt ngoài cẳng chân phải. Phản xạ gân gót bình thường.","e"],["K","Cảm giác vùng yên ngựa, trương lực cơ vòng hậu môn","Cảm giác vùng đáy chậu bình thường, trương lực cơ vòng hậu môn bình thường.","e"]],"tests":[["MRI cột sống thắt lưng",45,"Thoát vị đĩa đệm L4-L5 lệch cạnh phải, chèn ép rễ L5 phải. Ống sống không hẹp nặng, không chèn ép chùm đuôi ngựa, không thấy khối u hay viêm đĩa đệm.","e"],["X-quang cột sống thắt lưng thẳng nghiêng",15,"Hẹp khe đĩa đệm L4-L5, gai xương nhẹ.","n"],["Công thức máu, CRP, tốc độ máu lắng",20,"Bình thường.","n"],["Điện cơ chi dưới phải",30,"Tổn thương rễ L5 phải mức độ nhẹ đến vừa.","n"],["PET-CT toàn thân",120,"Không có chỉ định ở ca này khi chưa có dấu hiệu nghi ngờ ác tính.","w"]],"opt":{"ydx":["+Đau thần kinh tọa do thoát vị đĩa đệm L4-L5 chèn ép rễ L5","Hội chứng đuôi ngựa","Viêm khớp cùng chậu","Hẹp ống sống do ung thư di căn","Hội chứng cơ lê"],"bd":["+Tọa cốt phong","Yêu thống do thận hư","Chứng nuy","Hạc tất phong","Thống phong"],"bc":["+Lý – Thực – Không hàn không nhiệt rõ","Lý – Hư – Hàn","Biểu – Thực – Hàn","Lý – Thực – Nhiệt","Lý – Hư – Nhiệt"],"the":["+Khí trệ huyết ứ","Phong hàn thấp tý","Thấp nhiệt","Can thận hư","Khí huyết hư"],"phap":["+Hoạt huyết hóa ứ, hành khí chỉ thống, thông kinh lạc","Bổ can thận, cường yêu tất","Thanh nhiệt lợi thấp","Khu phong tán hàn","Bổ khí dưỡng huyết"],"phuong":["+Thân thống trục ứ thang","Độc hoạt tang ký sinh thang","Bát vị hoàn","Bát chính tán","Quy tỳ thang"],"huyet":["+Đại trường du","+Hoàn khiêu","+Dương lăng tuyền","+Huyền chung","+Ủy trung","Hợp cốc","Nội quan","Khúc trì","Phong trì"]},"actions":["+Hỏi và khám đầy đủ dấu hiệu hội chứng đuôi ngựa (tê vùng yên ngựa, bí tiểu, yếu hai chân, trương lực cơ vòng)|5|Cần loại trừ trước khi châm cứu, chỉ định phẫu thuật cấp cứu nếu có.","+Châm Đại trường du, Hoàn khiêu (Đởm), Dương lăng tuyền (Đởm), Huyền chung (Đởm), Ủy trung (Bàng quang)|25|Hoạt huyết thông lạc theo đường kinh đau lan.","+Hướng dẫn tư thế nằm nghỉ, tránh khuân vác, cúi gập, ngồi lái lâu|3|Giảm áp lực đĩa đệm.","+Hẹn tái khám sau 3 đến 5 ngày, chuyển khoa phẫu thuật thần kinh nếu yếu cơ tiến triển hoặc không cải thiện sau 6 đến 8 tuần|3|Yếu cơ đã có (4/5), cần theo dõi sát.","+Dặn quay lại ngay nếu tê vùng đáy chậu, bí tiểu, yếu hai chân tăng|2|Dấu hiệu hội chứng đuôi ngựa.","-Chụp PET-CT toàn thân|120|Không có nghi ngờ ác tính.","!Nắn bẻ, bấm huyệt mạnh cột sống thắt lưng khi chưa loại trừ hội chứng đuôi ngựa|5|Có thể làm nặng chèn ép rễ và chùm đuôi ngựa.","!Cho tập cúi gập mạnh, ép cột sống thắt lưng tối đa|5|Tăng áp lực đĩa đệm, thoát vị nặng hơn."],"teach":"Đau lan theo dải L5 (mông, ngoài đùi, ngoài cẳng chân, mu bàn chân), Lasègue dương tính, yếu gập mu bàn chân cho thấy thoát vị L4-L5 chèn ép rễ L5. Thể khí trệ huyết ứ: đau cố định như dao đâm, đêm nặng, lưỡi tím điểm ứ huyết, mạch huyền sáp. Dấu hiệu đỏ cần hỏi ở mọi ca đau thắt lưng: hội chứng đuôi ngựa, yếu cơ tiến triển, sốt, sụt cân, tiền sử ung thư.","status":"draft"},{"id":"hoi-chung-ong-co-tay-huyet-hu","title":"Tê bàn tay về đêm, hay giật mình thức giấc","kind":"Cơ xương khớp","level":"Trung bình","group":"cxk","place":"Phòng châm cứu","clock":"15:30","name":"Chị Phạm Thị Lan","age":38,"sex":"nữ","intro":"Chị là nhân viên đóng gói, đến vì tê và đau bàn tay phải 3 tháng, tê nhiều về đêm làm chị thức giấc phải vẩy tay.","vitals":{"hr":72,"sbp":105,"dbp":68,"rr":17,"t":36.5,"spo2":99},"ask":[["Tê ở những ngón nào?","Tê ngón cái, ngón trỏ, ngón giữa và nửa ngón nhẫn phía ngón cái bên tay phải. Ngón út không tê.","e"],["Khi nào tê nhiều nhất?","Tê nhiều về đêm và sáng sớm, thức giấc phải vẩy tay mới đỡ. Khi cầm điện thoại, cầm xe máy lâu cũng tê.","e"],["Có yếu tay, cầm nắm rơi đồ không?","Dạo này cầm chai nước, kéo cắt hay tuột tay.","e"],["Có đau cổ, đau lan từ cổ xuống tay không?","Không đau cổ, đau chỉ ở cổ tay và bàn tay.","e"],["Tay có lạnh, sợ lạnh không?","Tay chân hay lạnh, ngâm nước lạnh thì tê tăng. Chườm ấm thì đỡ.","e"],["Có bệnh nền như đái tháo đường, suy giáp, viêm khớp dạng thấp, mang thai không?","Không đái tháo đường, không bệnh tuyến giáp, không mang thai. Không đau sưng nhiều khớp.","e"],["Nghề nghiệp, công việc lặp lại cổ tay?","Đóng gói hàng, thao tác lặp lại cổ tay 8 giờ mỗi ngày.","n"],["Ăn ngủ, kinh nguyệt?","Hay hồi hộp, ngủ kém, hoa mắt khi đứng lên. Kinh nguyệt ít, màu nhạt.","n"],["Sắc mặt, cảm giác mệt mỏi?","Mệt mỏi, da xanh, hay chóng mặt nhẹ.","n"]],"exam":[["V","Thần sắc, hình thái bàn tay","Sắc mặt nhợt, môi nhạt. Bàn tay không sưng, ô mô cái chưa teo rõ.","e"],["V","Lưỡi","Chất lưỡi nhạt, rêu trắng mỏng.","e"],["M","Giọng nói, hơi thở","Tiếng nói nhỏ, hơi thở bình thường.","n"],["T","Mạch","Mạch tế, trầm.","e"],["T","Sờ tay","Bàn tay, đầu ngón lạnh, ẩm nhẹ.","n"],["K","Nghiệm pháp Tinel và Phalen","Tinel dương tính, Phalen dương tính sau 30 giây gập cổ tay.","e"],["K","Cảm giác và cơ lực bàn tay","Giảm cảm giác ngón 1, 2, 3 và nửa ngón 4 mặt gan tay, lực dạng ngón cái 4/5, chưa teo ô mô cái.","e"],["K","Khám cột sống cổ, thần kinh chi trên","Spurling âm tính, phản xạ gân cơ chi trên bình thường.","e"]],"tests":[["Điện cơ và dẫn truyền thần kinh giữa",30,"Giảm tốc độ dẫn truyền cảm giác và tăng thời gian tiềm vận động thần kinh giữa qua cổ tay phải, mức độ nhẹ đến vừa.","e"],["Siêu âm cổ tay",15,"Thần kinh giữa phù nề, tăng diện cắt ngang trước ống cổ tay.","n"],["Đường huyết đói, TSH",20,"Bình thường.","n"],["Công thức máu, ferritin",20,"Hb 10,8 g/dL, thiếu máu nhẹ thiếu sắt.","n"],["MRI não",45,"Không có chỉ định ở ca này.","w"]],"opt":{"ydx":["+Hội chứng ống cổ tay (thần kinh giữa) phải","Thoát vị đĩa đệm cổ C6","Bệnh đa dây thần kinh do đái tháo đường","Hội chứng lối thoát lồng ngực","Viêm khớp dạng thấp"],"bd":["+Uyển tý (chứng tý vùng cổ tay)","Cảnh tý","Trúng phong","Kiên tý","Huyễn vựng"],"bc":["+Lý – Hư – Hàn","Biểu – Thực – Hàn","Lý – Thực – Nhiệt","Lý – Hư – Nhiệt","Biểu – Hư – Nhiệt"],"the":["+Huyết hư hàn ngưng","Khí trệ huyết ứ","Can dương thượng cang","Thấp nhiệt","Đàm thấp trở lạc"],"phap":["+Ôn kinh tán hàn, dưỡng huyết thông mạch","Thanh nhiệt lợi thấp","Bình can tiềm dương","Hoạt huyết hóa ứ mạnh","Kiện tỳ hóa đàm"],"phuong":["+Đương quy tứ nghịch thang","Quyên tý thang","Thiên ma câu đằng ẩm","Bạch hổ thang","Ngân kiều tán"],"huyet":["+Đại lăng","+Nội quan","+Ngoại quan","+Hợp cốc","+Tam âm giao","Dũng tuyền","Thái xung","Phong trì","Yêu dương quan"]},"actions":["+Châm Đại lăng, Nội quan (Tâm bào), Ngoại quan (Tam tiêu), Hợp cốc (Đại trường), Tam âm giao (Tỳ)|25|Ôn kinh, dưỡng huyết, thông kinh lạc vùng ống cổ tay.","+Sàng lọc nguyên nhân: đái tháo đường, suy giáp, viêm khớp dạng thấp, thiếu máu, thai kỳ|4|Điều trị nguyên nhân kèm theo.","+Đánh giá mức độ: teo cơ ô mô cái, mất cảm giác nặng, điện cơ tổn thương nặng thì hội chẩn phẫu thuật giải ép|3|Chỉ định ngoại khoa khi nặng hoặc điều trị nội khoa thất bại.","+Hướng dẫn nẹp cổ tay tư thế trung gian khi ngủ, nghỉ giải lao khi thao tác lặp lại|3|Giảm áp lực trong ống cổ tay.","+Hướng dẫn bổ sung sắt, ăn uống bồi dưỡng khí huyết|3|Thiếu máu nhẹ kèm theo, cần xử trí theo bác sĩ.","-Chụp MRI não|45|Không có chỉ định.","!Cho thuốc thanh nhiệt hàn lương mạnh và châm tả mạnh|3|Thể huyết hư hàn ngưng, thuốc hàn làm huyết ngưng nặng hơn.","!Tiêm corticoid vào ống cổ tay không chẩn đoán xác định và không theo dõi|5|Nguy cơ tổn thương thần kinh giữa, chỉ làm khi có chỉ định chuyên khoa."],"teach":"Tê ngón 1, 2, 3 và nửa ngón 4, nặng về đêm, Tinel và Phalen dương tính là điển hình của hội chứng ống cổ tay. Ngón út không tê và Spurling âm tính giúp loại trừ chèn ép rễ cổ. Thể huyết hư hàn ngưng: mặt nhợt, tay lạnh, lưỡi nhạt, mạch tế trầm. Cần tìm bệnh nền (đái tháo đường, suy giáp, thiếu máu, thai kỳ) và dấu hiệu nặng (teo ô mô cái) cần ngoại khoa.","status":"draft"},{"id":"viem-quanh-khop-vai-dong-cung","title":"Đau vai trái nhiều về đêm, không giơ tay chải đầu được","kind":"Cơ xương khớp","level":"Dễ","group":"cxk","place":"Phòng châm cứu","clock":"09:30","name":"Bà Hoàng Thị Thu","age":55,"sex":"nữ","intro":"Bà đến vì đau vai trái 3 tháng, tăng dần, đau nhiều về đêm, giờ không giơ tay lên chải đầu hay cài áo ngực phía sau được.","vitals":{"hr":76,"sbp":128,"dbp":78,"rr":18,"t":36.6,"spo2":98},"ask":[["Đau vai bắt đầu thế nào, có chấn thương không?","Đau dần dần, không té ngã, không chấn thương rõ. Đau vai trái, lan nhẹ xuống mặt ngoài cánh tay.","e"],["Đau tăng khi nào?","Đau tăng khi giơ tay, vắt tay ra sau lưng, nằm đè lên vai trái. Đêm đau thức giấc.","e"],["Hạn chế vận động thế nào?","Giơ tay chỉ lên ngang vai, không gãi được lưng, không cài áo ngực. Tay còn cầm nắm bình thường.","e"],["Có đau ngực, khó thở, vã mồ hôi, đau lan hàm khi gắng sức không?","Không đau ngực, không khó thở, không vã mồ hôi.","e"],["Có sốt, ho kéo dài, ho ra máu, sụt cân, sụp mi không?","Không sốt, không ho ra máu, không sụt cân, mắt bình thường. Không hút thuốc.","e"],["Trời lạnh, chườm ấm ảnh hưởng ra sao?","Trời lạnh, ngủ quạt thổi vào vai thì đau tăng. Chườm ấm thì đỡ.","e"],["Bệnh nền?","Đái tháo đường típ 2, đang uống thuốc đều, chưa biến chứng.","n"],["Ăn, ngủ, đại tiểu tiện?","Ngủ kém vì đau, ăn bình thường, đại tiểu tiện bình thường.","n"],["Đã dùng thuốc gì?","Uống thuốc giảm đau 2 tuần, đỡ ít.","n"]],"exam":[["V","Thần sắc, tư thế vai","Tinh thần tỉnh táo, vai trái hơi nhô, tay trái khép sát thân.","n"],["V","Lưỡi","Chất lưỡi nhạt, rêu trắng mỏng.","e"],["M","Giọng nói, hơi thở","Tiếng nói rõ, hơi thở bình thường.","n"],["T","Mạch","Mạch phù khẩn.","e"],["T","Sờ khớp vai","Sờ vùng vai trái lạnh hơn bên phải, ấn đau rãnh nhị đầu và vùng trước khớp vai.","e"],["K","Tầm vận động chủ động và thụ động khớp vai","Dạng chủ động 80 độ, thụ động 85 độ, xoay ngoài chủ động và thụ động 20 độ, xoay trong tới mông. Hạn chế đồng đều cả hai.","e"],["K","Khám tim phổi, mạch, huyết áp hai tay","Nhịp đều, phổi trong, mạch quay hai tay đều, không dấu hiệu bệnh tim phổi.","e"],["K","Khám thần kinh chi trên và cột sống cổ","Cơ lực 5/5, cảm giác bình thường, Spurling âm tính.","n"]],"tests":[["X-quang khớp vai thẳng và nghiêng",15,"Không có tổn thương xương, loãng xương nhẹ vùng đầu xương cánh tay.","e"],["Siêu âm khớp vai",15,"Dày bao khớp, tràn dịch nhẹ bao hoạt dịch, gân chóp xoay không đứt hoàn toàn.","e"],["Đường huyết đói và HbA1c",20,"Đường huyết đói 7,4 mmol/L, HbA1c 7,2 phần trăm.","n"],["Điện tâm đồ",5,"Nhịp xoang, không có thay đổi thiếu máu cục bộ.","n"],["CT ngực có cản quang",40,"Không có chỉ định, không có dấu hiệu nghi ngờ u đỉnh phổi.","w"]],"opt":{"ydx":["+Viêm quanh khớp vai thể đông cứng (viêm bao khớp dính)","Rách chóp xoay hoàn toàn","Hội chứng cổ vai cánh tay do chèn ép rễ","Đau vai do bệnh tim thiếu máu cục bộ","Viêm khớp vai nhiễm khuẩn"],"bd":["+Kiên ngưng (Ngũ thập kiên)","Cảnh tý","Hạng cường","Thống phong","Hung tý"],"bc":["+Biểu – Thực – Hàn","Lý – Hư – Hàn","Lý – Thực – Nhiệt","Biểu – Thực – Nhiệt","Lý – Hư – Nhiệt"],"the":["+Phong hàn thấp tý","Khí trệ huyết ứ","Can thận hư","Thấp nhiệt tý","Đàm thấp trở lạc"],"phap":["+Khu phong tán hàn trừ thấp, thông kinh hoạt lạc","Bổ can thận","Thanh nhiệt lợi thấp","Hoạt huyết hóa ứ","Kiện tỳ hóa đàm"],"phuong":["+Quyên tý thang","Bạch hổ gia quế chi thang","Thân thống trục ứ thang","Lục vị địa hoàng hoàn","Bình vị tán"],"huyet":["+Kiên ngung","+Kiên liêu","+Kiên trinh","+Tý nhu","+Điều khẩu","Dũng tuyền","Thái khê","Quan nguyên","Thiên khu"]},"actions":["+Châm Kiên ngung, Tý nhu (Đại trường), Kiên liêu (Tam tiêu), Kiên trinh (Tiểu trường), Điều khẩu (Vị), kèm cứu hoặc đèn hồng ngoại|25|Khu hàn trừ thấp, thông kinh lạc vùng vai.","+Loại trừ đau vai do bệnh tim (ECG, đau ngực gắng sức), u đỉnh phổi, rách chóp xoay hoàn toàn, nhiễm khuẩn|5|Đau vai có thể là triệu chứng của bệnh nội tạng.","+Hướng dẫn tập vận động khớp vai từ từ (con lắc, leo tường) trong ngưỡng đau|5|Phục hồi tầm vận động, tránh dính khớp.","+Dặn kiểm soát đường huyết tốt|2|Đái tháo đường là yếu tố nguy cơ.","+Chườm ấm vùng vai trước khi tập|10|Hợp thể hàn thấp.","-Chụp CT ngực có cản quang|40|Không cần thiết.","!Bẻ, kéo mạnh khớp vai dưới gây mê hoặc không gây mê tại phòng châm|5|Nguy cơ gãy xương, rách cơ và chóp xoay, nhất là khi loãng xương.","!Châm sâu, kích thích mạnh khi chưa loại trừ đau vai do bệnh tim|3|Bỏ sót cơn đau thắt ngực, nhồi máu cơ tim."],"teach":"Hạn chế đồng đều tầm vận động cả chủ động và thụ động, đau đêm, tuổi 40 đến 60, đái tháo đường là điển hình viêm bao khớp dính, khác rách chóp xoay (chủ động hạn chế nhiều hơn thụ động). Thể phong hàn thấp tý: sợ lạnh, mạch phù khẩn. Luôn loại trừ đau vai do tim, phổi, cổ trước khi điều trị.","status":"draft"},{"id":"dau-nua-dau-can-duong-thuong-cang","title":"Đau nửa đầu từng cơn kèm buồn nôn, sợ ánh sáng","kind":"Thần kinh","level":"Trung bình","group":"cxk","place":"Phòng châm cứu","clock":"16:00","name":"Chị Vũ Thị Hồng","age":34,"sex":"nữ","intro":"Chị là nhân viên văn phòng, đến vì các cơn đau nửa đầu tái phát khoảng 1 năm nay, mấy tháng gần đây cơn dày hơn khi áp lực công việc.","vitals":{"hr":80,"sbp":118,"dbp":76,"rr":17,"t":36.7,"spo2":99},"ask":[["Đau đầu như thế nào, vị trí nào?","Đau nhói, giật theo nhịp mạch ở thái dương và hốc mắt một bên, thường bên trái, đôi khi đổi bên.","e"],["Mỗi cơn kéo dài bao lâu, bao nhiêu cơn mỗi tháng?","Mỗi cơn 6 đến 12 giờ, khoảng 3 đến 4 cơn mỗi tháng. Giữa các cơn hoàn toàn bình thường.","e"],["Có buồn nôn, sợ ánh sáng, sợ tiếng động, có báo trước không?","Buồn nôn, sợ ánh sáng, sợ tiếng ồn. Cơn thường kèm mờ mắt thoáng qua, thấy chớp sáng khoảng 20 phút trước đau.","e"],["Có yếu liệt, nói khó, lú lẫn, co giật không?","Không, hết chớp sáng thì nhìn rõ lại, không yếu liệt, không nói khó.","e"],["Đau đầu bất thường: dữ dội đột ngột, sốt cứng gáy, đau tăng khi ho hoặc nằm, mới xuất hiện sau 50 tuổi không?","Đau không dữ dội đột ngột, không sốt, không cứng gáy, không đau tăng khi ho. Đau bắt đầu từ năm 33 tuổi.","e"],["Yếu tố khởi phát?","Hay bùng phát khi tức giận, căng thẳng, thiếu ngủ, ăn đồ cay nóng, trước kỳ kinh.","e"],["Tính tình, miệng, giấc ngủ?","Hay cáu gắt, miệng đắng, họng khô, ngủ nông, hay mơ.","e"],["Đại tiểu tiện, kinh nguyệt?","Táo bón, nước tiểu vàng. Kinh nguyệt đều, hay đau đầu trước kỳ.","n"],["Thuốc đang dùng, có dùng thuốc tránh thai không?","Không dùng thuốc tránh thai. Uống ibuprofen khi đau, đỡ một phần.","n"],["Tiền sử gia đình?","Mẹ hay bị đau nửa đầu.","n"]],"exam":[["V","Thần sắc","Sắc mặt hơi đỏ, mắt đỏ nhẹ, vẻ mặt bực bội.","n"],["V","Lưỡi","Chất lưỡi đỏ, bờ lưỡi đỏ, rêu vàng mỏng.","e"],["M","Giọng nói, hơi thở","Tiếng nói to, hơi thở hơi nặng mùi.","n"],["T","Mạch","Mạch huyền sác.","e"],["T","Sờ vùng đầu cổ","Cơ thái dương, cơ chẩm trái co cứng, ấn đau điểm Phong trì và Thái dương.","n"],["K","Khám thần kinh sọ não","Đồng tử đều phản xạ tốt, thị trường bình thường, vận nhãn bình thường, cơ lực và cảm giác bình thường, không dấu hiệu thần kinh khu trú.","e"],["K","Dấu màng não, soi đáy mắt","Không cứng gáy, Kernig và Brudzinski âm tính. Đáy mắt: gai thị rõ bờ, không phù gai.","e"],["K","Huyết áp, khám tim mạch","Huyết áp 118/76 mmHg, tim phổi bình thường.","n"]],"tests":[["Công thức máu, tốc độ máu lắng, CRP",20,"Bình thường.","n"],["Soi đáy mắt",10,"Không phù gai thị.","e"],["Đo huyết áp 24 giờ",30,"Huyết áp trung bình bình thường.","n"],["CT sọ não không cản quang",20,"Không có tổn thương. Không cần chụp thường quy ở đau nửa đầu điển hình, không dấu cảnh báo.","w"],["Chụp mạch máu não (MRA, DSA)",60,"Không có chỉ định ở ca này.","w"]],"opt":{"ydx":["+Đau nửa đầu (migraine) có tiền triệu thị giác","Đau đầu căng thẳng","Đau đầu từng cụm","Xuất huyết dưới nhện","Viêm màng não"],"bd":["+Thiên đầu thống","Huyễn vựng","Trúng phong","Chân đầu thống","Đầu phong thống do ngoại cảm"],"bc":["+Lý – Thực – Nhiệt","Lý – Hư – Hàn","Biểu – Thực – Hàn","Biểu – Thực – Nhiệt","Lý – Hư – Nhiệt"],"the":["+Can dương thượng cang","Can uất khí trệ","Đàm thấp thượng nhiễu","Khí huyết hư","Phong hàn thượng phạm"],"phap":["+Bình can tiềm dương, tức phong chỉ thống","Sơ can giải uất","Hóa đàm trừ thấp","Bổ khí dưỡng huyết","Sơ phong tán hàn"],"phuong":["+Thiên ma câu đằng ẩm","Xuyên khung trà điều tán","Bán hạ bạch truật thiên ma thang","Bổ trung ích khí thang","Quy tỳ thang"],"huyet":["+Phong trì","+Thái dương","+Suất cốc","+Thái xung","+Hợp cốc","Túc tam lý","Quan nguyên","Thận du","Khí hải"]},"actions":["+Châm Phong trì, Suất cốc (Đởm), Thái dương (ngoài kinh), Thái xung (Can), Hợp cốc (Đại trường)|25|Bình can tiềm dương, thông lạc chỉ thống.","+Sàng lọc dấu hiệu cảnh báo đau đầu thứ phát: đột ngột dữ dội, sốt cứng gáy, dấu thần kinh khu trú, phù gai thị, khởi phát sau 50 tuổi|5|Loại trừ xuất huyết dưới nhện, viêm màng não, u não trước khi điều trị châm cứu.","+Hướng dẫn ghi nhật ký đau đầu, tránh yếu tố khởi phát (thiếu ngủ, rượu, thực phẩm cay nóng)|4|Dự phòng cơn.","+Dặn dùng thuốc cắt cơn đúng chỉ định, tránh lạm dụng giảm đau hằng ngày|3|Tránh đau đầu do lạm dụng thuốc.","+Dặn đến cấp cứu ngay nếu đau dữ dội đột ngột, yếu liệt, nói khó, sốt cứng gáy, co giật|2|Dấu hiệu nguy hiểm.","-Chụp CT sọ não thường quy|20|Không có dấu cảnh báo.","!Cho thuốc ôn bổ cay nóng (Phụ tử, Quế chi liều cao)|2|Can dương thượng cang, thuốc nhiệt làm dương cang thêm.","!Châm sâu, kích thích mạnh vùng cổ gáy khi chưa loại trừ nguyên nhân thực thể|4|Nguy cơ biến chứng, bỏ sót đau đầu thứ phát."],"teach":"Đau nửa đầu giật theo mạch, kèm buồn nôn, sợ ánh sáng, có tiền triệu thị giác và giữa cơn bình thường là migraine điển hình, thường không cần chẩn đoán hình ảnh. Thể can dương thượng cang: cáu gắt, miệng đắng, lưỡi đỏ rêu vàng mỏng, mạch huyền sác. Phải hỏi dấu hiệu cảnh báo (đau đột ngột dữ dội, sốt cứng gáy, dấu thần kinh khu trú, khởi phát sau 50 tuổi).","status":"draft"},{"id":"di-chung-tai-bien-khi-hu-huyet-u","title":"Liệt nửa người phải sau nhồi máu não 6 tuần","kind":"Thần kinh","level":"Khó","group":"cxk","place":"Phòng châm cứu","clock":"08:15","name":"Ông Đặng Văn Hòa","age":67,"sex":"nam","intro":"Ông được xuất viện sau nhồi máu não 6 tuần trước. Ông được người nhà đưa đến để châm cứu phục hồi vì yếu liệt nửa người phải, đi lại khó.","vitals":{"hr":78,"sbp":150,"dbp":90,"rr":18,"t":36.6,"spo2":97},"ask":[["Đợt đột quỵ xảy ra khi nào, điều trị thế nào?","Cách đây 6 tuần, đột ngột yếu tay chân phải, nói khó, nhập viện, chẩn đoán nhồi máu não, được điều trị nội khoa, ra viện sau 10 ngày.","e"],["Hiện nay yếu liệt ra sao?","Tay phải yếu nhiều, nhấc lên ngang vai khó, nắm tay yếu. Chân phải kéo lê khi đi, phải chống gậy.","e"],["Có đau đầu dữ dội, yếu nặng thêm đột ngột, nói khó hơn, nhìn đôi không?","Không có đợt nặng thêm nào từ khi ra viện. Nói đã rõ hơn, hơi chậm.","e"],["Có sặc khi ăn uống không?","Thỉnh thoảng sặc khi uống nước loãng.","e"],["Đang dùng thuốc gì, có tuân thủ không?","Uống thuốc chống kết tập tiểu cầu, statin và thuốc hạ áp theo toa bác sĩ, uống đều.","e"],["Tiền sử bệnh?","Tăng huyết áp 10 năm, rối loạn mỡ máu. Không đái tháo đường, không rung nhĩ biết trước.","e"],["Người có sợ lạnh, tay chân lạnh, mệt mỏi, khó thở khi gắng sức không?","Mệt mỏi, hay đoản hơi, tay chân phải lạnh, sợ lạnh, ra mồ hôi tự nhiên.","e"],["Tinh thần, giấc ngủ?","Hay buồn, chán nản, ngủ kém.","n"],["Ăn uống, đại tiểu tiện?","Ăn kém, táo bón, tiểu bình thường.","n"],["Có đau, sưng chân phải không?","Chân phải hơi phù nhẹ ở cổ chân, không đau.","n"]],"exam":[["V","Thần sắc, tư thế, dáng đi","Tinh thần tỉnh nhưng mệt, sắc mặt nhợt. Miệng hơi méo nhẹ sang trái, đi chống gậy, bước chân phải lê, tay phải gập co nhẹ.","e"],["V","Lưỡi","Chất lưỡi tím nhạt, có điểm ứ huyết, bệu, rêu trắng mỏng. Lưỡi lệch nhẹ sang phải.","e"],["M","Giọng nói, hơi thở","Tiếng nói yếu, hơi chậm, phát âm hơi nhão. Hơi thở ngắn.","n"],["T","Mạch","Mạch tế sáp, trầm nhược.","e"],["T","Sờ chi bên liệt","Tay chân phải lạnh hơn bên trái, cổ chân phải phù nhẹ không đau.","n"],["K","Cơ lực chi bên liệt","Cơ lực tay phải 3/5, chân phải 3+/5. Trương lực tăng nhẹ kiểu co cứng ở tay, phản xạ gân xương tăng bên phải, Babinski dương tính phải.","e"],["K","Huyết áp và tim mạch","Huyết áp 150/90 mmHg, nhịp tim đều 78 lần mỗi phút, không âm thổi.","e"],["K","Khám khớp vai bên liệt, nuốt","Khớp vai phải hơi trễ, không đau khi vận động nhẹ. Nghiệm pháp nuốt nước: sặc nhẹ.","e"]],"tests":[["CT hoặc MRI sọ não",30,"Ổ nhồi máu cũ vùng nhân bèo hạch nền và bao trong trái, không có chảy máu hay ổ nhồi máu mới.","e"],["Điện tâm đồ",5,"Nhịp xoang, không rung nhĩ.","e"],["Siêu âm Doppler động mạch cảnh và đốt sống",20,"Mảng xơ vữa động mạch cảnh trong hai bên, hẹp dưới 50 phần trăm.","n"],["Lipid máu, đường huyết, chức năng thận",30,"LDL-C 3,2 mmol/L, đường huyết bình thường, chức năng thận bình thường.","n"],["Chọc dò dịch não tủy",30,"Không có chỉ định ở ca này.","w"]],"opt":{"ydx":["+Di chứng liệt nửa người phải sau nhồi máu não, giai đoạn phục hồi","Tái phát đột quỵ cấp","Xuất huyết não","Hội chứng tủy cổ","Bệnh lý rễ thần kinh"],"bd":["+Bán thân bất toại (di chứng trúng phong)","Chứng nuy","Hạc tất phong","Huyễn vựng","Cảnh tý"],"bc":["+Lý – Hư kiêm Thực – Không hàn không nhiệt rõ","Biểu – Thực – Hàn","Lý – Thực – Nhiệt","Lý – Hư – Nhiệt","Biểu – Hư – Nhiệt"],"the":["+Khí hư huyết ứ","Phong đàm trở lạc","Can dương thượng cang","Can thận âm hư","Thấp nhiệt"],"phap":["+Bổ khí, hoạt huyết, thông kinh hoạt lạc","Bình can tiềm dương","Hóa đàm khai khiếu","Tư bổ can thận âm","Thanh nhiệt giải độc"],"phuong":["+Bổ dương hoàn ngũ thang","Thiên ma câu đằng ẩm","Địa hoàng ẩm tử","Trấn can tức phong thang","Độc hoạt tang ký sinh thang"],"huyet":["+Kiên ngung","+Khúc trì","+Hợp cốc","+Hoàn khiêu","+Dương lăng tuyền","+Túc tam lý","Nhân trung","Thập tuyên","Thần môn","Thiên khu"]},"actions":["+Hỏi và đo đạc dấu hiệu đột quỵ tái phát hoặc nặng thêm (đột ngột yếu thêm, đau đầu dữ dội, nói khó, nhìn đôi)|3|Phải đưa đi cấp cứu ngay nếu có, không châm.","+Kiểm tra huyết áp trước khi châm, nếu từ 180/110 mmHg trở lên thì hoãn châm và xử trí tăng huyết áp|3|Tránh làm tăng biến cố mạch máu não.","+Châm Kiên ngung, Khúc trì, Hợp cốc (Đại trường), Hoàn khiêu, Dương lăng tuyền (Đởm), Túc tam lý (Vị) bên liệt, kèm điện châm cường độ nhẹ|30|Bổ khí hoạt huyết, thông kinh lạc bên liệt.","+Phối hợp phục hồi chức năng: vận động trị liệu, ngôn ngữ trị liệu, đánh giá nuốt|10|Châm cứu là điều trị hỗ trợ.","+Dặn tiếp tục thuốc chống kết tập tiểu cầu, statin, hạ áp theo toa, kiểm soát huyết áp, tái khám chuyên khoa thần kinh|3|Dự phòng thứ phát.","+Hướng dẫn tư thế đặt khớp vai bên liệt, chống đỡ vai, đánh giá phòng ngừa huyết khối tĩnh mạch sâu|4|Giảm biến chứng vai trễ, huyết khối.","-Chọc dò dịch não tủy|30|Không có chỉ định.","!Ngừng thuốc chống kết tập tiểu cầu và hạ áp để thay bằng thuốc YHCT hoạt huyết mạnh|3|Tăng nguy cơ tái phát đột quỵ.","!Châm kích thích mạnh, điện châm cường độ cao khi huyết áp chưa kiểm soát|5|Nguy cơ tăng huyết áp, biến cố mạch máu não.","!Kéo giật mạnh khớp vai bên liệt khi tập thụ động|3|Gây tổn thương, đau vai bên liệt."],"teach":"Giai đoạn phục hồi sau nhồi máu não: ổn định, không có dấu hiệu thần kinh mới, cần đánh giá nuốt, huyết áp, vai bên liệt, huyết khối tĩnh mạch sâu. Thể khí hư huyết ứ: mệt, đoản hơi, lưỡi tím nhạt có điểm ứ, mạch tế sáp, dùng Bổ dương hoàn ngũ thang. Châm cứu chỉ hỗ trợ phục hồi chức năng và không thay thế thuốc dự phòng thứ phát bằng YHHĐ.","status":"draft"},{"id":"noi-tieu-hoa-001","title":"Đau bụng tái diễn kèm thay đổi thói quen đi tiêu","kind":"Nội","level":"Dễ","group":"noi","name":"Người bệnh mô phỏng N01","age":24,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Tại phòng khám Nội, người bệnh đến vì đau bụng và đi tiêu thất thường trong 8 tháng.","vitals":{"hr":76,"sbp":112,"dbp":72,"rr":16,"t":36.7,"spo2":99},"ask":[["Đau ở đâu và liên quan thế nào với đi tiêu?","Đau quanh rốn và bụng dưới, thường giảm sau đi tiêu.","e"],["Phân và số lần đi tiêu thay đổi ra sao?","Có tuần đi phân cứng cách ngày, có tuần đi phân mềm 2–3 lần/ngày; thường cảm giác đi chưa hết.","e"],["Có đầy bụng hoặc đau tăng sau ăn không?","Đầy bụng, đôi khi đau tăng sau bữa ăn.","e"],["Có đi cầu máu, sụt cân, sốt hoặc tiêu chảy đánh thức ban đêm không?","Không có các biểu hiện này; cân nặng ổn định.","e"],["Gia đình có ung thư đại trực tràng hoặc bệnh viêm ruột không?","Không ghi nhận ở người thân bậc một.","e"],["Triệu chứng liên quan căng thẳng hoặc kỳ kinh thế nào?","Thường tăng khi căng thẳng; không có mối liên quan rõ với kỳ kinh.","n"],["Đã dùng thuốc, kháng sinh hoặc thực phẩm bổ sung nào?","Chưa dùng thuốc thường xuyên, không dùng kháng sinh gần đây.","e"]],"exam":[["K","Toàn trạng","Tỉnh, thể trạng ổn định, không xanh xao hoặc mất nước.","e"],["K","Khám bụng","Bụng mềm, không phản ứng phúc mạc, không sờ thấy khối.","e"],["K","Tim và phổi","Tim đều, phổi không ran.","n"],["K","Đánh giá dấu báo động","Không hạch ngoại vi bất thường, không ghi nhận sụt cân qua các lần khám.","e"]],"tests":[["Công thức máu",10,"Hemoglobin 13,1 g/dL; bạch cầu 6,4 G/L; tiểu cầu 258 G/L.","e"],["CRP",10,"CRP 1,2 mg/L; giới hạn tham chiếu của phòng xét nghiệm dưới 5 mg/L.","e"],["Kháng thể tTG-IgA và IgA toàn phần",10,"tTG-IgA âm tính; IgA toàn phần trong giới hạn tham chiếu.","e"],["CT bụng thường quy để xác nhận hội chứng ruột kích thích",40,"Không thực hiện: chưa có dữ kiện đặt ra chỉ định trong tình huống này.","w"]],"opt":{"ydx":["+Hội chứng ruột kích thích","Bệnh Crohn","Ung thư đại trực tràng","Viêm ruột nhiễm khuẩn cấp"],"uu_tien":["+Kiểm tra dấu báo động và giải thích chẩn đoán dựa trên triệu chứng phù hợp","Chỉ định CT bụng cho mọi lần tái phát","Cho kháng sinh kéo dài dù chưa có bằng chứng nhiễm khuẩn","Khẳng định không bao giờ cần khám lại"],"sinh_ly_benh":["+Rối loạn tương tác ruột–não và tăng nhạy cảm nội tạng có thể góp phần gây triệu chứng","Luôn do loét đại tràng","Luôn do nhiễm khuẩn cần kháng sinh","Luôn do tắc ruột cơ học"]},"actions":["+Giải thích bệnh và thống nhất kế hoạch theo dõi|2|Giúp người bệnh hiểu triệu chứng và nhận biết khi nào cần đánh giá lại.","+Ghi nhật ký triệu chứng, bữa ăn và dạng phân|2|Hỗ trợ nhận diện yếu tố làm triệu chứng tăng.","+Điều chỉnh chế độ ăn và thuốc theo triệu chứng nổi trội|2|Không áp dụng cùng một biện pháp cho mọi kiểu rối loạn đi tiêu.","!Chỉ định nội soi định kỳ bất kể triệu chứng và dấu báo động|0|Không phải chiến lược thường quy cho tình huống đang mô tả."],"teach":"Đau bụng liên quan đi tiêu và thay đổi dạng phân cần được đánh giá cùng dấu báo động. Chẩn đoán phù hợp không đồng nghĩa bỏ theo dõi khi xuất hiện triệu chứng mới.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N01, nữ, 24 tuổi, sinh viên; khám ngoại trú lần đầu, không sử dụng thông tin định danh thật.","ly_do_vao_vien":"Đau bụng tái diễn và đi tiêu thất thường.","benh_su":"Triệu chứng kéo dài 8 tháng, đau bụng vài ngày mỗi tuần, thường giảm sau đi tiêu; kèm đầy bụng, thay đổi độ cứng của phân và cảm giác đi chưa hết. Không đi cầu máu, sốt, sụt cân hoặc tiêu chảy ban đêm.","tien_su":"Không ghi nhận bệnh mạn tính, phẫu thuật bụng hoặc tiền sử gia đình liên quan; chưa dùng thuốc thường xuyên.","luoc_qua_co_quan":"Không đau ngực, khó thở, tiểu buốt hoặc triệu chứng thần kinh mới.","kham_hien_tai":"Sinh hiệu ổn định; bụng mềm, không khối và không phản ứng phúc mạc.","can_lam_sang":"Công thức máu và CRP không bất thường; xét nghiệm sàng lọc bệnh celiac âm tính trong bối cảnh IgA toàn phần bình thường.","tom_tat":"Nữ 24 tuổi có triệu chứng tiêu hóa mạn tính liên quan đi tiêu, thay đổi dạng phân, không dấu báo động và chưa có bằng chứng viêm.","dat_van_de":"Đau bụng mạn tính liên quan đi tiêu; thay đổi thói quen đại tiện; đánh giá dấu báo động.","chan_doan_so_bo":"Hội chứng ruột kích thích.","bien_luan":"Kiểu triệu chứng phù hợp với rối loạn chức năng ruột. Không có dấu báo động và các xét nghiệm ban đầu không gợi ý thiếu máu hoặc viêm; vẫn cần đánh giá lại nếu diễn tiến thay đổi.","sinh_ly_benh":"Tương tác ruột–não, vận động ruột và cảm nhận đau nội tạng có thể thay đổi mà không có tổn thương cấu trúc tương ứng.","chan_doan_phan_biet":"Bệnh celiac, bệnh viêm ruột, tác dụng thuốc và bệnh phụ khoa tùy diễn tiến.","chan_doan_xac_dinh":"Hội chứng ruột kích thích trong tình huống mô phỏng.","dieu_tri":"Giải thích bệnh, điều chỉnh lối sống và chế độ ăn; lựa chọn thuốc theo triệu chứng nổi trội sau đánh giá lâm sàng.","tien_luong":"Có thể tái diễn; cần theo dõi tác động lên sinh hoạt.","du_phong":"Hướng dẫn tái khám khi xuất hiện đi cầu máu, sụt cân, sốt hoặc triệu chứng ban đêm."},"nguon":["NICE CG61, Irritable bowel syndrome in adults: diagnosis and management, 2008, cập nhật 2017. https://www.nice.org.uk/guidance/cg61/chapter/Recommendations"],"status":"nhap"},{"id":"noi-tieu-hoa-002","title":"Đau thượng vị tái diễn ở người bệnh có loét tá tràng","kind":"Nội","level":"Dễ","group":"noi","name":"Người bệnh mô phỏng N02","age":37,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh khám Nội vì đau thượng vị tái diễn trong 6 tuần, chưa có dấu xuất huyết.","vitals":{"hr":80,"sbp":118,"dbp":76,"rr":17,"t":36.6,"spo2":98},"ask":[["Đau có tính chất và thời điểm thế nào?","Đau âm ỉ hoặc nóng rát thượng vị, đôi khi lúc đói và ban đêm.","e"],["Có nôn máu hoặc đi phân đen không?","Không nôn máu, phân không đen.","e"],["Có sụt cân, nuốt nghẹn hoặc nôn kéo dài không?","Không có các triệu chứng này.","e"],["Có dùng thuốc giảm đau chống viêm hoặc aspirin không?","Không dùng gần đây.","e"],["Đã điều trị H. pylori hoặc dùng kháng sinh nào chưa?","Chưa điều trị H. pylori; không nhớ đầy đủ các đợt kháng sinh trước đây.","e"],["Có dị ứng thuốc không?","Không ghi nhận dị ứng thuốc.","e"],["Có hút thuốc không?","Hút khoảng 5 điếu/ngày.","n"]],"exam":[["K","Toàn trạng","Tỉnh, da niêm hồng, không dấu mất nước.","e"],["K","Khám bụng","Ấn đau nhẹ thượng vị; bụng mềm, không đề kháng hoặc co cứng.","e"],["K","Tim và phổi","Không ghi nhận bất thường.","n"],["K","Dấu biến chứng","Không dấu giảm tưới máu hoặc phản ứng phúc mạc.","e"]],"tests":[["Nội soi tiêu hóa trên",20,"Ổ loét hành tá tràng 7 mm, đáy sạch, không chảy máu.","e"],["Xét nghiệm urease nhanh từ mẫu sinh thiết dạ dày",10,"Dương tính với H. pylori.","e"],["Công thức máu",10,"Hemoglobin 14,2 g/dL, không thiếu máu.","n"],["CT bụng để xác nhận H. pylori",40,"Không thực hiện: không phù hợp mục đích chẩn đoán H. pylori.","w"]],"opt":{"ydx":["+Loét tá tràng có nhiễm H. pylori, chưa có biến chứng","Viêm tụy cấp","Tắc ruột cơ học","Viêm túi mật cấp"],"uu_tien":["+Điều trị tiệt trừ H. pylori bằng phác đồ phù hợp và lên kế hoạch kiểm tra kết quả","Chỉ giảm đau rồi bỏ theo dõi","Dùng phác đồ clarithromycin kinh nghiệm bất kể kháng thuốc","Mổ cấp cứu dù không có biến chứng"],"kiem_tra_tiet_tru":["+Test hơi thở ure hoặc kháng nguyên phân sau điều trị, với thời gian ngừng thuốc phù hợp","Dùng kháng thể huyết thanh để xác nhận đã tiệt trừ","Chỉ dựa vào hết đau","Kiểm tra ngay ngày cuối dùng kháng sinh"]},"actions":["+Rà tiền sử kháng sinh, dị ứng và khả năng tuân thủ|2|Các yếu tố này ảnh hưởng lựa chọn phác đồ.","+Lựa chọn phác đồ tiệt trừ phù hợp dữ liệu kháng thuốc và hướng dẫn địa phương|2|Không sao chép máy móc một phác đồ cho mọi người bệnh.","+Hẹn kiểm tra tiệt trừ ít nhất 4 tuần sau kháng sinh và ngừng PPI 2 tuần trước xét nghiệm theo hướng dẫn|2|Giảm nguy cơ kết quả âm tính giả.","!Dùng kháng thể H. pylori huyết thanh làm bằng chứng chắc chắn đã khỏi|0|Kháng thể có thể tồn tại sau khi đã tiệt trừ."],"teach":"Loét và nhiễm H. pylori phải được chứng minh bằng dữ kiện phù hợp. Hết triệu chứng không thay thế xét nghiệm xác nhận tiệt trừ.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N02, nam, 37 tuổi, nhân viên văn phòng; khám ngoại trú.","ly_do_vao_vien":"Đau thượng vị tái diễn.","benh_su":"Đau 6 tuần, đôi khi lúc đói hoặc ban đêm; chưa ghi nhận nôn máu, phân đen, nôn kéo dài, nuốt nghẹn hoặc sụt cân.","tien_su":"Chưa điều trị H. pylori; không dùng NSAID gần đây; có hút thuốc; tiền sử kháng sinh cần khai thác bổ sung.","luoc_qua_co_quan":"Không đau ngực, khó thở hoặc rối loạn đại tiện mới.","kham_hien_tai":"Sinh hiệu ổn định, đau nhẹ thượng vị, không dấu viêm phúc mạc.","can_lam_sang":"Nội soi có loét hành tá tràng đáy sạch; urease nhanh dương tính; không thiếu máu.","tom_tat":"Nam 37 tuổi đau thượng vị, nội soi xác nhận loét tá tràng và xét nghiệm xác nhận H. pylori, chưa có dấu biến chứng.","dat_van_de":"Loét tá tràng; nhiễm H. pylori; lựa chọn phác đồ và xác nhận tiệt trừ.","chan_doan_so_bo":"Bệnh loét dạ dày–tá tràng.","bien_luan":"Chẩn đoán xác định dựa trên nội soi và xét nghiệm H. pylori; tính chất đau riêng lẻ không đủ xác định vị trí loét.","sinh_ly_benh":"Viêm niêm mạc liên quan H. pylori làm thay đổi cân bằng giữa yếu tố gây tổn thương và bảo vệ, góp phần hình thành loét.","chan_doan_phan_biet":"Khó tiêu chức năng, trào ngược dạ dày–thực quản và bệnh đường mật.","chan_doan_xac_dinh":"Loét tá tràng có nhiễm H. pylori, chưa có biến chứng.","dieu_tri":"Tiệt trừ H. pylori và điều trị giảm tiết acid; chọn phác đồ theo tiền sử dùng thuốc, khả năng cung ứng và hướng dẫn phù hợp Việt Nam.","tien_luong":"Thường thuận lợi nếu điều trị hiệu quả; tái đánh giá nếu triệu chứng kéo dài.","du_phong":"Ngừng hút thuốc, tránh tự dùng NSAID và kiểm tra tiệt trừ."},"nguon":["ACG Clinical Guideline: Treatment of Helicobacter pylori Infection, 2024; bản tóm lược chính thức của ACG. https://gi.org/journals-publications/ebgi/schoenfeld_sep2024/"],"status":"nhap"},{"id":"noi-tieu-hoa-003","title":"Đau thượng vị cấp lan ra sau lưng","kind":"Nội","level":"Trung bình","group":"noi","name":"Người bệnh mô phỏng N03","age":46,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh đến cấp cứu vì đau thượng vị dữ dội 10 giờ, kèm nôn.","vitals":{"hr":104,"sbp":108,"dbp":68,"rr":22,"t":37.8,"spo2":97},"ask":[["Đau khởi phát và lan thế nào?","Đau thượng vị liên tục, lan ra sau lưng, mức độ 8/10.","e"],["Có nôn, nôn xong có giảm đau không?","Nôn 4 lần, đau không giảm sau nôn.","e"],["Có đau ngực, khó thở hoặc vã mồ hôi không?","Không đau ngực, hơi mệt, không khó thở rõ.","e"],["Có tiền sử sỏi mật hoặc vàng da không?","Chưa ghi nhận sỏi mật; không vàng da trước đợt này.","e"],["Uống rượu bia thế nào?","Uống nhiều năm; gần đây uống lượng lớn trước khi xuất hiện triệu chứng.","e"],["Còn trung tiện và đi tiêu không?","Vẫn trung tiện; lần đi tiêu cuối vào sáng cùng ngày.","e"],["Có bệnh tim, bệnh thận hoặc dùng thuốc mới không?","Chưa ghi nhận bệnh tim, thận; không dùng thuốc mới.","e"]],"exam":[["K","Toàn trạng và tưới máu","Tỉnh, môi hơi khô, đầu chi ấm, thời gian làm đầy mao mạch khoảng 2 giây.","e"],["K","Khám bụng","Ấn đau thượng vị, chướng nhẹ, không co cứng thành bụng.","e"],["K","Tim và phổi","Tim nhanh đều, phổi chưa có ran.","e"],["K","Da và củng mạc","Không vàng da; không bầm quanh rốn hoặc hai hông.","n"]],"tests":[["Lipase máu",10,"Lipase 780 U/L; giới hạn trên của phòng xét nghiệm 60 U/L.","e"],["Chức năng thận, điện giải và công thức máu",10,"Creatinin 94 µmol/L; kali 3,4 mmol/L; hematocrit 45%.","e"],["Siêu âm bụng, xét nghiệm gan mật và triglycerid",15,"Không thấy sỏi túi mật hoặc giãn đường mật; triglycerid 1,9 mmol/L; bilirubin không tăng.","e"],["ECG và troponin độ nhạy cao theo quy trình cấp cứu",3,"ECG không có biến đổi thiếu máu cơ tim; troponin nối tiếp không tăng theo ngưỡng phòng xét nghiệm.","e"],["CT bụng có cản quang thường quy ngay để phân độ mọi ca",40,"Không thực hiện ngay: chẩn đoán đã có dữ kiện phù hợp; đánh giá lại chỉ định theo diễn tiến.","w"]],"opt":{"ydx":["+Viêm tụy cấp; nghĩ nguyên nhân liên quan rượu","Hội chứng ruột kích thích","Viêm bàng quang cấp","Loét tá tràng chưa biến chứng"],"tieu_chuan":["+Có ít nhất hai trong ba: đau phù hợp, men tụy tăng trên ba lần giới hạn trên, hình ảnh phù hợp","Chỉ cần có tiền sử uống rượu","Bắt buộc CT dương tính ở mọi trường hợp","Chỉ cần có nôn"],"uu_tien":["+Điều trị hỗ trợ, theo dõi tưới máu và đánh giá lại nguy cơ suy tạng","Kháng sinh dự phòng cho mọi trường hợp","CT lặp lại hằng ngày bất kể diễn tiến","Cho về ngay vì không vàng da"]},"actions":["++Bù dịch đẳng trương có đánh giá lại theo đáp ứng|2|Tránh cả thiếu dịch và quá tải.","++Giảm đau và theo dõi sinh hiệu, lượng nước tiểu, chức năng thận|2|Phát hiện diễn tiến xấu.","+Đánh giá khả năng ăn đường miệng sớm theo dung nạp|2|Không mặc định nhịn ăn kéo dài.","!Khẳng định mức độ nhẹ ngay khi nhập viện và ngừng theo dõi|0|Phân loại mức độ cần đánh giá suy tạng, biến chứng và diễn tiến."],"teach":"Đau phù hợp và lipase tăng rõ có thể đủ xác định viêm tụy cấp mà chưa cần CT thường quy. Chẩn đoán bệnh, xác định nguyên nhân và đánh giá mức độ nặng là ba nhiệm vụ khác nhau.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N03, nam, 46 tuổi, lao động tự do; tiếp nhận tại cấp cứu.","ly_do_vao_vien":"Đau thượng vị dữ dội kèm nôn.","benh_su":"Đau liên tục 10 giờ, lan sau lưng, nôn nhiều và không giảm đau sau nôn. Chưa có vàng da hoặc xuất huyết tiêu hóa.","tien_su":"Uống rượu kéo dài; chưa ghi nhận sỏi mật, bệnh tim hoặc bệnh thận.","luoc_qua_co_quan":"Không tiểu buốt, không ho; vẫn trung tiện.","kham_hien_tai":"Nhịp tim nhanh, niêm hơi khô, đau thượng vị; chưa có dấu viêm phúc mạc hoặc giảm oxy máu.","can_lam_sang":"Lipase tăng trên ba lần giới hạn trên; siêu âm chưa thấy sỏi; ECG và troponin nối tiếp không gợi ý tổn thương cơ tim trong đánh giá này.","tom_tat":"Nam 46 tuổi đau thượng vị cấp lan lưng, nôn, men tụy tăng rõ; có tiền sử rượu, cần điều trị và theo dõi diễn tiến.","dat_van_de":"Viêm tụy cấp; thiếu dịch có thể có; tìm nguyên nhân; đánh giá suy tạng.","chan_doan_so_bo":"Viêm tụy cấp.","bien_luan":"Dữ kiện đau và men tụy đủ hỗ trợ chẩn đoán. Rượu là hướng nguyên nhân, không phải kết luận chỉ dựa vào một bữa uống.","sinh_ly_benh":"Tổn thương tụy gây viêm; đáp ứng viêm và dịch thoát khỏi lòng mạch có thể ảnh hưởng tuần hoàn và chức năng cơ quan.","chan_doan_phan_biet":"Hội chứng vành cấp, thủng tạng rỗng, bệnh đường mật và thiếu máu ruột tùy dấu hiệu.","chan_doan_xac_dinh":"Viêm tụy cấp; nguyên nhân và mức độ cần tiếp tục đánh giá.","dieu_tri":"Điều trị hỗ trợ, theo dõi sát và đánh giá lại; khảo sát hình ảnh bổ sung khi có chỉ định.","tien_luong":"Phụ thuộc diễn tiến suy tạng và biến chứng.","du_phong":"Can thiệp ngừng rượu, xử lý nguyên nhân được xác định và hẹn theo dõi."},"nguon":["American College of Gastroenterology Guidelines: Management of Acute Pancreatitis, 2024. https://pmc.ncbi.nlm.nih.gov/articles/PMC13221274/"],"status":"nhap"},{"id":"noi-tieu-hoa-004","title":"Nôn máu và phân đen sau dùng thuốc giảm đau","kind":"Nội","level":"Khó","group":"noi","name":"Người bệnh mô phỏng N04","age":68,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh đến cấp cứu vì nôn máu, đi phân đen và choáng khi đứng.","vitals":{"hr":118,"sbp":88,"dbp":54,"rr":24,"t":36.5,"spo2":97},"ask":[["Nôn và phân có đặc điểm gì?","Nôn máu đỏ sẫm hai lần, đi phân đen dính trong một ngày.","e"],["Có ngất, đau ngực hoặc khó thở không?","Chóng mặt nhiều khi đứng, chưa ngất; không đau ngực.","e"],["Có dùng NSAID, aspirin hoặc thuốc chống đông không?","Tự dùng diclofenac khoảng 10 ngày vì đau gối; không dùng chống đông.","e"],["Có tiền sử xơ gan hoặc xuất huyết tiêu hóa không?","Không ghi nhận xơ gan; chưa từng xuất huyết tiêu hóa.","e"],["Lần ăn uống gần nhất và thời điểm chảy máu?","Ăn lần cuối 6 giờ trước; nôn máu lần đầu 3 giờ trước.","e"],["Có dị ứng hoặc bệnh tim, thận không?","Không ghi nhận dị ứng; có tăng huyết áp, chưa ghi nhận suy tim hoặc bệnh thận.","e"]],"exam":[["K","Đường thở và tri giác","Tỉnh nhưng mệt, hiện tự bảo vệ đường thở; cần đánh giá lại nếu nôn máu tiếp.","e"],["K","Tuần hoàn","Da niêm nhợt, chi mát, mạch nhanh, thời gian làm đầy mao mạch 3 giây.","e"],["K","Khám bụng","Đau nhẹ thượng vị, không co cứng hoặc đề kháng.","e"],["K","Đánh giá phân sau giải thích và đồng thuận","Phân đen dạng hắc ín.","e"]],"tests":[["Công thức máu và theo dõi lại",10,"Hemoglobin 7,4 g/dL; tiểu cầu 220 G/L.","e"],["Nhóm máu và xét nghiệm tương hợp",10,"Đã lấy mẫu, chuẩn bị phương án truyền máu theo tình trạng lâm sàng.","e"],["Chức năng thận, điện giải và đông máu",10,"Ure 13 mmol/L; creatinin 96 µmol/L; INR 1,1.","e"],["Nội soi sau hồi sức ban đầu",20,"Loét hành tá tràng có mạch máu lộ, không thấy giãn tĩnh mạch thực quản.","e"],["Xét nghiệm máu ẩn trong phân để xác nhận chảy máu đã rõ",10,"Không thực hiện: đã có nôn máu và phân đen rõ.","w"]],"opt":{"ydx":["+Xuất huyết tiêu hóa trên do loét tá tràng, kèm dấu giảm tưới máu","Hội chứng ruột kích thích","Viêm ruột nhiễm khuẩn không biến chứng","Trĩ không biến chứng"],"uu_tien":["+Đánh giá ABC, hồi sức tuần hoàn và huy động đội nội soi","Đợi nội soi rồi mới thiết lập đường truyền","Cho ăn ngay để giảm đau","Cho về vì SpO2 còn bình thường"],"noi_soi":["+Thực hiện sau hồi sức ban đầu, với mức khẩn phù hợp tình trạng người bệnh","Nội soi trước mọi đánh giá đường thở và tuần hoàn","Hoãn nhiều ngày dù huyết động không ổn","Không cần nội soi vì đã biết có dùng NSAID"]},"actions":["++Thiết lập đường truyền, lấy xét nghiệm và chuẩn bị máu|2|Điều trị cấp cứu không chờ hoàn tất toàn bộ chẩn đoán.","++Quyết định truyền máu theo huyết động, mất máu tiếp diễn và bệnh kèm|2|Không chỉ dựa vào một giá trị hemoglobin.","+Cầm máu nội soi và điều trị sau nội soi theo tổn thương|2|Mạch máu lộ là dấu cần xử trí phù hợp.","!Tiếp tục diclofenac vì đau gối|0|Cần ngừng và rà thuốc làm tăng nguy cơ xuất huyết."],"teach":"SpO2 bình thường không loại trừ giảm tưới máu do mất máu. Phải hồi sức và đánh giá nguy cơ đồng thời với chuẩn bị chẩn đoán, cầm máu.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N04, nữ, 68 tuổi, nghỉ hưu; tiếp nhận tại cấp cứu.","ly_do_vao_vien":"Nôn máu, phân đen và chóng mặt.","benh_su":"Phân đen một ngày, nôn máu hai lần và choáng khi đứng; xuất hiện sau đợt tự dùng diclofenac.","tien_su":"Tăng huyết áp; không ghi nhận xơ gan, xuất huyết trước đây hoặc dùng chống đông.","luoc_qua_co_quan":"Không đau ngực, chưa ngất; chưa có dữ kiện thần kinh khu trú.","kham_hien_tai":"Huyết áp thấp, nhịp tim nhanh, chi mát và da niêm nhợt; bụng không phản ứng phúc mạc.","can_lam_sang":"Thiếu máu; nội soi sau hồi sức xác định loét tá tràng có mạch máu lộ.","tom_tat":"Nữ 68 tuổi xuất huyết tiêu hóa trên rõ, huyết động không ổn, có sử dụng NSAID; cần hồi sức và cầm máu.","dat_van_de":"Chảy máu tiêu hóa cấp; giảm tưới máu; thiếu máu; thuốc liên quan.","chan_doan_so_bo":"Xuất huyết tiêu hóa trên, nghĩ do loét dạ dày–tá tràng.","bien_luan":"Nôn máu và phân đen định hướng nguồn chảy máu trên; nội soi xác định tổn thương, không kết luận nguyên nhân chỉ từ tiền sử thuốc.","sinh_ly_benh":"Mất máu làm giảm thể tích tuần hoàn và khả năng vận chuyển oxy, gây đáp ứng nhịp tim nhanh và giảm tưới máu.","chan_doan_phan_biet":"Xuất huyết do giãn tĩnh mạch, rách Mallory–Weiss, tổn thương dạ dày và tổn thương mạch.","chan_doan_xac_dinh":"Xuất huyết tiêu hóa trên do loét tá tràng có mạch máu lộ.","dieu_tri":"Hồi sức, truyền máu khi phù hợp, cầm máu nội soi và điều trị giảm tiết acid sau nội soi; khảo sát H. pylori.","tien_luong":"Dè dặt ban đầu, theo dõi tái xuất huyết.","du_phong":"Rà thuốc, tránh tự dùng NSAID và xử lý H. pylori nếu được xác nhận."},"nguon":["NICE CG141, Acute upper gastrointestinal bleeding in over 16s: management, 2012, cập nhật 2016. https://www.nice.org.uk/guidance/cg141"],"status":"nhap"},{"id":"noi-tieu-hoa-005","title":"Sốt và đau bụng ở người bệnh xơ gan có cổ trướng","kind":"Nội","level":"Khó","group":"noi","name":"Người bệnh mô phỏng N05","age":59,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Người bệnh xơ gan có cổ trướng đến viện vì sốt, đau bụng và lượng nước tiểu giảm.","vitals":{"hr":110,"sbp":94,"dbp":60,"rr":22,"t":38.4,"spo2":96},"ask":[["Sốt và đau bụng bắt đầu khi nào?","Sốt một ngày, đau âm ỉ khắp bụng, ăn kém.","e"],["Có tiểu ít hoặc lú lẫn không?","Tiểu ít hơn thường ngày; gia đình chưa ghi nhận lú lẫn.","e"],["Xơ gan do nguyên nhân gì, đã có biến chứng nào?","Xơ gan liên quan viêm gan B; có cổ trướng; chưa từng được chẩn đoán nhiễm trùng dịch báng.","e"],["Đang dùng thuốc gì?","Có thuốc kháng virus và lợi tiểu; cần đối chiếu tên, liều trong đơn.","e"],["Có nôn máu, phân đen hoặc tiêu chảy không?","Không có các triệu chứng này.","e"],["Gần đây có nhập viện hoặc dùng kháng sinh không?","Không nhập viện hoặc dùng kháng sinh trong 3 tháng gần đây.","e"],["Đã tăng cân hoặc bụng to nhanh không?","Bụng to hơn trong một tuần.","n"]],"exam":[["K","Tri giác và tuần hoàn","Tỉnh, mệt, chi hơi mát, không dấu thần kinh khu trú.","e"],["K","Khám bụng","Bụng báng, đau nhẹ lan tỏa, không co cứng hoặc điểm đau khu trú rõ.","e"],["K","Dấu bệnh gan","Củng mạc vàng nhẹ, phù hai cổ chân.","e"],["K","Tim và phổi","Tim nhanh đều, phổi chưa có ran.","e"]],"tests":[["Chọc dịch báng chẩn đoán: đếm tế bào và cấy",20,"Bạch cầu đa nhân trung tính 620 tế bào/mm³; cấy đang chờ.","e"],["Chức năng thận, điện giải và xét nghiệm gan",10,"Creatinin 142 µmol/L, so với 88 µmol/L một tuần trước; natri 130 mmol/L; bilirubin 62 µmol/L.","e"],["Cấy máu trước kháng sinh nếu không làm chậm điều trị",10,"Đã lấy mẫu; kết quả đang chờ.","e"],["Siêu âm bụng",15,"Gan hình thái xơ, có dịch báng; chưa ghi nhận bất thường khu trú giải thích đau.","e"],["Chờ cấy dịch báng dương tính mới điều trị",10,"Không phù hợp: kết quả tế bào và bệnh cảnh đã đặt ra chỉ định điều trị.","w"]],"opt":{"ydx":["+Nhiễm trùng dịch báng tự phát trên nền xơ gan; kèm tổn thương thận cấp cần đánh giá","Hội chứng ruột kích thích","Viêm dạ dày đơn thuần","Cổ trướng ổn định không có biến chứng"],"uu_tien":["+Điều trị kháng sinh sớm sau lấy mẫu phù hợp và theo dõi huyết động, chức năng thận","Chờ cấy dương tính dù người bệnh đang xấu đi","Tăng lợi tiểu ngay vì bụng còn báng","Cho xuất viện vì bụng không co cứng"],"phan_biet":["+Tiếp tục đánh giá viêm phúc mạc thứ phát khi có dấu gợi ý hoặc đáp ứng điều trị kém","Loại trừ mọi nguyên nhân ngoại khoa chỉ vì không co cứng","Khẳng định hội chứng gan–thận ngay từ một xét nghiệm creatinin","Khẳng định nhiễm trùng dịch báng không thể xảy ra nếu chưa từng mắc"]},"actions":["++Khởi trị kháng sinh theo bối cảnh nhiễm trùng và dữ liệu kháng thuốc địa phương|2|Không chờ cấy khi đã có chỉ định.","++Đánh giá sử dụng albumin theo hướng dẫn và nguy cơ thận|2|Cần phối hợp theo dõi đáp ứng và nguy cơ quá tải.","+Rà lợi tiểu, thuốc ảnh hưởng thận và nguyên nhân tổn thương thận cấp|2|Không mặc định mọi tăng creatinin là hội chứng gan–thận.","!Tự tăng lợi tiểu trong khi huyết áp thấp và chức năng thận xấu đi|0|Có thể làm giảm thể tích tuần hoàn hiệu dụng."],"teach":"Ở người bệnh xơ gan có cổ trướng, sốt hoặc suy thận cần nghĩ đến nhiễm trùng dịch báng. Tổn thương thận phải được đánh giá nguyên nhân trước khi kết luận hội chứng gan–thận.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N05, nam, 59 tuổi, buôn bán; nhập cấp cứu.","ly_do_vao_vien":"Sốt và đau bụng trên nền cổ trướng.","benh_su":"Sốt một ngày, đau bụng lan tỏa, ăn kém và tiểu ít; bụng tăng kích thước trong tuần trước.","tien_su":"Xơ gan liên quan viêm gan B, đang điều trị; cổ trướng, chưa có đợt nhiễm trùng dịch báng được ghi nhận.","luoc_qua_co_quan":"Không xuất huyết tiêu hóa; chưa lú lẫn; chưa có triệu chứng hô hấp rõ.","kham_hien_tai":"Sốt, nhịp tim nhanh, huyết áp thấp tương đối; bụng báng đau lan tỏa, vàng mắt nhẹ và phù chân.","can_lam_sang":"PMN dịch báng 620 tế bào/mm³; creatinin tăng so với nền; cấy đang chờ.","tom_tat":"Nam 59 tuổi xơ gan có cổ trướng, sốt và đau bụng, PMN dịch báng tăng, kèm suy giảm chức năng thận cấp.","dat_van_de":"Nhiễm trùng dịch báng; bất ổn tuần hoàn; tổn thương thận cấp; loại trừ ổ nhiễm thứ phát.","chan_doan_so_bo":"Nghi nhiễm trùng dịch báng tự phát.","bien_luan":"PMN dịch báng vượt ngưỡng 250 tế bào/mm³ hỗ trợ chẩn đoán và điều trị khi chưa có bằng chứng nguồn nhiễm trong ổ bụng cần can thiệp.","sinh_ly_benh":"Xơ gan làm tăng tính dễ nhiễm trùng; rối loạn tuần hoàn có thể giảm tưới máu thận, nặng thêm khi có nhiễm trùng.","chan_doan_phan_biet":"Viêm phúc mạc thứ phát, nhiễm trùng khác, giảm thể tích và tổn thương thận do thuốc.","chan_doan_xac_dinh":"Nhiễm trùng dịch báng tự phát trong tình huống mô phỏng; tổn thương thận cấp chưa kết luận cơ chế.","dieu_tri":"Kháng sinh sớm, đánh giá albumin, rà thuốc và theo dõi đáp ứng; khảo sát thêm khi nghi nguồn nhiễm thứ phát.","tien_luong":"Dè dặt do có tổn thương thận.","du_phong":"Sau ổn định, đánh giá dự phòng tái phát và quản lý xơ gan theo chuyên khoa."},"nguon":["AASLD Practice Guidance: Diagnosis, Evaluation, and Management of Ascites, Spontaneous Bacterial Peritonitis and Hepatorenal Syndrome, 2021. DOI: 10.1002/hep.31884. https://onlinelibrary.wiley.com/doi/full/10.1002/hep.31884"],"status":"nhap"}];
const MODERN_SECS = BANK_SECS.filter(x=>x[0]!=="yhct"&&x[0]!=="pp");
const GROUPS = {capcuu:"Cấp cứu",noi:"Nội",ngoai:"Ngoại",cxk:"Cơ xương khớp, thần kinh",sannhi:"Sản, Nhi",phuctap:"Phức tạp"};
const uniq = a=>[...new Set(a)];
const rint=(n)=>Math.floor(Math.random()*n);
const shuf=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rint(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick3=a=>shuf(a).slice(0,3);
const parseAct=s=>{ const m=String(s).match(/^(\+\+|\+|-|!)(.*)$/); const p=m[2].split("|"); return {k:m[1],text:p[0].trim(),why:(p[2]||"").trim()}; };
const firstSent=t=>{ const m=String(t).match(/^.{40,200}?[.!?](\s|$)/); return (m?m[0]:String(t).slice(0,180)).trim(); };
const TYPE_LABEL={V:"Vọng",M:"Văn",T:"Thiết",K:"Khám thực thể"};
const TYPE_LABEL_TAY={V:"Quan sát",M:"Nghe, ngửi",T:"Sờ, bắt mạch",K:"Khám thực thể"};
const TRACKS={noi:"Nội",ngoai:"Ngoại",yhct:"Y học cổ truyền"};
const TRACK_NOTE={noi:"Chỉ bệnh án y học hiện đại.",ngoai:"Chỉ bệnh án y học hiện đại.",yhct:"Đông y và Tây y kết hợp trong cùng một bệnh án."};
/* Mục của ca: ca có phần biện chứng YHCT (bệnh danh) là ca Đông – Tây y; ca chỉ có chẩn đoán Tây y thuộc Nội hoặc Ngoại. */
const trackOf=c=>(c.opt&&c.opt.bd)?"yhct":((c.group==="ngoai"||c.id==="thai-ngoai-tu-cung-vo")?"ngoai":"noi");
const tch=c=>trackOf(c)==="yhct"?c.teach:c.teach.split(/(?<=[.!?])\s+/).filter(x=>!/YHCT|y học cổ truyền|Đông y/i.test(x)).join(" ");
const lab=(c,t)=>(trackOf(c)==="yhct"?TYPE_LABEL:TYPE_LABEL_TAY)[t]||"";
function numWrongs(v,steps,fmt,floor=1){ const out=[]; for(const d of shuf(steps)){ const x=v+d; if(x>=floor && fmt(x)!==fmt(v) && !out.includes(fmt(x))) out.push(fmt(x)); if(out.length>=3) break; } return out; }

function mkPool(c){
  const P=[]; const others=BANK.filter(x=>x.id!==c.id);
  const add=(id,sec,q,correct,wrongs,e)=>{ wrongs=uniq(wrongs.filter(w=>w&&w!==correct)); if(!correct||wrongs.length<3) return; P.push({id:c.id+":"+id,sec,q,o:[correct,...pick3(wrongs)],e:e||""}); };
  const v=c.vitals, vit=`mạch ${v.hr}, HA ${v.sbp}/${v.dbp}, nhịp thở ${v.rr}, SpO₂ ${v.spo2}%, nhiệt độ ${v.t} °C`;
  add("age","doc","Bệnh nhân bao nhiêu tuổi?",`${c.age} tuổi`,numWrongs(c.age,[-30,-20,-12,-8,-5,-3,3,5,8,12,20,30],x=>x+" tuổi"),"Hành chính: "+c.name+", "+c.age+" tuổi.");
  add("hr","doc","Mạch lúc vào là bao nhiêu?",`${v.hr} lần/phút`,numWrongs(v.hr,[-30,-20,-12,12,20,30],x=>x+" lần/phút",30),"Sinh hiệu lúc vào: "+vit+".");
  add("bp","doc","Huyết áp lúc vào là bao nhiêu?",`${v.sbp}/${v.dbp} mmHg`,numWrongs(v.sbp,[-40,-30,-20,20,30,40],x=>x+"/"+(x-v.sbp+v.dbp>40?x-v.sbp+v.dbp:v.dbp)+" mmHg",60),"Sinh hiệu lúc vào: "+vit+".");
  add("spo2","doc","SpO₂ lúc vào là bao nhiêu?",`${v.spo2}%`,numWrongs(v.spo2,[-12,-8,-5,-3,3,5,8].filter(d=>v.spo2+d<=100),x=>x+"%",70),"Sinh hiệu lúc vào: "+vit+".");
  add("rr","doc","Nhịp thở lúc vào là bao nhiêu?",`${v.rr} lần/phút`,numWrongs(v.rr,[-8,-6,-4,4,6,10,14],x=>x+" lần/phút",8),"Sinh hiệu lúc vào: "+vit+".");
  c.ask.forEach((a,k)=>add("ask"+k,"doc",`Khi hỏi “${a[0]}”, bệnh nhân trả lời thế nào?`,a[1],c.ask.filter((_,j)=>j!==k).map(x=>x[1]),"Đọc lại phần bệnh sử của bệnh án."));
  c.exam.forEach((a,k)=>add("exam"+k,"doc",`Khám ${lab(c,a[0])} “${a[1]}”: bạn ghi nhận gì?`.replace("  "," "),a[2],c.exam.filter((_,j)=>j!==k).map(x=>x[2]),"Đọc lại phần khám của bệnh án."));
  // chẩn đoán
  const plus=l=>(l||[]).filter(o=>o[0]==="+").map(o=>o.slice(1)), plain=l=>(l||[]).filter(o=>o[0]!=="+"&&o[0]!=="~");
  const oneOf=(key,id,sec,q)=>{ const l=c.opt[key]; if(!l) return; const ok=plus(l); if(!ok.length) return; add(id,sec,q,ok[0],plain(l),tch(c)); };
  oneOf("ydx","ydx","ydx","Chẩn đoán Tây y phù hợp nhất với bệnh nhân này là gì?");
  oneOf("bd","bd","yhct","Bệnh danh YHCT phù hợp nhất là gì?");
  oneOf("bc","bc","yhct","Bát cương của bệnh nhân này là gì?");
  oneOf("the","the","yhct","Thể bệnh (chứng) phù hợp nhất là gì?");
  oneOf("phap","phap","pp","Pháp điều trị phù hợp nhất là gì?");
  oneOf("phuong","phuong","pp","Bài thuốc (phương) phù hợp nhất là gì?");
  /* Các nhóm lựa chọn thêm của ca soạn theo mẫu bệnh án: mỗi nhóm thành một câu hỏi */
  const EXTRA={tieu_chuan:["ydx","Tiêu chuẩn chẩn đoán nào là đúng?"],phan_biet:["ydx","Nhận định nào về chẩn đoán phân biệt là đúng?"],sinh_ly_benh:["bh","Cơ chế sinh lý bệnh nào phù hợp nhất với ca này?"],uu_tien:["xt","Hướng xử trí ưu tiên phù hợp nhất cho ca này là gì?"],noi_soi:["xt","Thời điểm và chỉ định nội soi phù hợp nhất là gì?"],kiem_tra_tiet_tru:["xt","Cách xác nhận kết quả điều trị phù hợp nhất là gì?"]};
  Object.keys(c.opt).forEach(k=>{ if(EXTRA[k]) oneOf(k,k,EXTRA[k][0],EXTRA[k][1]); });
  if(c.opt.huyet){ const ok=plus(c.opt.huyet), bad=plain(c.opt.huyet); ok.forEach((h,k)=>add("huyet"+k,"pp","Huyệt nào phù hợp trong phác đồ châm cứu hỗ trợ cho ca này?",h,bad,tch(c))); }
  // cận lâm sàng
  const T=c.tests;
  T.forEach((t,k)=>{
    if(t[3]==="e") add("tprio"+k,"cls","Xét nghiệm nào cần làm ưu tiên ngay cho bệnh nhân này?",t[0],T.filter(x=>x[3]!=="e").map(x=>x[0]),"Kết quả: "+t[2]);
    if(t[3]==="w") add("twaste"+k,"cls","Xét nghiệm nào không có chỉ định hoặc làm mất thời gian ở bệnh nhân này?",t[0],T.filter(x=>x[3]!=="w").map(x=>x[0]),t[2]);
    if(t[3]!=="w") add("tres"+k,"cls",`Kết quả của “${t[0]}” ở bệnh nhân này là gì?`,t[2],T.filter((_,j)=>j!==k).map(x=>x[2]),"Đọc lại phần cận lâm sàng của bệnh án.");
  });
  // xử trí
  const A=c.actions.map(parseAct);
  A.forEach((a,k)=>{
    if(a.k==="++") add("aprio"+k,"xt","Việc nào cần làm ngay, ưu tiên hàng đầu?",a.text,A.filter(x=>x.k==="!"||x.k==="-").map(x=>x.text).concat(A.filter(x=>x.k==="+").map(x=>x.text)),a.why);
    if(a.k==="!") add("abad"+k,"xt","Việc nào dưới đây KHÔNG nên làm ở bệnh nhân này?",a.text,A.filter(x=>x.k==="++"||x.k==="+").map(x=>x.text),a.why);
  });
  // bài học
  add("teach","bh","Bài học then chốt của ca này là gì?",firstSent(tch(c)),others.map(x=>firstSent(tch(x))),tch(c));
  return P;
}
function bankDoc(c){
  const v=c.vitals;
  return `<div class="docsec"><h3>I. Hành chính</h3><p>${esc(c.name)}, ${esc(c.age)} tuổi, ${esc(c.sex)}. ${esc(c.place||"")}${c.clock?" lúc "+esc(c.clock):""}.</p><p>${esc(c.intro)}</p>
  <h3>Sinh hiệu lúc vào</h3><p>Mạch ${v.hr} · HA ${v.sbp}/${v.dbp} · Nhịp thở ${v.rr} · SpO₂ ${v.spo2}% · Nhiệt độ ${v.t} °C</p>
  <h3>III. Bệnh sử</h3><ul class="tight">${c.ask.map(a=>`<li><b>${esc(a[0])}</b> ${esc(a[1])}</li>`).join("")}</ul>
  <h3>VI. Khám lâm sàng</h3><ul class="tight">${c.exam.map(a=>`<li><b>${esc(lab(c,a[0])||a[0])} · ${esc(a[1])}:</b> ${esc(a[2])}</li>`).join("")}</ul>
  <h3>XIII. Cận lâm sàng</h3><ul class="tight">${c.tests.filter(t=>t[3]!=="w").map(t=>`<li><b>${esc(t[0])}:</b> ${esc(t[2])}</li>`).join("")}</ul></div>`;
}
const CASEDEFS = [
  {id:"demo",title:"Đau thượng vị cấp sau bữa nhậu",kind:"Nội khoa · Tiêu hóa",level:"Trung bình",group:"mau",track:"noi",secs:DEMO_SECS,doc:()=>caseDoc(),pool:()=>POOL.map(p=>({...p}))},
  ...BANK.map(c=>({id:c.id,title:c.title,kind:c.kind,level:c.level,group:c.group,track:trackOf(c),secs:trackOf(c)==="yhct"?BANK_SECS:MODERN_SECS,doc:()=>bankDoc(c),pool:()=>mkPool(c)}))
];
const _muc=new URLSearchParams(location.search).get("muc");
const V = { phase:"pick", fast:false, closed:true, n:15, filter:TRACKS[_muc]?_muc:"all", rank:null, def:null, elapsed:0, left:0, qs:[], i:0, pickd:-1, ans:[], timer:null };
const SEEN_KEY = "viva-seen-v2";
const loadSeenAll=()=>{ try{ return JSON.parse(localStorage.getItem(SEEN_KEY)||"{}"); }catch(e){ return {}; } };
const seenOf=id=>new Set(loadSeenAll()[id]||[]);
const saveSeen=(id,ids,poolN)=>{ try{ const all=loadSeenAll(); const s=new Set(all[id]||[]); ids.forEach(i=>s.add(i)); all[id]=s.size>=poolN?[]:[...s]; localStorage.setItem(SEEN_KEY,JSON.stringify(all)); }catch(e){} };
/* Đổi vị trí ca: mỗi lần mở danh sách (hoặc đổi mục) thứ tự ca được xáo lại. */
function orderedDefs(fn){
  if(!V.rank) V.rank=Object.fromEntries(shuf(CASEDEFS.map(d=>d.id)).map((id,i)=>[id,i]));
  return CASEDEFS.filter(fn).sort((a,b)=>V.rank[a.id]-V.rank[b.id]);
}
function trackChips(){
  const chips=[["all","Tất cả"],...Object.entries(TRACKS)];
  return `<div class="steps" role="group" aria-label="Chọn mục">${chips.map(c=>`<button class="step" data-v="tfilter" data-f="${c[0]}" aria-selected="${V.filter===c[0]}" type="button">${esc(c[1])}</button>`).join("")}</div>`+(TRACK_NOTE[V.filter]?`<p style="margin:0;color:var(--muted);font-size:13px">${esc(TRACK_NOTE[V.filter])}</p>`:"");
}
function drawQuestions(def,n){
  const pool=def.pool(), seen=seenOf(def.id), out=[], used=new Set();
  const total=def.secs.reduce((a,x)=>a+x[2],0);
  const quota=def.secs.map(x=>Math.max(0,Math.round(x[2]*n/total)));
  let diff=n-quota.reduce((a,b)=>a+b,0); for(let i=0;diff!==0;i=(i+1)%quota.length){ if(diff>0){quota[i]++;diff--;} else if(quota[i]>0){quota[i]--;diff++;} }
  const usedQ=new Set(); const take=(items,k)=>{ const f=shuf(items.filter(p=>!seen.has(p.id)&&!used.has(p.id))).concat(shuf(items.filter(p=>seen.has(p.id)&&!used.has(p.id)))); let got=0; for(const p of f){ if(got>=k) break; if(usedQ.has(p.q)) continue; out.push(p); used.add(p.id); usedQ.add(p.q); got++; } };
  def.secs.forEach((s,i)=>take(pool.filter(p=>p.sec===s[0]),quota[i]));
  if(out.length<n) take(pool,n-out.length);
  /* Đổi vị trí câu hỏi và đáp án mỗi lượt thi */
  return shuf(out).map(p=>({...p, opts:shuf(p.o.map((t,k)=>({t,ok:k===0})))}));
}
const mmss=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
function caseDoc(){
  return `<div class="docsec"><h3>I. Hành chính</h3><p>${esc(CASE.intro)}</p>
  <h3>III. Bệnh sử</h3><ul class="tight">${CASE.ask.map(a=>`<li>${esc(a[1])}</li>`).join("")}</ul>
  <h3>Sinh hiệu lúc vào viện</h3><p>${CASE.vitals.map(v=>esc(v[0]+" "+v[1]+" "+v[2])).join(" · ")}</p>
  <h3>VI. Khám lâm sàng</h3><ul class="tight">${CASE.exam.map(a=>`<li><b>${esc(a[0])}:</b> ${esc(a[1])}</li>`).join("")}</ul>
  <h3>XIII. Kết quả cận lâm sàng</h3><div class="tw"><table><thead><tr><th>Xét nghiệm</th><th>Kết quả</th><th>Đơn vị</th><th>Tham chiếu</th></tr></thead><tbody>${CASE.kq.map(r=>`<tr><td>${esc(r[0])}</td><td class="${r[4]}">${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}</tbody></table></div><p>${esc(CASE.kqText)}</p></div>`;
}
function vivaPick(){
  clearInterval(V.timer); V.phase="pick";
  const list=orderedDefs(d=>V.filter==="all"||d.track===V.filter);
  const sel=V.def;
  $("#panel").innerHTML=`<section class="card"><div class="code">Chọn bệnh án</div><h2>Thi vấn đáp</h2>
  ${trackChips()}
  <div class="list">${list.map(d=>{ const sn=seenOf(d.id).size; return `<button class="q ${sel&&sel.id===d.id?"open":""}" data-v="case" data-id="${esc(d.id)}" type="button"><span><b>${esc(d.title)}</b></span><span class="a" style="display:block;color:var(--muted);font-weight:400">${esc(d.kind)} · ${esc(d.level)}${sn?` · đã gặp ${sn} câu`:""}</span></button>`; }).join("")}</div>
  ${sel?setupBlock(sel):`<div class="lock">Chọn một bệnh án ở trên để bắt đầu.</div>`}</section>`;
}
function setupBlock(def){
  const pn=def.pool().length, max=Math.min(20,pn);
  const opts=[10,15,20].filter(x=>x<=max); if(!opts.length) opts.push(max);
  if(!opts.includes(V.n)) V.n=opts[opts.length-1];
  return `<div class="rev"><b>${esc(def.title)}</b>
  <ul class="tight"><li>Đọc bệnh án tối thiểu <b>2 phút</b>, tối đa <b>5 phút</b>; hết 2 phút bạn tự quyết định vào thi.</li>
  <li>Giám khảo hỏi trắc nghiệm theo thứ tự các mục, mỗi câu 4 đáp án, <b>${V.n} câu = ${V.n} phút</b>. Không quay lại câu trước.</li>
  <li>Ca này có ${pn} câu trong ngân hàng; mỗi lượt rút ngẫu nhiên, câu chưa gặp được ưu tiên.</li></ul>
  ${def.id==="demo"?"":`<span style="color:var(--muted);font-size:13px">Ca luyện phản xạ, soạn theo giáo trình chung, chưa đối chiếu nguồn cụ thể.</span>`}</div>
  <label class="check"><span>Số câu:</span><select id="v-n" aria-label="Số câu">${opts.map(x=>`<option value="${x}" ${x===V.n?"selected":""}>${x} câu · ${x} phút</option>`).join("")}</select></label>
  <label class="check"><input type="checkbox" id="v-closed" ${V.closed?"checked":""}><span>Đóng sách khi thi (bệnh án ẩn, giống thi thật)</span></label>
  <label class="check"><input type="checkbox" id="v-fast" ${V.fast?"checked":""}><span>Chạy thử nhanh (đọc 10 giây, thi 3 phút) — chỉ để xem thử</span></label>
  <button class="btn" data-v="start" type="button">Vào phòng đọc bệnh án</button>`;
}
function vivaRead(){
  V.phase="read"; V.elapsed=0; clearInterval(V.timer);
  const minS=V.fast?10:120, maxS=V.fast?30:300;
  const draw=()=>{
    const btn=$("#v-go"), lab=$("#timer"); if(!btn) return;
    if(V.elapsed<minS){ lab.textContent="Đọc tối thiểu: còn "+mmss(minS-V.elapsed); btn.disabled=true; }
    else { lab.textContent="Tự vào thi sau "+mmss(maxS-V.elapsed); btn.disabled=false; }
  };
  $("#panel").innerHTML=`<section class="card"><div class="code">Phòng đọc bệnh án</div><h2>${esc(V.def.title)}</h2>${V.def.doc()}<button class="btn" id="v-go" data-v="go" type="button" disabled>Vào thi</button></section>`;
  draw();
  V.timer=setInterval(()=>{ V.elapsed++; draw(); if(V.elapsed>=maxS) vivaStart(); },1000);
}
function vivaStart(){
  clearInterval(V.timer);
  V.phase="exam"; V.qs=drawQuestions(V.def,V.n); V.i=0; V.pickd=-1; V.ans=[]; V.left=V.fast?180:V.qs.length*60; V.total=V.left;
  V.timer=setInterval(()=>{ V.left--; $("#timer").textContent="Còn "+mmss(Math.max(0,V.left)); if(V.left<=0) vivaFinish(); },1000);
  $("#timer").textContent="Còn "+mmss(V.left); vivaQ();
}
function vivaQ(){
  const q=V.qs[V.i], sec=V.def.secs.find(x=>x[0]===q.sec), last=V.i===V.qs.length-1;
  $("#panel").innerHTML=`<section class="card"><div class="row"><span class="code">Câu ${V.i+1}/${V.qs.length} · ${esc(sec[1])}</span></div>
  <div class="prog" aria-hidden="true"><i style="width:${(V.i/V.qs.length)*100}%"></i></div>
  <div class="bubble"><span class="who">Giám khảo</span>${esc(sec[3])} ${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="o" data-v="opt" data-k="${k}" aria-pressed="${V.pickd===k}" type="button"><b>${"ABCD"[k]}</b><span>${esc(o.t)}</span></button>`).join("")}</div>
  ${V.closed?"":`<details><summary>Xem lại bệnh án</summary>${V.def.doc()}</details>`}
  <button class="btn" data-v="next" type="button" ${V.pickd<0?"disabled":""}>${last?"Nộp bài":"Trả lời, sang câu tiếp"}</button></section>`;
}
function vivaFinish(){
  clearInterval(V.timer); V.phase="result";
  while(V.ans.length<V.qs.length) V.ans.push(-1);
  saveSeen(V.def.id,V.qs.map(q=>q.id),V.def.pool().length);
  const ok=V.qs.map((q,i)=>V.ans[i]>=0 && q.opts[V.ans[i]].ok);
  const right=ok.filter(Boolean).length, score=Math.round(right/V.qs.length*100)/10, used=V.total-Math.max(0,V.left);
  $("#timer").textContent="Đã nộp bài";
  const bySec=V.def.secs.map(([id,name])=>{ const idx=V.qs.map((q,i)=>q.sec===id?i:-1).filter(i=>i>=0); return [name,idx.filter(i=>ok[i]).length,idx.length]; }).filter(x=>x[2]>0);
  const weak=bySec.filter(x=>x[1]<x[2]).map(x=>x[0]);
  $("#panel").innerHTML=`<section class="card"><div class="code">Kết quả · ${esc(V.def.title)}</div>
  <div><span class="big ${score>=5?"pass":"fail"}">${String(score).replace(".",",")}</span> <span style="color:var(--muted)">/ 10 · ${right}/${V.qs.length} câu đúng · ${score>=5?"Đạt":"Chưa đạt"} (tạm tính ngưỡng 5,0)</span></div>
  <div class="score">Thời gian làm bài: ${mmss(used)}${V.ans.includes(-1)?" · có câu chưa trả lời, tính là sai":""}</div>
  ${bySec.map(x=>`<div class="sbar"><span>${esc(x[0])}</span><b>${x[1]}/${x[2]}</b><div class="prog"><i style="width:${x[1]/x[2]*100}%"></i></div></div>`).join("")}
  ${weak.length?`<div class="pit"><h3>Nên ôn lại</h3>${esc(weak.join(", "))}.</div>`:`<div class="why"><h3>Tốt lắm</h3>Bạn đúng ở mọi mục. Thi lại để gặp các câu mới.</div>`}
  <h2 style="font-size:17px">Xem lại từng câu</h2>
  ${V.qs.map((q,i)=>`<div class="rev ${ok[i]?"":"bad"}"><b>Câu ${i+1}. ${esc(q.q)}</b><span>Bạn chọn: ${V.ans[i]>=0?esc(q.opts[V.ans[i]].t):"(không trả lời)"}</span>${ok[i]?"":`<span>Đáp án đúng: <b>${esc(q.opts.find(o=>o.ok).t)}</b></span>`}${q.e?`<span style="color:var(--muted)">${esc(q.e)}</span>`:""}</div>`).join("")}
  <div class="nav"><button class="btn ghost" data-v="again" type="button">Chọn ca khác</button><button class="btn" data-v="retry" type="button">Thi lại ca này, câu mới</button></div></section>`;
  window.scrollTo({top:0});
}
function vivaClick(t){
  const a=t.dataset.v;
  if(a==="filter"){ V.filter=t.dataset.f; return vivaPick(); }
  if(a==="tfilter"){ V.filter=t.dataset.f; V.rank=null; V.def=null; return S.mode==="learn"?learnList():vivaPick(); }
  if(a==="lcase"){ const d=CASEDEFS.find(x=>x.id===t.dataset.id); S.lreveal=false; S.lid=d.id; if(d.id==="demo"){ S.view="case"; S.cur=0; $("#steps").hidden=false; render(); return window.scrollTo({top:0}); } return bankStudy(d); }
  if(a==="lreveal"){ S.lreveal=true; return bankStudy(CASEDEFS.find(x=>x.id===S.lid)); }
  if(a==="lback") return learnList();
  if(a==="case"){ V.def=CASEDEFS.find(d=>d.id===t.dataset.id); vivaPick(); const s=$("#v-n"); return s&&s.scrollIntoView({block:"center"}); }
  if(a==="start"){ V.n=+$("#v-n").value; V.closed=$("#v-closed").checked; V.fast=$("#v-fast").checked; return vivaRead(); }
  if(a==="go") return vivaStart();
  if(a==="opt"){ V.pickd=+t.dataset.k; return vivaQ(); }
  if(a==="next"){ V.ans[V.i]=V.pickd; V.pickd=-1; if(V.i>=V.qs.length-1) return vivaFinish(); V.i++; vivaQ(); return window.scrollTo({top:0}); }
  if(a==="again"){ V.def=null; V.rank=null; return vivaPick(); }
  if(a==="retry") return vivaRead();
  if(a==="learn") return setMode("learn");
}

learnList();
</script>
