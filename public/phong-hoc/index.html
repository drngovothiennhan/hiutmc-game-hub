n và số liệu là giả định. Người bệnh nam 68 tuổi được đưa vào cấp cứu sau khi đột ngột yếu nửa người phải và nói khó, thời điểm khởi phát được người nhà xác định rõ khoảng 90 phút trước.","vitals":{"hr":92,"sbp":172,"dbp":96,"rr":18,"t":36.9,"spo2":96},"ask":[["Triệu chứng khởi phát lúc mấy giờ, đang làm gì, có diễn tiến thế nào?","Khoảng 90 phút trước, đang ăn sáng thì rơi đũa, yếu tay chân phải, nói khó và méo miệng; không tự đỡ.","e"],["Có đau đầu dữ dội, nôn, co giật hoặc chấn thương đầu không?","Không đau đầu dữ dội, không nôn, không co giật, không té ngã trước đó.","e"],["Có bệnh nền như tăng huyết áp, đái tháo đường, rung nhĩ, bệnh tim không?","Tăng huyết áp 10 năm dùng thuốc không đều; đái tháo đường típ 2; chưa biết bệnh tim.","e"],["Đang dùng thuốc chống đông hoặc kháng tiểu cầu không?","Không dùng thuốc chống đông; thỉnh thoảng uống aspirin.","e"],["Có phẫu thuật, xuất huyết tiêu hóa hoặc chấn thương lớn trong 3 tháng qua không?","Không.","e"],["Có hút thuốc, uống rượu không?","Hút thuốc 30 gói-năm, uống rượu ít.","n"],["Có từng thoáng yếu liệt, nói khó rồi tự hết trước đây không?","Một tuần trước có tê yếu tay phải khoảng 15 phút rồi tự hết, không đi khám.","e"]],"exam":[["K","Tri giác và thang điểm NIHSS","Tỉnh, GCS 14 (E4 V4 M6), nói khó, liệt mặt phải kiểu trung ương, liệt tay phải 1/5, chân phải 3/5; NIHSS 14.","e"],["K","Tim mạch","Nhịp tim không đều, không tiếng thổi; mạch ngoại biên đều hai bên.","e"],["K","Thần kinh khác","Phản xạ da bàn chân phải duỗi, đồng tử đều phản xạ tốt, không cứng gáy, không phù gai.","e"],["K","Hô hấp và bụng","Phổi trong, bụng mềm.","n"]],"tests":[["CT sọ não không cản quang khẩn",40,"Không có xuất huyết; mờ ranh giới thùy đảo phải mức nhẹ, điểm ASPECTS 9.","e"],["Đường huyết mao mạch ngay lập tức",10,"Glucose 8,2 mmol/L.","e"],["Công thức máu, đông máu, INR, creatinin",10,"Tiểu cầu 220 G/L; INR 1,0; aPTT bình thường; creatinin 92 umol/L.","e"],["Điện tâm đồ",10,"Rung nhĩ đáp ứng thất khoảng 92 lần/phút.","e"],["CT mạch máu não và mạch cảnh",40,"Tắc đoạn M1 động mạch não giữa trái; các mạch cảnh thông.","e"],["Chọc dò dịch não tủy để loại trừ viêm màng não trước khi quyết định điều trị",10,"Không có chỉ định, làm chậm tái thông.","w"]],"opt":{"ydx":["Xuất huyết não do tăng huyết áp","Cơn thiếu máu não thoáng qua đã hồi phục","+Nhồi máu não cấp vùng động mạch não giữa trái, nghi nguyên nhân thuyên tắc từ rung nhĩ","Hạ đường huyết gây liệt nửa người"],"tai_thong":["+Alteplase tĩnh mạch trong cửa sổ 4,5 giờ và lấy huyết khối cơ học do tắc đoạn M1","Chỉ dùng aspirin và theo dõi","Heparin liều đầy đủ ngay lập tức, bỏ qua tiêu sợi huyết","Không điều trị gì vì liệt đã nặng"],"huyet_ap":["+Hạ dần huyết áp xuống dưới 185/110 mmHg trước khi dùng tiêu sợi huyết, giữ dưới 180/105 trong 24 giờ sau","Hạ nhanh về dưới 120/80 mmHg ngay","Không cần can thiệp huyết áp","Hạ huyết áp bằng nifedipin ngậm dưới lưỡi"]},"actions":["++Kích hoạt báo động đột quỵ, đo NIHSS, đường huyết và chụp CT sọ không cản quang khẩn|2|Thời gian là não; cần loại trừ xuất huyết và đánh giá chỉ định tái thông.","++Kiểm soát huyết áp dưới 185/110 mmHg rồi truyền alteplase đường tĩnh mạch nếu không có chống chỉ định|2|Khởi phát 90 phút, không chống chỉ định, đủ tiêu chuẩn tiêu sợi huyết.","+Chụp CT mạch và hội chẩn can thiệp thần kinh để lấy huyết khối cơ học do tắc M1|2|Tắc mạch lớn vùng trước, NIHSS cao, nên lấy huyết khối cơ học.","+Theo dõi thần kinh, huyết áp, đường huyết, nuốt và tư thế đầu|2|Phòng biến chứng chảy máu, hít sặc, tăng đường huyết.","+Hội chẩn tim mạch về rung nhĩ và dự phòng bằng thuốc chống đông đường uống sau giai đoạn cấp|2|Rung nhĩ là nguyên nhân thuyên tắc, dự phòng thứ phát cần sau thời điểm an toàn.","!Cho thêm aspirin và heparin ngay trước khi quyết định tiêu sợi huyết|0|Tăng nguy cơ xuất huyết, làm mất chỉ định tiêu sợi huyết."],"teach":"Trong nhồi máu não cấp, quyết định đầu tiên dựa vào thời điểm khởi phát, CT sọ loại trừ xuất huyết và chống chỉ định. Tiêu sợi huyết trong 4,5 giờ và lấy huyết khối cơ học khi tắc mạch lớn vùng trước. Tìm nguyên nhân (rung nhĩ) để dự phòng thứ phát.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N16, nam, 68 tuổi, hưu trí; nhập khoa Cấp cứu rồi Thần kinh can thiệp.","ly_do_vao_vien":"Yếu nửa người phải và nói khó đột ngột 90 phút.","benh_su":"Khoảng 90 phút trước, đang ăn sáng người bệnh đột ngột rơi đũa, yếu tay chân phải, nói khó và méo miệng, không đỡ. Không đau đầu dữ dội, không nôn, co giật hay chấn thương. Một tuần trước có tê yếu tay phải thoáng qua 15 phút tự hết. Đến cấp cứu trong cửa sổ điều trị.","tien_su":"Tăng huyết áp 10 năm, dùng thuốc không đều. Đái tháo đường típ 2. Hút thuốc 30 gói-năm. Thỉnh thoảng uống aspirin, không dùng chống đông. Không phẫu thuật, chấn thương lớn, xuất huyết tiêu hóa trong 3 tháng.","luoc_qua_co_quan":"Thần kinh: yếu nửa người phải, nói khó, méo miệng. Tim mạch: chưa từng đau ngực, hồi hộp không rõ. Tiêu hóa: không nôn. Hô hấp: bình thường.","kham_hien_tai":"GCS 14, nói khó (loạn ngôn kèm vận ngôn), liệt mặt phải trung ương, liệt tay phải 1/5, chân phải 3/5, NIHSS 14. Mạch 92 lần/phút không đều, HA 172/96 mmHg, nhiệt độ 36,9 độ C, nhịp thở 18, SpO2 96%. Phản xạ da bàn chân phải duỗi. Không cứng gáy.","can_lam_sang":"CT sọ: không xuất huyết, ASPECTS 9. Glucose 8,2 mmol/L. Tiểu cầu 220 G/L, INR 1,0, creatinin 92. ECG rung nhĩ 92 lần/phút. CT mạch: tắc đoạn M1 động mạch não giữa trái.","tom_tat":"Nam 68 tuổi, tăng huyết áp, đái tháo đường, hút thuốc, có cơn thiếu máu thoáng qua tuần trước, nay đột ngột liệt nửa người phải, liệt mặt, nói khó 90 phút; NIHSS 14; CT sọ không xuất huyết, ASPECTS 9; ECG rung nhĩ; CT mạch tắc M1 trái; không chống chỉ định tiêu sợi huyết.","dat_van_de":"Hội chứng đột quỵ cấp nặng, vùng động mạch não giữa trái; thời điểm khởi phát trong cửa sổ tái thông; tắc mạch lớn; rung nhĩ chưa điều trị; tăng huyết áp cần kiểm soát; yếu tố nguy cơ mạch máu.","chan_doan_so_bo":"Nhồi máu não cấp vùng động mạch não giữa trái do tắc M1, nghi thuyên tắc từ rung nhĩ.","bien_luan":"Bước 1: định khu, liệt nửa người phải, liệt mặt phải trung ương, rối loạn ngôn ngữ cho thấy tổn thương bán cầu não trái, vùng động mạch não giữa. Bước 2: định tính, khởi phát đột ngột, không đau đầu dữ dội, không nôn, CT sọ không có máu nên nghiêng về thiếu máu hơn là xuất huyết. Bước 3: nguyên nhân, nhịp không đều và ECG rung nhĩ gợi ý thuyên tắc từ tim; cơn thiếu máu thoáng qua trước đó là tín hiệu cảnh báo; xơ vữa mạch máu lớn là nguyên nhân hàng đầu khác cần loại trừ, CT mạch không thấy hẹp cảnh nặng. Bước 4: đánh giá chỉ định tái thông, khởi phát 90 phút, glucose, INR, tiểu cầu bình thường, không chống chỉ định, huyết áp phải hạ dưới 185/110; NIHSS 14 và tắc M1 là chỉ định lấy huyết khối cơ học. Bước 5: loại trừ bắt chước đột quỵ, hạ đường huyết (glucose 8,2), co giật, đau nửa đầu có triệu chứng thần kinh.","sinh_ly_benh":"Rung nhĩ làm máu ứ đọng ở tiểu nhĩ trái, hình thành huyết khối; cục máu bong theo dòng máu gây tắc động mạch não giữa. Giảm tưới máu làm vùng lõi hoại tử trong vài phút do thiếu oxy và ATP, kèm vùng bán ảnh còn cứu được. Tái thông sớm cứu vùng bán ảnh. Kích hoạt chuỗi thiếu máu: rối loạn bơm ion, phù độc tế bào, glutamat gây độc, stress oxy hóa. Tăng huyết áp, đái tháo đường và hút thuốc thúc đẩy xơ vữa mạch.","chan_doan_phan_biet":"Xuất huyết não; xuất huyết dưới nhện; cơn thiếu máu não thoáng qua; hạ đường huyết; co giật có liệt Todd; đau nửa đầu có aura; u não hoặc ổ nhiễm trùng; bệnh lý tâm thần chuyển dạng.","chan_doan_xac_dinh":"Nhồi máu não cấp do tắc M1 trái, nguyên nhân thuyên tắc từ tim (rung nhĩ); NIHSS 14; tăng huyết áp, đái tháo đường, hút thuốc là yếu tố nguy cơ.","dieu_tri":"Tại phòng cấp cứu: ABC, theo dõi monitor, đặt đường truyền, hạ huyết áp dưới 185/110 mmHg bằng labetalol hoặc nicardipin truyền tĩnh mạch, giữ dưới 180/105 trong 24 giờ sau tiêu sợi huyết. Alteplase 0,9 mg/kg (tối đa 90 mg), 10% tiêm tĩnh mạch, phần còn lại truyền trong 60 phút. Lấy huyết khối cơ học do tắc M1. Hoãn thuốc chống đông và kháng tiểu cầu 24 giờ sau tiêu sợi huyết cho đến khi CT kiểm soát. Theo dõi thần kinh, nuốt, đường huyết, tránh sốt. Sau cấp: phục hồi chức năng sớm, statin cường độ cao, kiểm soát huyết áp và đường huyết, bắt đầu thuốc chống đông đường uống trong vòng 2 đến 14 ngày tùy mức nhồi máu.","tien_luong":"Dè dặt; NIHSS cao và tắc mạch lớn có nguy cơ tàn tật nặng nếu không tái thông; tái thông sớm cải thiện rõ khả năng hồi phục chức năng. Nguy cơ chuyển dạng xuất huyết có triệu chứng sau tiêu sợi huyết khoảng 2 đến 7%.","du_phong":"Dự phòng thứ phát: thuốc chống đông đường uống cho rung nhĩ, statin, kiểm soát huyết áp mục tiêu dưới 130/80 mmHg, đường huyết và HbA1c, ngừng thuốc lá, hạn chế rượu, vận động. Phục hồi chức năng, ngôn ngữ trị liệu, phòng loét tì đè, huyết khối tĩnh mạch sâu. Giáo dục dấu hiệu FAST cho người nhà."},"nguon":["Powers WJ, et al. 2019 Update to the 2018 Guidelines for the Early Management of Acute Ischemic Stroke. AHA/ASA. Stroke 2019;50:e344.","Bộ Y tế. Hướng dẫn chẩn đoán và xử trí đột quỵ não (Quyết định 5331/QĐ-BYT, 2020).","Giáo trình Thần kinh học, bộ môn Thần kinh, các trường đại học Y Việt Nam."],"status":"nhap"},{"id":"noi-than-kinh-002","title":"Đau đầu dữ dội, nôn và yếu nửa người trái trên nền huyết áp cao","kind":"Nội","level":"Trung bình","group":"noi","name":"Người bệnh mô phỏng N17","age":58,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu là giả định. Người bệnh nam 58 tuổi được đưa vào cấp cứu sau khi đột ngột đau đầu dữ dội, nôn và yếu nửa người trái khi đang làm việc.","vitals":{"hr":96,"sbp":218,"dbp":118,"rr":20,"t":37.1,"spo2":96},"ask":[["Triệu chứng khởi phát thế nào?","Đang làm vườn thì đau đầu dữ dội bên phải, nôn hai lần, rồi yếu tay chân trái và nói ngọng; khoảng 2 giờ trước.","e"],["Có chấn thương đầu, co giật, mất ý thức không?","Không té ngã; có lơ mơ từng lúc; không co giật.","e"],["Tiền sử tăng huyết áp và điều trị?","Tăng huyết áp 12 năm, uống thuốc không đều, mấy tuần nay bỏ thuốc.","e"],["Có dùng thuốc chống đông, kháng tiểu cầu, rượu hoặc ma túy không?","Không chống đông; uống rượu nhiều dịp lễ; không ma túy.","e"],["Có bệnh gan, rối loạn đông máu, đột quỵ trước đây không?","Không.","e"],["Có sốt, cứng gáy, chóng mặt, đau thắt ngực không?","Không.","n"],["Có đái tháo đường hoặc rối loạn mỡ máu không?","Chưa biết, chưa xét nghiệm.","n"]],"exam":[["K","Tri giác","GCS 11 (E3 V3 M5) lúc vào, đồng tử hai bên đều, phản xạ ánh sáng tốt.","e"],["K","Thần kinh vận động","Liệt nửa người trái 2/5, liệt mặt trái trung ương, Babinski trái dương tính.","e"],["K","Dấu hiệu màng não và đáy mắt","Gáy mềm; đáy mắt có hẹp động mạch, chưa phù gai thị.","e"],["K","Tim phổi và bụng","Tim đều, T2 vang ở ổ động mạch chủ; phổi trong; bụng mềm.","n"]],"tests":[["CT sọ não không cản quang khẩn",40,"Khối máu tụ nhân bèo và bao trong phải khoảng 38 mL, tràn vào não thất bên nhẹ, đẩy lệch đường giữa 3 mm.","e"],["Công thức máu, đông máu, INR, đường huyết, điện giải, chức năng gan thận",10,"Tiểu cầu 205 G/L; INR 1,0; glucose 7,0 mmol/L; creatinin 110 umol/L; K 3,7 mmol/L.","e"],["Điện tâm đồ và men tim",10,"Phì đại thất trái, không có ST chênh; troponin bình thường.","e"],["CT mạch máu não",40,"Không thấy phình mạch hay dị dạng mạch máu; không dấu hiệu chấm (spot sign).","n"],["X quang ngực",10,"Bóng tim hơi to; không tổn thương phổi cấp.","n"],["Chọc dò dịch não tủy",10,"Chống chỉ định khi có khối choán chỗ và nghi tăng áp lực nội sọ.","w"]],"opt":{"ydx":["Nhồi máu não vùng động mạch não giữa phải","Xuất huyết dưới nhện do vỡ phình mạch","Cơn thiếu máu não thoáng qua","+Xuất huyết não vùng nhân bèo và bao trong phải do tăng huyết áp"],"huyet_ap":["+Hạ huyết áp tâm thu mục tiêu khoảng 140 mmHg một cách an toàn, tránh hạ quá nhanh hay xuống dưới 130","Hạ huyết áp về dưới 100/60 mmHg trong 30 phút","Không cần can thiệp huyết áp để giữ áp lực tưới máu não","Chỉ dùng nifedipin ngậm dưới lưỡi"],"phau_thuat":["+Điều trị nội khoa tại đơn vị đột quỵ hoặc hồi sức; hội chẩn ngoại thần kinh nếu xấu đi hoặc khối máu tụ lớn gây chèn ép","Dùng ngay thuốc tiêu sợi huyết","Dùng heparin liều đầy đủ","Chỉ truyền dịch nhược trương"]},"actions":["++Bảo vệ đường thở, theo dõi monitor, chụp CT sọ não khẩn|2|GCS 11 cần bảo vệ đường thở; CT phân biệt xuất huyết và nhồi máu.","++Hạ huyết áp có kiểm soát bằng thuốc truyền tĩnh mạch (nicardipin hoặc labetalol) để tâm thu khoảng 140 mmHg|2|Giảm nguy cơ lan rộng khối máu tụ mà không làm giảm tưới máu não.","+Đảo ngược rối loạn đông máu nếu có; ở ca này INR và tiểu cầu bình thường nên chỉ cần theo dõi|2|Cần xác nhận không dùng thuốc chống đông trước khi quyết định.","+Nâng đầu cao 30 độ, tránh hạ natri, kiểm soát sốt, đường huyết, nôn|2|Giảm tăng áp lực nội sọ và biến chứng thứ phát.","+Hội chẩn ngoại thần kinh khi xấu dần, tràn vào não thất gây não úng thủy hoặc khối máu tụ lớn chèn ép|2|Có thể cần dẫn lưu não thất hoặc mở sọ giải ép.","!Truyền alteplase hoặc cho aspirin, heparin ngay khi chưa chụp CT|0|Nếu xuất huyết sẽ gây tử vong nhanh."],"teach":"Đột quỵ cấp luôn cần chụp CT sọ não để phân biệt xuất huyết và nhồi máu trước khi dùng thuốc. Xuất huyết não do tăng huyết áp thường ở nhân bèo, bao trong, đồi thị, cầu não, tiểu não; xử trí bao gồm bảo vệ đường thở, hạ huyết áp có kiểm soát, giảm tăng áp lực nội sọ và hội chẩn ngoại.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N17, nam, 58 tuổi, nông dân; nhập khoa Cấp cứu rồi Thần kinh.","ly_do_vao_vien":"Đau đầu dữ dội, nôn, yếu nửa người trái.","benh_su":"Hai giờ trước, đang làm vườn thì đột ngột đau đầu dữ dội bên phải, nôn hai lần, yếu tay chân trái, nói ngọng, lơ mơ từng lúc. Không té ngã, không co giật, không sốt. Có tăng huyết áp 12 năm nhưng uống thuốc không đều, những tuần gần đây bỏ thuốc.","tien_su":"Tăng huyết áp 12 năm. Không dùng chống đông, kháng tiểu cầu. Uống rượu nhiều dịp lễ. Chưa xét nghiệm đường huyết, mỡ máu. Không có bệnh gan hay rối loạn đông máu. Không đột quỵ trước.","luoc_qua_co_quan":"Thần kinh: đau đầu, yếu nửa người trái, nói ngọng, lơ mơ. Tiêu hóa: nôn. Tim mạch: không đau ngực. Hô hấp: bình thường.","kham_hien_tai":"GCS 11 (E3 V3 M5), đồng tử đều phản xạ tốt. Liệt nửa người trái 2/5, liệt mặt trái trung ương, Babinski trái dương tính. Mạch 96 lần/phút, HA 218/118 mmHg, nhiệt độ 37,1 độ C, nhịp thở 20, SpO2 96%. Gáy mềm. Đáy mắt hẹp động mạch. T2 vang ở ổ động mạch chủ.","can_lam_sang":"CT sọ: máu tụ nhân bèo và bao trong phải khoảng 38 mL, tràn vào não thất bên nhẹ, đẩy lệch đường giữa 3 mm. Tiểu cầu 205 G/L, INR 1,0, glucose 7,0, creatinin 110, K 3,7. ECG phì đại thất trái. CT mạch không thấy phình mạch hay dị dạng.","tom_tat":"Nam 58 tuổi, tăng huyết áp lâu năm bỏ thuốc, đột ngột đau đầu dữ dội, nôn, liệt nửa người trái, GCS 11, HA 218/118; CT sọ có khối máu tụ nhân bèo và bao trong phải 38 mL tràn vào não thất; đông máu và tiểu cầu bình thường; CT mạch không có phình mạch hay dị dạng.","dat_van_de":"Xuất huyết não cấp có khối lượng trung bình kèm tràn não thất; tăng huyết áp nặng chưa kiểm soát; rối loạn tri giác cần bảo vệ đường thở; nguy cơ lan rộng khối máu tụ, não úng thủy và tăng áp lực nội sọ.","chan_doan_so_bo":"Xuất huyết não vùng nhân bèo và bao trong phải do tăng huyết áp, tràn vào não thất.","bien_luan":"Bước 1: định khu, liệt nửa người trái, liệt mặt trái trung ương, Babinski trái dương tính gợi ý tổn thương bao trong hoặc nhân bèo bán cầu phải. Bước 2: định tính, khởi phát đột ngột với đau đầu dữ dội, nôn, rối loạn ý thức và huyết áp rất cao thiên về xuất huyết; CT sọ khẳng định máu tụ nhân bèo và bao trong phải 38 mL. Bước 3: nguyên nhân, vị trí sâu cùng tăng huyết áp mạn bỏ thuốc, phì đại thất trái, đáy mắt hẹp động mạch cho thấy bệnh mạch máu nhỏ do tăng huyết áp; CT mạch không thấy phình mạch hay dị dạng, INR và tiểu cầu bình thường nên không do rối loạn đông máu. Bước 4: mức độ, theo thang điểm ICH, GCS 9 đến 12 tính 1 điểm, thể tích từ 30 mL trở lên (ở đây 38 mL) tính 1, có tràn não thất tính 1, vị trí trên lều 0, tuổi dưới 80 0, tổng 3 điểm, tiên lượng nặng. Bước 5: loại trừ nhồi máu não (CT không có máu mới điều trị tiêu sợi huyết) và xuất huyết dưới nhện (không đau đầu sét đánh với dấu màng não).","sinh_ly_benh":"Tăng huyết áp mạn gây thoái hóa kính mỡ và hoại tử dạng fibrin ở thành các động mạch xuyên nhỏ, tạo các vi phình mạch Charcot-Bouchard dễ vỡ ở nhân bèo, đồi thị, cầu não, tiểu não. Khi vỡ, máu thoát vào nhu mô phá hủy mô và chèn ép; khối máu tụ lan rộng trong những giờ đầu do tiếp tục chảy máu, kèm phù quanh ổ máu tụ, viêm và độc tính của sản phẩm thoái hóa hemoglobin. Khối lượng tăng làm tăng áp lực nội sọ, thoát vị não; tràn vào não thất có thể gây não úng thủy.","chan_doan_phan_biet":"Nhồi máu não; xuất huyết dưới nhện; xuất huyết do dị dạng động tĩnh mạch hoặc phình mạch; xuất huyết do thuốc chống đông hoặc rối loạn đông máu; bệnh mạch máu não dạng bột; u não xuất huyết; huyết khối xoang tĩnh mạch.","chan_doan_xac_dinh":"Xuất huyết não vùng nhân bèo và bao trong phải do tăng huyết áp, thể tích khoảng 38 mL, tràn não thất, điểm ICH 3.","dieu_tri":"Bảo vệ đường thở, đặt nội khí quản nếu GCS dưới 8 hoặc không bảo vệ được đường thở. Hạ huyết áp có kiểm soát bằng nicardipin hoặc labetalol truyền, mục tiêu tâm thu khoảng 140 mmHg, không xuống dưới 130 mmHg, tránh dao động lớn. Nâng đầu 30 độ, giảm đau, kiểm soát nôn, đường huyết 7,8 đến 10 mmol/L, điều chỉnh điện giải, hạ sốt. Nếu tăng áp lực nội sọ, dùng mannitol hoặc nước muối ưu trương. Hội chẩn ngoại thần kinh về dẫn lưu não thất khi não úng thủy hoặc cân nhắc phẫu thuật nếu xấu đi. Dự phòng huyết khối tĩnh mạch bằng nén khí ngắt quãng. Theo dõi thần kinh mỗi giờ, CT kiểm soát khi xấu đi.","tien_luong":"Dè dặt; điểm ICH 3 gợi ý tử vong 30 ngày khoảng 70 phần trăm theo dữ liệu mô hình; di chứng liệt và rối loạn nuốt thường gặp ở người sống sót. Nguy cơ tái xuất huyết tăng nếu huyết áp không kiểm soát.","du_phong":"Kiểm soát huyết áp lâu dài dưới 130/80 mmHg với thuốc đều đặn; hạn chế muối, rượu; ngừng thuốc lá; kiểm soát mỡ máu và đường huyết; phục hồi chức năng sớm; chăm sóc phòng loét tì đè, viêm phổi hít, huyết khối tĩnh mạch sâu; giáo dục người nhà về tuân thủ điều trị và theo dõi huyết áp tại nhà."},"nguon":["Greenberg SM, et al. 2022 Guideline for the Management of Patients With Spontaneous Intracerebral Hemorrhage. AHA/ASA. Stroke 2022;53:e282.","Bộ Y tế. Hướng dẫn chẩn đoán và xử trí đột quỵ não (Quyết định 5331/QĐ-BYT, 2020).","Giáo trình Thần kinh học, bộ môn Thần kinh, các trường đại học Y Việt Nam."],"status":"nhap"},{"id":"noi-huyet-hoc-001","title":"Mệt mỏi, hoa mắt và rong kinh kéo dài","kind":"Nội","level":"Dễ","group":"noi","name":"Người bệnh mô phỏng N18","age":35,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu là giả định. Người bệnh nữ 35 tuổi đến phòng khám vì mệt mỏi, hoa mắt, hồi hộp khi gắng sức nhiều tháng, kinh nguyệt ra nhiều kéo dài.","vitals":{"hr":98,"sbp":104,"dbp":62,"rr":18,"t":36.7,"spo2":98},"ask":[["Mệt, hoa mắt xuất hiện từ khi nào và có tăng dần không?","Khoảng 5 tháng nay mệt, hoa mắt khi leo cầu thang, hồi hộp, khó tập trung, càng ngày càng tăng.","e"],["Chu kỳ kinh và lượng máu kinh thế nào?","Kinh ra 8 đến 10 ngày, thay băng 8 đến 10 miếng/ngày, có máu cục, đã 8 tháng như vậy.","e"],["Có tiêu ra máu, phân đen, nôn máu hoặc dùng thuốc giảm đau, kháng viêm kéo dài không?","Không phân đen, không tiêu ra máu; không dùng thuốc kháng viêm.","e"],["Chế độ ăn như thế nào, có ăn chay không?","Ăn ít thịt đỏ, uống trà đặc sau bữa ăn, chưa từng dùng sắt.","e"],["Có thèm ăn đá, đất, móng tay giòn, tóc rụng, nuốt vướng không?","Hay thèm ăn đá lạnh, móng tay dễ gãy, tóc rụng nhiều.","e"],["Có đang mang thai hoặc cho con bú, bệnh tuyến giáp, bệnh mạn tính không?","Không mang thai; có 2 con, đã sinh thường; không bệnh mạn tính.","n"],["Tiền sử gia đình về thiếu máu, bệnh huyết sắc tố?","Không.","n"]],"exam":[["K","Da niêm mạc","Da xanh, niêm mạc mắt nhợt, lòng bàn tay nhợt, không vàng da.","e"],["K","Tim mạch","Tim nhanh đều, thổi tâm thu cơ năng 2/6 ở mỏm; không phù.","e"],["K","Móng và miệng","Móng khum hình thìa nhẹ, viêm góc miệng, lưỡi nhẵn bóng.","e"],["K","Bụng và hạch","Gan, lách không to, không hạch ngoại vi.","n"]],"tests":[["Công thức máu và chỉ số hồng cầu",10,"Hb 7,6 g/dL; MCV 64 fL; MCH 19 pg; MCHC 29 g/dL; RDW 19%; tiểu cầu 460 G/L; bạch cầu bình thường.","e"],["Ferritin, sắt huyết thanh, độ bão hòa transferrin, TIBC",10,"Ferritin 4 ng/mL; sắt huyết thanh 4 umol/L; độ bão hòa transferrin 6%; TIBC tăng.","e"],["Phết máu ngoại vi",10,"Hồng cầu nhỏ, nhược sắc, thay đổi kích thước và hình dạng, có hồng cầu hình bút chì; không có hồng cầu non.","e"],["Xét nghiệm tìm máu ẩn trong phân và siêu âm vùng chậu",15,"Máu ẩn phân âm tính; siêu âm có nhân xơ tử cung 3 cm dưới niêm mạc.","e"],["Nội soi dạ dày đại tràng để tầm soát nguyên nhân mất máu tiêu hóa",20,"Chỉ định thêm khi không có triệu chứng tiêu hóa và nguyên nhân rõ là rong kinh, ưu tiên xử trí sau.","w"],["Chọc hút tủy xương để chẩn đoán thiếu máu",10,"Không cần thiết khi chẩn đoán đã rõ.","w"]],"opt":{"ydx":["+Thiếu máu thiếu sắt do mất máu kinh nguyệt kéo dài, nghi do nhân xơ tử cung","Thiếu máu do bệnh mạn tính","Thalassemia thể nhẹ","Thiếu máu bất sản"],"dieu_tri":["+Bổ sung sắt đường uống kèm vitamin C, điều trị nguyên nhân rong kinh, theo dõi đáp ứng huyết học","Truyền máu cho mọi bệnh nhân thiếu máu","Chỉ dùng vitamin B12 tiêm","Chỉ khuyên ăn nhiều thịt mà không cần thuốc"],"theo_doi":["+Hb tăng khoảng 1 g/dL sau 2 đến 3 tuần, duy trì sắt thêm 3 tháng sau khi Hb bình thường để bù kho dự trữ","Ngưng sắt khi Hb vừa bình thường","Không cần xét nghiệm lại","Chỉ theo dõi bằng cân nặng"]},"actions":["++Xác định thiếu máu thiếu sắt bằng công thức máu, ferritin và độ bão hòa transferrin|2|Hb thấp, MCV thấp, ferritin thấp xác định thiếu sắt.","++Tìm nguyên nhân mất máu: hỏi bệnh sử kinh nguyệt, siêu âm vùng chậu, hội chẩn sản phụ khoa|2|Thiếu sắt ở phụ nữ tuổi sinh đẻ thường do rong kinh; cần điều trị nguyên nhân.","+Bổ sung sắt nguyên tố đường uống 100 đến 200 mg/ngày hoặc cách ngày, kèm vitamin C|2|Điều trị chuẩn thiếu sắt mức độ trung bình đến nặng khi dung nạp được.","+Hướng dẫn tránh uống trà, cà phê, sữa cùng bữa sắt và dặn tác dụng phụ thường gặp|2|Tăng hấp thu và tuân thủ.","+Cân nhắc sắt tĩnh mạch nếu không dung nạp hoặc không đáp ứng sắt uống|1|Không phải bước đầu ở ca này nhưng là lựa chọn khi thất bại.","!Truyền khối hồng cầu thường quy rồi cho về không tìm nguyên nhân|0|Chỉ truyền máu khi thiếu máu nặng có triệu chứng; bỏ sót nguyên nhân sẽ tái diễn."],"teach":"Thiếu sắt là nguyên nhân thiếu máu thường gặp nhất; chẩn đoán dựa vào Hb thấp, MCV thấp, ferritin thấp. Luôn tìm nguyên nhân mất máu (kinh nguyệt ở nữ, tiêu hóa ở nam hoặc người lớn tuổi), điều trị nguyên nhân và bổ sung sắt đủ thời gian.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N18, nữ, 35 tuổi, nhân viên bán hàng; khám tại phòng khám nội tổng quát.","ly_do_vao_vien":"Mệt mỏi, hoa mắt, hồi hộp, kinh ra nhiều kéo dài.","benh_su":"Năm tháng nay người bệnh mệt, hoa mắt khi leo cầu thang, hồi hộp, khó tập trung, tăng dần. Tám tháng nay kinh nguyệt 8 đến 10 ngày, 8 đến 10 miếng băng/ngày, có máu cục. Hay thèm ăn đá, tóc rụng, móng gãy. Không nôn máu, không đi cầu phân đen, không dùng thuốc kháng viêm.","tien_su":"Hai lần sinh thường. Ăn ít thịt đỏ, uống trà đặc sau bữa. Chưa từng bổ sung sắt. Không bệnh mạn tính, không phẫu thuật. Gia đình không có bệnh huyết học.","luoc_qua_co_quan":"Tuần hoàn: hồi hộp khi gắng sức. Thần kinh: hoa mắt, khó tập trung. Tiêu hóa: không nuốt vướng, không đau bụng, không tiêu ra máu. Sinh dục: rong kinh. Da tóc móng: rụng tóc, móng gãy.","kham_hien_tai":"Tỉnh, da xanh, niêm mạc mắt và lòng bàn tay nhợt. Mạch 98 lần/phút, HA 104/62 mmHg, nhiệt độ 36,7 độ C, nhịp thở 18, SpO2 98%. Thổi tâm thu cơ năng 2/6 ở mỏm. Móng khum hình thìa nhẹ, viêm góc miệng, lưỡi nhẵn. Gan lách không to.","can_lam_sang":"Hb 7,6 g/dL, MCV 64 fL, MCH 19 pg, RDW 19%, tiểu cầu 460 G/L. Ferritin 4 ng/mL, sắt huyết thanh 4 umol/L, độ bão hòa transferrin 6%, TIBC tăng. Phết máu hồng cầu nhỏ nhược sắc. Máu ẩn phân âm tính. Siêu âm: nhân xơ dưới niêm mạc tử cung 3 cm.","tom_tat":"Nữ 35 tuổi, rong kinh 8 tháng, mệt, hoa mắt, hồi hộp, thèm ăn đá, rụng tóc, móng khum; da niêm nhợt; Hb 7,6, MCV 64, ferritin 4, độ bão hòa transferrin 6%, tiểu cầu tăng phản ứng; siêu âm có nhân xơ tử cung dưới niêm mạc; máu ẩn phân âm tính.","dat_van_de":"Thiếu máu hồng cầu nhỏ nhược sắc mức độ nặng; thiếu sắt; mất máu qua đường kinh nguyệt do nhân xơ tử cung; chế độ ăn kém sắt; cần điều trị nguyên nhân và bù sắt.","chan_doan_so_bo":"Thiếu máu thiếu sắt mức độ nặng do rong kinh, nghi nhân xơ tử cung dưới niêm mạc.","bien_luan":"Bước 1: xác định thiếu máu, da niêm nhợt, mệt, hoa mắt, hồi hộp, Hb 7,6 g/dL (dưới 12 g/dL ở nữ), mức độ nặng theo WHO (Hb dưới 8 g/dL). Bước 2: phân loại, MCV 64 fL, MCH thấp là thiếu máu hồng cầu nhỏ nhược sắc, nghĩ đến thiếu sắt, thalassemia, bệnh mạn tính, thiếu máu nguyên hồng cầu sắt. Bước 3: xác định thiếu sắt, ferritin 4 ng/mL (dưới 15 là thiếu sắt), độ bão hòa transferrin 6%, TIBC tăng; thiếu máu bệnh mạn tính có ferritin bình thường hoặc cao, TIBC giảm; thalassemia thể nhẹ có ferritin bình thường, hồng cầu tăng số lượng, RDW gần bình thường. Tiểu cầu tăng 460 G/L là phản ứng thường gặp. Bước 4: tìm nguyên nhân, rong kinh 8 tháng, siêu âm có nhân xơ tử cung, máu ẩn phân âm tính, không triệu chứng tiêu hóa nên mất máu kinh nguyệt là nguyên nhân chính, cộng thêm ăn ít sắt và uống trà ức chế hấp thu.","sinh_ly_benh":"Cơ thể người lớn có khoảng 3 đến 4 g sắt, chủ yếu trong hemoglobin; mất máu kinh nguyệt kéo dài làm mất sắt nhiều hơn hấp thu từ ăn uống. Kho dự trữ (ferritin) cạn trước, sau đó sắt huyết thanh và độ bão hòa transferrin giảm, tổng hợp heme giảm làm hồng cầu nhỏ và nhược sắc; thiếu sắt mô gây biến đổi móng, niêm mạc, biểu hiện pica. Tủy tăng sinh bù trừ kéo theo tiểu cầu tăng phản ứng. Thiếu máu làm giảm vận chuyển oxy dẫn đến tim nhanh, mệt, hoa mắt.","chan_doan_phan_biet":"Thalassemia thể nhẹ; thiếu máu bệnh mạn tính; thiếu máu nguyên hồng cầu sắt; ngộ độc chì; thiếu máu do mất máu tiêu hóa; cường giáp hoặc suy giáp gây mệt; thiếu máu do vitamin B12 hoặc folate (hồng cầu to).","chan_doan_xac_dinh":"Thiếu máu thiếu sắt mức độ nặng do rong kinh, nhân xơ tử cung dưới niêm mạc 3 cm.","dieu_tri":"Điều trị nguyên nhân: hội chẩn sản phụ khoa về nhân xơ tử cung, cân nhắc thuốc nội tiết, dụng cụ tử cung giải phóng levonorgestrel hoặc cắt nhân xơ nội soi. Bổ sung sắt đường uống 100 đến 200 mg sắt nguyên tố mỗi ngày hoặc cách ngày, uống xa bữa ăn, kèm vitamin C, tránh trà và sữa; theo dõi tác dụng phụ táo bón, đau thượng vị. Sắt tĩnh mạch nếu không dung nạp, không đáp ứng hoặc mất máu tiếp diễn. Truyền máu chỉ khi Hb dưới 7 g/dL kèm triệu chứng nặng hoặc huyết động không ổn; ca này huyết động ổn nên chưa cần truyền. Theo dõi Hb sau 2 đến 4 tuần, tiếp tục sắt 3 tháng sau khi Hb bình thường.","tien_luong":"Tốt nếu điều trị nguyên nhân và bù sắt đủ liều; Hb thường hồi phục sau 6 đến 8 tuần. Tái phát nếu rong kinh không được kiểm soát.","du_phong":"Chế độ ăn giàu sắt heme (thịt đỏ, gan, cá), vitamin C, hạn chế trà cà phê cùng bữa ăn; tầm soát và điều trị rong kinh; theo dõi định kỳ công thức máu và ferritin; tư vấn khi mang thai bổ sung sắt; giáo dục triệu chứng thiếu máu."},"nguon":["World Health Organization. Guideline on use of ferritin concentrations to assess iron status in individuals and populations. WHO 2020.","Camaschella C. Iron-deficiency anemia. N Engl J Med 2015;372:1832-43.","Bộ Y tế. Hướng dẫn chẩn đoán và điều trị thiếu máu thiếu sắt (tài liệu chuyên môn huyết học, cần đối chiếu số hiệu).","Giáo trình Huyết học - Truyền máu, các trường đại học Y Việt Nam."],"status":"nhap"},{"id":"noi-nhiem-001","title":"Sốt ngày thứ tư, đau bụng và nôn nhiều","kind":"Nội","level":"Trung bình","group":"noi","name":"Người bệnh mô phỏng N19","age":24,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu là giả định. Người bệnh nam 24 tuổi sống ở vùng có dịch sốt xuất huyết, nhập khoa Nhiễm vì sốt ngày thứ tư, đau bụng, nôn nhiều, sốt giảm nhưng người mệt hơn.","vitals":{"hr":104,"sbp":100,"dbp":74,"rr":20,"t":37.4,"spo2":98},"ask":[["Sốt bắt đầu từ khi nào và diễn tiến thế nào?","Sốt cao liên tục 4 ngày, hôm nay sốt giảm còn 37,4 độ C nhưng người mệt lả hơn.","e"],["Có đau bụng, nôn, chảy máu cam, chảy máu chân răng, kinh nguyệt bất thường, đi tiêu phân đen không?","Đau bụng vùng thượng vị và hạ sườn phải tăng dần, nôn 5 lần; chảy máu chân răng nhẹ, không phân đen.","e"],["Có lừ đừ, vật vã, chân tay lạnh, tiểu ít không?","Mệt lả, chóng mặt khi ngồi dậy, tiểu ít hơn bình thường.","e"],["Yếu tố dịch tễ: ở vùng có dịch, người xung quanh có sốt xuất huyết, bị muỗi đốt không?","Đồng nghiệp cùng phòng trọ vừa nhập viện vì sốt xuất huyết; khu trọ có nhiều lăng quăng.","e"],["Đã dùng thuốc hạ sốt gì, có dùng aspirin hoặc kháng viêm không?","Chỉ dùng paracetamol, không dùng aspirin, ibuprofen.","e"],["Có ho, đau họng, tiêu chảy, phát ban không?","Không ho, không tiêu chảy; chưa phát ban.","n"],["Có bệnh nền như đái tháo đường, tim mạch, béo phì không?","Không.","n"]],"exam":[["K","Tuần hoàn","Mạch 104 lần/phút nhẹ, huyết áp 100/74 mmHg (hiệu áp 26 mmHg), đầu chi mát, thời gian làm đầy mao mạch 3 giây.","e"],["K","Da niêm mạc","Da hồng, có vài chấm xuất huyết dưới da cẳng chân; nghiệm pháp dây thắt dương tính; chảy máu chân răng nhẹ.","e"],["K","Bụng","Ấn đau hạ sườn phải, gan to 2 cm dưới bờ sườn, mềm; không báng bụng rõ.","e"],["K","Phổi","Rì rào phế nang giảm nhẹ đáy phải, gõ đục nhẹ, gợi ý tràn dịch màng phổi ít.","e"],["K","Tri giác","Tỉnh, trả lời đúng, hơi mệt.","n"]],"tests":[["Công thức máu và hematocrit",10,"Hematocrit 48% (nền khoảng 41%); tiểu cầu 42 G/L; bạch cầu 3,2 G/L.","e"],["Test nhanh NS1 và IgM, IgG Dengue",10,"NS1 dương tính; IgM âm tính, IgG âm tính (nhiễm tiên phát).","e"],["AST, ALT, albumin, điện giải",10,"AST 196 U/L; ALT 142 U/L; albumin 33 g/L; Na 134 mmol/L.","e"],["Siêu âm bụng và màng phổi",15,"Dày thành túi mật 5 mm, dịch quanh túi mật; ít dịch màng phổi phải.","e"],["Cấy máu và CRP",10,"CRP 14 mg/L; cấy máu chờ kết quả.","n"],["Truyền tiểu cầu dự phòng vì tiểu cầu dưới 50 G/L khi không xuất huyết nặng",10,"Không có chỉ định; có thể gây quá tải dịch và không cải thiện kết cục.","w"]],"opt":{"ydx":["Viêm gan virus A cấp","+Sốt xuất huyết Dengue có dấu hiệu cảnh báo, giai đoạn nguy hiểm","Sốt rét do Plasmodium falciparum","Nhiễm khuẩn huyết do vi khuẩn Gram âm"],"dich":["+Truyền tinh thể đẳng trương theo phác đồ, bắt đầu 5 đến 7 mL/kg/giờ trong 1 đến 2 giờ rồi giảm dần theo đáp ứng","Truyền nhanh dịch 1000 mL trong 15 phút cho mọi trường hợp","Hạn chế dịch hoàn toàn vì sợ quá tải","Chỉ truyền dung dịch ưu trương"],"theo_doi":["+Theo dõi mạch, huyết áp, nước tiểu, hematocrit, tiểu cầu và dấu hiệu chảy máu mỗi 1 đến 2 giờ ở giai đoạn nguy hiểm","Chỉ theo dõi nhiệt độ","Chỉ theo dõi công thức máu mỗi tuần","Không cần theo dõi nội trú"]},"actions":["++Nhập viện theo dõi, đặt đường truyền, bắt đầu truyền dịch tinh thể theo phác đồ có dấu hiệu cảnh báo|2|Đau bụng, gan to, hematocrit tăng và tiểu cầu giảm là dấu hiệu cảnh báo, cần bù dịch sớm có kiểm soát.","++Theo dõi sát mạch, huyết áp, hiệu áp, nước tiểu, hematocrit, tiểu cầu mỗi 1 đến 2 giờ|2|Giai đoạn nguy hiểm dễ sốc do thoát huyết tương.","+Dùng paracetamol hạ sốt, tránh aspirin và kháng viêm không steroid|2|Tránh tăng nguy cơ xuất huyết và độc gan.","+Siêu âm bụng và màng phổi để đánh giá thoát huyết tương|2|Dày thành túi mật, dịch màng phổi hỗ trợ chẩn đoán.","+Chuẩn bị xử trí sốc: dịch tinh thể nhanh, đánh giá lại, cân nhắc chất keo khi sốc nặng|2|Hiệu áp kẹt và đầu chi mát cảnh báo sốc sắp xảy ra.","!Truyền tiểu cầu dự phòng và tiêm bắp thuốc giảm đau|0|Tiêm bắp gây tụ máu, truyền tiểu cầu không có chỉ định, làm quá tải dịch."],"teach":"Sốt xuất huyết Dengue diễn tiến qua ba giai đoạn: sốt, nguy hiểm, hồi phục. Dấu hiệu cảnh báo ở thời điểm hết sốt (đau bụng, nôn, gan to, hematocrit tăng kèm tiểu cầu giảm) đòi hỏi nhập viện, truyền dịch tinh thể có kiểm soát và theo dõi sát.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N19, nam, 24 tuổi, công nhân; nhập khoa Nhiễm.","ly_do_vao_vien":"Sốt ngày thứ tư, đau bụng, nôn nhiều.","benh_su":"Bốn ngày nay sốt cao liên tục, hôm nay sốt giảm nhưng mệt lả hơn, đau thượng vị và hạ sườn phải tăng dần, nôn 5 lần, chóng mặt khi ngồi dậy, tiểu ít, chảy máu chân răng nhẹ. Đồng nghiệp cùng phòng trọ mắc sốt xuất huyết. Chỉ dùng paracetamol.","tien_su":"Khỏe mạnh, chưa mắc sốt xuất huyết, không bệnh nền, không dị ứng thuốc, không dùng aspirin hay kháng viêm. Sống ở vùng có dịch.","luoc_qua_co_quan":"Tiêu hóa: đau bụng hạ sườn phải, nôn, không đi tiêu phân đen. Tuần hoàn: chóng mặt khi đổi tư thế. Tiết niệu: tiểu ít. Hô hấp: không ho. Da: chưa ban.","kham_hien_tai":"Tỉnh, mệt. Mạch 104 lần/phút, HA 100/74 mmHg (hiệu áp 26), nhiệt độ 37,4 độ C, nhịp thở 20, SpO2 98%. Đầu chi mát, làm đầy mao mạch 3 giây. Vài chấm xuất huyết ở cẳng chân, nghiệm pháp dây thắt dương tính, chảy máu chân răng. Gan to 2 cm, ấn đau hạ sườn phải. Giảm rì rào phế nang đáy phải.","can_lam_sang":"Hematocrit 48% (nền 41%), tiểu cầu 42 G/L, bạch cầu 3,2 G/L. NS1 dương tính. AST 196, ALT 142 U/L, albumin 33 g/L, Na 134. Siêu âm: dày thành túi mật, ít dịch màng phổi phải.","tom_tat":"Nam 24 tuổi, sống vùng dịch, sốt 4 ngày, hết sốt nhưng đau bụng, nôn, mệt, chảy máu chân răng; gan to đau, hiệu áp 26 mmHg, đầu chi mát; hematocrit tăng 17% so với nền, tiểu cầu 42 G/L, NS1 dương tính, men gan tăng; siêu âm có dấu thoát huyết tương nhẹ.","dat_van_de":"Sốt xuất huyết Dengue có dấu hiệu cảnh báo; giai đoạn nguy hiểm; thoát huyết tương nhẹ, nguy cơ sốc; giảm tiểu cầu; tổn thương gan nhẹ đến vừa.","chan_doan_so_bo":"Sốt xuất huyết Dengue có dấu hiệu cảnh báo, ngày thứ 4 của bệnh, giai đoạn nguy hiểm.","bien_luan":"Bước 1: dịch tễ và hội chứng, sốt cao 4 ngày ở người sống vùng dịch, có chấm xuất huyết, dây thắt dương tính, giảm tiểu cầu, giảm bạch cầu, NS1 dương tính xác nhận nhiễm Dengue. Bước 2: giai đoạn, sốt giảm vào ngày 4 đến 5 là thời điểm chuyển sang giai đoạn nguy hiểm, nguy cơ thoát huyết tương. Bước 3: dấu hiệu cảnh báo, đau bụng, nôn nhiều, gan to đau, hematocrit tăng cùng lúc tiểu cầu giảm nhanh, chảy máu niêm mạc, mệt lả. Bước 4: mức độ, huyết áp còn đo được nhưng hiệu áp kẹt (26 mmHg) và đầu chi mát, nên chưa sốc nhưng sát ngưỡng, xếp có dấu hiệu cảnh báo. Bước 5: chẩn đoán phân biệt, viêm gan virus (ít giảm tiểu cầu, ALT cao hơn nhiều), sốt rét, nhiễm khuẩn huyết.","sinh_ly_benh":"Virus Dengue (bốn type huyết thanh) lây qua muỗi Aedes. Virus nhân lên trong tế bào đơn nhân, kích hoạt đáp ứng miễn dịch quá mức với giải phóng cytokin (TNF, IL-6, IL-10), protein NS1 và hoạt hóa bổ thể làm tăng tính thấm thành mạch, gây thoát huyết tương, cô máu, tràn dịch màng phổi, màng bụng. Tiểu cầu giảm do ức chế tủy, bị phá hủy và hoạt hóa; rối loạn đông máu và tổn thương nội mô gây xuất huyết. Giai đoạn nguy hiểm kéo dài 24 đến 48 giờ.","chan_doan_phan_biet":"Viêm gan virus cấp; sốt rét; nhiễm khuẩn huyết; sốt phát ban do virus khác (sởi, rubella, chikungunya); leptospirosis; sốt thương hàn; bệnh rickettsia (sốt mò); nhiễm trùng đường mật.","chan_doan_xac_dinh":"Sốt xuất huyết Dengue có dấu hiệu cảnh báo (NS1 dương tính), thoát huyết tương nhẹ, chưa sốc; tổn thương gan và giảm tiểu cầu mức vừa.","dieu_tri":"Nhập viện. Truyền dung dịch tinh thể đẳng trương (Ringer lactate hoặc NaCl 0,9%) 5 đến 7 mL/kg/giờ trong 1 đến 2 giờ, đánh giá lại; nếu hematocrit giảm và ổn định thì giảm dần 3 đến 5 mL/kg/giờ, 2 đến 3 mL/kg/giờ; nếu hematocrit tăng, hiệu áp kẹt, tăng tốc độ. Paracetamol hạ sốt, không dùng aspirin, ibuprofen, không tiêm bắp. Theo dõi sinh hiệu, nước tiểu (mục tiêu trên 0,5 mL/kg/giờ), hematocrit mỗi 1 đến 2 giờ, tiểu cầu, men gan. Sốc: bù dịch nhanh 20 mL/kg trong 15 phút, cân nhắc chất keo. Chỉ truyền máu khi xuất huyết nặng hoặc hematocrit tụt không giải thích; không truyền tiểu cầu dự phòng.","tien_luong":"Tốt nếu xử trí đúng và không vào sốc; tử vong dưới 1% khi điều trị tốt. Nguy cơ sốc, xuất huyết nặng, suy gan và quá tải dịch khi truyền dịch không phù hợp.","du_phong":"Diệt lăng quăng, bọ gậy, ngủ màn, dùng thuốc xua muỗi; thông báo ổ dịch; giáo dục dấu hiệu nguy hiểm cần đến viện ngay (đau bụng, nôn, chảy máu, lừ đừ); tránh dùng aspirin và kháng viêm khi sốt; vaccin dengue theo khuyến cáo địa phương."},"nguon":["World Health Organization. Dengue: guidelines for diagnosis, treatment, prevention and control (new edition 2009) và cập nhật WHO 2012 Handbook for clinical management of dengue.","Bộ Y tế. Hướng dẫn chẩn đoán và điều trị sốt xuất huyết Dengue (Quyết định 3705/QĐ-BYT, 2019 và cập nhật).","Giáo trình Bệnh truyền nhiễm, các trường đại học Y Việt Nam."],"status":"nhap"},{"id":"noi-nhiem-002","title":"Sốt cao, đau đầu dữ dội và cứng gáy","kind":"Nội","level":"Khó","group":"noi","name":"Người bệnh mô phỏng N20","age":46,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu là giả định. Người bệnh nữ 46 tuổi nhập cấp cứu vì sốt cao 2 ngày, đau đầu dữ dội, nôn và cứng gáy sau đợt viêm tai giữa.","vitals":{"hr":112,"sbp":104,"dbp":62,"rr":24,"t":39.8,"spo2":96},"ask":[["Triệu chứng khởi phát và diễn tiến thế nào?","Sốt cao rét run 2 ngày, đau đầu dữ dội tăng dần, nôn vọt, sợ ánh sáng; sáng nay lơ mơ.","e"],["Có viêm tai, viêm xoang, chấn thương đầu hoặc phẫu thuật thần kinh gần đây không?","Đau tai phải, chảy mủ tai một tuần, chưa điều trị; không chấn thương đầu.","e"],["Có co giật, yếu liệt, nói khó không?","Không co giật, không yếu liệt, nói chậm hơn.","e"],["Có phát ban, chấm xuất huyết da không?","Không có.","e"],["Tiền sử bệnh nền, suy giảm miễn dịch, cắt lách, nghiện rượu, tiêm phòng?","Khỏe mạnh, không bệnh nền; chưa tiêm phòng phế cầu.","e"],["Có dị ứng thuốc, nhất là kháng sinh không?","Không.","e"],["Có tiếp xúc người bị viêm màng não hoặc đi vùng dịch không?","Không.","n"]],"exam":[["K","Tri giác","GCS 13 (E3 V4 M6), lơ mơ, trả lời chậm, không dấu thần kinh khu trú.","e"],["K","Dấu màng não","Cứng gáy rõ, dấu Kernig và Brudzinski dương tính.","e"],["K","Đáy mắt và đồng tử","Đồng tử hai bên đều, phản xạ ánh sáng tốt; không phù gai thị.","e"],["K","Tai mũi họng","Tai phải chảy mủ, màng nhĩ thủng, ấn xương chũm đau.","e"],["K","Da","Không ban, không xuất huyết da.","n"]],"tests":[["Cấy máu hai bộ và công thức máu, CRP, đường huyết, điện giải",10,"Bạch cầu 21,6 G/L (đa nhân 92%); CRP 245 mg/L; glucose máu 6,4 mmol/L; Na 133 mmol/L.","e"],["Chọc dò dịch não tủy: áp lực, tế bào, protein, glucose, Gram, cấy",10,"Áp lực mở 32 cmH2O; đục; bạch cầu 2800/mm3 (đa nhân 90%); protein 3,6 g/L; glucose 1,0 mmol/L (tỷ lệ với máu 0,16); Gram thấy cầu khuẩn Gram dương xếp đôi.","e"],["CT sọ não có cản quang",40,"Không khối choán chỗ, không thoát vị; dày màng não, mờ xương chũm phải.","e"],["Procalcitonin hoặc lactate máu",10,"Lactate 3,0 mmol/L; procalcitonin tăng cao.","n"],["Chọc dò dịch não tủy bắt buộc sau khi chờ kết quả CT, hoãn kháng sinh đến khi có Gram",40,"Không được hoãn kháng sinh quá 1 giờ khi nghi ngờ cao viêm màng não mủ.","w"]],"opt":{"ydx":["Viêm màng não do virus","Xuất huyết dưới nhện","+Viêm màng não mủ do cầu khuẩn phế cầu, biến chứng từ viêm tai giữa mạn","Viêm màng não do lao"],"khang_sinh":["+Ceftriaxone liều cao phối hợp vancomycin, kèm dexamethasone trước hoặc cùng liều kháng sinh đầu","Chỉ dùng azithromycin đường uống","Acyclovir đơn độc","Chờ cấy rồi mới dùng kháng sinh"],"dex":["+Dexamethasone 0,15 mg/kg mỗi 6 giờ trong 4 ngày, bắt đầu 10 đến 20 phút trước hoặc cùng liều kháng sinh đầu","Dexamethasone sau 24 giờ kháng sinh","Chỉ cho dexamethasone khi sốc","Không bao giờ dùng corticoid trong viêm màng não"]},"actions":["++Lấy cấy máu rồi dùng ngay kháng sinh tĩnh mạch (ceftriaxone phối hợp vancomycin), không chờ kết quả chọc dò nếu phải trì hoãn|2|Viêm màng não mủ là cấp cứu; trì hoãn kháng sinh làm tăng tử vong và di chứng.","++Dùng dexamethasone cùng liều kháng sinh đầu tiên|2|Giảm viêm và di chứng thần kinh, mất thính lực, đặc biệt trong viêm màng não phế cầu.","+Chọc dò dịch não tủy khi không có chống chỉ định (không dấu thần kinh khu trú, không phù gai, không rối loạn đông máu) hoặc sau CT|2|Cung cấp chẩn đoán và hướng dẫn kháng sinh.","+Hội chẩn tai mũi họng về viêm tai giữa, viêm xương chũm|2|Nguồn nhiễm cần kiểm soát bằng phẫu thuật nếu cần.","+Theo dõi thần kinh, co giật, natri, chống phù não và bù dịch hợp lý|2|Có nguy cơ tăng áp lực nội sọ, hạ natri do SIADH, co giật.","!Chỉ dùng paracetamol, cho thuốc an thần và theo dõi tại nhà|0|Bỏ sót cấp cứu, đe dọa tính mạng."],"teach":"Viêm màng não mủ cần dùng kháng sinh trong vòng 1 giờ sau khi nghi ngờ, kèm dexamethasone. Nếu không có dấu hiệu thoát vị hoặc chống chỉ định, chọc dò dịch não tủy; kết quả điển hình: đục, bạch cầu đa nhân tăng, protein tăng, glucose giảm.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N20, nữ, 46 tuổi, nhân viên kế toán; nhập khoa Cấp cứu rồi Nhiễm.","ly_do_vao_vien":"Sốt cao, đau đầu dữ dội, cứng gáy.","benh_su":"Một tuần trước đau tai phải, chảy mủ chưa điều trị. Hai ngày nay sốt cao rét run, đau đầu dữ dội tăng dần, nôn vọt, sợ ánh sáng; sáng nay lơ mơ, trả lời chậm. Không co giật, không yếu liệt, không ban da.","tien_su":"Khỏe mạnh, không bệnh nền, không suy giảm miễn dịch, chưa tiêm phòng phế cầu. Không chấn thương đầu, không phẫu thuật thần kinh. Không dị ứng thuốc.","luoc_qua_co_quan":"Thần kinh: đau đầu, lơ mơ. Tai mũi họng: chảy mủ tai phải. Tiêu hóa: nôn vọt. Hô hấp: không ho. Da: không ban.","kham_hien_tai":"GCS 13, lơ mơ. Mạch 112 lần/phút, HA 104/62 mmHg, nhiệt độ 39,8 độ C, nhịp thở 24, SpO2 96%. Cứng gáy rõ, Kernig và Brudzinski dương tính. Đồng tử đều, không phù gai thị, không dấu thần kinh khu trú. Tai phải chảy mủ, thủng màng nhĩ, ấn xương chũm đau.","can_lam_sang":"Bạch cầu 21,6 G/L (đa nhân 92%), CRP 245 mg/L, glucose máu 6,4 mmol/L, Na 133. Dịch não tủy: áp lực 32 cmH2O, đục, 2800 bạch cầu/mm3 (đa nhân 90%), protein 3,6 g/L, glucose 1,0 mmol/L, Gram cầu khuẩn Gram dương xếp đôi. CT sọ không thoát vị.","tom_tat":"Nữ 46 tuổi, viêm tai giữa chảy mủ không điều trị, sốt cao 2 ngày, đau đầu dữ dội, nôn, lơ mơ (GCS 13); hội chứng màng não dương tính, không dấu thần kinh khu trú; dịch não tủy đục, bạch cầu đa nhân 2800, protein 3,6 g/L, glucose 1,0 mmol/L, Gram cầu khuẩn Gram dương xếp đôi; CT sọ không có thoát vị.","dat_van_de":"Hội chứng nhiễm khuẩn nặng; hội chứng màng não; viêm màng não mủ do phế cầu từ nguồn tai; rối loạn tri giác, tăng áp lực nội sọ; hạ natri; nguy cơ co giật và di chứng.","chan_doan_so_bo":"Viêm màng não mủ, nghi do Streptococcus pneumoniae, nguồn gốc từ viêm tai giữa mạn.","bien_luan":"Bước 1: hội chứng, sốt cao, đau đầu, nôn vọt, cứng gáy, Kernig, Brudzinski dương tính là hội chứng màng não; rối loạn ý thức cho thấy nặng. Bước 2: định tính qua dịch não tủy, đục, bạch cầu 2800 chủ yếu đa nhân, protein 3,6 g/L, glucose 1,0 mmol/L (tỷ lệ glucose dịch não tủy/máu 0,16, dưới 0,4) là mẫu hình viêm màng não vi khuẩn; viêm màng não virus thường bạch cầu dưới 300, lympho ưu thế, glucose bình thường; lao màng não tiến triển bán cấp, lympho ưu thế. Bước 3: tác nhân, Gram cầu khuẩn Gram dương xếp đôi gợi ý phế cầu, phù hợp nguồn tai và chưa tiêm phòng phế cầu. Bước 4: nguồn nhiễm, viêm tai giữa chảy mủ, ấn xương chũm đau, CT mờ xương chũm; có thể có viêm xương chũm. Bước 5: biến chứng, áp lực mở 32 cmH2O gợi ý tăng áp lực nội sọ; CT không khối choán chỗ, Na 133 gợi ý SIADH; theo dõi tràn mủ não, áp xe não, huyết khối xoang tĩnh mạch.","sinh_ly_benh":"Vi khuẩn lan từ tai giữa vào khoang dưới nhện qua đường máu hoặc trực tiếp theo xương chũm. Trong dịch não tủy, thiếu bổ thể và kháng thể nên vi khuẩn nhân lên; thành phần vỏ khuẩn kích hoạt tế bào thần kinh đệm, giải phóng cytokin (TNF, IL-1) làm tăng tính thấm hàng rào máu não, phù não, thâm nhiễm bạch cầu đa nhân. Glucose giảm do bạch cầu và vi khuẩn sử dụng, giảm vận chuyển; protein tăng do tăng tính thấm. Giảm hấp thu dịch não tủy gây tăng áp lực nội sọ. Hậu quả là giảm tưới máu não, viêm mạch, huyết khối và mất thính lực.","chan_doan_phan_biet":"Viêm màng não virus; lao màng não; viêm màng não do Cryptococcus; xuất huyết dưới nhện; áp xe não; viêm não do herpes; viêm màng não do Neisseria meningitidis; sốt rét thể não.","chan_doan_xac_dinh":"Viêm màng não mủ do phế cầu (nghi cao, chờ cấy dịch não tủy), biến chứng từ viêm tai giữa mạn, có tăng áp lực nội sọ và hạ natri.","dieu_tri":"Cấp cứu: lấy cấy máu rồi dùng ngay kháng sinh tĩnh mạch trong vòng 1 giờ, ceftriaxone 2 g mỗi 12 giờ phối hợp vancomycin 15 đến 20 mg/kg mỗi 8 đến 12 giờ (theo chức năng thận, đo nồng độ đáy). Dexamethasone 0,15 mg/kg mỗi 6 giờ trong 4 ngày, bắt đầu cùng hoặc trước liều kháng sinh đầu. Điều chỉnh theo kháng sinh đồ; thời gian 10 đến 14 ngày với phế cầu. Nâng đầu 30 độ, theo dõi thần kinh, chống co giật khi cần, bù dịch đẳng trương, theo dõi natri. Hội chẩn tai mũi họng về viêm xương chũm, dẫn lưu nếu cần. Kiểm tra thính lực.","tien_luong":"Dè dặt; viêm màng não phế cầu có tử vong 15 đến 30% và di chứng thần kinh, giảm thính lực ở 20 đến 30% người sống sót; tiên lượng tốt hơn khi điều trị kháng sinh sớm.","du_phong":"Tiêm vaccin phế cầu cho người trưởng thành có nguy cơ và người có nguồn nhiễm tai mạn tính; điều trị triệt để viêm tai giữa; kiểm tra thính lực sau điều trị; theo dõi di chứng; báo cáo ca bệnh; hóa dự phòng cho người tiếp xúc gần chỉ cần khi tác nhân là não mô cầu."},"nguon":["van de Beek D, et al. ESCMID guideline: diagnosis and treatment of acute bacterial meningitis. Clin Microbiol Infect 2016;22 Suppl 3:S37-62.","Tunkel AR, et al. Practice guidelines for the management of bacterial meningitis. IDSA. Clin Infect Dis 2004;39:1267-84.","Bộ Y tế. Hướng dẫn chẩn đoán và điều trị viêm màng não mủ (Quyết định 4132/QĐ-BYT, 2018 hoặc bản hiện hành, cần đối chiếu).","Giáo trình Bệnh truyền nhiễm, các trường đại học Y Việt Nam."],"status":"nhap"},{"id":"ngoai-bung-001","title":"Đau bụng chuyển xuống hố chậu phải","kind":"Ngoại","level":"Dễ","group":"ngoai","name":"Người bệnh mô phỏng B. V. T.","age":24,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Nam thanh niên đến khám vì đau bụng từ quanh rốn chuyển xuống hố chậu phải 18 giờ, kèm sốt nhẹ và nôn.","vitals":{"hr":98,"sbp":120,"dbp":75,"rr":20,"t":38.1,"spo2":99},"ask":[["Đau bụng bắt đầu từ đâu, diễn tiến thế nào?","Đau âm ỉ quanh rốn từ tối qua, khoảng 8 giờ sau khu trú dần xuống hố chậu phải, đau tăng khi ho hoặc đi lại.","e"],["Có buồn nôn, nôn hoặc chán ăn không?","Chán ăn từ tối qua, buồn nôn, nôn hai lần ra thức ăn, nôn xong đau không giảm.","e"],["Có sốt, rối loạn đại tiện hoặc tiểu buốt không?","Sốt nhẹ khoảng 38 độ, đi cầu phân sệt một lần, không tiểu buốt, không tiểu máu.","e"],["Có tiền sử mổ bụng, bệnh dạ dày hoặc sỏi tiết niệu không?","Chưa từng mổ, không loét dạ dày, không đau quặn thận trước đây.","e"],["Lần ăn cuối và có dùng thuốc giảm đau không?","Ăn cơm trưa hôm qua; chưa dùng thuốc giảm đau, chưa dùng kháng sinh.","n"],["Có dị ứng thuốc không?","Không dị ứng thuốc, thức ăn.","e"],["Có ho, khó thở hoặc người nhà bị tiêu chảy cùng lúc không?","Không ho, không khó thở, không ai trong nhà tiêu chảy.","n"]],"exam":[["K","Khám bụng: ấn đau và phản ứng thành bụng","Ấn đau khu trú hố chậu phải ở điểm McBurney, có co cứng nhẹ thành bụng và phản ứng dội (+).","e"],["K","Các dấu hiệu gián tiếp","Dấu Rovsing (+), dấu cơ thắt lưng chậu (+) nhẹ.","e"],["K","Toàn trạng và dấu hiệu sinh tồn","Tỉnh, vẻ mặt đau, môi khô nhẹ, mạch 98 lần/phút, nhiệt độ 38,1 độ C.","e"],["K","Thăm trực tràng","Ấn đau thành phải trực tràng, không có khối, găng không dính máu.","n"],["K","Tim và phổi","Tim đều, phổi thông khí rõ, không ran.","n"],["K","Bìu và vùng bẹn","Hai tinh hoàn bình thường, không đau, không khối thoát vị.","n"]],"tests":[["Công thức máu và CRP",10,"Bạch cầu 14,2 G/L, bạch cầu đa nhân trung tính 84%; CRP 62 mg/L.","e"],["Siêu âm bụng bằng đầu dò ép từng lớp",15,"Ruột thừa đường kính 9 mm, không xẹp khi ép, thành dày, có ít dịch quanh ruột thừa; thận và đường mật bình thường.","e"],["Tổng phân tích nước tiểu",10,"Không hồng cầu, bạch cầu hay nitrit.","n"],["Điện giải đồ và creatinin",10,"Na 137, K 3,8 mmol/L; creatinin 82 µmol/L.","n"],["Chụp CT bụng có thuốc cản quang ngay cho mọi người trẻ không có chỉ định đặc biệt",40,"Không cần thiết khi lâm sàng và siêu âm đã rõ; tăng phơi nhiễm bức xạ.","w"],["Chụp X quang bụng đứng thường quy tìm nguyên nhân",10,"Không có giá trị định hướng, không thay đổi xử trí.","w"]],"opt":{"ydx":["Viêm hạch mạc treo ruột","Sỏi niệu quản phải","+Viêm ruột thừa cấp chưa biến chứng","Viêm dạ dày ruột cấp"],"xu_tri":["Dùng kháng sinh đường uống và cho về theo dõi tại nhà","+Nhịn ăn, bù dịch, giảm đau, kháng sinh dự phòng và mổ cắt ruột thừa sớm","Chờ 3 ngày xem đau có tự giảm không","Chụp thêm nhiều cận lâm sàng rồi mới quyết định"],"phuong_phap_mo":["Mổ mở đường giữa dưới rốn là bắt buộc trong mọi trường hợp","Chỉ dẫn lưu hố chậu phải không cắt ruột thừa","Cắt manh tràng dự phòng","+Cắt ruột thừa nội soi, cắt từ gốc, kiểm tra ổ bụng"]},"actions":["++Nhịn ăn uống, đặt đường truyền, bù dịch tinh thể|2|Người bệnh nôn, môi khô, cần bù dịch trước mổ.","++Hội chẩn ngoại khoa và chuẩn bị mổ sớm|2|Chẩn đoán đã rõ, mổ sớm giảm nguy cơ vỡ ruột thừa.","+Kháng sinh trước mổ một liều phù hợp, ví dụ cephalosporin phối hợp metronidazol|2|Giảm nhiễm trùng vết mổ và áp xe tồn dư.","+Giảm đau đường tĩnh mạch, không che lấp dấu hiệu khám|1|Giảm đau không làm sai lệch chẩn đoán khi đã khám kỹ.","-Chụp X quang bụng đứng thường quy|1|Không giúp xác định chẩn đoán và không thay đổi hướng xử trí.","-Cho thuốc nhuận tràng để làm sạch ruột|0|Không có chỉ định, có thể làm tăng nguy cơ vỡ.","!Cho uống thuốc nhuận tràng, chườm nóng và về nhà theo dõi|0|Chườm nóng và nhuận tràng làm tăng nguy cơ vỡ ruột thừa."],"teach":"Đau chuyển từ quanh rốn xuống hố chậu phải kèm chán ăn, nôn, sốt nhẹ, bạch cầu tăng gợi viêm ruột thừa; điểm Alvarado 10 điểm. Siêu âm đủ để quyết định ở người trẻ, mổ sớm trước khi vỡ.","hbu":{"hanh_chinh":"Người bệnh mô phỏng B. V. T., nam, 24 tuổi, nhân viên văn phòng; nhập khoa Ngoại tiêu hóa qua phòng khám cấp cứu.","ly_do_vao_vien":"Đau bụng hố chậu phải 18 giờ kèm sốt nhẹ và nôn.","benh_su":"Tối hôm trước đau âm ỉ quanh rốn, chán ăn, buồn nôn. Sau khoảng 8 giờ đau chuyển xuống hố chậu phải, tăng khi ho và đi lại, nôn hai lần, sốt khoảng 38 độ C, đi cầu phân sệt một lần. Chưa dùng thuốc giảm đau hay kháng sinh. Đến viện sau 18 giờ từ khi khởi phát.","tien_su":"Khỏe mạnh, chưa từng phẫu thuật bụng, không dị ứng thuốc, không dùng thuốc thường xuyên, không hút thuốc nhiều.","luoc_qua_co_quan":"Không ho, khó thở; không tiểu buốt, tiểu máu; không vàng da; không sụt cân gần đây.","kham_hien_tai":"Tỉnh, mạch 98 lần/phút, huyết áp 120/75 mmHg, nhiệt độ 38,1 độ C, nhịp thở 20 lần/phút, SpO2 99%. Bụng không chướng; ấn đau khu trú điểm McBurney, co cứng nhẹ và phản ứng dội (+); dấu Rovsing (+), dấu cơ thắt lưng chậu (+). Thăm trực tràng đau thành phải. Bìu bình thường.","can_lam_sang":"Bạch cầu 14,2 G/L, đa nhân trung tính 84%, CRP 62 mg/L; điện giải và creatinin bình thường; nước tiểu bình thường. Siêu âm đầu dò ép: ruột thừa 9 mm không xẹp, thành dày, ít dịch quanh.","tom_tat":"Nam 24 tuổi đau bụng 18 giờ, đau chuyển từ quanh rốn xuống hố chậu phải, chán ăn, nôn, sốt nhẹ; khám có điểm đau McBurney, phản ứng dội, dấu Rovsing (+); bạch cầu tăng, CRP tăng; siêu âm ruột thừa 9 mm không xẹp. Điểm Alvarado 10.","dat_van_de":"Hội chứng bụng ngoại khoa cấp khu trú hố chậu phải; hội chứng nhiễm trùng; cần phân biệt nguyên nhân và quyết định mổ.","chan_doan_so_bo":"Viêm ruột thừa cấp chưa có dấu hiệu viêm phúc mạc toàn thể.","bien_luan":"Bước 1: có đau bụng cấp ngoại khoa vì đau tăng dần, khu trú, kèm phản ứng thành bụng. Bước 2: diễn tiến điển hình đau quanh rốn rồi chuyển hố chậu phải, chán ăn, nôn, sốt nhẹ cho 4 điểm (di chuyển 1, chán ăn 1, buồn nôn 1, sốt 1) cộng đau hố chậu phải 2, phản ứng dội 1, bạch cầu tăng 2, tăng đa nhân 1: tổng 10 điểm, rất cao. Bước 3: siêu âm xác nhận ruột thừa 9 mm (trên 6 mm), không xẹp, có dịch quanh, đủ để quyết định ở người trẻ, không cần CT. Bước 4: chưa có dấu hiệu vỡ (không co cứng lan tỏa, mạch dưới 100, thời gian dưới 24 giờ), nên là viêm ruột thừa chưa biến chứng, chỉ định mổ sớm.","sinh_ly_benh":"Tắc lòng ruột thừa do sỏi phân, tăng sản mô lympho hoặc dị vật làm ứ dịch tiết, tăng áp lực trong lòng, cản trở hồi lưu tĩnh mạch và bạch huyết, thành phù nề. Vi khuẩn đường ruột (E. coli, Bacteroides) nhân lên, viêm lan qua các lớp thành tới thanh mạc, kích thích phúc mạc tạng nên đau quanh rốn; khi viêm chạm phúc mạc thành thì đau khu trú hố chậu phải. Áp lực tiếp tục tăng gây thiếu máu, hoại tử và thủng nếu không xử trí, thường sau 24 đến 72 giờ.","chan_doan_phan_biet":"Viêm hạch mạc treo, sỏi niệu quản phải, viêm dạ dày ruột, viêm túi thừa Meckel, viêm hồi tràng, xoắn tinh hoàn bên phải ở nam; ở nữ cần thêm bệnh lý phụ khoa. Các bệnh này ít có phản ứng dội kèm hình ảnh ruột thừa không xẹp.","chan_doan_xac_dinh":"Viêm ruột thừa cấp chưa biến chứng, điểm Alvarado 10, xác nhận bằng siêu âm; xác định giải phẫu bệnh sau mổ.","dieu_tri":"Nhịn ăn, truyền dịch tinh thể bù nước và điện giải, giảm đau tĩnh mạch. Kháng sinh dự phòng trước mổ (cephalosporin thế hệ 2 hoặc 3 phối hợp metronidazol) trong vòng 60 phút trước rạch da. Chỉ định mổ cắt ruột thừa nội soi sớm, tốt nhất trong 24 giờ; có thể mổ mở nếu thiếu điều kiện. Không cần tiếp tục kháng sinh sau mổ nếu ruột thừa chưa thủng. Hậu phẫu: theo dõi mạch, nhiệt độ, đau bụng; cho uống sau 6 đến 12 giờ khi có nhu động; xuất viện thường trong 24 đến 48 giờ; theo dõi vết mổ. Kháng sinh đơn thuần chỉ cân nhắc trong chọn lọc, giải thích nguy cơ tái phát khoảng một phần ba trong một năm.","tien_luong":"Tốt, tỷ lệ biến chứng thấp khi mổ trước khi vỡ; nguy cơ nhiễm trùng vết mổ và áp xe tồn dư tăng nếu chậm trễ.","du_phong":"Không có biện pháp dự phòng đặc hiệu. Hướng dẫn người bệnh đến khám sớm khi đau bụng kéo dài, tránh tự dùng thuốc giảm đau hoặc nhuận tràng; tái khám tại 2 tuần, theo dõi vết mổ."},"nguon":["Di Saverio S et al. Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines. World J Emerg Surg 2020.","Giáo trình Bệnh học Ngoại khoa, Đại học Y Hà Nội, phần Cấp cứu bụng - Viêm ruột thừa cấp.","Townsend CM et al. Sabiston Textbook of Surgery, 21st edition, 2022, chương Appendix."],"status":"nhap"},{"id":"ngoai-bung-002","title":"Đau quặn bụng, nôn và bí trung đại tiện sau mổ cũ","kind":"Ngoại","level":"Trung bình","group":"ngoai","name":"Người bệnh mô phỏng N. T. L.","age":58,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Nữ 58 tuổi từng mổ cắt tử cung đường bụng, nhập viện vì đau quặn bụng, nôn và không đánh hơi, không đi cầu 2 ngày.","vitals":{"hr":104,"sbp":105,"dbp":65,"rr":20,"t":37.4,"spo2":98},"ask":[["Đau bụng có tính chất gì, có từng cơn không?","Đau quặn từng cơn quanh rốn, mỗi cơn vài phút, xen kẽ lúc dịu; hai ngày nay tăng dần.","e"],["Có nôn không, nôn ra gì?","Nôn nhiều lần, ban đầu thức ăn, sau chuyển dịch vàng xanh, nôn xong dễ chịu hơn một chút.","e"],["Có đánh hơi và đi cầu được không?","Không trung tiện, không đi cầu từ hai ngày nay.","e"],["Có tiền sử phẫu thuật bụng hoặc xạ trị vùng chậu không?","Mổ cắt tử cung toàn phần đường bụng cách đây 10 năm do u xơ; không xạ trị.","e"],["Từng có đợt tương tự trước đây không?","Một lần cách đây 3 năm, tự hết sau nhịn ăn 1 ngày ở tuyến dưới.","e"],["Có sút cân, đi cầu phân máu hoặc thay đổi thói quen đại tiện kéo dài không?","Không sút cân, không phân máu, trước đó đi cầu bình thường.","n"],["Có dùng thuốc nhuận tràng, thuốc opioid hoặc bệnh tuyến giáp, đái tháo đường không?","Không dùng opioid, không bệnh nội khoa nền.","n"]],"exam":[["K","Khám bụng: nhìn, sờ","Bụng chướng vừa, sẹo mổ đường giữa dưới rốn cũ; ấn đau lan tỏa nhẹ, không co cứng, không phản ứng dội.","e"],["K","Nghe nhu động ruột","Nhu động ruột tăng, âm sắc cao, có tiếng nước óc ách.","e"],["K","Khám vùng bẹn, đùi và sẹo mổ","Không có khối thoát vị bẹn, đùi, thành bụng.","e"],["K","Thăm trực tràng","Bóng trực tràng rỗng, không khối, găng không dính máu.","e"],["K","Dấu hiệu mất nước","Môi khô, niêm mạc khô, da nhăn nhẹ, tiểu ít.","n"],["K","Tim phổi","Tim nhanh đều, phổi trong.","n"]],"tests":[["X quang bụng đứng không chuẩn bị",10,"Nhiều mức nước hơi hình bậc thang ở vùng giữa bụng, quai ruột non giãn, ít hơi ở đại tràng.","e"],["CT bụng có thuốc cản quang",40,"Ruột non giãn 3,3 cm trên đoạn gần, có điểm chuyển tiếp từ giãn sang xẹp ở hố chậu phải theo dải dính, đoạn xa xẹp; thành ruột ngấm thuốc đều, ít dịch tự do, không khí trong thành ruột.","e"],["Công thức máu, điện giải, creatinin, lactate",10,"Bạch cầu 11,2 G/L; Na 134, K 3,2 mmol/L; creatinin 108 µmol/L; lactate 1,6 mmol/L.","e"],["Đường huyết và khí máu",10,"Đường huyết 6,1 mmol/L; pH 7,41, HCO3 24 mmol/L.","n"],["Nội soi đại tràng ngay lập tức",20,"Không có chỉ định cấp cứu khi chưa nghi nguyên nhân đại tràng, nguy cơ thủng.","w"],["Cho uống thuốc cản quang bari để chụp ruột",10,"Chống chỉ định trong tắc ruột có thể mổ, nguy cơ tắc hoàn toàn và viêm phúc mạc bari.","w"]],"opt":{"ydx":["Liệt ruột cơ năng sau viêm phúc mạc","Tắc ruột do khối u đại tràng","+Tắc ruột non do dính sau mổ, chưa có dấu hiệu nghẹt","Viêm tụy cấp"],"xu_tri_ban_dau":["Cho uống thuốc nhuận tràng mạnh và ăn lỏng","+Nhịn ăn, đặt sonde dạ dày hút, bù dịch và điện giải, theo dõi sát","Mổ cấp cứu ngay không cần hồi sức","Dùng thuốc giảm nhu động ruột và cho về"],"chi_dinh_mo":["Chỉ mổ khi đã qua 7 ngày điều trị nội khoa","Mổ bắt buộc cho mọi trường hợp tắc ruột","+Mổ cấp cứu khi có dấu hiệu nghẹt, viêm phúc mạc hoặc điều trị bảo tồn thất bại sau khoảng 72 giờ","Không bao giờ mổ vì dính sẽ tái phát"]},"actions":["++Nhịn ăn uống, đặt đường truyền và bù dịch Ringer lactat|2|Người bệnh mất nước và hạ kali, cần bù dịch ngay.","++Đặt sonde dạ dày hút dịch giảm áp|2|Giảm chướng, giảm nôn, giảm nguy cơ hít sặc.","+Bù kali và theo dõi điện giải mỗi 12 giờ|2|Hạ kali 3,2 làm nặng liệt ruột và loạn nhịp.","+Khám lại bụng mỗi 4 đến 6 giờ, theo dõi mạch, nhiệt độ, lactate và lượng dịch dẫn lưu|2|Phát hiện sớm dấu hiệu nghẹt hoặc thủng.","+Cân nhắc thuốc cản quang tan trong nước đường uống có đánh giá sau 24 giờ|2|Vừa tiên lượng vừa có thể điều trị tắc bán phần.","-Cho thụt tháo và thuốc nhuận tràng mạnh|0|Không hiệu quả trong tắc cơ học ruột non.","!Cho uống thuốc cản quang bari|0|Nguy cơ tắc hoàn toàn và viêm phúc mạc do bari nếu thủng."],"teach":"Tiền sử mổ bụng, đau quặn từng cơn, nôn, bí trung đại tiện, chướng bụng là bộ khung của tắc ruột cơ học; dính sau mổ là nguyên nhân thường gặp nhất. Cần phân biệt tắc đơn thuần với nghẹt để quyết định mổ sớm hay điều trị bảo tồn có kiểm soát.","hbu":{"hanh_chinh":"Người bệnh mô phỏng N. T. L., nữ, 58 tuổi, nội trợ; nhập khoa Ngoại tiêu hóa từ phòng cấp cứu.","ly_do_vao_vien":"Đau quặn bụng, nôn và bí trung đại tiện hai ngày.","benh_su":"Hai ngày nay đau quặn từng cơn quanh rốn, tăng dần, kèm nôn nhiều lần, ban đầu thức ăn rồi dịch vàng xanh, không trung tiện, không đi cầu, bụng chướng dần. Trước đó đi cầu bình thường, không sút cân, không phân máu. Từng có một đợt tương tự cách đây 3 năm tự hết. Không sốt cao.","tien_su":"Mổ cắt tử cung toàn phần đường bụng cách 10 năm. Không đái tháo đường, không tăng huyết áp, không xạ trị vùng chậu, không dùng opioid. Chưa phát hiện thoát vị.","luoc_qua_co_quan":"Tiểu ít, khát nước; không đau ngực, không khó thở, không vàng da.","kham_hien_tai":"Mạch 104 lần/phút, huyết áp 105/65 mmHg, nhiệt độ 37,4 độ C, nhịp thở 20 lần/phút. Môi khô. Bụng chướng vừa, sẹo mổ giữa dưới rốn; ấn đau nhẹ lan tỏa, không phản ứng thành bụng; nhu động ruột tăng, có tiếng nước óc ách. Không thoát vị bẹn, đùi. Thăm trực tràng bóng rỗng.","can_lam_sang":"X quang bụng đứng: nhiều mức nước hơi hình bậc thang, ruột non giãn. CT bụng có cản quang: ruột non giãn 3,3 cm, điểm chuyển tiếp ở hố chậu phải theo dải dính, đoạn xa xẹp, thành ruột ngấm thuốc đều, ít dịch tự do. Bạch cầu 11,2 G/L; Na 134, K 3,2 mmol/L; creatinin 108 µmol/L; lactate 1,6 mmol/L.","tom_tat":"Nữ 58 tuổi, mổ cắt tử cung 10 năm, vào vì đau quặn cơn, nôn, bí trung đại tiện 2 ngày; bụng chướng, nhu động tăng, thăm trực tràng rỗng; CT thấy ruột non giãn có điểm chuyển tiếp do dải dính, chưa có dấu hiệu thiếu máu thành ruột; có mất nước, hạ natri và hạ kali nhẹ.","dat_van_de":"Hội chứng tắc ruột cơ học; nguyên nhân dính sau mổ; mức độ tắc đơn thuần hay nghẹt; rối loạn nước và điện giải.","chan_doan_so_bo":"Tắc ruột non do dính sau mổ, chưa có dấu hiệu nghẹt.","bien_luan":"Bước 1: bốn dấu hiệu cơ năng và thực thể của tắc ruột là đau quặn cơn, nôn, bí trung đại tiện, chướng bụng, đều có. Bước 2: tắc cơ học vì nhu động tăng, âm sắc cao, mức nước hơi hình bậc thang. Bước 3: vị trí là ruột non vì giãn ruột non, đại tràng ít hơi, chướng ở vùng giữa; điểm chuyển tiếp trên CT. Bước 4: nguyên nhân dính vì tiền sử mổ bụng, không thoát vị bẹn đùi, không khối u. Bước 5: chưa nghẹt vì không sốt cao, không đau liên tục dữ dội, không co cứng, lactate 1,6, thành ruột ngấm thuốc đều, ít dịch tự do. Vì vậy điều trị bảo tồn có theo dõi sát là phù hợp.","sinh_ly_benh":"Sau mổ, dải xơ dính hình thành giữa quai ruột và thành bụng hoặc với nhau, gây gập góc hoặc chèn ép lòng ruột. Phía trên chỗ tắc, hơi và dịch ứ lại, ruột giãn, nhu động tăng để thắng trở ngại gây đau quặn. Dịch thấm vào lòng ruột (khoang thứ ba) cùng với nôn gây mất nước, hạ natri, hạ kali, giảm thể tích tuần hoàn. Áp lực lòng ruột tăng làm giảm tưới máu thành ruột, vi khuẩn chuyển vị; nếu dải dính xoắn hoặc ruột tắc hai đầu (quai kín) sẽ thiếu máu, hoại tử và thủng.","chan_doan_phan_biet":"Liệt ruột cơ năng, tắc ruột do thoát vị nghẹt, do u đại tràng, do xoắn ruột, do sỏi mật rơi vào ruột, lồng ruột; viêm tụy cấp. Các nguyên nhân được loại bằng tiền sử, khám thoát vị và CT.","chan_doan_xac_dinh":"Tắc ruột non do dính sau mổ, tắc bán phần chưa nghẹt, có mất nước, hạ natri, hạ kali nhẹ.","dieu_tri":"Điều trị bảo tồn có theo dõi tại khoa Ngoại: nhịn ăn, đặt sonde dạ dày hút liên tục, truyền Ringer lactat và bù kali (khoảng 40 mmol/ngày theo điện giải), ghi nhận nước tiểu. Cân nhắc cho 100 ml thuốc cản quang tan trong nước qua sonde, chụp X quang sau 24 giờ: thuốc tới đại tràng dự báo thành công. Khám lại bụng mỗi 4 đến 6 giờ, xét nghiệm lactate, bạch cầu. Chỉ định mổ cấp cứu khi có dấu hiệu nghẹt, viêm phúc mạc, thủng, thiếu máu thành ruột trên CT, lactate tăng, hoặc không cải thiện sau khoảng 72 giờ. Nếu mổ: giải phóng dải dính, đánh giá sống ruột, cắt đoạn ruột hoại tử, nối ruột; cân nhắc nội soi nếu tắc đơn giản. Hậu phẫu: nhịn ăn đến khi có trung tiện, kháng sinh nếu cắt ruột, vận động sớm, dự phòng huyết khối.","tien_luong":"Khoảng 70 đến 80% tắc ruột do dính sau mổ khỏi khi điều trị bảo tồn; nguy cơ tái phát cao; tiên lượng xấu hơn nếu chậm phát hiện nghẹt.","du_phong":"Giảm dính bằng kỹ thuật mổ nhẹ nhàng, ưu tiên mổ nội soi, tránh để dị vật và bột găng. Người bệnh cần ăn uống chia nhỏ, tăng chất xơ vừa phải, đến viện sớm khi đau quặn kèm nôn, bí trung đại tiện."},"nguon":["Ten Broek RPG et al. Benchmarking of the Management of adhesive small bowel obstruction: 2017 update of the WSES guidelines. World J Emerg Surg 2018.","Giáo trình Bệnh học Ngoại khoa, Đại học Y Hà Nội, bài Tắc ruột.","Townsend CM et al. Sabiston Textbook of Surgery, 21st edition, 2022, chương Small Intestine."],"status":"nhap"},{"id":"ngoai-bung-003","title":"Khối phồng vùng bẹn không đẩy lên được, đau và nôn","kind":"Ngoại","level":"Trung bình","group":"ngoai","name":"Người bệnh mô phỏng H. V. C.","age":67,"sex":"nam","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Nam 67 tuổi có khối phồng bẹn phải 5 năm, 10 giờ nay khối căng đau, không đẩy lên được, nôn nhiều lần.","vitals":{"hr":100,"sbp":130,"dbp":80,"rr":20,"t":37.8,"spo2":97},"ask":[["Khối phồng ở bẹn có từ bao giờ, thường ra sao?","Khối bẹn phải 5 năm, đứng hoặc gắng sức thì to, nằm thì tự xẹp.","e"],["Lần này khối có đẩy lên được không?","Từ 10 giờ nay khối không tự xẹp, tự đẩy cũng không được, căng và đau tăng dần.","e"],["Có nôn, bí trung đại tiện hoặc chướng bụng không?","Nôn 3 lần, trung tiện được ít, bụng hơi chướng, chưa đi cầu từ sáng.","e"],["Có yếu tố làm tăng áp lực ổ bụng không?","Táo bón kéo dài, tiểu khó vì phì đại tuyến tiền liệt, ho mạn do hút thuốc.","e"],["Có sốt, da vùng khối thay đổi không?","Sốt nhẹ, da trên khối hơi đỏ, nóng.","e"],["Có tiền sử mổ vùng bẹn hoặc bệnh tim phổi không?","Chưa mổ bẹn; tăng huyết áp dùng amlodipin; hút thuốc 30 gói-năm.","n"],["Có dùng thuốc chống đông hoặc dị ứng thuốc không?","Không dùng chống đông, không dị ứng.","n"]],"exam":[["K","Khám khối vùng bẹn bìu phải","Khối bẹn bìu phải kích thước 6 x 5 cm, căng, chắc, rất đau, da trên khối đỏ nhẹ, không đẩy lên được, ho không có xung động.","e"],["K","Khám bụng","Bụng chướng nhẹ, ấn đau nhẹ quanh rốn, không co cứng; nhu động ruột tăng.","e"],["K","Khám bên đối diện và tinh hoàn","Bẹn trái bình thường; tinh hoàn phải sờ được riêng, không đau, ở phía dưới khối.","e"],["K","Thăm trực tràng, tiền liệt tuyến","Tiền liệt tuyến to đều, không đau; bóng trực tràng có ít phân.","n"],["K","Tim phổi","Tim đều, phổi ran ngáy nhẹ.","n"],["K","Dấu hiệu mất nước","Niêm mạc hơi khô.","n"]],"tests":[["Công thức máu, CRP và lactate",10,"Bạch cầu 13,5 G/L; CRP 48 mg/L; lactate 2,4 mmol/L.","e"],["Siêu âm vùng bẹn bìu có Doppler",15,"Quai ruột trong túi thoát vị, thành dày, nhu động giảm, ít dịch quanh quai; tinh hoàn tưới máu bình thường.","e"],["X quang bụng đứng",10,"Vài mức nước hơi ruột non, hơi đại tràng ít.","e"],["Điện giải đồ, creatinin, điện tâm đồ",10,"Na 136, K 3,6 mmol/L; creatinin 98 µmol/L; điện tâm đồ nhịp xoang 100 lần/phút.","n"],["Chụp CT bụng chậu có cản quang cho mọi trường hợp trước khi mổ dù chẩn đoán đã rõ",40,"Không thay đổi chỉ định mổ cấp cứu và làm chậm trễ.","w"],["Cố gắng đẩy khối nhiều lần tại phòng khám để thoát vị lên",10,"Nguy cơ đẩy ruột hoại tử vào ổ bụng, bỏ sót thủng.","w"]],"opt":{"ydx":["Tràn dịch màng tinh hoàn","+Thoát vị bẹn gián tiếp bên phải bị nghẹt","Viêm mào tinh hoàn cấp","Xoắn thừng tinh"],"xu_tri":["Đẩy khối bằng tay nhiều lần, rồi cho về","Chườm lạnh và theo dõi tại nhà","+Hồi sức và mổ cấp cứu sớm","Chờ ruột tự giải nghẹt trong 3 ngày"],"can_thiep_trong_mo":["Luôn cắt ruột để phòng ngừa","+Giải phóng chỗ nghẹt, kiểm tra sống ruột, cắt đoạn nếu hoại tử rồi sửa thoát vị","Chỉ cắt túi thoát vị, không đánh giá ruột","Đẩy ruột vào ổ bụng mà không quan sát"]},"actions":["++Nhịn ăn, đặt đường truyền, bù dịch tinh thể|2|Nôn nhiều và mất nước, chuẩn bị mổ cấp cứu.","++Hội chẩn ngoại khoa và chuẩn bị mổ cấp cứu|2|Nghẹt thoát vị cần can thiệp trong vài giờ để cứu ruột.","++Kháng sinh dự phòng trước mổ (cephalosporin), giảm đau tĩnh mạch|2|Có dấu hiệu viêm, nguy cơ cắt ruột.","++Đặt sonde dạ dày hút khi nôn nhiều hoặc chướng bụng|2|Giảm nguy cơ hít sặc khi gây mê.","+Đánh giá lại tim phổi, đường huyết và chuẩn bị gây mê|2|Người bệnh lớn tuổi hút thuốc, có tăng huyết áp.","-Đẩy khối tại chỗ vài lần trong khi chờ siêu âm|1|Không an toàn khi nghi nghẹt và đã quá 6 giờ.","!Cố đẩy khối thoát vị bằng lực mạnh và cho về nhà|0|Đẩy ruột hoại tử vào ổ bụng gây viêm phúc mạc."],"teach":"Thoát vị bẹn không đẩy lên được kèm đau, nôn, bí trung đại tiện là nghẹt cho đến khi chứng minh ngược lại; cần mổ cấp cứu, không cố đẩy mạnh. Đánh giá sống ruột trong mổ quyết định cắt hay không cắt ruột.","hbu":{"hanh_chinh":"Người bệnh mô phỏng H. V. C., nam, 67 tuổi, nông dân; nhập khoa Cấp cứu rồi chuyển Ngoại tiêu hóa.","ly_do_vao_vien":"Khối phồng vùng bẹn phải đau, không đẩy lên được 10 giờ, kèm nôn.","benh_su":"Có khối phồng bẹn phải 5 năm, to khi đứng, xẹp khi nằm. Mười giờ trước, sau khi rặn đại tiện, khối to nhanh, không xẹp, đau tăng dần, da đỏ. Nôn ba lần, trung tiện ít, bụng chướng nhẹ, sốt nhẹ. Chưa dùng thuốc.","tien_su":"Tăng huyết áp dùng amlodipin; phì đại tuyến tiền liệt tiểu khó; táo bón mạn; hút thuốc 30 gói-năm, ho mạn. Chưa mổ bụng hay bẹn. Không dùng chống đông.","luoc_qua_co_quan":"Tiểu khó cũ, không tiểu máu; ho mạn đờm trắng; không đau ngực.","kham_hien_tai":"Mạch 100, huyết áp 130/80 mmHg, nhiệt độ 37,8 độ C, nhịp thở 20, SpO2 97%. Khối bẹn bìu phải 6 x 5 cm căng chắc, rất đau, da đỏ nhẹ, không đẩy lên được, ho không có xung động. Bụng chướng nhẹ, nhu động tăng. Tinh hoàn phải riêng biệt, không đau. Bẹn trái bình thường.","can_lam_sang":"Bạch cầu 13,5 G/L, CRP 48 mg/L, lactate 2,4 mmol/L; điện giải bình thường. Siêu âm: quai ruột trong túi thoát vị, thành dày, nhu động giảm, ít dịch; tinh hoàn tưới máu bình thường. X quang bụng: vài mức nước hơi ruột non.","tom_tat":"Nam 67 tuổi, thoát vị bẹn phải 5 năm, đột ngột khối to không đẩy lên được, đau tăng, nôn, bụng chướng, sốt nhẹ, da đỏ; siêu âm có quai ruột thành dày, lactate 2,4; nhiều yếu tố tăng áp lực ổ bụng.","dat_van_de":"Khối bẹn bìu đau, không đẩy lên được; hội chứng tắc ruột; nguy cơ hoại tử ruột; nhu cầu mổ cấp cứu.","chan_doan_so_bo":"Thoát vị bẹn phải bị nghẹt có dấu hiệu tắc ruột.","bien_luan":"Bước 1: khối vùng bẹn có tiền sử xẹp khi nằm, to khi gắng sức, nằm trên nếp bẹn là thoát vị bẹn. Bước 2: thoát vị chuyển từ có thể đẩy lên sang không đẩy lên được kèm đau liên tục là nghẹt. Bước 3: có nôn, chướng bụng, mức nước hơi là tắc ruột do nghẹt. Bước 4: sốt nhẹ, da đỏ, bạch cầu 13,5, lactate 2,4 gợi thiếu máu nuôi quai ruột, cần mổ sớm. Bước 5: loại trừ xoắn thừng tinh và viêm mào tinh vì tinh hoàn riêng biệt, tưới máu bình thường trên Doppler và siêu âm thấy quai ruột. Bước 6: thời gian 10 giờ, nguy cơ hoại tử tăng sau 6 giờ nên không trì hoãn.","sinh_ly_benh":"Khi áp lực ổ bụng tăng đột ngột (rặn, ho), ruột chui qua lỗ bẹn sâu vào ống bẹn. Cổ túi thoát vị hẹp bóp nghẹt quai ruột: đầu tiên tĩnh mạch và bạch huyết bị chèn, ruột phù nề, tăng thể tích, càng nghẹt chặt hơn; sau đó động mạch bị chèn, thành ruột thiếu máu, hoại tử, vi khuẩn xuyên thành gây viêm mô tế bào và thủng. Lòng ruột tắc gây nôn, chướng bụng, mất nước. Nghẹt kiểu Richter (chỉ nghẹt một phần thành ruột) có thể hoại tử mà ít triệu chứng tắc ruột.","chan_doan_phan_biet":"Xoắn thừng tinh, viêm mào tinh hoàn, tràn dịch màng tinh hoàn, u tinh hoàn, hạch bẹn viêm, giãn tĩnh mạch thừng tinh. Các bệnh này không có quai ruột trong khối, không có hội chứng tắc ruột.","chan_doan_xac_dinh":"Thoát vị bẹn phải nghẹt có hội chứng tắc ruột, chưa chứng minh hoại tử ruột (xác định trong mổ).","dieu_tri":"Mổ cấp cứu sớm. Trước mổ: nhịn ăn, đặt sonde dạ dày nếu nôn nhiều, truyền dịch tinh thể, giảm đau, kháng sinh dự phòng cephalosporin, đánh giá tim phổi. Trong mổ: gây mê hoặc tê tủy tùy thể trạng, rạch bẹn mở ống bẹn, mở túi thoát vị, kiểm soát dịch trong túi, đánh giá sống ruột (màu, nhu động, mạch mạc treo, ngâm nước ấm). Nếu ruột sống: đưa vào ổ bụng, cắt túi, sửa thoát vị; dùng mảnh ghép khi không nhiễm bẩn. Nếu ruột hoại tử: cắt đoạn ruột, nối ruột, tránh dùng mảnh ghép tổng hợp khi nhiễm bẩn, có thể sửa mô tự thân. Hậu phẫu: kháng sinh đến 24 đến 72 giờ nếu cắt ruột, theo dõi nhu động, ăn lại khi có trung tiện, vận động sớm, kiểm soát táo bón, ho, tiểu khó.","tien_luong":"Tốt nếu mổ sớm và ruột còn sống; tỷ lệ tử vong và biến chứng tăng rõ khi phải cắt ruột, người cao tuổi, có bệnh nền; nguy cơ tái phát phụ thuộc kỹ thuật sửa.","du_phong":"Mổ sửa thoát vị chọn lọc sớm ở người có thoát vị có triệu chứng. Giảm yếu tố tăng áp lực: điều trị táo bón, tiểu khó do phì đại tiền liệt, bỏ thuốc lá, kiểm soát ho. Hướng dẫn nhận biết dấu hiệu nghẹt để đến viện ngay."},"nguon":["HerniaSurge Group. International guidelines for groin hernia management. Hernia 2018.","Giáo trình Bệnh học Ngoại khoa, Đại học Y Hà Nội, bài Thoát vị thành bụng.","Townsend CM et al. Sabiston Textbook of Surgery, 21st edition, 2022, chương Abdominal Wall, Umbilicus, Hernia."],"status":"nhap"},{"id":"ngoai-bung-004","title":"Đau hạ sườn phải, sốt sau bữa ăn nhiều mỡ","kind":"Ngoại","level":"Dễ","group":"ngoai","name":"Người bệnh mô phỏng T. T. M.","age":45,"sex":"nữ","intro":"Ca tự soạn phục vụ đào tạo; toàn bộ thông tin và số liệu người bệnh là giả định. Nữ 45 tuổi, thừa cân, đau hạ sườn phải liên tục 36 giờ sau bữa ăn nhiều mỡ, kèm sốt và buồn nôn.","vitals":{"hr":96,"sbp":125,"dbp":78,"rr":20,"t":38.3,"spo2":98},"ask":[["Cơn đau khởi phát sau bữa ăn như thế nào?","Sau bữa tiệc nhiều thịt mỡ, đau hạ sườn phải liên tục, tăng dần, kéo dài 36 giờ, lan lên vai phải.","e"],["Có từng đau tương tự trước đây không?","Vài lần đau quặn hạ sườn phải sau ăn mỡ, kéo dài dưới 2 giờ rồi tự hết.","e"],["Có sốt, rét run hoặc vàng da không?","Sốt 38 độ, không rét run, không vàng da, nước tiểu vàng, phân bình thường.","e"],["Có buồn nôn, nôn không?","Buồn nôn, nôn hai lần ra thức ăn, nôn xong đau không giảm.","e"],["Đã dùng thuốc gì, có tiền sử sỏi mật hoặc bệnh gan không?","Chưa từng siêu âm; tự uống thuốc giảm đau paracetamol; không bệnh gan.","n"],["Có bệnh nền như đái tháo đường, tăng mỡ máu, dùng thuốc ngừa thai không?","Rối loạn mỡ máu chưa điều trị; không đái tháo đường; sinh 3 con.","n"],["Có dị ứng thuốc không?","Không.","e"]],"exam":[["K","Khám bụng vùng hạ sườn phải","Ấn đau hạ sườn phải, dấu Murphy (+), co cứng nhẹ thành bụng hạ sườn phải.","e"],["K","Sờ túi mật và gan","Không sờ rõ túi mật; gan không to.","e"],["K","Toàn trạng, da niêm mạc","Tỉnh, thừa cân BMI 29, không vàng da, không vàng củng mạc, môi khô nhẹ.","e"],["K","Khám bụng toàn bộ","Bụng mềm vùng khác, không phản ứng dội lan tỏa, không chướng.","n"],["K","Tim phổi","Tim đều, phổi thông khí rõ.","n"],["K","Vùng thắt lưng","Chạm thận âm tính.","n"]],"tests":[["Công thức máu và CRP",10,"Bạch cầu 14,8 G/L; CRP 94 mg/L.","e"],["Siêu âm bụng",15,"Túi mật căng 10 x 4,5 cm, thành dày 5 mm, có sỏi 1,5 cm kẹt ở cổ túi mật, dấu Murphy siêu âm (+), ít dịch quanh túi mật; ống mật chủ 5 mm; gan thoái hóa mỡ nhẹ.","e"],["Chức năng gan: AST, ALT, bilirubin, ALP, GGT",10,"AST 52, ALT 48 U/L; bilirubin toàn phần 17 µmol/L; ALP và GGT trong giới hạn trên.","e"],["Lipase và amylase máu",10,"Lipase 48 U/L (bình thường).","e"],["MRCP thường quy cho mọi người bệnh viêm túi mật",40,"Không cần khi ống mật chủ 5 mm, men gan gần bình thường.","w"],["Chụp CT bụng có cản quang thường quy",40,"Không cần khi siêu âm đã đủ chẩn đoán, trừ nghi biến chứng.","w"]],"opt":{"ydx":["Viêm tụy cấp do sỏi","Viêm đường mật cấp","+Viêm túi mật cấp do sỏi, mức độ nhẹ (độ I theo Tokyo 2018)","Loét tá tràng thủng bít"],"xu_tri":["+Kháng sinh, truyền dịch, giảm đau và cắt túi mật nội soi sớm","Chỉ dùng kháng sinh uống rồi chờ mổ sau 3 tháng","Điều trị thuốc giảm co thắt và cho về","Dẫn lưu đường mật qua nội soi ngay"],"thoi_diem_mo":["Chỉ mổ sau 6 tuần mọi trường hợp","+Cắt túi mật nội soi sớm, tốt nhất trong vòng 72 giờ đến 7 ngày khi đủ điều kiện","Mổ chỉ khi có thủng túi mật","Không bao giờ mổ vì túi mật tự hết"]},"actions":["++Nhịn ăn, truyền dịch và giảm đau|2|Giảm nôn, tránh mất nước, giảm đau không che dấu.","++Kháng sinh đường tĩnh mạch phổ phù hợp (ví dụ cephalosporin thế hệ 3 phối hợp metronidazol)|2|Viêm túi mật có sốt và bạch cầu tăng; giảm nhiễm khuẩn huyết.","+Hội chẩn ngoại khoa để lên kế hoạch cắt túi mật nội soi sớm|2|Cắt sớm giảm thời gian nằm viện, giảm tái phát.","+Theo dõi sinh hiệu, đau bụng, bilirubin và men gan mỗi 12 giờ|2|Phát hiện sớm biến chứng như thủng, viêm đường mật.","+Đánh giá nguy cơ gây mê và điều chỉnh mỡ máu|1|Chuẩn bị cho mổ nội soi.","-Chỉ cho thuốc giảm co thắt rồi xuất viện|0|Không điều trị nguyên nhân, có nguy cơ biến chứng.","!Làm MRCP và ERCP ngay cho mọi người bệnh|0|Không có chỉ định, nguy cơ biến chứng thủ thuật."],"teach":"Đau hạ sườn phải kéo dài trên 6 giờ kèm sốt, bạch cầu tăng, dấu Murphy dương và sỏi kẹt cổ túi mật trên siêu âm xác lập viêm túi mật cấp. Theo Tokyo 2018, độ I nên cắt túi mật nội soi sớm.","hbu":{"hanh_chinh":"Người bệnh mô phỏng T. T. M., nữ, 45 tuổi, nhân viên kinh doanh; nhập khoa Ngoại tiêu hóa.","ly_do_vao_vien":"Đau hạ sườn phải liên tục 36 giờ kèm sốt.","benh_su":"Sau bữa ăn nhiều mỡ 36 giờ trước, đau hạ sườn phải liên tục, tăng dần, lan lên vai phải, kèm buồn nôn, nôn hai lần và sốt khoảng 38 độ C. Trước đây có vài cơn đau quặn tương tự dưới 2 giờ rồi tự hết, chưa đi khám. Không vàng da, không rét run, phân và nước tiểu bình thường. Uống paracetamol, đau giảm ít.","tien_su":"Rối loạn mỡ máu chưa điều trị, thừa cân BMI 29, sinh 3 con. Không đái tháo đường, không bệnh gan. Chưa mổ bụng. Không dị ứng thuốc.","luoc_qua_co_quan":"Không ợ chua kéo dài, không tiêu chảy, không tiểu buốt, không ho.","kham_hien_tai":"Tỉnh, mạch 96, huyết áp 125/78 mmHg, nhiệt độ 38,3 độ C, nhịp thở 20, SpO2 98%. Không vàng da. Ấn đau hạ sườn phải, dấu Murphy (+), co cứng nhẹ; các vùng khác mềm; gan không to; không sờ rõ túi mật.","can_lam_sang":"Bạch cầu 14,8 G/L, CRP 94 mg/L; AST 52, ALT 48 U/L; bilirubin toàn phần 17 µmol/L; lipase bình thường. Siêu âm: túi mật 10 x 4,5 cm, thành dày 5 mm, sỏi 1,5 cm kẹt cổ, dấu Murphy siêu âm (+), dịch quanh túi mật; ống mật chủ 5 mm.","tom_tat":"Nữ 45 tuổi, thừa cân, rối loạn mỡ máu, đau hạ sườn phải liên tục 36 giờ sau ăn mỡ, sốt 38,3 độ, Murphy (+), bạch cầu và CRP tăng; siêu âm túi mật căng, thành dày, sỏi kẹt cổ; không vàng da, ống mật chủ không giãn.","dat_van_de":"Hội chứng đau hạ sườn phải cấp; hội chứng nhiễm trùng; nguyên nhân sỏi túi mật; mức độ nhẹ, chỉ định cắt túi mật.","chan_doan_so_bo":"Viêm túi mật cấp do sỏi, độ I theo Tokyo 2018.","bien_luan":"Bước 1: đau hạ sườn phải kéo dài trên 6 giờ không như cơn đau quặn mật đơn thuần (thường dưới 6 giờ). Bước 2: tiêu chí Tokyo 2018: A có dấu viêm tại chỗ (Murphy dương, đau hạ sườn phải), B có dấu viêm toàn thân (sốt, CRP tăng, bạch cầu tăng), C hình ảnh đặc trưng (thành dày, dịch quanh túi mật, sỏi kẹt cổ); có A, B và C nên chẩn đoán xác định. Bước 3: phân độ: độ I khi không có suy cơ quan và viêm tại chỗ nhẹ; bạch cầu 14,8 không quá 18, thời gian dưới 72 giờ, không khối sờ được, không có dấu hiệu viêm tại chỗ nặng nên là độ I. Bước 4: loại viêm đường mật vì không vàng da, men gan gần bình thường, ống mật chủ 5 mm; loại viêm tụy vì lipase bình thường.","sinh_ly_benh":"Sỏi kẹt cổ túi mật hoặc ống túi mật gây ứ dịch mật, tăng áp lực trong túi mật. Giai đoạn đầu viêm hóa học do muối mật, lysolecithin và prostaglandin, thành phù nề, giảm tưới máu. Sau 48 đến 72 giờ vi khuẩn đường ruột (E. coli, Klebsiella, Enterococcus) xâm nhập gây viêm mủ; nếu không giải quyết có thể hoại thư, thủng, áp xe quanh túi mật. Đau lan lên vai phải do kích thích phúc mạc hoành.","chan_doan_phan_biet":"Viêm đường mật cấp, viêm tụy cấp do sỏi, loét tá tràng thủng, viêm gan cấp, áp xe gan, viêm ruột thừa dưới gan, nhồi máu cơ tim thành dưới, viêm phổi đáy phải. Được loại trừ bằng bilirubin, lipase, siêu âm và điện tâm đồ khi cần.","chan_doan_xac_dinh":"Viêm túi mật cấp do sỏi, Tokyo độ I.","dieu_tri":"Nhập viện, nhịn ăn, truyền dịch, giảm đau (paracetamol, NSAID thận trọng), kháng sinh đường tĩnh mạch (ceftriaxone phối hợp metronidazol hoặc theo mức độ kháng thuốc tại cơ sở). Chỉ định cắt túi mật nội soi sớm, ưu tiên trong 72 giờ đầu và không quá 7 đến 10 ngày từ khi khởi phát khi đủ điều kiện gây mê và cơ sở có phẫu thuật viên nội soi; chụp đường mật trong mổ khi có nghi sỏi ống mật chủ. Nếu không mổ được hoặc nguy cơ cao: điều trị nội khoa, cân nhắc dẫn lưu túi mật qua da. Hậu phẫu: kháng sinh ngừng trong 24 giờ nếu không biến chứng, ăn sớm, xuất viện sau 1 đến 2 ngày, hẹn tái khám và giải phẫu bệnh.","tien_luong":"Tốt nếu mổ sớm; chuyển mổ mở khoảng 5 đến 10% do dính viêm; tái phát và biến chứng nếu hoãn mổ lâu.","du_phong":"Ăn ít mỡ, giảm cân từng bước, điều trị rối loạn mỡ máu, tránh nhịn ăn kéo dài. Người đã cắt túi mật cần tái khám nếu đau bụng, vàng da, sốt."},"nguon":["Miura F et al. Tokyo Guidelines 2018: flowchart for the management of acute cholecystitis. J Hepatobiliary Pancreat Sci 2018.","Yokoe M et al. Tokyo Guidelines 2018: diagnostic criteria and severity grading of acute cholecystitis. J Hepatobiliary Pancreat Sci 2018.","Giáo trình Bệnh học Ng
