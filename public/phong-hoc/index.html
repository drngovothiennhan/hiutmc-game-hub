à theo dõi đáp ứng cũng như tái hạ đường huyết. Sau ổn định cần rà lại thuốc, bữa ăn và yếu tố nguy cơ.","status":"draft"},{"id":"xhth-tren-xo-gan","title":"Nôn máu và đi ngoài phân đen","kind":"Cấp cứu","level":"Trung bình","group":"capcuu","place":"Khoa Cấp cứu","clock":"23:15","name":"Ông Đặng Văn Tám","age":67,"sex":"nam","intro":"Người bệnh nôn ra máu đỏ sẫm hai lần và đi ngoài phân đen trong ngày. Có tiền sử xơ gan do rượu; gần đây mệt tăng. Gia đình không rõ người bệnh có đang dùng thuốc chống đông hay không.","vitals":{"hr":122,"sbp":88,"dbp":54,"rr":24,"t":36.6,"spo2":95},"ask":[["Nôn máu bắt đầu khi nào và số lần?","Nôn máu đỏ sẫm hai lần trong vài giờ gần đây.","e"],["Lượng máu ước tính và có cục máu không?","Gia đình thấy một lượng đáng kể, có lẫn cục máu; không cân đo được.","e"],["Phân có màu đen, dính và mùi khẳm không?","Đi ngoài phân đen, dính, mùi khẳm từ sáng.","e"],["Có chóng mặt, ngất hoặc yếu lả không?","Choáng khi đứng, mệt lả.","e"],["Có tiền sử bệnh gan, loét dạ dày hoặc xuất huyết tiêu hóa không?","Được chẩn đoán xơ gan; từng đau thượng vị nhưng chưa nội soi gần đây.","e"],["Có dùng thuốc chống đông, aspirin hoặc thuốc giảm đau kháng viêm không?","Gia đình không rõ; cần kiểm tra toa thuốc.","e"],["Có uống rượu gần đây không?","Có uống rượu nhiều năm, gần đây vẫn uống.","n"],["Có đau bụng dữ dội hoặc sốt không?","Không đau bụng dữ dội, không sốt.","n"]],"exam":[["V","Da và niêm mạc","Da nhợt, niêm mạc nhạt.","e"],["V","Tri giác","Tỉnh nhưng mệt, trả lời chậm.","n"],["V","Bụng","Bụng hơi chướng, có tuần hoàn bàng hệ nhẹ.","n"],["M","Chất nôn","Có dịch nôn màu đỏ sẫm lẫn cục máu theo ghi nhận của gia đình.","e"],["M","Hơi thở","Không khó thở rõ; có mùi rượu nhẹ.","n"],["T","Mạch (thiết)","Nhanh nhỏ, đầu chi lạnh; mạch tế sác.","e"],["V","Quan sát lưỡi","Lưỡi nhạt tím, rêu vàng bẩn.","e"],["K","Tuần hoàn và bụng","Hạ huyết áp tư thế/choáng, bụng mềm, không phản ứng thành bụng.","e"]],"tests":[["Công thức máu",15,"Hb 7,8 g/dL; cần diễn giải cùng tình trạng huyết động và diễn tiến chảy máu.","e"],["Nhóm máu, sàng lọc kháng thể và phản ứng chéo",20,"Đang tiến hành chuẩn bị chế phẩm máu nếu có chỉ định.","e"],["Ure, creatinin, điện giải và chức năng gan",20,"Ure tăng; cần đánh giá bệnh gan và rối loạn chuyển hóa.","n"],["Đông máu",15,"INR tăng nhẹ; cần tìm thuốc chống đông và bệnh gan liên quan.","e"],["CT sọ não",30,"Không có chỉ định ban đầu khi không có triệu chứng thần kinh hoặc chấn thương.","w"]],"opt":{"ydx":["+Xuất huyết tiêu hóa trên có sốc giảm thể tích, nghi tăng áp cửa","Xuất huyết tiêu hóa dưới","Viêm dạ dày không biến chứng","Tắc ruột","Hội chứng Mallory Weiss đơn thuần"],"bd":["+Thổ huyết, tiện huyết","Vị quản thống đơn thuần","Tiết tả","Huyễn vựng mạn","Cổ trướng đơn thuần"],"bc":["+Lý hư nhiệt, khí huyết hao thoát","Biểu hư hàn","Biểu thực nhiệt","Lý hư hàn","Lý thực hàn"],"the":["+Vị nhiệt thương lạc, khí huyết hao thoát","Tỳ vị hư hàn","Can khí phạm vị","Vị âm hư","Phong hàn phạm biểu"],"phap":["+Hồi sức và kiểm soát chảy máu YHHĐ trước, sau đó ích khí nhiếp huyết","Chỉ dùng thuốc cầm máu YHCT thay hồi sức","Ôn trung chỉ thống","Thanh nhiệt táo thấp đơn trị","Hoạt huyết hóa ứ"],"phuong":["+Độc sâm thang hỗ trợ ích khí (chỉ sau hồi sức)","Hoàng thổ thang thay hồi sức","Bạch hổ thang","Lý trung hoàn","Huyết phủ trục ứ thang"],"huyet":["+Túc tam lý","+Nội quan","+Công tôn","+Trung quản","Hợp cốc","Phong trì","Thái uyên"]},"actions":["++Gọi hỗ trợ cấp cứu, đánh giá ABC và theo dõi huyết động liên tục|1|Nôn máu kèm tụt huyết áp, mạch nhanh.","++Thiết lập đường truyền ngoại vi phù hợp, lấy xét nghiệm và chuẩn bị chế phẩm máu theo quy trình|5|Có dấu hiệu sốc và thiếu máu.","++Hồi sức tuần hoàn, đánh giá đáp ứng và chỉ định truyền máu theo hướng dẫn hiện hành|5|Không trì hoãn hồi sức khi huyết động không ổn định.","++Hội chẩn tiêu hóa/nội soi và đánh giá nguyên nhân tăng áp cửa hoặc loét|5|Cần kiểm soát nguồn chảy máu.","+Rà soát thuốc chống đông, kháng kết tập và NSAID; đánh giá chức năng gan/đông máu|5|Các yếu tố này ảnh hưởng chảy máu và kế hoạch điều trị.","+Giữ nhịn ăn uống, chuẩn bị đường thở nếu nôn máu nhiều hoặc tri giác giảm|2|Giảm nguy cơ sặc.","!Cho người bệnh về nhà vì nôn máu đã tạm ngừng|1|Có thể tiếp tục xuất huyết và sốc.","!Cho uống thuốc YHCT cầm máu hoặc châm cứu thay hồi sức và nội soi|10|Trì hoãn xử trí xuất huyết tiêu hóa nguy kịch."],"teach":"Nôn máu, phân đen, mạch nhanh và huyết áp thấp gợi ý xuất huyết tiêu hóa trên có giảm thể tích tuần hoàn. Ưu tiên ABC, theo dõi, đường truyền, xét nghiệm/chuẩn bị máu và phối hợp kiểm soát nguồn chảy máu. Cần rà soát thuốc chống đông, thuốc kháng kết tập, NSAID và bệnh gan; YHCT không thay thế hồi sức.","status":"draft"},{"id":"co-giat-do-sot-cao-tre-em","title":"Trẻ 2 tuổi sốt cao, đang co giật","kind":"Nhi","level":"Dễ","group":"sannhi","place":"Khoa Cấp cứu Nhi","clock":"02:40","name":"Bé Đặng Gia Bảo","age":2,"sex":"nam","intro":"Mẹ bế bé vào khoa Cấp cứu lúc nửa đêm vì bé lên cơn co giật toàn thân khoảng 5 phút trước, đến giờ vẫn chưa dừng hẳn. Bé sốt từ chiều, ho và sổ mũi hai ngày nay.","vitals":{"hr":168,"sbp":96,"dbp":58,"rr":38,"t":39.8,"spo2":90},"ask":[["Cơn co giật bắt đầu khi nào, đã kéo dài bao lâu?","Khoảng 5 phút trước, bé co cứng rồi giật cả hai tay chân, mắt trợn ngược, đến giờ vẫn chưa dừng hẳn.","e"],["Cơn giật là cả người hay một bên? Môi bé có tím không?","Giật cả hai bên người, môi hơi tím.","e"],["Bé sốt từ khi nào, cao nhất bao nhiêu? Đã cho uống thuốc hạ sốt chưa?","Sốt từ chiều nay, ở nhà đo được 39,5 độ, chưa kịp cho uống thuốc hạ sốt.","n"],["Có ho, sổ mũi, đau họng, nôn ói hoặc tiêu chảy kèm theo không?","Ho, sổ mũi hai ngày nay. Không nôn, không tiêu chảy.","e"],["Trước cơn bé có quấy khóc dữ dội, nôn vọt, nổi ban hoặc li bì không?","Không nôn vọt, không nổi ban. Trước cơn bé vẫn chơi và bú được.","e"],["Bé đã từng co giật lần nào chưa? Gia đình có ai bị sốt co giật hoặc động kinh không?","Đây là lần đầu. Anh ruột lúc nhỏ có bị sốt co giật.","n"],["Bé có ngã đập đầu hoặc uống nhầm thuốc, hóa chất không?","Không ngã, không uống nhầm thuốc.","n"],["Tiền sử sinh nở, phát triển và tiêm chủng của bé?","Sinh đủ tháng, phát triển bình thường, tiêm chủng đủ theo lịch.","n"],["Mấy ngày nay bé ăn bú thế nào?","Vẫn bú được, hơi kém hơn ngày thường.","n"]],"exam":[["V","Quan sát cơn co giật","Co giật toàn thể kiểu cứng rồi giật, mắt trợn ngược, thở nông, chưa dừng sau khoảng 5 phút.","e"],["V","Da và môi","Da đỏ, nóng, vã mồ hôi; môi tím nhẹ.","e"],["V","Da, thóp, phù","Không có ban xuất huyết, không phù.","n"],["M","Tiếng thở","Thở nhanh, có tiếng khò khè đờm dãi ở họng, không rít thanh quản.","n"],["M","Mùi hơi thở và chất nôn","Không có mùi hóa chất lạ.","n"],["T","Mạch và da","Mạch quay nhanh, nảy, đều; da nóng ẩm.","n"],["K","Khám họng, tai","Họng đỏ, amidan sung huyết, không có mủ; màng nhĩ bình thường.","e"],["K","Dấu hiệu màng não và thần kinh","Khi cơn giật tạm ngưng: cổ mềm, Brudzinski âm tính, không có dấu thần kinh khu trú.","e"],["K","Khám phổi và tim","Phổi thô, ít ran ngáy; tim nhanh đều, không có âm thổi.","n"]],"tests":[["Đường huyết mao mạch",2,"4,8 mmol/L, loại trừ hạ đường huyết.","e"],["Công thức máu và CRP",15,"Bạch cầu 12 G/L, CRP không cao, gợi ý nhiễm virus.","n"],["Điện giải đồ và canxi máu",15,"Natri, canxi trong giới hạn bình thường.","n"],["Test nhanh cúm A và B",15,"Âm tính.","n"],["Chọc dò dịch não tủy",30,"Chỉ làm khi có dấu màng não hoặc nghi ngờ viêm màng não; ở ca này không có chỉ định thường quy.","n"],["CT sọ não không cản quang",30,"Không có chỉ định: không chấn thương, không dấu thần kinh khu trú, bé hồi phục tri giác.","w"],["Điện não đồ",30,"Không có chỉ định thường quy sau một cơn sốt co giật đơn thuần.","w"]],"opt":{"ydx":["+Co giật do sốt đơn thuần, cơn kéo dài cần cắt cơn","Viêm màng não mủ","Động kinh toàn thể khởi phát sớm","Hạ đường huyết gây co giật","Co giật do hạ canxi máu","Ngộ độc thuốc hoặc hóa chất gây co giật"]},"actions":["++Đặt bé nằm nghiêng an toàn, nới quần áo, hút đờm dãi, giữ thông thoáng đường thở|1|Bảo vệ đường thở, tránh sặc trong cơn giật.","++Thở oxy qua mặt nạ, theo dõi SpO2 và nhịp thở liên tục|1|SpO2 90% và môi tím trong lúc giật.","++Cắt cơn bằng thuốc nhóm benzodiazepin theo phác đồ nhi khoa, theo dõi nhịp thở sau dùng|2|Cơn giật đã quá 5 phút nên cần thuốc cắt cơn, không chờ tự hết.","+Thiết lập đường truyền tĩnh mạch ngoại vi|2|Để lấy máu xét nghiệm và dùng thuốc cắt cơn bước hai nếu cần.","+Hạ sốt bằng paracetamol sau khi hết giật, kết hợp lau ấm|2|Giúp bé dễ chịu, nhưng không dự phòng được cơn giật tái phát.","+Theo dõi tại khoa cấp cứu vài giờ sau cơn, đánh giá lại tri giác và dấu màng não|3|Loại trừ nhiễm trùng thần kinh trung ương trước khi cho về.","+Giải thích cho cha mẹ cách xử trí khi bé giật lại, không nhét vật vào miệng|2|Sốt co giật hay tái phát, cần hướng dẫn gia đình.","-Dùng kháng sinh phổ rộng tĩnh mạch thường quy|3|Không có bằng chứng nhiễm khuẩn nặng, bệnh cảnh gợi ý nhiễm virus hô hấp.","-Cho phenobarbital dự phòng kéo dài|2|Không chỉ định thuốc chống động kinh dự phòng sau sốt co giật đơn thuần.","!Nhét vật cứng hoặc muỗng vào miệng bé để chống cắn lưỡi|1|Gây tổn thương răng, tắc đường thở; bé ít khi cắn lưỡi nguy hiểm.","!Cho bé uống thuốc hạ sốt và nước trong khi đang co giật|1|Nguy cơ hít sặc.","!Lau người bằng cồn hoặc chườm nước đá|2|Gây co mạch, run, hấp thu cồn qua da ở trẻ nhỏ; không hạ sốt hiệu quả."],"teach":"Sốt co giật đơn thuần ở trẻ 6 tháng đến 5 tuổi thường lành tính, nhưng cơn kéo dài trên 5 phút cần cắt cơn ngay và phải loại trừ hạ đường huyết, viêm màng não. Việc đầu tiên là đường thở, oxy và thuốc cắt cơn, không nhét vật vào miệng. Hạ sốt chỉ để bé dễ chịu, không ngăn được cơn giật tái phát. YHCT (chứng kinh phong do nhiệt) chỉ hỗ trợ sau khi bé ổn định.","status":"draft"},{"id":"thung-o-loet-da-day-ta-trang","title":"Đau bụng dữ dội, bụng cứng như gỗ","kind":"Ngoại","level":"Dễ","group":"ngoai","place":"Khoa Cấp cứu","clock":"23:10","name":"Ông Võ Văn Thịnh","age":52,"sex":"nam","intro":"Ông được người nhà đưa vào cấp cứu vì đau bụng đột ngột, dữ dội vùng thượng vị cách đây 4 giờ, sau đó đau lan khắp bụng. Ông có tiền sử đau dạ dày nhiều năm và hay uống thuốc giảm đau xương khớp.","vitals":{"hr":112,"sbp":100,"dbp":64,"rr":24,"t":37.9,"spo2":96},"ask":[["Đau bắt đầu như thế nào, ở đâu, mức độ ra sao?","Đột ngột như dao đâm ở vùng thượng vị cách đây khoảng 4 giờ, sau đó lan khắp bụng. Đau 9 trên 10, không dám cử động.","e"],["Trước đây có đau dạ dày, đã nội soi chưa? Có dùng thuốc giảm đau, kháng viêm không?","Đau thượng vị âm ỉ nhiều năm, chưa nội soi. Hay uống ibuprofen và diclofenac vì đau khớp gối.","e"],["Có nôn, nôn ra máu hoặc đi cầu phân đen không?","Buồn nôn, nôn một lần ra dịch vàng. Không nôn ra máu, phân vàng.","e"],["Đau có lan lên vai không? Thay đổi tư thế hay thở sâu có đau thêm không?","Đau lan lên vai phải. Ho hoặc hít sâu đau tăng, nằm im co gối thì đỡ hơn.","n"],["Còn trung tiện được không? Bụng có chướng không?","Còn trung tiện, bụng căng.","n"],["Có sốt hoặc rét run không?","Hơi nóng người, không rét run.","n"],["Có uống rượu hoặc ăn no trước khi đau không?","Có uống vài ly rượu và ăn tối no rồi mới đau.","n"],["Có bệnh tim mạch, đái tháo đường, dị ứng thuốc không?","Không có bệnh nền, chưa biết dị ứng thuốc.","n"]],"exam":[["V","Tư thế và vẻ mặt","Nằm im co gối, mặt tái, vẻ đau đớn, vã mồ hôi.","e"],["V","Hình dạng bụng","Bụng hơi chướng, di động theo nhịp thở kém.","n"],["M","Giọng nói và hơi thở","Nói ngắn từng câu, thở nông nhanh.","n"],["M","Mùi hơi thở","Có mùi rượu nhẹ.","n"],["T","Mạch và đầu chi","Mạch nhanh, nhỏ; đầu chi mát, ẩm.","n"],["K","Sờ nắn bụng","Bụng cứng như gỗ, co cứng thành bụng toàn bộ, đau nhiều nhất ở thượng vị, phản ứng dội dương tính.","e"],["K","Gõ bụng","Mất vùng đục trước gan.","e"],["K","Nghe nhu động ruột","Nhu động ruột giảm rõ.","n"],["K","Thăm trực tràng","Túi cùng Douglas căng đau nhẹ, không có máu trên găng.","n"]],"tests":[["X-quang ngực thẳng và bụng đứng không chuẩn bị",10,"Liềm hơi dưới vòm hoành phải.","e"],["Công thức máu",10,"Bạch cầu 15,8 G/L, tăng bạch cầu đa nhân trung tính; Hb 13,5 g/dL.","e"],["Nhóm máu, đông máu, sinh hóa cơ bản",15,"Trong giới hạn cho phép phẫu thuật; creatinin bình thường.","n"],["Siêu âm bụng",10,"Có hơi và dịch tự do ổ bụng lượng ít, không sỏi túi mật.","n"],["Amylase máu",15,"Tăng nhẹ, không phù hợp viêm tụy cấp điển hình.","n"],["Điện tâm đồ",5,"Nhịp nhanh xoang, không có ST chênh.","n"],["Nội soi dạ dày tá tràng",25,"Không nên làm khi nghi thủng tạng rỗng: bơm hơi làm tăng thoát hơi và dịch tiêu hóa vào ổ bụng.","w"]],"opt":{"ydx":["+Thủng ổ loét dạ dày tá tràng gây viêm phúc mạc","Viêm tụy cấp","Nhồi máu cơ tim thành dưới","Tắc ruột cơ học","Viêm ruột thừa cấp","Viêm túi mật cấp"]},"actions":["++Cho nhịn ăn uống hoàn toàn, đặt hai đường truyền tĩnh mạch, theo dõi monitor|2|Có dấu hiệu viêm phúc mạc, mạch nhanh, huyết áp thấp biên.","++Hồi sức dịch tinh thể tĩnh mạch và giảm đau đường tĩnh mạch theo phác đồ|3|Bù thể tích mất vào ổ bụng; giảm đau đúng cách không làm che lấp chẩn đoán.","++Hội chẩn ngoại khoa ngay để chuẩn bị phẫu thuật cấp cứu khâu lỗ thủng|2|Thủng tạng rỗng kèm viêm phúc mạc cần mổ sớm, trì hoãn làm tăng biến chứng và tử vong.","+Dùng kháng sinh phổ rộng đường tĩnh mạch và thuốc ức chế bơm proton đường tĩnh mạch|2|Hạn chế nhiễm khuẩn ổ bụng, giảm tiết acid.","+Đặt sonde dạ dày hút liên tục và sonde tiểu theo dõi nước tiểu|3|Giảm dịch tiêu hóa tràn vào ổ bụng, đánh giá tưới máu.","+Giải thích tình trạng cho gia đình và chuẩn bị hồ sơ trước mổ|2|Hoàn thiện thủ tục đồng ý phẫu thuật.","-Chụp CT bụng có cản quang để tìm thêm tổn thương trước khi quyết định mổ|40|Đã đủ chẩn đoán bằng lâm sàng và X-quang, chụp thêm làm chậm mổ.","!Cho uống hỗn dịch bari để chụp dạ dày|5|Bari thoát qua lỗ thủng gây viêm phúc mạc bari, rất khó điều trị.","!Cho uống thuốc kháng acid, giảm đau và hẹn theo dõi ngoại trú|3|Trì hoãn xử trí viêm phúc mạc, nguy cơ sốc nhiễm khuẩn."],"teach":"Đau thượng vị đột ngột như dao đâm, bụng cứng như gỗ, mất vùng đục trước gan và liềm hơi dưới hoành là bộ ba điển hình của thủng tạng rỗng. Ưu tiên: nhịn ăn, bù dịch, kháng sinh và mổ sớm; không nội soi, không cho uống bari. NSAID kéo dài và rượu là yếu tố nguy cơ. YHCT (vị quản thống) chỉ hỗ trợ phục hồi tiêu hóa sau mổ.","status":"draft"},{"id":"ngo-doc-phospho-huu-co","title":"Uống nhầm thuốc trừ sâu, vã mồ hôi, khó thở","kind":"Cấp cứu","level":"Trung bình","group":"capcuu","place":"Khoa Cấp cứu","clock":"17:35","name":"Ông Lương Văn Sáu","age":47,"sex":"nam","intro":"Ông được người nhà đưa vào cấp cứu sau khi uống nhầm chai thuốc trừ sâu đựng trong chai nước ngọt cách đây khoảng 45 phút. Người nhà mang theo chai thuốc, có mùi rất hắc. Ông nôn nhiều, chảy dãi và khó thở.","vitals":{"hr":52,"sbp":100,"dbp":60,"rr":28,"t":36.8,"spo2":88},"ask":[["Ông uống phải thứ gì, bao nhiêu và cách đây bao lâu?","Tôi tưởng chai nước ngọt, uống nhầm khoảng nửa ly, cách đây chừng 45 phút.","e"],["Hiện ông thấy những gì?","Buồn nôn, nôn nhiều, đau quặn bụng, chảy nước dãi, đổ mồ hôi, tức ngực và khó thở.","e"],["Người nhà có biết tên hoạt chất, nhãn chai ghi gì không?","Nhãn ghi thuốc trừ sâu nhóm phospho hữu cơ, mùi rất hắc.","e"],["Ông có ho nhiều đờm, khò khè không?","Ho đờm nhiều, thở khò khè, tức ngực.","e"],["Mắt nhìn thế nào?","Nhìn mờ, tối.","n"],["Có đại tiểu tiện không tự chủ, tiêu chảy không?","Đã đi tiêu phân lỏng một lần, són tiểu.","n"],["Có giật cơ, yếu tay chân không?","Thấy giật ở mặt và đùi, chân tay yếu.","n"],["Có bệnh nền, dị ứng thuốc, uống rượu cùng lúc không?","Không bệnh nền, không dị ứng, không uống rượu hôm nay.","n"]],"exam":[["V","Đồng tử","Co nhỏ như đầu đinh ghim hai bên, phản xạ ánh sáng chậm.","e"],["V","Da và tiết dịch","Vã mồ hôi đầm đìa, chảy nhiều nước dãi, chảy nước mắt.","e"],["V","Co giật cơ","Rung giật các bó cơ ở mặt và chi.","n"],["M","Mùi hơi thở và quần áo","Mùi hắc đặc trưng của thuốc trừ sâu phospho hữu cơ.","e"],["M","Tiếng thở","Thở khò khè, ran ngáy ẩm, đờm dãi nhiều.","n"],["T","Mạch","Mạch chậm 52 lần mỗi phút, yếu.","n"],["K","Nghe phổi","Ran ẩm và ran rít lan tỏa hai phế trường do tăng tiết và co thắt phế quản.","e"],["K","Khám bụng","Bụng mềm, tăng nhu động ruột, không phản ứng thành bụng.","n"],["K","Tri giác","Li bì nhưng gọi trả lời được, Glasgow 13 điểm.","n"]],"tests":[["Khí máu động mạch",8,"Thiếu oxy máu, toan hô hấp nhẹ.","e"],["Điện tâm đồ",5,"Nhịp chậm xoang, QTc kéo dài nhẹ, không block nhĩ thất.","e"],["Hoạt tính cholinesterase huyết tương",30,"Giảm rõ, xác nhận ức chế cholinesterase. Không chờ kết quả mới xử trí.","n"],["Đường huyết mao mạch",3,"6,4 mmol/L.","n"],["Điện giải đồ, chức năng gan thận",15,"Kali giảm nhẹ, chức năng thận bình thường.","n"],["X-quang ngực thẳng",10,"Mờ rải rác hai phế trường, không tràn khí.","n"],["CT sọ não không cản quang",25,"Không có chỉ định, không chấn thương, không dấu thần kinh khu trú.","w"]],"opt":{"ydx":["+Ngộ độc cấp thuốc trừ sâu phospho hữu cơ (hội chứng cholinergic)","Ngộ độc paraquat","Cơn hen phế quản nặng","Nhồi máu cơ tim cấp","Ngộ độc rượu methanol","Sốc phản vệ"]},"actions":["++Bảo đảm đường thở, hút đờm dãi, thở oxy, gắn monitor, sẵn sàng đặt nội khí quản và thở máy|2|SpO2 88% với tăng tiết phế quản nhiều, nguy cơ suy hô hấp.","++Tiêm tĩnh mạch atropin, lặp lại và tăng liều đến khi đạt dấu hiệu atropin hóa (hết ran phổi, mạch lên, khô dịch tiết)|3|Atropin là thuốc giải chính đối với biểu hiện muscarinic; mục tiêu là khô dịch tiết phế quản, không phải giãn đồng tử.","++Thiết lập đường truyền tĩnh mạch, lấy máu xét nghiệm và truyền dịch|2|Cần đường truyền để dùng atropin liên tục và bù dịch mất qua nôn, tiêu chảy.","+Cởi bỏ quần áo nhiễm, rửa da bằng nước sạch và xà phòng; nhân viên mang găng và áo choàng|2|Ngừng hấp thu qua da và bảo vệ nhân viên y tế.","+Rửa dạ dày bằng nước ấm sau khi đã bảo vệ đường thở, kèm than hoạt, nếu còn trong khung thời gian cho phép|6|Giảm lượng độc chất còn trong dạ dày; chỉ làm khi đường thở an toàn.","+Cân nhắc pralidoxim sau khi đã atropin hóa theo phác đồ cơ sở|3|Có thể tái hoạt hóa cholinesterase trong ngộ độc nặng; hiệu quả còn tranh luận.","+Chuyển hồi sức, theo dõi 24 đến 72 giờ|2|Nguy cơ suy hô hấp muộn do hội chứng trung gian và tái phát triệu chứng.","-Cho uống sữa hoặc dầu ăn để giảm hấp thu độc chất|1|Không có bằng chứng lợi ích, dầu có thể tăng hấp thu chất tan trong mỡ.","-Cho furosemid để giảm ran ẩm|2|Ran ẩm do tăng tiết phế quản chứ không do ứ dịch; cần atropin, không phải lợi tiểu.","!Gây nôn bằng móc họng hoặc cho uống nước muối đậm đặc|1|Nguy cơ hít sặc dịch chứa dung môi, bệnh nhân li bì.","!Dùng succinylcholin để đặt nội khí quản|2|Ức chế cholinesterase làm kéo dài tác dụng succinylcholin, gây liệt cơ kéo dài."],"teach":"Ngộ độc phospho hữu cơ gây hội chứng cholinergic: đồng tử co, vã mồ hôi, tăng tiết, mạch chậm, ran ẩm, giật cơ. Việc đầu tiên là đường thở, oxy và atropin đến khi khô dịch tiết phế quản; xét nghiệm cholinesterase để xác nhận, không chờ kết quả. Cần theo dõi nhiều ngày vì hội chứng trung gian. YHCT chỉ hỗ trợ giai đoạn hồi phục, không thay thế giải độc.","status":"draft"},{"id":"nhiem-toan-ceton-dai-thao-duong","title":"Nôn, đau bụng, thở sâu ở người đái tháo đường","kind":"Nội","level":"Trung bình","group":"noi","place":"Khoa Cấp cứu","clock":"10:05","name":"Chị Trần Thu Hà","age":24,"sex":"nữ","intro":"Chị Hà được bạn đưa vào cấp cứu vì mệt lả, buồn nôn, nôn nhiều và đau bụng hai ngày nay. Chị bị đái tháo đường typ 1 từ năm 15 tuổi, ba ngày gần đây bỏ tiêm insulin vì đau họng và ăn kém.","vitals":{"hr":124,"sbp":92,"dbp":56,"rr":30,"t":37.8,"spo2":98},"ask":[["Các triệu chứng bắt đầu khi nào và diễn tiến ra sao?","Hai ngày nay khát nước nhiều, tiểu nhiều, mệt, buồn nôn và nôn nhiều lần.","e"],["Chị có bệnh nền gì, đang dùng insulin thế nào?","Đái tháo đường typ 1 từ năm 15 tuổi, trước đây tiêm insulin mỗi ngày.","e"],["Gần đây chị có ngưng hoặc giảm insulin, hoặc có bệnh gì kèm theo không?","Ba ngày nay bỏ tiêm vì sợ hạ đường huyết khi ăn kém. Đau họng, sốt nhẹ.","e"],["Chị có thấy thở nhanh, sâu hoặc hơi thở có mùi lạ không?","Thấy thở nhanh, sâu, miệng có mùi như trái cây chín.","e"],["Đau bụng ở đâu, tính chất thế nào?","Đau âm ỉ khắp bụng, không rõ chỗ, kèm buồn nôn.","n"],["Có đái buốt, ho, tiêu chảy không?","Đau họng, không đái buốt, không tiêu chảy.","n"],["Có thấy lơ mơ, buồn ngủ nhiều không?","Mệt nhiều, buồn ngủ nhưng vẫn tỉnh, trả lời đúng.","n"],["Kinh nguyệt, có khả năng mang thai không?","Kinh lần cuối cách đây 2 tuần, không có thai.","n"],["Có dị ứng thuốc không?","Không.","n"]],"exam":[["V","Kiểu thở","Thở nhanh, sâu, đều kiểu Kussmaul.","e"],["V","Da và niêm mạc","Da khô, niêm mạc khô, nếp véo da mất chậm, mắt trũng.","e"],["V","Tri giác","Tỉnh, hơi lơ mơ, trả lời chậm.","n"],["M","Hơi thở","Mùi aceton như trái cây chín.","e"],["M","Giọng nói","Nói chậm, ngắt quãng vì thở nhanh.","n"],["T","Mạch và đầu chi","Mạch nhanh, nhỏ; đầu chi mát.","n"],["K","Khám bụng","Bụng mềm, ấn đau lan tỏa nhẹ, không phản ứng thành bụng.","e"],["K","Khám họng","Họng đỏ, amidan viêm nhẹ, là yếu tố khởi phát có thể.","n"],["K","Khám tim phổi","Tim nhanh đều; phổi rì rào phế nang rõ, không ran.","n"]],"tests":[["Đường huyết mao mạch",2,"28,4 mmol/L.","e"],["Ceton máu hoặc ceton niệu",5,"Ceton máu tăng cao, ceton niệu dương tính mạnh.","e"],["Khí máu động mạch",8,"pH 7,08; HCO3 7 mmol/L; PaCO2 20 mmHg: toan chuyển hóa tăng khoảng trống anion.","e"],["Điện giải đồ, ure, creatinin",10,"Natri 131 mmol/L, kali 5,0 mmol/L, creatinin tăng nhẹ do mất nước.","e"],["Công thức máu và CRP",15,"Bạch cầu 17 G/L, CRP tăng nhẹ, phù hợp stress hoặc nhiễm khuẩn hô hấp.","n"],["Điện tâm đồ",5,"Nhịp nhanh xoang, sóng T cao nhẹ, không loạn nhịp nguy hiểm.","n"],["X-quang ngực thẳng",10,"Không có đông đặc.","n"],["CT bụng có cản quang",40,"Không có chỉ định; đau bụng do toan ceton thường giảm khi điều trị nền, cản quang là gánh nặng thêm cho thận đang mất nước.","w"]],"opt":{"ydx":["+Nhiễm toan ceton do đái tháo đường typ 1","Tăng áp lực thẩm thấu máu tăng đường huyết (không toan ceton)","Hạ đường huyết nặng","Viêm tụy cấp","Viêm ruột thừa cấp","Viêm dạ dày ruột cấp mất nước"]},"actions":["++Đánh giá ABC, gắn monitor, đặt hai đường truyền tĩnh mạch ngoại vi|2|Mất nước nặng, nhịp nhanh, toan chuyển hóa nặng.","++Bù dịch NaCl 0,9% tĩnh mạch nhanh trong giờ đầu rồi giảm tốc độ theo đáp ứng|3|Mất dịch lớn; bù dịch là bước đầu tiên và quan trọng nhất.","++Truyền insulin thường tĩnh mạch liên tục sau khi đã biết kali máu không thấp|3|Ngăn tạo ceton và hạ đường huyết; phải biết kali trước để tránh hạ kali nặng.","+Theo dõi đường huyết mỗi giờ, kali và khí máu định kỳ; bổ sung kali theo kết quả|2|Insulin đưa kali vào tế bào nên kali máu giảm nhanh.","+Thêm dung dịch có glucose khi đường huyết xuống dưới ngưỡng theo phác đồ và vẫn tiếp tục insulin|2|Để tiếp tục khử ceton mà không gây hạ đường huyết.","+Tìm và điều trị yếu tố khởi phát (viêm họng, nhiễm khuẩn)|3|Nhiễm trùng và bỏ insulin là nguyên nhân thường gặp.","+Chuyển hồi sức hoặc đơn vị theo dõi sát, tư vấn không bỏ insulin nền|2|Nguy cơ tái phát; cần giáo dục bệnh nhân.","-Truyền natri bicarbonat thường quy|2|pH 7,08 trên 6,9, chưa có bằng chứng lợi ích, có thể gây hạ kali.","-Dùng kháng sinh phổ rộng thường quy khi chưa có bằng chứng nhiễm khuẩn|3|Họng viêm nhẹ, chưa có chỉ định.","!Truyền insulin tĩnh mạch liều cao ngay, không chờ kết quả kali máu|1|Kali có thể tụt nhanh, gây loạn nhịp và ngừng tim.","!Truyền dung dịch glucose 5% thay cho NaCl 0,9% ở giai đoạn đầu|1|Đường huyết 28 mmol/L, dung dịch glucose làm tăng thêm áp lực thẩm thấu và không bù được thể tích."],"teach":"Nhiễm toan ceton gồm tăng đường huyết, ceton máu và toan chuyển hóa tăng khoảng trống anion. Trình tự ưu tiên: bù dịch, kiểm tra kali, insulin tĩnh mạch, rồi tìm yếu tố khởi phát. Bỏ insulin ở người typ 1 là sai lầm nguy hiểm. YHCT (chứng tiêu khát) chỉ hỗ trợ sau khi bệnh nhân ổn định, không thay thế insulin.","status":"draft"},{"id":"vo-lach-chan-thuong-bung-kin","title":"Tai nạn xe máy, đau hạ sườn trái, choáng","kind":"Ngoại","level":"Khó","group":"ngoai","place":"Khoa Cấp cứu","clock":"19:50","name":"Anh Nguyễn Hoàng Long","age":24,"sex":"nam","intro":"Anh Long được xe cấp cứu đưa vào sau khi đi xe máy tông vào xe tải đỗ, hạ sườn trái đập mạnh vào tay lái cách đây 90 phút. Anh còn tỉnh, kêu đau bụng trên trái, hoa mắt và khát nước.","vitals":{"hr":126,"sbp":84,"dbp":52,"rr":28,"t":36.4,"spo2":95},"ask":[["Tai nạn xảy ra như thế nào, đau ở đâu?","Ngã xe, tay lái đập mạnh vào hạ sườn trái. Đau bụng trên bên trái, lan lên vai trái.","e"],["Anh có choáng, hoa mắt, khát nước, lạnh người không?","Choáng váng, khát nước, lạnh, hoa mắt khi cố ngồi dậy.","e"],["Có đội mũ bảo hiểm không? Có mất ý thức hoặc đau cổ không?","Có đội mũ, tỉnh suốt, không đau cổ.","e"],["Có bệnh nền hoặc đang dùng thuốc chống đông không?","Khỏe mạnh, không dùng thuốc.","e"],["Có nôn, tiểu máu hoặc ra máu trực tràng không?","Buồn nôn, không nôn máu, nước tiểu vàng sậm, không đỏ.","n"],["Có đau ngực hoặc khó thở không?","Đau tức nhẹ khi hít sâu ở ngực dưới trái.","n"],["Lần ăn uống cuối cùng?","Ăn cơm chiều cách đây khoảng 2 giờ.","n"],["Có dị ứng thuốc không? Đã tiêm phòng uốn ván chưa?","Không dị ứng; tiêm uốn ván cách đây 3 năm.","n"]],"exam":[["V","Da và niêm mạc","Da niêm nhợt, vã mồ hôi lạnh.","e"],["V","Vùng hạ sườn trái","Vết trầy và bầm tím vùng hạ sườn trái.","e"],["V","Tri giác và kiểu thở","Tỉnh, lo lắng, thở nhanh nông.","n"],["M","Giọng nói","Nói ngắn, hơi thở nhanh nhưng rõ.","n"],["T","Mạch và đầu chi","Mạch nhanh, nhỏ, khó bắt; đầu chi lạnh, thời gian đổ đầy mao mạch trên 3 giây.","e"],["K","Sờ nắn bụng","Bụng chướng nhẹ, ấn đau và có phản ứng thành bụng vùng hạ sườn trái, lan dần ra khắp bụng; ấn đau lan lên vai trái (dấu Kehr).","e"],["K","Khám ngực và xương sườn","Ấn đau các xương sườn thấp bên trái; phổi thông khí đều hai bên, không tràn khí dưới da.","n"],["K","Khám khung chậu và cột sống","Ép khung chậu không đau, cột sống không có điểm đau.","n"],["K","Thăm trực tràng và niệu đạo","Không có máu trên găng, không chảy máu ở lỗ niệu đạo.","n"]],"tests":[["Siêu âm FAST tại giường",3,"Dịch tự do quanh lách và túi cùng Douglas; không có dịch màng tim, màng phổi.","e"],["Hemoglobin nhanh",5,"Hb 9,6 g/dL (còn sớm, chưa phản ánh hết lượng máu mất).","e"],["Nhóm máu và phản ứng chéo",10,"Nhóm O Rh dương, đã chuẩn bị hồng cầu lắng.","e"],["Khí máu và lactate",8,"Lactate 4,2 mmol/L, toan chuyển hóa nhẹ.","n"],["Xét nghiệm đông máu",15,"Chưa rối loạn.","n"],["CT bụng có cản quang",40,"Chỉ dành cho bệnh nhân huyết động ổn định. Ca này huyết áp thấp, FAST dương tính nên không chuyển đi chụp.","w"],["CT sọ não không cản quang",30,"Không có chỉ định: tỉnh, Glasgow 15, không mất ý thức, không dấu thần kinh khu trú.","w"]],"opt":{"ydx":["+Vỡ lách do chấn thương bụng kín, sốc mất máu","Vỡ gan do chấn thương","Vỡ tạng rỗng (ruột, đại tràng)","Chấn thương thận trái","Tràn máu màng phổi trái đơn thuần","Tổn thương tụy do chấn thương"]},"actions":["++Đánh giá ABCDE theo quy trình chấn thương, thở oxy lưu lượng cao, gắn monitor|2|Sốc mất máu với SpO2 95% và thở nhanh.","++Đặt hai đường truyền tĩnh mạch lớn, lấy máu, hồi sức dịch tinh thể ấm lượng vừa phải|3|Cần duy trì tưới máu tối thiểu, không đẩy huyết áp lên cao khi chưa cầm máu.","++Báo động đỏ, hội chẩn ngoại khoa và gây mê hồi sức để mổ cấp cứu|2|Huyết động không ổn định kèm FAST dương tính là chỉ định mổ cấp cứu, không chờ chụp CT.","++Kích hoạt truyền máu (hồng cầu lắng, theo quy trình truyền máu khối lượng lớn nếu cần)|3|Mất máu phải thay bằng máu.","+Cân nhắc tranexamic acid đường tĩnh mạch trong 3 giờ đầu theo phác đồ|2|Giảm tử vong do chảy máu nếu dùng sớm.","+Giữ ấm, nhịn ăn uống, giảm đau tĩnh mạch liều nhỏ có theo dõi|2|Hạ thân nhiệt làm rối loạn đông máu; nhịn ăn để chuẩn bị gây mê.","+Đặt sonde tiểu theo dõi nước tiểu khi không có dấu hiệu tổn thương niệu đạo|2|Theo dõi tưới máu thận, lượng nước tiểu.","-Chọc rửa ổ bụng chẩn đoán|10|Đã có FAST dương tính, không cần thêm, làm chậm mổ.","-Châm cứu hoặc chườm nóng vùng hạ sườn trái để giảm đau|3|Chưa kiểm soát chảy máu, trì hoãn hồi sức.","!Giác hơi hoặc xoa bóp bấm huyệt vùng hạ sườn trái để giảm đau|3|Có thể làm tăng chảy máu từ lách vỡ và trì hoãn mổ.","!Đưa bệnh nhân đi chụp CT bụng khi huyết áp còn thấp, không có bác sĩ đi kèm|5|Huyết động không ổn định, nguy cơ ngừng tim ngoài khoa cấp cứu và trì hoãn mổ.","!Truyền nhanh lượng lớn dịch tinh thể để đưa huyết áp về bình thường|3|Pha loãng máu, hạ thân nhiệt, tăng chảy máu."],"teach":"Chấn thương hạ sườn trái, đau lan vai trái (dấu Kehr), mạch nhanh, huyết áp thấp và FAST dương tính nghĩ ngay vỡ lách chảy máu. Bệnh nhân huyết động không ổn định không đi chụp CT mà chuyển mổ. Hồi sức bằng máu, hạn chế dịch tinh thể, giữ ấm, cầm máu sớm. YHCT chỉ hỗ trợ phục hồi sau mổ, không được dùng giác hơi hoặc xoa bóp ở vùng chấn thương.","status":"draft"},{"id":"thai-ngoai-tu-cung-vo","title":"Chậm kinh, đau bụng dưới, ngất","kind":"Sản","level":"Khó","group":"sannhi","place":"Khoa Cấp cứu","clock":"14:20","name":"Chị Lê Thị Mỹ Duyên","age":29,"sex":"nữ","intro":"Chị Duyên được chồng đưa vào cấp cứu vì đau bụng dưới dữ dội đột ngột kèm choáng, ngất thoáng qua ở nhà vệ sinh. Chị chậm kinh khoảng 7 tuần và ra ít máu âm đạo ba ngày nay.","vitals":{"hr":128,"sbp":78,"dbp":48,"rr":28,"t":36.7,"spo2":96},"ask":[["Kỳ kinh cuối cách đây bao lâu? Chị đã thử thai chưa?","Chậm kinh khoảng 7 tuần. Que thử thai hai vạch cách đây một tuần, chưa đi khám thai.","e"],["Đau bụng bắt đầu thế nào, ở vị trí nào?","Đau dữ dội đột ngột ở bụng dưới bên phải, lan lên thượng vị và vai phải, rồi đau khắp bụng.","e"],["Ra huyết âm đạo như thế nào?","Ra ít máu đỏ sẫm từ ba ngày nay.","e"],["Chị có choáng, ngất, hoa mắt không?","Ngất thoáng qua ở nhà vệ sinh, hiện chóng mặt và khát nước.","e"],["Có tiền sử viêm vùng chậu, thai ngoài tử cung, mổ vùng chậu hoặc đặt vòng tránh thai không?","Hai năm trước từng bị viêm vùng chậu phải nằm viện. Không đặt vòng.","e"],["Chị mang thai và sinh con mấy lần?","Đây là lần mang thai đầu tiên, chưa sinh con.","n"],["Có sốt, nôn hoặc tiêu chảy không?","Không sốt, buồn nôn nhẹ, mót rặn muốn đi cầu.","n"],["Chị có dị ứng thuốc không? Nhóm máu của chị là gì?","Không dị ứng. Chị không nhớ nhóm máu.","n"]],"exam":[["V","Sắc mặt","Da niêm nhợt, vã mồ hôi lạnh, vẻ mặt đau và lo lắng.","e"],["V","Tư thế","Nằm co người, không dám cử động.","n"],["M","Giọng nói và hơi thở","Nói nhỏ, thở nhanh nông.","n"],["M","Mùi","Không có mùi hôi âm đạo.","n"],["T","Mạch và đầu chi","Mạch nhanh, nhỏ; đầu chi lạnh, mao mạch hồi phục chậm.","e"],["K","Khám bụng","Bụng chướng nhẹ, ấn đau khắp bụng nhiều nhất ở hố chậu phải, có phản ứng thành bụng.","e"],["K","Khám mỏ vịt và khám âm đạo","Ra ít máu đỏ sẫm; cổ tử cung đóng, di động cổ tử cung đau, túi cùng sau căng đầy đau, mơ hồ khối cạnh tử cung phải.","e"],["K","Khám tim phổi","Tim nhanh đều, phổi rì rào phế nang rõ.","n"]],"tests":[["Thử thai nhanh hCG nước tiểu",3,"Dương tính.","e"],["Siêu âm bụng và đầu dò âm đạo tại giường",6,"Không thấy túi thai trong buồng tử cung; dịch tự do nhiều ở túi cùng Douglas và quanh gan; khối hỗn hợp âm cạnh phần phụ phải.","e"],["Hemoglobin nhanh",5,"Hb 7,9 g/dL.","e"],["Nhóm máu, Rh và phản ứng chéo",10,"Nhóm A Rh dương; đã chuẩn bị hồng cầu lắng.","e"],["Định lượng beta-hCG máu",30,"Tăng, xác nhận thai nhưng không cần chờ khi đã có dịch ổ bụng, siêu âm gợi ý và huyết động không ổn định.","n"],["Xét nghiệm đông máu cơ bản",15,"Trong giới hạn bình thường.","n"],["Chụp X-quang tử cung vòi trứng",30,"Chống chỉ định ở người nghi có thai, không có giá trị trong cấp cứu.","w"]],"opt":{"ydx":["+Thai ngoài tử cung vỡ, chảy máu ổ bụng, sốc mất máu","Vỡ nang hoàng thể xuất huyết","Viêm ruột thừa cấp","Xoắn u nang buồng trứng","Sẩy thai đang tiến triển","Viêm phần phụ cấp"]},"actions":["++Đánh giá ABC, thở oxy, gắn monitor, đặt hai đường truyền tĩnh mạch lớn|2|Sốc mất máu với huyết áp 78/48 và mạch 128.","++Hồi sức dịch tinh thể ấm, chuẩn bị và truyền máu sớm theo mức độ sốc|3|Cần thay thể tích tuần hoàn, ưu tiên máu khi mất máu nhiều.","++Hội chẩn sản khoa và gây mê hồi sức, chuyển mổ cấp cứu cầm máu|2|Chảy máu đang tiếp diễn; phẫu thuật cầm máu là điều trị quyết định, không chờ huyết áp lên hẳn.","+Giữ ấm, nhịn ăn uống hoàn toàn, giảm đau tĩnh mạch có theo dõi|2|Chuẩn bị gây mê, tránh hạ thân nhiệt.","+Đặt sonde tiểu theo dõi lượng nước tiểu|2|Đánh giá tưới máu cơ quan.","+Xác định Rh; nếu Rh âm thì tiêm globulin miễn dịch kháng D theo phác đồ|2|Phòng đồng miễn dịch Rh ở lần mang thai sau.","+Giải thích tình trạng và ký cam kết phẫu thuật với chồng và bệnh nhân|2|Hoàn thiện thủ tục trước mổ cấp cứu.","-Chọc dò túi cùng sau Douglas để chẩn đoán|5|Siêu âm đã thấy dịch tự do; làm thêm trì hoãn xử trí.","-Truyền oxytocin hoặc dùng thuốc co hồi tử cung|2|Không có vai trò trong thai ngoài tử cung vỡ.","!Điều trị nội khoa bằng methotrexate|3|Chống chỉ định khi huyết động không ổn định và đã vỡ khối thai.","!Cho về theo dõi tại nhà, hẹn siêu âm lại sau 48 giờ|2|Nguy cơ tử vong do mất máu ở người đã có dấu hiệu sốc."],"teach":"Chậm kinh, đau bụng dưới, ra huyết âm đạo và sốc là thai ngoài tử cung vỡ cho đến khi chứng minh ngược lại. Thử thai dương tính, siêu âm không thấy túi thai trong tử cung kèm dịch tự do ổ bụng và huyết động không ổn định là chỉ định mổ cấp cứu, không chờ định lượng beta-hCG. Methotrexate chỉ dành cho người ổn định, chưa vỡ. YHCT chỉ hỗ trợ phục hồi khí huyết sau mổ.","status":"draft"},{"id":"kham-tyc-viem-mui-di-ung","title":"Hắt hơi, sổ mũi mỗi sáng sớm","kind":"Nội","level":"Dễ","group":"noi","place":"Phòng khám Nội YHCT","clock":"08:20","name":"Chị Nguyễn Thị Mai Anh","age":27,"sex":"nữ","intro":"Phòng khám Nội YHCT. Chị là nhân viên văn phòng, đến khám vì hắt hơi, sổ mũi, ngạt mũi tái diễn khoảng 2 năm, nặng nhất vào sáng sớm và khi thời tiết chuyển lạnh.","vitals":{"hr":76,"sbp":108,"dbp":68,"rr":16,"t":36.6,"spo2":99},"ask":[["Triệu chứng chính là gì, xuất hiện lúc nào trong ngày?","Hắt hơi từng tràng 5 đến 10 cái liền, chảy nước mũi trong như nước, ngạt mũi, nhất là sáng sớm vừa ngủ dậy và khi ra chỗ máy lạnh. Ngứa mũi, hay dụi mũi.","e"],["Có ngứa mắt, chảy nước mắt, ngứa họng không?","Ngứa mắt nhẹ, chảy nước mắt khi lên cơn. Ngứa vòm họng thỉnh thoảng.","n"],["Có yếu tố khởi phát nào rõ không (bụi, phấn hoa, lông thú, mùi lạ, thay đổi thời tiết)?","Nặng hơn khi quét dọn bụi, khi gió lạnh hoặc trời chuyển mùa. Nhà nuôi một con mèo.","e"],["Nước mũi màu gì? Có đau vùng mặt, sốt hoặc chảy mũi mủ không?","Nước mũi luôn trong, loãng. Không sốt, không đau nhức vùng má hay trán, không có mủ.","e"],["Có chảy máu mũi, ngạt chỉ một bên, giảm khứu giác kéo dài không?","Ngạt hai bên luân phiên, ngửi mùi hơi kém khi nghẹt nặng. Không chảy máu mũi.","e"],["Có khò khè, khó thở, ho về đêm hay tiền sử hen, chàm không?","Không khò khè, không khó thở. Hồi nhỏ có chàm nhẹ ở khuỷu tay. Mẹ bị viêm mũi dị ứng.","e"],["Cơ thể hay sợ lạnh, ra mồ hôi, dễ cảm không?","Người sợ gió, sợ lạnh, tự ra mồ hôi nhẹ, mỗi lần đổi thời tiết là hay cảm cúm. Hay mệt, ít nói.","e"],["Ăn uống, đại tiểu tiện thế nào?","Ăn bình thường, hơi đầy bụng nếu ăn đồ lạnh. Đại tiện nhão, tiểu trong.","n"],["Đã dùng thuốc gì cho mũi? Có hay nhỏ thuốc co mạch không?","Thỉnh thoảng uống thuốc kháng histamin thì đỡ vài giờ. Mua thuốc nhỏ mũi ngoài tiệm thuốc dùng khi nghẹt, khoảng 3 tuần nay mỗi ngày.","e"],["Giấc ngủ, đặc điểm công việc?","Ngủ được nhưng nghẹt mũi làm thức giấc. Làm việc phòng máy lạnh nhiều giờ.","n"]],"exam":[["V","Thần sắc","Sắc mặt trắng nhợt, tinh thần hơi mệt, không sốt.","n"],["V","Lưỡi","Chất lưỡi nhạt, rêu trắng mỏng, hơi ướt.","e"],["V","Mũi (nhìn ngoài)","Có nếp ngang sống mũi do hay dụi, quầng thâm nhẹ dưới mắt. Không biến dạng, không sưng đỏ vùng xoang.","n"],["M","Giọng nói, hơi thở","Giọng nói có âm mũi, nhỏ. Hơi thở không hôi.","n"],["M","Hắt hơi, ho","Hắt hơi từng tràng ngắn lúc khám. Không ho, không khò khè.","n"],["T","Mạch","Mạch phù, hoãn, nhược.","e"],["T","Sờ tay chân, da","Bàn tay hơi lạnh, da ẩm nhẹ.","n"],["K","Khám mũi (đèn soi)","Niêm mạc cuốn mũi dưới phù nề, nhợt màu hơi tím, dịch trong. Vách ngăn không lệch, không polyp, không mủ ở khe giữa.","e"],["K","Khám họng, tai, phổi","Họng không đỏ, có vài hạt lympho ở thành sau. Phổi thông khí rõ, không ran rít.","e"]],"tests":[["Công thức máu (bạch cầu ái toan)",10,"Bạch cầu bình thường, ái toan 6 phần trăm (hơi tăng).","n"],["Test lẩy da hoặc IgE đặc hiệu dị nguyên hô hấp",30,"Dương tính với mạt bụi nhà và lông mèo.","e"],["Nội soi mũi",10,"Cuốn mũi dưới phù nề nhợt, dịch trong, không polyp, khe giữa sạch, vách ngăn thẳng.","e"],["X-quang ngực thẳng",10,"Không bất thường. Không có chỉ định ở ca này.","w"],["CT xoang không cản quang",30,"Dày niêm mạc nhẹ ở cuốn mũi, các xoang thông thoáng. Không có chỉ định ở ca này, chi phí và liều tia không cần thiết.","w"]],"opt":{"ydx":["+Viêm mũi dị ứng quanh năm, mức độ nhẹ đến vừa","Viêm mũi xoang cấp do vi khuẩn","Polyp mũi","Viêm xoang mạn tính","Lệch vách ngăn mũi"],"bd":["+Tỵ cừu","Tỵ uyên","Cảm mạo","Khái thấu","Tỵ nục"],"bc":["+Lý – Hư – Hàn","Biểu – Thực – Hàn","Lý – Thực – Nhiệt","Biểu – Hư – Nhiệt","Lý – Thực – Hàn"],"the":["+Phế khí hư hàn","Phế kinh uất nhiệt","Tỳ khí hư nhược","Thận dương hư","Phong nhiệt phạm phế"],"phap":["+Ôn phế, ích khí, cố biểu, thông khiếu","Thanh tiết phế nhiệt, thông khiếu","Sơ phong thanh nhiệt","Kiện tỳ ích khí, thăng dương","Ôn bổ thận dương"],"phuong":["+Ngọc bình phong tán gia Tân di, Thương nhĩ tử","+Ôn phế chỉ lưu đan","Tân di thanh phế thang","Ngân kiều tán","Bổ trung ích khí thang"],"huyet":["+Nghênh hương","+Hợp cốc","+Phế du","+Túc tam lý","+Ấn đường","Thái xung","Dương lăng tuyền","Chi câu","Thiên khu"]},"actions":["+Hướng dẫn hạn chế dị nguyên (bụi, thú nuôi, giặt chăn ga nước nóng)|3|Giảm tiếp xúc dị nguyên là nền tảng điều trị.","+Rửa mũi nước muối sinh lý hằng ngày|2|Làm sạch dị nguyên, giảm phù nề niêm mạc.","+Dùng thuốc xịt mũi corticoid tại chỗ hoặc kháng histamin theo phác đồ YHHĐ|2|Điều trị đầu tay theo hướng dẫn viêm mũi dị ứng.","+Cứu hoặc châm Phế du, Túc tam lý, Nghênh hương|15|Ôn phế, ích khí, cố biểu thông khiếu.","+Hướng dẫn giữ ấm cổ, gáy, tránh gió lạnh trực tiếp từ máy lạnh|2|Phòng tái phát ở thể phế khí hư hàn.","+Hẹn tái khám, chuyển khám Tai Mũi Họng nếu ngạt một bên, chảy máu mũi, mủ, đau mặt hoặc khò khè|2|Sàng lọc dấu hiệu cảnh báo.","-Chụp CT xoang thường quy|40|Không có dấu hiệu viêm xoang, không cần thiết.","!Dùng thuốc nhỏ mũi co mạch hằng ngày kéo dài|1|Gây viêm mũi do thuốc, ngạt mũi dội ngược; cần ngừng thuốc nhỏ mũi co mạch đang dùng.","!Cho thuốc thanh nhiệt hàn lương mạnh (Hoàng liên, Thạch cao)|2|Thể phế khí hư hàn, thuốc hàn lương làm tổn thương thêm dương khí."],"teach":"Hắt hơi từng tràng, nước mũi trong, ngạt mũi sáng sớm, niêm mạc cuốn mũi nhợt phù cùng tiền sử dị ứng gia đình hướng tới viêm mũi dị ứng; thể Phế khí hư hàn với sợ gió, tự ra mồ hôi, lưỡi nhạt, mạch phù hoãn nhược. Dấu hiệu cảnh báo cần chuyển Tai Mũi Họng: ngạt một bên, chảy máu mũi, mủ, đau mặt, mất khứu giác kéo dài. Lưu ý nhóm thuốc co mạch nhỏ mũi gây ngạt dội ngược.","status":"draft"},{"id":"kham-nhi-bieng-an-ty-hu","title":"Bé 4 tuổi chậm ăn, hay ốm vặt","kind":"Nhi","level":"Dễ","group":"sannhi","place":"Phòng khám Nhi YHCT","clock":"15:10","name":"Bé Trần Gia Huy","age":4,"sex":"nam","intro":"Phòng khám Nhi YHCT. Mẹ đưa bé trai 4 tuổi đến khám vì chậm ăn, bỏ bữa, hay ốm vặt khoảng 5 tháng nay.","vitals":{"hr":98,"sbp":90,"dbp":56,"rr":22,"t":36.7,"spo2":99},"ask":[["Bé biếng ăn từ khi nào, ăn được bao nhiêu so với trước?","Khoảng 5 tháng nay. Mỗi bữa chỉ ăn được nửa chén cơm, nhai lâu rồi ngậm, phải dỗ hoặc cho xem điện thoại mới ăn.","e"],["Bé có sụt cân, chậm tăng cân hay chậm cao so với bạn cùng tuổi?","Cân nặng từ lúc 3 tuổi đến nay tăng rất ít. Hiện cân 14 kg, cao 98 cm. Mẹ thấy bé nhỏ con hơn các bạn.","e"],["Có nôn, đau bụng, tiêu chảy kéo dài hay phân có máu, phân mỡ không?","Không nôn, không đau bụng dữ dội. Phân lúc nhão lúc thành khuôn, không máu, không thấy mỡ.","e"],["Có sốt kéo dài, ho kéo dài, ra mồ hôi trộm hay nổi hạch không?","Không sốt kéo dài. Hay cảm ho nhẹ 1 đến 2 tháng một lần, khỏi sau vài ngày. Không ra mồ hôi trộm, không nổi hạch.","e"],["Bé có nuốt khó, ngậm thức ăn, đau miệng, sâu răng không?","Không nuốt sặc. Có 2 răng sâu nhẹ, không loét miệng.","n"],["Chế độ ăn: uống sữa, nước ngọt, ăn vặt trước bữa chính thế nào?","Uống sữa hộp 3 lần mỗi ngày, hay ăn bánh kẹo, uống nước ngọt trước bữa cơm. Ít rau, ít thịt đỏ.","e"],["Đại tiện, tiểu tiện, giấc ngủ, mồ hôi?","Đại tiện nhão, 1 đến 2 lần mỗi ngày. Ngủ không sâu, hay ra mồ hôi đầu khi ngủ. Tiểu trong.","n"],["Bé có tính tình ra sao, thích uống nước lạnh hay ấm? Hay mệt, ít chạy nhảy?","Hiền, ít nghịch, hay mệt, không thích chạy nhiều. Thích uống nước ấm, không khát nhiều.","n"],["Đã tẩy giun chưa, đã dùng thuốc kích thích ăn ngon chưa?","Tẩy giun cách đây 1 năm. Mẹ tự mua siro bổ cho ăn ngon uống 1 tháng, không đỡ nhiều.","n"]],"exam":[["V","Thần sắc, thể trạng","Bé tỉnh, nhanh nhẹn vừa phải, gầy, da hơi xanh, tóc thưa. Không phù, không vàng da.","e"],["V","Lưỡi","Chất lưỡi nhạt, rêu trắng mỏng. Không bợt rêu dày.","e"],["V","Móng, niêm mạc mắt","Niêm mạc mắt nhợt nhẹ, móng tay hơi nhợt.","n"],["M","Giọng khóc, hơi thở","Giọng nói nhỏ, hơi thở không hôi.","n"],["T","Mạch","Mạch hoãn, nhược, khó bắt rõ vì bé quấy.","e"],["T","Sờ bụng, tay chân","Tay chân hơi mát, bụng mềm, không chướng.","n"],["K","Cân đo","Cân nặng 14 kg, cao 98 cm, dưới trung vị rõ rệt trên biểu đồ tăng trưởng WHO, trong khoảng âm một đến âm hai độ lệch chuẩn. Không phù.","e"],["K","Khám bụng, gan lách, hạch","Bụng mềm, không khối, gan lách không to, không sờ thấy hạch bất thường.","e"],["K","Khám tim phổi","Tim đều không âm thổi. Phổi rõ, không ran.","n"]],"tests":[["Công thức máu",10,"Hb 10,6 g/dL, MCV 72 fL, bạch cầu bình thường.","e"],["Ferritin huyết thanh",20,"Giảm (thiếu sắt).","e"],["Soi phân tìm trứng và ký sinh trùng đường ruột",15,"Không thấy trứng giun, không thấy ký sinh trùng.","n"],["Tổng phân tích nước tiểu",10,"Bình thường.","n"],["CT ngực bụng có cản quang",40,"Không bất thường. Không có chỉ định ở ca này, trẻ nhỏ, liều tia không cần thiết.","w"],["Nội soi dạ dày",45,"Không có chỉ định ở trẻ biếng ăn không dấu hiệu báo động.","w"]],"opt":{"ydx":["+Biếng ăn chức năng (do chế độ ăn, hành vi) kèm thiếu máu thiếu sắt nhẹ","Suy dinh dưỡng cấp nặng","Bệnh celiac","Nhiễm giun sán","Lao sơ nhiễm"],"bd":["+Yếm thực","Cam tích","Tiết tả","Nhi hãn chứng","Ế cách"],"bc":["+Lý – Hư – Hàn","Lý – Thực – Nhiệt","Biểu – Thực – Hàn","Lý – Hư – Nhiệt","Biểu – Hư – Nhiệt"],"the":["+Tỳ vị khí hư","Nhũ thực tích trệ","Vị âm bất túc","Can vượng khắc tỳ","Tỳ thận dương hư"],"phap":["+Kiện tỳ ích khí, khai vị tiêu thực","Tiêu thực đạo trệ, thông phủ","Dưỡng âm sinh tân, ích vị","Sơ can lý khí","Ôn bổ thận dương"],"phuong":["+Dị công tán","+Sâm linh bạch truật tán","Bảo hòa hoàn","Ích vị thang","Tiêu dao tán"],"huyet":["+Túc tam lý","+Tỳ du","+Vị du","+Trung quản","+Tứ phùng","Phong long","Thái xung","Đại chùy","Nội quan"]},"actions":["+Tư vấn nếp ăn: giờ ăn cố định, không xem điện thoại, hạn chế sữa hộp, bánh kẹo, nước ngọt trước bữa|4|Biếng ăn chức năng chủ yếu do chế độ ăn và thói quen.","+Bổ sung sắt theo phác đồ nhi khoa và theo dõi Hb|2|Có thiếu máu thiếu sắt nhẹ kèm ferritin thấp.","+Xoa bóp bấm huyệt vùng bụng, bấm Túc tam lý, Tỳ du|10|Kiện tỳ, khai vị, an toàn ở trẻ nhỏ.","+Cứu ôn hòa hoặc xoa bóp nhẹ vùng bụng, không dùng châm sâu|5|Trẻ 4 tuổi ưu tiên kỹ thuật nhẹ nhàng, ít xâm lấn.","+Theo dõi cân nặng, chiều cao hằng tháng, hẹn tái khám|2|Đánh giá đáp ứng điều trị.","+Dặn chuyển khám Nhi nếu sụt cân, sốt kéo dài, nôn, tiêu chảy kéo dài, phân mỡ hoặc chậm lớn rõ|2|Sàng lọc dấu hiệu cảnh báo bệnh lý thực thể.","-Chụp CT ngực bụng|40|Không có chỉ định ở trẻ nhỏ.","!Ép ăn, dọa nạt, cho ăn rong chạy theo bé|1|Củng cố hành vi ăn uống xấu, làm trẻ chán ăn thêm.","!Cho thuốc tẩy hạ mạnh (Đại hoàng, Mang tiêu) vì nghĩ là tích|2|Thể Tỳ vị khí hư, thuốc công phạt làm tỳ vị tổn thương thêm, nguy cơ mất nước."],"teach":"Trẻ biếng ăn kéo dài cần đánh giá tăng trưởng trước, loại trừ bệnh thực thể và thiếu vi chất (thiếu sắt thường gặp). Thể Tỳ vị khí hư: ăn ít, người gầy, sắc mặt nhợt, lưỡi nhạt, mạch hoãn nhược. Ở trẻ nhỏ ưu tiên điều chỉnh chế độ ăn, xoa bóp bấm huyệt, thuốc kiện tỳ; tránh công phạt mạnh. Dấu hiệu cảnh báo cần chuyển tuyến: sụt cân, sốt kéo dài, nôn, tiêu chảy mạn, thiếu máu nặng.","status":"draft"},{"id":"kham-ho-man-viem-phe-quan-dam-thap","title":"Ho khạc đờm kéo dài ở người hút thuốc","kind":"Nội","level":"Trung bình","group":"noi","place":"Phòng khám Nội YHCT","clock":"09:40","name":"Ông Trần Văn Hậu","age":58,"sex":"nam","intro":"Phòng khám Nội YHCT. Ông là tài xế, hút thuốc lá nhiều năm, đến khám vì ho khạc đờm kéo dài mỗi sáng, 4 tháng nay, nhiều đợt ho kéo dài mỗi năm.","vitals":{"hr":82,"sbp":130,"dbp":80,"rr":19,"t":36.8,"spo2":96},"ask":[["Ho từ bao lâu, ho vào lúc nào, đờm màu gì?","Ho khạc đờm hằng ngày, chủ yếu buổi sáng, đã gần 4 tháng; những năm trước cũng ho vài tháng mỗi năm. Đờm trắng, dính, dễ khạc, lượng nhiều.","e"],["Có ho ra máu, đau ngực, khàn tiếng kéo dài không?","Không ho ra máu, không đau ngực. Giọng bình thường.","e"],["Có sụt cân, sốt về chiều, ra mồ hôi trộm không?","Không sụt cân đáng kể, không sốt, không ra mồ hôi trộm.","e"],["Có khó thở khi gắng sức, khò khè không?","Leo 2 tầng lầu thấy hơi hụt hơi, nghỉ vài phút hết. Thỉnh thoảng khò khè lúc sáng. Không khó thở khi nghỉ.","e"],["Hút thuốc bao nhiêu, bao lâu? Môi trường làm việc, tiếp xúc bụi?","Hút 1 bao mỗi ngày gần 30 năm. Lái xe, hay hít khói bụi đường.","e"],["Cảm giác ngực, ăn uống, đại tiện thế nào?","Ngực đầy tức, nặng nề, ăn kém, bụng đầy. Người hay buồn ngủ, thân thể nặng. Đại tiện nhão.","e"],["Có sợ lạnh hay khát nước, thích uống nóng hay lạnh?","Sợ lạnh nhẹ, ít khát, thích uống nước ấm.","n"],["Có ợ chua, trào ngược, ho nhiều về đêm không? Tiền sử hen, lao, bệnh tim?","Thỉnh thoảng ợ chua. Chưa từng mắc lao, hen hay bệnh tim. Cũng chưa đo chức năng hô hấp bao giờ.","n"],["Đã dùng thuốc gì? Đã tiêm vắc xin cúm, phế cầu chưa?","Uống kháng sinh 2 đợt không rõ loại, đỡ ít. Chưa tiêm vắc xin nào.","n"]],"exam":[["V","Thần sắc, thể trạng","Thể trạng béo nhẹ, sắc mặt xám, tinh thần tỉnh táo. Không xanh tím, không phù.","n"],["V","Lưỡi","Chất lưỡi nhạt bệu, rêu trắng dày nhớt.","e"],["V","Lồng ngực, ngón tay","Lồng ngực bình thường, không co kéo cơ hô hấp phụ. Ngón tay không dùi trống.","n"],["M","Tiếng ho, đờm","Ho khạc nặng tiếng, đờm trắng dính trong ống. Hơi thở không hôi.","e"],["T","Mạch","Mạch hoạt, hoãn.","e"],["T","Sờ tay chân, bụng","Tay chân ấm, bụng đầy nhẹ, mềm.","n"],["K","Nghe phổi","Rì rào phế nang giảm nhẹ hai đáy, ran ngáy rải rác, vài ran rít cuối thì thở ra. Không ran nổ cố định.","e"],["K","Khám tim, bụng, hạch","Tim đều, không âm thổi. Gan lách không to. Không phù chi dưới, hạch cổ không to.","n"],["K","Đo SpO2, nhịp thở","SpO2 96 phần trăm khí phòng, nhịp thở 19 lần mỗi phút, nói được câu dài.","n"]],"tests":[["X-quang ngực thẳng",10,"Tăng đậm rốn phổi hai bên, không thấy khối, không đông đặc, không tràn dịch màng phổi.","e"],["Đo hô hấp ký (chức năng thông khí) sau test giãn phế quản",25,"FEV1/FVC sau test 0,74, FEV1 90 phần trăm trị số dự đoán. Chưa thấy tắc nghẽn luồng khí cố định.","e"],["Công thức máu",10,"Bạch cầu 8,2 G/L, trung tính bình thường. Hb 15 g/dL.","n"],["Soi đờm tìm AFB hoặc Xpert MTB/RIF",60,"Âm tính.","n"],["CT ngực có cản quang",40,"Không có chỉ định ở lần khám đầu khi X-quang không bất thường và không có dấu hiệu báo động.","w"],["Nội soi phế quản",60,"Không có chỉ định ở ca này.","w"]],"opt":{"ydx":["+Viêm phế quản mạn, cần đo hô hấp ký để loại trừ COPD","Lao phổi","Ung thư phế quản","Hen phế quản","Giãn phế quản"],"bd":["+Khái thấu","Háo suyễn","Phế ung","Hung tý","Phế nuy"],"bc":["+Lý – Thực – Hàn","Biểu – Thực – Hàn","Lý – Thực – Nhiệt","Lý – Hư – Nhiệt","Biểu – Hư – Hàn"],"the":["+Đàm thấp trở phế (Tỳ hư sinh đàm)","Phong hàn phạm phế","Đàm nhiệt úng phế","Phế âm hư","Can hỏa phạm phế"],"phap":["+Kiện tỳ táo thấp, hóa đàm chỉ khái","Sơ phong tán hàn, tuyên phế","Thanh nhiệt hóa đàm","Tư âm nhuận phế","Bình can giáng nghịch"],"phuong":["+Nhị trần thang","~Tam tử dưỡng thân thang","Tang cúc ẩm","Thanh khí hóa đàm hoàn","Bách hợp cố kim thang"],"huyet":["+Phế du","+Phong long","+Túc tam lý","+Thiên đột","+Liệt khuyết","Thái xung","Hành gian","Dương lăng tuyền","Giải khê"]},"actions":["+Tư vấn bỏ thuốc lá, hướng dẫn hỗ trợ cai thuốc|5|Bỏ thuốc là biện pháp quan trọng nhất làm chậm tiến triển bệnh phổi mạn.","+Tiêm phòng cúm hằng năm và phế cầu theo khuyến cáo|2|Giảm đợt cấp, biến chứng nhiễm trùng hô hấp.","+Hướng dẫn tập thở, tránh khói bụi, đeo khẩu trang|3|Hỗ trợ thông khí, giảm kích thích đường thở.","+Châm hoặc cứu Phế du, Phong long, Túc tam lý|20|Kiện tỳ hóa đàm, hỗ trợ giảm ho đờm.","+Hẹn tái khám, đánh giá lại hô hấp ký, theo dõi SpO2|2|Theo dõi diễn tiến, phát hiện COPD.","+Dặn tái khám khẩn khi ho ra máu, sụt cân, khó thở tăng, sốt kéo dài, khàn tiếng trên 3 tuần|2|Sàng lọc dấu hiệu báo động ung thư phổi, lao.","-Chỉ định CT ngực ngay lần đầu|40|Chưa có chỉ định khi X-quang bình thường và không có dấu hiệu báo động.","!Cho thuốc ức chế ho trung ương mạnh (codein) khi đờm nhiều|1|Ứ đờm, nguy cơ bội nhiễm, không phù hợp ho nhiều đờm.","!Dùng kháng sinh phổ rộng kéo dài khi đờm trắng, không sốt|3|Không có bằng chứng nhiễm khuẩn, tăng nguy cơ kháng thuốc."],"teach":"Ho khạc đờm hơn 3 tháng mỗi năm ở người hút thuốc là viêm phế quản mạn; hô hấp ký sau giãn phế quản quyết định có COPD hay không. Thể Đàm thấp trở phế: đờm trắng dính nhiều, ngực đầy, rêu trắng dày nhớt, mạch hoạt. Phải sàng lọc ho ra máu, sụt cân, sốt chiều, khàn tiếng để loại trừ lao và ung thư phổi, kèm khuyên bỏ thuốc lá.","status":"draft"},{"id":"kham-dau-nua-dau-can-duong","title":"Đau nửa đầu từng cơn, buồn nôn sợ ánh sáng","kind":"Nội","level":"Trung bình","group":"noi","place":"Phòng khám Nội YHCT","clock":"14:00","name":"Chị Đỗ Thị Thu Hà","age":34,"sex":"nữ","intro":"Phòng khám Nội YHCT. Chị là kế toán, đến khám vì đau nửa đầu bên phải từng cơn khoảng 2 năm, những tháng gần đây dày hơn khi áp lực công việc.","vitals":{"hr":78,"sbp":112,"dbp":70,"rr":16,"t":36.7,"spo2":99},"ask":[["Đau ở đâu, tính chất đau thế nào, mỗi cơn kéo dài bao lâu?","Đau nửa đầu bên phải, thường từ thái dương lan ra sau mắt, đau theo nhịp mạch đập. Mỗi cơn 6 đến 24 giờ, 2 đến 3 cơn mỗi tháng.","e"],["Có buồn nôn, nôn, sợ ánh sáng, sợ tiếng ồn khi đau không?","Buồn nôn nhiều, từng nôn một lần. Phải nằm phòng tối, yên tĩnh. Vận động làm đau tăng.","e"],["Có thấy ánh sáng nhấp nháy, tê, yếu liệt hay rối loạn nói trước hoặc trong cơn không?","Không có ánh sáng nhấp nháy, không tê, không yếu liệt, không nói khó.","e"],["Cơn đau đầu này có khác trước, đau đột ngột dữ dội như sét đánh, sốt, cứng gáy không?","Cơn đau vẫn giống những năm trước, không đột ngột dữ dội, không sốt, không cứng gáy.","e"],["Có yếu tố khởi phát: căng thẳng, thiếu ngủ, bỏ bữa, rượu, mùi mạnh, kỳ kinh?","Dễ lên cơn khi nóng giận, căng thẳng kéo dài, thiếu ngủ, hay trước kỳ kinh 1 đến 2 ngày.","e"],["Cảm giác nóng giận, miệng đắng, ngủ, đại tiểu tiện?","Dễ cáu gắt, miệng đắng, họng khô, mắt hay đỏ. Ngủ hay mộng mị, đại tiện táo, nước tiểu vàng.","e"],["Đã dùng thuốc giảm đau gì, bao nhiêu ngày mỗi tháng? Có dùng thuốc tránh thai không?","Uống paracetamol khoảng 4 ngày mỗi tháng thì đỡ ít. Không dùng thuốc tránh thai.","n"],["Có tiền sử gia đình đau nửa đầu, bệnh lý mạch máu não, chấn thương đầu gần đây không?","Mẹ bị đau nửa đầu. Không chấn thương đầu, không bệnh mạch máu não.","n"],["Thị lực, chóng mặt, ù tai?","Thị lực bình thường. Thỉnh thoảng hơi choáng khi đau. Không ù tai.","n"]],"exam":[["V","Thần sắc","Sắc mặt hơi đỏ, mắt đỏ nhẹ, vẻ mặt căng thẳng, dễ kích động.","n"],["V","Lưỡi","Chất lưỡi đỏ, rêu vàng mỏng.","e"],["M","Giọng nói, hơi thở","Giọng nói to, nhanh, hơi thở hơi nóng, không hôi.","n"],["T","Mạch","Mạch huyền, sác.","e"],["T","Ấn huyệt vùng đầu cổ","Ấn đau vùng thái dương phải và cơ thang hai bên. Không cứng gáy.","n"],["K","Khám thần kinh","Tỉnh táo, đồng tử đều, vận động và cảm giác bình thường, phản xạ gân xương bình thường, dấu Babinski âm tính, không dấu màng não.","e"],["K","Soi đáy mắt","Gai thị bờ rõ, không phù gai thị.","e"],["K","Đo huyết áp hai tay, khám tim phổi","Huyết áp 112 trên 70 mmHg hai tay đều. Tim phổi bình thường.","n"],["K","Khám vùng mặt, xoang, hàm","Không đau vùng xoang, khớp thái dương hàm không đau.","n"]],"tests":[["Công thức máu, tốc độ máu lắng",15,"Bình thường.","n"],["Đường huyết mao mạch",5,"5,2 mmol/L.","n"],["Nhật ký đau đầu và thang điểm tàn tật MIDAS",15,"Điểm MIDAS cho thấy ảnh hưởng mức vừa.","n"],["MRI sọ não",45,"Không bất thường. Không có chỉ định ở đau nửa đầu điển hình, khám thần kinh bình thường.","w"],["CT sọ não",20,"Không bất thường. Không có chỉ định ở ca này.","w"],["Điện não đồ",30,"Không đặc hiệu. Không có chỉ định để chẩn đoán đau nửa đầu.","w"]],"opt":{"ydx":["+Đau nửa đầu không có aura (migraine)","Đau đầu căng thẳng","Đau đầu cụm","Xuất huyết dưới nhện","Viêm xoang cấp"],"bd":["+Thiên đầu thống","Huyễn vựng","Trúng phong","Đầu thống do ngoại cảm","Tỵ uyên"],"bc":["+Lý – Thực – Nhiệt","Biểu – Thực – Hàn","Lý – Hư – Hàn","Biểu – Thực – Nhiệt","Lý – Hư – Nhiệt"],"the":["+Can dương thượng cang","Phong hàn thượng phạm","Đàm trọc thượng nhiễu","Huyết ứ trở lạc","Khí huyết lưỡng hư"],"phap":["+Bình can tiềm dương, tức phong chỉ thống","Sơ phong tán hàn chỉ thống","Hóa đàm giáng nghịch","Hoạt huyết hóa ứ thông lạc","Bổ ích khí huyết"],"phuong":["+Thiên ma câu đằng ẩm","~Long đởm tả can thang","Xuyên khung trà điều tán","Bán hạ bạch truật thiên ma thang","Quy tỳ thang"],"huyet":["+Phong trì","+Thái dương","+Suất cốc","+Thái xung","+Hợp cốc","Quan nguyên","Tỳ du","Thận du","Túc tam lý"]},"actions":["+Hướng dẫn ghi nhật ký đau đầu, nhận diện và tránh yếu tố khởi phát|5|Nền tảng điều trị dự phòng đau nửa đầu.","+Vệ sinh giấc ngủ, ăn đúng bữa, giảm căng thẳng, vận động đều|3|Giảm tần suất cơn.","+Châm Phong trì, Thái dương, Suất cốc, Thái xung, Hợp cốc|20|Bình can tiềm dương, giảm đau.","+Hướng dẫn dùng thuốc cắt cơn sớm theo phác đồ YHHĐ (NSAID, triptan nếu không chống chỉ định)|3|Thuốc cắt cơn hiệu quả khi dùng sớm.","+Dặn tái khám khẩn khi đau đột ngột dữ dội, sốt, cứng gáy, yếu liệt, rối loạn nói, ngất, đau đầu kiểu mới thay đổi|2|Sàng lọc dấu hiệu cảnh báo đau đầu thứ phát.","+Hẹn tái khám, giới hạn thuốc giảm đau không quá 10 ngày mỗi tháng|2|Tránh đau đầu do lạm dụng thuốc.","-Chụp MRI sọ não thường quy|45|Đau nửa đầu điển hình, khám thần kinh bình thường, không có dấu hiệu báo động.","!Kê thuốc opioid (codein, tramadol) hoặc thuốc giảm đau dùng hằng ngày|1|Không khuyến cáo, nguy cơ phụ thuộc và đau đầu do lạm dụng thuốc.","!Cho thuốc ôn nhiệt cay nóng (Phụ tử, Can khương, Quế chi liều cao)|2|Thể Can dương thượng cang, thuốc ôn nhiệt làm dương cang nặng thêm."],"teach":"Đau nửa đầu một bên, đập theo mạch, 6 đến 24 giờ, buồn nôn, sợ ánh sáng và tiếng ồn, khám thần kinh bình thường là đủ chẩn đoán lâm sàng; không cần chẩn đoán hình ảnh thường quy. Thể Can dương thượng cang: cáu gắt, miệng đắng, lưỡi đỏ rêu vàng mỏng, mạch huyền sác. Phải loại trừ dấu hiệu cảnh báo: đau sét đánh, sốt cứng gáy, triệu chứng thần kinh khu trú, khởi phát sau 50 tuổi, phù gai thị.","status":"draft"},{"id":"kham-thong-ta-ruot-kich-thich","title":"Đau quặn bụng rồi đi ngoài phân nát","kind":"Nội","level":"Trung bình","group":"noi","place":"Phòng khám Nội YHCT","clock":"10:30","name":"Anh Võ Minh Quân","age":38,"sex":"nam","intro":"Phòng khám Nội YHCT. Anh là nhân viên ngân hàng, đến khám vì đau quặn bụng, đi ngoài phân nát nhiều lần mỗi ngày kéo dài khoảng 8 tháng, tăng khi căng thẳng.","vitals":{"hr":80,"sbp":118,"dbp":76,"rr":17,"t":36.7,"spo2":99},"ask":[["Đau bụng ở đâu, tính chất thế nào, liên quan đến đi ngoài ra sao?","Đau quặn quanh bụng dưới và hố chậu trái, đau muốn đi ngoài, đi xong thì đỡ. Đau từng cơn, vài lần mỗi tuần, khoảng 8 tháng nay.","e"],["Đại tiện mấy lần mỗi ngày, phân thế nào, có máu hay nhầy, đi ngoài ban đêm không?","Đi 3 đến 4 lần mỗi ngày, phân nát hoặc sệt, có ít nhầy trắng. Không thấy máu, không đen. Không phải dậy đêm đi ngoài.","e"],["Có sụt cân, sốt, thiếu máu, mệt nhiều không?","Cân nặng ổn định 65 kg. Không sốt. Chỉ hơi mệt, không chóng mặt.","e"],["Có tiền sử gia đình ung thư đại trực tràng, bệnh viêm ruột, bệnh celiac không?","Không ai trong gia đình mắc các bệnh này.","e"],["Triệu chứng nặng lên khi nào?","Nặng hơn khi căng thẳng, áp lực công việc, sau bữa ăn nhiều dầu mỡ, sữa. Cuối tuần nghỉ ngơi thì đỡ.","e"],["Có đầy hơi, ợ hơi, sôi bụng, cảm giác đi chưa hết phân không?","Hay đầy hơi, sôi bụng, sau đi vẫn thấy chưa hết phân.","n"],["Tính tình, ngủ, ăn uống?","Dễ cáu gắt, hay lo lắng, ngủ nông. Ăn kém, sợ ăn nhiều vì sợ đau bụng. Người mệt, ít sức.","e"],["Có sợ lạnh, tay chân lạnh, đi ngoài lúc rạng sáng không?","Không đi ngoài lúc rạng sáng, không đặc biệt sợ lạnh.","n"],["Đã dùng thuốc gì, có dùng kháng sinh gần đây không? Có đi du lịch hay ăn thực phẩm lạ?","Uống men vi sinh và thuốc cầm tiêu chảy đôi lần, đỡ tạm thời. Không dùng kháng sinh, không đi xa gần đây.","n"]],"exam":[["V","Thần sắc, thể trạng","Thể trạng trung bình, sắc mặt hơi vàng nhạt, vẻ lo lắng. Không xanh xao rõ.","n"],["V","Lưỡi","Chất lưỡi nhạt hơi bệu, bên có vết hằn răng, rêu trắng mỏng.","e"],["M","Giọng nói, hơi thở, bụng","Hay thở dài. Hơi thở không hôi. Nghe bụng nhu động ruột tăng nhẹ.","n"],["T","Mạch","Mạch huyền, hoãn (huyền ở bộ quan trái, hoãn nhược ở bộ quan phải).","e"],["T","Sờ tay chân","Tay chân không lạnh, hơi ẩm.","n"],["K","Khám bụng","Bụng mềm, ấn đau nhẹ hố chậu trái, không phản ứng thành bụng, không khối, gan lách không to.","e"],["K","Thăm trực tràng","Trương lực cơ thắt bình thường, không khối, găng không dính máu.","e"],["K","Khám da, niêm mạc, tuyến giáp","Niêm mạc mắt hồng, không loét miệng, tuyến giáp không to.","n"]],"tests":[["Công thức máu",10,"Hb 14,2 g/dL, bạch cầu bình thường.","e"],["CRP",15,"Bình thường.","e"],["Calprotectin phân",60,"Dưới 50 microgam mỗi gam (bình thường).","e"],["Soi phân, cấy phân, tìm ký sinh trùng",30,"Không bạch cầu, hồng cầu, không có ký sinh trùng.","n"],["Kháng thể kháng transglutaminase mô IgA",60,"Âm tính.","n"],["CT bụng có cản quang",40,"Không bất thường. Không có chỉ định ở ca này.","w"]],"opt":{"ydx":["+Hội chứng ruột kích thích thể tiêu chảy (theo tiêu chuẩn Rome IV)","Viêm loét đại trực tràng chảy máu","Bệnh Crohn","Ung thư đại tràng","Bệnh celiac"],"bd":["+Thống tả","Lỵ","Phúc thống","Táo bón","Tiện huyết"],"bc":["+Lý – Hư thực thác tạp – Hàn","Biểu – Thực – Hàn","Lý – Thực – Nhiệt","Lý – Hư – Nhiệt","Biểu – Hư – Hàn"],"the":["+Can uất tỳ hư (Can khí phạm Tỳ)","Thấp nhiệt đại trường","Tỳ thận dương hư","Thực tích đình trệ","Hàn thấp khốn tỳ"],"phap":["+Sơ can kiện tỳ, ức can phù tỳ, chỉ tả","Thanh nhiệt lợi thấp, chỉ tả","Ôn bổ tỳ thận, cố sáp chỉ tả","Tiêu thực đạo trệ","Ôn trung tán hàn, hóa thấp"],"phuong":["+Thống tả yếu phương","~Sâm linh bạch truật tán","Cát căn cầm liên thang","Tứ thần hoàn","Bảo hòa hoàn"],"huyet":["+Thiên khu","+Túc tam lý","+Tỳ du","+Thái xung","+Âm lăng tuyền","Đại chùy","Thái dương","Phế du","Dũng tuyền"]},"actions":["+Giải thích bản chất hội chứng ruột kích thích, trấn an, khuyên giảm căng thẳng|5|Ca chức năng, liệu pháp giáo dục, tâm lý có lợi.","+Ghi nhật ký ăn uống, hạn chế thực phẩm gây khởi phát (dầu mỡ, sữa, rượu, caffeine, thực phẩm nhiều FODMAP)|4|Thay đổi chế độ ăn giúp giảm triệu chứng.","+Châm cứu Thiên khu, Túc tam lý, Tỳ du, Thái xung|20|Sơ can kiện tỳ, điều hòa vận hóa.","+Hướng dẫn tập thể dục đều, ngủ đủ, kỹ thuật thư giãn|3|Điều hòa trục ruột não.","+Hẹn tái khám 4 đến 6 tuần, nội soi đại tràng nếu xuất hiện dấu hiệu báo động (đi ngoài ra máu, sụt cân, thiếu máu, tiêu chảy đêm, khối bụng)|2|Sàng lọc dấu hiệu cảnh báo bệnh thực thể.","+Dùng thuốc YHHĐ triệu chứng khi cần (chống co thắt, men vi sinh) theo chỉ định|2|Hỗ trợ giảm đau bụng, tiêu chảy.","-Chụp CT bụng có cản quang|40|Không có chỉ định ở ca không dấu hiệu báo động.","!Cho thuốc tả hạ công trục (Đại hoàng, Mang tiêu) vì nghĩ là thực tích|2|Thể Can uất tỳ hư, thuốc tả hạ làm tỳ vị tổn thương, tiêu chảy nặng thêm.","!Dùng kháng sinh phổ rộng kéo dài|3|Không có bằng chứng nhiễm khuẩn, gây rối loạn hệ vi sinh đường ruột."],"teach":"Đau bụng liên quan đại tiện, thay đổi tính chất phân, không sụt cân, không máu, xét nghiệm viêm và calprotectin bình thường gợi ý hội chứng ruột kích thích thể tiêu chảy. Thể Can uất Tỳ hư: đau muốn đi ngoài, đi xong thì đỡ, tăng khi căng thẳng, lưỡi nhạt bệu hằn răng, mạch huyền hoãn. Bắt buộc sàng lọc dấu hiệu báo động (máu trong phân, sụt cân, thiếu máu, tiêu chảy đêm, khởi phát sau 50 tuổi, tiền sử gia đình) để chỉ định nội soi và loại trừ bệnh viêm ruột, ung thư.","status":"draft"},{"id":"kham-thong-kinh-khi-tre-huyet-u","title":"Đau bụng dưới dữ dội mỗi kỳ kinh","kind":"Sản phụ khoa","level":"Trung bình","group":"sannhi","place":"Phòng khám Sản phụ khoa YHCT","clock":"16:20","name":"Cô Lê Thu Trang","age":21,"sex":"nữ","intro":"Phòng khám Sản phụ khoa YHCT. Cô là sinh viên, đến khám vì đau bụng dưới dữ dội mỗi kỳ kinh khoảng 6 năm, mấy tháng nay phải nghỉ học vào ngày đầu.","vitals":{"hr":82,"sbp":106,"dbp":66,"rr":16,"t":36.6,"spo2":99},"ask":[["Đau bụng kinh bắt đầu từ khi nào, đau ở đâu, kéo dài bao lâu?","Có kinh năm 13 tuổi, đau từ khoảng 15 tuổi. Đau quặn bụng dưới, lan ra thắt lưng, bắt đầu trước kỳ kinh 1 đến 2 ngày và nặng nhất ngày đầu, kéo dài 2 đến 3 ngày.","e"],["Tính chất kinh nguyệt: chu kỳ, lượng, màu máu, máu cục?","Chu kỳ 28 đến 30 ngày đều. Lượng vừa, màu tối, nhiều máu cục. Ra máu cục xong thì đỡ đau.","e"],["Đau có đỡ khi chườm ấm hay xoa bóp không? Đau trướng hay đau quặn?","Đau trướng, quặn, ấn vào thì đau hơn. Chườm ấm đỡ một phần. Vú căng tức trước kỳ kinh.","e"],["Có ra khí hư bất thường, sốt, đau bụng ngoài kỳ kinh, đau khi quan hệ không?","Không ra khí hư hôi, không sốt. Không đau bụng ngoài kỳ kinh. Chưa có quan hệ tình dục.","e"],["Có đau tăng dần theo thời gian, đau không đáp ứng thuốc giảm đau, rong huyết ngoài kỳ không?","Đau ổn định, uống ibuprofen đầu kỳ thì giảm khá. Không ra huyết ngoài kỳ kinh.","e"],["Có buồn nôn, tiêu chảy, mệt lả, ngất khi đau không?","Buồn nôn nhẹ, không ngất, không tiêu chảy.","n"],["Tính tình, giấc ngủ, ăn uống?","Hay cáu gắt trước kỳ kinh, tức ngực, ngủ ngon. Ăn bình thường.","n"],["Có sợ lạnh, tay chân lạnh, đau tăng khi trời lạnh?","Không đặc biệt sợ lạnh.","n"],["Tiền sử gia đình (mẹ, chị) có đau bụng kinh nặng, lạc nội mạc tử cung, u xơ?","Mẹ cũng từng đau bụng kinh khi trẻ, đã đỡ sau sinh. Không ai mắc lạc nội mạc tử cung.","n"]],"exam":[["V","Thần sắc","Sắc mặt hơi sạm, vẻ mặt khó chịu nhưng tỉnh táo, không xanh xao.","n"],["V","Lưỡi","Chất lưỡi tím tối, có điểm ứ huyết hai bên rìa, rêu trắng mỏng.","e"],["M","Giọng nói, hơi thở","Hay thở dài, giọng nói bình thường.","n"],["T","Mạch","Mạch huyền, sáp.","e"],["T","Ấn bụng dưới, sờ tay chân","Bụng dưới ấn đau, cự án. Tay chân không lạnh.","n"],["K","Khám bụng","Bụng mềm, ấn đau nhẹ trên xương mu, không phản ứng thành bụng, không khối vùng chậu, không dấu hiệu viêm phúc mạc.","e"],["K","Khám tổng quát","Không sốt, niêm mạc hồng, tuyến giáp không to. Chỉ số khối cơ thể 20,5.","n"],["K","Khám vú và hạch","Vú không khối, hơi căng tức. Không hạch.","n"]],"tests":[["Thử thai nhanh hoặc beta hCG",10,"Âm tính.","e"],["Siêu âm bụng, tử cung và phần phụ",20,"Tử cung kích thước bình thường, không u xơ, không u nang buồng trứng, không dịch túi cùng.","e"],["Công thức máu",10,"Hb 12,8 g/dL, bình thường.","n"],["Xét nghiệm dịch âm đạo, tìm tác nhân viêm nhiễm",20,"Không có tác nhân bệnh. Không có chỉ định thường quy ở ca chưa quan hệ tình dục.","n"],["CA-125",60,"Bình thường. Không có chỉ định ở ca không nghi ung thư buồng trứng hay lạc nội mạc tử cung nặng.","w"],["MRI vùng chậu",50,"Không bất thường. Không có chỉ định ở lần khám đầu khi siêu âm bình thường.","w"]],"opt":{"ydx":["+Đau bụng kinh nguyên phát","Lạc nội mạc tử cung","Bệnh viêm vùng chậu mạn","Thai ngoài tử cung","U nang buồng trứng"],"bd":["+Thống kinh","Kinh nguyệt không đều","Băng lậu","Phúc thống","Bế kinh"],"bc":["+Lý – Thực (huyết ứ, khí trệ)","Biểu – Thực – Hàn","Lý – Hư – Hàn","Lý – Hư – Nhiệt","Biểu – Hư – Nhiệt"],"the":["+Khí trệ huyết ứ","Hàn thấp ngưng trệ","Khí huyết hư nhược","Can thận hư tổn","Thấp nhiệt uẩn kết"],"phap":["+Hành khí hoạt huyết, hóa ứ chỉ thống","Ôn kinh tán hàn, trừ thấp","Bổ ích khí huyết","Tư dưỡng can thận","Thanh nhiệt lợi thấp"],"phuong":["+Cách hạ trục ứ thang","~Thiếu phúc trục ứ thang","Ôn kinh thang","Bát trân thang","Thanh nhiệt điều huyết thang"],"huyet":["+Tam âm giao","+Thái xung","+Huyết hải","+Khí hải","+Quan nguyên","Phong trì","Thái dương","Phế du","Dũng tuyền"]},"actions":["+Giải thích đây là đau bụng kinh nguyên phát, trấn an, hướng dẫn chườm ấm bụng dưới|3|Cải thiện triệu chứng, giảm lo lắng.","+Dùng thuốc giảm đau kháng viêm không steroid (NSAID) từ trước hoặc đầu kỳ kinh theo chỉ định nếu không chống chỉ định|2|Điều trị đầu tay theo YHHĐ.","+Châm hoặc cứu Tam âm giao, Quan nguyên, Khí hải, Huyết hải, Thái xung|20|Hành khí hoạt huyết, thông kinh chỉ thống.","+Hướng dẫn vận động nhẹ, ngủ đủ, hạn chế đồ lạnh, giảm căng thẳng trước kỳ kinh|3|Giảm tần suất, mức độ đau.","+Theo dõi lịch kinh, hẹn tái khám 2 đến 3 chu kỳ, chuyển khám Sản phụ khoa nếu đau tăng dần, không đáp ứng NSAID, ra huyết bất thường hoặc khối vùng chậu|2|Sàng lọc đau bụng kinh thứ phát (lạc nội mạc tử cung).","+Thử thai trước khi dùng thuốc hoạt huyết hoặc châm vùng bụng|1|Loại trừ có thai.","-Chỉ định MRI vùng chậu ngay lần đầu|50|Siêu âm bình thường, không có dấu hiệu thứ phát.","!Dùng thuốc hoạt huyết phá ứ mạnh (Tam lăng, Nga truật, Đào nhân liều cao) khi chưa loại trừ có thai|2|Có nguy cơ sảy thai nếu có thai.","!Ấn mạnh, xoa bóp sâu vùng bụng dưới khi chưa loại trừ thai ngoài tử cung, khối vùng chậu|1|Có nguy cơ vỡ khối, nguy hiểm tính mạng."],"teach":"Đau bụng kinh xuất hiện sau vài năm có kinh, ngay trước hoặc đầu kỳ kinh, đáp ứng NSAID, khám và siêu âm bình thường gợi ý thể nguyên phát. Thể Khí trệ huyết ứ: đau trướng, cự án, máu tối có cục, ra cục thì đỡ, lưỡi tím tối, mạch huyền sáp. Ở phụ nữ trong tuổi sinh sản luôn loại trừ có thai trước khi dùng thuốc hoạt huyết; cảnh báo cần chuyển tuyến: đau tăng dần, đau ngoài kỳ kinh, không đáp ứng thuốc, sốt, khí hư mủ, khối vùng chậu.","status":"draft"},{"id":"kham-tieu-khat-dai-thao-duong-tip-2","title":"Khát nước, tiểu nhiều, mệt, mới phát hiện đường huyết cao","kind":"Nội","level":"Khó","group":"noi","place":"Phòng khám Nội YHCT","clock":"08:50","name":"Ông Phạm Quốc Bảo","age":49,"sex":"nam","intro":"Phòng khám Nội YHCT. Ông là chủ cửa hàng, thừa cân, đến khám vì khát nước, tiểu nhiều, mệt mỏi khoảng 2 tháng. Kết quả khám sức khỏe gần đây báo đường huyết đói cao.","vitals":{"hr":84,"sbp":132,"dbp":84,"rr":17,"t":36.7,"spo2":98},"ask":[["Có khát nước nhiều, uống nhiều, tiểu nhiều không? Từ khi nào?","Khát, hay uống nước, tiểu 6 đến 7 lần mỗi ngày, đêm dậy tiểu 2 lần, khoảng 2 tháng nay.","e"],["Có sụt cân nhanh, buồn nôn, nôn, đau bụng, thở nhanh sâu không?","Sụt khoảng 2 kg trong 2 tháng. Không nôn, không đau bụng, không thở nhanh.","e"],["Có mờ mắt, tê bì chân, loét hoặc vết thương lâu lành, nhiễm trùng da không?","Hơi mờ mắt thoáng qua. Tê nhẹ đầu ngón chân. Không có vết loét ở bàn chân.","e"],["Có đau ngực, khó thở khi gắng sức, đau cách hồi chân không?","Không đau ngực, không đau cách hồi.","e"],["Tiền sử gia đình đái tháo đường, tăng huyết áp, rối loạn mỡ máu? Cân nặng, vòng bụng?","Cha bị đái tháo đường. Cân nặng 78 kg, cao 1,68 m. Bụng to, ít vận động.","e"],["Cảm giác mệt, ăn uống, miệng khô, ra mồ hôi?","Mệt, ít sức, miệng họng khô, ăn bình thường, hay ra mồ hôi tay. Lòng bàn tay chân hơi nóng.","e"],["Giấc ngủ, đại tiện?","Ngủ không sâu, đại tiện hơi táo.","n"],["Có dùng thuốc, thực phẩm chức năng hoặc thuốc nam nào không?","Chưa dùng thuốc điều trị đái tháo đường. Có uống thuốc nam bạn tặng, không rõ thành phần.","e"],["Có hút thuốc, uống rượu không?","Hút khoảng nửa bao mỗi ngày, uống bia cuối tuần.","n"]],"exam":[["V","Thần sắc, thể trạng","Thể trạng thừa cân (chỉ số khối cơ thể 27,6), tinh thần hơi mệt, da khô.","n"],["V","Lưỡi","Chất lưỡi đỏ nhạt, ít tân dịch, rêu trắng mỏng khô.","e"],["M","Giọng nói, hơi thở","Giọng nói nhỏ, hơi thở không có mùi trái cây (aceton).","e"],["T","Mạch","Mạch tế, nhược, hơi sác.","e"],["T","Sờ lòng bàn tay chân","Lòng bàn tay, bàn chân ấm nóng nhẹ, da khô.","n"],["K","Khám bàn chân (monofilament, mạch mu chân)","Giảm cảm giác nhẹ đầu ngón chân khi thử monofilament, mạch mu chân bắt được, không loét, da không nứt nẻ.","e"],["K","Khám tim, phổi, bụng","Tim đều, phổi rõ, bụng mềm, gan không to.","n"],["K","Đo huyết áp, chu vi vòng bụng","Huyết áp 132 trên 84 mmHg, vòng bụng 96 cm.","n"]],"tests":[["Đường huyết tĩnh mạch lúc đói",10,"8,4 mmol/L (lần 2 cũng trên 7).","e"],["HbA1c",30,"7,6 phần trăm.","e"],["Tổng phân tích nước tiểu, ceton niệu",15,"Glucose niệu dương tính, ceton âm tính.","e"],["Creatinin máu và eGFR, tỷ lệ albumin trên creatinin niệu",30,"Creatinin bình thường, eGFR 98, albumin niệu bình thường.","e"],["Lipid máu, men gan",30,"Triglycerid 2,8 mmol/L, LDL-C 3,5 mmol/L, men gan bình thường.","n"],["Điện tâm đồ",5,"Nhịp xoang, không bất thường.","n"],["Kháng thể kháng GAD",90,"Không cần thiết ở bệnh nhân người lớn thừa cân, không ceton, nghi típ 2 điển hình.","w"],["MRI tụy",60,"Không có chỉ định ở ca này.","w"]],"opt":{"ydx":["+Đái tháo đường típ 2 mới phát hiện, chưa biến chứng cấp","Đái tháo đường típ 1","Tiền đái tháo đường","Đái tháo nhạt","Cường giáp"],"bd":["+Tiêu khát","Lâm chứng","Hư lao","Huyễn vựng","Tỳ đản"],"bc":["+Lý – Hư – Nhiệt","Lý – Thực – Nhiệt","Biểu – Thực – Hàn","Lý – Hư – Hàn","Biểu – Hư – Nhiệt"],"the":["+Khí âm lưỡng hư","Phế vị táo nhiệt","Can thận âm hư","Âm dương lưỡng hư","Thấp nhiệt trung tiêu"],"phap":["+Ích khí dưỡng âm, sinh tân chỉ khát","Thanh nhiệt tả hỏa, sinh tân","Bổ thận tư âm","Ôn bổ thận dương","Thanh nhiệt lợi thấp"],"phuong":["+Sinh mạch tán gia vị","+Ngọc tuyền hoàn","Bạch hổ gia nhân sâm thang","Kim quỹ thận khí hoàn","Long đởm tả can thang"],"huyet":["+Tỳ du","+Thận du","+Túc tam lý","+Tam âm giao","+Thái khê","Phong trì","Thái dương","Đại chùy","Dương lăng tuyền"]},"actions":["+Tư vấn thay đổi lối sống: chế độ ăn kiểm soát carbohydrate, tăng vận động ít nhất 150 phút mỗi tuần, giảm cân|8|Nền tảng kiểm soát đái tháo đường típ 2.","+Khởi đầu điều trị đái tháo đường theo phác đồ YHHĐ (thường metformin nếu eGFR cho phép và không chống chỉ định)|3|Cần điều trị nền YHHĐ để kiểm soát đường huyết.","+Hướng dẫn tự theo dõi đường huyết, nhận biết hạ đường huyết và triệu chứng tăng đường huyết nặng|5|Tự quản lý bệnh.","+Sàng lọc biến chứng: khám mắt, đáy mắt, nước tiểu albumin, bàn chân, tim mạch|5|Chẩn đoán đã có tê chân nhẹ, cần đánh giá sớm.","+Châm cứu hoặc thuốc YHCT hỗ trợ (Tỳ du, Thận du, Túc tam lý, Tam âm giao, Thái khê)|20|Ích khí dưỡng âm hỗ trợ kiểm soát đường huyết, triệu chứng.","+Hướng dẫn bỏ thuốc lá, hạn chế bia rượu, hẹn kiểm tra HbA1c sau 3 tháng|3|Giảm nguy cơ tim mạch, theo dõi đáp ứng.","+Dặn đến cấp cứu khi buồn nôn nôn, đau bụng, thở nhanh sâu, lơ mơ, khát dữ dội hoặc đường huyết rất cao|2|Sàng lọc dấu hiệu nhiễm toan ceton, tăng áp lực thẩm thấu.","-Chụp MRI tụy|60|Không có chỉ định.","!Ngừng thuốc YHHĐ, chỉ dùng thuốc nam hoặc thực phẩm chức năng để hạ đường huyết|1|Nguy cơ tăng đường huyết, biến chứng, thuốc nam không rõ thành phần có thể chứa corticoid hoặc sulfonylurea.","!Cho thuốc ôn nhiệt bổ dương (Phụ tử, Nhục quế liều cao)|2|Thể khí âm lưỡng hư, thuốc ôn nhiệt làm hao thương âm dịch thêm."],"teach":"Triệu chứng khát, tiểu nhiều, sụt cân với đường huyết đói 7 mmol/L trở lên hai lần hoặc HbA1c từ 6,5 phần trăm cho phép chẩn đoán đái tháo đường; cần xác nhận típ, ceton niệu và sàng lọc biến chứng ngay từ đầu. Thể Khí âm lưỡng hư: mệt, miệng khô, lưỡi đỏ nhạt ít tân, mạch tế nhược. YHCT hỗ trợ, không thay thế thuốc YHHĐ; cảnh báo khẩn cấp: buồn nôn, đau bụng, thở sâu, lơ mơ, vết loét bàn chân.","status":"draft"},{"id":"kham-tao-bon-man-cao-tuoi-da-benh","title":"Cụ bà 72 tuổi đại tiện khó, nhiều ngày một lần","kind":"Nội","level":"Khó","group":"phuctap","place":"Phòng khám Nội YHCT","clock":"09:05","name":"Bà Lê Thị Bích","age":72,"sex":"nữ","intro":"Phòng khám Nội YHCT. Bà đã nghỉ hưu, bị tăng huyết áp, đái tháo đường típ 2 và thoái hóa khớp gối, đến khám vì đại tiện khó, 4 đến 5 ngày mới đi một lần, phân khô cứng khoảng 7 tháng.","vitals":{"hr":74,"sbp":138,"dbp":78,"rr":17,"t":36.5,"spo2":97},"ask":[["Đại tiện thế nào: số lần, hình dạng phân, có rặn nhiều, có cảm giác đi chưa hết không?","Khoảng 4 đến 5 ngày mới đi một lần, phân khô, viên cứng như phân dê, rặn nhiều, đi xong vẫn thấy chưa hết. Khoảng 7 tháng nay.","e"],["Phân có máu, có đổi màu đen, có sụt cân, mệt nhiều, thiếu máu không?","Không thấy máu, phân không đen. Cân nặng ổn định 52 kg, không sụt cân đáng kể.","e"],["Có đau bụng, đầy chướng, buồn nôn, nôn không? Có bí trung tiện không?","Đầy bụng nhẹ khi nhiều ngày chưa đi, không nôn, vẫn trung tiện được.","e"],["Có tiền sử gia đình ung thư đại trực tràng, đã nội soi đại tràng lần nào chưa?","Chưa ai trong gia đình mắc. Đã nội soi đại tràng cách đây 4 năm, được bảo là bình thường.","e"],["Có đang dùng thuốc: canxi, thuốc huyết áp, thuốc đái tháo đường, giảm đau, sắt?","Uống amlodipine, metformin, canxi carbonat mỗi ngày. Thỉnh thoảng uống thuốc giảm đau khớp.","e"],["Uống nước, ăn rau, vận động thế nào?","Uống ít nước vì sợ tiểu đêm, ăn ít rau, ngồi nhiều vì đau khớp gối.","e"],["Cảm giác chóng mặt, hồi hộp, da khô, môi khô, ngủ?","Hay chóng mặt nhẹ khi đứng dậy, hồi hộp, da khô, môi khô, ngủ kém.","e"],["Có hay dùng thuốc nhuận tràng, thuốc xổ không?","Mua thuốc nhuận tràng kích thích ngoài hiệu thuốc, dùng 2 đến 3 lần mỗi tuần, đỡ rồi lại táo.","n"],["Có sợ lạnh, chậm chạp, tăng cân, da khô (nghi suy giáp)?","Không sợ lạnh đặc biệt, cân nặng ổn định.","n"]],"exam":[["V","Thần sắc, thể trạng","Cụ gầy, sắc mặt nhợt nhạt, da khô, tinh thần mệt mỏi.","n"],["V","Lưỡi","Chất lưỡi nhạt, ít tân dịch, rêu trắng mỏng khô.","e"],["M","Giọng nói, hơi thở","Giọng nói nhỏ, ngắt quãng. Hơi thở không hôi.","n"],["T","Mạch","Mạch tế, sáp.","e"],["T","Sờ tay chân, da","Tay chân hơi mát, da khô, bụng không đau.","n"],["K","Khám bụng","Bụng mềm, hố chậu trái sờ thấy cục phân, không đau, không khối, không dấu tắc ruột, nhu động ruột giảm nhẹ.","e"],["K","Thăm trực tràng","Phân cứng trong bóng trực tràng, không khối u, không trĩ chảy máu, trương lực cơ thắt bình thường.","e"],["K","Khám tuyến giáp, thần kinh, đo huyết áp tư thế","Tuyến giáp không to, phản xạ bình thường. Huyết áp nằm 138 trên 78, đứng 128 trên 74 mmHg.","n"]],"tests":[["Công thức máu",10,"Hb 12,4 g/dL, MCV bình thường.","e"],["Xét nghiệm máu ẩn trong phân (FIT)",20,"Âm tính.","e"],["TSH",30,"Bình thường.","e"],["Đường huyết, HbA1c, canxi máu, creatinin, điện giải đồ",40,"Đường huyết đói 7,2 mmol/L, HbA1c 7,0 phần trăm, canxi máu hơi cao bình thường, creatinin bình thường, K bình thường.","e"],["X-quang bụng không chuẩn bị",15,"Phân ứ đọng đại tràng sigma, không có mức nước hơi, không giãn quai ruột.","n"],["CT bụng có cản quang",40,"Không bất thường lớn. Không có chỉ định ở ca không dấu hiệu báo động, tăng nguy cơ ở người cao tuổi dùng metformin.","w"]],"opt":{"ydx":["+Táo bón mạn thứ phát do thuốc, ít uống nước và ít vận động (không dấu hiệu báo động)","Ung thư đại trực tràng","Suy giáp","Tắc ruột bán cấp","Hội chứng ruột kích thích thể táo bón"],"bd":["+Tiện bí","Phúc thống","Tiết tả","Lỵ","Hư lao"],"bc":["+Lý – Hư – Nhiệt (tân dịch khuy tổn)","Lý – Thực – Nhiệt","Biểu – Thực – Hàn","Lý – Thực – Hàn","Biểu – Hư – Hàn"],"the":["+Huyết hư tân khuy (Âm huyết bất túc)","Nhiệt bí (Vị tràng thực nhiệt)","Khí bí (Can khí uất)","Hàn bí (Dương hư)","Tỳ ước"],"phap":["+Dưỡng huyết tư âm, nhuận tràng thông tiện","Tả nhiệt thông tiện (công hạ mạnh)","Thuận khí đạo trệ, thông tiện","Ôn dương thông tiện","Sơ can giải uất"],"phuong":["+Nhuận tràng hoàn","~Tăng dịch thang","Đại thừa khí thang","Lục ma thang","Tế xuyên tiễn"],"huyet":["+Thiên khu","+Đại trường du","+Chi câu","+Tam âm giao","+Túc tam lý","Phong trì","Thái dương","Liệt khuyết","Đại chùy"]},"actions":["+Tăng uống nước theo khả năng, ăn thêm rau, chất xơ, thói quen đi đại tiện đúng giờ|4|Điều chỉnh yếu tố cơ bản gây táo bón.","+Xem xét lại thuốc: đổi dạng canxi hoặc điều chỉnh liều, hội chẩn bác sĩ kê đơn về nhóm thuốc có thể gây táo bón|3|Canxi, thuốc chẹn kênh canxi có thể góp phần.","+Dùng thuốc nhuận tràng thẩm thấu hoặc thuốc tạo khối phân theo chỉ định thay vì thuốc kích thích kéo dài|2|An toàn và phù hợp cho táo bón mạn ở người già.","+Châm hoặc xoa bóp bấm huyệt Thiên khu, Đại trường du, Chi câu, Tam âm giao, Túc tam lý|20|Dưỡng huyết nhuận tràng, điều hòa vận hóa đại trường.","+Hướng dẫn vận động nhẹ, xoa bụng theo chiều kim đồng hồ|5|Tăng nhu động ruột, phù hợp bệnh nhân đau khớp gối.","+Dặn tái khám sớm và nội soi đại tràng khi thấy máu trong phân, phân đen, sụt cân, thiếu máu, đau bụng tăng, bí trung tiện, nôn|2|Sàng lọc dấu hiệu báo động ung thư, tắc ruột.","-Chụp CT bụng có cản quang|40|Không có chỉ định, nguy cơ ở người cao tuổi dùng metformin.","!Dùng thuốc tả hạ mạnh có Đại hoàng, Mang tiêu kéo dài|2|Thể huyết hư tân khuy ở người già, công hạ mạnh gây mất nước, rối loạn điện giải, hao thương chính khí.","!Dùng thuốc nhuận tràng kích thích mỗi ngày kéo dài|1|Gây phụ thuộc, mất kali, tổn thương chức năng đại tràng."],"teach":"Ở người cao tuổi đa bệnh, táo bón mạn thường do thuốc (canxi, thuốc chẹn kênh canxi), ít nước, ít vận động; cần loại trừ suy giáp, tăng canxi, đái tháo đường. Thể Huyết hư tân khuy: phân khô như phân dê, da khô, chóng mặt, lưỡi nhạt ít tân, mạch tế sáp, dùng dưỡng huyết nhuận tràng, tránh công hạ mạnh. Dấu hiệu báo động cần nội soi và chuyển tuyến: máu trong phân, sụt cân, thiếu máu, táo bón mới xuất hiện sau 50 tuổi, bí trung tiện.","status":"draft"},{"id":"canh-vai-tay-thoai-hoa-csc","title":"Đau cổ vai lan xuống tay, tê ngón cái và ngón trỏ","kind":"Cơ xương khớp","level":"Trung bình","group":"cxk","place":"Phòng châm cứu","clock":"08:40","name":"Ông Trần Văn Khải","age":56,"sex":"nam","intro":"Ông làm kế toán, ngồi máy tính nhiều giờ mỗi ngày. Ông đến vì đau cổ vai gáy 2 tháng, mấy tuần nay đau lan xuống cánh tay phải kèm tê ngón cái và ngón trỏ.","vitals":{"hr":76,"sbp":130,"dbp":80,"rr":18,"t":36.6,"spo2":98},"ask":[["Đau từ khi nào, đau ở đâu, lan đi đâu?","Đau cổ vai gáy bên phải khoảng 2 tháng, 3 tuần nay đau lan dọc mặt ngoài cánh tay xuống cẳng tay, tới ngón cái và ngón trỏ.","e"],["Có tê, kim châm hoặc yếu tay không?","Tê như kiến bò ở ngón cái, ngón trỏ tay phải. Cầm bút, cầm ly còn được, chưa rơi đồ.","e"],["Đau tăng khi nào, đỡ khi nào?","Đau tăng khi ngửa cổ, quay cổ sang phải, khi ngồi máy lạnh lâu và buổi sáng sớm. Chườm ấm, xoa bóp nhẹ thì dễ chịu.","e"],["Có sợ gió, sợ lạnh, người nặng nề không?","Sợ gió lạnh, cổ gáy cứng như bị chèn, hay quấn khăn. Người hơi nặng nề, trời ẩm đau nhiều hơn.","e"],["Có yếu hai chân, đi loạng choạng, vụng về khi cài khuy áo không?","Không yếu chân, đi đứng bình thường, cài khuy áo bình thường.","e"],["Có rối loạn đại tiểu tiện không?","Đại tiểu tiện bình thường.","e"],["Có sốt, sụt cân, đau về đêm không giảm khi đổi tư thế không?","Không sốt, không sụt cân. Đau có đỡ khi đổi tư thế.","e"],["Có chấn thương cổ hoặc tai nạn gần đây không?","Không có chấn thương.","n"],["Ăn uống, ngủ nghỉ ra sao?","Ăn được, ngủ hơi khó vì đau khi nằm nghiêng bên phải.","n"],["Tiền sử bệnh nội khoa và thuốc đang dùng?","Tăng huyết áp nhẹ, đang uống một viên thuốc hạ áp mỗi ngày. Không đái tháo đường.","n"]],"exam":[["V","Thần sắc, dáng đi","Tỉnh táo, sắc mặt bình thường, dáng đi bình thường. Đầu hơi nghiêng sang trái, vai phải hơi nhô.","n"],["V","Lưỡ
