<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Cận lâm sàng · CBC · HIU TMC</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102a24;background:#f5f7f6}
*{box-sizing:border-box}body{margin:0}.page{max-width:760px;margin:auto;padding:20px 16px 40px}
header{margin-bottom:18px}h1{font-size:28px;margin:0 0 4px}.muted{color:#60736c;font-size:14px}
.panel{background:#fff;border:1px solid #d7e0dc;border-radius:18px;padding:18px;box-shadow:0 4px 18px #102a2410}
.status{min-height:24px}.notice{padding:14px;border-radius:12px;background:#eef5f2}.error{background:#fff0ef;color:#8a2922}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
select,button{font:inherit;min-height:44px;border-radius:11px;border:1px solid #b9c9c3;padding:8px 12px;background:#fff}
button.primary{background:#145c4c;color:#fff;border-color:#145c4c;font-weight:700}
button.choice{flex:1;min-width:80px}button.choice[aria-pressed=true]{background:#145c4c;color:#fff;border-color:#145c4c}
table{width:100%;border-collapse:separate;border-spacing:0 8px}th{text-align:left;font-size:12px;color:#60736c;padding:0 8px}
td{padding:10px 8px;background:#f7faf9;vertical-align:middle}td:first-child{border-radius:10px 0 0 10px;font-weight:700}td:last-child{border-radius:0 10px 10px 0}
.answer{display:flex;gap:6px}.result{margin-top:16px;padding:16px;border-radius:14px;background:#edf7f1}.result strong{font-size:24px}
.result details{margin-top:12px}.hidden{display:none}
@media(max-width:560px){.page{padding:14px 10px 30px}h1{font-size:24px}table,tbody,tr,td{display:block;width:100%}thead{display:none}td{border-radius:0!important;margin:4px 0;padding:10px}.answer{margin-top:8px}}
</style>
</head>
<body>
<main class="page">
<header><div class="muted">HIU TMC · Cận lâm sàng</div><h1>Phòng CBC</h1><div class="muted">Phân loại 13 chỉ số công thức máu · học tập</div></header>
<section id="app" class="panel" aria-live="polite"><div class="status">Đang kiểm tra trạng thái mở…</div></section>
<script type="module" src="./bootstrap.js"></script>
</main>
</body>
</html>
