<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gia Viên Dược Thảo</title>
<style>
:root{
  --bg:#0f1a17; --panel:#162621; --panel2:#1e312c; --soft:#243c34; --line:rgba(255,255,255,.12);
  --text:#eef6f1; --muted:#bfd2c8; --gold:#d8b16c; --green:#6dbf78; --red:#ff8c7a;
  --shadow:0 14px 34px rgba(0,0,0,.26);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#11201b,#0b1311 70%);color:var(--text)}
button,input,select{font:inherit}
.app{display:grid;grid-template-columns:340px 1fr 340px;gap:16px;padding:16px;min-height:100%}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.left,.right{padding:16px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#ead7ab,#b38846);display:grid;place-items:center;color:#284438;font:700 24px Georgia,serif}
.brand h1{margin:0;font-size:18px;line-height:1.2}
.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:999px;background:#21362f;border:1px solid var(--line);color:#d9ebe1;font-size:12px}
.card{padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03)}
.card h3,.card h4{margin:0 0 10px}
.card p{margin:8px 0;color:var(--muted);line-height:1.45}
.mode-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mode-buttons button,.controls button,.quiz-actions button,.pillbtn{border:1px solid var(--line);background:#244038;color:#f5fbf7;padding:10px 12px;border-radius:12px;cursor:pointer}
.mode-buttons button.active,.controls button.primary,.quiz-actions button.primary,.pillbtn.active{background:linear-gradient(135deg,#d8b16c,#b58a46);color:#183028;border-color:transparent;font-weight:700}
.mode-buttons button:hover,.controls button:hover,.quiz-actions button:hover,.pillbtn:hover{filter:brightness(1.05)}
.main{display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:16px;min-width:0}
.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.titleblock h2{margin:0;font-size:22px}
.titleblock p{margin:4px 0 0;color:var(--muted)}
.stage{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:#0d1614;min-height:560px}
#photoStage,#simStage{position:absolute;inset:0;display:none}
#photoStage.active{display:flex;flex-direction:column;position:relative;inset:auto}
#simStage.active{display:block}
/* Góc nhìn thứ nhất 3D: ảnh thật đặt trên mặt trụ/cầu quanh người xem (WebGL) */
#fpStage{position:absolute;inset:0;display:none;background:#08100d;touch-action:none;user-select:none;-webkit-user-select:none}
#fpStage.active{display:block}
#fpCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#fpCanvas:active{cursor:grabbing}
.mode-buttons .span2{grid-column:1/-1}
.fp-hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;pointer-events:none}
.fp-hud .scene-pill{max-width:70%}
.fp-badges{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.fp-date,.fp-compass{padding:5px 9px;border-radius:999px;background:rgba(7,12,10,.72);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.fp-date.now{background:#22453c;color:#def5e4}
.fp-date.old{background:#5a4522;color:#fff1d1}
.fp-links{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fp-link{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border:2px solid rgba(255,255,255,.9);background:rgba(216,177,108,.92);color:#183028;font-weight:700;font-size:12px;padding:8px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer;white-space:nowrap}
.fp-link[data-dir="up"]::before{content:'⬆ '}
.fp-link[data-dir="left"]::before{content:'◀ '}
.fp-link[data-dir="right"]::after{content:' ▶'}
.fp-link[data-dir="left"],.fp-link[data-dir="right"]{background:rgba(7,12,10,.8);color:#f4e3bf;border-color:var(--gold);font-size:11px;padding:6px 10px;opacity:.93}
.fp-status{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;color:#e4eee8;font-size:14px;pointer-events:none}
.fp-status.show{display:grid}
.fp-fade{position:absolute;inset:0;background:#08100d;opacity:0;pointer-events:none;transition:opacity .28s ease}
.fp-fade.on{opacity:1}
.fp-tools{position:absolute;right:12px;bottom:104px;display:flex;gap:6px}
.fp-tools button{border:1px solid var(--line);background:rgba(7,12,10,.78);color:#f5fbf7;border-radius:10px;padding:8px 11px;cursor:pointer;font-size:13px}
.fp-tools button.on{background:var(--gold);color:#183028}
.fp-strip{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.fp-strip button{flex:0 0 118px;position:relative;border:2px solid transparent;border-radius:12px;overflow:hidden;padding:0;background:#10201b;cursor:pointer}
.fp-strip button.active{border-color:var(--gold)}
.fp-strip img{display:block;width:100%;height:62px;object-fit:cover}
.fp-strip span{position:absolute;left:4px;right:4px;bottom:4px;font-size:10px;line-height:1.25;color:#f4fbf6;background:rgba(0,0,0,.66);padding:2px 5px;border-radius:6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Khung ảnh thật: hiển thị TRỌN ảnh (contain), không phủ lớp tối, không che chú thích lên ảnh */
.photo-frame{position:relative;height:clamp(300px,58vh,600px);overflow:hidden;background:#0a120f}
.hero-blur{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(18px) brightness(.45);transform:translateZ(0)}
.hero{position:absolute;inset:0;background-size:contain;background-position:center;background-repeat:no-repeat}
.photo-status{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;color:#e4eee8;font-size:14px}
.photo-status.show{display:grid}
.frame-count{position:absolute;right:10px;top:10px;padding:5px 9px;border-radius:999px;background:rgba(7,12,10,.72);border:1px solid var(--line);font-size:12px}
.photo-ui{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:12px}
.caption{padding:12px 14px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px}
.caption h3{margin:0 0 6px;font-size:20px}
.caption p{margin:0 0 8px;color:#e4eee8;line-height:1.5}
.thumbs{display:flex;gap:9px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:3px 2px 8px;scrollbar-width:thin}
.thumb{position:relative;flex:0 0 142px;scroll-snap-align:start;border-radius:14px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:#10201b}
.thumb.active{border-color:var(--gold)}
.thumb img{display:block;width:100%;height:82px;object-fit:cover}
.thumb span{position:absolute;left:6px;bottom:6px;right:6px;font-size:11px;line-height:1.3;color:#f4fbf6;text-align:left;background:rgba(0,0,0,.66);padding:4px 6px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Canvas giữ đúng tỉ lệ 16:9 của bộ đệm vẽ để ảnh thật không bị bóp méo */
.canvas-wrap{position:absolute;inset:0;padding:10px;display:flex;align-items:center;justify-content:center}
#simCanvas{width:100%;height:auto;max-height:100%;aspect-ratio:16/9;object-fit:contain;display:block;border-radius:16px;background:#07100d}
.hud{position:absolute;inset:18px 18px auto 18px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
.hud .tag,.scene-pill{pointer-events:auto;padding:10px 12px;border-radius:14px;background:rgba(7,12,10,.72);backdrop-filter:blur(10px);border:1px solid var(--line)}
.scene-pill strong{display:block;font-size:14px}
.scene-pill span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px 0 4px}
.controls .spacer{flex:1}
.legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.list{display:flex;flex-direction:column;gap:10px}
.plant-item,.quest-item{padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03);cursor:pointer}
.plant-item.active,.quest-item.active{outline:2px solid rgba(216,177,108,.55);background:rgba(216,177,108,.08)}
.plant-item small,.quest-item small{display:block;color:var(--muted);margin-top:4px;line-height:1.45}
.info-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badge{padding:5px 9px;border-radius:999px;background:#22453c;border:1px solid var(--line);font-size:11px;color:#def5e4;white-space:nowrap}
.badge.warn{color:#fff1d1;background:#5a4522}
.badge.low{color:#ffd7cf;background:#5b2d25}
.quiz-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.progress{height:12px;border-radius:999px;background:#0d1714;border:1px solid var(--line);overflow:hidden}
.progress > div{height:100%;background:linear-gradient(90deg,#d8b16c,#6dbf78);width:0%}
.footer-note{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
.mapbox{height:150px;border-radius:14px;background:#10211d;border:1px solid var(--line);position:relative;overflow:hidden}
.mapbox .lane{position:absolute;left:42%;width:16%;top:10%;bottom:10%;background:#8d8677;border-radius:8px}
.mapbox .rack{position:absolute;right:18%;top:16%;bottom:16%;width:11%;background:#202a26;border-radius:8px}
.mapbox .bed{position:absolute;left:16%;width:22%;height:12%;background:#2a332c;border-radius:8px}
.mapbox .bed.b1{top:20%}.mapbox .bed.b2{top:38%}.mapbox .bed.b3{top:56%}
.mapbox .bed.b4{right:16%;left:auto;top:26%;width:14%;height:10%}.mapbox .bed.b5{right:16%;left:auto;top:48%;width:14%;height:10%}
.mapbox .label{position:absolute;font-size:11px;color:#dbeee5;background:rgba(0,0,0,.35);padding:2px 6px;border-radius:6px}
.mapbox .p{position:absolute;width:9px;height:9px;border-radius:50%;background:#d8b16c;border:2px solid #173127}
.mapbox .you{background:#7ccaf2;width:12px;height:12px}
.stage.fp{min-height:0;height:min(78vh,720px)}
@media (max-width:640px){.fp-hud .scene-pill{max-width:62%;padding:7px 10px}.fp-hud .scene-pill strong{font-size:13px}.fp-hud .scene-pill span{display:none}.fp-tools{bottom:96px}.fp-strip button{flex-basis:104px}}
@media (max-width:1200px){.app{grid-template-columns:300px 1fr}.right{grid-column:1/-1}.photo-ui{grid-template-columns:1fr}}
@media (max-width:900px){.app{grid-template-columns:1fr;padding:10px}.main{order:-1}#simStage .hud{flex-direction:column;align-items:flex-start}.left,.right,.main{padding:14px}.stage{min-height:520px}.photo-ui{inset:auto 10px 10px 10px}.thumbs{grid-template-columns:repeat(4,1fr)} }
@media (max-width:640px){.stage{min-height:500px}.thumb img{height:62px}.photo-ui{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(2,1fr)}.caption h3{font-size:18px}}

/* ===== Hành trình (game) ===== */
.jr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.jr-score{font:700 26px Georgia,serif;color:var(--gold)}
.jr-rank{padding:4px 10px;border-radius:999px;background:#21362f;border:1px solid var(--gold);color:#f4e3bf;font-size:12px;font-weight:700}
.jr-ch{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.jr-ch h4{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.jr-m{display:flex;gap:8px;align-items:flex-start;margin:6px 0;color:var(--muted);font-size:13px;line-height:1.35}
.jr-m i{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;color:#183028}
.jr-m.done{color:#e9f6ee}.jr-m.done i{background:var(--green);border-color:var(--green)}
.jr-note{font-size:12px;color:var(--muted);margin-top:10px}
.herb{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.herb-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.04);font-size:12px;color:var(--muted)}
.herb-card strong{display:block;color:#f4fbf6;font-size:14px;margin-bottom:2px}
.herb-card.locked{opacity:.55;text-align:center;border-style:dashed}
.herb-card .tag{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:999px;background:#21362f;font-size:11px}
dialog.gv{border:1px solid var(--gold);border-radius:18px;background:#10211b;color:var(--text);padding:0;max-width:min(520px,92vw);width:100%}
dialog.gv::backdrop{background:rgba(3,8,6,.7)}
dialog.gv .in{padding:18px}
dialog.gv h3{margin:0 0 6px}
dialog.gv .opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:#1d3329;color:#f2faf5;cursor:pointer;font-size:15px}
dialog.gv .opt.ok{background:#2f6b3d;border-color:var(--green)}
dialog.gv .opt.bad{background:#6b2f2f;border-color:var(--red)}
dialog.gv .opt:disabled{cursor:default}
dialog.gv .fb{margin:10px 0;color:var(--muted);line-height:1.45}
dialog.gv .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
dialog.gv .row button{border:1px solid var(--line);background:#244038;color:#f5fbf7;padding:10px 14px;border-radius:12px;cursor:pointer}
dialog.gv .row button.primary{background:linear-gradient(135deg,#d8b16c,#b58a46);color:#183028;border-color:transparent;font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#10211b;border:1px solid var(--gold);color:#f4e3bf;padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}

/* ---- Bố cục gọn: thanh trên + sân khấu + bảng phải có tab ---- */
.app{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto 1fr;align-items:start}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 14px;flex-wrap:wrap}
.bar .mark{width:36px;height:36px;border-radius:11px;font-size:17px}
.bar .brand h1{font-size:17px}
.seg{display:flex;gap:6px;margin:0 auto}
.seg button{padding:8px 14px}
.score-pill{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:999px;background:#21362f;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.score-pill b{color:#f2d79c;font-size:16px}
.score-pill span:first-child{color:#d9ebe1}
.titleblock h2{font-size:18px}
.titleblock p{font-size:13px}
.titleblock p:empty{display:none}
.stage{min-height:min(62vh,560px)}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.footer-note{display:block;min-height:0;font-size:13px;color:var(--muted)}
.right{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;gap:12px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 6px;border-radius:10px;cursor:pointer;font-size:14px}
.tab small{color:var(--muted);font-size:12px}
.tab.active{background:#244038;color:#f5fbf7;border-color:rgba(216,177,108,.5)}
.pane{display:none}.pane.active{display:block}
#selectedPanel{margin-top:12px}
#selectedPanel:empty{display:none}
@media (max-width:1000px){.bar{order:-2}.app{grid-template-columns:1fr}.right{position:static;max-height:none}.seg{margin:0}.bar{justify-content:space-between}}
@media (max-width:640px){.seg{order:3;width:100%}.seg button{flex:1;padding:8px 6px;font-size:13px}.stage{min-height:56vh}.controls button{flex:1 1 30%;padding:9px 6px;font-size:13px}}

/* ---- Tương tác như thật: thanh nhiệm vụ, vòng gợi ý, chạm để xem kỹ, phóng to ảnh ---- */
.qbar{position:absolute;left:10px;right:150px;bottom:100px;max-width:440px;z-index:3;background:rgba(7,12,10,.86);border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:13px;line-height:1.38;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.qbar:empty{display:none}
.qbar .qb-line b{color:var(--gold)}
.qbar .qb-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.qbar button{border:1px solid var(--line);background:#244038;color:#f5fbf7;padding:6px 10px;border-radius:10px;cursor:pointer;font-size:12px}
.qbar button.primary{background:linear-gradient(135deg,#d8b16c,#b58a46);color:#183028;border-color:transparent;font-weight:700}
.qbar .qb-msg{margin-top:6px;color:#e4eee8}
.qbar .qb-msg button{margin-left:6px}
#simQuest{left:50%;right:auto;bottom:12px;transform:translateX(-50%);width:min(92%,560px);max-width:none}
.fp-ring,.fp-found,.fp-tap{position:absolute;pointer-events:none;transform:translate(-50%,-50%)}
.fp-ring{border:3px solid #ffe08a;border-radius:50%;box-shadow:0 0 0 2px rgba(7,12,10,.55),0 0 18px rgba(255,224,138,.7);animation:fpring 1.1s ease-in-out infinite}
@keyframes fpring{0%,100%{opacity:.95;transform:translate(-50%,-50%) scale(1)}50%{opacity:.55;transform:translate(-50%,-50%) scale(1.12)}}
.fp-found{padding:4px 9px;border-radius:999px;background:rgba(47,107,61,.92);border:1px solid #9be3aa;color:#f2fff5;font-size:12px;font-weight:700;white-space:nowrap}
.fp-tap{width:46px;height:46px;border-radius:50%;border:3px solid #fff;animation:fptap .65s ease-out forwards}
.fp-tap.hit{border-color:#7ee08f}.fp-tap.miss{border-color:#ff9a8a}
@keyframes fptap{from{opacity:1;transform:translate(-50%,-50%) scale(.4)}to{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 2px}
.photo-actions:empty{display:none}
.chip.old{background:#5a4522;color:#fff1d1}
dialog.lb{border:1px solid var(--gold);border-radius:16px;background:#0b1511;color:var(--text);padding:0;width:min(96vw,1100px);max-width:96vw;height:90vh;max-height:90vh}
dialog.lb[open]{display:flex;flex-direction:column}
dialog.lb::backdrop{background:rgba(3,8,6,.82)}
.lb-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.lb-bar strong{min-width:0;line-height:1.3}
.lb-bar span{display:flex;gap:6px;flex:none}
.lb-bar button{border:1px solid var(--line);background:#244038;color:#f5fbf7;padding:6px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.lb-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#060d0a;display:flex}
.lb-scroll img{display:block;margin:auto;flex:none}
.lb-scroll img.fit{width:100%;height:auto}
.lb-scroll img.full{max-width:none;width:auto;height:auto}
@media (max-width:640px){.qbar{right:10px;bottom:98px;max-width:none}.fp-tools{bottom:auto;top:108px}.fp-tools .lbl{display:none}}
@media (max-height:520px) and (orientation:landscape){
  .stage.fp{height:min(94vh,720px)}
  .fp-hud .scene-pill span{display:none}
  .fp-strip{display:none}
  .fp-tools{bottom:10px}
  .qbar{bottom:10px;right:auto;max-width:min(58%,440px);padding:6px 9px;font-size:12px}
  #simQuest{bottom:8px}
}
#markAnswerBtn{display:none}
</style>
</head>
<body>
<div class="app">
  <header class="bar panel">
    <div class="brand"><div class="mark">GV</div><h1>Gia Viên Dược Thảo</h1></div>
    <div class="mode-buttons seg" role="tablist" aria-label="Chế độ xem">
      <button id="btnPhoto" class="active">Ảnh thật</button>
      <button id="btnSim">Khám phá 6 trạm</button>
      <button id="btnFp">Góc nhìn 3D</button>
    </div>

// Ảnh thật đã nén (web 1600px, thumb 360px); ảnh gốc đã gỡ khỏi repo. Lỗi mạng thì thử lại bản web một lần.
const webSrc=src=>src.replace('/assets/','/assets/web/');
const thumbSrc=src=>src.replace('/assets/','/assets/thumb/');
const photoFrame=document.getElementById('photoFrame');
const heroBlur=document.getElementById('heroBlur');
const photoStatus=document.getElementById('photoStatus');
const frameCount=document.getElementById('frameCount');
const photoCache=new Map();
function loadPhoto(src){
  if(photoCache.has(src)) return photoCache.get(src);
  const tryLoad=url=>new Promise((resolve,reject)=>{
    const img=new Image();
    img.decoding='async';
    img.onload=()=>img.naturalWidth?resolve({img,url}):reject(new Error('empty '+url));
    img.onerror=()=>reject(new Error('HTTP/decode error '+url));
    img.src=url;
  });
  const job=tryLoad(webSrc(src)).catch(err=>{console.warn('[gia-vien] web copy failed, retrying',err.message);return tryLoad(webSrc(src)+'?r=1');});
  job.catch(()=>photoCache.delete(src));
  photoCache.set(src,job);
  return job;
}
let heroNatural=null;
function layoutHero(){
  const p=photos[photoIndex];
  // Ảnh dải ngang (toàn cảnh): hạ chiều cao khung để không thừa vùng mờ trống; ảnh thường giữ chiều cao mặc định
  const ar=heroNatural?heroNatural.w/heroNatural.h:0;
  photoFrame.style.height=ar>2.3?Math.max(200,Math.min(Math.round(photoFrame.clientWidth/ar*1.6),380))+'px':'';
  const zoom=p.size?parseFloat(p.size)/100:1;
  if(!heroNatural||zoom===1){heroImage.style.backgroundSize='contain';heroImage.style.backgroundPosition='center';return;}
  // Khung cận: phóng từ kích thước "contain" để tái khung ảnh thật, không tạo nội dung mới.
  const fw=photoFrame.clientWidth,fh=photoFrame.clientHeight;
  const s=Math.min(fw/heroNatural.w,fh/heroNatural.h)*zoom;
  heroImage.style.backgroundSize=`${Math.round(heroNatural.w*s)}px ${Math.round(heroNatural.h*s)}px`;
  heroImage.style.backgroundPosition=p.position||'center';
}
function renderPhotoMode(){
  const p=photos[photoIndex];
  const token=photoIndex;
  photoTitle.textContent=p.title;
  photoDesc.textContent=p.desc;
  frameCount.textContent=`${photoIndex+1}/${photos.length}`;
  heroImage.setAttribute('aria-label',p.title);
  photoTags.innerHTML=p.tags.map(t=>`<span class="chip${/^(Lưu trữ|Bố cục cũ)$/.test(t)?' old':''}">${t}</span>`).join('');
  document.getElementById('photoActions').innerHTML=`<button class="pillbtn" id="photoZoom" type="button">🔍 Phóng to</button>${p.fp?'<button class="pillbtn" id="photo3d" type="button">Mở góc nhìn 3D</button>':''}`;
  document.getElementById('photoZoom').onclick=()=>openLightbox(p);
  if(p.fp) document.getElementById('photo3d').onclick=()=>setMode('fp',{station:p.fp});
  photoStatus.textContent='Đang tải ảnh thật…';
  photoStatus.classList.add('show');
  loadPhoto(p.src).then(({img,url})=>{
    if(token!==photoIndex) return;
    heroNatural={w:img.naturalWidth,h:img.naturalHeight};
    heroImage.style.backgroundImage=`url("${url}")`;
    heroBlur.style.backgroundImage=`url("${url}")`;
    layoutHero();
    photoStatus.classList.remove('show');
  }).catch(err=>{
    if(token!==photoIndex) return;
    console.error('[gia-vien] cannot load photo',p.src,err);
    heroImage.style.backgroundImage='none';heroBlur.style.backgroundImage='none';
    photoStatus.textContent=`Không tải được ảnh ${p.src.split('/').pop()}. Kiểm tra mạng rồi bấm lại khung ảnh.`;
    photoStatus.classList.add('show');
  });

function getSceneImage(src){
  if(sceneImages.has(src)) return sceneImages.get(src);
  const img=new Image();
  img.decoding='async';
  img.onerror=()=>{img.onerror=null;img.src=webSrc(src)+'?r=1';};
  img.src=webSrc(src);
  sceneImages.set(src,img);
  return img;
}
function drawScene(){
  const w=canvas.width,h=canvas.height;
  const scene=scenes[sceneIndex];
  sceneName.textContent=scene.name;
  sceneDesc.textContent=scene.desc;
  cameraTag.textContent=`Thực cảnh · trạm ${sceneIndex+1}/${scenes.length} · góc ${cameraYaw===0?'giữa':cameraYaw<0?'trái':'phải'}`;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#07100d'; ctx.fillRect(0,0,w,h);

  const img=getSceneImage(scene.photo);
  if(!img.complete || !img.naturalWidth){
    ctx.fillStyle='#dcebe4';ctx.font='600 20px Inter';ctx.textAlign='center';
    ctx.fillText('Đang tải ảnh thực cảnh…',w/2,h/2);
    img.onload=()=>{if(mode==='sim' && scenes[sceneIndex].photo===scene.photo) drawScene();};
    return;
  }

  const contain=scene.fit==='contain';
  const base=contain?Math.min(w/img.naturalWidth,h/img.naturalHeight):Math.max(w/img.naturalWidth,h/img.naturalHeight);
  const scale=base*(scene.zoom|| (contain?1:1.04));
  const dw=img.naturalWidth*scale, dh=img.naturalHeight*scale;
  const panRange=Math.max(0,(dw-w)/2);
  const x=(w-dw)/2-cameraYaw*panRange*.9;
  const focusY=scene.focusY??.5;
  const y=(h-dh)/2-(focusY-.5)*Math.max(0,dh-h);
  ctx.drawImage(img,x,y,dw,dh);
  sceneRect={x,y,dw,dh};

  const vignette=ctx.createLinearGradient(0,0,0,h);
  vignette.addColorStop(0,'rgba(4,8,6,.08)');
  vignette.addColorStop(.58,'rgba(4,8,6,.02)');
  vignette.addColorStop(1,'rgba(4,8,6,.52)');
  ctx.fillStyle=vignette;ctx.fillRect(0,0,w,h);

  ctx.strokeStyle='rgba(238,246,241,.72)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(w/2-34,h-40);ctx.lineTo(w/2,h-66);ctx.lineTo(w/2+34,h-40);ctx.stroke();
  ctx.fillStyle='rgba(7,12,10,.66)';ctx.fillRect(18,h-58,255,38);
  ctx.fillStyle='#eaf5ef';ctx.font='600 14px Inter';ctx.textAlign='left';
  ctx.fillText('↑/↓ đổi trạm · ←/→ đổi góc nhìn',30,h-34);

  drawHotspots(scene);
  updateMapDot();
  if(mode==='sim') gvVisitScene(sceneIndex);
}

function paintMural(x,y,w,h){

  const g=ctx.createLinearGradient(0,y,0,y+h); g.addColorStop(0,'#95cdbb'); g.addColorStop(1,'#6aa583');
  ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
  // Tree rhythm
  for(let i=0;i<16;i++){
    const tx=x+50+i*64; const ty=y+48+Math.sin(i)*10;
    ctx.strokeStyle='rgba(88,68,48,.55)'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(tx, y+h); ctx.lineTo(tx+Math.sin(i)*18, ty+50); ctx.stroke();
    ctx.fillStyle=`rgba(${70+i*2},${120+i*3},${70+i*2},.65)`;
    ctx.beginPath(); ctx.arc(tx+Math.sin(i)*8, ty, 42+(i%3)*8, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// Toạ độ điểm chạm tính trên ẢNH của trạm (x,y 0–1), quy ra khung vẽ theo vị trí ảnh thật sự được vẽ
function hotspotPos(hs){ return {x:sceneRect.x+hs.x*sceneRect.dw, y:sceneRect.y+hs.y*sceneRect.dh}; }
// Điểm chạm KHÔNG hiện sẵn: người chơi tự tìm cây theo nhiệm vụ. Chỉ hiện vòng khi xin gợi ý, nhãn khi đã tìm thấy hoặc đang xem thẻ.
function drawHotspots(scene){
  const now=performance.now(), q=currentQuest();
  scene.hotspots.forEach(hs=>{
    const plant=byId(hs.plantId), {x,y}=hotspotPos(hs);
    const found=gvState.found.includes(plant.id), active=selectedPlantId===plant.id;
    const hinting=now<simHintUntil&&plant.id===q.plantId&&!found;
    if(hinting){
      const r=44+6*Math.sin(now/170);
      ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.lineWidth=4;ctx.strokeStyle='rgba(255,224,138,.95)';ctx.stroke();
      ctx.beginPath();ctx.arc(x,y,r+7,0,Math.PI*2);ctx.lineWidth=2;ctx.strokeStyle='rgba(7,16,12,.65)';ctx.stroke();
    }
    if(found||active){
      ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);
      ctx.fillStyle=found?'rgba(109,191,120,.96)':'rgba(216,177,108,.96)';ctx.fill();
      ctx.lineWidth=3;ctx.strokeStyle='rgba(7,16,12,.92)';ctx.stroke();
      ctx.fillStyle='#153027';ctx.font='700 14px Inter';ctx.textAlign='center';
      ctx.fillText(found?'✓':'?',x,y+5);
      const label=plant.name.replace(/ \(chưa chốt\)/,'');
      ctx.font='700 14px Inter';
      const tw=ctx.measureText(label).width;
      ctx.fillStyle='rgba(7,12,10,.82)';ctx.fillRect(x-tw/2-10,y-46,tw+20,27);
      ctx.fillStyle='#f4fbf6';ctx.fillText(label,x,y-27);
    }
  });
}

/* =====================================================================
   GÓC NHÌN THỨ NHẤT 3D — trình xem WebGL không phụ thuộc thư viện ngoài.
   Mỗi trạm là ẢNH THẬT (không người) đặt quanh mắt người xem:
   - 'cylinder': toàn cảnh ghép bằng chiếu trụ (x = f·θ, y = f·tanφ)
   - 'sphere'  : toàn cảnh ghép bằng chiếu cầu (x = f·θ, y = f·φ)
   - 'plane'   : ảnh đơn rectilinear, đặt đúng góc nhìn của ống kính
   Góc phủ (hfov/v) tính từ tiêu cự EXIF lúc ghép, nên phối cảnh khớp ảnh gốc.
   Hướng mũi tên sang trạm kế là ƯỚC TÍNH theo ảnh, chưa phải đo đạc.
   ===================================================================== */
const fpStage=document.getElementById('fpStage');
const btnFp=document.getElementById('btnFp');
const fp=(()=>{
  const cv=document.getElementById('fpCanvas');
  const nameEl=document.getElementById('fpName'),descEl=document.getElementById('fpDesc'),dateEl=document.getElementById('fpDate');
  const compassEl=document.getElementById('fpCompass'),linksEl=document.getElementById('fpLinks'),marksEl=document.getElementById('fpMarks');
  const statusEl=document.getElementById('fpStatus'),fadeEl=document.getElementById('fpFade'),stripEl=document.getElementById('fpStrip');
  const gyroBtn=document.getElementById('fpGyro'),hdEl=document.getElementById('fpHd');
  const D=Math.PI/180;
  let gl=null,isGL2=false,aniso=null,maxTex=2048,prog=null,loc={},mesh=null,tex=null,running=false,raf=0,dirty=true;
  let idx=0,yaw=0,pitch=0,fov=70,loadToken=0,cur=null;
  let vel=0,gyroOn=false,gyroBase=null,hintPlant=null,hintUntil=0,pendingHint=null,panRaf=0;

  function initGL(){
    if(gl) return true;
    const opts={premultipliedAlpha:true,antialias:true,alpha:false};
    gl=cv.getContext('webgl2',opts); isGL2=!!gl;
    if(!gl) gl=cv.getContext('webgl',opts);
    if(!gl){statusEl.textContent='Thiết bị không hỗ trợ WebGL — hãy dùng chế độ Ảnh thật.';statusEl.classList.add('show');return false;}
    maxTex=gl.getParameter(gl.MAX_TEXTURE_SIZE)||2048;
    aniso=gl.getExtension('EXT_texture_filter_anisotropic')||gl.getExtension('WEBKIT_EXT_texture_filter_anisotropic');
    const vs=`attribute vec3 p;attribute vec2 uv;uniform mat4 m;varying vec2 v;void main(){v=uv;gl_Position=m*vec4(p,1.);}`;
    // highp để toạ độ ảnh 4000 px không bị nhảy bậc trên GPU di động
    const fs=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 v;uniform sampler2D t;void main(){vec4 c=texture2D(t,v);gl_FragColor=vec4(c.rgb*c.a+vec3(.031,.063,.051)*(1.-c.a),1.);}`;
    const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;};
    prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);
    gl.useProgram(prog);
    loc={p:gl.getAttribLocation(prog,'p'),uv:gl.getAttribLocation(prog,'uv'),m:gl.getUniformLocation(prog,'m'),t:gl.getUniformLocation(prog,'t')};
    return true;
  }
  const horizon=st=>st.cy==null?.5:st.cy;
  // Lưới bề mặt theo đúng phép chiếu của ảnh (cy = hàng ảnh nằm ngang tầm mắt)
  function buildMesh(st){
    const NX=st.proj==='plane'?2:96, NY=st.proj==='plane'?2:48;
    const H=st.hfov*D, cy=horizon(st), pos=[], uv=[], ind=[];
    for(let j=0;j<=NY;j++){
      const ty=j/NY; // 0 = mép trên ảnh
      for(let i=0;i<=NX;i++){
        const tx=i/NX; let x,y,z;
        if(st.proj==='plane'){
          const hw=Math.tan(H/2), hh=Math.tan(st.vfov*D/2);

      if(!initGL()) return; running=true;
      const i=id?fpStations.findIndex(s=>s.id===id):-1;
      if(i>=0&&(!cur||cur.id!==id)) go(i,false); else if(!cur) go(idx,false); else dirty=true;
      cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
    },
    stop(){ running=false; cancelAnimationFrame(raf); cancelAnimationFrame(panRaf); },
    turn(d){ yaw+=d; dirty=true; },
    next(d){ go(idx+d,true); },
    walk(){ const l=cur&&cur.links[0]; if(l) walkTo(l.to,l.yaw); else go(idx+1,true); },
    // goTo(id, plantId): sang trạm khác; có plantId thì tới nơi sẽ tự xoay và khoanh vòng gợi ý quanh cây đó
    goTo(id,plantId){ const i=fpStations.findIndex(s=>s.id===id); if(i<0) return; pendingHint=plantId||null; go(i,false); },
    // Gợi ý: xoay tới cây của nhiệm vụ rồi khoanh vòng vàng, nếu cây nằm trong trạm đang đứng
    hint(plantId,ms){
      const t=cur&&cur.targets&&cur.targets.find(x=>x.plant===plantId); if(!t) return false;
      hintPlant=plantId; hintUntil=performance.now()+(ms||6000);
      const a=angOf(cur,t); panTo(a.yaw,a.pitch,650); dirty=true; return true;
    },
    get station(){return cur;},
    get index(){return idx;}
  };
  return api;
})();

document.addEventListener('keydown',e=>{

    const k={ArrowLeft:()=>fp.turn(-10),ArrowRight:()=>fp.turn(10),ArrowUp:()=>fp.walk(),ArrowDown:()=>fp.next(-1),Enter:()=>fp.walk()}[e.key];
    if(k){e.preventDefault();k();} return;
  }

markAnswerBtn.onclick=()=>{

    statusText.textContent=`Chưa đúng: ${byId(selectedPlantId).name}`;

resetQuestBtn.onclick=()=>{questProgress=new Set(); currentQuestId=quests[0].id; gvNoteData=null; updateQuestUI(); statusText.textContent='Đã reset nhiệm vụ';};

/* =====================================================================
   TÌM CÂY NHƯ THẬT — điểm chạm KHÔNG hiện sẵn: người chơi đọc mô tả nhiệm vụ rồi tự tìm trong ảnh.
   - Chạm trúng cây có trong danh sách: ghi nhận, hiện tên + thẻ cây. Chạm trượt: báo ngay, không trừ điểm.
   - "Gợi ý": 3D tự xoay tới cây rồi khoanh vòng vàng (không đọc tên); 2.5D hiện vòng vàng; cây ở trạm khác thì chỉ đường.
   - Chạm trúng cây của nhiệm vụ khác thì tính luôn cho nhiệm vụ đó (danh sách nhiệm vụ làm theo thứ tự tuỳ ý).
   ===================================================================== */
function gvIsFound(pid){ return gvState.found.includes(pid); }
// Ghi chú ngắn hiện dưới thanh nhiệm vụ (tự mất sau 9 giây hoặc khi đổi nhiệm vụ); action = nút kèm theo
function gvNote(text,action){
  gvNoteData=text?{text,action:action||null,q:currentQuestId}:null;
  clearTimeout(gvNoteT);
  if(gvNoteData) gvNoteT=setTimeout(()=>{ gvNoteData=null; gvQuestBars(); },9000);
  gvQuestBars();
}
function gvQuestBars(){
  if(gvNoteData&&gvNoteData.q!==currentQuestId) gvNoteData=null;
  const q=currentQuest(), total=quests.length, done=questProgress.size;
  let html='';
  const old=mode==='fp'&&fp.station&&fp.station.era==='old';
  if(old){
    html='<div class="qb-line"><b>Trạm lưu trữ</b> · ảnh chụp trước khi vẽ lại tường, dùng để so sánh với hiện nay. Không tìm cây ở đây; bấm trạm khác ở dải bên dưới.</div>';
  } else if(done>=total){
    html=`<div class="qb-line"><b>Đã tìm đủ ${total}/${total} cây.</b> Mở tab “Sổ cây” để xem thẻ cây hoặc bấm “Nhận mặt cây” để thử tài.</div><div class="qb-actions"><button data-a="reset">Chơi lại nhiệm vụ</button></div>`;
  } else if(q){
    html=`<div class="qb-line"><b>Nhiệm vụ ${quests.indexOf(q)+1}/${total}</b> · ${q.title}<span style="color:var(--muted)"> · xong ${done}</span></div><div class="qb-actions"><button class="primary" data-a="hint">💡 Gợi ý</button>${total-done>1?'<button data-a="skip">Nhiệm vụ khác</button>':''}</div>`;
  }
  if(gvNoteData&&!old) html+=`<div class="qb-msg">${gvNoteData.text}${gvNoteData.action?`<button class="primary" data-a="note">${gvNoteData.action.label}</button>`:''}</div>`;
  ['fpQuest','simQuest'].forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML=html; });
}
['fpQuest','simQuest'].forEach(id=>document.getElementById(id).addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]'); if(!b) return;
  const a=b.dataset.a;
  if(a==='hint') gvHint();
  else if(a==='skip') gvNextQuest();
  else if(a==='reset') resetQuestBtn.onclick();
  else if(a==='note'&&gvNoteData&&gvNoteData.action){ const fn=gvNoteData.action.fn; gvNoteData=null; gvQuestBars(); fn(); }
}));
function gvNextQuest(){
  const undone=quests.filter(x=>!questProgress.has(x.id)); if(undone.length<2) return;
  const i=undone.findIndex(x=>x.id===currentQuestId);
  currentQuestId=undone[(i+1)%undone.length].id; gvNoteData=null; updateQuestUI();
}
// Trạm 3D hiện trạng có điểm chạm của cây (ưu tiên trạm đang đứng, rồi tới trạm mới nhất)
function gvStationFor(pid){
  const c=fp.station;
  if(c&&c.targets&&c.targets.some(t=>t.plant===pid)) return c;
  return fpStations.find(s=>s.era==='now'&&s.targets&&s.targets.some(t=>t.plant===pid))||null;
}
function gvHint(){
  const q=currentQuest(); if(!q||questProgress.has(q.id)) return;
  const pid=q.plantId;
  if(mode==='fp'){
    if(fp.hint(pid,7000)){ gvNote('Mình đã xoay tới chỗ có cây cần tìm và khoanh vòng vàng. Chạm vào cây để ghi nhận.'); return; }
    const st=gvStationFor(pid);
    if(st) gvNote('Cây này không nằm trong tầm nhìn của trạm này.',{label:'Tới trạm có cây',fn:()=>fp.goTo(st.id,pid)});
    else gvNote('Chưa có điểm chạm cho cây này ở trạm 3D. Thử chế độ “Khám phá 6 trạm”.');
  } else if(mode==='sim'){
    if(scenes[sceneIndex].hotspots.some(h=>h.plantId===pid)){ startSimHint(7000); gvNote('Vòng vàng đang khoanh vùng cây cần tìm. Chạm vào cây để ghi nhận.'); return; }
    const to=scenes.findIndex(s=>s.hotspots.some(h=>h.plantId===pid));
    if(to>=0) gvNote(`Cây này không có trong trạm ${sceneIndex+1}, nó nằm ở trạm ${to+1}.`,{label:`Tới trạm ${to+1}`,fn:()=>{ sceneIndex=to; cameraYaw=0; drawScene(); startSimHint(7000); }});
    else gvNote('Chưa có điểm chạm cho cây này ở chế độ 2.5D. Thử “Góc nhìn 3D”.');
  }
}
// Người chơi chạm trúng cây có trong danh sách (3D hoặc 2.5D)
function gvTapPlant(pid){
  const p=byId(pid); if(!p) return;
  gvMisses=0;
  selectedPlantId=pid; renderSelectedPlant(); renderPlantList();
  if(mode==='sim') drawScene();
  const q=quests.find(x=>x.plantId===pid);
  if(!q) return;
  if(questProgress.has(q.id)){
    const nm=p.name.replace(/ \(chưa chốt\)/,'');
    if(gvState.quiz[pid]&&gvState.quiz[pid].done) gvToast(`${nm}: bạn đã tìm thấy cây này rồi.`);
    else { gvToast(`${nm}: mở lại thẻ cây.`); gvQuestDone(pid); } // lần trước bấm “Để sau” thì chạm lại để mở thẻ
    return;
  }
  currentQuestId=q.id; gvNoteData=null;
  markAnswerBtn.onclick();
}
function gvMiss(){
  if(questProgress.size>=quests.length){ gvToast('Bạn đã tìm đủ cây rồi. Thử “Nhận mặt cây” ở tab Sổ cây.'); return; }
  gvMisses++;
  if(gvMisses%3===0) gvNote('Chưa thấy? Bấm “Gợi ý” để mình khoanh vòng quanh cây cần tìm.');
  else gvToast('Chỗ này chưa có cây nào trong danh sách. Thử chạm chỗ khác.');
}
function gvFpTap(pid){ if(pid) gvTapPlant(pid); else gvMiss(); }

/* =====================================================================
   HÀNH TRÌNH NGƯỜI GIỮ VƯỜN — vòng chơi, điểm, hạng, thẻ cây.
   - Mọi nội dung đều từ ảnh thật; câu hỏi chỉ về đặc điểm nhận biết cây
     và về việc đối chiếu bố cục theo thời gian. Không có nội dung điều trị.
   - Tiến trình CHỈ lưu trên thiết bị (localStorage). Chưa ghi vào Study OS;
     không phát tín dụng, không đụng kho giống/ví của Gia Viên đang chạy.
   ===================================================================== */
const GV_KEY='gv-thuc-canh-v1';
function gvFaceDone(id){ return !!(gvState.face[id]&&gvState.face[id].done); }
function gvFaceNext(){
  const c=faceCards.find(x=>!gvFaceDone(x.id)); if(!c){ gvToast('Bạn đã nhận mặt đủ 9 cây.'); return; }
  const i=faceCards.indexOf(c), others=[1,3,5].map(k=>faceCards[(i+k)%faceCards.length].name);
  const pos=i%4, opts=others.slice(); opts.splice(pos,0,c.name);
  const done=faceCards.filter(x=>gvFaceDone(x.id)).length;
  gvOpenQuiz(`Nhận mặt cây ${done+1}/${faceCards.length}`,{img:'/gia-vien-duoc-thao-preview/assets/'+c.img,q:'Ảnh cận này là cây nào?',opts,ok:pos,
    why:`${c.name}${c.latin?` (${c.latin})`:''}${c.num?` · số ${c.num} trên bảng`:''}: ${c.feat}. Tên do chủ vườn gắn nhãn và đã xác nhận.`},
    first=>{ gvState.face[c.id]={done:true,first:!!first}; gvAfter(`+${first?POINTS.faceFirst:POINTS.faceRetry} điểm · nhận mặt ${c.name}`); gvDlg.addEventListener('close',()=>setTimeout(gvFaceNext,250),{once:true}); });
}
const POINTS={scene:5,fp:5,quest:10,quizFirst:10,quizRetry:5,time:10,faceFirst:8,faceRetry:4};
const RANKS=[[0,'Khách tham quan'],[50,'Học việc'],[120,'Người giữ vườn'],[200,'Người giữ vườn xuất sắc']];
const gvState={scene:[],fp:[],found:[],quiz:{},time:{},face:{},score:0,done:false,intro:false};
function gvLoad(){ try{ const j=JSON.parse(localStorage.getItem(GV_KEY)||'null'); if(j&&typeof j==='object'){ ['scene','fp','found'].forEach(k=>{ if(Array.isArray(j[k])) gvState[k]=j[k].filter(x=>typeof x==='string'||typeof x==='number'); }); ['quiz','time','face'].forEach(k=>{ if(j[k]&&typeof j[k]==='object') gvState[k]=j[k]; }); gvState.done=!!j.done; gvState.intro=!!j.intro; gvRecalc(); } }catch(e){} }
function gvSave(){ try{ localStorage.setItem(GV_KEY,JSON.stringify(gvState)); }catch(e){} }
function gvRecalc(){
  let sc=gvState.scene.length*POINTS.scene+gvState.fp.length*POINTS.fp+gvState.found.length*POINTS.quest;
  Object.values(gvState.quiz).forEach(v=>{ if(v&&v.done) sc+= v.first?POINTS.quizFirst:POINTS.quizRetry; });
  sc+=Object.keys(gvState.time).filter(k=>gvState.time[k]&&gvState.time[k].done).length*POINTS.time;
  Object.values(gvState.face).forEach(v=>{ if(v&&v.done) sc+= v.first?POINTS.faceFirst:POINTS.faceRetry; });
  gvState.score=sc;
}
const GV_MAX=scenes.length*POINTS.scene+fpStations.filter(x=>x.era==='now').length*POINTS.fp+plants.length*(POINTS.quest+POINTS.quizFirst)+Object.keys(timeQuiz).length*POINTS.time+faceCards.length*POINTS.faceFirst;
function gvRank(){ let r=RANKS[0][1]; RANKS.forEach(([t,n])=>{ if(gvState.score>=t) r=n; }); return r; }
const gvToastEl=document.getElementById('gvToast'); let gvToastT=0;
function gvToast(msg){ gvToastEl.textContent=msg; gvToastEl.classList.add('on'); clearTimeout(gvToastT); gvToastT=setTimeout(()=>gvToastEl.classList.remove('on'),2600); }
const gvDlg=document.getElementById('gvDlg'), gvBody=document.getElementById('gvDlgBody');
function gvOpenQuiz(title,quiz,onResult,first){
  let tries=0;
  gvBody.innerHTML=`<h3>${title}</h3>${quiz.img?`<img src="${quiz.img}" alt="Ảnh cận cây cần nhận mặt" style="display:block;width:100%;max-height:38vh;object-fit:cover;border-radius:10px;margin:0 0 8px">`:''}<p style="margin:0 0 6px;color:#d9ebe1">${quiz.q}</p><div id="gvOpts">${quiz.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div class="fb" id="gvFb"></div><div class="row"><button id="gvClose">Để sau</button></div>`;
  const fb=gvBody.querySelector('#gvFb');
  gvBody.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; tries++;
    if(i===quiz.ok){
      gvBody.querySelectorAll('.opt').forEach(x=>x.disabled=true); b.classList.add('ok');
      fb.innerHTML=`<strong>Đúng.</strong> ${quiz.why}`;
      gvBody.querySelector('#gvClose').textContent='Tiếp tục'; gvBody.querySelector('#gvClose').classList.add('primary');
      onResult(tries===1&&first!==false);
    } else { b.classList.add('bad'); b.disabled=true; fb.textContent='Chưa đúng, thử lại nhé.'; }
  });
  gvBody.querySelector('#gvClose').onclick=()=>gvDlg.close();
  if(!gvDlg.open) gvDlg.showModal();
}
function gvAfter(msg){ gvRecalc(); gvSave(); gvRender(); if(msg) gvToast(msg); gvCheckDone(); }
function gvVisitScene(i){ const k=String(i); if(!gvState.scene.includes(k)){ gvState.scene.push(k); gvAfter(`+${POINTS.scene} điểm · đã ghé trạm ${i+1}`); } }
function gvVisitFp(id){
  const st=fpStations.find(x=>x.id===id); if(!st) return;
  if(st.era==='now' && !gvState.fp.includes(id)){ gvState.fp.push(id); gvAfter(`+${POINTS.fp} điểm · đã đứng ở trạm 3D mới`); }
  const tq=timeQuiz[id];
  if(tq && !(gvState.time[tq.id]&&gvState.time[tq.id].done)){
    setTimeout(()=>gvOpenQuiz('Đối chiếu theo thời gian',tq,()=>{ gvState.time[tq.id]={done:true}; gvAfter(`+${POINTS.time} điểm · đối chiếu bố cục`); }),700);
  }
}
function gvQuestDone(plantId){
  const p=byId(plantId); if(!p) return;
  if(!gvState.found.includes(plantId)){ gvState.found.push(plantId); gvAfter(`+${POINTS.quest} điểm · tìm thấy ${p.name}`); }
  const qz=plantQuiz[plantId]; const done=gvState.quiz[plantId]&&gvState.quiz[plantId].done;
  if(qz && !done){
    // Mở thẻ chậm lại một nhịp: để người chơi thấy nhãn "đã tìm thấy" trước, và để cú chạm vừa rồi không "rơi" xuống đáp án của hộp thoại vừa hiện
    const open=n=>{ if(gvDlg.open){ if(n<20) setTimeout(()=>open(n+1),600); return; } // đang có hộp thoại khác: chờ rồi mở
      gvOpenQuiz(`Thẻ cây: ${p.name}`,qz,first=>{ gvState.quiz[plantId]={done:true,first:!!first}; gvAfter(`+${first?POINTS.quizFirst:POINTS.quizRetry} điểm · mở thẻ ${p.name}`); });
    };
    setTimeout(()=>open(0),450);
  }
}
function gvCheckDone(){
  const all=gvState.scene.length>=scenes.length && gvState.fp.length>=fpStations.filter(x=>x.era==='now').length && plants.every(p=>gvState.quiz[p.id]&&gvState.quiz[p.id].done) && faceCards.every(c=>gvFaceDone(c.id)) && Object.values(timeQuiz).every(t=>gvState.time[t.id]&&gvState.time[t.id].done);
  if(all && !gvState.done){
    gvState.done=true; gvSave();
    setTimeout(()=>{
      gvBody.innerHTML=`<h3>Hoàn thành hành trình</h3><p style="color:#d9ebe1">Bạn đã đi hết ${scenes.length} trạm, đứng ở các trạm 3D, mở ${plants.length}/${plants.length} thẻ cây, nhận mặt ${faceCards.length}/${faceCards.length} cây qua ảnh cận và đối chiếu bố cục theo thời gian.</p><p><strong>${gvState.score}/${GV_MAX} điểm · ${gvRank()}</strong></p><p class="fb">Tên cây là định danh tạm. Khi có danh mục chính thức và mã QR, các thẻ sẽ được cập nhật và bạn có thể chơi lại để mở thẻ mới.</p><div class="row"><button class="primary" onclick="document.getElementById('gvDlg').close()">Đóng</button></div>`;
      if(!gvDlg.open) gvDlg.showModal();
    },900);
  }
}
function gvRender(){
  document.getElementById('jrScore').textContent=gvState.score;
  document.getElementById('jrMax').textContent=GV_MAX;
  document.getElementById('jrRank').textContent=gvRank();
  document.getElementById('barRank').textContent=gvRank(); document.getElementById('barPts').textContent=gvState.score;
  document.getElementById('jrBar').style.width=Math.min(100,gvState.score/GV_MAX*100)+'%';
  const nowFp=fpStations.filter(x=>x.era==='now');
  const m=(done,txt)=>`<div class="jr-m ${done?'done':''}"><i>${done?'✓':''}</i><span>${txt}</span></div>`;
  const ch1=[m(gvState.scene.length>=scenes.length,`Ghé đủ ${scenes.length} trạm ở “Khám phá thực cảnh” (${gvState.scene.length}/${scenes.length})`),
             m(gvState.fp.length>=nowFp.length,`Đứng ở ${nowFp.length} trạm “Góc nhìn thứ nhất 3D” hiện trạng (${gvState.fp.length}/${nowFp.length})`)];
  const ch2=plants.map(p=>{ const f=gvState.found.includes(p.id), q=gvState.quiz[p.id]&&gvState.quiz[p.id].done; return m(f&&q,`${quests.find(x=>x.plantId===p.id)?.title||p.name}${f&&!q?' · còn câu hỏi thẻ cây':''}`); });
  const tq=Object.entries(timeQuiz);
  const ch3=tq.map(([sid,t])=>m(gvState.time[t.id]&&gvState.time[t.id].done,`Mở trạm lưu trữ ${fpStations.find(x=>x.id===sid)?.date} trong 3D và trả lời câu đối chiếu`));
  const block=(t,list,doneN,tot)=>`<div class="jr-ch"><h4><span>${t}</span><span style="color:var(--muted);font-weight:400">${doneN}/${tot}</span></h4>${list.join('')}</div>`;
  const c1=(gvState.scene.length>=scenes.length?1:0)+(gvState.fp.length>=nowFp.length?1:0);
  const c2=plants.filter(p=>gvState.quiz[p.id]&&gvState.quiz[p.id].done).length;
  const c3=tq.filter(([,t])=>gvState.time[t.id]&&gvState.time[t.id].done).length;
  const ch4=faceCards.map(c=>m(gvFaceDone(c.id),gvFaceDone(c.id)?`Đã nhận mặt: ${c.name}`:'Ảnh cận chưa nhận mặt'));
  const c4=faceCards.filter(c=>gvFaceDone(c.id)).length;
  document.getElementById('jrChapters').innerHTML=block('Chương 1 · Bước vào vườn',ch1,c1,2)+block('Chương 2 · Tìm và biết cây',ch2,c2,plants.length)+block('Chương 3 · Vườn đổi theo thời gian',ch3,c3,tq.length)+block('Chương 4 · Nhận mặt cây',ch4,c4,faceCards.length);
  const fb=document.getElementById('faceBtn'); if(fb) fb.textContent=c4>=faceCards.length?'Nhận mặt cây: đã xong 9/9':`Nhận mặt cây (${c4}/${faceCards.length})`;
  const grid=document.getElementById('herbGrid');
  grid.innerHTML=plants.map(p=>{
    const open=gvState.quiz[p.id]&&gvState.quiz[p.id].done;
    return open?`<div class="herb-card"><strong>${p.name}</strong>${p.code}<br>${p.title}<span class="tag">${p.status} · ${Math.round(p.confidence*100)}%</span></div>`
               :`<div class="herb-card locked"><strong>?</strong>Chưa mở thẻ</div>`;
  }).join('');
  document.getElementById('herbCount').textContent=`${plants.filter(p=>gvState.quiz[p.id]&&gvState.quiz[p.id].done).length+faceCards.filter(c=>gvFaceDone(c.id)).length}/${plants.length+faceCards.length}`;
}
document.getElementById('jrReset').onclick=()=>{
  if(!confirm('Xoá tiến trình trên thiết bị này và chơi lại từ đầu?')) return;
  gvState.scene=[];gvState.fp=[];gvState.found=[];gvState.quiz={};gvState.time={};gvState.face={};gvState.score=0;gvState.done=false;gvState.intro=false;
  questProgress=new Set(); currentQuestId=quests[0].id; updateQuestUI(); gvSave(); gvRender(); gvToast('Đã xoá tiến trình, bắt đầu lại.');
};

function gvIntro(){
  if(gvState.intro) return;
  gvBody.innerHTML=`<h3>Nhật ký người giữ vườn</h3>
  <p style="color:#d9ebe1;line-height:1.5">Sáng nay bạn nhận chìa khoá khu vườn dược thảo của khoa. Bảng danh sách cây đã treo ở giàn, nhưng các nhãn còn chờ người kiểm lại. Bạn sẽ đi hết vườn, tìm đúng từng cây, mở thẻ cây và ghi lại vườn đã đổi thế nào so với mấy tháng trước.</p>
  <ol style="color:var(--muted);line-height:1.6;padding-left:20px;margin:8px 0">
    <li><strong>Ảnh thật:</strong> xem ${photos.length} khung hình thật của vườn, ảnh mới nhất xếp trước; bấm “Phóng to” để xem chi tiết.</li>
    <li><strong>Góc nhìn thứ nhất 3D:</strong> đứng giữa vườn, kéo để nhìn quanh, chụm để phóng to. Không có điểm sáng sẵn: đọc nhiệm vụ rồi tự chạm vào đúng cây; kẹt thì bấm “Gợi ý”.</li>
    <li><strong>Khám phá ${scenes.length} trạm:</strong> cùng cách chơi trên ảnh thật của từng trạm. Mở trạm lưu trữ trong 3D để so sánh với bố cục cũ.</li>
  </ol>
  <p class="fb">Điểm và thẻ cây lưu trên thiết bị này. Tên cây là định danh tạm, chờ danh mục chính thức.</p>
  <div class="row"><button class="primary" id="gvStart">Bắt đầu</button></div>`;
  gvBody.querySelector('#gvStart').onclick=()=>{ gvState.intro=true; gvSave(); gvDlg.close(); };
  gvDlg.addEventListener('close',()=>{ if(!gvState.intro){ gvState.intro=true; gvSave(); } },{once:true});
  if(!gvDlg.open) gvDlg.showModal();
}

/* Danh mục bảng cây: AI đọc từ ảnh bảng "Danh sách cây vườn Gia Viên" (ảnh 12/09). null = chưa đọc rõ. */
const boardList={1:['Bạc hà','Mentha sp.'],2:['Bách bộ','Stemona tuberosa'],3:['Bạch đồng nữ',''],4:['Bạch hoa xà thiệt thảo','Hedyotis diffusa'],5:['Bán hạ nam','Typhonium trilobatum'],6:['Bổ chính sâm (sâm bố chính)','Abelmoschus sagittifolius'],7:['Bồ công anh',''],8:['Cà gai leo','Solanum procumbens'],9:['Cam thảo đất','Scoparia dulcis'],10:['Cây ổi','Psidium guajava'],11:['Cỏ mần trầu','Eleusine indica'],12:['Cỏ nhọ nồi','Eclipta prostrata'],13:['Cỏ sữa lá nhỏ','Euphorbia thymifolia'],14:['Cỏ tranh','Imperata cylindrica'],15:['Cỏ xước','Achyranthes aspera'],16:['Cối xay','Abutilon indicum'],17:null,18:['Cúc hoa',''],19:['Cúc tần','Pluchea indica'],20:['Dành dành','Gardenia jasminoides'],21:['Dâu tằm','Morus alba'],22:['Diệp hạ châu','Phyllanthus urinaria'],23:['Dừa cạn','Catharanthus roseus'],24:['Địa hoàng','Rehmannia glutinosa'],25:['Địa liền',''],26:['Đinh lăng','Polyscias fruticosa'],27:['Đơn lá đỏ',''],28:['Gai',''],29:['Gừng','Zingiber officinale'],30:['Hạ khô thảo',''],31:['Hoắc hương','Pogostemon cablin'],32:['Húng chanh','Plectranthus amboinicus'],33:['Huyết dụ','Cordyline fruticosa'],34:['Hương nhu tía','Ocimum tenuiflorum'],35:['Hy thiêm','Siegesbeckia orientalis'],62:['Sim','Rhodomyrtus tomentosa'],70:['Ý dĩ','Coix lacryma-jobi']};
const boardPartial={57:'I…',58:'P…',59:'S…',60:'S…',61:'Sắ… (có thể là Sắn dây)',63:'Thi…',67:'Xạ c…',68:'Xích…',69:'Xuyên…'};
function gvOpenCatalog(){
  let rows='',read=0;
  for(let n=1;n<=70;n++){
    const b=boardList[n];
    if(b){read++;rows+=`<tr><td>${n}</td><td><strong>${b[0]}</strong>${b[1]?`<br><em style="color:var(--muted)">${b[1]}</em>`:''}</td></tr>`;}
    else if(boardPartial[n]) rows+=`<tr><td>${n}</td><td style="color:var(--muted)">${boardPartial[n]} <span style="font-size:12px">(đọc dở)</span></td></tr>`;
    else rows+=`<tr><td>${n}</td><td style="color:var(--muted)">— chưa đọc được —</td></tr>`;
  }
  gvBody.innerHTML=`<h3>Danh mục bảng cây vườn</h3>
  <p class="fb" style="margin:0 0 8px">AI đọc từ ảnh bảng ngày 12/09: đọc rõ ${read}/70 mục (số 1–35 gần đủ, 36–52 bị che, 53–70 mới thấy phần đầu tên). Tên khoa học chỉ ghi khi chắc; cần đối chiếu danh mục chính thức. Danh mục này chỉ để tra tên, không thay cho hướng dẫn sử dụng dược liệu.</p>
  <div style="max-height:46vh;overflow:auto;border:1px solid rgba(255,255,255,.12);border-radius:10px"><table style="width:100%;border-collapse:collapse;font-size:14px"><tbody>${rows}</tbody></table></div>
  <div class="row"><button class="primary" id="gvCatClose">Đóng</button></div>`;
  gvBody.querySelector('#gvCatClose').onclick=()=>gvDlg.close();
  if(!gvDlg.open) gvDlg.showModal();
}
document.getElementById('catBtn').onclick=gvOpenCatalog;
document.getElementById('faceBtn').onclick=gvFaceNext;

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id==='pane-'+t.dataset.tab));
});
gvLoad();
questProgress=new Set(gvState.found.map(pid=>quests.find(q=>q.plantId===pid)?.id).filter(Boolean));
currentQuestId=(quests.find(q=>!questProgress.has(q.id))||quests[0]).id;

renderPhotoMode();
renderPlantList();
renderSelectedPlant();
updateQuestUI();
gvRender();
setTimeout(gvIntro,400);
(function(){
  let m='photo',st=null;
  try{
    const sp=new URLSearchParams(location.search), q=sp.get('mode')||location.hash.replace('#','');
    if(['fp','3d'].includes(q)) m='fp'; else if(q==='sim') m='sim';
    const s=sp.get('st'); // ?st=<mã trạm 3D> mở thẳng trạm đó
    if(s&&fpStations.some(x=>x.id===s)){ st=s; m='fp'; }
  }catch(e){}
  setMode(m,{station:st});
  if(m!=='photo'){ try{ document.querySelector('.stage').scrollIntoView({block:'start'}); }catch(e){} }
})();
</script>
