name: Game Hub CI

on:
  push:
    branches: [main, g2/game-hub-shell, g3/game-hub-intro-ux]
  pull_request:
    branches: [main, g2/game-hub-shell]

permissions:
  contents: read

concurrency:
  group: game-hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Build baseline dist from approved 2a-2c merge
        run: |
          git worktree add --detach /tmp/step2a3-base 6ffe6dd225c31ff0e07ae9e91db04c9aa7e8e58f
          cd /tmp/step2a3-base
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          find dist -type f ! -path 'dist/can-lam-sang/*' -printf '%P\\n' | sort > /tmp/dist-before-files
          (cd dist && find . -type f ! -path './can-lam-sang/*' -print0 | sort -z | xargs -0 sha256sum) > /tmp/dist-before-sha
      - run: npm run build
      - name: Verify existing dist files and hashes are unchanged
        run: |
          find dist -type f ! -path 'dist/can-lam-sang/*' -printf '%P\\n' | sort > /tmp/dist-after-files
          (cd dist && find . -type f ! -path './can-lam-sang/*' -print0 | sort -z | xargs -0 sha256sum) > /tmp/dist-after-sha
          diff -u /tmp/dist-before-files /tmp/dist-after-files
          diff -u /tmp/dist-before-sha /tmp/dist-after-sha
          echo 'Existing dist file list/hash comparison: PASS'
          cat /tmp/dist-before-sha
      - name: Verify Step 2a-3 bundled CBC runtime
        run: node scripts/verify-can-lam-sang-dist.mjs
      - name: Verify production entry assets
        run: test -s dist/src/styles.css && test -s dist/assets/app.js
      - name: Ensure runtime does not include server keys
        run: '! grep -R -E "service_role|SUPABASE_SECRET|sb_secret_" dist'
      - uses: actions/upload-artifact@v4
        with:
          name: game-hub-static-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
