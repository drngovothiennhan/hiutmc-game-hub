name: Game Hub CI

on:
  push:
    branches: [main, g2/game-hub-shell, g3/game-hub-intro-ux, g5/admin-y-quan-practice]
  pull_request:
    branches: [main, g2/game-hub-shell]

permissions:
  contents: read

concurrency:
  group: game-hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Test Y Quan admin preview guards
        run: node --test tests/y-quan-practice.test.mjs
      - run: npm run build
      - name: Verify Y Quan static module dependencies are packaged
        run: node -e "for (const path of ['dist/y-quan-practice/index.html', 'dist/src/styles.css', 'dist/src/auth/roles.js', 'dist/src/games/y-quan-practice/case.js', 'dist/src/games/y-quan-practice/domain.js']) { require('node:fs').accessSync(path); }"
      - name: Ensure runtime does not include server keys
        run: '! grep -R -E "service_role|SUPABASE_SECRET|sb_secret_" dist'
      - uses: actions/upload-artifact@v4
        with:
          name: game-hub-static-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
