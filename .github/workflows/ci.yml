name: Game Hub CI

on:
  push:
    branches: [main, g2/game-hub-shell]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: game-hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Ensure runtime does not include server keys
        run: '! grep -R -E "service_role|SUPABASE_SECRET|sb_secret_" dist'
      - uses: actions/upload-artifact@v4
        with:
          name: game-hub-static-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
