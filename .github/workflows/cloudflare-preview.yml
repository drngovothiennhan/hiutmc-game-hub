name: Cloudflare Pages Preview

on:
  push:
    branches: [g2/game-hub-shell, g3/game-hub-intro-ux]
  pull_request:
    branches: [g2/game-hub-shell]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: hiutmc-game-hub
      CF_PAGES_BRANCH: game-hub-intro-ux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add repository Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Secret values are never printed."
            exit 1
          fi
          echo "Cloudflare Pages credentials are available."
      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          if create_output="$(npx --yes wrangler@4 pages project create "$CF_PAGES_PROJECT" --production-branch main 2>&1)"; then
            printf '%s\n' "$create_output"
            echo "Created Cloudflare Pages project."
          elif [[ "$create_output" == *"A project with this name already exists"* ]]; then
            echo "Cloudflare Pages project already exists; continuing with the existing project."
          else
            printf '%s\n' "$create_output"
            exit 1
          fi
      - name: Deploy G3 intro UX to a Cloudflare Pages preview
        run: npx --yes wrangler@4 pages deploy dist --project-name="$CF_PAGES_PROJECT" --branch="$CF_PAGES_BRANCH" --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA} Game Hub intro UX preview"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Responsive Cloudflare preview smoke
        env:
          PREVIEW_URL: https://game-hub-intro-ux.hiutmc-game-hub.pages.dev
        run: |
          mkdir -p qa-game-hub
          node --input-type=module <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          for (const [width, height] of [[320, 740], [390, 844], [711, 1000], [768, 1024], [1024, 900]]) {
            const page = await browser.newPage({ viewport: { width, height } });
            await page.goto(process.env.PREVIEW_URL, { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.getByRole("heading", { name: "BẢN ĐỒ HỌC THUẬT", level: 1 }).waitFor({ state: "visible", timeout: 15000 });
            const checks = await page.evaluate(() => {
              const title = document.querySelector(".world-intro h1");
              const intro = document.querySelector(".world-intro p:not(.eyebrow)");
              const map = document.querySelector(".place-grid");
              return {
                viewport: document.documentElement.clientWidth,
                pageWidth: document.documentElement.scrollWidth,
                titleWidth: title?.clientWidth,
                titleScrollWidth: title?.scrollWidth,
                introWidth: intro?.clientWidth,
                introScrollWidth: intro?.scrollWidth,
                columns: getComputedStyle(map).gridTemplateColumns,
                studyOsLabels: [...document.querySelectorAll(".tag-live")].map(node => node.textContent.trim()),
                gardenLocked: Boolean(document.querySelector('[data-place-id="garden-continuation"] .place-action-disabled')) && !document.querySelector('[data-place-id="garden-continuation"] a[href="#/garden-continuation"]'),
              };
            });
            if (checks.pageWidth > checks.viewport + 1 || checks.titleScrollWidth > checks.titleWidth + 1 || checks.introScrollWidth > checks.introWidth + 1) {
              throw new Error(`Game Hub content clips at ${width}px: ${JSON.stringify(checks)}`);
            }
            if (!checks.gardenLocked) {
              throw new Error(`Game Hub Garden must stay locked without a verified receipt.`);
            }
            if (!checks.studyOsLabels.every(label => label === "Study OS · hiện tại")) {
              throw new Error(`Legacy runtime labels are inaccurate: ${JSON.stringify(checks.studyOsLabels)}`);
            }
            await page.screenshot({ path: `qa-game-hub/home-${width}.png`, fullPage: true });
            await page.close();
          }
          await browser.close();
          EOF
      - name: Upload gated responsive preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: game-hub-garden-responsive-preview
          path: qa-game-hub
          if-no-files-found: error
          retention-days: 7
