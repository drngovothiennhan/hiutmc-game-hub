name: Cloudflare Pages Preview

on:
  push:
    branches: [g2/game-hub-shell, g3/game-hub-intro-ux]
  pull_request:
    branches: [main, g2/game-hub-shell]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: hiutmc-game-hub
      CF_PAGES_BRANCH: game-hub-intro-ux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add repository Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Secret values are never printed."
            exit 1
          fi
          echo "Cloudflare Pages credentials are available."
      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          if create_output="$(npx --yes wrangler@4 pages project create "$CF_PAGES_PROJECT" --production-branch main 2>&1)"; then
            printf '%s\n' "$create_output"
            echo "Created Cloudflare Pages project."
          elif [[ "$create_output" == *"A project with this name already exists"* ]]; then
            echo "Cloudflare Pages project already exists; continuing with the existing project."
          else
            printf '%s\n' "$create_output"
            exit 1
          fi
      - name: Deploy Garden runtime and record immutable preview URL
        id: deploy
        shell: bash
        run: |
          if ! deployment_output="$(npx --yes wrangler@4 pages deploy dist --project-name="$CF_PAGES_PROJECT" --branch="$CF_PAGES_BRANCH" --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA} Gia Vien Garden preview" 2>&1)"; then
            echo "::error::Cloudflare Pages deployment failed; command output is suppressed to protect environment data."
            exit 1
          fi
          preview_url="$(printf '%s\n' "$deployment_output" | grep -Eo 'https://[[:xdigit:]]{8}\.hiutmc-game-hub\.pages\.dev' | tail -n 1 || true)"
          if [[ -z "$preview_url" ]]; then
            preview_url="https://game-hub-intro-ux.hiutmc-game-hub.pages.dev"
            echo "::warning::Cloudflare did not return a commit-specific URL; using the branch preview for smoke only."
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          printf 'Preview URL: %s\n' "$preview_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare Pages preview is available."
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Responsive Cloudflare preview smoke
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          mkdir -p qa-game-hub
          node --input-type=module <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          for (const [width, height] of [[320, 740], [390, 844], [711, 1000], [768, 1024], [1024, 900]]) {
            const page = await browser.newPage({ viewport: { width, height } });
            await page.goto(process.env.PREVIEW_URL, { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.getByRole("heading", { name: "Đăng nhập để tiếp tục", level: 1 }).waitFor({ state: "visible", timeout: 15000 });
            const checks = await page.evaluate(() => {
              const title = document.querySelector("h1");
              const loginLink = document.querySelector('a[href*="open=game-hub"]');
              return {
                viewport: document.documentElement.clientWidth,
                pageWidth: document.documentElement.scrollWidth,
                titleWidth: title?.clientWidth,
                titleScrollWidth: title?.scrollWidth,
                loginHeading: title?.textContent.trim(),
                loginLink: Boolean(loginLink),
                gameMapVisible: Boolean(document.querySelector('[data-place-id="clinic"]')),
              };
            });
            if (checks.pageWidth > checks.viewport + 1 || checks.titleScrollWidth > checks.titleWidth + 1) {
              throw new Error(`Login gate clips at ${width}px: ${JSON.stringify(checks)}`);
            }
            if (checks.loginHeading !== "Đăng nhập để tiếp tục" || !checks.loginLink || checks.gameMapVisible) {
              throw new Error(`Unexpected guest access state at ${width}px: ${JSON.stringify(checks)}`);
            }
            await page.screenshot({ path: `qa-game-hub/login-gate-${width}.png`, fullPage: true });
            await page.close();
          }
          await browser.close();
          EOF
      - name: Step 2a-3 CBC browser smoke with mocked RPC
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          mkdir -p qa-game-hub/cbc
          node --input-type=module <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          const errors = [];
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          page.on("console", msg => { if (msg.type() === "error") errors.push(msg.text()); });
          page.on("pageerror", error => errors.push(error.message));
          await page.addInitScript(() => {
            localStorage.setItem("hiutmc-member-session-v1", JSON.stringify({
              accessToken: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
              refreshToken: "refresh-fixture",
              expiresAt: Date.now() + 3600000,
              member: { id: "fixture-member" }
            }));
          });
          let flagEnabled = false;
          await page.route("**/*", async route => {
            const request = route.request();
            const url = request.url();
            if (url.includes("/auth/v1/user")) {
              return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({
                id: "fixture-user", app_metadata: { member_id: "fixture-member" }
              }) });
            }
            if (url.includes("garden_hub_current_member_role_v1")) {
              return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify([{ role: "member" }]) });
            }
            if (url.includes("cls_flag_status_v1")) {
              return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ ok: true, data: { enabled: flagEnabled } }) });
            }
            if (url.includes("cls_cbc_start_v1")) {
              const values = Object.fromEntries(["Hb","RBC","Hct","MCV","MCH","MCHC","WBC","PLT","neut","lymph","mono","eos","baso"].map((key,index)=>[key,{ value: index + 1, unit: "%" }]));
              return route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ ok: true, data: {
                attempt_id: "fixture-attempt", level: "co_ban", public_scenario: { scenario_id: "fixture", sex: "nam", values }
              } }) });
            }
            if (url.includes("cls_cbc_get_v1")) {
              return route.fulfill({ status: 404, contentType: "application/json", body: JSON.stringify({ ok: false, code: "khong_tim_thay", data: null }) });
            }
            return route.continue();
          });
          const consoleBefore = errors.length;
          await page.goto(process.env.PREVIEW_URL + "/can-lam-sang/", { waitUntil: "networkidle", timeout: 60000 });
          await page.screenshot({ path: "qa-game-hub/cbc/flag-off.png", fullPage: true });
          const offText = await page.locator("#app").innerText();
          if (!offText.includes("Phòng Cận Lâm Sàng hiện chưa mở")) throw new Error("Flag-off gate was not shown");
          flagEnabled = true;
          await page.reload({ waitUntil: "networkidle", timeout: 60000 });
          await page.locator("table tbody tr").nth(12).waitFor({ state: "visible", timeout: 15000 });
          const rows = await page.locator("table tbody tr").count();
          if (rows !== 13) throw new Error("Expected 13 CBC rows, got " + rows);
          await page.screenshot({ path: "qa-game-hub/cbc/flag-on-13-indices.png", fullPage: true });
          if (errors.length !== consoleBefore) throw new Error("Browser console errors: " + errors.join(" | "));
          console.log(JSON.stringify({ flagOff: offText, cbcRows: rows, consoleErrors: errors }));
          await browser.close();
          EOF
      - name: Upload gated responsive preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: game-hub-garden-responsive-preview
          path: qa-game-hub
          if-no-files-found: error
          retention-days: 7
