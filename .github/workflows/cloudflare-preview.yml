name: Cloudflare Pages Preview

on:
  push:
    branches: [g2/game-hub-shell]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: hiutmc-game-hub
      CF_PAGES_BRANCH: game-hub-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add repository Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Secret values are never printed."
            exit 1
          fi
          echo "Cloudflare Pages credentials are available."
      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          projects="$(npx --yes wrangler@4 pages project list --json)"
          if printf '%s' "$projects" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              try {
                const parsed = JSON.parse(input);
                const projects = Array.isArray(parsed) ? parsed : (parsed.result || parsed.projects || []);
                process.exit(projects.some(project => project.name === process.env.CF_PAGES_PROJECT) ? 0 : 1);
              } catch { process.exit(2); }
            });
          '; then
            echo "Cloudflare Pages project already exists."
          else
            npx --yes wrangler@4 pages project create "$CF_PAGES_PROJECT" --production-branch main
          fi
      - name: Deploy G2 branch as a Cloudflare Pages preview
        run: npx --yes wrangler@4 pages deploy dist --project-name="$CF_PAGES_PROJECT" --branch="$CF_PAGES_BRANCH" --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA} Game Hub shell preview"
