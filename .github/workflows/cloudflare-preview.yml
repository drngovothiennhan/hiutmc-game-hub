name: Cloudflare Pages Preview

on:
  push:
    branches: [g2/game-hub-shell]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: hiutmc-game-hub
      CF_PAGES_BRANCH: game-hub-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add repository Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Secret values are never printed."
            exit 1
          fi
          echo "Cloudflare Pages credentials are available."
      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          if create_output="$(npx --yes wrangler@4 pages project create "$CF_PAGES_PROJECT" --production-branch main 2>&1)"; then
            printf '%s\n' "$create_output"
            echo "Created Cloudflare Pages project."
          elif [[ "$create_output" == *"A project with this name already exists"* ]]; then
            echo "Cloudflare Pages project already exists; continuing with the existing project."
          else
            printf '%s\n' "$create_output"
            exit 1
          fi
      - name: Deploy G2 branch as a Cloudflare Pages preview
        run: npx --yes wrangler@4 pages deploy dist --project-name="$CF_PAGES_PROJECT" --branch="$CF_PAGES_BRANCH" --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA} Game Hub shell preview"
