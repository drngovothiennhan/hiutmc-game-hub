name: Cloudflare Pages Preview

on:
  push:
    branches: [g2/game-hub-shell, g3/game-hub-intro-ux, g5/admin-y-quan-practice]
  pull_request:
    branches: [g2/game-hub-shell]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: hiutmc-game-hub
      GAME_HUB_ADMIN_PREVIEW: "true"
      CF_PAGES_BRANCH: ${{ github.ref_name == 'g5/admin-y-quan-practice' && 'admin-y-quan-practice' || 'game-hub-intro-ux' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Test Y Quan admin preview guards
        run: node --test tests/y-quan-practice.test.mjs
      - run: npm run build
      - name: Verify Y Quan static module dependencies are packaged
        run: node -e "for (const path of ['dist/y-quan-practice/index.html', 'dist/src/styles.css', 'dist/src/auth/roles.js', 'dist/src/games/y-quan-practice/case.js', 'dist/src/games/y-quan-practice/domain.js']) { require('node:fs').accessSync(path); }"
      - name: Ensure Cloudflare Pages credentials are configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add repository Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Secret values are never printed."
            exit 1
          fi
          echo "Cloudflare Pages credentials are available."
      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          if create_output="$(npx --yes wrangler@4 pages project create "$CF_PAGES_PROJECT" --production-branch main 2>&1)"; then
            printf '%s\n' "$create_output"
            echo "Created Cloudflare Pages project."
          elif [[ "$create_output" == *"A project with this name already exists"* ]]; then
            echo "Cloudflare Pages project already exists; continuing with the existing project."
          else
            printf '%s\n' "$create_output"
            exit 1
          fi
      - name: Deploy isolated preview and record immutable URL
        id: deploy
        shell: bash
        run: |
          if ! deployment_output="$(npx --yes wrangler@4 pages deploy dist --project-name="$CF_PAGES_PROJECT" --branch="$CF_PAGES_BRANCH" --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA} admin-only Y Quan preview" 2>&1)"; then
            echo "::error::Cloudflare Pages deployment failed; command output is suppressed to protect environment data."
            exit 1
          fi
          preview_url="$(printf '%s\n' "$deployment_output" | grep -Eo 'https://[[:xdigit:]]{8}\.hiutmc-game-hub\.pages\.dev' | tail -n 1 || true)"
          branch_preview_url="https://${CF_PAGES_BRANCH}.hiutmc-game-hub.pages.dev"
          if [[ -z "$preview_url" ]]; then
            preview_url="$branch_preview_url"
            echo "::warning::Cloudflare did not return a commit-specific URL; using the isolated branch preview for smoke only."
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          printf 'Immutable preview URL: %s\nBranch preview URL: %s\n' "$preview_url" "$branch_preview_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare Pages preview is available."
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Responsive Game Hub preview smoke
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          mkdir -p qa-game-hub
          node --input-type=module <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          for (const [width, height] of [[320, 740], [390, 844], [711, 1000], [768, 1024], [1024, 900]]) {
            const page = await browser.newPage({ viewport: { width, height } });
            await page.goto(process.env.PREVIEW_URL, { waitUntil: "domcontentloaded", timeout: 60000 });
            await page.getByRole("heading", { name: "BẢN ĐỒ HỌC THUẬT", level: 1 }).waitFor({ state: "visible", timeout: 15000 });
            const checks = await page.evaluate(() => {
              const title = document.querySelector(".world-intro h1");
              const intro = document.querySelector(".world-intro p:not(.eyebrow)");
              const map = document.querySelector(".place-grid");
              return {
                viewport: document.documentElement.clientWidth,
                pageWidth: document.documentElement.scrollWidth,
                shellDisplay: getComputedStyle(document.querySelector(".app-shell")).display,
                titleWidth: title?.clientWidth,
                titleScrollWidth: title?.scrollWidth,
                introWidth: intro?.clientWidth,
                introScrollWidth: intro?.scrollWidth,
                columns: getComputedStyle(map).gridTemplateColumns,
                studyOsLabels: [...document.querySelectorAll(".tag-live")].map(node => node.textContent.trim()),
                adminTileHiddenForAnonymous: !document.querySelector('[data-place-id="y-quan-admin-preview"]'),
                gardenLocked: Boolean(document.querySelector('[data-place-id="garden-continuation"] .place-action-disabled')) && !document.querySelector('[data-place-id="garden-continuation"] a[href="#/garden-continuation"]'),
              };
            });
            if (checks.shellDisplay !== "flex") throw new Error(`Game Hub shell CSS did not load at ${width}px: ${JSON.stringify(checks)}`);
            if (checks.pageWidth > checks.viewport + 1 || checks.titleScrollWidth > checks.titleWidth + 1 || checks.introScrollWidth > checks.introWidth + 1) throw new Error(`Game Hub content clips at ${width}px: ${JSON.stringify(checks)}`);
            if (!checks.gardenLocked) throw new Error(`Game Hub Garden must stay locked without a verified receipt.`);
            if (!checks.adminTileHiddenForAnonymous) throw new Error(`The admin preview tile leaked to an anonymous user.`);
            if (!checks.studyOsLabels.every(label => label === "Study OS · hiện tại")) throw new Error(`Legacy runtime labels are inaccurate: ${JSON.stringify(checks.studyOsLabels)}`);
            await page.screenshot({ path: `qa-game-hub/home-${width}.png`, fullPage: true });
            await page.close();
          }
          await browser.close();
          EOF
      - name: Verify admin preview gating and deterministic patient answers
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          const anonymous = await browser.newPage();
          await anonymous.goto(`${process.env.PREVIEW_URL}/y-quan-practice/`, { waitUntil: "domcontentloaded" });
          await anonymous.getByRole("heading", { name: "Đăng nhập Admin" }).waitFor({ timeout: 15000 });
          await anonymous.getByLabel("Email HIU TMC").waitFor();
          await anonymous.getByLabel("Mật khẩu").waitFor();
          const admin = anonymous;
          const writes = [];
          admin.on("request", request => {
            const url = request.url();
            const expectedPasswordGrant = url.includes("/auth/v1/token?grant_type=password");
            if (request.method() !== "GET" && url.includes("supabase.co") && !expectedPasswordGrant) writes.push(url);
          });
          await admin.route(url => url.href.includes("/auth/v1/token") && url.searchParams.get("grant_type") === "password", route => route.fulfill({
            status: 200, contentType: "application/json",
            body: JSON.stringify({ access_token: "preview-token", refresh_token: "preview-refresh", expires_in: 3600, expires_at: Math.floor(Date.now() / 1000) + 3600 })
          }));
          await admin.route("https://gzmpnsrwqjpsbklyflqr.supabase.co/auth/v1/user", route => route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ id: "preview-auth-user", app_metadata: { member_id: "synthetic-admin-preview", role: "admin" } }) }));
          await admin.getByLabel("Email HIU TMC").fill("admin@example.com");
          await admin.getByLabel("Mật khẩu").fill("preview-test-password");
          await admin.getByRole("button", { name: /ĐĂNG NHẬP ADMIN/ }).click();
          await admin.getByRole("button", { name: /BẮT ĐẦU CA MÔ PHỎNG/ }).waitFor({ timeout: 15000 });
          await admin.getByText("ADMIN ĐÃ XÁC MINH").waitFor({ timeout: 15000 });
          await admin.getByRole("button", { name: /BẮT ĐẦU CA MÔ PHỎNG/ }).waitFor({ timeout: 15000 });
          await admin.getByRole("button", { name: /BẮT ĐẦU CA MÔ PHỎNG/ }).click();
          await admin.getByRole("button", { name: /VÀO PHÒNG KHÁM/ }).click();
          await admin.getByRole("button", { name: /Cơ thể thường thấy nóng hay lạnh/ }).click();
          await admin.getByText("Hay sợ lạnh, thích ấm.").waitFor();
          await admin.locator('input[name="question"]').fill("Hãy kê thuốc gì?");
          await admin.getByRole("button", { name: "Gửi" }).click();
          await admin.getByText("Thông tin này chưa có trong ca mô phỏng.").waitFor();
          if (writes.length) throw new Error(`Preview attempted a Supabase write: ${writes.join(", ")}`);
          await admin.screenshot({ path: "qa-game-hub/y-quan-admin-preview.png", fullPage: true });
          await browser.close();
          EOF
      - name: Upload gated preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: game-hub-y-quan-responsive-preview
          path: qa-game-hub
          if-no-files-found: error
          retention-days: 7
