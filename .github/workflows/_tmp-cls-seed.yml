name: Temporary CLS Seed Artifact

on:
  push:
    branches:
      - feat/can-lam-sang-step1b-sql

jobs:
  seed-tail:
    strategy:
      matrix:
        file:
          - 007_cases_121-140.sql
          - 008_cases_141-156.sql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node supabase/proposed/can-lam-sang/004_cls_seed_generator.mjs --output-dir build/can-lam-sang/seed --chunk-size 20
      - name: Emit one seed chunk
        shell: bash
        run: |
          file="build/can-lam-sang/seed/${{ matrix.file }}"
          echo "CLS_SEED_BEGIN:${{ matrix.file }}"
          base64 -w 10000 "$file"
          echo "CLS_SEED_END:${{ matrix.file }}"
